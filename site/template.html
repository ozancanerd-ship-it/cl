      ? 'über dem 22-Tage-Tief' : 'unter dem 22-Tage-Hoch'}): eine Versicherung gegen den Absturz, kein Renditebringer. Gemessen
      (Studie 27.09.) hat er die schlimmsten Verläufe bei Coins etwa halbiert, in
      Aufwärtsphasen aber Rendite gekostet. Er wird nur nachgezogen, nie gelockert. Nach
      einem Stop kommt der Wert auf die Wiedereinstiegs-Liste.</p>`);
  }
  if (!teile.length) return '';
  const key = posSchluessel(b.pos);
  return `<details class="mehr" data-mehr="${esc(key)}"${MEHR_OFFEN.has(key)?' open':''}>
    <summary>Mehr zur Analyse</summary>${teile.join('')}</details>`;
}

/* ══════════════════════════════════════════════════════════════════════════════════
   GLEICHLAUF — wie viele Wetten ein Depot wirklich ist

   Das Depot zeigte bisher "Konzentration: grösste Position 14 %" und sah damit breit
   aus. Es besteht aus zehn Altcoins, zwei US-Tech-Aktien und drei Turbos auf US-Tech.
   Das sind keine vierzehn Wetten, das sind zwei — und eine davon läuft gehebelt.

   Die Grundlage ist keine Behauptung ("Krypto läuft halt zusammen"), sondern die
   gemessene Korrelation der Tagesrenditen der letzten 90 Handelstage. Der Scan schickt
   dafür je Instrument eine standardisierte Renditereihe mit, ein Byte je Tag. Die
   Korrelation ist hier unten ein Skalarprodukt — jedes Paar, jederzeit, auch gegen eine
   Chance, die noch gar nicht im Depot ist.
   ══════════════════════════════════════════════════════════════════════════════════ */

// Ab hier gilt zwei Werte als dieselbe Wette. 0,5 über 90 Tage ist kein Zufall mehr;
// darunter beginnt der Bereich, in dem zwei Werte manchmal zusammenlaufen und manchmal
// nicht — und den als "ein Bündel" zu verkaufen wäre schon wieder eine Behauptung.
const GL_SCHWELLE = 0.5;
// Ein normaler Tag ist eine Standardabweichung, ein schlechter das 95-%-Quantil.
const GL_SCHLECHT = 1.645;

let _glCache = null, _glStand = null;

function glVektoren(){
  const g = S && S.gleichlauf;
  if (!g || !g.z) return null;
  const stand = `${g.bis}:${g.tage}:${Object.keys(g.z).length}`;
  if (_glCache && _glStand === stand) return _glCache;
  const mitte = (g.mitte != null) ? g.mitte : 128;
  const raus = new Map();
  for (const name in g.z){
    let roh;
    try { roh = atob(g.z[name]); } catch(e){ continue; }
    const n = roh.length;
    if (n < 30) continue;
    const v = new Float64Array(n);
    let summe = 0;
    for (let i=0;i<n;i++){ v[i] = roh.charCodeAt(i) - mitte; summe += v[i]; }
    const m = summe/n;
    let q = 0;
    for (let i=0;i<n;i++){ v[i] -= m; q += v[i]*v[i]; }
    const laenge = Math.sqrt(q);
    if (!(laenge > 0)) continue;
    for (let i=0;i<n;i++) v[i] /= laenge;
    raus.set(name, v);
  }
  _glCache = raus; _glStand = stand;
  return raus;
}

/* Korrelation zweier Instrumente, oder null, wenn für eines davon nichts gemessen
   wurde. null ist hier wichtig: es heisst "unbekannt", nicht "unabhängig". Wer das
   verwechselt, baut sich ein Depot schön. */
function glKorr(a, b){
  if (!a || !b) return null;
  if (a === b) return 1;
  const v = glVektoren(); if (!v) return null;
  const x = v.get(a), y = v.get(b);
  if (!x || !y || x.length !== y.length) return null;
  let s = 0;
  for (let i=0;i<x.length;i++) s += x[i]*y[i];
  return Math.max(-1, Math.min(1, s));
}

// Tagesschwankung in Prozent, wie gemessen.
function glVola(name){
  const g = S && S.gleichlauf;
  const v = g && g.sd ? g.sd[name] : null;
  return (v != null && isFinite(v)) ? v : null;
}

/* Unter welchem Namen ein Depotposten in der Messung steht. Ein Turbo bewegt sich mit
   seinem Basiswert, nicht mit sich selbst — für den Gleichlauf zählt der Basiswert. */
function glNameFuer(b){
  if (b.hebel && b.hebel.basisSym){
    const br = scanRow(b.hebel.basisSym);
    if (br) return br.instrument;
  }
  if (b.row) return b.row.instrument;
  const r = scanRow(b.pos.sym);
  return r ? r.instrument : null;
}

/* Bargeld ist keine Position ohne Messreihe, sondern eine Position ohne Risiko.
   Der Unterschied gehoert benannt: USDC unter "dafuer fehlen uns Daten" einzusortieren
   sieht aus wie eine Luecke, ist aber genau der Teil des Depots, der absichtlich nichts
   tut. Cash zaehlt beim eigenen Geld mit und beim bewegten Markt nicht. */
const BAR = /^(USDC|USDT|USD|EUR|BUSD|DAI|FDUSD|TUSD|EURC)$/i;
function istBar(pos){
  if (!pos) return false;
  if (BAR.test(String(pos.sym||'').trim())) return true;
  return /\bcash\b|bargeld|guthaben/i.test(String(pos.konto||''));
}

/* Was eine Position am Markt bewegt, und was sie an eigenem Geld bindet.

   Der Unterschied ist bei Ozans Depot kein Detail. Ein Turbo für 63 € mit Hebel 9
   bewegt 567 € Marktwert. Eine Margin-Position steht schon mit ihrem vollen
   Nominalwert im Depot, ihr eigenes Geld ist aber nur ein Fünftel davon. Wer beides
   gleichsetzt, unterschätzt entweder sein Risiko oder überschätzt sein Vermögen. */
function glGewicht(b, stand){
  const wertEU = stand ? stand.inEuro(b, b.wert) : null;
  if (wertEU == null) return null;
  const h = b.hebel;
  if (h && h.art === 'margin' && h.hebel > 1){
    // ``b.wert`` ist seit 07.10. schon das eigene Geld; der Nominalwert steht in ``b.nominal``.
    const nomEU = b.nominal != null ? stand.inEuro(b, b.nominal) : wertEU * h.hebel;
    return {markt: nomEU, kapital: wertEU, hebel: h.hebel, art: 'margin'};
  }
  if (h && !h.ausgeknockt && h.hebel > 1){
    return {markt: wertEU * h.hebel, kapital: wertEU, hebel: h.hebel, art: 'schein'};
  }
  return {markt: wertEU, kapital: wertEU, hebel: 1, art: 'direkt'};
}

/* Die eigentliche Rechnung. Agglomerativ mit mittlerer Verknüpfung: das nächste Paar
   zusammenlegen, solange die mittlere Korrelation zwischen zwei Gruppen über der
   Schwelle liegt. Bei zwanzig Positionen ist das in Mikrosekunden fertig. */
function glBuendel(bew, stand){
  const g = S && S.gleichlauf;
  if (!g || !glVektoren()) return null;

  const teile = [];
  let ohneMessung = 0, ohneMessungEU = 0, bar = 0;
  for (const b of bew){
    const gw = glGewicht(b, stand);
    if (!gw || !(gw.markt > 0)) continue;
    if (istBar(b.pos)){ bar += gw.kapital; continue; }
    const nm = glNameFuer(b);
    const vola = nm ? glVola(nm) : null;
    // Short zählt mit umgekehrtem Vorzeichen: eine Short-Position gegen eine Long-
    // Position im selben Wert ist keine doppelte Wette, sondern gar keine.
    const richtung = (b.hebel && b.hebel.lang === false) ? -1
                   : ((b.pos.hebel_richtung === 'short' || istKurzDirekt(b.pos)) ? -1 : 1);
    if (!nm || vola == null || !glVektoren().has(nm)){
      ohneMessung++; ohneMessungEU += gw.markt; continue;
    }
    teile.push({b, nm, vola, richtung, markt: gw.markt, kapital: gw.kapital,
                hebel: gw.hebel, art: gw.art});
  }
  if (teile.length < 2) return null;

  const n = teile.length;
  const K = [];
  for (let i=0;i<n;i++){
    K.push(new Float64Array(n));
    for (let j=0;j<n;j++){
      const r = (i===j) ? 1 : glKorr(teile[i].nm, teile[j].nm);
      // Richtung einrechnen: zwei Longs auf dasselbe sind +, Long gegen Short ist −.
      K[i][j] = (r == null ? 0 : r) * teile[i].richtung * teile[j].richtung;
    }
  }

  let gruppen = teile.map((_,i)=>[i]);
  for(;;){
    let besteA = -1, besteB = -1, bester = GL_SCHWELLE;
    for (let a=0;a<gruppen.length;a++){
      for (let b2=a+1;b2<gruppen.length;b2++){
        let s = 0;
        for (const i of gruppen[a]) for (const j of gruppen[b2]) s += K[i][j];
        const mittel = s / (gruppen[a].length * gruppen[b2].length);
        if (mittel > bester){ bester = mittel; besteA = a; besteB = b2; }
      }
    }
    if (besteA < 0) break;
    gruppen[besteA] = gruppen[besteA].concat(gruppen[besteB]);
    gruppen.splice(besteB, 1);
  }

  const marktGesamt = teile.reduce((s,t)=>s+t.markt, 0);
  const kapitalGesamt = teile.reduce((s,t)=>s+t.kapital, 0);

  const b_ = gruppen.map(idx => {
    const markt = idx.reduce((s,i)=>s+teile[i].markt, 0);
    let paare = 0, summe = 0;
    for (let x=0;x<idx.length;x++) for (let y=x+1;y<idx.length;y++){ summe += K[idx[x]][idx[y]]; paare++; }
    return {
      idx, markt, anteil: marktGesamt ? markt/marktGesamt*100 : 0,
      zusammenhalt: paare ? summe/paare : null,
      mitglieder: idx.map(i=>teile[i]).sort((a,b2)=>b2.markt-a.markt)
    };
  }).sort((a,b2)=>b2.markt-a.markt);

  // Effektive Anzahl Wetten: der Kehrwert der Summe der quadrierten Bündelanteile.
  // Vierzehn gleich grosse, unabhängige Positionen ergäben 14; vierzehn Positionen,
  // die alle dasselbe tun, ergeben 1.
  const hh = b_.reduce((s,x)=>s + Math.pow(x.anteil/100, 2), 0);
  const effektiv = hh > 0 ? 1/hh : null;

  /* Tagesrisiko in Euro. Nicht aus einer Faustregel, sondern aus denselben Zahlen:
     Gewichte, gemessene Schwankungsbreiten, gemessene Korrelationen. */
  let varianz = 0;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    varianz += teile[i].markt * teile[j].markt
             * (teile[i].vola/100) * (teile[j].vola/100) * K[i][j];
  }
  const tagesRisiko = varianz > 0 ? Math.sqrt(varianz) : null;

  return {
    teile, buendel: b_, effektiv, marktGesamt, kapitalGesamt, tagesRisiko, bar,
    hebelFaktor: kapitalGesamt ? marktGesamt/kapitalGesamt : 1,
    ohneMessung, ohneMessungEU,
    tage: g.tage, bis: g.bis
  };
}

/* Wie sehr eine neue Chance dasselbe ist, was schon im Depot liegt. Genau die Frage,
   die man sich vor dem Kauf stellen sollte und nie stellt. */
let _glDepot = null, _glDepotZeit = 0;
function glGegenDepot(instrument){
  if (!instrument) return null;
  /* Die Marktliste ruft das fuer jede der 206 Zeilen auf. Ohne diesen Zwischenspeicher
     wuerde das Depot 206-mal aus dem localStorage gelesen, geparst und neu bewertet —
     das kostet beim Zeichnen eine halbe Sekunde, jedes Mal. Eine Sekunde Haltbarkeit
     reicht fuer einen Zeichendurchgang und ist kurz genug, dass eine Aenderung am
     Depot sofort durchschlaegt. */
  const jetzt = Date.now();
  if (!_glDepot || jetzt - _glDepotZeit > 1000){
    try { _glDepot = depotStand(); } catch(e){ _glDepot = null; }
    _glDepotZeit = jetzt;
  }
  const stand = _glDepot;
  if (!stand || !stand.bew.length) return null;
  let beste = null;
  for (const b of stand.bew){
    if (istBar(b.pos)) continue;
    const nm = glNameFuer(b);
    if (!nm || nm === instrument) continue;
    const gw = glGewicht(b, stand);
    if (!gw || !(gw.markt > 0)) continue;
    const r = glKorr(instrument, nm);
    if (r == null) continue;
    if (!beste || r > beste.r) beste = {r, name: posName(b), markt: gw.markt};
  }
  return (beste && beste.r >= GL_SCHWELLE) ? beste : null;
}

/* In welchem Buendel eine einzelne Position liegt — und wie schwer dieses Buendel
   schon wiegt. Die Rechnung haengt am ``stand`` statt an einer globalen Variablen,
   damit sie je Zeichendurchgang genau einmal passiert. */
function glAnteilFuer(b, stand){
  if (!stand) return null;
  if (stand._gl === undefined){
    try { stand._gl = glBuendel(stand.bew, stand); } catch(e){ stand._gl = null; }
  }
  const a = stand._gl;
  if (!a) return null;
  const nm = glNameFuer(b);
  if (!nm) return null;
  for (const x of a.buendel){
    if (x.mitglieder.some(m => m.nm === nm)){
      return {anteil: x.anteil, anzahl: x.mitglieder.length, zusammenhalt: x.zusammenhalt,
              markt: x.markt, namen: x.mitglieder.map(m=>posName(m.b))};
    }
  }
  return null;
}

function glText(x){
  if (x >= 0.85) return 'praktisch derselbe Wert';
  if (x >= 0.7)  return 'läuft fast immer zusammen';
  if (x >= 0.5)  return 'läuft überwiegend zusammen';
  if (x >= 0.3)  return 'läuft oft zusammen';
  if (x > -0.3)  return 'läuft eigenständig';
  return 'läuft gegenläufig';
}

function glKasten(stand){
  const g = S && S.gleichlauf;
  if (!g) return `<div class="note-box"><span class="nt">Gleichlauf</span>
    <p>Der laufende Scan hat noch keine Messreihen mitgeschickt. Sobald der nächste
    volle Lauf durch ist, steht hier, aus wie vielen Wetten dein Depot wirklich
    besteht.</p></div>`;
  const a = glBuendel(stand.bew, stand);
  if (!a) return '';

  const proz = (x) => x.toFixed(0).replace('.',',');
  /* Ein Einzelwert mit 31 % unter der Ueberschrift "laeuft eigenstaendig" zu fuehren
     waere eine beruhigende Aussage ueber einen Klumpen. Wer allein ein Fuenftel des
     Depots bewegt, ist keine Streuung, sondern eine eigene Wette — und bekommt eine
     eigene Karte. */
  const EINZEL_GROSS = 20;
  const echte = a.buendel.filter(x=>x.mitglieder.length > 1);
  const gross = a.buendel.filter(x=>x.mitglieder.length === 1 && x.anteil >= EINZEL_GROSS);
  const eins  = a.buendel.filter(x=>x.mitglieder.length === 1 && x.anteil <  EINZEL_GROSS);

  let h = `<h2>Wie viele Wetten das wirklich ist</h2>
  <div class="status">
    <div><div class="k">Effektive Wetten</div>
      <div class="v ${a.effektiv < 2.5 ? 'aus' : a.effektiv < 4 ? 'mittel' : 'gut'}">${
        a.effektiv != null ? a.effektiv.toFixed(1).replace('.',',') : '—'}</div>
      <div class="n">aus ${a.teile.length} Positionen</div></div>
    <div><div class="k">Bewegter Markt</div>
      <div class="v">${num(a.marktGesamt,0)} €</div>
      <div class="n">mit ${num(a.kapitalGesamt,0)} € eigenem Geld${
        a.hebelFaktor > 1.05 ? ` · Faktor ${a.hebelFaktor.toFixed(1).replace('.',',')}` : ''}</div></div>
    <div><div class="k">Normaler Tag</div>
      <div class="v">${a.tagesRisiko != null ? '±'+num(a.tagesRisiko,0)+' €' : '—'}</div>
      <div class="n">${a.tagesRisiko != null && a.kapitalGesamt
        ? (a.tagesRisiko/a.kapitalGesamt*100).toFixed(1).replace('.',',')+' % deines Geldes' : ''}</div></div>
    <div><div class="k">Schlechter Tag</div>
      <div class="v ${a.tagesRisiko != null && a.kapitalGesamt
          && (a.tagesRisiko*GL_SCHLECHT/a.kapitalGesamt) > 0.06 ? 'aus' : 'mittel'}">${
        a.tagesRisiko != null ? '−'+num(a.tagesRisiko*GL_SCHLECHT,0)+' €' : '—'}</div>
      <div class="n">einer von zwanzig</div></div>
  </div>
  <p class="leer" style="padding:6px 0">Gemessen an den Tagesrenditen der letzten
    ${a.tage} Handelstage bis ${esc(a.bis)} — nicht geschätzt und nicht angenommen.
    Der schlechte Tag ist das übliche 95-%-Quantil; an echten Paniktagen fällt mehr an,
    weil Kurse dann stärker springen, als eine Normalverteilung kennt.${
    a.bar > 0 ? ` ${num(a.bar,0)} € Cash sind nicht dabei — das ist der Sinn von Cash:
    es bewegt sich nicht mit.` : ''}${
    a.ohneMessung ? ` ${posAnz(a.ohneMessung)} über ${num(a.ohneMessungEU,0)} €
    fehlen in der Rechnung — für sie gibt es keine Messreihe (ETF, ausgelisteter Coin,
    Schein ohne erkannten Basiswert). Das Risiko darunter ist nicht null, es ist
    ungemessen.` : ''}</p>`;

  if (echte.length){
    h += echte.map((x,i)=>{
      const farbe = x.anteil > 55 ? 'bad' : x.anteil > 35 ? 'warn' : '';
      return `<div class="karte ${farbe}" style="margin-bottom:8px">
        <h3>Bündel ${i+1} · ${proz(x.anteil)} % des bewegten Marktes
          <span style="float:right;font-weight:400;color:var(--ink-3);font-size:12.5px">${
            x.zusammenhalt != null ? esc(glText(x.zusammenhalt)) + ' (' +
            x.zusammenhalt.toFixed(2).replace('.',',') + ')' : ''}</span></h3>
        <div class="kpi" style="margin-top:6px">${x.mitglieder.map(m=>
          `<span>${esc(posName(m.b))}${m.hebel>1?` <b>${m.hebel.toFixed(m.hebel<10?1:0).replace('.',',')}×</b>`:''}
           <b>${num(m.markt,0)} €</b></span>`).join('')}</div>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Diese ${
          x.mitglieder.length} Positionen bewegen sich gemeinsam. Für dein Ergebnis
          zählen sie wie <strong>eine</strong> Position von ${num(x.markt,0)} € —
          ein schlechter Tag trifft sie alle am selben Tag.</p>
      </div>`;
    }).join('');
  }
  if (gross.length){
    h += gross.map(x=>{
      const m = x.mitglieder[0];
      return `<div class="karte ${x.anteil>35?'bad':'warn'}" style="margin-bottom:8px">
        <h3>Einzelwette · ${proz(x.anteil)} % des bewegten Marktes
          <span style="float:right;font-weight:400;color:var(--ink-3);font-size:12.5px">${
            esc(posName(m.b))}${m.hebel>1?` · ${m.hebel.toFixed(m.hebel<10?1:0).replace('.',',')}×`:''}</span></h3>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Dieser eine Wert
          bewegt ${num(x.markt,0)} € und läuft zu keinem anderen Posten messbar parallel.
          Eigenständig heisst hier aber nicht ungefährlich: er ist gross genug, um allein
          über dein Ergebnis zu entscheiden. Eine schlechte Nachricht zu diesem einen
          Unternehmen kostet dich ${proz(x.anteil)} % deiner Marktbewegung — unabhängig
          davon, was der Rest tut.</p>
      </div>`;
    }).join('');
  }
  if (eins.length){
    h += `<div class="karte gut" style="margin-bottom:8px">
      <h3>Läuft eigenständig · ${proz(eins.reduce((s,x)=>s+x.anteil,0))} %</h3>
      <div class="kpi" style="margin-top:6px">${eins.map(x=>
        `<span>${esc(posName(x.mitglieder[0].b))} <b>${num(x.markt,0)} €</b></span>`).join('')}</div>
      <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Zu keinem anderen
        Posten im Depot messbar gleichlaufend. Das ist der Teil, der Diversifikation
        tatsächlich leistet.</p></div>`;
  }

  // Der Satz, um den es geht.
  const groesst = [...echte, ...gross].sort((x,y)=>y.anteil-x.anteil)[0];
  if (groesst && groesst.anteil > 45){
    h += `<div class="note-box bad"><span class="nt">Worauf das hinausläuft</span>
      <p>${proz(groesst.anteil)} % von allem, was du am Markt bewegst, hängen an
      <strong>einer</strong> Bewegung. ${a.effektiv != null
        ? `Rechnerisch hast du ${a.effektiv.toFixed(1).replace('.',',')} Wetten laufen,
           nicht ${a.teile.length}.` : ''} Das ist keine Fehlentscheidung — aber es ist
      eine andere Wette als die, die eine Liste aus ${a.teile.length} Zeilen suggeriert.
      Wenn du das Risiko senken willst, hilft es nicht, innerhalb des Bündels
      umzuschichten; es hilft nur, das Bündel kleiner zu machen.</p></div>`;
  }
  return h;
}

/* ========================================== DEPOT-GESUNDHEIT 0–100 (Masterplan §15)

   Eine Zahl fuer das ganze Depot — aber keine erfundene. Sie setzt sich aus fuenf Teilen
   zu je 20 Punkten zusammen, und jeder Teil misst etwas, das Ozan SELBST aendern kann:

     Schutz    — welcher Anteil des Geldes hat einen Stop (bei Scheinen: genug Puffer)
     Streuung  — aus wie vielen unabhaengigen Wetten das Depot wirklich besteht
     Klumpen   — wie gross die groesste Einzelposition ist
     Hebel     — wie viel des gehebelten Geldes weit genug vom Knock-out entfernt ist
     Termine   — wie viel des Geldes in den naechsten 7 Tagen KEINE Quartalszahlen hat

   Was bewusst NICHT hineinzaehlt: die relative Staerke. Nachgemessen (27.09.) liefen
   Schlusslichter danach nicht schlechter — ein Gesundheitswert, der sie bestraft, wuerde
   zum Verkaufen draengen, ohne dass es etwas bringt. Die Gewichte sind gesetzt, nicht
   optimiert; deshalb steht jeder Teil mit seiner Zahl daneben. */
function depotGesundheit(stand){
  if (!stand || !stand.bew.length || !stand.gesamt) return null;
  const inEU = (b) => stand.inEuro(b, b.wert) || 0;
  const teile = stand.bew.filter(b => !istBar(b.pos) && inEU(b) > 0);
  const summe = teile.reduce((s, b) => s + inEU(b), 0);
  if (!summe) return null;
  const anteil = (f) => teile.filter(f).reduce((s, b) => s + inEU(b), 0) / summe;
  const hatSchutz = (b) => {
    const pl = b.pos.plan;
    if (pl && pl.stop != null && isFinite(pl.stop)) return true;
    return !!(b.hebel && !b.hebel.ausgeknockt && b.hebel.puffer_pct >= KO_PUFFER_ENG * 2);
  };
  const schutz = anteil(hatSchutz);
  const a = (typeof glBuendel === 'function') ? glBuendel(stand.bew, stand) : null;
  const eff = a && a.effektiv != null ? a.effektiv : null;
  const groesste = Math.max(...teile.map(b => inEU(b))) / summe * 100;
  const gehebelt = teile.filter(b => b.hebel);
  const hebelOk = gehebelt.length
    ? gehebelt.filter(b => !b.hebel.ausgeknockt && b.hebel.puffer_pct >= KO_PUFFER_ENG)
        .reduce((s, b) => s + inEU(b), 0) / gehebelt.reduce((s, b) => s + inEU(b), 0)
    : 1;
  const zahlenBald = (b) => {
    const row = b.row || (b.basis && b.basis.row);
    const z = row && row.info && row.info.zahlen;
    return !!(z && z.tage != null && z.tage <= 7);
  };
  const ohneTermin = 1 - anteil(zahlenBald);
  const pk = {
    schutz: Math.round(20 * schutz),
    streuung: eff == null ? null : Math.round(20 * Math.max(0, Math.min(1, (eff - 1) / 4))),
    klumpen: Math.round(20 * Math.max(0, Math.min(1, (40 - groesste) / 25))),
    hebel: Math.round(20 * hebelOk),
    termine: Math.round(20 * ohneTermin),
  };
  // Fehlt die Gleichlauf-Messung, wird auf die vier anderen Teile hochgerechnet.
  const da = Object.values(pk).filter(v => v != null);
  const wert = Math.round(da.reduce((s, v) => s + v, 0) / (da.length * 20) * 100);
  return {wert, pk, schutz, eff, groesste, hebelOk, ohneTermin, gehebelt: gehebelt.length,
          ohneStop: teile.filter(b => !hatSchutz(b))};
}
/* ============================================= MARKTLAGE — RISK-ON/RISK-OFF

   Ozan, 08.10. 20:49, nach dem Krypto-Abverkauf: „falls der komplette Markt wieder
   sinkt, dass wir jetzt keine Scheiße bauen" und „wo man reingehen kann, wo man nicht
   reingehen kann."

   Der serverseitige Makro-Regime-Wert (``S.makro.regime``) kommt aus Aktienmärkten (VIX,
   S&P 500, Dollar, Zinsen) und wird nur EINMAL am Tag aktualisiert — ein Krypto-Flashcrash
   wie der vom 7./8.10. (Liquidationen, ETF-Abflüsse) zeigt sich darin erst mit Verzögerung,
   manchmal erst am nächsten Tag. Deshalb hier zusätzlich eine zweite, krypto-eigene und
   LIVE berechnete Lage — direkt aus dem aktuellen Scan, nicht aus einem Tages-Snapshot:
   wie viele der gescannten Coins sind gerade in den letzten 24 Stunden wie stark gefallen.

   Das ist bewusst nur eine BESCHREIBUNG der Lage, keine neue, ungeprüfte Handelsregel —
   die bestehenden No-Trade-/Alarm-Tor-Regeln entscheiden weiterhin, wann ein Kaufalarm
   kommt. Was diese Karte ändert: Ozan sieht die Lage auf einen Blick, statt sie aus
   einzelnen Positionen zusammenraten zu müssen. */
function marktLage(){
  const rows = (S?.gesamt||[]).filter(o => o.klasse === 'krypto'
    && o.zusatz && isFinite(o.zusatz.bewegung_24h_pct));
  if (rows.length < 10) return null;
  const werte = rows.map(o => o.zusatz.bewegung_24h_pct).sort((a,b)=>a-b);
  const mitte = werte.length >> 1;
  const median = werte.length % 2 ? werte[mitte] : (werte[mitte-1]+werte[mitte])/2;
  const starkRot = rows.filter(o => o.zusatz.bewegung_24h_pct <= -5).length;
  const anteilStarkRot = starkRot / rows.length * 100;
  const btc = rows.find(o => /^BTC/.test(o.instrument));
  const btc24h = btc ? btc.zusatz.bewegung_24h_pct : null;
  let stufe = 'ruhig';
  if (anteilStarkRot >= 50 || (btc24h != null && btc24h <= -4)) stufe = 'risk_off';
  else if (anteilStarkRot >= 25 || (btc24h != null && btc24h <= -2)) stufe = 'angespannt';
  return {median, anteilStarkRot: Math.round(anteilStarkRot), n: rows.length, btc24h, stufe,
          angstGier: S?.stimmung?.angst_gier || null, makroRegime: S?.makro?.regime || null};
}
function marktLageKasten(){
  const m = marktLage();
  if (!m) return '';
  const kl = m.stufe === 'risk_off' ? 'bad' : m.stufe === 'angespannt' ? 'warn' : 'gut';
  const titel = m.stufe === 'risk_off' ? 'Risk-Off — Markt fällt breit'
    : m.stufe === 'angespannt' ? 'Angespannt — vorsichtig bleiben' : 'Ruhig';
  const ag = m.angstGier;
  return `<div class="note-box ${kl}" style="margin:10px 0 0">
    <span class="nt">Marktlage (Krypto, live) · ${titel}</span>
    <p style="margin:4px 0 0;font-size:13px">${m.anteilStarkRot} % der ${m.n} gescannten Coins
      sind in 24 Std. um mehr als 5 % gefallen (Median ${pct(m.median,1)})${
      m.btc24h != null ? `, Bitcoin ${pct(m.btc24h,1)}` : ''}.${
      ag ? ` Angst &amp; Gier: ${ag.wert} (${esc(ag.text)}, vor einer Woche ${ag.vorwoche}).` : ''}</p>
    <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-3)">${
      m.stufe === 'risk_off'
        ? 'Das ist eine Beschreibung der Lage, keine neue Regel: neue Käufe besonders '
        + 'kritisch prüfen, bei Positionen mit Gewinn die Hinweise unten ernst nehmen — '
        + 'gegen einen erzwungenen, marktweiten Abverkauf zu kaufen ist kein Signal, '
        + 'sondern eine Wette gegen Liquidationen.'
        : m.stufe === 'angespannt'
        ? 'Noch kein breiter Ausverkauf, aber mehr rote Coins als sonst — Stops und '
        + 'Gewinnsicherung im Blick behalten.'
        : 'Kein Anlass, hier etwas anders zu machen als sonst.'}</p></div>`;
}

function gesundheitKasten(stand){
  const g = depotGesundheit(stand);
  if (!g) return '';
  const kl = g.wert >= 75 ? 'gut' : g.wert >= 50 ? 'warn' : 'bad';
  const farbe = g.wert >= 75 ? 'Grün' : g.wert >= 50 ? 'Gelb' : 'Rot';
  const z = (t, p, satz) => `<div class="rowx"><span class="lab">${t}</span>
    <span class="val" style="font-family:inherit;font-weight:400;text-align:right">
    <b>${p == null ? '—' : p + '/20'}</b> <span style="color:var(--ink-3)">${satz}</span></span></div>`;
  const tun = [];
  if (g.ohneStop.length)
    tun.push(`Stop setzen für ${g.ohneStop.slice(0,4).map(b => esc(posName(b))).join(', ')}`);
  if (g.pk.klumpen < 10) tun.push('die größte Position verkleinern');
  if (g.pk.hebel < 16) tun.push('Scheine mit knappem Knock-out-Puffer verkleinern');
  if (g.pk.termine < 16) tun.push('vor den anstehenden Quartalszahlen entscheiden, was du hältst');
  return `<div class="note-box ${kl}" style="margin:10px 0 0">
    <span class="nt">Depot-Gesundheit ${g.wert}/100 · ${farbe}</span>
    ${z('Schutz', g.pk.schutz, `${Math.round(g.schutz*100)} % des Geldes mit Stop oder weitem Puffer`)}
    ${z('Streuung', g.pk.streuung, g.eff != null ? `${g.eff.toFixed(1).replace('.',',')} unabhängige Wetten` : 'Gleichlauf noch nicht gemessen')}
    ${z('Klumpen', g.pk.klumpen, `größte Position ${g.groesste.toFixed(0)} % des Depots`)}
    ${z('Hebel', g.pk.hebel, g.gehebelt ? `${Math.round(g.hebelOk*100)} % des gehebelten Geldes ≥ ${KO_PUFFER_ENG} % vom Knock-out` : 'kein Hebel im Depot')}
    ${z('Termine', g.pk.termine, `${Math.round(g.ohneTermin*100)} % ohne Quartalszahlen in 7 Tagen`)}
    ${tun.length ? `<p style="margin:8px 0 0;font-size:13px"><strong>Was sie hebt:</strong> ${tun.join('; ')}.</p>` : ''}
    <p style="margin:6px 0 0;font-size:12px;color:var(--ink-3)">Fünf Teile zu je 20 Punkten —
      nur Dinge, die du selbst ändern kannst. Die relative Stärke zählt bewusst nicht mit.</p></div>`;
}

/* Quartalszahlen eines gehaltenen Werts (bei Scheinen: des Basiswerts). An so einem Tag
   springt der Kurs oft ueber jeden Stop — und bei einem Turbo kann eine Nacht den
   Knock-out bringen. Das gehoert an die Position, nicht nur in die Signal-Liste. */
/* Jeder zehnte Zahlen-Termin aller gescannten Aktien bewegte den Kurs um mehr als diesen
   Wert (Prozent, zwei Tage, 2024–26; refdata/zahlen_bewegung.json). */
const ZAHLEN_P90 = 13.1;
function zahlenHinweis(b){
  const row = b.row || (b.basis && b.basis.row) || null;
  const z = row && row.info && row.info.zahlen;
  if (!z || z.tage == null || z.tage > 14) return '';
  const wann = new Date(z.datum + 'T12:00:00Z').toLocaleDateString('de-DE',
    {weekday:'short', day:'2-digit', month:'2-digit'});
  const nm = name((row||{}).instrument || '');
  const bew = z.bewegung || null;
  const k = (x) => Number(x).toFixed(1).replace('.', ',');
  const hist = bew ? ` An den letzten ${bew.n} Terminen bewegte sich ${esc(nm)} im Mittel um
    ±${k(bew.median)} %, höchstens um ${k(bew.max)} %.` : '';
  const puffer = b.hebel && !b.hebel.ausgeknockt && b.hebel.puffer_pct != null ? b.hebel.puffer_pct : null;
  let satz, eng = z.tage <= 3;
  if (puffer != null){
    const grenze = Math.max(ZAHLEN_P90, bew && bew.max != null ? bew.max : 0);
    const knapp = puffer < grenze;
    eng = eng || knapp;
    satz = knapp
      ? ` <strong>Dein Puffer zum Knock-out: ${k(puffer)} %</strong> — eine Zahlen-Lücke dieser Größe
          hat es schon gegeben. Entscheide vorher, ob du den Schein über den Termin hältst.`
      : ` Dein Puffer zum Knock-out (${k(puffer)} %) ist größer als jede bisherige Zahlen-Bewegung —
          der Schein übersteht einen normalen Termin, ein Stop schützt aber nicht vor der Lücke.`;
  } else {
    satz = ' Ein Stop schützt nicht vor einer Kurslücke über Nacht.';
  }
  return `<div class="note-box ${eng?'warn':''}" style="margin:8px 0 0;padding:8px 12px">
    <p style="margin:0;font-size:13px"><strong>Quartalszahlen ${esc(nm)}
    ${esc(wann)}${z.zeit?' '+esc(z.zeit):''}</strong> — in ${z.tage} Tag${z.tage===1?'':'en'}.${hist}${satz}</p></div>`;
}

/* Woher der Kurs einer Position gerade kommt — live von der Boerse oder aus dem Scan.
   Ozan, 30.09.: „brauche Live-Update bei meinem Portfolio." Live ist nur, was der
   Kraken-Stream in den letzten zwei Minuten geliefert hat; alles andere steht mit dem
   Alter seines Kurses da, statt so zu tun, als waere es live. */
function kursQuelleMarke(b){
  const l = L.get(b.pos.sym) || (b.row ? L.get(b.row.instrument) : null);
  if (l && Date.now() - l.t < 120000)
    return `<span class="mini-tag" title="Livekurs von Kraken">LIVE</span>`;
  if (b.row && S && S.erzeugt){
    const min = Math.round((Date.now() - Date.parse(S.erzeugt)) / 60000);
    if (isFinite(min)) return `<span class="nu" style="font-size:10.5px">Scan vor ${min} Min</span>`;
  }
  return `<span class="nu" style="font-size:10.5px">Kurs von Hand</span>`;
}
/* ============================================================ MINI-CHART JE POSITION
   Ozan, 07.10.: „Ich will die Analysen auch grafisch sehen." Jede Krypto-Position bekommt
   unter den Zahlen einen Verlauf der letzten 90 Tage mit ihren Marken: Einstieg, Stop,
   Ziele, Liquidation (Margin) und aktueller Kurs. Die Tageskerzen kommen direkt von Kraken
   (öffentlich, ohne Schlüssel); für Aktien und Scheine gibt es hier keine Kerzen — dort
   bleibt der Knopf „Chart ansehen". Die Karten zeichnen sich alle paar Sekunden neu, darum
   steht die Kerzenreihe in einem Zwischenspeicher und wird höchstens alle 10 Minuten geholt. */
const MC_CACHE = new Map();     // Paar -> {zeit, c:[Schlusskurse], fehler}
const MC_LADEN = new Set();
function mcLaden(paar){
  const alt = MC_CACHE.get(paar);
  if (MC_LADEN.has(paar)) return;
  if (alt && Date.now() - alt.zeit < (alt.fehler ? 300000 : 600000)) return;
  MC_LADEN.add(paar);
  fetch('https://api.kraken.com/0/public/OHLC?pair=' + encodeURIComponent(paar) + '&interval=1440')
    .then(r => r.json()).then(j => {
      const k = j && j.result ? j.result[Object.keys(j.result).find(x => x !== 'last')] : null;
      if (!Array.isArray(k) || k.length < 10) throw new Error('leer');
      MC_CACHE.set(paar, {zeit: Date.now(),
        c: k.slice(-90).map(x => ({t: x[0], h: +x[2], l: +x[3], c: +x[4]}))});
    }).catch(() => MC_CACHE.set(paar, {zeit: Date.now(), fehler: true}))
    .finally(() => { MC_LADEN.delete(paar); try { if (typeof zeichnePortfolio === 'function') zeichnePortfolio(); } catch(e){} });
}
function miniChart(b){
  if (!b || istBar(b.pos)) return '';
  const schein = istSchein(b.pos);
  const pr = schein ? null : krakenPaar(b.pos.sym);
  let e = null, titel = '90 Tage', basisKurs = null;
  if (pr){
    const paar = pr.replace('/', '');
    mcLaden(paar);
    e = MC_CACHE.get(paar);
    if (!e) return `<div class="mc"><span class="nu" style="font-size:12px">Verlauf wird geladen …</span></div>`;
    if (e.fehler) e = null;
  }
  if (!e){
    // Kein Kraken-Verlauf (Aktie, Schein): die Schlusskurse aus dem Scan (Gleichlauf-Block).
    const k = S && S.gleichlauf && S.gleichlauf.k;
    const nm = glNameFuer(b);
    const reihe = k && nm ? k[nm] : null;
    if (!reihe || reihe.length < 20) return '';
    e = {c: reihe.map(c => ({c, h: c, l: c}))};
    titel = `${reihe.length} Handelstage`;
    if (schein){
      if (b.hebel && b.hebel.basisKurs != null) basisKurs = b.hebel.basisKurs;
      titel += ' · Verlauf des Basiswerts' + (b.hebel && b.hebel.basisName ? ' ' + b.hebel.basisName : '');
    }
  }
  const pl = b.pos.plan || {};
  const lang = !istKurzDirekt(b.pos);
  const marken = [];
  const add = (lab, v, art) => { if (v != null && isFinite(v) && v > 0) marken.push({lab, v: +v, art}); };
  if (schein){
    // Marken des Scheins stehen in der Waehrung des Basiswerts: Knock-out und Basis-Stop.
    add('Knock-out', b.pos.ko, 'stop');
    if (pl.ebene === 'basis') add('Stop', pl.stop, 'stop');
  } else {
    add('Einstieg', b.pos.einstieg, 'ein');
    add(pl.schutz != null ? 'Schutz' : 'Stop', pl.stop, 'stop');
    add('Ziel 1', pl.tp1, 'tp'); add('Ziel 2', pl.tp2, 'tp'); add('Ziel 3', pl.tp3, 'tp');
    if (b.hebel && b.hebel.art === 'margin') add('Liquidation', b.hebel.liquidation, 'stop');
  }
  const kursX = schein ? basisKurs : b.kurs;
  const cs = e.c, kurs = kursX != null ? kursX : cs[cs.length-1].c;
  let lo = Math.min(...cs.map(x => x.l), kurs), hi = Math.max(...cs.map(x => x.h), kurs);
  // Marken weit ausserhalb quetschen sonst den Verlauf zusammen: nur bis +/- 35 % Abstand.
  const nah = marken.filter(m => m.v >= lo * 0.65 && m.v <= hi * 1.35);
  for (const m of nah){ lo = Math.min(lo, m.v); hi = Math.max(hi, m.v); }
  const W = 340, H = 128, pad = 6, rechts = 112;
  const X = i => pad + i / (cs.length - 1) * (W - pad - rechts);
  const Y = v => H - pad - (v - lo) / (hi - lo || 1) * (H - 2 * pad);
  const d = digits(kurs);
  const linie = cs.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.c).toFixed(1)).join('');
  const flaeche = linie + `L${X(cs.length-1).toFixed(1)} ${H-pad}L${X(0).toFixed(1)} ${H-pad}Z`;
  const jy = Y(kurs);
  // Beschriftungen von oben nach unten, mit Mindestabstand — der Kurs ist eine davon.
  const texte = nah.map(m => ({y: Y(m.v), art: m.art, t: `${m.lab} ${num(m.v, d)}`, linie: true}))
    .concat([{y: jy, art: 'kurs', t: `Kurs ${num(kurs, d)}`, linie: false}]).sort((a, c2) => a.y - c2.y);
  for (let i = 1; i < texte.length; i++) texte[i].ly = Math.max(texte[i].y, (texte[i-1].ly ?? texte[i-1].y) + 10);
  if (texte.length) texte[0].ly = texte[0].y;
  const mk = texte.map(m => (m.linie ? `<line class="mc-l ${m.art}" x1="${pad}" x2="${W-rechts}" y1="${m.y.toFixed(1)}" y2="${m.y.toFixed(1)}"/>` : '')
    + `<text class="mc-t ${m.art}" x="${W-rechts+4}" y="${(m.ly + 3).toFixed(1)}">${esc(m.t)}</text>`).join('');
  const plus = b.gv == null ? true : b.gv >= 0;
  const aus = marken.length - nah.length;
  return `<div class="mc"><svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Verlauf 90 Tage mit Einstieg, Stop und Zielen">
    <path class="mc-f ${plus ? 'plus' : 'minus'}" d="${flaeche}"/>
    <path class="mc-p" d="${linie}"/>${mk}
    <circle class="mc-k" cx="${X(cs.length-1).toFixed(1)}" cy="${jy.toFixed(1)}" r="3"/>
  </svg><div class="nu" style="font-size:11px">${esc(titel)}${aus ? ` · ${aus} Marke${aus>1?'n':''} weit ausserhalb, nicht eingezeichnet` : ''}${lang ? '' : ' · Short'}</div></div>`;
}

/* ============================================================ DEPOT-GRAFIK
   Ozan, 07.10.: Analysen „auch grafisch". Zwei Balkenbilder ueber der Tabelle:
   1. wo das Geld liegt (je Konto, Bargeld abgesetzt) und
   2. was jede Position seit Kauf gebracht hat, in Euro, als Balken nach links/rechts.
   Reine Anzeige derselben Zahlen wie die Tabelle — keine neue Rechnung. Margin zaehlt mit
   dem eigenen Geld, Gewinn/Verlust in Euro umgerechnet. */
const KONTO_NAME = {traderepublic:'Trade Republic', bybit:'Bybit', kraken:'Kraken', binance:'Binance'};
/* ============================ NACHT-PLAN

   Ozan, 07.10. 22:14: „Wenn ich schlafen gehe, kann ich nicht mehr auf dem Markt reagieren …
   so dass ich in Ruhe schlafen gehen kann und nichts verpasse mit dem Teilverkauf oder
   kompletten Verkauf." Die ehrliche Antwort: nachts verkauft nur eine Order, die BEIM BROKER
   liegt. Die App fuehrt nichts aus, und eine Meldung um 3 Uhr weckt niemanden. Also sagt
   dieser Plan vor dem Schlafen je Position genau, welche Orders du eintraegst (Art, Preis,
   Stueckzahl, Broker-Eigenheit), wie weit sich der Wert ueber Nacht typischerweise bewegt
   und was im schlechten Fall passiert. Der Waechter auf GitHub prueft weiter alle 10 Minuten
   und meldet sich — fuer den Morgen. */
function nachtSd(b){
  // Tagesschwankung in % (90 Tage, aus der Gleichlauf-Messung). Coins handeln nachts weiter
  // (8 Std. = Wurzel aus 1/3 eines Tages); Aktien sind zu, aber der Kurs springt zur Eroeffnung
  // — dafuer gilt eine ganze Tagesschwankung.
  const nm = glNameFuer(b); const sd = nm ? glVola(nm) : null;
  if (sd == null) return null;
  const rr = b.row || (b.hebel && b.hebel.basisSym ? scanRow(b.hebel.basisSym) : null);
  const krypto = rr && (rr.klasse === 'krypto' || rr.klasse === 'gold');
  return {sd: krypto ? sd * Math.sqrt(8/24) : sd, krypto, art: krypto ? '8 Std. Handel' : 'bis zur Eröffnung'};
}
function scheinBei(b, basisPreis){
  // Turbo-Preis bei einem bestimmten Kurs des Basiswerts — dieselbe Rechnung wie hebelLage.
  const h = b.hebel; if (!h || h.ko == null || basisPreis == null) return null;
  const ab = h.lang ? basisPreis - h.ko : h.ko - basisPreis;
  if (ab <= 0) return 0;
  if (h.ratio == null) return null; // ohne Bezugsverhaeltnis kein Scheinpreis
  const proBasis = ab / h.ratio;
  return (h.schein && h.basisKurs) ? proBasis * (h.schein / ((h.lang ? h.basisKurs - h.ko : h.ko - h.basisKurs) / h.ratio)) : proBasis;
}
const NACHT_BROKER = {
  traderepublic: {stop: 'Stop-Loss-Order (Stop-Market, „Stop") — Verkauf, sobald der Kurs die Marke berührt',
    ziel: 'Limit-Verkauf (Take-Profit)',
    hinweis: 'Trade Republic: ob Stop und Limit auf dieselben Stücke gleichzeitig offen sein dürfen, ist hier nicht sicher geprüft — im Zweifel in der App nachsehen. Geht nur eine Order, hat der Stop Vorrang: er schützt, das Limit verdient nur. Aktien und Scheine handeln dort ca. 7:30–23:00; nachts ruht die Order, sie greift beim ersten Kurs am Morgen.'},
  kraken: {stop: 'Stop-Loss-Order (Order-Typ „Stop Loss")', ziel: 'Take-Profit-Order (Order-Typ „Take Profit") oder Limit-Verkauf',
    hinweis: 'Kraken handelt rund um die Uhr — die Order greift auch um 3 Uhr. Stop und Take-Profit dürfen zusammen die Menge nicht übersteigen.'},
  bybit: {stop: 'Stop-Loss direkt an der Position (TP/SL)', ziel: 'Take-Profit an der Position — „Teil-TP/SL" erlaubt eine Teilmenge',
    hinweis: 'Bybit setzt TP und SL direkt an der Position, auch zusammen und als Teilmenge. Bei Hebel: der Stop muss VOR dem Liquidationspreis liegen.'},
  binance: {stop: 'Stop-Limit- oder OCO-Order', ziel: 'OCO (Ziel und Stop in einer Order)',
    hinweis: 'Binance-OCO verbindet Ziel und Stop: wird eins ausgeführt, verfällt das andere — genau richtig für die Nacht.'},
};
function nachtZeile(b, stand){
  const pos = b.pos, pl = pos.plan || {};
  const name = posName(b), konto = kontoNorm(pos.konto), br = NACHT_BROKER[konto] || NACHT_BROKER.kraken;
  const eu = stand.inEuro(b, b.wert) || 0;
  const ns = nachtSd(b);
  const schein = pos.ko != null && b.hebel && !b.hebel.ausgeknockt;
  const basis = pl.ebene === 'basis';
  const z = waehrungsZeichen(b.w), d = digits(b.kurs || 1);
  const lang = (pl.richtung || pos.hebel_richtung || 'long') === 'long';
  const stueck = m => (b.row && b.row.klasse === 'krypto') ? num(m, m < 1 ? 6 : 4) : String(Math.max(1, Math.floor(m)));
  const zeilen = [], warn = [];
  let stufe = 'gut';
  // 1 — Stop als Order
  let stopOrder = null, verlustStop = null;
  if (pl.stop != null){
    let preis = pl.stop;
    if (schein && basis){ preis = scheinBei(b, pl.stop); }
    if (preis != null && b.kurs){
      verlustStop = (lang || schein ? (b.kurs - preis) : (preis - b.kurs)) / b.kurs * eu;
      stopOrder = preis;
      zeilen.push(`<li><b>Stop: ${br.stop}</b> bei <b>${num(preis, digits(preis))}${z}</b> für <b>alle ${stueck(pos.menge)} Stück</b>${
        schein && basis ? ` <span class="nu">(entspricht ${esc(b.hebel.basisName || 'Basiswert')} bei ${num(pl.stop, digits(pl.stop))} — der Schein-Preis ist umgerechnet, prüf ihn in der Order-Maske)</span>` : ''}.
        Wird er ausgelöst: etwa <b>−${num(Math.abs(verlustStop), 0)} €</b>.</li>`);
    }
  } else {
    stufe = 'bad';
    const rrS = b.row || (b.hebel && b.hebel.basisSym ? scanRow(b.hebel.basisSym) : null);
    const hs = rrS && rrS.halte ? (lang ? rrS.halte.stop_long : rrS.halte.stop_short) : null;
    let vp = hs;
    if (vp != null && schein) vp = scheinBei(b, hs);
    else if (vp != null && b.row && b.row.kurs && b.kurs) vp = vp * (b.kurs / b.row.kurs);   // in die Waehrung der Position
    if (vp != null && vp > 0 && b.kurs && (lang ? vp < b.kurs : vp > b.kurs)){
      verlustStop = Math.abs(b.kurs - vp) / b.kurs * eu;
      warn.push('Kein Stop eingetragen — über Nacht ungeschützt. Vorschlag aus der Analyse (Halte-Stop) steht darunter.');
      zeilen.push(`<li><b>Stop (Vorschlag): ${br.stop}</b> bei <b>${num(vp, digits(vp))}${z}</b> für <b>alle ${stueck(pos.menge)} Stück</b>${
        schein ? ` <span class="nu">(${esc(b.hebel.basisName || 'Basiswert')} bei ${num(hs, digits(hs))})</span>` : ''} — ≈ −${num(verlustStop, 0)} €, falls ausgelöst.</li>`);
    } else {
      warn.push('Kein Stop eingetragen und kein Vorschlag aus der Analyse — über Nacht ungeschützt. Mindestens eine Marke unter dem letzten Tief setzen oder verkleinern.');
    }
  }
  // 2 — naechstes Ziel als Limit
  const erl = new Set(pos.erledigt || []);
  const naechst = ['tp1','tp2','tp3'].find(k => pl[k] != null && !erl.has(k.toUpperCase()));
  if (naechst && zieleGelten(pl)){
    let preis = pl[naechst];
    if (schein && basis) preis = scheinBei(b, pl[naechst]);
    const offen = 3 - ['TP1','TP2','TP3'].filter(m => erl.has(m)).length;
    const m = pos.menge / Math.max(1, offen);
    if (preis != null) zeilen.push(`<li><b>Ziel: ${br.ziel}</b> bei <b>${num(preis, digits(preis))}${z}</b> für <b>${stueck(m)} Stück</b> (${naechst.toUpperCase()}, ${offen === 1 ? 'der Rest' : 'ein Drittel'}).</li>`);
  }
  // 3 — Nachtbewegung
  if (ns){
    const fak = schein ? b.hebel.hebel : (Number(pos.hebel) > 1 ? Number(pos.hebel) : 1);
    const typ = ns.sd * fak, schlecht = 1.65 * ns.sd * fak;
    zeilen.push(`<li>Über Nacht (${ns.art}) bewegt sich das typischerweise um <b>±${typ.toFixed(1).replace('.',',')} %</b>
      (≈ ${num(eu * typ / 100, 0)} €); in einer von zwanzig Nächten <b>−${schlecht.toFixed(1).replace('.',',')} %</b> oder mehr
      (≈ −${num(eu * schlecht / 100, 0)} €)${fak > 1 ? `, Hebel ${fak.toFixed(1).replace('.',',')}× schon eingerechnet` : ''}.</li>`);
    if (b.hebel && b.hebel.puffer_pct != null){
      const n = b.hebel.puffer_pct / (ns.sd * 1.65);
      if (n < 1){ stufe = 'bad'; warn.push(`${b.hebel.art === 'margin' ? 'Liquidation' : 'Knock-out'} liegt nur ${b.hebel.puffer_pct.toFixed(1).replace('.',',')} % entfernt — weniger als eine schlechte Nacht. Vor dem Schlafen verkleinern oder schließen.`); }
      else if (n < 2){ if (stufe === 'gut') stufe = 'warn'; warn.push(`${b.hebel.art === 'margin' ? 'Liquidation' : 'Knock-out'} ${b.hebel.puffer_pct.toFixed(1).replace('.',',')} % entfernt — das sind nur ${n.toFixed(1).replace('.',',')} schlechte Nächte. Ein Stop VOR der Schwelle ist Pflicht.`); }
    }
  }
  // 4 — Termine in der Nacht
  const rr = b.row || (b.hebel && b.hebel.basisSym ? scanRow(b.hebel.basisSym) : null);
  const zt = rr && rr.info && rr.info.zahlen;
  if (zt && zt.tage != null && zt.tage <= 1){
    if (stufe === 'gut') stufe = 'warn';
    warn.push(`Quartalszahlen ${zt.tage === 0 ? 'heute' : 'morgen'} — typische Bewegung ±${num((zt.bewegung||{}).median || 0, 1)} %, im Extrem ${num((zt.bewegung||{}).max || 0, 1)} %. Ein Stop schützt vor einer Kurslücke NICHT: er wird zum ersten Kurs danach ausgeführt.`);
  }
  // 5 — Ueberdehnt UND im Plus: genau der Fall vom 07.10. (MET, +37 % in 24 Std., H4-RSI
  // 83). Die Analyse schreibt "ueberdehnt" schon in die Warnungen (scanner/chart_score.py,
  // analysis/indicators.py) — hier nur gelesen, nichts neu erfunden. Kein Verkaufs-Zwang,
  // nur der Hinweis, den Ozan sonst jedes Mal selbst erfragen musste.
  const ueberdehntWarnung = (rr && Array.isArray(rr.warnungen))
    ? rr.warnungen.find(w => /ueberdehnt/i.test(w)) : null;
  if (ueberdehntWarnung && b.gvPct != null && b.gvPct > 15){
    if (stufe === 'gut') stufe = 'warn';
    warn.push(`Im Plus (${b.gvPct >= 0 ? '+' : '−'}${Math.abs(b.gvPct).toFixed(0)} %) UND laut Analyse überdehnt: „${ueberdehntWarnung}" — ein Teil des Gewinns ist nur gesichert, wenn der Stop nah genug am Kurs steht. Weit entfernter Stop schützt vor dem Totalausfall, nicht vor einem Rücksetzer.`);
  }
  if (!ns && pl.stop != null && stufe === 'gut') stufe = 'warn';
  return {b, name, eu, stufe, zeilen, warn, verlustStop, br, konto};
}
function nachtPlan(stand){
  const liste = stand.bew.filter(b => !istBar(b.pos) && b.kurs != null && b.pos.menge);
  if (!liste.length) return '';
  const z = liste.map(b => { try { return nachtZeile(b, stand); } catch(e){ return null; } }).filter(Boolean)
    .sort((a, b2) => ({bad:0, warn:1, gut:2}[a.stufe] - {bad:0, warn:1, gut:2}[b2.stufe]) || b2.eu - a.eu);
  const summeStop = z.reduce((s, x) => s + (x.verlustStop != null ? Math.abs(x.verlustStop) : 0), 0);
  const ohne = z.filter(x => x.verlustStop == null).length;
  const rot = z.filter(x => x.stufe === 'bad').length, gelb = z.filter(x => x.stufe === 'warn').length;
  const std = new Date().getHours();
  const offen = std >= 19 || std < 3;
  const kopf = rot ? `${rot} Position${rot > 1 ? 'en' : ''} vor dem Schlafen anfassen` : gelb ? `${gelb} mit Hinweis — sonst ruhig` : 'Alles abgesichert — gute Nacht';
  const kl = rot ? 'bad' : gelb ? 'warn' : 'gut';
  const broker = [...new Set(z.map(x => x.konto))].map(k => NACHT_BROKER[k] ? `<li><b>${esc(KONTO_NAME[k] || k)}:</b> ${esc(NACHT_BROKER[k].hinweis)}</li>` : '').join('');
  return `<details class="karte ${kl}" ${offen ? 'open' : ''} style="margin-top:12px"><summary style="cursor:pointer"><h3 style="display:inline">🌙 Nacht-Plan — ${esc(kopf)}</h3></summary>
    <p style="font-size:13.5px;margin:8px 0">Nachts verkauft <strong>nur eine Order, die beim Broker liegt</strong>. Die App führt nichts aus,
      und eine Meldung um 3 Uhr weckt dich nicht. Trag deshalb vor dem Schlafen diese Orders ein — dann passiert ein Stop
      oder ein Teilverkauf auch, während du schläfst. Der Wächter prüft weiter alle 10 Minuten; was passiert ist, steht morgens hier und in der Mail.</p>
    <div class="kpi"><span>Wenn alle Stops fallen <b class="dn">−${num(summeStop, 0)} €</b> (${stand.gesamt ? (summeStop / stand.gesamt * 100).toFixed(1).replace('.',',') : '—'} %)</span>
      ${ohne ? `<span>ohne Stop <b class="dn">${ohne}</b></span>` : ''}<span>rot <b>${rot}</b> · gelb <b>${gelb}</b></span></div>
    ${z.map(x => `<div style="border-top:1px solid var(--line,#2a3140);margin-top:10px;padding-top:8px">
      <b>${x.stufe === 'bad' ? '🔴' : x.stufe === 'warn' ? '🟡' : '🟢'} ${esc(x.name)}</b> <span class="nu">${esc(KONTO_NAME[x.konto] || x.b.pos.konto || '')} · ${num(x.eu, x.eu < 100 ? 2 : 0)} €</span>
      ${x.warn.length ? `<ul class="nb-l" style="color:var(--warn,#e0a040)">${x.warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <ul class="nb-l">${x.zeilen.join('')}</ul></div>`).join('')}
    <p style="margin-top:10px"><strong>Je Broker</strong></p><ul class="nb-l">${broker}</ul>
    <p style="font-size:12px;color:var(--ink-3);margin-top:8px">„Typisch" = eine Standardabweichung der letzten 90 Tage, auf die Nacht umgerechnet;
      „eine von zwanzig" = 1,65-fach. Echte Paniknächte können mehr. Ein Stop wird zum ersten verfügbaren Kurs ausgeführt —
      springt der Kurs über Nacht darüber hinweg (Kurslücke), wird es schlechter als die Marke.</p>
  </details>`;
}

/* ============================ TIEFE ANALYSE

   Ozan, 07.10.: „Die Analysen sind viel zu kurz und knapp … ich möchte alles verstehen und
   daraus lernen … wirklich tiefe Analyse." Je Position ein aufklappbarer Teil: Lage, Trend
   über mehrere Zeiträume, Spanne und Schwankung, warum der Stop dort liegt, Ziele, drei
   Szenarien in Euro, Fundamentaldaten, Makro, was die Einschätzung ändert — und jeder
   Fachbegriff erklärt. Alles aus Zahlen, die die App schon hat; nichts erfunden. */
/* Ozan, 09.10. 22:30: „wenn ich auf weitere drücke, ist das Fenster 2 Sekunden offen
   und danach schließt es sich automatisch — ich kann mir gar nicht alles in Ruhe
   anschauen." Grund: Portfolio wird bei jedem Live-Kurs-Tick komplett neu gezeichnet
   (``aktualisierePortfolioKurse`` -> ``zeichnePortfolio``, hoechstens alle 5 s) — genau
   dieses ``<details>` hatte, anders als ``mehrKasten`` (``MEHR_OFFEN``), KEIN Gedaechtnis
   fuer den offenen Zustand und klappte bei jeder Neuzeichnung wieder zu. Jetzt genau
   dasselbe Muster: der Schluessel der Position merkt sich, ob „Ausführliche Analyse"
   gerade offen war. */
const TA_OFFEN = new Set();
function tiefeAnalyse(b, stand){
  if (istBar(b.pos)) return '';
  const rr = b.row || (b.hebel && b.hebel.basisSym ? scanRow(b.hebel.basisSym) : null);
  if (!rr) return '';
  const pos = b.pos, pl = pos.plan || {};
  const nm = rr.name || rr.instrument;
  const k = rr.kurs, dd = digits(k || 1), zz = rr.waehrung === 'EUR' ? ' €' : ' $';
  const f = v => v == null ? '—' : num(v, digits(v)) + zz;
  const pc = v => v == null ? '—' : pct(v, 1);
  const eu = stand.inEuro(b, b.wert) || 0;
  const fak = (b.hebel && b.hebel.hebel) ? b.hebel.hebel : (Number(pos.hebel) > 1 ? Number(pos.hebel) : 1);
  const euBei = preis => (k && preis != null) ? (preis / k - 1) * 100 * fak / 100 * eu * ((pl.richtung || pos.hebel_richtung || 'long') === 'short' ? -1 : 1) : null;
  const t = [];
  const lern = new Set();
  // 1 Lage
  t.push(`<h4>1 · Die Lage in einem Satz</h4><p>${esc(nm)} steht bei <b>${f(k)}</b>. Die Analyse sagt: <b>${esc(rr.headline || '—')}</b>
    (Urteil ${esc(rr.urteil || '—')}${rr.note && rr.note !== '—' ? ', Note ' + esc(rr.note) : ''}). ${rr.begruendung ? 'Begründung: ' + esc(rr.begruendung) + '.' : ''}</p>`);
  // 2 Trend
  const ren = (rr.zusatz && rr.zusatz.renditen) || {};
  if (ren.r21 != null || rr.rs != null){
    lern.add('rs');
    t.push(`<h4>2 · Trend über mehrere Zeiträume</h4><ul class="nb-l">
      ${ren.r21 != null ? `<li>Letzter Monat: <b>${pc(ren.r21)}</b>${ren.r63 != null ? ` · letzte drei Monate: <b>${pc(ren.r63)}</b>` : ''}.
        ${ren.r21 != null && ren.r63 != null ? (ren.r21 > 0 && ren.r63 > 0 ? 'Beide Zeiträume steigen — der Trend trägt.' : ren.r21 < 0 && ren.r63 > 0 ? 'Mittelfristig aufwärts, zuletzt Rücksetzer — die Frage ist, ob der Rücksetzer hält.' : ren.r21 > 0 && ren.r63 < 0 ? 'Erholung in einem fallenden Trend — vorsichtig, oft nur Gegenbewegung.' : 'Beide Zeiträume fallen — gegen den Trend zu halten ist Hoffnung, kein Plan.') : ''}</li>` : ''}
      ${rr.rs != null ? `<li>Relative Stärke <b>${num(rr.rs, 0)}</b>/100 — ${rr.rs >= 70 ? 'gehört zu den stärksten seiner Klasse' : rr.rs >= 40 ? 'Mittelfeld' : 'gehört zu den schwächeren seiner Klasse'}.</li>` : ''}
      ${(rr.muster || []).map(m => `<li>Muster <b>${esc(m.name)}</b> (${esc(m.zeitebene || '')}, Güte ${num((m.guete || 0) * 100, 0)} %): ${esc(m.beschreibung || '')}
        ${m.hinfaellig != null ? ` Hinfällig unter ${f(m.hinfaellig)}.` : ''}</li>`).join('')}
    </ul>`);
    if ((rr.muster || []).length) lern.add('muster');
  }
  // 3 Spanne und Schwankung
  const h = rr.halte;
  if (h){
    lern.add('atr');
    const lage = (h.hoch22 && h.tief22 && h.hoch22 > h.tief22 && k) ? (k - h.tief22) / (h.hoch22 - h.tief22) * 100 : null;
    t.push(`<h4>3 · Spanne und Schwankung</h4><ul class="nb-l">
      <li>Durchschnittliche Tagesspanne (ATR): <b>${f(h.atr)}</b> = <b>${num(h.atr_pct, 1)} %</b> vom Kurs${fak > 1 ? ` — mit Hebel ${fak.toFixed(1).replace('.',',')}× sind das für dich ≈ ${num(h.atr_pct * fak, 1)} % je Tag` : ''}.</li>
      <li>Spanne der letzten ~22 Handelstage: <b>${f(h.tief22)}</b> bis <b>${f(h.hoch22)}</b>${lage != null ? `; der Kurs steht bei <b>${num(lage, 0)} %</b> dieser Spanne (${lage > 80 ? 'nahe am Hoch — Ausbruch oder Abpraller' : lage < 20 ? 'nahe am Tief — hier entscheidet sich, ob die Unterstützung hält' : 'mittendrin'})` : ''}.</li>
    </ul>`);
  }
  // 4 Stop
  if (pl.stop != null || (h && h.stop_long)){
    lern.add('stop');
    const st = pl.stop != null ? pl.stop : h.stop_long;
    const ab = (k && st) ? Math.abs(k - st) / k * 100 : null;
    t.push(`<h4>4 · Warum der Stop dort liegt</h4><p>${pl.stop != null ? 'Dein Stop' : 'Vorschlag (Halte-Stop)'}: <b>${f(st)}</b>${ab != null ? ` — ${num(ab, 1)} % entfernt${h && h.atr_pct ? `, das sind ${num(ab / h.atr_pct, 1)} Tagesspannen` : ''}` : ''}.
      ${h && h.stop_long ? `Der Halte-Stop rechnet „höchster Kurs der letzten 22 Tage (${f(h.hoch22)}) minus ${num(h.k, 0)} Tagesspannen" = ${f(h.stop_long)}. Die Idee: Normales Rauschen soll dich nicht aus dem Trade werfen, ein echter Trendbruch schon.` : ''}
      ${euBei(st) != null ? ` Fällt er, kostet das etwa <b>${num(euBei(st), 0)} €</b>.` : ''}
      ${ab != null && h && h.atr_pct && ab / h.atr_pct < 1 ? ' <b>Achtung:</b> weniger als eine Tagesspanne Abstand — schon ein normaler Tag kann ihn auslösen.' : ''}</p>`);
  }
  // 5 Ziele
  const ziele = ['tp1','tp2','tp3'].filter(x => pl[x] != null);

  // 7 Fundamental

      ${be != null ? `<li>BTC-Beta ${num(be, 2)}: ${be > 1.2 ? 'bewegt sich stärker als Bitcoin — fällt BTC 5 %, fällt das hier eher ' + num(5 * be, 0) + ' %' : be > 0.5 ? 'folgt Bitcoin deutlich' : 'läuft weitgehend unabhängig von Bitcoin'}.</li>` : ''}
