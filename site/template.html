/* ============================================================ PORTFOLIO
   Die Positionen liegen ausschliesslich in diesem Browser (localStorage). Das Repo
   und damit diese Seite sind oeffentlich — echte Depotdaten gehoeren dort nicht hin.
   So bekommt Ozan trotzdem das Cockpit: gerechnet wird im Geraet, hochgeladen nichts.
   ============================================================ */
const SPEICHER = 'desk.positionen.v1';
function ladePositionen(){
  try { const r = localStorage.getItem(SPEICHER); const a = r ? JSON.parse(r) : [];
        return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function speicherePositionen(a){
  try { localStorage.setItem(SPEICHER, JSON.stringify(a)); } catch(e){}
  // Neue Position → sofort Livekurs, nicht erst nach dem naechsten Neustart der App.
  try { abonniereDepot(); } catch(e){}
}
function abonniereDepot(){
  if (!WS || !WS_OK || WS.readyState !== 1) return;
  const neu = [];
  for (const sym of depotKryptoSymbole()){
    KRYPTO_NAMEN_LIVE.add(String(sym).toUpperCase());
    const pr = krakenPaar(sym);
    if (pr && !ABONNIERT.has(pr)){ ABONNIERT.add(pr); neu.push(pr); }
  }
  if (neu.length) try {
    WS.send(JSON.stringify({method:'subscribe', params:{channel:'ticker', symbol:neu}}));
  } catch(e){}
}
/* Eine Position dem Scan zuordnen — ueber die MUENZE, nicht ueber das Paar.

   Das war ein echter Ausfall: als der Scan von Euro auf Dollar umgestellt wurde, hiess
   Solana im Scan ploetzlich SOLUSD, im Depot aber weiter SOLEUR. Ergebnis: saemtliche
   Kryptopositionen standen auf einen Schlag ohne Bewertung da — kein Kurs, kein Urteil,
   kein Ausstiegsplan. Und zwar lautlos.

   Wer 1,79 Solana haelt, haelt 1,79 Solana. In welcher Waehrung die Boerse das Paar
   notiert, ist eine Eigenschaft der Boerse, nicht der Position. Also wird ab jetzt die
   Muenze verglichen und die Waehrung hinterher verrechnet.                          */
function muenzeVon(sym){
  const s = String(sym||'').toUpperCase().split('-')[0];
  for (const q of ['USDT','USDC','USD','EUR']){
    if (s.endsWith(q) && s.length > q.length) return s.slice(0, -q.length);
  }
  return s;
}
/* Ein Turbo, Knock-out oder Faktor-Schein ist nie ein Coin. Kraken fuehrt einen Coin, der
   TURBO heisst — ueber die Muenzensuche bekaeme „TURBO-TSM-LONG" sonst dessen Kurs, und
   jede Stopmarke waere Unsinn. Solche Posten werden nur exakt gesucht. */
const SCHEIN_MUSTER = /^(TURBO|KO|MINI|FAKTOR|OPEN|CALL|PUT)-|-(LONG|SHORT)$/i;
function istSchein(pos){
  return !!pos && (pos.ko != null || !!pos.basis || SCHEIN_MUSTER.test(String(pos.sym||'')));
}
function scanRowGenau(sym){
  return (S?.gesamt||[]).find(o => o.instrument === sym) || null;
}
function scanRow(sym){
  const g = (S?.gesamt||[]);
  const genau = g.find(o => o.instrument === sym);
  if (genau) return genau;
  const m = muenzeVon(sym);
  return g.find(o => muenzeVon(o.instrument) === m) || null;
}
/* In welcher Waehrung eine Position tatsaechlich gerechnet wird.

   Das steht nicht immer im Kuerzel. SOLEUR sagt es, NVDA nicht — und eine Aktie bei
   Trade Republic wird nun einmal in Euro gekauft, auch wenn der Scan sie in Dollar
   fuehrt. Ohne diese Unterscheidung wird ein Einstieg zu 154,72 € gegen einen Kurs von
   218,29 $ gerechnet: +41 % statt der echten +21 %. Ein Depot, das sich um zwanzig
   Prozentpunkte verschaetzt, ist schlimmer als gar keins. */
function posWaehrung(pos){
  if (pos && pos.waehrung) return String(pos.waehrung).toUpperCase();
  const s = String(pos?.sym||'').toUpperCase();
  const m = s.match(/(USDT|USDC|USD|EUR)$/);
  if (m) return m[1] === 'EUR' ? 'EUR' : 'USD';
  // Kein Kuerzel: das Konto entscheidet. Trade Republic rechnet in Euro.
  if (/trade\s*republic/i.test(String(pos?.konto||''))) return 'EUR';
  return 'USD';
}
function waehrungsZeichen(w){ return w === 'EUR' ? ' €' : ' $'; }

/* Wie viel eine Zahl aus der Zeile in der Waehrung der POSITION wert ist.
   Steht die Position in Euro und der Scan in Dollar, wird umgerechnet — sonst sieht ein
   Depot nach einem Waehrungswechsel plotzlich 16 % besser oder schlechter aus, ohne dass
   sich am Markt irgendetwas getan haette. */
function inPositionsWaehrung(row, wert, pos){
  if (wert == null || !row) return wert;
  const pw = typeof pos === 'string' ? posWaehrung({sym: pos}) : posWaehrung(pos);
  const rw = row.waehrung === 'EUR' ? 'EUR' : 'USD';
  if (pw === rw) return wert;
  const kurs = row.eurusd || (S && S.eurusd);
  if (!kurs) return wert;
  return pw === 'EUR' ? wert / kurs : wert * kurs;
}

/* ======================================================== BASISWERTE
   „Es fehlen noch Solana und die anderen Sachen, die du im Portfolio nicht bewerten
   kannst. Die musst du alle mit einbeziehen."

   Ein Turbo-Zertifikat auf TSMC ist kein eigener Markt. Es ist TSMC mit Hebel und einer
   Schwelle, an der der Schein wertlos verfaellt. Ein Welt-ETF ist kein Einzelwert,
   sondern der halbe Aktienmarkt. Bisher stand bei beiden nur „keine Bewertung" — ehrlich,
   aber nutzlos: ueber TSMC laesst sich sehr wohl etwas sagen, und genau daran haengt der
   Schein.

   Also wird der Basiswert mitgescannt und das Urteil von ihm hergeleitet — deutlich
   gekennzeichnet. Die Marken des Basiswerts sind NICHT die Marken des Scheins: der Hebel
   verschiebt jeden Abstand, und die Knock-out-Schwelle kennt nur der Emittent. */
const BASISWERT = {
  'TURBO-TSMC-LONG':    {sym:'TSM',  art:'turbo', richtung:'long'},
  'TURBO-NETFLIX-LONG': {sym:'NFLX', art:'turbo', richtung:'long'},
  'TURBO-META-LONG':    {sym:'META', art:'turbo', richtung:'long'},
  'FTSE-ALL-WORLD':     {art:'breit'},
};
const BASIS_STOPP = new Set(['LONG','SHORT','TURBO','CALL','PUT','MINI','FUTURE','OPEN',
                             'END','WORLD','ALL','ETF','FTSE','MSCI','INDEX','LANG']);
/* Aus einem Freitext-Kuerzel den Basiswert erraten: „TURBO-NETFLIX-LONG" enthaelt
   NETFLIX, und NETFLIX ist der Klarname von NFLX. Damit findet auch ein Schein seinen
   Basiswert, den niemand von Hand eingetragen hat. */
function errateBasis(sym){
  const s = String(sym||'').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.length < 4) return null;
  let best = null;
  for (const o of (S?.gesamt||[])){
    if (o.klasse !== 'aktien') continue;
    const stuecke = [String(o.instrument||''), ...String(o.name||'').split(/[^A-Za-z]+/)];
    for (const roh of stuecke){
      const t = roh.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (t.length < 4 || BASIS_STOPP.has(t)) continue;
      if (s.includes(t) && (!best || t.length > best.laenge)) best = {sym: o.instrument, laenge: t.length};
    }
  }
  return best ? best.sym : null;
}
function basisVon(pos){
  if (!pos) return null;
  if (pos.basis) return {sym: String(pos.basis).toUpperCase(), art:'turbo',
                         richtung: pos.basis_richtung || 'long'};
  const s = String(pos.sym||'').toUpperCase();
  if (BASISWERT[s]) return BASISWERT[s];
  const geraten = errateBasis(s);
  return geraten ? {sym: geraten, art:'turbo', richtung:'long', geraten:true} : null;
}
/* Marktbreite: wie viel Prozent der gescannten Aktien stehen ueber ihrem Stand von vor
   einem Quartal. Das ist die ehrlichste Zahl, die sich fuer einen Welt-ETF aus den
   vorhandenen Daten bilden laesst — ein Index steigt, wenn die Mehrheit steigt. */
function marktbreite(){
  const a = (S?.gesamt||[]).filter(o => o.klasse === 'aktien'
    && o.zusatz && o.zusatz.renditen && o.zusatz.renditen.r63 != null);
  if (a.length < 10) return null;
  const oben = a.filter(o => o.zusatz.renditen.r63 > 0).length;
  return {anteil: oben / a.length * 100, n: a.length, oben};
}

/* ============================================= URTEIL ZU EINER POSITION

   Hier steckte ein Denkfehler, und zwar ein teurer.

   Das Depot benutzte den SCORE aus der Rangliste. Der Score beantwortet aber eine ganz
   andere Frage: „Gibt es hier GERADE JETZT einen guten Einstieg?" Bei einem Wert, in dem
   man laengst drin ist, steht da fast immer eine kleine Zahl — nicht weil die Position
   schlecht waere, sondern weil der Einstieg vorbei ist. Solana stand auf 5 von 100, Fetch
   auf 3, Render auf 2. Das Depot sagte deshalb bei fast allem „REDUZIEREN". Ein Rat, der
   immer gleich lautet, ist kein Rat, sondern ein kaputtes Messgeraet.

   Gemessen wird jetzt, was fuer eine BESTEHENDE Position zaehlt: die relative Staerke
   innerhalb der eigenen Klasse — jeder Coin gegen alle anderen gescannten Coins, jede
   Aktie gegen alle anderen Aktien.

   Nachgemessen am 27.09. (24 Coins seit 2024, 103 Aktien seit 2024, je Hälfte IS/OOS):
   Führer liefen danach leicht besser als ihre Klasse, Schlusslichter aber NICHT
   schlechter — Coins nach 28 Tagen im Schnitt sogar +1,1 % über der Klasse, Aktien nach
   42 Tagen +0,4 %. Der Satz „ein Nachzügler bleibt meistens einer", auf dem bis dahin
   „REDUZIEREN" und „ein Drittel verkaufen" standen, hält den eigenen Daten nicht stand.
   Schwäche heisst deshalb jetzt BEOBACHTEN (nicht nachkaufen) — verkauft wird über den
   Stop, die gedrehte Analyse oder einen zu grossen Klumpen, nicht über die Rangliste.

   Der Score bleibt auf der Karte sichtbar — er sagt weiterhin etwas darueber, ob man HEUTE
   nachkaufen wuerde. Er entscheidet nur nicht mehr ueber das Halten. */
const RS_FUEHRER = 70, RS_MITTE = 45, RS_SCHWACH = 25;
function haltUrteil(row){
  if (!row) return null;
  const rs = row.rs;
  const ren = (row.zusatz && row.zusatz.renditen) || {};
  const gegen = row.richtung === 'short';
  if (rs == null){
    const t = ren.r21;
    if (t == null) return {urteil:'HALTEN', kl:'', rs:null, ren, gegen,
                           grund:'zu wenig Historie für einen Klassenvergleich'};
    return t >= 0
      ? {urteil:'HALTEN', kl:'gut', rs:null, ren, gegen, grund:'eigene Rendite positiv'}
      : {urteil:'BEOBACHTEN', kl:'warn', rs:null, ren, gegen, grund:'eigene Rendite negativ'};
  }
  let urteil, kl;
  if (rs >= RS_FUEHRER)      { urteil = 'STARK HALTEN'; kl = 'gut'; }
  else if (rs >= RS_MITTE)   { urteil = 'HALTEN';       kl = 'gut'; }
  else                       { urteil = 'BEOBACHTEN';   kl = 'warn'; }
  // Ein aktuelles Short-Setup im eigenen Wert hebt kein Halten auf, deckelt es aber.
  if (gegen && kl === 'gut'){ urteil = 'BEOBACHTEN'; kl = 'warn'; }
  return {urteil, kl, rs, ren, gegen};
}

/* ======================================================= HEBEL / TURBO

   „Ich arbeite mit Hebel — gib mir an, was für einen Hebel ich drin habe, den Knock-out,
   und dann schätzt du das alles besser ein. Ich habe weniger Kapital als andere."

   Ein Turbo ist kein eigener Markt, sondern eine einfache Formel auf seinen Basiswert:

       Scheinpreis ≈ (Kurs des Basiswerts − Knock-out-Schwelle) / Bezugsverhältnis

   Daraus folgt alles Weitere von selbst — und zwar ohne Schätzung:

       Hebel       = Basiskurs / (Basiskurs − Schwelle)
       Puffer      = (Basiskurs − Schwelle) / Basiskurs

   Der Puffer ist die wichtigste Zahl, die es bei einem Schein gibt: er sagt, wie weit
   der Basiswert fallen darf, bevor das Papier **wertlos verfällt**. Nicht „im Minus" —
   weg. Ein Stop nützt dagegen nichts, wenn die Schwelle über Nacht gerissen wird.

   Deshalb bekommt der Puffer die höchste Priorität unter allen Depotregeln: vor Stop,
   vor Ziel, vor allem. Und deshalb werden die drei Turbos jetzt echt bewertet, statt mit
   einem von Hand eingetragenen Wert dazustehen.

   Die Umrechnung in Euro ist bewusst schlicht (Kurs des Basiswerts geteilt durch den
   Eurokurs). Ein Emittent rechnet mit Aufgeld, Finanzierungskosten und manchmal
   Währungssicherung; das steht so auch auf der Karte. Für die Frage „wie nah bin ich an
   der Schwelle" ist die Rechnung trotzdem richtig — und das ist die Frage, die zählt. */
const KO_PUFFER_ENG = 12;     // Prozent — darunter wird es ernst
const KO_PUFFER_KRITISCH = 6; // Prozent — darunter ist es eine Handlung, keine Warnung

/* Margin statt Schein: kein Knock-out, aber eine Liquidationsschwelle.

   Bei einer gehebelten Position auf Bybit gibt es kein Zertifikat mit Schwelle — die
   Boerse schliesst die Position, wenn die Sicherheit aufgebraucht ist. Bei 5× ist das
   ungefaehr 20 % unter dem Einstieg, bei 10× rund 10 %. Genau ist es das nicht: Gebuehren
   und Erhaltungsmarge verschieben die Marke etwas nach oben, und ein Nachschuss verschiebt
   sie nach unten. Als Warnschwelle taugt die Rechnung trotzdem — und sie ist ehrlicher
   als gar keine Zahl.

   Was hier NICHT passiert: den Gewinn mit dem Hebel multiplizieren. Ozans App zeigt den
   Gewinn in Euro und Dollar, und der haengt an der Stueckzahl, nicht am Hebel. Der Hebel
   entscheidet, wie viel EIGENES Geld dahintersteckt — und damit, wie schnell es weg ist. */
function margenLage(pos, kurs){
  const h = Number(pos && pos.hebel);
  if (!isFinite(h) || h <= 1 || kurs == null || !pos.einstieg) return null;
  const lang = (pos.hebel_richtung || 'long') === 'long';
  const liq = lang ? pos.einstieg * (1 - 1/h) : pos.einstieg * (1 + 1/h);
  const abstand = lang ? kurs - liq : liq - kurs;
  return {
    art: 'margin', hebel: h, liquidation: liq, lang,
    ausgeknockt: abstand <= 0,
    puffer_pct: abstand / kurs * 100,
    einsatz: (pos.menge * pos.einstieg) / h,
  };
}

function hebelLage(pos, basisRow, eurusd){
  if (!pos || pos.ko == null || !basisRow) return null;
  const basisKurs = basisRow.kurs;
  if (basisKurs == null || !isFinite(basisKurs)) return null;
  const ko = Number(pos.ko);
  if (!isFinite(ko) || ko <= 0) return null;
  const lang = (pos.hebel_richtung || 'long') === 'long';
  const abstand = lang ? basisKurs - ko : ko - basisKurs;
  if (abstand <= 0) return {ausgeknockt: true, basisKurs, ko, lang};
  const ratio = (pos.ratio != null && Number(pos.ratio) > 0) ? Number(pos.ratio) : 1;
  const scheinBasis = abstand / ratio;          // in der Währung des Basiswerts
  const rw = basisRow.waehrung === 'EUR' ? 'EUR' : 'USD';
  const pw = posWaehrung(pos);
  let schein = scheinBasis;
  if (pw !== rw && eurusd) schein = pw === 'EUR' ? scheinBasis / eurusd : scheinBasis * eurusd;
  return {
    ausgeknockt: false, basisKurs, ko, lang, ratio,
    schein,
    hebel: basisKurs / abstand,
    puffer_pct: abstand / basisKurs * 100,
  };
}

function bewertePosition(pos){
  const row = istSchein(pos) ? scanRowGenau(pos.sym) : scanRow(pos.sym);
  const live = L.get(pos.sym) || (row ? L.get(row.instrument) : null);
  const roh = live ? live.p : (row ? row.kurs : null);
  let kurs = inPositionsWaehrung(row, roh, pos);
  const w = posWaehrung(pos);

  /* Ein Schein mit Knock-out wird aus seinem Basiswert gerechnet, nicht geschaetzt.
     Der Basiswert hat einen Livekurs — damit hat der Schein auch einen. */
  let hebel = null;
  // Gehebelt ohne Schein: die Boerse liquidiert, statt dass ein Zertifikat verfaellt.
  if (pos.ko == null && pos.hebel){
    hebel = margenLage(pos, kurs);
    if (hebel) hebel.basisName = posName({pos, row});
  }
  if (pos.ko != null){
    const bv = basisVon(pos);
    const brow = bv && bv.sym ? scanRow(bv.sym) : null;
    if (brow){
      const bl = L.get(brow.instrument);
      const browLive = bl ? {...brow, kurs: bl.p} : brow;
      hebel = hebelLage(pos, browLive, (brow.eurusd || (S && S.eurusd)));
      if (hebel && !hebel.ausgeknockt) kurs = hebel.schein;
      if (hebel) hebel.basisName = brow.name || bv.sym;
      if (hebel) hebel.basisSym = bv.sym;
    }
  }
  /* Nicht alles im Depot steht im Scan: ein ETF, ein Turbo-Zertifikat, ein
     ausgelisteter Coin. Fuer die gibt es keinen Kurs — und ohne Kurs stand die Position
     vorher mit leerem Wert da, als waere sie nichts wert. Deshalb duerfen Wert und
     Einstand auch von Hand kommen; auf der Karte steht dann, dass es so ist. */
  const wert = (kurs != null && pos.menge) ? kurs * pos.menge
             : (pos.wert_manuell != null ? pos.wert_manuell : null);
  const einstand = pos.einstieg && pos.menge ? pos.einstieg * pos.menge
                 : (pos.einstand_manuell != null ? pos.einstand_manuell : null);
  const gv = (wert != null && einstand != null) ? wert - einstand : null;
  const gvPct = (gv != null && einstand) ? gv / einstand * 100 : null;
  /* R misst gegen DEINEN Stop. Bis 01.10. stand hier die Invalidierung des frischen
     Scan-Setups — bei Mondelez die eines SHORTS, gegen eine gekaufte Position: „R −1,11"
     auf einer Karte, die gleichzeitig „kein Stop" sagte. Ohne eigenen Stop kein R, und
     liegt der Stop schon im Gewinn, gibt es kein Risiko mehr, gegen das man messen kann. */
  let r = null;
  const eigenerStop = pos.plan && pos.plan.stop != null && isFinite(pos.plan.stop) ? pos.plan.stop : null;
  const posKurz = (pos.plan && pos.plan.richtung === 'short') || pos.hebel_richtung === 'short';
  if (eigenerStop != null && pos.einstieg && kurs != null && !(pos.plan && pos.plan.ebene === 'basis')){
    const risiko = posKurz ? eigenerStop - pos.einstieg : pos.einstieg - eigenerStop;
    if (risiko > 0) r = (posKurz ? pos.einstieg - kurs : kurs - pos.einstieg) / risiko;
  }
  const score = row ? row.score : null;
  const halt = haltUrteil(row);
  let urteil = halt ? halt.urteil : 'UNBEKANNT';
  let kl = halt ? halt.kl : '';

  /* Kein eigener Scan-Eintrag? Dann ueber den Basiswert. Der Schein selbst bleibt
     unbewertbar — was der Basiswert macht, ist trotzdem die halbe Antwort. */
  let basis = null;
  if (!row){
    const b = basisVon(pos);
    if (b && b.art === 'breit'){
      const br = marktbreite();
      const lage = (S && S.makro && S.makro.regime) || 'neutral';
      if (br){
        basis = {art:'breit', breite: br, lage};
        if (lage === 'risk_off' || br.anteil < 35){ urteil = 'BEOBACHTEN'; kl = 'warn'; }
        else if (br.anteil < 25){ urteil = 'REDUZIEREN'; kl = 'bad'; }
        else { urteil = 'HALTEN'; kl = 'gut'; }
      }
    } else if (b && b.sym){
      const brow = scanRow(b.sym);
      if (brow){
        basis = {art:'turbo', sym: b.sym, row: brow, richtung: b.richtung || 'long',
                 geraten: !!b.geraten};
        /* Bis 27.09. entschied hier der SCORE des Basiswerts (unter 40 → REDUZIEREN). Der
           Score misst aber, ob HEUTE ein guter Einstieg da ist — genau der Denkfehler, der
           oben beim Halte-Urteil beschrieben ist. Bei einem laufenden Schein steht da fast
           immer eine kleine Zahl, und die App riet bei fast jedem Turbo zum Verkaufen.
           Jetzt wie bei jeder anderen Position: gegen die These nur mit einem HANDELBAREN
           Gegen-Setup, sonst die relative Stärke des Basiswerts (bei Short gespiegelt).
           Der Knock-out-Abstand wird davon getrennt und vorrangig bewertet. */
        const gegenlaeufig = (brow.richtung === 'short') === (basis.richtung === 'long')
                          && brow.richtung != null;
        const hb = haltUrteil(brow);
        const rsEff = hb && hb.rs != null ? (basis.richtung === 'short' ? 100 - hb.rs : hb.rs) : null;
        basis.rs = rsEff;
        basis.gegen = gegenlaeufig ? (brow.handelbar ? 'setup' : 'neigung') : null;
        if (gegenlaeufig && brow.handelbar){ urteil = 'GEGEN DIE THESE'; kl = 'bad'; }
        else if (gegenlaeufig){ urteil = 'BEOBACHTEN'; kl = 'warn'; }
        else if (rsEff == null || rsEff >= RS_MITTE){ urteil = 'HALTEN'; kl = 'gut'; }  // nie STARK — mit Hebel nie
        else { urteil = 'BEOBACHTEN'; kl = 'warn'; }
      }
    }
  }
  return {pos, row, kurs, wert, einstand, gv, gvPct, r, score, urteil, kl,
          live: !!live, w, basis, halt, hebel};
}

/* ================================================== AUSSTIEGSPLAN
   „Wenn ich reingehe und kaufe, soll er mir auch sagen, wann ich wieder verkaufe."

   Ein Einstiegssignal ohne Ausstiegsplan ist ein halbes Signal — und die schlechtere
   Haelfte. Die eigene Bilanz zeigt es schwarz auf weiss: mit Teilverkauf am ersten
   Ziel und Stop auf Einstand waeren aus −24,5 R nur −16,5 R geworden. Acht R
   Unterschied, allein durch das Verhalten NACH dem Einstieg.

   Deshalb wird der Plan beim Kauf mitgespeichert und hier bei jedem Kurs neu
   ausgerechnet. Er sagt genau einen naechsten Schritt — nicht fuenf Moeglichkeiten. */

/* Wann Ziele ueberhaupt gelten.

   Ozan, 28.09.: „In meinem Portfolio sagt er bei mehreren Sachen, ich soll schon Teil
   verkaufen, obwohl du selber meintest, das wäre nicht so sinnvoll."

   Der Fehler lag hier: fuer eine Position, die Ozan von Hand eingetragen hat (also sein
   ganzes bestehendes Depot), uebernahm die App beim ersten Setzen des Stops auch die
   ZIELE des gerade laufenden Setups — eines kurzfristigen Trades, den er nie gemacht
   hat. Lief der Kurs zwei Prozent, stand dort „Ziel 1 erreicht — ein Drittel verkaufen".
   Das ist ein Plan fuer einen anderen Trade, nicht fuer seine Position.

   Ziele gelten deshalb nur, wenn sie zur Position gehoeren:
     * gekauft ueber „Gekauft — ins Depot" auf einer Signalkarte (dann ist es genau
       dieser Trade, mit genau diesem Plan),
     * oder von Ozan selbst gesetzt bzw. ausdruecklich als Vorschlag uebernommen.
   Von der App automatisch gesetzte Ziele gelten nicht. Gehaltene Positionen haben einen
   Stop, der nachgezogen wird — verkauft wird, wenn er faellt. */
function zieleGelten(pl){
  if (!pl) return false;
  if (pl.gekauft) return true;
  return pl.quelle === 'selbst' || pl.quelle === 'analyse' || pl.quelle === 'selbst_nachgezogen';
}
function naechsterSchritt(pos, kurs, wPos){
  const pl = pos && pos.plan;
  if (!pl || kurs == null || !isFinite(kurs)) return null;
  const lang = (pl.richtung || 'long') === 'long';
  const erledigt = new Set(pos.erledigt || []);
  const erreicht = (ziel) => ziel != null && (lang ? kurs >= ziel : kurs <= ziel);
  const d = digits(kurs);
  const basis = pl.ebene === 'basis';
  const w = pl.waehrung === 'EUR' ? ' €' : (pl.waehrung === 'USDT' ? ' USDT'
          : (basis ? ' $' : (wPos ? waehrungsZeichen(wPos) : '')));
  const wer = basis ? `${pl.basis_name || 'Der Basiswert'} steht` : 'Der Kurs steht';

  // 1 — Stop zuerst. Wenn der gerissen ist, ist alles andere egal.
  if (pl.stop != null && (lang ? kurs <= pl.stop : kurs >= pl.stop)){
    return {stufe:'stop', titel:'Stop erreicht — raus',
      text:`${wer} bei ${num(kurs,d)}${w}, der Stop lag bei ${num(pl.stop,d)}${w}. `
        + 'Die Idee ist widerlegt. Verkaufen, nicht nachverhandeln — genau hier entstehen '
        + 'aus kleinen Verlusten grosse.'};
  }
  // 2 — Ziele der Reihe nach — aber nur, wenn sie zu DIESER Position gehören.
  const zg = zieleGelten(pl);
  const ziele = [['TP1', zg ? pl.tp1 : null, 'ein Drittel'], ['TP2', zg ? pl.tp2 : null, 'das zweite Drittel'],
                 ['TP3', zg ? pl.tp3 : null, 'den Rest']];
  for (const [marke, ziel, teil] of ziele){
    if (ziel == null || erledigt.has(marke)) continue;
    if (erreicht(ziel)){
      const danach = marke === 'TP1'
        ? ' Danach den Stop auf deinen Einstieg ziehen — ab da kann der Trade nichts mehr kosten.'
        : (marke === 'TP2' ? ' Stop auf das erste Ziel nachziehen.' : ' Damit ist der Trade zu.');
      return {stufe:'ziel', marke, titel:`${marke} erreicht — ${teil} verkaufen`,
        text:`Kurs ${num(kurs,d)}${w}, Ziel war ${num(ziel,d)}${w}. ${teil.charAt(0).toUpperCase()+teil.slice(1)} `
          + 'verkaufen.' + danach};
    }
  }
  // 3 — Noch unterwegs: sagen, wohin und wie weit.
  const naechstes = ziele.find(([m,z]) => z != null && !erledigt.has(m));
  if (!naechstes){
    // Ein Plan, der nur aus einem Stop besteht, ist kein halber Plan — fuer eine
    // laufende Position ist er oft der ganze. „Kein Ziel" heisst dann nicht „fertig",
    // sondern: laufen lassen, solange der Stop haelt.
    // Nur Ziel-Marken zaehlen hier. In ``erledigt`` stehen seit 28.09. auch abgehakte
    // Teilverkaufs-Regeln (ko_eng, gegen) — die beenden keinen Plan.
    if (pl.stop != null && !['TP1','TP2','TP3'].some(m => erledigt.has(m))){
      const weg = Math.abs(kurs - pl.stop) / kurs * 100;
      return {stufe:'halten', titel:'Halten — Stop steht',
        text:(basis ? `${wer} bei ${num(kurs,d)}${w}. ` : '')
          + `Kein festes Ziel, aber ein Stop ${basis ? 'auf ' + (pl.basis_name || 'den Basiswert') + ' ' : ''}bei ${num(pl.stop,d)}${w} — `
          + `${weg.toFixed(1).replace('.',',')} % entfernt. Laufen lassen — läuft der Kurs `
          + `davon, zieht die App den Stop nach (${lang ? 'nur nach oben' : 'bei einem Short nur nach unten'}, nie zurück). Verkauft wird, `
          + 'wenn der Stop fällt, nicht wenn es sich unangenehm anfühlt.'};
    }
    return {stufe:'fertig', titel:'Alle Ziele erreicht',
      text:'Es gibt keinen Plan mehr. Entweder schliessen oder bewusst neu entscheiden.'};
  }
  const [m, z] = naechstes;
  const wegZiel = Math.abs(z - kurs) / kurs * 100;
  const wegStop = pl.stop != null ? Math.abs(kurs - pl.stop) / kurs * 100 : null;
  return {stufe:'halten', titel:'Halten',
    text:`Bis ${m} sind es ${wegZiel.toFixed(1).replace('.',',')} %`
      + (wegStop != null ? `, bis zum Stop ${wegStop.toFixed(1).replace('.',',')} %` : '')
      + `. Verkauft wird bei ${num(z,d)}${w}, ausgestoppt bei ${pl.stop!=null?num(pl.stop,d)+w:'—'}. `
      + 'Nichts tun ist hier die Arbeit.'};
}

/* Ein Stop, den die App aus der laufenden Analyse ableiten kann — oder ehrlich: keiner.

   Positionen, die von Hand eingetragen wurden (also das ganze bestehende Depot), hatten
   bisher gar keinen Ausstiegsplan. Damit lief auch kein einziger Verkaufsalarm: die App
   konnte melden, wenn ein Stop faellt, nur hatte keine dieser Positionen einen.

   Erfunden wird hier nichts. Gibt die Analyse eine Invalidierung her, steht sie als
   Vorschlag da — zum Uebernehmen mit einem Klick. Gibt sie keine her, sagt die App das
   und laesst Ozan selbst eine Zahl eintragen. Ein selbst gesetzter Stop, den die App
   ueberwacht, ist unendlich viel mehr wert als ein ausgedachter. */
/* Der Kurs, auf dem der Stop einer Position gefuehrt wird. Bei einem Schein ist das
   der BASISWERT: „faellt TSMC unter X, raus". Eine Marke auf den Schein selbst waere mit
   einem Posten fuer alle Scheine keine Zahl, die sich beim Broker eintragen liesse. */
function basisKursVon(b){
  if (b && b.hebel && b.hebel.basisKurs != null && isFinite(b.hebel.basisKurs)) return b.hebel.basisKurs;
  const br = b && b.basis && b.basis.row;
  if (!br) return null;
  const bl = L.get(br.instrument);
  return bl ? bl.p : br.kurs;
}
function planKurs(b){
  const pl = b && b.pos && b.pos.plan;
  return (pl && pl.ebene === 'basis') ? basisKursVon(b) : (b ? b.kurs : null);
}

/* Gueltige Stopmarken aus der Analyse — schon in der Waehrung der Ebene.

   Zwei Quellen, dieselben wie im Waechter auf GitHub (portfolio_intel/depot_stops.py):
     * die Invalidierung des laufenden Setups — eng, aber nur da, wo es ein Setup gibt;
     * der Halte-Stop (Chandelier aus Tageskerzen) — fuer JEDEN Wert mit Kerzen.
   Seit dem 27.09. steht der zweite in jeder Scan-Zeile. Vorher blieb eine Position ohne
   frisches Setup ganz ohne Stop — und damit ohne Verkaufsalarm. */
/* Seit 01.10.: die Invalidierung eines Setups nur noch fuer Positionen, die ueber ein
   Signal gekauft wurden (``mitSetup``) — und nur, wenn das Setup in DIESELBE Richtung
   zeigt. Vorher nahm die App jede Invalidierung unter dem Kurs, auch die eines SHORTS,
   dessen These der Kurs gerade ueberrollt hatte. Bei Sei lag der Long-Stop so bei
   0,07243 — direkt unter dem Kurs —, und die Karte rief „Stop gerissen — alles
   verkaufen" bei einem Coin, der staerker lief als drei Viertel seiner Klasse.
   Fuer gehaltene Positionen gilt nur noch der Halte-Stop: er ist der einzige, der gemessen
   ist (docs/HALTE-STOP-STUDIE-2026-09.md). Eine Setup-Marke ist fuer einen NEUEN Einstieg
   gebaut, eng, mit 1 bis 3 % Abstand — als Stop fuer eine laufende Position verkauft sie
   im Rauschen, und zwei Wochen spaeter steht der Kurs hoeher. */
function stopKandidaten(r, lang, kurs, um, mitSetup){
  const aus = [];
  if (!r || kurs == null || !isFinite(kurs)) return aus;
  const inv = mitSetup && r.richtung === (lang ? 'long' : 'short') ? um(r.invalidierung) : null;
  if (inv != null && isFinite(inv) && (lang ? inv < kurs : inv > kurs))
    aus.push({stop: inv, art: 'setup', grund: 'die laufende Analyse (Invalidierung des Setups)'});
  const h = r.halte || {};
  const ch = um(lang ? h.stop_long : h.stop_short);
  if (ch != null && isFinite(ch) && ch > 0 && (lang ? ch < kurs : ch > kurs))
    aus.push({stop: ch, art: 'halte', grund: `Halte-Stop (${h.k || 5}× Tagesschwankung `
      + `${lang ? 'unter dem 22-Tage-Hoch' : 'über dem 22-Tage-Tief'})`});
  return aus;
}

/* Ein Schein, bei dem jede Marke aus der Analyse jenseits der Knock-out-Schwelle laege.
   Dann ist die Schwelle selbst der Stop — und die Karte darf nicht „wichtigste Lücke"
   rufen, als haette die App nichts gefunden. Liefert die Schwelle oder null. */
function scheinSchwelleIstStop(b){
  const pos = b.pos;
  if (!istSchein(pos) || !b.hebel || b.hebel.ausgeknockt || b.hebel.art === 'margin') return null;
  const r = b.basis && b.basis.row;
  const bk = basisKursVon(b);
  const ko = pos.ko != null && isFinite(Number(pos.ko)) ? Number(pos.ko) : null;
  if (!r || bk == null || ko == null) return null;
  const lang = stopRichtungLang(pos);
  const alle = stopKandidaten(r, lang, bk, v => v == null ? null : Number(v));
  if (!alle.length) return null;
  return alle.every(x => lang ? x.stop <= ko : x.stop >= ko) ? ko : null;
}

/* Ein Stop, den die App aus der laufenden Analyse ableiten kann — oder ehrlich: keiner.
   Erfunden wird nichts: gibt es weder Setup noch Tageskerzen, gibt es auch keine Marke. */
function stopVorschlag(b){
  const pos = b.pos;
  const lang = stopRichtungLang(pos);
  if (istSchein(pos)){
    const r = b.basis && b.basis.row;
    const bk = basisKursVon(b);
    if (!r || bk == null) return null;
    const ko = pos.ko != null && isFinite(Number(pos.ko)) ? Number(pos.ko) : null;
    // Eine Marke jenseits der Knock-out-Schwelle schuetzt nichts — vorher ist der Schein weg.
    const k = stopKandidaten(r, lang, bk, v => v == null ? null : Number(v))
      .filter(x => ko == null || (lang ? x.stop > ko : x.stop < ko));
    if (!k.length) return null;
    const best = k.reduce((a, c) => (lang ? c.stop > a.stop : c.stop < a.stop) ? c : a);
    return {stop: best.stop, grund: best.grund, art: best.art, ebene: 'basis',
            basisName: r.name || r.instrument, waehrung: r.waehrung === 'EUR' ? 'EUR' : 'USD',
            tp1: null, tp2: null, tp3: null, vomBasiswert: true};
  }
  const r = b.row;
  if (!r || b.kurs == null) return null;
  const um = (v) => v == null ? null : inPositionsWaehrung(r, v, pos);
  const k = stopKandidaten(r, lang, b.kurs, um, !!(pos.plan && pos.plan.gekauft));
  if (!k.length) return null;
  const best = k.reduce((a, c) => (lang ? c.stop > a.stop : c.stop < a.stop) ? c : a);
  const mitZielen = best.art === 'setup';   // der Halte-Stop hat keine Ziele
  return {stop: best.stop, grund: best.grund, art: best.art, ebene: 'position',
          tp1: mitZielen ? um(r.ziel) : null, tp2: mitZielen ? um(r.tp2) : null,
          tp3: mitZielen ? um(r.tp3) : null, vomBasiswert: false};
}

/* ══════════════════════════════════════════════════════════════════════════════
   STOPS, DIE DIE APP SELBST SETZT — UND SELBST NACHZIEHT

   Ozan: „die Stopps sollst du auch selber erst mal analysieren und danach selber sagen,
   und er soll auch nachgezogen werden — meine eigenen Portfolio-Stops habe ich nie
   gesetzt."

   Das war der wahre Zustand: zehn Positionen ohne Stop. Die App hatte einen Vorschlag,
   aber er stand hinter einem Knopf, den niemand drueckte. Ein Vorschlag, den keiner
   annimmt, schuetzt nichts.

   Ab jetzt setzt die App den Stop selbst, sobald die Analyse einen hergibt, und zieht
   ihn nach. Zwei Regeln, die nie gebrochen werden:

     * Ein Stop wandert NUR nach oben (bei Short nur nach unten). Ein nachgebender Stop
       ist kein Stop, sondern eine Ausrede.
     * Die App rueckt nie an einen selbst gesetzten Stop, ohne es zu sagen. Was sie
       aendert, steht oben im Depot als Liste — denn beim Broker liegt die Order, nicht
       hier, und die muss Ozan von Hand nachziehen.

   Die Ehrlichkeit dazu: diese App fuehrt keine Orders aus. Ein Stop hier ist eine
   Ueberwachung mit Alarm, keine Order an der Boerse. Deshalb sagt die Liste nicht
   „erledigt", sondern „beim Broker nachziehen". */

// Unter diesem Schritt lohnt das Nachziehen die Ordergebuehr nicht.
const TRAIL_MIN_SCHRITT_PCT = 0.4;

function stopRichtungLang(pos){
  if (pos && pos.plan && pos.plan.richtung === 'short') return false;
  if (pos && pos.hebel_richtung === 'short') return false;
  return true;
}

/* Was mit dem Stop dieser Position zu geschehen hat — ohne etwas zu schreiben.
   Dieselbe Regel wie im Waechter auf GitHub: nur in Richtung Sicherheit, nie auf oder
   ueber den Kurs, kleine Schritte nicht. */
function stopPflege(b){
  const pos = b.pos;
  if (istBar(pos)) return {art:'bar'};
  const ebene = istSchein(pos) ? 'basis' : 'position';
  const kurs = ebene === 'basis' ? basisKursVon(b) : b.kurs;
  if (kurs == null || !isFinite(kurs)) return {art:'ohne_kurs'};
  const lang = stopRichtungLang(pos);
  const v = stopVorschlag(b);
  const pl = pos.plan || null;
  const planEbene = (pl && pl.ebene) || 'position';
  const hat = pl && pl.stop != null && isFinite(pl.stop) && planEbene === ebene;

  if (!hat){
    // Ein von Hand gesetzter Stop auf den Schein selbst bleibt unangetastet.
    if (pl && pl.stop != null && planEbene !== ebene && pl.quelle === 'selbst')
      return {art:'steht', stop:pl.stop};
    if (!v) return {art:'keiner'};
    // Keine Ziele: fuer eine gehaltene Position setzt die App nur den Schutz (siehe zieleGelten).
    return {art:'neu', stop:v.stop, tp1:null, tp2:null, tp3:null, ebene,
            basisName:v.basisName, waehrung:v.waehrung, halteArt:v.art,
            vomBasiswert:v.vomBasiswert,
            grund:v.grund};
  }

  const besser = (a, c) => lang ? a > c : a < c;   // „weiter in Sicherheit"

  /* Einmalige Korrektur (01.10.): Stops, die die App frueher aus einer Setup-Marke gesetzt
     hat, auf einer Position, die NICHT ueber ein Signal gekauft wurde. Sie waren zu eng und
     teils aus der falschen Richtung (siehe stopKandidaten). Sie wandern auf den gemessenen
     Halte-Stop — das ist die einzige Stelle, an der ein Stop weiter weg rueckt, und sie
     steht deshalb ausdruecklich in der Liste „Beim Broker eintragen". Ein Stop, den Ozan
     selbst gesetzt hat, bleibt unangetastet. */
  // Auch ohne ``art`` (Stops aus der Zeit, bevor die App die Herkunft mitschrieb): was die
  // App gesetzt hat und weder Halte-Stop noch Einstand ist, war eine Setup-Marke.
  if (pl.art !== 'halte' && pl.art !== 'einstand' && pl.quelle === 'app' && !pl.gekauft && !pl.korrigiert){
    if (v && v.art === 'halte' && (lang ? v.stop < kurs : v.stop > kurs))
      return {art:'korrektur', von:pl.stop, stop:v.stop, ebene, halteArt:'halte',
        grund:'korrigiert: die alte Marke kam aus einem kurzfristigen Setup und lag zu eng '
          + '— für eine gehaltene Position gilt der gemessene Halte-Stop'};
  }
  let ziel = null, grund = '', art = pl.art || null;

  // Ziel 1 durch → auf den Einstieg. Ab da kann der Trade nichts mehr kosten.
  const erledigt = new Set(pos.erledigt || []);
  if (ebene === 'position' && erledigt.has('TP1') && pos.einstieg != null && besser(pos.einstieg, pl.stop)){
    ziel = pos.einstieg;
    grund = 'Ziel 1 ist abgehakt — ab dem Einstieg kann die Position nichts mehr kosten';
    art = 'einstand';
  }
  // Die Analyse (Setup oder Halte-Stop) gibt eine bessere Marke her.
  if (v && besser(v.stop, ziel != null ? ziel : pl.stop)){
    ziel = v.stop;
    grund = v.art === 'halte' ? 'der Halte-Stop ist mit dem Kurs nachgerückt'
                              : 'die laufende Analyse hat ihre Invalidierung nachgezogen';
    art = v.art;
  }
  if (ziel == null) return {art:'steht', stop:pl.stop};
  // Niemals auf oder ueber den aktuellen Kurs — das waere ein sofortiger Verkauf.
  if (lang ? ziel >= kurs : ziel <= kurs) return {art:'steht', stop:pl.stop};
  if (Math.abs(ziel - pl.stop) / kurs * 100 < TRAIL_MIN_SCHRITT_PCT)
    return {art:'steht', stop:pl.stop};
  return {art:'nachziehen', von:pl.stop, stop:ziel, grund, ebene, halteArt: art,
          selbst: pl.quelle === 'selbst'};
}

/* Einmal je Zeichendurchgang: setzen und nachziehen, und zurueckgeben, was passiert ist.
   Geschrieben wird nur, wenn sich wirklich etwas aendert — sonst wuerde der Speicher
   alle fuenf Sekunden ohne Not neu beschrieben. */
function stopsPflegen(bew){
  let a;
  try { a = ladePositionen(); } catch(e){ return []; }
  const geschehen = [];
  let geaendert = false;
  for (const b of bew){
    const p = stopPflege(b);
    if (!p || (p.art !== 'neu' && p.art !== 'nachziehen' && p.art !== 'korrektur')) continue;
    const pos = a.find(x => posSchluessel(x) === posSchluessel(b.pos));
    if (!pos) continue;
    const ebene = p.ebene || (pos.plan && pos.plan.ebene) || 'position';
    const vorher = (pos.plan && (pos.plan.ebene || 'position') === ebene) ? pos.plan : {};
    const alt = vorher.stop != null ? vorher.stop : null;
    pos.plan = {
      ...vorher,
      richtung: vorher.richtung || (stopRichtungLang(pos) ? 'long' : 'short'),
      waehrung: ebene === 'basis' ? (p.waehrung || vorher.waehrung || 'USD')
                                  : (vorher.waehrung || posWaehrung(pos)),
      ebene,
      ...(ebene === 'basis' ? {basis_name: p.basisName || vorher.basis_name || ''} : {}),
      art: p.halteArt || vorher.art || null,
      stop: p.stop,
      // Ziele nur beim ERSTEN Setzen dazu — spaeter wuerden sie einen abgehakten
      // Teilverkauf wieder auferstehen lassen.
      ...(p.art === 'neu' ? {tp1:p.tp1 ?? null, tp2:p.tp2 ?? null, tp3:p.tp3 ?? null} : {}),
      quelle: (vorher.quelle === 'selbst') ? 'selbst_nachgezogen' : 'app',
      ...(p.art === 'korrektur' ? {korrigiert: Date.now()} : {}),
      gesetzt: Date.now(),
      /* Offen, bis Ozan sagt, dass die Order beim Broker liegt.

         Zuerst stand die Liste nur in dem einen Zeichendurchgang da, in dem die Aenderung
         passierte. Das Depot zeichnet sich aber alle fuenf Sekunden neu und auch im
         Hintergrund — der Stop konnte also laengst gesetzt sein, bevor Ozan den Reiter
         ueberhaupt aufmacht. Dann haette die App brav einen Stop ueberwacht, den es beim
         Broker nie gab. Der Merker bleibt deshalb stehen, bis er abgehakt wird. */
      broker_offen: {von: alt, stop: p.stop, grund: p.grund || '', zeit: Date.now(),
                     ebene, korrektur: p.art === 'korrektur'},
    };
    geaendert = true;
    geschehen.push({b, art:p.art, von:alt, stop:p.stop, grund:p.grund, selbst:!!p.selbst});
  }
  if (geaendert) speicherePositionen(a);
  return geschehen;
}

/* Die Liste oben im Depot. Sie ist die Handlungsanweisung an den Broker — ohne sie
   waere der schoenste nachgezogene Stop eine Zahl, die nur in dieser App existiert. */
function stopKasten(geschehen, bew){
  const offen = bew.filter(b => {
    const p = stopPflege(b);
    return p && p.art === 'keiner' && scheinSchwelleIstStop(b) == null;
  });

  const broker = bew.filter(b => b.pos.plan && b.pos.plan.broker_offen);

  let h = '';
  if (broker.length){
    h += `<div class="note-box warn" style="margin:10px 0 0">
      <span class="nt">Beim Broker eintragen</span>

      Order liegt bei deinem Broker, nicht hier.</strong> Solange sie dort nicht liegt,

      ${broker.map(b => {
        const o = b.pos.plan.broker_offen;
        if (o.ebene === 'basis'){

          const db = digits(o.stop || 1);
          return `<p style="margin:8px 0 0;font-size:13px">
          <strong>${esc(posName(b))}</strong> — Marke auf ${bn} ${o.von != null
            ? `von ${num(o.von,db)}${zb} auf <strong>${num(o.stop,db)}${zb}</strong> nachgezogen`
            : `bei <strong>${num(o.stop,db)}${zb}</strong>`}
          <span style="color:var(--ink-3)">· Für den Schein gibt es beim Broker keine Order
            auf den Basiswert — die App und der Wächter melden sich, wenn ${bn} darunter fällt.</span>
          <button class="btn" data-brokerok="${esc(posSchluessel(b.pos))}"
                  style="margin-left:8px;padding:3px 9px;font-size:12px">verstanden</button></p>`;
        }
        const d = digits(b.kurs || o.stop || 1);

        return `<p style="margin:8px 0 0;font-size:13px">
          <strong>${esc(posName(b))}</strong> — Stop ${o.korrektur
            ? `von ${num(o.von,d)}${z} auf <strong>${num(o.stop,d)}${z}</strong> setzen (weiter weg — Korrektur)`
            : o.von != null
            ? `von ${num(o.von,d)}${z} auf <strong>${num(o.stop,d)}${z}</strong> nachziehen`
            : `neu auf <strong>${num(o.stop,d)}${z}</strong>`}
          <span style="color:var(--ink-3)">· ${esc(o.grund||'')}</span>
          <button class="btn" data-brokerok="${esc(posSchluessel(b.pos))}"
                  style="margin-left:8px;padding:3px 9px;font-size:12px">eingetragen</button></p>`;
      }).join('')}
      <p style="margin:10px 0 0"><button class="btn" id="pf_broker_alle">Alle eingetragen</button></p>
    </div>`;
  }
  if (offen.length){
    h += `<div class="note-box" style="margin:10px 0 0">
      <span class="nt">Ohne Stop — und die App kann hier keinen ableiten</span>
      <p style="font-size:13px">${offen.map(b=>esc(posName(b))).join(', ')}.
      Für diese Werte gibt die Analyse gerade keine Invalidierung her, also erfindet die
      App auch keine. Trag unten auf der Karte selbst eine Marke ein — ein eigener Stop,
      den die App überwacht, ist unendlich viel mehr wert als ein ausgedachter.</p></div>`;
  }
  return h;
}

function ausstiegsKasten(b, a){
  const schritt = naechsterSchritt(b.pos, planKurs(b), b.w);
  const hinw = a && a.hinweis
    ? `<p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">${esc(a.hinweis)}</p>` : '';
  if (!schritt){
    // Ohne Kurs kein Stop: bei einem Turbo oder einem ETF, der hier nur mit dem von Hand
    // eingetragenen Wert steht, waere eine Stopmarke eine Zahl ohne Gegenstueck.
    if (b.kurs == null){
      return `<div class="note-box" style="margin:10px 0 0"><span class="nt">Kein Ausstiegsplan</span>
        <p>Für diesen Posten hat die App keinen laufenden Kurs — nur den Wert, den du
        eingetragen hast. Einen Stop kann sie deshalb nicht überwachen.
        ${b.basis && b.basis.sym ? `Was sie kann: dir sagen, wenn <strong>${esc(name(b.basis.sym))}</strong>
        als Basiswert kippt — das steht oben im Urteil.` : ''}</p>${hinw}</div>`;
    }
    const schwelle = scheinSchwelleIstStop(b);
    if (schwelle != null){
      const bn = esc((b.hebel && b.hebel.basisName) || 'der Basiswert');
      return `<div class="note-box" style="margin:10px 0 0"><span class="nt">Was jetzt zu tun ist</span>
        <p style="font-size:14px;margin:0 0 4px"><strong>Halten — die Schwelle ist hier der Stop</strong></p>
        <p style="margin:0">Jede Marke aus der Analyse (Halte-Stop, Setup) läge unter der
        Knock-out-Schwelle bei ${num(schwelle, digits(schwelle))} — bevor sie greifen könnte,
        wäre der Schein schon weg. Deshalb setzt die App hier keinen eigenen Stop. Sie und der
        Wächter auf GitHub melden sich, wenn der Puffer von ${bn} bis zur Schwelle unter
        ${KO_PUFFER_ENG} % (eng) oder ${KO_PUFFER_KRITISCH} % (kritisch) fällt.</p>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Ist dir das zu nah, hilft
        kein Stop, sondern ein Schein mit mehr Abstand zur Schwelle — also weniger Hebel.</p>${hinw}</div>`;
    }
    const v = stopVorschlag(b);
    const d = digits(b.kurs || 1);
    const z = waehrungsZeichen(b.w);
    const sym = esc(b.pos.sym);
    const vorschlag = v ? `<p style="margin:6px 0 0">Aus der laufenden Analyse
        ${v.vomBasiswert ? '<em>des Basiswerts</em> ' : ''}ergibt sich:
        <strong>Stop ${num(v.stop,d)}${z}</strong>${v.tp1!=null?` · Ziel ${num(v.tp1,d)}${z}`:''}
        ${v.tp2!=null?` / ${num(v.tp2,d)}${z}`:''}${v.tp3!=null?` / ${num(v.tp3,d)}${z}`:''}
        ${v.vomBasiswert ? '<br><span style="color:var(--ink-3)">Achtung: das sind die Marken des '
          + 'Basiswerts. Für einen gehebelten Schein liegen sie anders — nur als Orientierung.</span>' : ''}</p>
      <p style="margin:8px 0 0"><button class="btn" data-plan="${sym}"
         data-stop="${v.stop}" data-tp1="${v.tp1==null?'':v.tp1}"
         data-tp2="${v.tp2==null?'':v.tp2}" data-tp3="${v.tp3==null?'':v.tp3}">Vorschlag übernehmen</button></p>`
      : `<p style="margin:6px 0 0">Die Analyse gibt hier gerade <strong>keine</strong>
         Invalidierung her — also erfindet die App auch keine. Setz den Stop dahin, wo der
         Grund, aus dem du gekauft hast, nicht mehr gilt.</p>`;
    return `<div class="note-box warn" style="margin:10px 0 0"><span class="nt">Kein Ausstiegsplan</span>
      <p>Diese Position hat keinen Stop — und damit meldet sich die App bei ihr auch nicht,
      wenn es eng wird. Das ist die wichtigste Lücke in deinem Depot.</p>
      ${vorschlag}
      <p style="margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <label style="font-size:12.5px;color:var(--ink-2)">eigener Stop</label>
        <input type="number" step="any" inputmode="decimal" data-stopfeld="${sym}"
               placeholder="${b.kurs!=null?num(b.kurs*0.9,d):'Preis'}"
               style="width:120px;padding:5px 7px;border:1px solid var(--linie);border-radius:6px;
                      background:var(--flaeche);color:var(--ink)">
        <label style="font-size:12.5px;color:var(--ink-2)">Ziel (optional)</label>
        <input type="number" step="any" inputmode="decimal" data-zielfeld="${sym}"
               style="width:120px;padding:5px 7px;border:1px solid var(--linie);border-radius:6px;
                      background:var(--flaeche);color:var(--ink)">
        <button class="btn" data-stopsetzen="${sym}">Stop speichern</button>
      </p>${hinw}</div>`;
  }
  const farbe = schritt.stufe === 'stop' ? 'bad' : (schritt.stufe === 'halten' ? '' : 'warn');
  const pl = b.pos.plan || {};
  const basis = pl.ebene === 'basis';
  const pk = planKurs(b);
  const d = digits(pk || b.kurs || 1);
  const w = pl.waehrung === 'EUR' ? ' €' : (pl.waehrung === 'USDT' ? ' USDT' : (basis ? ' $' : ''));
  const marken = planMarken(b);
  /* Bei einem Schein: was die Position an der Marke ungefaehr noch wert waere. Das ist
     die Zahl, die man im Depot beim Broker wiedererkennt. */
  let scheinSatz = '';
  const hb = b.hebel;
  if (basis && hb && !hb.ausgeknockt && pl.stop != null && hb.ko != null){
    const abst = hb.lang ? pl.stop - hb.ko : hb.ko - pl.stop;
    if (abst > 0){
      let je = abst / (hb.ratio || 1);
      const kEU = (b.basis && b.basis.row && b.basis.row.eurusd) || (S && S.eurusd);
      if (b.w === 'EUR' && pl.waehrung !== 'EUR' && kEU) je = je / kEU;
      const wert = je * (Number(b.pos.menge) || 1);
      scheinSatz = `<p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Fällt
        ${esc(pl.basis_name || 'der Basiswert')} auf die Marke, wäre deine Position noch rund
        <strong>${num(wert, 0)}${waehrungsZeichen(b.w)}</strong> wert. Die Marke liegt auf dem
        Basiswert, nicht auf dem Schein — beim Broker gibt es dafür keine eigene Order; die App
        und der Wächter auf GitHub melden sich, wenn sie fällt.</p>`;
    }
  }
  const halteSatz = pl.art === 'halte'
    ? `<p style="margin:6px 0 0;font-size:12px;color:var(--ink-3)">Halte-Stop — wird nur
        nachgezogen, nie gelockert. Warum und wie gemessen: „Mehr zur Analyse".</p>` : '';
  const titel = a && a.eigen ? a.titel : schritt.titel;
  const text = a && a.eigen ? a.text : schritt.text;
  const knopf = schritt.marke
    ? `<p style="margin:9px 0 0"><button class="btn" data-erledigt="${esc(b.pos.sym)}"
         data-marke="${esc(schritt.marke)}">${esc(schritt.marke)} verkauft — abhaken</button></p>`
    : '';
  return `<div class="note-box ${farbe}" style="margin:10px 0 0">
    <span class="nt">Was jetzt zu tun ist</span>
    <p style="font-size:14px;margin:0 0 4px"><strong>${esc(titel)}</strong></p>
    <p style="margin:0">${esc(text)}</p>
    <div class="kpi" style="margin-top:8px">${marken}</div>${scheinSatz}${halteSatz}${hinw}${knopf}</div>`;
}

/* ================================================ URTEIL JE POSITION
   „Analysier auch immer mein Portfolio — ob ich rausgehen soll oder reingehen."

   Der Scanner bewertet den Chart. Eine gehaltene Position braucht aber eine andere
   Frage als eine Chance: nicht „ist das ein guter Einstieg", sondern „wuerde ich das
   heute nochmal kaufen". Das ist dieselbe Information, anders herum gelesen — und sie
   faellt bei jedem Scan neu an, ohne dass jemand etwas anklicken muss.

   Was hier NICHT passiert: automatisch verkaufen, und so tun, als waere ein Score eine
   Anweisung. Jeder Satz sagt, worauf er beruht. */
function positionsRat(b){
  const r = b.row;
  const pos = b.pos;
  const gv = b.gvPct;
  const saetze = [];
  let stufe = 'neutral';

  if (!r){
    const ba = b.basis;
    if (ba && ba.art === 'turbo' && ba.row){
      const br = ba.row;
      const ren = (br.zusatz && br.zusatz.renditen) || {};
      const lauf = [];
      if (ren.r21 != null) lauf.push(`${ren.r21>=0?'+':''}${ren.r21.toFixed(0)} % im letzten Monat`);
      if (ren.r63 != null) lauf.push(`${ren.r63>=0?'+':''}${ren.r63.toFixed(0)} % im Quartal`);
      const saetze = [
        `Der Schein selbst laesst sich nicht scannen — sein Basiswert schon. `
        + `${name(ba.sym)}: ${br.headline || 'kein klares Bild'}`
        + (lauf.length ? ` (${lauf.join(', ')})` : '') + '.'];
      if (ba.gegen === 'setup') saetze.push('Die Analyse des Basiswerts zeigt gerade ein handelbares '
        + 'Setup GEGEN deine Richtung. Mit Hebel ist das der Moment, die Position zu verkleinern '
        + 'oder den Stop enger zu ziehen — nicht, sie auszusitzen.');
      else if (ba.gegen === 'neigung') saetze.push('Das Chartbild des Basiswerts neigt gegen deine '
        + 'Richtung, ohne handelbares Setup. Beobachten — und den Abstand zur Schwelle im Blick.');
      else if (ba.rs == null || ba.rs >= RS_MITTE) saetze.push('Solange der Basiswert traegt, '
        + 'traegt auch der Schein — nur schneller in beide Richtungen.'
        + (ba.rs != null ? ` Relative Stärke ${ba.rs.toFixed(0)} von 100.` : ''));
      else saetze.push(`Der Basiswert läuft schwächer als ${(100-ba.rs).toFixed(0)} % seiner Klasse. `
        + 'Nicht nachkaufen. Allein ein Verkaufsgrund ist das nicht — beim Schein entscheidet '
        + 'vor allem der Abstand zur Knock-out-Schwelle, und der wird oben eigens bewertet.');
      saetze.push(`Score ${br.score.toFixed(0)} (Note ${br.note}) heisst nur: so gut wäre ein `
        + 'NEUER Einstieg heute. Über das Halten sagt er nichts.');
      saetze.push('Wichtig: Stop und Ziele des Basiswerts sind NICHT die des Scheins. Der Hebel '
        + 'verschiebt jeden Abstand, und die genaue Schwelle steht nur im Papier des Emittenten.');
      if (ba.geraten) saetze.push('(Basiswert automatisch aus dem Namen erkannt — wenn das nicht '
        + 'stimmt, trag die Position mit dem richtigen Kuerzel neu ein.)');
      const stufe = ba.gegen === 'setup' ? 'bad'
                  : (ba.gegen || (ba.rs != null && ba.rs < RS_MITTE)) ? 'warn' : 'gut';
      return {stufe, kopf: 'Ueber den Basiswert ' + name(ba.sym), saetze};
    }
    if (ba && ba.art === 'breit'){
      const a = ba.breite.anteil;
      const saetze = [
        `Ein Welt-ETF hat keinen einzelnen Basiswert — er ist der Markt. Gemessen wird er `
        + `deshalb an der Marktbreite: ${ba.breite.oben} von ${ba.breite.n} gescannten Aktien `
        + `stehen ueber ihrem Stand von vor einem Quartal (${a.toFixed(0)} %).`];
      saetze.push(a >= 60
        ? 'Das ist ein breiter Markt. Genau dafuer ist so ein ETF da: er braucht keine einzelne '
          + 'Aktie, die funktioniert, sondern nur die Mehrheit.'
        : a >= 35
        ? 'Das ist ein gespaltener Markt — es traegt, aber es traegt nicht breit. Halten ist hier '
          + 'meist richtiger als handeln; ein Welt-ETF ist kein Instrument fuer Timing.'
        : 'Die Mehrheit faellt. Das ist der eine Fall, in dem auch ein Welt-ETF nicht diversifiziert '
          + 'ist — in einem breiten Abschwung faellt er mit.');
      saetze.push('Und der Punkt, der dabei oft untergeht: ein Welt-ETF ist der Teil des Depots, '
        + 'der NICHT beobachtet werden muss. Er ist die Gegenposition zu allem anderen hier.');
      const stufe = a >= 60 ? 'gut' : (a >= 35 ? 'neutral' : 'warn');
      return {stufe, kopf:'Ueber die Marktbreite', saetze};
    }
    return {stufe:'unbekannt', kopf:'Keine Bewertung',
      saetze:[ (pos.wert_manuell != null)
        ? 'Dieser Posten steht nicht im gescannten Universum und hat auch keinen erkennbaren '
          + 'Basiswert. Wert und Einstand hast du eingetragen, mehr kann die App dazu '
          + 'ehrlicherweise nicht sagen.'
        : 'Der Wert war im letzten Scan nicht dabei. Entweder ausserhalb des Universums '
          + 'oder die Datenquelle war stumm.' ]};
  }

  const h = b.halt || haltUrteil(r);
  /* „Gegen" heisst: das Setup zeigt gegen DEINE Position. Eine gekaufte Position gegen
     ein Short-Setup, ein Short-Schein gegen ein Long-Setup. */
  const posKurz = (pos.plan && pos.plan.richtung === 'short') || pos.hebel_richtung === 'short';
  const gegen = r.richtung === (posKurz ? 'long' : 'short');
  const mit = r.richtung === (posKurz ? 'short' : 'long');
  const score = r.score;
  const klasse = r.klasse === 'aktien' ? 'Aktien' : (r.klasse === 'krypto' ? 'Coins' : 'Werte');

  if (h && h.rs != null){
    const rs = h.rs;
    const monat = h.ren.r21, quartal = h.ren.r63;
    const lauf = [];
    if (monat != null) lauf.push(`${monat>=0?'+':''}${monat.toFixed(0)} % im letzten Monat`);
    if (quartal != null) lauf.push(`${quartal>=0?'+':''}${quartal.toFixed(0)} % im Quartal`);
    if (rs >= RS_FUEHRER){
      stufe = 'gut';
      saetze.push(`Läuft besser als ${rs.toFixed(0)} % der gescannten ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Relative Stärke hält meist über Wochen '
        + 'an — das ist die Position, die man am wenigsten anfassen sollte.');
    } else if (rs >= RS_MITTE){
      stufe = 'gut';
      saetze.push(`Mittelfeld: besser als ${rs.toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Kein Grund auszusteigen, aber auch keiner '
        + 'nachzulegen.');
    } else if (rs >= RS_SCHWACH){
      stufe = 'warn';
      saetze.push(`Nachzügler: nur besser als ${rs.toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Wenn der Rest der Klasse läuft und dieser '
        + 'Wert nicht, gibt es dafür meistens einen Grund. Beobachten, nicht nachkaufen.');
    } else {
      stufe = 'warn';
      saetze.push(`Schlusslicht: schwächer als ${(100-rs).toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Nicht nachkaufen. Ein Verkaufsgrund ist '
        + 'das allein aber nicht: in den eigenen Daten liefen Schlusslichter danach im Schnitt '
        + 'nicht schlechter als der Rest ihrer Klasse. Raus geht es über deinen Stop oder wenn '
        + 'die Analyse gegen dich dreht — nicht über den Tabellenplatz.');
    }
  } else if (h){
    stufe = h.kl === 'bad' ? 'bad' : (h.kl === 'warn' ? 'warn' : 'gut');
    saetze.push('Für einen Vergleich mit der eigenen Klasse fehlt die Historie — '
      + (h.grund || 'zu wenig Daten') + '.');
  }

  if (gegen){
    if (stufe === 'gut') stufe = 'warn';
    saetze.push(`Dazu kommt: die Analyse sieht hier gerade ein Setup nach ${posKurz ? 'OBEN' : 'UNTEN'}. Du hältst `
      + 'also gegen die Richtung, die das System sieht. Kein Verkaufsbefehl — aber der Moment, '
      + 'in dem ein Stop im Depot stehen sollte.');
  }
  /* Was nicht jeden Tag auf jeder Karte stehen muss, kommt in ``mehr`` — die Karte
     klappt es auf Wunsch auf. Ozan, 28.09.: „die Analysen gefallen mir nicht." Beim
     Nachsehen stand auf jeder Karte derselbe Satz „Einstiegsseite: Score 0 — kein
     frisches Setup", zweimal „Was jetzt zu tun ist" und technische Warnungen wie „Reihe
     auf H4 nicht frisch" bei Aktien am Wochenende. Oben bleibt nur, was entscheidet. */
  const mehr = [];
  if (score != null){
    /* Bis 01.10. hiess ein hoher Score immer „Zukauf vertretbar" — auch wenn er zu einem
       SHORT gehoerte. Bei Mondelez stand beides auf derselben Karte: „Setup nach unten"
       und „hier wäre sogar ein Zukauf vertretbar". */
    if (gegen){
      mehr.push(`Einstiegsseite: Score ${score.toFixed(0)} (Note ${r.note}) — aber für die `
        + 'Gegenrichtung. Für einen Zukauf spricht das nicht.');
    } else if (score >= 52 && mit){
      saetze.push(`Einstiegsseite: Score ${score.toFixed(0)} (Note ${r.note}) — hier wäre heute `
        + 'sogar ein Zukauf vertretbar.');
    } else {
      mehr.push(`Einstiegsseite: Score ${score.toFixed(0)} — kein frisches Setup. Das ist eine `
        + 'Aussage über den Einstieg, nicht über das Halten; für einen Zukauf fehlt gerade der Anlass.');
    }
  }

  if (gv != null && gv <= -20){
    saetze.push(`Du liegst ${Math.abs(gv).toFixed(0)} % im Minus. Die Frage ist nicht, wann es `
      + 'zurückkommt, sondern ob dieselbe These heute noch gilt. Ein Verlust wird nicht '
      + 'dadurch kleiner, dass man ihn aussitzt — begrenzt wird er vom Stop.');
  } else if (gv != null && gv >= 20){
    saetze.push(`${gv.toFixed(0)} % im Plus. Ohne festes Ziel gibt es keinen Grund auszusteigen `
      + '— der nachgezogene Stop sorgt dafür, dass aus dem Gewinn nicht wieder eine Null wird.');
  }
  // Datenwarnungen, die bei Aktien ausserhalb der Boersenzeit normal sind, sind fuer
  // eine gehaltene Position kein Gegenargument — sie verunsichern nur.
  const aktie = r.klasse === 'aktien';
  const warn = (r.warnungen||[]).filter(w => !(aktie && /nicht frisch|veraltet|alt\b/i.test(w)));
  if (warn.length) mehr.push('Dagegen: ' + warn.slice(0,2).join(' · '));

  const kopf = {gut:'Halten', warn:'Beobachten', bad:'Reduzieren erwägen',
                neutral:'Halten', unbekannt:'Keine Bewertung'}[stufe];
  return {stufe, kopf, saetze, mehr};
}

/* ============================================ WAS JETZT ZU TUN IST

   „Er soll mir bei den Sachen im Portfolio sagen: jetzt nochmal rein, oder jetzt ein
   wenig verkaufen. Er sieht ja auch, wie viel ich drin bin."

   Bisher stand auf der Karte ein Urteil („Beobachten") und ein Ausstiegsplan („bis TP1
   sind es 4 %"). Beides richtig, beides keine Handlung. Zwischen „die Struktur trägt
   nicht mehr" und „verkauf 0,6 Solana für 53 €" liegt genau der Schritt, den man morgens
   um sieben nicht selbst rechnen will.

   Hier wird er gerechnet. Die Regeln, in dieser Reihenfolge — die erste, die greift,
   gewinnt:

     1. Stop gerissen            → alles raus. Keine Diskussion, das ist der Zweck eines Stops.
     2. Ziel erreicht            → ein Drittel raus, Stop auf Einstand.
     3. Analyse zeigt nach unten → die Hälfte raus. Man hält gegen das, was man selbst misst.
     4. Schlusslicht der Klasse  → ein Drittel raus. Relative Schwäche bleibt eher, als dass
                                   sie dreht; genau hier liegt totes Kapital am längsten.
     5. Klumpen über 25 %        → auf 25 % zurückschneiden. Ein Depot, das an einem Wert
                                   hängt, ist kein Depot.
     6. Führender Wert MIT einem
        frischen Setup und Stop  → nachlegen, auf 0,5 % Risiko gerechnet.
     7. sonst                    → halten.

   Was hier ausdrücklich NICHT passiert: nachlegen, weil eine Position im Minus steht.
   Verbilligen fühlt sich nach Handeln an und ist das Gegenteil davon — es vergrössert
   genau die Position, die schon nicht funktioniert. Nachgelegt wird nur in Stärke, und
   nur, wenn es einen Stop gibt, gegen den sich die Grösse rechnen lässt. */
const ZIEL_GEWICHT = 12;    // Prozent des Depots, die ein Einzelwert anstrebt
const MAX_GEWICHT  = 25;    // darüber wird zurückgeschnitten
/* Und dasselbe eine Ebene höher: ein Bündel gemessen gleichlaufender Werte darf nicht
   über die Hälfte der Marktbewegung ausmachen, ohne dass die App aufhört, dort zum
   Nachlegen zu raten. 25 % für einen Einzelwert zu deckeln und gleichzeitig zehn Werte
   zu empfehlen, die sich alle zusammen bewegen, wäre eine Regel, die sich selbst
   aushebelt. */
const BUENDEL_MAX  = 50;
const NACHKAUF_RISIKO_PCT = 0.5;
/* Unter diesem Betrag lohnt keine Order. Bei Trade Republic kostet jede Ausführung 1 €:
   ein Teilverkauf über 11 € zahlt neun Prozent Gebühr, um elf Euro zu bewegen. Solche
   Vorschläge sind schlimmer als keine — sie sehen nach Handeln aus und verbrennen Geld.
   Fällt ein Teilverkauf darunter, wird stattdessen die ganze (kleine) Position geschlossen
   oder die Menge auf eine sinnvolle Ordergrösse angehoben. */
const MIN_ORDER_EUR = 25;

/* ================================== DEPOT AUF BEIDEN GERAETEN GLEICH

   „Das Portfolio, das ich hier auf dem Mac habe, habe ich nicht auf dem Handy. Auf dem
   Handy habe ich auch noch neue Sachen hinzugefügt. Die müssen verknüpft sein."

   Das Depot liegt bewusst nur im Browser — das Repo ist öffentlich, echte Depotdaten
   gehören da nicht hin. Der Preis dafür ist genau dieses Problem: zwei Geräte, zwei
   Speicher, zwei Wahrheiten. Ohne Server lässt sich das nicht automatisch auflösen.

   Was ohne Server geht: den ganzen Stand in einen Code packen, den man von einem Gerät
   zum anderen schickt — als Text oder als Link. Der Code enthält ALLES, was zu einer
   Position gehört: Menge, Einstieg, Konto, der gespeicherte Plan mit Stop und Zielen,
   abgehakte Ziele, von Hand eingetragene Werte. Der alte Text-Export konnte das nicht,
   er kannte nur vier Spalten.

   Und er überschreibt nicht blind. Beim Einsetzen wird zuerst verglichen und gezeigt,
   was neu ist und was sich ändert — sonst löscht ein Import vom Mac die Positionen, die
   nur auf dem Handy stehen. Genau das wäre hier passiert. */
const DEPOT_CODE_VERSION = 1;
function depotCode(){
  const daten = {v: DEPOT_CODE_VERSION, t: Date.now(), p: ladePositionen()};
  const roh = JSON.stringify(daten);
  try { return btoa(unescape(encodeURIComponent(roh))); } catch(e){ return roh; }
}
function ausDepotCode(text){
  let s = String(text||'').trim();
  if (!s) return null;
  // Auch einen ganzen Link akzeptieren — wer ihn sich selbst schickt, kopiert oft alles.
  const m = s.match(/[#?&]depot=([^&\s]+)/);
  if (m) s = decodeURIComponent(m[1]);
  let roh = s;
  if (!s.startsWith('{')){
    try { roh = decodeURIComponent(escape(atob(s.replace(/\s+/g,'')))); } catch(e){ return null; }
  }
  let d;
  try { d = JSON.parse(roh); } catch(e){ return null; }
  const liste = Array.isArray(d) ? d : (Array.isArray(d.p) ? d.p : null);
  if (!liste) return null;
  const sauber = liste.filter(x => x && typeof x.sym === 'string' && x.sym);
  /* ``k``: die Konten, die dieser Code VOLLSTÄNDIG beschreibt (ein Abgleich, etwa aus
     Screenshots). Für diese Konten gilt: was im Code fehlt, ist verkauft. Ohne ``k`` ist
     der Code wie bisher nur eine Liste — dann wird nie etwas als verkauft markiert. */
  const konten = (!Array.isArray(d) && Array.isArray(d.k)) ? d.k.map(String) : [];
  return sauber.length ? {liste: sauber, zeit: d.t || null, konten,
                          quelle: (!Array.isArray(d) && d.q) ? String(d.q) : ''} : null;
}
/* Schlüssel einer Position: Kürzel UND Konto. Denselben Coin auf zwei Börsen zu halten
   ist normal, und beim Zusammenführen dürfen die sich nicht gegenseitig auffressen. */
const posSchluessel = p => String(p.sym||'').toUpperCase() + '|' + String(p.konto||'').toLowerCase();

/* ================================================ DEPOT-ABGLEICH (seit 27.09.)

   „Update mein Portfolio" — mit Screenshots aus Kraken, Bybit und Trade Republic.

   Bisher verglich der Import nur das exakte Kürzel. Stand Solana im Depot als SOLEUR und
   kam im Code als SOLUSDT, waren das zwei Positionen: die alte blieb stehen, die neue kam
   dazu, und das Depot zeigte Solana doppelt. Und ein Import ersetzte die ganze Position —
   dein Stop, die abgehakten Ziele, der Knock-out waren danach weg, wenn der Code sie nicht
   selbst mitbrachte.

   Jetzt:
   * Verglichen wird die MÜNZE (SOLEUR = SOLUSD = SOLUSDT) bzw. bei Scheinen der
     BASISWERT, jeweils je Konto (Kraken, Bybit und Trade Republic in jeder Schreibweise).
   * Zusammengeführt wird FELDWEISE: was der Code mitbringt, gilt; was er nicht kennt
     (Stop, Ziele, abgehakte Teilverkäufe, Notizen), bleibt. Wechselt die Währung der
     Position (SOLEUR → SOLUSDT), wird der gespeicherte Plan umgerechnet statt in der
     falschen Währung stehen zu bleiben.
   * Ein Abgleich-Code nennt die Konten, die er vollständig beschreibt. Was dort im Depot
     steht, aber im Code fehlt, ist verkauft — und wird angezeigt, nicht stillschweigend
     gelöscht. Entfernt wird es nur mit dem eigenen Knopf dafür. */
function kontoNorm(k){
  const s = String(k||'').toLowerCase().replace(/[^a-z]/g, '');
  if (!s) return '';
  if (s === 'tr' || s.startsWith('traderepublic') || s.startsWith('trade')) return 'traderepublic';
  for (const b of ['bybit','kraken','binance']) if (s.includes(b)) return b;
  return s;
}
function abgleichKern(p){
  const s = String((p && p.sym) || '').toUpperCase();
  // Scheine (Turbo, Knock-out …) über ihren Basiswert — „TURBO-TSMC-LONG" und ein Turbo
  // mit basis TSM sind derselbe Posten. Nie über muenzeVon: die kürzt „TURBO-…" auf
  // „TURBO", und dann wären alle Scheine ein und derselbe.
  const scheinArtig = p && (p.ko != null || p.basis || /TURBO|KNOCK|MINI|LONG|SHORT|CALL|PUT/.test(s));
  if (scheinArtig){
    const b = basisVon(p);
    if (b && b.sym) return 'T:' + String(b.sym).toUpperCase() + (p.hebel_richtung === 'short' ? ':S' : '');
    return 'S:' + s;
  }
  if (s.includes('-') && !/-YFD$/.test(s)) return 'S:' + s;   // ETF, Freitext
  return muenzeVon(s);
}
/* Zu einer eingehenden Position die vorhandene finden: gleicher Kern und gleiches Konto;
   hat die vorhandene gar kein Konto eingetragen, reicht der Kern. */
function findeGegenstueck(p, vorhanden, schonVergeben){
  const kern = abgleichKern(p), konto = kontoNorm(p.konto);
  const frei = vorhanden.filter(q => !schonVergeben.has(q) && abgleichKern(q) === kern);
  return frei.find(q => kontoNorm(q.konto) === konto)
      || frei.find(q => !kontoNorm(q.konto))
      || null;
}
function depotVergleich(eingehend, konten, vorhanden){
  vorhanden = vorhanden || ladePositionen();
  const vergeben = new Set();
  const neu = [], geaendert = [], gleich = [], paare = [];
  for (const p of eingehend){
    const vorher = findeGegenstueck(p, vorhanden, vergeben);
    if (!vorher){ neu.push(p); paare.push([null, p]); continue; }
    vergeben.add(vorher);
    paare.push([vorher, p]);
    const zusammen = zusammenfuegen(vorher, p);
    if (JSON.stringify(zusammen) !== JSON.stringify(vorher)) geaendert.push(p);
    else gleich.push(p);
  }
  const nurHier = vorhanden.filter(q => !vergeben.has(q));
  const kset = new Set((konten || []).map(kontoNorm).filter(Boolean));
  const weg = kset.size ? nurHier.filter(q => kset.has(kontoNorm(q.konto))) : [];
  return {neu, geaendert, gleich, nurHier, weg, paare};
}
/* Feldweise: der Code gewinnt, das Depot behält, was der Code nicht kennt. */
function zusammenfuegen(alt, neu){
  const m = {...alt, ...neu};
  if (neu.plan == null && alt.plan) m.plan = alt.plan;
  if (neu.erledigt == null && alt.erledigt) m.erledigt = alt.erledigt;
  if (neu.seit == null && alt.seit) m.seit = alt.seit;
  const wa = posWaehrung(alt), wn = posWaehrung(m);
  if (m.plan && neu.plan == null && wa !== wn){
    const k = S && S.eurusd;
    if (k){
      const f = wn === 'EUR' ? 1 / k : k;        // EUR → USD: mal Kurs; USD → EUR: geteilt
      const pl = {...m.plan};
      for (const f2 of ['stop','tp1','tp2','tp3','einstieg']) if (pl[f2] != null) pl[f2] = pl[f2] * f;
      pl.waehrung = wn; pl.umgerechnet = wa + '→' + wn;
      m.plan = pl;
    } else {
      delete m.plan;       // lieber kein Stop als einer in der falschen Währung
    }
  }
  return m;
}
/* ``entfernen``: die Positionen, die als verkauft raus sollen — verglichen über ihren
   Inhalt, nicht über das Objekt. Zwischen Anzeige und Klick wird das Depot neu geladen,
   und ein neu geladenes Objekt ist nie dasselbe wie das angezeigte. */
function depotZusammenfuehren(eingehend, entfernen){
  const vorhanden = ladePositionen();
  const v = depotVergleich(eingehend, [], vorhanden);
  const raus = new Set((entfernen || []).map(q => JSON.stringify(q)));
  const gepaart = new Set(v.paare.map(([a]) => a).filter(Boolean));
  const bleibt = vorhanden.filter(q => !gepaart.has(q) && !raus.has(JSON.stringify(q)));
  const aus = v.paare.map(([a, p]) => a ? zusammenfuegen(a, p) : p);
  speicherePositionen([...bleibt, ...aus]);
}

/* Der Vergleich vor dem Einsetzen. Ohne ihn wuerde ein Import vom Mac genau die

    ${v.weg && v.weg.length ? `<p style="margin:9px 0 0;font-size:12.5px;color:var(--ink-2)">
      Der Code beschreibt ${esc(d.konten.join(', '))} vollständig${d.quelle ? ` (${esc(d.quelle)})` : ''}.
      Was dort im Depot steht, aber im Code fehlt, hast du offenbar verkauft.
      <strong>Abgleichen</strong> führt zusammen UND entfernt diese ${v.weg.length}.</p>
      <p style="margin:10px 0 0"><button class="btn" id="pf_code_abgleich">Abgleichen</button></p>` : ''}
    <p style="margin:10px 0 0"><button class="${v.weg && v.weg.length ? 'link' : 'btn'}" id="pf_code_merge">Nur zusammenführen</button>

  </div>`;

/* ======================================== DER DEPOT-WAECHTER AUF GITHUB

   „Die Stops auf meinem Portfolio 24/7 analysieren und immer neu setzen und mir Bescheid
   sagen." Rund um die Uhr heisst: auch wenn die App zu ist. Das kann nur der Lauf auf
   GitHub — und der kennt das Depot nur, wenn es als Geheimnis DEPOT_CODE hinterlegt ist.

   Hier steht deshalb sichtbar, ob er laeuft UND ob er denselben Stand kennt wie dieses
   Geraet. Verglichen wird ein Fingerabdruck (Symbol, Konto, Stueckzahl — gehasht); der
   Waechter veroeffentlicht nur diesen und ein paar Zaehler, nie Werte. */
async function depotKennung(positionen){
  const teile = (positionen || []).filter(p => p && p.sym).map(p =>
    `${String(p.sym).toUpperCase()}|${String(p.konto || '').toLowerCase()}|`
    + `${(Number(p.menge) || 0).toFixed(6)}`).sort();
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(teile.join(';')));
    return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 12);
  } catch(e){ return null; }
}
function geheimnisLink(){
  let owner = 'ozancanerd-ship-it', repo = 'cl';
  try {
    if (/\.github\.io$/.test(location.hostname)){
      owner = location.hostname.split('.')[0];
      repo = location.pathname.split('/').filter(Boolean)[0] || repo;
    }
  } catch(e){}
  return `https://github.com/${owner}/${repo}/settings/secrets/actions`;
}
const KANAL_TEXT = {push:'Push aufs Handy', telegram:'Telegram', mail:'Mail über GitHub (ohne Einzelheiten)'};

   EIGENEN Speicher, getrennt von Safari. Tippt man den Link in einer Nachricht an, oeffnet
   iOS ihn in Safari — und das Depot landet dort, wo die App es nie sieht. Auf dem Mac
   faellt das nicht auf, weil es dort denselben Browser trifft.

   Also wird nicht mehr ueber einen Link uebertragen, sondern ueber die Zwischenablage,
   INNERHALB der App. Und weil Mac und iPhone am selben Apple-Konto haengen, reicht dafuer
   meistens die Universal-Zwischenablage: auf dem Mac kopieren, auf dem iPhone einsetzen —
   ohne den Umweg ueber eine Nachricht an sich selbst. */
function zeichneSync(){

  const code = pos.length ? depotCode() : '';
  const h = `
  <div class="note-box" style="border-color:rgba(0,229,255,.28)">
    <span class="nt" style="color:var(--accent)">Wofür diese Seite da ist</span>
    <p style="font-size:13.5px">Dein Depot liegt im Speicher dieses Geräts — auf dem Mac ein

    Signale und Alarme sind auf beiden Geräten ohnehin gleich</strong>, die kommen aus

    <p style="color:var(--ink-3)">Warum kein Link: die App vom iPhone-Home-Bildschirm hat
    einen eigenen Speicher. Ein angetippter Link öffnet Safari, und dort landet das Depot

  </div>
  <div id="sy_waechter"></div>

  <h2>1 · Auf dem Gerät mit dem aktuellen Stand</h2>
  <div class="karte">
    <p style="margin:0 0 10px;font-size:13.5px">Hier stehen gerade
    <strong>${pos.length} Position(en)</strong>. Kopier sie — auf dem Mac landet der Text in

    <p style="margin:0"><button class="btn" id="sy_copy" style="font-size:16px;padding:14px 20px">

    <div id="sy_copy_hint"></div>

    <textarea id="sy_out" rows="3" spellcheck="false" readonly
      style="margin-top:10px">${esc(code)}</textarea>

  <h2>2 · Auf dem anderen Gerät</h2>

    <p style="margin:0 0 10px"><button class="btn" id="sy_paste" style="font-size:16px;padding:14px 20px">

    <p style="margin:0 0 6px;font-size:12.5px;color:var(--ink-2)">oder von Hand einfügen:</p>
    <textarea id="sy_in" rows="3" spellcheck="false" placeholder="Depot-Text hier einfügen"></textarea>

    <p>Alles, was zu einer Position gehört: Menge, Einstieg, Konto, Hebel und Knock-out,

  $('sync').innerHTML = h;

    t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0, 999999);
