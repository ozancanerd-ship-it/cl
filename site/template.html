/* Der ausgeschriebene Name einer Position. „OPEUR" steht so im Depot, weil Ozan es dort
   in Euro hält; der Scan kennt denselben Wert als OPUSD und hat den Klarnamen dazu. Ein
   Vorschlag, der „OPEUR ist schwächer als 89 % …" sagt, liest sich wie eine Fehlermeldung. */
function posName(b){
  return (b && b.row && b.row.name) ? b.row.name
       : (b && b.basis && b.basis.row && b.basis.row.name) ? b.basis.row.name
       : name(b && b.pos ? b.pos.sym : '');
}

function depotStand(){
  let positionen;
  try { positionen = ladePositionen(); } catch(e){ return null; }
  const bew = positionen.map(bewertePosition);
  const kursEU = (S && S.eurusd) || null;
  const inEuro = (b, wert) => {
    if (wert == null) return null;
    return (b.w === 'EUR' || !kursEU) ? wert : wert / kursEU;
  };
  const gesamt = bew.reduce((s,b)=>s + (inEuro(b, b.wert)||0), 0);
  return {bew, gesamt, kursEU, inEuro};
}

function positionsAktion(b, stand){
  const pos = b.pos, r = b.row;
  const wertEU = stand ? stand.inEuro(b, b.wert) : null;
  const anteil = (stand && stand.gesamt && wertEU != null) ? wertEU / stand.gesamt * 100 : null;
  const d = digits(b.kurs || 1);
  const z = waehrungsZeichen(b.w);
  const basis = {anteil, wertEU};

  // Ohne Kurs lässt sich keine Stückzahl rechnen — dann bleibt es beim Urteil.
  if (b.kurs == null || !pos.menge){
    return {...basis, art:'halten', dringend:false, titel:'Nichts zu tun',
      text:'Für diesen Posten gibt es keinen laufenden Kurs, also auch keine Stückzahl, '
         + 'die sich ausrechnen liesse.'};
  }

  const teil = (anteilMenge, grund, art, dringend, titel) => {
    let menge = pos.menge * anteilMenge;
    const jeStueckEU = (stand && stand.kursEU && b.w !== 'EUR') ? b.kurs / stand.kursEU : b.kurs;
    let euro = menge * jeStueckEU;
    let zusatz = '';
    // Zu kleine Order: entweder ganz raus oder auf eine sinnvolle Grösse anheben. Wenn
    // daraus ein voller Ausstieg wird, muss auch die Überschrift das sagen — sonst steht
    // „ein Drittel verkaufen" über einer Stückzahl, die die ganze Position ist.
    if (art !== 'nachlegen' && anteilMenge < 1 && euro < MIN_ORDER_EUR && wertEU != null){
      if (wertEU <= MIN_ORDER_EUR * 2){
        menge = pos.menge; euro = wertEU; art = 'raus';
        titel = titel.replace(/—.*$/, '').trim() + ' — ganze Position schliessen';
        zusatz = ` Die ganze Position ist nur ${num(wertEU,0)} € wert — ein Teilverkauf davon `
               + 'würde in Gebühren untergehen. Dann lieber ganz raus oder ganz lassen.';
      } else {
        menge = MIN_ORDER_EUR / jeStueckEU; euro = MIN_ORDER_EUR;
        zusatz = ` Auf ${MIN_ORDER_EUR} € angehoben — darunter frisst die Gebühr den Sinn der Order.`;
      }
    }
    return {...basis, art, dringend, titel, menge, euro, text: grund + zusatz};
  };

  /* 0 — der Knock-out. Vor allem anderen.

     Ein Stop schützt vor Verlusten; gegen eine Knock-out-Schwelle schützt er nicht. Wird
     sie berührt — auch nachts, auch für eine Sekunde — ist der Schein weg, nicht im
     Minus. Deshalb steht diese Regel vor Stop und Ziel. */
  if (b.hebel && b.hebel.art === 'margin' && b.hebel.puffer_pct < KO_PUFFER_KRITISCH){
    return teil(1.0, `Bis zur rechnerischen Liquidation sind es nur noch `
      + `${b.hebel.puffer_pct.toFixed(1).replace('.',',')} %. Bei ${b.hebel.hebel.toFixed(0)}× `
      + 'ist das eine normale Tagesbewegung — und dann schliesst die Börse selbst, zum '
      + 'schlechtesten Kurs. Selbst schliessen ist fast immer billiger als liquidiert werden.',
      'raus', true, 'Liquidation zu nah — raus');
  }
  if (b.hebel && b.hebel.ausgeknockt && b.hebel.art !== 'margin'){
    return {...basis, art:'raus', dringend:true, menge:pos.menge, euro:0,
      titel:'Knock-out berührt — der Schein ist wertlos',
      text:`${b.hebel.basisName} steht bei ${num(b.hebel.basisKurs, digits(b.hebel.basisKurs))}, `
        + `die Schwelle lag bei ${num(b.hebel.ko, digits(b.hebel.ko))}. Damit ist das Papier `
        + 'verfallen. Prüf das im Depot deines Brokers und trag die Position hier aus.'};
  }
  if (b.hebel && b.hebel.puffer_pct < KO_PUFFER_KRITISCH){
    return teil(1.0, `Bis zur Knock-out-Schwelle sind es nur noch `
      + `${b.hebel.puffer_pct.toFixed(1).replace('.',',')} % im Basiswert `
      + `(${b.hebel.basisName} bei ${num(b.hebel.basisKurs, digits(b.hebel.basisKurs))}, `
      + `Schwelle ${num(b.hebel.ko, digits(b.hebel.ko))}). Bei ${b.hebel.hebel.toFixed(1).replace('.',',')}× Hebel `
      + 'ist das eine normale Tagesbewegung. Hier geht es nicht um Gewinn oder Verlust, '
      + 'sondern um Totalverlust — und dagegen hilft kein Stop, die Schwelle greift auch nachts.',
      'raus', true, 'Knock-out zu nah — raus');
  }
  /* Jede Teilverkaufs-Regel gilt EINMAL je Position. Vorher kam „Hälfte raus" nach dem
     Verkauf sofort wieder — der Puffer ist ja weiter eng —, dann wieder, bis von der
     Position nichts mehr übrig war. Wer den Rat befolgt hat, wird dafür nicht bestraft:
     der „Verkauft"-Knopf hakt die Regel ab (pos.erledigt), danach schützt der Stop,
     und bei kritischem Puffer greift die Regel darüber (ganz raus). */
  const schonErledigt = new Set(pos.erledigt || []);
  if (b.hebel && b.hebel.puffer_pct < KO_PUFFER_ENG && !schonErledigt.has('ko_eng')){
    return {...teil(0.5, `Der Puffer bis zur Schwelle ist auf `
      + `${b.hebel.puffer_pct.toFixed(1).replace('.',',')} % geschmolzen. Bei `
      + `${b.hebel.hebel.toFixed(1).replace('.',',')}× Hebel reicht ein schlechter Tag im Basiswert. Die Hälfte `
      + 'rausnehmen halbiert das, was ein Knock-out kosten kann, und lässt die These am Leben.',
      'teilverkauf', true, 'Puffer wird eng — Hälfte raus'), marke:'ko_eng'};
  }

  // 1 + 2 — was der Ausstiegsplan sagt, hat Vorrang. Feste Marken schlagen Einschätzungen.
  const schritt = naechsterSchritt(pos, planKurs(b), b.w);
  if (schritt && schritt.stufe === 'stop'){
    return teil(1.0, (pos.plan && pos.plan.ebene === 'basis') ? schritt.text
      : `Der Kurs steht bei ${num(b.kurs,d)}${z}, dein Stop lag bei `
      + `${num(pos.plan.stop,d)}${z}. Die Idee ist widerlegt — hier wird nicht nachverhandelt.`,
      'raus', true, 'Alles verkaufen — Stop gerissen');
  }
  if (schritt && schritt.stufe === 'ziel'){
    return {...teil(1/3, `${schritt.marke} ist erreicht. Ein Drittel raus, den Stop auf deinen `
      + 'Einstieg ziehen — ab da kann der Trade nichts mehr kosten.',
      'teilverkauf', true, `${schritt.marke} erreicht — ein Drittel verkaufen`), marke:schritt.marke};
  }

  const rs = b.halt && b.halt.rs;
  const klasseName = r && r.klasse === 'aktien' ? 'Aktien' : 'Coins';

  /* ================================================== SCHONFRIST

     „Manchmal gibt es Alarme, wo ich jetzt einsteigen drücke, und dann sagt er in der
     gleichen Sekunde, ich soll es wieder verkaufen. Sowas geht gar nicht."

     Er hat vollkommen recht, und der Fehler lag hier. Zwei Teile des Systems haben
     verschiedene Dinge gemessen: das Signal bewertet das Chartbild, das Depot die
     relative Stärke. Ein Nachzügler mit hübschem Chart bekam ein Kaufsignal — und war
     im Depot sofort ein Verkaufskandidat.

     An der Wurzel ist das im Scanner behoben: ein Long im schwächsten Viertel seiner
     Klasse ist gar kein handelbares Signal mehr. Hier kommt der zweite Riegel dazu.

     Eine frisch gekaufte Position mit gültigem Plan wird von der Rangliste in Ruhe
     gelassen. Was sie begrenzt, ist ihr Stop — dafür ist er da. Erst wenn der Plan
     durch ist oder die Schonfrist abläuft, redet die Depotbewertung wieder mit.

     Wie lang? Nicht geraten, sondern aus der eigenen Bilanz: das Doppelte der
     gemessenen Haltedauer dieser Anlageklasse, mindestens drei Tage. Damit bekommen
     Aktien von selbst mehr Zeit als Coins — was Ozan zu Recht angemahnt hat: „bei
     Aktien passiert das nicht in zwei, drei Tagen, das dauert länger." */
  const SCHONFRIST_MIN_H = 72;
  const schonfristEnde = (() => {
    if (!pos.seit) return null;                       // vor dieser Änderung eingetragen
    if (!pos.plan || pos.plan.stop == null) return null; // ohne Plan kein Schutz
    const dd = dauerFuer(r && r.note, r && r.klasse);
    const stunden = Math.max(SCHONFRIST_MIN_H, dd ? dd.median_h * 2 : SCHONFRIST_MIN_H);
    return pos.seit + stunden * 3600 * 1000;
  })();
  const inSchonfrist = schonfristEnde != null && Date.now() < schonfristEnde;

  /* 3 — die eigene Analyse zeigt in die Gegenrichtung: seit 30.09. ein Hinweis, kein
     Teilverkauf mehr.

     Bis dahin riet die App hier „Hälfte verkaufen" (Long gehalten, handelbares Short-Setup,
     relative Stärke unter der Mitte). Die Regel wurde vorab registriert geprüft
     (docs/GEGENTHESE-STUDIE-2026-09.md, 24 Coins, 19 Monate): in genau dieser Lage liefen
     die Coins in den 7 Tagen danach IS 1,4 Prozentpunkte BESSER als ihre Klasse, OOS nur
     0,3 Punkte schlechter — verlangt war mindestens 1,0 Punkte schlechter in beiden Hälften.
     Ein Teilverkauf ohne gemessenen Vorteil kostet nur Gebühr, Spread und Steuer. Verkauft
     wird über den Stop oder eine gedrehte Analyse der eigenen Position. */
  const gegenHinweis = (r && r.richtung === 'short' && r.handelbar && (rs == null || rs < RS_MITTE))
    ? ' Die Analyse zeigt gerade ein Setup nach unten — gemessen ist das kein Grund, Teile zu '
      + 'verkaufen (solche Lagen liefen danach nicht schlechter als die Klasse). Der Stop entscheidet.'
    : '';

  /* 4 — Schlusslicht der eigenen Klasse: bis 27.09. „ein Drittel verkaufen". Nachgemessen
     hielt die Begründung nicht (Schlusslichter liefen danach nicht schlechter als ihre
     Klasse, siehe haltUrteil). Ein Teilverkauf ohne gemessenen Vorteil kostet nur Gebühr,
     Spread und bei Gewinnen Steuer. Deshalb hier nur noch der Hinweis, nicht nachzukaufen. */
  const schlusslicht = rs != null && rs < RS_SCHWACH
    ? ` ${posName(b)} ist schwächer als ${(100-rs).toFixed(0)} % der ${klasseName} — nicht `
      + 'nachkaufen; verkauft wird über den Stop oder eine gedrehte Analyse, nicht über den Tabellenplatz.'
    : '';

  /* 5 — Klumpenrisiko: seit 28.09. ein Hinweis, kein Verkaufsauftrag.

     Ozan: „Ich soll bei mehreren Sachen schon Teil verkaufen, obwohl du selber meintest,
     das wäre nicht so sinnvoll." Der Klumpen-Rat stand oben in „Was jetzt zu tun ist"
     mit einer Stückzahl — als wäre er so belegt wie ein gerissener Stop. Das ist er nicht:
     eine Obergrenze je Wert senkt Schwankung, bringt aber gemessen keine Rendite, und ob
     jemand bewusst groß in Bitcoin sitzt, ist seine Entscheidung. Die Zahl bleibt
     sichtbar (Karte, Gesundheit), die Aufforderung fällt weg. */
  let hinweis = '';
  if (anteil != null && anteil > MAX_GEWICHT){
    const runter = (anteil - MAX_GEWICHT) / anteil;
    const t = teil(runter, '', 'trimmen', false, '');
    hinweis = `Klumpen: diese Position ist ${anteil.toFixed(0)} % deines Depots — ein einzelner `
      + 'Wert entscheidet damit spürbar über dein Ergebnis. Wenn du das Risiko senken willst: '
      + `${num(t.menge, t.menge<1?6:4)} Stück (≈ ${num(t.euro,0)} €) bringen sie auf ${MAX_GEWICHT} %. `
      + 'Das senkt die Schwankung, nicht die Chance — deshalb nur ein Hinweis.';
  }

  // 6 — nachlegen. Nur in Stärke, nur mit Setup, nur mit Stop.
  const stop = (pos.plan && pos.plan.stop != null) ? pos.plan.stop
             : (r && r.invalidierung != null ? inPositionsWaehrung(r, r.invalidierung, pos) : null);
  const setzt = r && r.handelbar && r.score >= 52 && r.richtung !== 'short';
  if (!inSchonfrist && rs != null && rs >= RS_FUEHRER && setzt && stop != null && stop < b.kurs
      && anteil != null && anteil < ZIEL_GEWICHT && stand && stand.gesamt){
    const risikoJeStueck = b.kurs - stop;
    const ausRisiko = stand.gesamt * (NACHKAUF_RISIKO_PCT/100) / risikoJeStueck
                    * (b.w === 'EUR' ? 1 : (stand.kursEU || 1));
    const platzEU = (ZIEL_GEWICHT - anteil)/100 * stand.gesamt;
    const kursEUJeStueck = b.w === 'EUR' ? b.kurs : b.kurs / (stand.kursEU || 1);
    const ausPlatz = platzEU / kursEUJeStueck;
    const menge = Math.min(ausRisiko, ausPlatz);
    const euro = menge * kursEUJeStueck;
    if (euro >= MIN_ORDER_EUR){
      /* Bevor die App zum Nachlegen raet: ist das ueberhaupt eine Erhoehung der
         Chance — oder nur eine Erhoehung derselben Wette? Wenn dieser Wert in einem
         Buendel liegt, das schon ueber die Haelfte der Marktbewegung ausmacht, dann
         sieht ein Zukauf nach Staerke aus und ist in Wahrheit Konzentration. Der
         Einzelposten bleibt unter seinem Deckel, das Buendel nicht. */
      const gl = glAnteilFuer(b, stand);
      if (gl && gl.anzahl > 1 && gl.anteil > BUENDEL_MAX){
        return {...basis, art:'halten', dringend:false, eigen:true, hinweis,
          titel:'Nachlegen wäre hier keine neue Chance, sondern dieselbe Wette',
          text:`Das Setup traegt — ${posName(b)} gehoert zu den staerksten `
            + `${(100-rs).toFixed(0)} % der ${klasseName}. Aber dieser Wert liegt in einem `
            + `Buendel aus ${gl.anzahl} Positionen, die sich gemessen gemeinsam bewegen `
            + `(${gl.zusammenhalt != null ? gl.zusammenhalt.toFixed(2).replace('.',',') : '—'}) `
            + `und zusammen schon ${gl.anteil.toFixed(0)} % deiner Marktbewegung ausmachen. `
            + `Ein Zukauf hier vergroessert nicht die Streuung, sondern den Klumpen. `
            + `Wenn du dieses Setup handeln willst, dann als Tausch innerhalb des `
            + `Buendels — nicht obendrauf.`};
      }
      return {...basis, art:'nachlegen', dringend:false, menge, euro,
        titel:'Nachlegen — Stärke mit frischem Setup',
        text:`${posName(b)} gehört zu den stärksten ${(100-rs).toFixed(0)} % der `
          + `${klasseName} und hat gerade ein handelbares Setup (Score ${r.score.toFixed(0)}, `
          + `Note ${r.note}). Die Position ist erst ${anteil.toFixed(0)} % deines Depots. `
          + `Gerechnet auf ${NACHKAUF_RISIKO_PCT} % Risiko bei Stop ${num(stop,d)}${z}.`};
    }
  }

  // 7 — halten.
  const wohin = schritt && schritt.stufe === 'halten' ? ' ' + schritt.text : '';
  if (inSchonfrist){
    const restH = Math.max(1, Math.round((schonfristEnde - Date.now())/3600000));
    return {...basis, art:'halten', dringend:false, eigen:true, hinweis, titel:'Halten — der Plan läuft',
      text:`Frisch gekauft, der Stop steht. Solange der Plan gilt, redet die Rangliste hier `
        + `nicht rein — sonst würde dir dieselbe App im selben Atemzug Kaufen und Verkaufen `
        + `sagen. Begrenzt wird das Risiko durch deinen Stop, nicht durch eine Meinung. `
        + `Noch ${restH < 48 ? restH + ' Stunden' : Math.round(restH/24) + ' Tage'}, `
        + `dann wird wieder normal bewertet.` + wohin};
  }
  return {...basis, art:'halten', dringend:false, hinweis, titel:'Halten — nichts zu tun',
    text:(rs != null ? `Relative Stärke ${rs.toFixed(0)} von 100, kein Anlass zu handeln.`
        : 'Kein Anlass zu handeln.') + gegenHinweis + schlusslicht + wohin};
}

const AKTION_FARBE = {raus:'bad', teilverkauf:'warn', trimmen:'warn', nachlegen:'', halten:''};
const AKTION_WORT  = {raus:'VERKAUFEN', teilverkauf:'TEILVERKAUF', trimmen:'TRIMMEN',
                      nachlegen:'NACHLEGEN', halten:'HALTEN'};

const pctK = (v, n=1) => v.toFixed(n).replace('.', ',') + ' %';

/* Die Marken des Plans als eine Zeile — Stop (und Ziele, wo sie gelten). */
function planMarken(b){
  const pl = b.pos.plan || {};
  if (pl.stop == null) return '';
  const basis = pl.ebene === 'basis';
  const d = digits(planKurs(b) || b.kurs || 1);
  const w = pl.waehrung === 'EUR' ? ' €' : (pl.waehrung === 'USDT' ? ' USDT' : (basis ? ' $' : waehrungsZeichen(b.w)));
  return [[basis ? `Stop auf ${esc(pl.basis_name || 'Basiswert')}` : 'Stop', pl.stop],
          ...(zieleGelten(pl) ? [['TP1', pl.tp1], ['TP2', pl.tp2], ['TP3', pl.tp3]] : [])]
    .filter(([,v]) => v != null)
    .map(([k,v]) => `<span>${k} <b>${num(v,d)}${w}</b></span>`).join('');
}

function aktionsKasten(b, stand, a){
  a = a || positionsAktion(b, stand);
  if (!a) return '';
  const farbe = AKTION_FARBE[a.art] || '';
  const zahl = (a.menge != null && a.euro != null)
    ? `<div class="kpi" style="margin-top:8px">
         <span>${a.art==='nachlegen'?'kaufen':'verkaufen'} <b>${num(a.menge, a.menge<1?6:4)} Stück</b></span>
         <span>≈ <b>${num(a.euro,2)} €</b></span>
         ${a.anteil!=null?`<span>Anteil am Depot <b>${pctK(a.anteil)}</b></span>`:''}
       </div>` : '';
  const marken = planMarken(b);
  const knopf = (a.menge!=null && b.pos.menge) ? `<p style="margin:9px 0 0">
      <button class="btn" data-mengeschl="${esc(posSchluessel(b.pos))}"
              data-mengeart="${esc(a.art)}" data-mengewert="${a.menge}"
              data-mengemarke="${esc(a.marke||'')}"
              data-mengekurs="${b.kurs!=null?b.kurs:''}">${
        a.art==='nachlegen' ? 'Gekauft — ins Depot übernehmen'
                            : (a.art==='raus' ? 'Verkauft — Position schliessen'
                                              : 'Verkauft — Menge anpassen')}</button></p>` : '';
  return `<div class="note-box ${farbe}" style="margin:10px 0 0">
    <span class="nt">Was jetzt zu tun ist · ${esc(AKTION_WORT[a.art])}</span>
    <p style="font-size:14.5px;margin:0 0 4px"><strong>${esc(a.titel)}</strong></p>
    <p style="margin:0">${esc(a.text)}</p>${zahl}
    ${marken?`<div class="kpi" style="margin-top:6px">${marken}</div>`:''}${knopf}
    <p style="margin:8px 0 0;font-size:11.5px;color:var(--ink-3)">
      Vorschlag mit Begründung, keine Anweisung — und nichts passiert automatisch.
      Die Stückzahl ist gerechnet, nicht geschätzt.</p>
  </div>`;
}

/* EIN Kasten je Position für die Frage „was tun?". Vorher standen drei untereinander —
   „Was jetzt zu tun ist" (Aktion), „Was das System dazu sagt", und nochmal „Was jetzt zu
   tun ist" (Ausstiegsplan) —, oft mit zwei verschiedenen Überschriften für dieselbe
   Lage („Halten — nichts zu tun" über „Halten — Stop steht"). */
function entscheidungsKasten(b, stand){
  const a = positionsAktion(b, stand);
  if (!a || a.art === 'halten') return ausstiegsKasten(b, a);
  const hatPlan = b.pos.plan && b.pos.plan.stop != null;
  return aktionsKasten(b, stand, a) + (hatPlan ? '' : ausstiegsKasten(b, null));
}

/* EIN Urteil je Position (Ozan, 01.10.: „Stop gerissen, ich soll alles verkaufen, aber
   oben rechts steht STARK HALTEN"). Das Schild oben, der Kasten „Warum" und die Liste
   „Was jetzt zu tun ist" sagen jetzt dasselbe. Verlangt der Plan eine Handlung (Stop,
   Ziel, Knock-out), gewinnt sie — eine feste Marke schlägt eine Einschätzung. Die
   Stärke-Bewertung steht dann als Begründung daneben, nicht als zweites Urteil. */
function kartenUrteil(b, a){
  if (a && a.art === 'raus') return {wort:'VERKAUFEN', kl:'bad', aktion:a};
  if (a && a.art === 'teilverkauf') return {wort:'TEIL VERKAUFEN', kl:'warn', aktion:a};
  if (a && a.art === 'nachlegen') return {wort:'NACHLEGEN', kl:'gut', aktion:a};
  return {wort:b.urteil, kl:b.kl, aktion:null};
}
function ratKasten(b, ku){
  const rat = positionsRat(b);
  const a = ku && ku.aktion;
  if (a && (a.art === 'raus' || a.art === 'teilverkauf')){
    const stark = rat.stufe === 'gut';
    const vorweg = a.art === 'raus'
      ? (stark ? `Die Stärke allein spräche fürs ${rat.kopf === 'Halten' ? 'Halten' : 'Weiterlaufen'} — `
           + 'aber eine feste Marke ist erreicht, und die schlägt jede Einschätzung. '
         : 'Auch die Einschätzung spricht nicht mehr für die Position — und eine feste Marke ist erreicht. ')
        + 'Genau dafür ist der Stop da: er wird nicht nachverhandelt. Danach kommt der Wert auf '
        + 'die Wiedereinstiegs-Liste — der Stop ist ein Urteil über den Moment, nicht über den Wert.'
      : 'Ein Ziel ist erreicht: ein Teil wird verkauft, der Rest läuft mit nachgezogenem Stop '
        + 'weiter. Das ist der Plan, kein Ausstieg.';
    return `<div class="note-box ${a.art === 'raus' ? 'bad' : 'warn'}" style="margin:10px 0 0">
      <span class="nt">Warum · ${esc(AKTION_WORT[a.art])}</span>
      <p style="margin:0 0 4px">${esc(vorweg)}</p>
      ${rat.saetze.map(x=>`<p style="margin:0 0 4px;color:var(--ink-2)">${esc(x)}</p>`).join('')}</div>`;
  }
  const farbe = rat.stufe === 'bad' ? 'bad' : (rat.stufe === 'warn' ? 'warn' : '');
  return `<div class="note-box ${farbe}" style="margin:10px 0 0">
    <span class="nt">Warum · ${esc(rat.kopf)}</span>
    ${rat.saetze.map(x=>`<p style="margin:0 0 4px">${esc(x)}</p>`).join('')}</div>`;
}

/* Alles, was man nachlesen kann, aber nicht jeden Tag lesen muss. Bleibt beim
   Neuzeichnen (alle 5 s) offen, wenn es offen war. */
const MEHR_OFFEN = new Set();
function mehrKasten(b){
  const r = b.row;
  const rat = positionsRat(b);
  const teile = [];
  if (r){
    const d = digits(b.kurs||1);
    teile.push(`<div class="zt" style="margin-top:6px">
      <span>Score <b>${r.score.toFixed(0)}</b></span>
      <span>Note <b>${esc(r.note)}</b></span>
      ${r.ziel!=null?`<span>Setup-Ziel <b>${num(r.ziel,d)}</b></span>`:''}
      ${r.invalidierung!=null?`<span>Setup-Stop <b>${num(r.invalidierung,d)}</b></span>`:''}
      ${bewegungSpan(r)}
    </div>`);
    if (r.headline) teile.push(`<p style="margin:6px 0 0">Chart: ${esc(r.headline)}</p>`);
  }
  for (const x of (rat.mehr || [])) teile.push(`<p style="margin:6px 0 0">${esc(x)}</p>`);
  const pl = b.pos.plan || {};
  if (pl.art === 'halte'){
    teile.push(`<p style="margin:6px 0 0">Halte-Stop (5× Tagesschwankung unter dem
      22-Tage-Hoch): eine Versicherung gegen den Absturz, kein Renditebringer. Gemessen
      (Studie 27.09.) hat er die schlimmsten Verläufe bei Coins etwa halbiert, in
      Aufwärtsphasen aber Rendite gekostet. Er wird nur nachgezogen, nie gelockert. Nach
      einem Stop kommt der Wert auf die Wiedereinstiegs-Liste.</p>`);
  }
  if (!teile.length) return '';
  const key = posSchluessel(b.pos);
  return `<details class="mehr" data-mehr="${esc(key)}"${MEHR_OFFEN.has(key)?' open':''}>
    <summary>Mehr zur Analyse</summary>${teile.join('')}</details>`;
}

/* ══════════════════════════════════════════════════════════════════════════════════
   GLEICHLAUF — wie viele Wetten ein Depot wirklich ist

   Das Depot zeigte bisher "Konzentration: grösste Position 14 %" und sah damit breit
   aus. Es besteht aus zehn Altcoins, zwei US-Tech-Aktien und drei Turbos auf US-Tech.
   Das sind keine vierzehn Wetten, das sind zwei — und eine davon läuft gehebelt.

   Die Grundlage ist keine Behauptung ("Krypto läuft halt zusammen"), sondern die
   gemessene Korrelation der Tagesrenditen der letzten 90 Handelstage. Der Scan schickt
   dafür je Instrument eine standardisierte Renditereihe mit, ein Byte je Tag. Die
   Korrelation ist hier unten ein Skalarprodukt — jedes Paar, jederzeit, auch gegen eine
   Chance, die noch gar nicht im Depot ist.
   ══════════════════════════════════════════════════════════════════════════════════ */

// Ab hier gilt zwei Werte als dieselbe Wette. 0,5 über 90 Tage ist kein Zufall mehr;
// darunter beginnt der Bereich, in dem zwei Werte manchmal zusammenlaufen und manchmal
// nicht — und den als "ein Bündel" zu verkaufen wäre schon wieder eine Behauptung.
const GL_SCHWELLE = 0.5;
// Ein normaler Tag ist eine Standardabweichung, ein schlechter das 95-%-Quantil.
const GL_SCHLECHT = 1.645;

let _glCache = null, _glStand = null;

function glVektoren(){
  const g = S && S.gleichlauf;
  if (!g || !g.z) return null;
  const stand = `${g.bis}:${g.tage}:${Object.keys(g.z).length}`;
  if (_glCache && _glStand === stand) return _glCache;
  const mitte = (g.mitte != null) ? g.mitte : 128;
  const raus = new Map();
  for (const name in g.z){
    let roh;
    try { roh = atob(g.z[name]); } catch(e){ continue; }
    const n = roh.length;
    if (n < 30) continue;
    const v = new Float64Array(n);
    let summe = 0;
    for (let i=0;i<n;i++){ v[i] = roh.charCodeAt(i) - mitte; summe += v[i]; }
    const m = summe/n;
    let q = 0;
    for (let i=0;i<n;i++){ v[i] -= m; q += v[i]*v[i]; }
    const laenge = Math.sqrt(q);
    if (!(laenge > 0)) continue;
    for (let i=0;i<n;i++) v[i] /= laenge;
    raus.set(name, v);
  }
  _glCache = raus; _glStand = stand;
  return raus;
}

/* Korrelation zweier Instrumente, oder null, wenn für eines davon nichts gemessen
   wurde. null ist hier wichtig: es heisst "unbekannt", nicht "unabhängig". Wer das
   verwechselt, baut sich ein Depot schön. */
function glKorr(a, b){
  if (!a || !b) return null;
  if (a === b) return 1;
  const v = glVektoren(); if (!v) return null;
  const x = v.get(a), y = v.get(b);
  if (!x || !y || x.length !== y.length) return null;
  let s = 0;
  for (let i=0;i<x.length;i++) s += x[i]*y[i];
  return Math.max(-1, Math.min(1, s));
}

// Tagesschwankung in Prozent, wie gemessen.
function glVola(name){
  const g = S && S.gleichlauf;
  const v = g && g.sd ? g.sd[name] : null;
  return (v != null && isFinite(v)) ? v : null;
}

/* Unter welchem Namen ein Depotposten in der Messung steht. Ein Turbo bewegt sich mit
   seinem Basiswert, nicht mit sich selbst — für den Gleichlauf zählt der Basiswert. */
function glNameFuer(b){
  if (b.hebel && b.hebel.basisSym){
    const br = scanRow(b.hebel.basisSym);
    if (br) return br.instrument;
  }
  if (b.row) return b.row.instrument;
  const r = scanRow(b.pos.sym);
  return r ? r.instrument : null;
}

/* Bargeld ist keine Position ohne Messreihe, sondern eine Position ohne Risiko.
   Der Unterschied gehoert benannt: USDC unter "dafuer fehlen uns Daten" einzusortieren
   sieht aus wie eine Luecke, ist aber genau der Teil des Depots, der absichtlich nichts
   tut. Cash zaehlt beim eigenen Geld mit und beim bewegten Markt nicht. */
const BAR = /^(USDC|USDT|USD|EUR|BUSD|DAI|FDUSD|TUSD|EURC)$/i;
function istBar(pos){
  if (!pos) return false;
  if (BAR.test(String(pos.sym||'').trim())) return true;
  return /\bcash\b|bargeld|guthaben/i.test(String(pos.konto||''));
}

/* Was eine Position am Markt bewegt, und was sie an eigenem Geld bindet.

   Der Unterschied ist bei Ozans Depot kein Detail. Ein Turbo für 63 € mit Hebel 9
   bewegt 567 € Marktwert. Eine Margin-Position steht schon mit ihrem vollen
   Nominalwert im Depot, ihr eigenes Geld ist aber nur ein Fünftel davon. Wer beides
   gleichsetzt, unterschätzt entweder sein Risiko oder überschätzt sein Vermögen. */
function glGewicht(b, stand){
  const wertEU = stand ? stand.inEuro(b, b.wert) : null;
  if (wertEU == null) return null;
  const h = b.hebel;
  if (h && h.art === 'margin' && h.hebel > 1){
    return {markt: wertEU, kapital: wertEU / h.hebel, hebel: h.hebel, art: 'margin'};
  }
  if (h && !h.ausgeknockt && h.hebel > 1){
    return {markt: wertEU * h.hebel, kapital: wertEU, hebel: h.hebel, art: 'schein'};
  }
  return {markt: wertEU, kapital: wertEU, hebel: 1, art: 'direkt'};
}

/* Die eigentliche Rechnung. Agglomerativ mit mittlerer Verknüpfung: das nächste Paar
   zusammenlegen, solange die mittlere Korrelation zwischen zwei Gruppen über der
   Schwelle liegt. Bei zwanzig Positionen ist das in Mikrosekunden fertig. */
function glBuendel(bew, stand){
  const g = S && S.gleichlauf;
  if (!g || !glVektoren()) return null;

  const teile = [];
  let ohneMessung = 0, ohneMessungEU = 0, bar = 0;
  for (const b of bew){
    const gw = glGewicht(b, stand);
    if (!gw || !(gw.markt > 0)) continue;
    if (istBar(b.pos)){ bar += gw.kapital; continue; }
    const nm = glNameFuer(b);
    const vola = nm ? glVola(nm) : null;
    // Short zählt mit umgekehrtem Vorzeichen: eine Short-Position gegen eine Long-
    // Position im selben Wert ist keine doppelte Wette, sondern gar keine.
    const richtung = (b.hebel && b.hebel.lang === false) ? -1
                   : (b.pos.hebel_richtung === 'short' ? -1 : 1);
    if (!nm || vola == null || !glVektoren().has(nm)){
      ohneMessung++; ohneMessungEU += gw.markt; continue;
    }
    teile.push({b, nm, vola, richtung, markt: gw.markt, kapital: gw.kapital,
                hebel: gw.hebel, art: gw.art});
  }
  if (teile.length < 2) return null;

  const n = teile.length;
  const K = [];
  for (let i=0;i<n;i++){
    K.push(new Float64Array(n));
    for (let j=0;j<n;j++){
      const r = (i===j) ? 1 : glKorr(teile[i].nm, teile[j].nm);
      // Richtung einrechnen: zwei Longs auf dasselbe sind +, Long gegen Short ist −.
      K[i][j] = (r == null ? 0 : r) * teile[i].richtung * teile[j].richtung;
    }
  }

  let gruppen = teile.map((_,i)=>[i]);
  for(;;){
    let besteA = -1, besteB = -1, bester = GL_SCHWELLE;
    for (let a=0;a<gruppen.length;a++){
      for (let b2=a+1;b2<gruppen.length;b2++){
        let s = 0;
        for (const i of gruppen[a]) for (const j of gruppen[b2]) s += K[i][j];
        const mittel = s / (gruppen[a].length * gruppen[b2].length);
        if (mittel > bester){ bester = mittel; besteA = a; besteB = b2; }
      }
    }
    if (besteA < 0) break;
    gruppen[besteA] = gruppen[besteA].concat(gruppen[besteB]);
    gruppen.splice(besteB, 1);
  }

  const marktGesamt = teile.reduce((s,t)=>s+t.markt, 0);
  const kapitalGesamt = teile.reduce((s,t)=>s+t.kapital, 0);

  const b_ = gruppen.map(idx => {
    const markt = idx.reduce((s,i)=>s+teile[i].markt, 0);
    let paare = 0, summe = 0;
    for (let x=0;x<idx.length;x++) for (let y=x+1;y<idx.length;y++){ summe += K[idx[x]][idx[y]]; paare++; }
    return {
      idx, markt, anteil: marktGesamt ? markt/marktGesamt*100 : 0,
      zusammenhalt: paare ? summe/paare : null,
      mitglieder: idx.map(i=>teile[i]).sort((a,b2)=>b2.markt-a.markt)
    };
  }).sort((a,b2)=>b2.markt-a.markt);

  // Effektive Anzahl Wetten: der Kehrwert der Summe der quadrierten Bündelanteile.
  // Vierzehn gleich grosse, unabhängige Positionen ergäben 14; vierzehn Positionen,
  // die alle dasselbe tun, ergeben 1.
  const hh = b_.reduce((s,x)=>s + Math.pow(x.anteil/100, 2), 0);
  const effektiv = hh > 0 ? 1/hh : null;

  /* Tagesrisiko in Euro. Nicht aus einer Faustregel, sondern aus denselben Zahlen:
     Gewichte, gemessene Schwankungsbreiten, gemessene Korrelationen. */
  let varianz = 0;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    varianz += teile[i].markt * teile[j].markt
             * (teile[i].vola/100) * (teile[j].vola/100) * K[i][j];
  }
  const tagesRisiko = varianz > 0 ? Math.sqrt(varianz) : null;

  return {
    teile, buendel: b_, effektiv, marktGesamt, kapitalGesamt, tagesRisiko, bar,
    hebelFaktor: kapitalGesamt ? marktGesamt/kapitalGesamt : 1,
    ohneMessung, ohneMessungEU,
    tage: g.tage, bis: g.bis
  };
}

/* Wie sehr eine neue Chance dasselbe ist, was schon im Depot liegt. Genau die Frage,
   die man sich vor dem Kauf stellen sollte und nie stellt. */
let _glDepot = null, _glDepotZeit = 0;
function glGegenDepot(instrument){
  if (!instrument) return null;
  /* Die Marktliste ruft das fuer jede der 206 Zeilen auf. Ohne diesen Zwischenspeicher
     wuerde das Depot 206-mal aus dem localStorage gelesen, geparst und neu bewertet —
     das kostet beim Zeichnen eine halbe Sekunde, jedes Mal. Eine Sekunde Haltbarkeit
     reicht fuer einen Zeichendurchgang und ist kurz genug, dass eine Aenderung am
     Depot sofort durchschlaegt. */
  const jetzt = Date.now();
  if (!_glDepot || jetzt - _glDepotZeit > 1000){
    try { _glDepot = depotStand(); } catch(e){ _glDepot = null; }
    _glDepotZeit = jetzt;
  }
  const stand = _glDepot;
  if (!stand || !stand.bew.length) return null;
  let beste = null;
  for (const b of stand.bew){
    if (istBar(b.pos)) continue;
    const nm = glNameFuer(b);
    if (!nm || nm === instrument) continue;
    const gw = glGewicht(b, stand);
    if (!gw || !(gw.markt > 0)) continue;
    const r = glKorr(instrument, nm);
    if (r == null) continue;
    if (!beste || r > beste.r) beste = {r, name: posName(b), markt: gw.markt};
  }
  return (beste && beste.r >= GL_SCHWELLE) ? beste : null;
}

/* In welchem Buendel eine einzelne Position liegt — und wie schwer dieses Buendel
   schon wiegt. Die Rechnung haengt am ``stand`` statt an einer globalen Variablen,
   damit sie je Zeichendurchgang genau einmal passiert. */
function glAnteilFuer(b, stand){
  if (!stand) return null;
  if (stand._gl === undefined){
    try { stand._gl = glBuendel(stand.bew, stand); } catch(e){ stand._gl = null; }
  }
  const a = stand._gl;
  if (!a) return null;
  const nm = glNameFuer(b);
  if (!nm) return null;
  for (const x of a.buendel){
    if (x.mitglieder.some(m => m.nm === nm)){
      return {anteil: x.anteil, anzahl: x.mitglieder.length, zusammenhalt: x.zusammenhalt,
              markt: x.markt, namen: x.mitglieder.map(m=>posName(m.b))};
    }
  }
  return null;
}

function glText(x){
  if (x >= 0.85) return 'praktisch derselbe Wert';
  if (x >= 0.7)  return 'läuft fast immer zusammen';
  if (x >= 0.5)  return 'läuft überwiegend zusammen';
  if (x >= 0.3)  return 'läuft oft zusammen';
  if (x > -0.3)  return 'läuft eigenständig';
  return 'läuft gegenläufig';
}

function glKasten(stand){
  const g = S && S.gleichlauf;
  if (!g) return `<div class="note-box"><span class="nt">Gleichlauf</span>
    <p>Der laufende Scan hat noch keine Messreihen mitgeschickt. Sobald der nächste
    volle Lauf durch ist, steht hier, aus wie vielen Wetten dein Depot wirklich
    besteht.</p></div>`;
  const a = glBuendel(stand.bew, stand);
  if (!a) return '';

  const proz = (x) => x.toFixed(0).replace('.',',');
  /* Ein Einzelwert mit 31 % unter der Ueberschrift "laeuft eigenstaendig" zu fuehren
     waere eine beruhigende Aussage ueber einen Klumpen. Wer allein ein Fuenftel des
     Depots bewegt, ist keine Streuung, sondern eine eigene Wette — und bekommt eine
     eigene Karte. */
  const EINZEL_GROSS = 20;
  const echte = a.buendel.filter(x=>x.mitglieder.length > 1);
  const gross = a.buendel.filter(x=>x.mitglieder.length === 1 && x.anteil >= EINZEL_GROSS);
  const eins  = a.buendel.filter(x=>x.mitglieder.length === 1 && x.anteil <  EINZEL_GROSS);

  let h = `<h2>Wie viele Wetten das wirklich ist</h2>
  <div class="status">
    <div><div class="k">Effektive Wetten</div>
      <div class="v ${a.effektiv < 2.5 ? 'aus' : a.effektiv < 4 ? 'mittel' : 'gut'}">${
        a.effektiv != null ? a.effektiv.toFixed(1).replace('.',',') : '—'}</div>
      <div class="n">aus ${a.teile.length} Positionen</div></div>
    <div><div class="k">Bewegter Markt</div>
      <div class="v">${num(a.marktGesamt,0)} €</div>
      <div class="n">mit ${num(a.kapitalGesamt,0)} € eigenem Geld${
        a.hebelFaktor > 1.05 ? ` · Faktor ${a.hebelFaktor.toFixed(1).replace('.',',')}` : ''}</div></div>
    <div><div class="k">Normaler Tag</div>
      <div class="v">${a.tagesRisiko != null ? '±'+num(a.tagesRisiko,0)+' €' : '—'}</div>
      <div class="n">${a.tagesRisiko != null && a.kapitalGesamt
        ? (a.tagesRisiko/a.kapitalGesamt*100).toFixed(1).replace('.',',')+' % deines Geldes' : ''}</div></div>
    <div><div class="k">Schlechter Tag</div>
      <div class="v ${a.tagesRisiko != null && a.kapitalGesamt
          && (a.tagesRisiko*GL_SCHLECHT/a.kapitalGesamt) > 0.06 ? 'aus' : 'mittel'}">${
        a.tagesRisiko != null ? '−'+num(a.tagesRisiko*GL_SCHLECHT,0)+' €' : '—'}</div>
      <div class="n">einer von zwanzig</div></div>
  </div>
  <p class="leer" style="padding:6px 0">Gemessen an den Tagesrenditen der letzten
    ${a.tage} Handelstage bis ${esc(a.bis)} — nicht geschätzt und nicht angenommen.
    Der schlechte Tag ist das übliche 95-%-Quantil; an echten Paniktagen fällt mehr an,
    weil Kurse dann stärker springen, als eine Normalverteilung kennt.${
    a.bar > 0 ? ` ${num(a.bar,0)} € Cash sind nicht dabei — das ist der Sinn von Cash:
    es bewegt sich nicht mit.` : ''}${
    a.ohneMessung ? ` ${a.ohneMessung} Position(en) über ${num(a.ohneMessungEU,0)} €
    fehlen in der Rechnung — für sie gibt es keine Messreihe (ETF, ausgelisteter Coin,
    Schein ohne erkannten Basiswert). Das Risiko darunter ist nicht null, es ist
    ungemessen.` : ''}</p>`;

  if (echte.length){
    h += echte.map((x,i)=>{
      const farbe = x.anteil > 55 ? 'bad' : x.anteil > 35 ? 'warn' : '';
      return `<div class="karte ${farbe}" style="margin-bottom:8px">
        <h3>Bündel ${i+1} · ${proz(x.anteil)} % des bewegten Marktes
          <span style="float:right;font-weight:400;color:var(--ink-3);font-size:12.5px">${
            x.zusammenhalt != null ? esc(glText(x.zusammenhalt)) + ' (' +
            x.zusammenhalt.toFixed(2).replace('.',',') + ')' : ''}</span></h3>
        <div class="kpi" style="margin-top:6px">${x.mitglieder.map(m=>
          `<span>${esc(posName(m.b))}${m.hebel>1?` <b>${m.hebel.toFixed(m.hebel<10?1:0).replace('.',',')}×</b>`:''}
           <b>${num(m.markt,0)} €</b></span>`).join('')}</div>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Diese ${
          x.mitglieder.length} Positionen bewegen sich gemeinsam. Für dein Ergebnis
          zählen sie wie <strong>eine</strong> Position von ${num(x.markt,0)} € —
          ein schlechter Tag trifft sie alle am selben Tag.</p>
      </div>`;
    }).join('');
  }
  if (gross.length){
    h += gross.map(x=>{
      const m = x.mitglieder[0];
      return `<div class="karte ${x.anteil>35?'bad':'warn'}" style="margin-bottom:8px">
        <h3>Einzelwette · ${proz(x.anteil)} % des bewegten Marktes
          <span style="float:right;font-weight:400;color:var(--ink-3);font-size:12.5px">${
            esc(posName(m.b))}${m.hebel>1?` · ${m.hebel.toFixed(m.hebel<10?1:0).replace('.',',')}×`:''}</span></h3>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Dieser eine Wert
          bewegt ${num(x.markt,0)} € und läuft zu keinem anderen Posten messbar parallel.
          Eigenständig heisst hier aber nicht ungefährlich: er ist gross genug, um allein
          über dein Ergebnis zu entscheiden. Eine schlechte Nachricht zu diesem einen
          Unternehmen kostet dich ${proz(x.anteil)} % deiner Marktbewegung — unabhängig
          davon, was der Rest tut.</p>
      </div>`;
    }).join('');
  }
  if (eins.length){
    h += `<div class="karte gut" style="margin-bottom:8px">
      <h3>Läuft eigenständig · ${proz(eins.reduce((s,x)=>s+x.anteil,0))} %</h3>
      <div class="kpi" style="margin-top:6px">${eins.map(x=>
        `<span>${esc(posName(x.mitglieder[0].b))} <b>${num(x.markt,0)} €</b></span>`).join('')}</div>
      <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Zu keinem anderen
        Posten im Depot messbar gleichlaufend. Das ist der Teil, der Diversifikation
        tatsächlich leistet.</p></div>`;
  }

  // Der Satz, um den es geht.
  const groesst = [...echte, ...gross].sort((x,y)=>y.anteil-x.anteil)[0];
  if (groesst && groesst.anteil > 45){
    h += `<div class="note-box bad"><span class="nt">Worauf das hinausläuft</span>
      <p>${proz(groesst.anteil)} % von allem, was du am Markt bewegst, hängen an
      <strong>einer</strong> Bewegung. ${a.effektiv != null
        ? `Rechnerisch hast du ${a.effektiv.toFixed(1).replace('.',',')} Wetten laufen,
           nicht ${a.teile.length}.` : ''} Das ist keine Fehlentscheidung — aber es ist
      eine andere Wette als die, die eine Liste aus ${a.teile.length} Zeilen suggeriert.
      Wenn du das Risiko senken willst, hilft es nicht, innerhalb des Bündels
      umzuschichten; es hilft nur, das Bündel kleiner zu machen.</p></div>`;
  }
  return h;
}

/* ========================================== DEPOT-GESUNDHEIT 0–100 (Masterplan §15)

   Eine Zahl fuer das ganze Depot — aber keine erfundene. Sie setzt sich aus fuenf Teilen
   zu je 20 Punkten zusammen, und jeder Teil misst etwas, das Ozan SELBST aendern kann:

     Schutz    — welcher Anteil des Geldes hat einen Stop (bei Scheinen: genug Puffer)
     Streuung  — aus wie vielen unabhaengigen Wetten das Depot wirklich besteht
     Klumpen   — wie gross die groesste Einzelposition ist
     Hebel     — wie viel des gehebelten Geldes weit genug vom Knock-out entfernt ist
     Termine   — wie viel des Geldes in den naechsten 7 Tagen KEINE Quartalszahlen hat

   Was bewusst NICHT hineinzaehlt: die relative Staerke. Nachgemessen (27.09.) liefen
   Schlusslichter danach nicht schlechter — ein Gesundheitswert, der sie bestraft, wuerde
   zum Verkaufen draengen, ohne dass es etwas bringt. Die Gewichte sind gesetzt, nicht
   optimiert; deshalb steht jeder Teil mit seiner Zahl daneben. */
function depotGesundheit(stand){
  if (!stand || !stand.bew.length || !stand.gesamt) return null;
  const inEU = (b) => stand.inEuro(b, b.wert) || 0;
  const teile = stand.bew.filter(b => !istBar(b.pos) && inEU(b) > 0);
  const summe = teile.reduce((s, b) => s + inEU(b), 0);
  if (!summe) return null;
  const anteil = (f) => teile.filter(f).reduce((s, b) => s + inEU(b), 0) / summe;
  const hatSchutz = (b) => {
    const pl = b.pos.plan;
    if (pl && pl.stop != null && isFinite(pl.stop)) return true;
    return !!(b.hebel && !b.hebel.ausgeknockt && b.hebel.puffer_pct >= KO_PUFFER_ENG * 2);
  };
  const schutz = anteil(hatSchutz);
  const a = (typeof glBuendel === 'function') ? glBuendel(stand.bew, stand) : null;
  const eff = a && a.effektiv != null ? a.effektiv : null;
  const groesste = Math.max(...teile.map(b => inEU(b))) / summe * 100;
  const gehebelt = teile.filter(b => b.hebel);
  const hebelOk = gehebelt.length
    ? gehebelt.filter(b => !b.hebel.ausgeknockt && b.hebel.puffer_pct >= KO_PUFFER_ENG)
        .reduce((s, b) => s + inEU(b), 0) / gehebelt.reduce((s, b) => s + inEU(b), 0)
    : 1;
  const zahlenBald = (b) => {
    const row = b.row || (b.basis && b.basis.row);
    const z = row && row.info && row.info.zahlen;
    return !!(z && z.tage != null && z.tage <= 7);
  };
  const ohneTermin = 1 - anteil(zahlenBald);
  const pk = {
    schutz: Math.round(20 * schutz),
    streuung: eff == null ? null : Math.round(20 * Math.max(0, Math.min(1, (eff - 1) / 4))),
    klumpen: Math.round(20 * Math.max(0, Math.min(1, (40 - groesste) / 25))),
    hebel: Math.round(20 * hebelOk),
    termine: Math.round(20 * ohneTermin),
  };
  // Fehlt die Gleichlauf-Messung, wird auf die vier anderen Teile hochgerechnet.
  const da = Object.values(pk).filter(v => v != null);
  const wert = Math.round(da.reduce((s, v) => s + v, 0) / (da.length * 20) * 100);
  return {wert, pk, schutz, eff, groesste, hebelOk, ohneTermin, gehebelt: gehebelt.length,
          ohneStop: teile.filter(b => !hatSchutz(b))};
}
function gesundheitKasten(stand){
  const g = depotGesundheit(stand);
  if (!g) return '';
  const kl = g.wert >= 75 ? 'gut' : g.wert >= 50 ? 'warn' : 'bad';
  const farbe = g.wert >= 75 ? 'Grün' : g.wert >= 50 ? 'Gelb' : 'Rot';
  const z = (t, p, satz) => `<div class="rowx"><span class="lab">${t}</span>
    <span class="val" style="font-family:inherit;font-weight:400;text-align:right">
    <b>${p == null ? '—' : p + '/20'}</b> <span style="color:var(--ink-3)">${satz}</span></span></div>`;
  const tun = [];
  if (g.ohneStop.length)
    tun.push(`Stop setzen für ${g.ohneStop.slice(0,4).map(b => esc(posName(b))).join(', ')}`);
  if (g.pk.klumpen < 10) tun.push('die größte Position verkleinern');
  if (g.pk.hebel < 16) tun.push('Scheine mit knappem Knock-out-Puffer verkleinern');
  if (g.pk.termine < 16) tun.push('vor den anstehenden Quartalszahlen entscheiden, was du hältst');
  return `<div class="note-box ${kl}" style="margin:10px 0 0">
    <span class="nt">Depot-Gesundheit ${g.wert}/100 · ${farbe}</span>
    ${z('Schutz', g.pk.schutz, `${Math.round(g.schutz*100)} % des Geldes mit Stop oder weitem Puffer`)}
    ${z('Streuung', g.pk.streuung, g.eff != null ? `${g.eff.toFixed(1).replace('.',',')} unabhängige Wetten` : 'Gleichlauf noch nicht gemessen')}
    ${z('Klumpen', g.pk.klumpen, `größte Position ${g.groesste.toFixed(0)} % des Depots`)}
    ${z('Hebel', g.pk.hebel, g.gehebelt ? `${Math.round(g.hebelOk*100)} % des gehebelten Geldes ≥ ${KO_PUFFER_ENG} % vom Knock-out` : 'kein Hebel im Depot')}
    ${z('Termine', g.pk.termine, `${Math.round(g.ohneTermin*100)} % ohne Quartalszahlen in 7 Tagen`)}
    ${tun.length ? `<p style="margin:8px 0 0;font-size:13px"><strong>Was sie hebt:</strong> ${tun.join('; ')}.</p>` : ''}
    <p style="margin:6px 0 0;font-size:12px;color:var(--ink-3)">Fünf Teile zu je 20 Punkten —
      nur Dinge, die du selbst ändern kannst. Die relative Stärke zählt bewusst nicht mit.</p></div>`;
}

/* Quartalszahlen eines gehaltenen Werts (bei Scheinen: des Basiswerts). An so einem Tag
   springt der Kurs oft ueber jeden Stop — und bei einem Turbo kann eine Nacht den
   Knock-out bringen. Das gehoert an die Position, nicht nur in die Signal-Liste. */
/* Jeder zehnte Zahlen-Termin aller gescannten Aktien bewegte den Kurs um mehr als diesen
   Wert (Prozent, zwei Tage, 2024–26; refdata/zahlen_bewegung.json). */
const ZAHLEN_P90 = 13.1;
function zahlenHinweis(b){
  const row = b.row || (b.basis && b.basis.row) || null;
  const z = row && row.info && row.info.zahlen;
  if (!z || z.tage == null || z.tage > 14) return '';
  const wann = new Date(z.datum + 'T12:00:00Z').toLocaleDateString('de-DE',
    {weekday:'short', day:'2-digit', month:'2-digit'});
  const nm = name((row||{}).instrument || '');
  const bew = z.bewegung || null;
  const k = (x) => Number(x).toFixed(1).replace('.', ',');
  const hist = bew ? ` An den letzten ${bew.n} Terminen bewegte sich ${esc(nm)} im Mittel um
    ±${k(bew.median)} %, höchstens um ${k(bew.max)} %.` : '';
  const puffer = b.hebel && !b.hebel.ausgeknockt && b.hebel.puffer_pct != null ? b.hebel.puffer_pct : null;
  let satz, eng = z.tage <= 3;
  if (puffer != null){
    const grenze = Math.max(ZAHLEN_P90, bew && bew.max != null ? bew.max : 0);
    const knapp = puffer < grenze;
    eng = eng || knapp;
    satz = knapp
      ? ` <strong>Dein Puffer zum Knock-out: ${k(puffer)} %</strong> — eine Zahlen-Lücke dieser Größe
          hat es schon gegeben. Entscheide vorher, ob du den Schein über den Termin hältst.`
      : ` Dein Puffer zum Knock-out (${k(puffer)} %) ist größer als jede bisherige Zahlen-Bewegung —
          der Schein übersteht einen normalen Termin, ein Stop schützt aber nicht vor der Lücke.`;
  } else {
    satz = ' Ein Stop schützt nicht vor einer Kurslücke über Nacht.';
  }
  return `<div class="note-box ${eng?'warn':''}" style="margin:8px 0 0;padding:8px 12px">
    <p style="margin:0;font-size:13px"><strong>Quartalszahlen ${esc(nm)}
    ${esc(wann)}${z.zeit?' '+esc(z.zeit):''}</strong> — in ${z.tage} Tag${z.tage===1?'':'en'}.${hist}${satz}</p></div>`;
}

/* Woher der Kurs einer Position gerade kommt — live von der Boerse oder aus dem Scan.
   Ozan, 30.09.: „brauche Live-Update bei meinem Portfolio." Live ist nur, was der
   Kraken-Stream in den letzten zwei Minuten geliefert hat; alles andere steht mit dem
   Alter seines Kurses da, statt so zu tun, als waere es live. */
function kursQuelleMarke(b){
  const l = L.get(b.pos.sym) || (b.row ? L.get(b.row.instrument) : null);
  if (l && Date.now() - l.t < 120000)
    return `<span class="mini-tag" title="Livekurs von Kraken">LIVE</span>`;
  if (b.row && S && S.erzeugt){
    const min = Math.round((Date.now() - Date.parse(S.erzeugt)) / 60000);
    if (isFinite(min)) return `<span class="nu" style="font-size:10.5px">Scan vor ${min} Min</span>`;
  }
  return `<span class="nu" style="font-size:10.5px">Kurs von Hand</span>`;
}
function zeichnePortfolio(){
  /* Ein Depot in zwei Waehrungen zusammenzuzaehlen, ohne umzurechnen, ergibt eine Zahl,
     die es nicht gibt. Gerechnet wird alles in Euro — das ist die Waehrung, in der Ozan
     sein Geld tatsaechlich hat. Der Stand kommt aus derselben Funktion, die auch die
     Alarme benutzen; zwei Rechenwege fuer dieselbe Zahl waeren zwei Wahrheiten. */
  let stand = depotStand();
  if (!stand){ $('portfolio').innerHTML = `<p class="leer">Depot nicht lesbar.</p>`; return; }
  /* Zuerst die Stops, dann zeichnen. Aus einer toten Analyse wird nichts gesetzt — ein
     Stop aus Marken von gestern Abend ist schlechter als keiner. Aendert sich etwas,
     wird das Depot neu bewertet, sonst zeichnete die Seite den Stand von davor. */
  const stopLauf = (S && !scanTot()) ? stopsPflegen(stand.bew) : [];
  if (stopLauf.length) stand = depotStand() || stand;
  const {bew, kursEU, inEuro, gesamt} = stand;
  const gv = bew.reduce((s,b)=>s + (inEuro(b, b.gv)||0), 0);
  const einstand = bew.reduce((s,b)=>s + (inEuro(b, b.einstand)||0), 0);
  const jeKlasse = {};
  for (const b of bew){
    const k = b.row?.klasse || (b.basis ? (b.basis.art === 'breit' ? 'aktien' : 'aktien') : 'unbekannt');
    jeKlasse[k] = (jeKlasse[k]||0) + (inEuro(b, b.wert)||0);
  }
  const groesste = bew.slice().sort((a,b)=>(inEuro(b,b.wert)||0)-(inEuro(a,a.wert)||0))[0];
  const konz = (groesste && gesamt) ? (inEuro(groesste, groesste.wert)||0)/gesamt*100 : 0;

  /* Wer das Depot aufmacht, will zuerst Wert und Handlungsbedarf sehen — der Hinweis, wo
     die Daten liegen, steht jetzt unten bei „Mac und iPhone gleich halten". */
  const woLiegt = `<div class="note-box"><span class="nt">Wo dein Depot liegt</span>
    <p style="margin:0">Deine Positionen liegen in diesem Browser. Sie gehen nicht ins öffentliche Repo und
    nicht auf die öffentliche Seite. ${WA && WA.aktiv
      ? 'Für den Wächter rund um die Uhr liegt eine Kopie als <strong>Geheimnis</strong> bei '
        + 'GitHub (DEPOT_CODE) — dort ist sie für niemanden lesbar, auch nicht in den Protokollen.'
      : 'Auf einem anderen Gerät bringst du sie über den Reiter Sync hin.'}</p></div>`;
  let h = `<div id="pf_waechter"></div>`;

  if (bew.length){
    h += `<div class="status">
      <div><div class="k">Depotwert</div><div class="v">${num(gesamt,0)} €*</div>
        <div class="n">${bew.length} Position(en)</div></div>
      <div><div class="k">Gewinn / Verlust</div><div class="v ${gv>=0?'gut':'schlecht'}">${gv>=0?'+':'−'}${num(Math.abs(gv),0)} €</div>
        <div class="n">${einstand?pct(gv/einstand*100,1):'—'}</div></div>
      <div><div class="k">Konzentration</div><div class="v ${konz>35?'mittel':'gut'}">${konz.toFixed(0)} %</div>
        <div class="n">größte: ${esc(groesste?name(groesste.pos.sym):'—')}</div></div>
      <div><div class="k">Aufteilung</div><div class="v" style="font-size:14px;font-family:'JetBrains Mono',monospace">
        ${Object.entries(jeKlasse).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc({krypto:'Krypto',aktien:'Aktien',gold:'Gold',fx:'Devisen',unbekannt:'Sonstiges'}[k]||k)} ${gesamt?Math.round(v/gesamt*100):0} %`).join('<br>')||'—'}</div></div>
    </div>
    <p class="leer" style="padding:6px 0">* alles in Euro umgerechnet${kursEU?` (${num(kursEU,4)} $/€)`:''} —
      Kurse kommen für Krypto live von der Börse, für Aktien aus dem letzten Scan.
      Positionen ohne Kurs gehen mit dem Wert ein, den du eingetragen hast.
      Neu bewertet: ${new Date().toLocaleTimeString('de-DE')} — das läuft weiter, auch
      wenn dieser Reiter zu ist.</p>`;

    h += gesundheitKasten(stand);
    h += stopKasten(stopLauf, bew);

    /* Die Handlungsliste ganz oben. Wer das Depot aufmacht, will nicht vierzehn Karten
       lesen, sondern wissen, ob heute etwas zu tun ist — und wenn ja, was und wie viel. */
    const aktionen = bew.map(b => ({b, a: positionsAktion(b, stand)}))
                        .filter(x => x.a && x.a.art !== 'halten')
                        .sort((x,y) => (y.a.dringend?1:0) - (x.a.dringend?1:0));
    h += `<h2>Was jetzt zu tun ist</h2>`;
    h += !S ? `<div class="karte warn"><h3>Analyse noch nicht geladen</h3>
       <p style="margin:4px 0 0;font-size:13px">Hier steht erst etwas, wenn der Scan da ist.
       „Nichts zu tun" wäre jetzt keine Entwarnung, sondern eine Behauptung ohne Grundlage.</p></div>`
    : aktionen.length ? aktionen.map(({b,a})=>{
      const farbe = AKTION_FARBE[a.art] || '';
      return `<div class="karte ${farbe}" style="margin-bottom:8px">
        <h3>${a.dringend?'🔴 ':''}${esc(AKTION_WORT[a.art])} · ${esc(posName(b))}
          <span style="float:right;font-weight:400;color:var(--ink-3);font-size:12.5px">${esc(b.pos.konto||'')}</span></h3>
        <p style="margin:4px 0 0;font-size:14px"><strong>${esc(a.titel)}</strong></p>
        ${(a.menge!=null)?`<div class="kpi" style="margin-top:6px">
          <span>${a.art==='nachlegen'?'kaufen':'verkaufen'} <b>${num(a.menge, a.menge<1?6:4)}</b></span>
          <span>≈ <b>${num(a.euro,2)} €</b></span>
          <span>Anteil <b>${a.anteil!=null?pctK(a.anteil):'—'}</b></span></div>`:''}
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">${esc(a.text)}</p>
        ${(a.menge!=null && b.pos.menge)?`<p style="margin:9px 0 0">
          <button class="btn" data-mengeschl="${esc(posSchluessel(b.pos))}"
                  data-mengeart="${esc(a.art)}" data-mengewert="${a.menge}"
                  data-mengemarke="${esc(a.marke||'')}"
                  data-mengekurs="${b.kurs!=null?b.kurs:''}">${
            a.art==='nachlegen' ? 'Gekauft — ins Depot übernehmen'
                                : (a.art==='raus' ? 'Verkauft — Position schliessen'
                                                  : 'Verkauft — Menge anpassen')}</button>
          <span style="font-size:12px;color:var(--ink-3);margin-left:8px">rechnet danach
            sofort neu</span></p>`:''}
      </div>`;
    }).join('')
    : (() => {
      /* „Die Stops stehen" darf nur dastehen, wenn sie stehen. Vorher stand das auch bei
         einer Position ohne Stop — zwei Kästen über der Warnung „ohne Stop". */
      const ohne = bew.filter(b => !istBar(b.pos) && b.kurs != null
        && !(b.pos.plan && b.pos.plan.stop != null) && !(b.hebel && b.hebel.puffer_pct >= KO_PUFFER_ENG * 2));
      return ohne.length
        ? `<div class="karte warn"><h3>Fast nichts — ${ohne.length === 1 ? 'ein Stop fehlt' : ohne.length + ' Stops fehlen'}</h3>
           <p style="margin:4px 0 0;font-size:13px">Kein Stop gerissen, kein Ziel erreicht. Aber
           <strong>${ohne.map(b => esc(posName(b))).join(', ')}</strong> ${ohne.length === 1 ? 'hat' : 'haben'}
           keinen Stop — dort meldet sich die App nicht, wenn es eng wird. Unten auf der Karte eine
           Marke eintragen: dahin, wo der Grund, aus dem du gekauft hast, nicht mehr gilt.</p></div>`
        : `<div class="karte gut"><h3>Nichts zu tun</h3>
       <p style="margin:4px 0 0;font-size:13px">Keine Position verlangt gerade eine Handlung.
       Kein Stop gerissen, kein Ziel erreicht, kein Knock-out, der jetzt Handeln verlangt — und nichts,
       wo sich Nachlegen rechnen würde. Die Stops stehen und werden nachgezogen; Nichtstun
       ist hier das Ergebnis, nicht die Lücke.</p></div>`; })();

    h += glKasten(stand);

    /* Auf einen Blick: wie viel Geld wo steckt. Ozan, 28.09.: „es steht ja immer noch
       nicht, mit wie viel Euro ich dort drin bin." Jetzt als erste Tabelle, nach Wert
       sortiert — Euro, Anteil, Gewinn/Verlust und wie weit der Stop entfernt ist. */
    const zeilenUe = bew.map(b => {
      const eu = inEuro(b, b.wert);
      const pk = planKurs(b);
      const st = b.pos.plan && b.pos.plan.stop != null && pk ? (pk - b.pos.plan.stop) / pk * 100 : null;
      return {b, eu, st};
    }).sort((x, y) => (y.eu || 0) - (x.eu || 0));
    h += `<h2>Auf einen Blick</h2>
      <div class="tw"><table class="mtf" style="font-size:13px">
      <thead><tr><th>Position</th><th style="text-align:right">Wert</th><th style="text-align:right">Anteil</th>
        <th style="text-align:right">G/V</th><th style="text-align:right">bis Stop</th></tr></thead>
      <tbody>${zeilenUe.map(({b, eu, st}) => `<tr>
        <td>${esc(posName(b))}<br><span class="nu" style="font-size:11px">${esc(b.pos.konto||'')}</span>
          ${kursQuelleMarke(b)}</td>
        <td style="text-align:right"><b>${eu!=null?num(eu, eu<100?2:0)+' €':'—'}</b></td>
        <td style="text-align:right">${eu!=null&&gesamt?(eu/gesamt*100).toFixed(1).replace('.',',')+' %':'—'}</td>
        <td style="text-align:right" class="${b.gvPct==null?'':b.gvPct>=0?'up':'dn'}">${b.gvPct!=null?pct(b.gvPct,1):'—'}</td>
        <td style="text-align:right">${st!=null?st.toFixed(1).replace('.',',')+' %':'<span class="nu">kein Stop</span>'}</td>
      </tr>`).join('')}
      <tr><td><b>Summe</b></td><td style="text-align:right"><b>${num(gesamt,0)} €</b></td><td></td>
        <td style="text-align:right" class="${gv>=0?'up':'dn'}">${einstand?pct(gv/einstand*100,1):'—'}</td><td></td></tr>
      </tbody></table></div>`;

    h += `<h2>Positionen</h2>`;
    h += bew.map(b=>{
      const d = digits(b.kurs||1);
      const r = b.row;
      const z = waehrungsZeichen(b.w);
      /* Was die Position gerade wert ist — in Euro UND in ihrer eigenen Waehrung.
         b.wert steht in der Waehrung der Position (bei SOLUSDT also Dollar); ohne
         Umrechnung stuende hier ein Dollarbetrag mit Euro-Zeichen. Umgerechnet wird mit
         derselben Funktion wie der Depotwert oben — eine Zahl, ein Rechenweg. */
      const posWertEUR = inEuro(b, b.wert);
      const posWertEigen = (b.w !== 'EUR' && b.wert != null) ? b.wert : null;
      let ku;
      try { ku = kartenUrteil(b, positionsAktion(b, stand)); } catch(e){ ku = kartenUrteil(b, null); }
      return `<div class="karte ${ku.kl}">
        <h3>${esc(posName(b))}${posWertEUR!=null?` <span style="font-weight:600;color:var(--ink)">· ${num(posWertEUR, posWertEUR<100?2:0)} €</span>`:''}
          <span class="mono" style="font-weight:400;color:var(--ink-3)">${esc(b.pos.konto||'')}</span>
          <span style="float:right" class="note ${ku.kl==='gut'?'gut':ku.kl==='bad'?'bad':ku.kl==='warn'?'warn':''}">${esc(ku.wort)}</span></h3>
        <div class="kpi">
          ${b.pos.menge?`<span>Menge <b>${num(b.pos.menge, 6)}</b></span>`:''}
          ${(posWertEUR!=null && b.kurs!=null)?`<span>Wert <b>${num(posWertEUR, posWertEUR<100?2:0)} €</b>${
            posWertEigen!=null?` <span style="color:var(--ink-3)">≈ ${num(posWertEigen, posWertEigen<100?2:0)} $</span>`:''}${
            (gesamt && posWertEUR!=null)?` <span style="color:var(--ink-3)">· ${(posWertEUR/gesamt*100).toFixed(1).replace('.',',')} % vom Depot</span>`:''}</span>`:''}
          ${b.pos.einstieg?`<span>Einstieg <b>${num(b.pos.einstieg,d)}${z}</b></span>`:''}
          ${b.kurs!=null?`<span>Kurs <b>${num(b.kurs,d)}${z}</b>${b.live?' <span class="up">live</span>':''}</span>`
            :`<span>Wert <b>${num(b.wert,2)} €</b> <span style="color:var(--ink-3)">von dir eingetragen</span></span>`}
          ${b.gvPct!=null?`<span>G/V <b class="${b.gvPct>=0?'up':'dn'}">${pct(b.gvPct,1)}</b></span>`:''}
          ${b.r!=null?`<span title="gemessen am Abstand Einstieg → dein Stop">Stand <b class="${b.r>=0?'up':'dn'}">${b.r>=0?'+':'−'}${Math.abs(b.r).toFixed(2).replace('.',',')} R</b></span>`:''}
        </div>
        ${zahlenHinweis(b)}
        ${r ? '' : basisKasten(b)}
        ${hebelKasten(b)}
        ${entscheidungsKasten(b, stand)}
        ${ratKasten(b, ku)}
        ${mehrKasten(b)}
        <p style="margin:9px 0 0"><button class="link" data-weg="${esc(b.pos.sym)}">entfernen</button>
          ${r?` · <button class="link" data-zeig="${esc(r.instrument)}">Chart ansehen</button>`:''}
          ${(!r && b.basis && b.basis.sym)?` · <button class="link" data-zeig="${esc(b.basis.sym)}">Basiswert im Chart</button>`:''}</p>
      </div>`;
    }).join('');

    /* Rotation — aber nur mit echtem Anlass.

       Vorher wurde der Score der Position gegen den Score der besten Chance gestellt. Das
       musste immer anschlagen: eine Position, in der man drin ist, hat fast nie ein frisches
       Einstiegssetup. Der Kasten stand deshalb praktisch dauerhaft da und hat sich damit
       selbst entwertet.

       Jetzt braucht es zwei Dinge gleichzeitig: die Position muss in ihrer Klasse
       tatsaechlich hinterherlaufen (Schlusslicht), UND es muss ein handelbares Setup mit
       ordentlicher Note geben. Sonst ist Umschichten nur Gebuehren zahlen. */
    const beste = (S?.gesamt||[]).filter(o=>o.handelbar && o.score >= 52)[0];
    const nachzuegler = bew.filter(b=>b.halt && b.halt.rs != null && b.halt.rs < RS_SCHWACH)
                           .sort((a,b)=>a.halt.rs - b.halt.rs)[0];
    if (beste && nachzuegler && beste.instrument !== nachzuegler.row?.instrument){
      h += `<div class="note-box warn"><span class="nt">Kapital könnte besser stehen</span>
        <p><strong>${esc(posName(nachzuegler))}</strong> ist das Schlusslicht deiner
        ${nachzuegler.row?.klasse === 'aktien' ? 'Aktien' : 'Coins'} — schwächer als
        ${(100-nachzuegler.halt.rs).toFixed(0)} % der Klasse. Gleichzeitig hat
        <strong>${esc(name(beste.instrument))}</strong> ein handelbares Setup
        (Score ${beste.score.toFixed(0)}, Note ${esc(beste.note)}${beste.erwartete_bewegung_pct!=null?', erwartet '+bewegungText(beste):''}).</p>
        <p>Das ist ein Hinweis, keine Anweisung — und nichts wird automatisch umgeschichtet.
        Schlusslicht zu sein ist allein kein Verkaufsgrund (gemessen liefen Schlusslichter danach
        nicht schlechter als ihre Klasse). Wenn du aber Kapital für das Setup brauchst, ist das
        die Position, deren Verkauf dich am wenigsten Stärke kostet. Ein Wechsel kostet Gebühren
        und Spread und wirft die laufende These weg.</p></div>`;
    }
  } else {
    h += `<p class="leer">Noch keine Positionen eingetragen.</p>`;
  }

  h += `<h2>Position eintragen</h2>
    <div class="karte">
      <div class="rowx"><span class="lab">Symbol</span>
        <input id="pf_sym" class="val" placeholder="BTCUSDT oder NVDA" style="width:52%"></div>
      <div class="rowx"><span class="lab">Menge</span>
        <input id="pf_menge" class="val" inputmode="decimal" placeholder="0,25" style="width:52%"></div>
      <div class="rowx"><span class="lab">Einstiegskurs</span>
        <input id="pf_einstieg" class="val" inputmode="decimal" placeholder="61000" style="width:52%"></div>
      <div class="rowx"><span class="lab">Konto</span>
        <input id="pf_konto" class="val" placeholder="Bybit / Trade Republic" style="width:52%"></div>
      <div class="rowx"><span class="lab">Basiswert <span style="color:var(--ink-3)">nur bei Schein</span></span>
        <input id="pf_basis" class="val" placeholder="TSM, NFLX, BTCUSD …" style="width:52%"></div>
      <div class="rowx"><span class="lab">Knock-out <span style="color:var(--ink-3)">Schwelle im Basiswert</span></span>
        <input id="pf_ko" class="val" inputmode="decimal" placeholder="148,20" style="width:52%"></div>
      <div class="rowx"><span class="lab">Bezugsverhältnis</span>
        <input id="pf_ratio" class="val" inputmode="decimal" placeholder="1" style="width:52%"></div>
      <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Bei einem Turbo reichen
      <strong>Basiswert und Knock-out</strong> — Hebel, Scheinpreis und der Puffer bis zur
      Schwelle werden daraus gerechnet. Den Hebel musst du nicht eintragen, er ergibt sich.</p>
      <p style="margin:11px 0 0"><button class="btn" id="pf_add">Hinzufügen</button>
        ${bew.length?` <button class="link" id="pf_clear" style="margin-left:12px">alle löschen</button>`:''}</p>
    </div>

    <h2>Mac und iPhone gleich halten</h2>
    ${woLiegt}
    <div class="karte">
      <p style="margin:0 0 10px;font-size:13.5px">Dein Depot liegt im Speicher dieses Geräts.
      Damit auf dem iPhone dasselbe steht wie hier, gibt es den eigenen Reiter
      <strong>Sync</strong> — kopieren, drüben einsetzen, fertig.</p>
      <p style="margin:0"><button class="btn" id="pf_zum_sync">Zum Sync-Reiter</button></p>
    </div>

    <h2>Ganzes Depot auf einmal</h2>
    <div class="karte">
      <p style="margin:0 0 9px;font-size:13px;color:var(--ink-2)">Eine Position je Zeile.
      Reihenfolge: <span class="mono">Symbol Menge Einstiegskurs Konto</span> — getrennt
      durch Leerzeichen, Tabulator, Komma oder Semikolon. Komma als Dezimaltrennzeichen
      geht auch. Das Konto darf fehlen.</p>
      <textarea id="pf_bulk" rows="6" spellcheck="false"
        placeholder="NVDA 12 118,40 Trade Republic&#10;BTCUSDT 0,25 61000 Bybit&#10;ETHUSDT 1,5 2380 Kraken"></textarea>
      <p style="margin:10px 0 0"><button class="btn" id="pf_import">Übernehmen</button>
        <button class="link" id="pf_export" style="margin-left:14px">Alles als Text ausgeben</button></p>
      <div id="pf_meldung"></div>
    </div>`;

  $('portfolio').innerHTML = h;
  fuelleWaechter($('pf_waechter'));
  $('portfolio').querySelectorAll('details[data-mehr]').forEach(d=>d.addEventListener('toggle',()=>{
    if (d.open) MEHR_OFFEN.add(d.dataset.mehr); else MEHR_OFFEN.delete(d.dataset.mehr);
  }));
  $('portfolio').querySelectorAll('[data-weg]').forEach(b=>b.addEventListener('click',()=>{
    speicherePositionen(ladePositionen().filter(p=>p.sym!==b.dataset.weg)); zeichnePortfolio();
  }));
  $('portfolio').querySelectorAll('[data-zeig]').forEach(b=>b.addEventListener('click',()=>
    waehle(b.dataset.zeig)));
  /* Stop nachtraeglich setzen — per Vorschlag oder von Hand. Ab dem Moment ueberwacht
     die App die Position und meldet sich, wenn der Stop faellt. */
  const planSetzen = (sym, plan) => {
    const a = ladePositionen();
    const p = a.find(x => x.sym === sym);
    if (!p) return;
    p.plan = {...(p.plan||{}), richtung:'long', waehrung: posWaehrung(p), ...plan};
    speicherePositionen(a);
    zeichnePortfolio();
  };
  $('portfolio').querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{
    const z = (s) => s === '' || s == null ? null : Number(s);
    planSetzen(b.dataset.plan, {stop: Number(b.dataset.stop), tp1: z(b.dataset.tp1),
                                tp2: z(b.dataset.tp2), tp3: z(b.dataset.tp3), quelle:'analyse'});
  }));
  $('portfolio').querySelectorAll('[data-stopsetzen]').forEach(b=>b.addEventListener('click',()=>{
    const sym = b.dataset.stopsetzen;
    const feld = $('portfolio').querySelector(`[data-stopfeld="${CSS.escape(sym)}"]`);
    const zf = $('portfolio').querySelector(`[data-zielfeld="${CSS.escape(sym)}"]`);
    const stop = feld && feld.value !== '' ? Number(feld.value) : null;
    if (stop == null || !isFinite(stop)){ if (feld) feld.focus(); return; }
    const ziel = zf && zf.value !== '' ? Number(zf.value) : null;
    planSetzen(sym, {stop, tp1: isFinite(ziel) ? ziel : null, quelle:'selbst'});
  }));
  // Einen nachgezogenen Stop abhaken: die Order liegt beim Broker, der Merker darf weg.
  const brokerAbhaken = (filter) => {
    const a = ladePositionen();
    let was = false;
    for (const p of a){
      if (p.plan && p.plan.broker_offen && filter(p)){ delete p.plan.broker_offen; was = true; }
    }
    if (was){ speicherePositionen(a); zeichnePortfolio(); }
  };
  $('portfolio').querySelectorAll('[data-brokerok]').forEach(btn=>btn.addEventListener('click',()=>
    brokerAbhaken(p => posSchluessel(p) === btn.dataset.brokerok)));
  const alleOk = $('pf_broker_alle');
  if (alleOk) alleOk.addEventListener('click', ()=> brokerAbhaken(()=>true));

  /* Die Handlung wirklich vollziehen — nicht nur lesen.

     Ozan: „wenn ich da jetzt was reduziere, soll da auch so ein Knopf sein, wo ich dann
     reduzieren kann und er dann wieder neu analysiert."

     Genau das passiert hier: die Menge wird angepasst, gespeichert, und die Seite rechnet
     danach alles neu — Anteil, Klumpen, Gleichlauf, Tagesrisiko, die naechste Handlung.
     Der Knopf fuehrt KEINE Order aus; er haelt fest, was Ozan beim Broker getan hat.
     Deshalb heisst er „Verkauft", nicht „Verkaufen". */
  $('portfolio').querySelectorAll('[data-mengeschl]').forEach(btn=>btn.addEventListener('click',()=>{
    const a = ladePositionen();
    const i = a.findIndex(p => posSchluessel(p) === btn.dataset.mengeschl);
    if (i < 0) return;
    const pos = a[i];
    const art = btn.dataset.mengeart;
    const wert = Number(btn.dataset.mengewert);
    const kurs = btn.dataset.mengekurs === '' ? null : Number(btn.dataset.mengekurs);
    if (!isFinite(wert) || wert <= 0) return;

    if (art === 'nachlegen'){
      // Einstand mischen, sonst stimmt jede Gewinnanzeige danach nicht mehr.
      const alt = Number(pos.menge) || 0;
      const neu = alt + wert;
      if (pos.einstieg != null && kurs != null && neu > 0)
        pos.einstieg = (alt * pos.einstieg + wert * kurs) / neu;
      pos.menge = neu;
    } else {
      const rest = (Number(pos.menge) || 0) - wert;
      // Ein Rest unter einem Promille ist Rundung, keine Position.
      if (art === 'raus' || rest <= (Number(pos.menge) || 0) * 0.001){
        a.splice(i, 1);
      } else {
        pos.menge = rest;
        // Nach einem Teilverkauf ist der alte Plan nicht falsch, aber der Stop gehoert
        // neu geprueft — das macht stopsPflegen beim naechsten Zeichnen von selbst.
        // Die Regel, die den Teilverkauf verlangt hat, ist damit erledigt — sonst kaeme
        // derselbe Rat auf die Restmenge sofort wieder (bei TP1 rueckt so auch der Stop
        // auf den Einstieg).
        const marke = btn.dataset.mengemarke;
        if (marke) pos.erledigt = Array.from(new Set([...(pos.erledigt||[]), marke]));
      }
    }
    speicherePositionen(a);
    zeichnePortfolio();
  }));

  // Ein erreichtes Ziel abhaken: danach zeigt der Plan den naechsten Schritt statt
  // denselben nochmal. Ohne das stuende bei jedem Aufruf wieder "TP1 verkaufen".
  $('portfolio').querySelectorAll('[data-erledigt]').forEach(b=>b.addEventListener('click',()=>{
    const a = ladePositionen();
    const pos = a.find(p=>p.sym === b.dataset.erledigt);
    if (!pos) return;
    pos.erledigt = Array.from(new Set([...(pos.erledigt||[]), b.dataset.marke]));
    speicherePositionen(a);
    zeichnePortfolio();
  }));
  const add = $('pf_add');
  if (add) add.addEventListener('click',()=>{
    const sym = ($('pf_sym').value||'').trim().toUpperCase();
    const menge = parseFloat(($('pf_menge').value||'').replace(',','.'));
    const einstieg = parseFloat(($('pf_einstieg').value||'').replace(',','.'));
    if (!sym || !isFinite(menge) || menge <= 0) return;
    const a = ladePositionen().filter(p=>p.sym!==sym);
    const zahl = (id) => { const v = parseFloat((($(id)||{}).value||'').replace(',','.'));
                           return isFinite(v) ? v : null; };
    const basisFeld = (($('pf_basis')||{}).value||'').trim().toUpperCase();
    a.push({sym, menge, einstieg: isFinite(einstieg)?einstieg:null,
            konto: ($('pf_konto').value||'').trim(), seit: Date.now(),
            ...(basisFeld ? {basis: basisFeld} : {}),
            ...(zahl('pf_ko') != null ? {ko: zahl('pf_ko')} : {}),
            ...(zahl('pf_ratio') != null ? {ratio: zahl('pf_ratio')} : {})});
    speicherePositionen(a); zeichnePortfolio();
  });
  const clear = $('pf_clear');
  if (clear) clear.addEventListener('click',()=>{ speicherePositionen([]); zeichnePortfolio(); });

  const zs = $('pf_zum_sync');
  if (zs) zs.addEventListener('click', ()=>{ zeichneSync(); zeigeTab(4); });

  const imp = $('pf_import');
  if (imp) imp.addEventListener('click',()=>{
    const {neu, fehler} = leseDepot($('pf_bulk').value || '');
    if (neu.length){
      // Bestehende Positionen mit demselben Symbol werden ersetzt, nicht verdoppelt.
      const behalten = ladePositionen().filter(p=>!neu.some(n=>n.sym===p.sym));
      speicherePositionen(behalten.concat(neu));
    }
    zeichnePortfolio();
    const m = $('pf_meldung');
    if (m) m.innerHTML =
      `<p style="margin-top:10px;font-size:12.5px;color:${neu.length?'var(--long)':'var(--warn)'}">
        ${neu.length} Position(en) übernommen.${fehler.length
          ? ` <span style="color:var(--warn)">Nicht gelesen: ${fehler.map(esc).join(' · ')}</span>` : ''}</p>`;
  });
  const exp = $('pf_export');
  if (exp) exp.addEventListener('click',()=>{
    const text = ladePositionen().map(p=>
      [p.sym, p.menge, p.einstieg ?? '', p.konto || ''].join(' ').trim()).join('\n');
    const el = $('pf_bulk'); if (el) el.value = text;
    const m = $('pf_meldung');
    if (m) m.innerHTML = `<p style="margin-top:10px;font-size:12.5px;color:var(--ink-2)">
      Oben steht jetzt dein ganzes Depot als Text — kopieren und auf dem anderen Gerät
      hier einfügen. Das ist der Umzug: die Daten liegen nur in diesem Browser.</p>`;
  });
}

/* Depot aus Text lesen.
   Absichtlich nachsichtig: Ozan tippt das ab oder kopiert es aus der Broker-App, und
   dann steht dort mal ein Tabulator, mal ein Semikolon, mal "118,40" und mal "118.40".
   Ein Import, der daran scheitert, wird kein zweites Mal benutzt. Was nicht gelesen
   werden kann, wird ZURUECKGEMELDET statt still verschluckt — eine Position, die
   lautlos fehlt, ist schlimmer als eine Fehlermeldung. */
function leseDepot(text){
  const neu = [], fehler = [];
  for (const roh of String(text).split(/\r?\n/)){
    const zeile = roh.trim();
    if (!zeile) continue;
    /* Das Dezimalkomma ZUERST in einen Punkt umschreiben. Sonst zerlegt der Trenner
       "118,40" in zwei Felder — die Menge stimmt, der Einstiegskurs wird zu 118 und
       die 40 landet im Kontonamen. Genau so ist es beim ersten Versuch passiert. */
    const norm = zeile.replace(/(\d)[,](\d)/g, '$1.$2').replace(/[€$£]/g, ' ');
    const teile = norm.split(/[\s,;]+/).filter(Boolean);
    if (teile.length < 2){ fehler.push(zeile.slice(0,24)); continue; }
    const sym = teile[0].toUpperCase().replace(/[^A-Z0-9.\-]/g, '');
    let i = 1;
    const zahlen = [];
    while (i < teile.length && /^\d+(\.\d+)?$/.test(teile[i])){ zahlen.push(parseFloat(teile[i])); i++; }
    const menge = zahlen[0];
    if (!sym || !isFinite(menge) || menge <= 0){ fehler.push(zeile.slice(0,24)); continue; }
    neu.push({
      sym,
      menge,
      einstieg: isFinite(zahlen[1]) ? zahlen[1] : null,
      konto: teile.slice(i).join(' ').trim(),
    });
  }
  return {neu, fehler};
}
