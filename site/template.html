      ${broker.map(b => {
        const o = b.pos.plan.broker_offen;
        if (o.ebene === 'basis'){
          const bn = esc(b.pos.plan.basis_name || 'Basiswert');
          const zb = b.pos.plan.waehrung === 'EUR' ? ' €' : ' $';
          const db = digits(o.stop || 1);
          return `<p style="margin:8px 0 0;font-size:13px">
          <strong>${esc(posName(b))}</strong> — Marke auf ${bn} ${o.von != null
            ? `von ${num(o.von,db)}${zb} auf <strong>${num(o.stop,db)}${zb}</strong> nachgezogen`
            : `bei <strong>${num(o.stop,db)}${zb}</strong>`}
          <span style="color:var(--ink-3)">· Für den Schein gibt es beim Broker keine Order
            auf den Basiswert — die App und der Wächter melden sich, wenn ${bn} darunter fällt.</span>
          <button class="btn" data-brokerok="${esc(posSchluessel(b.pos))}"
                  style="margin-left:8px;padding:3px 9px;font-size:12px">verstanden</button></p>`;
        }
        const d = digits(b.kurs || o.stop || 1);
        const z = waehrungsZeichen(b.w);
        return `<p style="margin:8px 0 0;font-size:13px">
          <strong>${esc(posName(b))}</strong> — Stop ${o.korrektur
            ? `von ${num(o.von,d)}${z} auf <strong>${num(o.stop,d)}${z}</strong> setzen (weiter weg — Korrektur)`
            : o.von != null
            ? `von ${num(o.von,d)}${z} auf <strong>${num(o.stop,d)}${z}</strong> nachziehen`
            : `neu auf <strong>${num(o.stop,d)}${z}</strong>`}
          <span style="color:var(--ink-3)">· ${esc(o.grund||'')}</span>
          <button class="btn" data-brokerok="${esc(posSchluessel(b.pos))}"
                  style="margin-left:8px;padding:3px 9px;font-size:12px">eingetragen</button></p>`;
      }).join('')}
      <p style="margin:10px 0 0"><button class="btn" id="pf_broker_alle">Alle eingetragen</button></p>
    </div>`;
  }
  if (offen.length){
    h += `<div class="note-box" style="margin:10px 0 0">
      <span class="nt">Ohne Stop — und die App kann hier keinen ableiten</span>
      <p style="font-size:13px">${offen.map(b=>esc(posName(b))).join(', ')}.
      Für diese Werte gibt die Analyse gerade keine Invalidierung her, also erfindet die
      App auch keine. Trag unten auf der Karte selbst eine Marke ein — ein eigener Stop,
      den die App überwacht, ist unendlich viel mehr wert als ein ausgedachter.</p></div>`;
  }
  return h;
}

function ausstiegsKasten(b, a){
  const schritt = naechsterSchritt(b.pos, planKurs(b), b.w);
  const hinw = a && a.hinweis
    ? `<p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">${esc(a.hinweis)}</p>` : '';
  if (!schritt){
    // Ohne Kurs kein Stop: bei einem Turbo oder einem ETF, der hier nur mit dem von Hand
    // eingetragenen Wert steht, waere eine Stopmarke eine Zahl ohne Gegenstueck.
    if (b.kurs == null){
      return `<div class="note-box" style="margin:10px 0 0"><span class="nt">Kein Ausstiegsplan</span>
        <p>Für diesen Posten hat die App keinen laufenden Kurs — nur den Wert, den du
        eingetragen hast. Einen Stop kann sie deshalb nicht überwachen.
        ${b.basis && b.basis.sym ? `Was sie kann: dir sagen, wenn <strong>${esc(name(b.basis.sym))}</strong>
        als Basiswert kippt — das steht oben im Urteil.` : ''}</p>${hinw}</div>`;
    }
    const schwelle = scheinSchwelleIstStop(b);
    if (schwelle != null){
      const bn = esc((b.hebel && b.hebel.basisName) || 'der Basiswert');
      return `<div class="note-box" style="margin:10px 0 0"><span class="nt">Was jetzt zu tun ist</span>
        <p style="font-size:14px;margin:0 0 4px"><strong>Halten — die Schwelle ist hier der Stop</strong></p>
        <p style="margin:0">Jede Marke aus der Analyse (Halte-Stop, Setup) läge unter der
        Knock-out-Schwelle bei ${num(schwelle, digits(schwelle))} — bevor sie greifen könnte,
        wäre der Schein schon weg. Deshalb setzt die App hier keinen eigenen Stop. Sie und der
        Wächter auf GitHub melden sich, wenn der Puffer von ${bn} bis zur Schwelle unter
        ${KO_PUFFER_ENG} % (eng) oder ${KO_PUFFER_KRITISCH} % (kritisch) fällt.</p>
        <p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Ist dir das zu nah, hilft
        kein Stop, sondern ein Schein mit mehr Abstand zur Schwelle — also weniger Hebel.</p>${hinw}</div>`;
    }
    const v = stopVorschlag(b);
    const d = digits(b.kurs || 1);
    const z = waehrungsZeichen(b.w);
    const sym = esc(b.pos.sym);
    const vorschlag = v ? `<p style="margin:6px 0 0">Aus der laufenden Analyse
        ${v.vomBasiswert ? '<em>des Basiswerts</em> ' : ''}ergibt sich:
        <strong>Stop ${num(v.stop,d)}${z}</strong>${v.tp1!=null?` · Ziel ${num(v.tp1,d)}${z}`:''}
        ${v.tp2!=null?` / ${num(v.tp2,d)}${z}`:''}${v.tp3!=null?` / ${num(v.tp3,d)}${z}`:''}
        ${v.vomBasiswert ? '<br><span style="color:var(--ink-3)">Achtung: das sind die Marken des '
          + 'Basiswerts. Für einen gehebelten Schein liegen sie anders — nur als Orientierung.</span>' : ''}</p>
      <p style="margin:8px 0 0"><button class="btn" data-plan="${sym}"
         data-stop="${v.stop}" data-tp1="${v.tp1==null?'':v.tp1}"
         data-tp2="${v.tp2==null?'':v.tp2}" data-tp3="${v.tp3==null?'':v.tp3}">Vorschlag übernehmen</button></p>`
      : `<p style="margin:6px 0 0">Die Analyse gibt hier gerade <strong>keine</strong>
         Invalidierung her — also erfindet die App auch keine. Setz den Stop dahin, wo der
         Grund, aus dem du gekauft hast, nicht mehr gilt.</p>`;
    return `<div class="note-box warn" style="margin:10px 0 0"><span class="nt">Kein Ausstiegsplan</span>
      <p>Diese Position hat keinen Stop — und damit meldet sich die App bei ihr auch nicht,
      wenn es eng wird. Das ist die wichtigste Lücke in deinem Depot.</p>
      ${vorschlag}
      <p style="margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <label style="font-size:12.5px;color:var(--ink-2)">eigener Stop</label>
        <input type="number" step="any" inputmode="decimal" data-stopfeld="${sym}"
               placeholder="${b.kurs!=null?num(b.kurs*0.9,d):'Preis'}"
               style="width:120px;padding:5px 7px;border:1px solid var(--linie);border-radius:6px;
                      background:var(--flaeche);color:var(--ink)">
        <label style="font-size:12.5px;color:var(--ink-2)">Ziel (optional)</label>
        <input type="number" step="any" inputmode="decimal" data-zielfeld="${sym}"
               style="width:120px;padding:5px 7px;border:1px solid var(--linie);border-radius:6px;
                      background:var(--flaeche);color:var(--ink)">
        <button class="btn" data-stopsetzen="${sym}">Stop speichern</button>
      </p>${hinw}</div>`;
  }
  const farbe = schritt.stufe === 'stop' ? 'bad' : (schritt.stufe === 'halten' ? '' : 'warn');
  const pl = b.pos.plan || {};
  const basis = pl.ebene === 'basis';
  const pk = planKurs(b);
  const d = digits(pk || b.kurs || 1);
  const w = pl.waehrung === 'EUR' ? ' €' : (pl.waehrung === 'USDT' ? ' USDT' : (basis ? ' $' : ''));
  const marken = planMarken(b);
  /* Bei einem Schein: was die Position an der Marke ungefaehr noch wert waere. Das ist
     die Zahl, die man im Depot beim Broker wiedererkennt. */
  let scheinSatz = '';
  const hb = b.hebel;
  if (basis && hb && !hb.ausgeknockt && pl.stop != null && hb.ko != null){
    const abst = hb.lang ? pl.stop - hb.ko : hb.ko - pl.stop;
    if (abst > 0){
      if (hb.ratio == null) return '';
      let je = abst / hb.ratio;
      const kEU = (b.basis && b.basis.row && b.basis.row.eurusd) || (S && S.eurusd);
      if (b.w === 'EUR' && pl.waehrung !== 'EUR' && kEU) je = je / kEU;
      const wert = je * (Number(b.pos.menge) || 1);
      scheinSatz = `<p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Fällt
        ${esc(pl.basis_name || 'der Basiswert')} auf die Marke, wäre deine Position noch rund
        <strong>${num(wert, 0)}${waehrungsZeichen(b.w)}</strong> wert. Die Marke liegt auf dem
        Basiswert, nicht auf dem Schein — beim Broker gibt es dafür keine eigene Order; die App
        und der Wächter auf GitHub melden sich, wenn sie fällt.</p>`;
    }
  }
  const halteSatz = pl.art === 'halte'
    ? `<p style="margin:6px 0 0;font-size:12px;color:var(--ink-3)">Halte-Stop — wird nur
        nachgezogen, nie gelockert. Warum und wie gemessen: „Mehr zur Analyse".</p>` : '';
  const titel = a && a.eigen ? a.titel : schritt.titel;
  const text = a && a.eigen ? a.text : schritt.text;
  const knopf = schritt.marke
    ? `<p style="margin:9px 0 0"><button class="btn" data-erledigt="${esc(b.pos.sym)}"
         data-marke="${esc(schritt.marke)}">${esc(schritt.marke)} verkauft — abhaken</button></p>`
    : '';
  return `<div class="note-box ${farbe}" style="margin:10px 0 0">
    <span class="nt">Was jetzt zu tun ist</span>
    <p style="font-size:14px;margin:0 0 4px"><strong>${esc(titel)}</strong></p>
    <p style="margin:0">${esc(text)}</p>
    <div class="kpi" style="margin-top:8px">${marken}</div>${scheinSatz}${halteSatz}${hinw}${knopf}</div>`;
}

/* ================================================ URTEIL JE POSITION
   „Analysier auch immer mein Portfolio — ob ich rausgehen soll oder reingehen."

   Der Scanner bewertet den Chart. Eine gehaltene Position braucht aber eine andere
   Frage als eine Chance: nicht „ist das ein guter Einstieg", sondern „wuerde ich das
   heute nochmal kaufen". Das ist dieselbe Information, anders herum gelesen — und sie
   faellt bei jedem Scan neu an, ohne dass jemand etwas anklicken muss.

   Was hier NICHT passiert: automatisch verkaufen, und so tun, als waere ein Score eine
   Anweisung. Jeder Satz sagt, worauf er beruht. */
function positionsRat(b){
  const r = b.row;
  const pos = b.pos;
  const gv = b.gvPct;
  const saetze = [];
  let stufe = 'neutral';

  if (!r){
    const ba = b.basis;
    if (ba && ba.art === 'turbo' && ba.row){
      const br = ba.row;
      const ren = (br.zusatz && br.zusatz.renditen) || {};
      const lauf = [];
      if (ren.r21 != null) lauf.push(`${ren.r21>=0?'+':''}${ren.r21.toFixed(0)} % im letzten Monat`);
      if (ren.r63 != null) lauf.push(`${ren.r63>=0?'+':''}${ren.r63.toFixed(0)} % im Quartal`);
      const saetze = [
        `Der Schein selbst laesst sich nicht scannen — sein Basiswert schon. `
        + `${name(ba.sym)}: ${br.headline || 'kein klares Bild'}`
        + (lauf.length ? ` (${lauf.join(', ')})` : '') + '.'];
      if (ba.gegen === 'setup') saetze.push('Die Analyse des Basiswerts zeigt gerade ein handelbares '
        + 'Setup GEGEN deine Richtung. Mit Hebel ist das der Moment, die Position zu verkleinern '
        + 'oder den Stop enger zu ziehen — nicht, sie auszusitzen.');
      else if (ba.gegen === 'neigung') saetze.push('Das Chartbild des Basiswerts neigt gegen deine '
        + 'Richtung, ohne handelbares Setup. Beobachten — und den Abstand zur Schwelle im Blick.');
      else if (ba.rs == null || ba.rs >= RS_MITTE) saetze.push('Solange der Basiswert traegt, '
        + 'traegt auch der Schein — nur schneller in beide Richtungen.'
        + (ba.rs != null ? ` Relative Stärke ${ba.rs.toFixed(0)} von 100.` : ''));
      else saetze.push(`Der Basiswert läuft schwächer als ${(100-ba.rs).toFixed(0)} % seiner Klasse. `
        + 'Nicht nachkaufen. Allein ein Verkaufsgrund ist das nicht — beim Schein entscheidet '
        + 'vor allem der Abstand zur Knock-out-Schwelle, und der wird oben eigens bewertet.');
      saetze.push(`Score ${br.score.toFixed(0)} (Note ${br.note}) heisst nur: so gut wäre ein `
        + 'NEUER Einstieg heute. Über das Halten sagt er nichts.');
      saetze.push('Wichtig: Stop und Ziele des Basiswerts sind NICHT die des Scheins. Der Hebel '
        + 'verschiebt jeden Abstand, und die genaue Schwelle steht nur im Papier des Emittenten.');
      if (ba.geraten) saetze.push('(Basiswert automatisch aus dem Namen erkannt — wenn das nicht '
        + 'stimmt, trag die Position mit dem richtigen Kuerzel neu ein.)');
      const stufe = ba.gegen === 'setup' ? 'bad'
                  : (ba.gegen || (ba.rs != null && ba.rs < RS_MITTE)) ? 'warn' : 'gut';
      return {stufe, kopf: 'Ueber den Basiswert ' + name(ba.sym), saetze};
    }
    if (ba && ba.art === 'breit'){
      const a = ba.breite.anteil;
      const saetze = [
        `Ein Welt-ETF hat keinen einzelnen Basiswert — er ist der Markt. Gemessen wird er `
        + `deshalb an der Marktbreite: ${ba.breite.oben} von ${ba.breite.n} gescannten Aktien `
        + `stehen ueber ihrem Stand von vor einem Quartal (${a.toFixed(0)} %).`];
      saetze.push(a >= 60
        ? 'Das ist ein breiter Markt. Genau dafuer ist so ein ETF da: er braucht keine einzelne '
          + 'Aktie, die funktioniert, sondern nur die Mehrheit.'
        : a >= 35
        ? 'Das ist ein gespaltener Markt — es traegt, aber es traegt nicht breit. Halten ist hier '
          + 'meist richtiger als handeln; ein Welt-ETF ist kein Instrument fuer Timing.'
        : 'Die Mehrheit faellt. Das ist der eine Fall, in dem auch ein Welt-ETF nicht diversifiziert '
          + 'ist — in einem breiten Abschwung faellt er mit.');
      saetze.push('Und der Punkt, der dabei oft untergeht: ein Welt-ETF ist der Teil des Depots, '
        + 'der NICHT beobachtet werden muss. Er ist die Gegenposition zu allem anderen hier.');
      const stufe = a >= 60 ? 'gut' : (a >= 35 ? 'neutral' : 'warn');
      return {stufe, kopf:'Ueber die Marktbreite', saetze};
    }
    return {stufe:'unbekannt', kopf:'Keine Bewertung',
      saetze:[ (pos.wert_manuell != null)
        ? 'Dieser Posten steht nicht im gescannten Universum und hat auch keinen erkennbaren '
          + 'Basiswert. Wert und Einstand hast du eingetragen, mehr kann die App dazu '
          + 'ehrlicherweise nicht sagen.'
        : 'Der Wert war im letzten Scan nicht dabei. Entweder ausserhalb des Universums '
          + 'oder die Datenquelle war stumm.' ]};
  }

  const h = b.halt || haltUrteil(r, istKurzDirekt(pos));
  /* „Gegen" heisst: das Setup zeigt gegen DEINE Position. Eine gekaufte Position gegen
     ein Short-Setup, ein Short-Schein gegen ein Long-Setup. */
  const posKurz = (pos.plan && pos.plan.richtung === 'short') || pos.hebel_richtung === 'short';
  const gegen = r.richtung === (posKurz ? 'long' : 'short');
  const mit = r.richtung === (posKurz ? 'short' : 'long');
  const score = r.score;
  const klasse = r.klasse === 'aktien' ? 'Aktien' : (r.klasse === 'krypto' ? 'Coins' : 'Werte');
  /* Zukauf nur mit demselben Tor wie ein Alarm (02.10.).

     Vorher reichte „Score ab 52 in deine Richtung" fuer den Satz „hier wäre heute sogar ein
     Zukauf vertretbar" — auch bei Note WATCH, also ohne handelbares Setup. Bei Bitcoin,
     Dash und Zcash stand er so auf derselben Karte wie „Schlusslicht … nicht nachkaufen".
     Ein Zukauf ist ein Kauf wie jeder andere: er braucht ein handelbares Setup in deine
     Richtung, dessen Setup-Art sich in der eigenen Bilanz bewährt hat (``alarm.ja`` aus dem
     Scan — dieselben Prüfungen wie fürs Handy). Sonst sagt die Karte: nicht nachkaufen. */
  const zukauf = !!(mit && r.handelbar && r.alarm && r.alarm.ja === true);
  const nichtNach = zukauf
    ? ` ${posKurz ? 'Aufstocken' : 'Nachkaufen'} nur über das bewährte Setup unten — mit eigenem Stop, nicht wegen des Kurses.`
    : null;
  const posStop = (pos.plan && pos.plan.stop != null && isFinite(pos.plan.stop)
                   && (pos.plan.ebene || 'position') === 'position') ? pos.plan.stop : null;

  if (h && h.rs != null){
    const rs = h.rs;
    const monat = h.ren.r21, quartal = h.ren.r63;
    const lauf = [];
    if (monat != null) lauf.push(`${monat>=0?'+':''}${monat.toFixed(0)} % im letzten Monat`);
    if (quartal != null) lauf.push(`${quartal>=0?'+':''}${quartal.toFixed(0)} % im Quartal`);
    const lz = lauf.length ? ` (${lauf.join(', ')})` : '';
    if (h.kurz){
      // Short: ``rs`` ist schon gespiegelt — hoch heisst hier „schwach, gut für dich".
      if (rs >= RS_MITTE){
        stufe = 'gut';
        saetze.push(`Für deinen Short läuft es: schwächer als ${rs.toFixed(0)} % der ${klasse}${lz}. `
          + (rs >= RS_FUEHRER ? 'Schwäche hält meist über Wochen an — nicht vorzeitig zurückkaufen.'
                              : 'Kein Grund zu schliessen, aber auch keiner aufzustocken.'));
      } else {
        stufe = 'warn';
        saetze.push(`Gegen deinen Short: stärker als ${(100-rs).toFixed(0)} % der ${klasse}${lz}. `
          + (nichtNach ? nichtNach.trim() : 'Nicht aufstocken.') + ' Geschlossen wird über den '
          + 'Stop oder wenn die Analyse gegen dich dreht — nicht über den Tabellenplatz.');
      }
    } else if (rs >= RS_FUEHRER){
      stufe = 'gut';
      saetze.push(`Läuft besser als ${rs.toFixed(0)} % der gescannten ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Relative Stärke hält meist über Wochen '
        + 'an — das ist die Position, die man am wenigsten anfassen sollte.');
    } else if (rs >= RS_MITTE){
      stufe = 'gut';
      saetze.push(`Mittelfeld: besser als ${rs.toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Kein Grund auszusteigen, aber auch keiner '
        + 'nachzulegen.');
    } else if (rs >= RS_SCHWACH){
      stufe = 'warn';
      saetze.push(`Nachzügler: nur besser als ${rs.toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Wenn der Rest der Klasse läuft und dieser '
        + 'Wert nicht, gibt es dafür meistens einen Grund.'
        + (nichtNach || ' Beobachten, nicht nachkaufen.'));
    } else {
      stufe = 'warn';
      saetze.push(`Schlusslicht: schwächer als ${(100-rs).toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '.' + (nichtNach || ' Nicht nachkaufen.')
        + ' Ein Verkaufsgrund ist '
        + 'das allein aber nicht: in den eigenen Daten liefen Schlusslichter danach im Schnitt '
        + 'nicht schlechter als der Rest ihrer Klasse. Raus geht es über deinen Stop oder wenn '
        + 'die Analyse gegen dich dreht — nicht über den Tabellenplatz.');
    }
  } else if (h){
    stufe = h.kl === 'bad' ? 'bad' : (h.kl === 'warn' ? 'warn' : 'gut');
    /* Bis 02.10.: „… fehlt die Historie — eigene Rendite negativ" — bei Gold (PAX), das
       27 % im Plus lag. Gemeint war die Rendite des Werts im letzten Monat, nicht die der
       Position. Jetzt steht die Zahl da, und wofür sie gilt. */
    const m21 = h.ren && h.ren.r21, m63 = h.ren && h.ren.r63;
    if (m21 != null){
      const lauf = [`${m21>=0?'+':''}${m21.toFixed(0)} % im letzten Monat`];
      if (m63 != null) lauf.push(`${m63>=0?'+':''}${m63.toFixed(0)} % im Quartal`);
      saetze.push(`Für einen Vergleich mit der eigenen Klasse gibt es zu wenige Werte im Scan. `
        + `Für sich allein: ${lauf.join(', ')} — `
        + ((h.kurz ? m21 <= 0 : m21 >= 0) ? (h.kurz ? 'das trägt deinen Short.' : 'der Wert trägt.')
                    : 'der Wert läuft gerade gegen dich.' + (nichtNach || (h.kurz ? ' Nicht aufstocken.' : ' Nicht nachkaufen.'))));
    } else {
      saetze.push('Für einen Vergleich mit der eigenen Klasse fehlt die Historie — '
        + (h.grund || 'zu wenig Daten') + '.');
    }
  }

  if (gegen){
    if (stufe === 'gut') stufe = 'warn';
    const d0 = digits(posStop || r.kurs || 1);
    saetze.push(`Dazu kommt: die Analyse sieht hier gerade ein Setup nach ${posKurz ? 'OBEN' : 'UNTEN'}. Du hältst `
      + 'also gegen die Richtung, die das System sieht. Kein Verkaufsbefehl — '
      + (posStop != null
        ? `dein Stop bei ${num(posStop, d0)}${waehrungsZeichen(b.w)} entscheidet, nicht die Gegenanalyse `
          + '(bei Coins nachgemessen: solche Lagen liefen danach nicht schlechter als ihre Klasse).'
        : 'aber der Moment, in dem ein Stop im Depot stehen sollte.'));
  }
  /* Was nicht jeden Tag auf jeder Karte stehen muss, kommt in ``mehr`` — die Karte
     klappt es auf Wunsch auf. Ozan, 28.09.: „die Analysen gefallen mir nicht." Beim
     Nachsehen stand auf jeder Karte derselbe Satz „Einstiegsseite: Score 0 — kein
     frisches Setup", zweimal „Was jetzt zu tun ist" und technische Warnungen wie „Reihe
     auf H4 nicht frisch" bei Aktien am Wochenende. Oben bleibt nur, was entscheidet. */
  const mehr = [];
  if (score != null){
    /* Bis 01.10. hiess ein hoher Score immer „Zukauf vertretbar" — auch wenn er zu einem
       SHORT gehoerte. Bei Mondelez stand beides auf derselben Karte: „Setup nach unten"
       und „hier wäre sogar ein Zukauf vertretbar". */
    const setupName = r.setup && r.setup.name ? `„${r.setup.name}“` : 'Setup';
    if (gegen){
      mehr.push(`Einstiegsseite: Score ${score.toFixed(0)} (Note ${r.note}) — aber für die `
        + 'Gegenrichtung. Für einen Zukauf spricht das nicht.');
    } else if (zukauf){
      saetze.push(`Einstiegsseite: ${setupName} in deine Richtung, Note ${r.note} — und diese `
        + 'Setup-Art hat sich in der eigenen Bilanz bewährt (dieselbe Prüfung wie für einen Alarm). '
        + 'Ein Zukauf wäre vertretbar, mit eigenem Stop wie jeder neue Trade.');
    } else if (mit && r.handelbar){
      const grund = (r.alarm && r.alarm.grund) || 'die Setup-Art hat sich in der eigenen Bilanz noch nicht bewährt';
      mehr.push(`Einstiegsseite: ${setupName} in deine Richtung (Note ${r.note}), aber kein Alarm: `
        + `${grund}. Für einen Zukauf reicht das nicht — fürs Halten sagt es nichts.`);
    } else {
      mehr.push('Einstiegsseite: gerade kein handelbares Setup'
        + (r.deckel ? ` (${r.deckel})` : '') + '. Das ist eine Aussage über einen neuen Einstieg, '
        + 'nicht über das Halten; für einen Zukauf fehlt der Anlass.');
    }
  }

  if (gv != null && gv <= -20){
    saetze.push(`Du liegst ${Math.abs(gv).toFixed(0)} % im Minus. Die Frage ist nicht, wann es `
      + 'zurückkommt, sondern ob dieselbe These heute noch gilt. Ein Verlust wird nicht '
      + 'dadurch kleiner, dass man ihn aussitzt — begrenzt wird er vom Stop.');
  } else if (gv != null && gv >= 20){
    saetze.push(`${gv.toFixed(0)} % im Plus. Ohne festes Ziel gibt es keinen Grund auszusteigen `
      + '— der nachgezogene Stop sorgt dafür, dass aus dem Gewinn nicht wieder eine Null wird.');
  }
  // Datenwarnungen, die bei Aktien ausserhalb der Boersenzeit normal sind, sind fuer
  // eine gehaltene Position kein Gegenargument — sie verunsichern nur.
  const aktie = r.klasse === 'aktien';
  const warn = (r.warnungen||[]).filter(w => !(aktie && /nicht frisch|veraltet|alt\b/i.test(w)));
  if (warn.length) mehr.push('Dagegen: ' + warn.slice(0,2).join(' · '));

  const kopf = {gut:'Halten', warn:'Beobachten', bad:'Reduzieren erwägen',
                neutral:'Halten', unbekannt:'Keine Bewertung'}[stufe];
  return {stufe, kopf, saetze, mehr};
}

/* Die Zahlen des Basiswerts — sichtbar getrennt von den Zahlen der Position, damit
   niemand den Stop von TSMC fuer den Stop seines Scheins haelt. */
/* Die Zahlen, die bei einem Schein wirklich zaehlen: Hebel und Puffer. Der Scheinpreis
   ist Rechnung, kein Kurs vom Emittenten — das steht auch so da. */
function hebelKasten(b){
  const h = b.hebel;
  if (!h) return '';
  if (h.art === 'margin'){
    const eng = h.puffer_pct < KO_PUFFER_ENG;
    const d = digits(h.liquidation || 1);
    const z = waehrungsZeichen(b.w);
    return `<div class="note-box ${h.ausgeknockt ? 'bad' : (h.puffer_pct < KO_PUFFER_KRITISCH ? 'bad' : (eng ? 'warn' : ''))}"
      style="margin:10px 0 0">
      <span class="nt">Gehebelt · ${h.hebel.toFixed(0)}×</span>
      <div class="kpi">
        <span>Hebel <b>${h.hebel.toFixed(0)}×</b></span>
        <span>Puffer bis Liquidation <b class="${eng?'dn':'up'}">${h.puffer_pct.toFixed(1).replace('.',',')} %</b></span>
        <span>rechnerisch bei <b>${num(h.liquidation,d)}${z}</b></span>
        ${h.einsatz?`<span>eigener Einsatz <b>${num(h.einsatz,2)}${z}</b></span>`:''}
      </div>
      <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">Bei ${h.hebel.toFixed(0)}×
      reicht eine Bewegung von rund ${(100/h.hebel).toFixed(0)} % gegen dich, um den Einsatz
      aufzubrauchen — die Börse schließt dann selbst. Die Marke ist gerechnet, nicht von Bybit
      abgelesen: Gebühren und Erhaltungsmarge schieben sie etwas nach oben, ein Nachschuss nach
      unten. <strong>Der Gewinn in Dollar hängt an der Stückzahl, das Risiko am Hebel.</strong></p>
    </div>`;
  }
  if (h.ausgeknockt) return `<div class="note-box bad" style="margin:10px 0 0">
    <span class="nt">Knock-out berührt</span>
    <p>${esc(h.basisName)} steht bei ${num(h.basisKurs, digits(h.basisKurs))}, die Schwelle
    lag bei ${num(h.ko, digits(h.ko))}. Der Schein ist damit verfallen.</p></div>`;
  const eng = h.puffer_pct < KO_PUFFER_ENG;
  const d = digits(h.basisKurs);
  return `<div class="note-box ${h.puffer_pct < KO_PUFFER_KRITISCH ? 'bad' : (eng ? 'warn' : '')}"
    style="margin:10px 0 0">
    <span class="nt">Hebel · ${esc(h.basisName)}</span>
    <div class="kpi">
      <span>Hebel <b>${h.hebel.toFixed(1).replace('.',',')}×</b></span>
      <span>Puffer bis Knock-out <b class="${eng?'dn':'up'}">${h.puffer_pct.toFixed(1).replace('.',',')} %</b></span>
      <span>Basiswert <b>${num(h.basisKurs,d)}</b></span>
      <span>Schwelle <b>${num(h.ko,d)}</b></span>
    </div>
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">Der Puffer sagt, wie weit
    ${esc(h.basisName)} fallen darf, bevor der Schein <strong>wertlos verfällt</strong> — nicht
    ins Minus läuft, sondern weg ist. Ein Stop hilft dagegen nicht, die Schwelle greift auch
    nachts. Der Scheinpreis hier ist aus Basiswert und Schwelle gerechnet; der Emittent rechnet
    zusätzlich Aufgeld und Finanzierungskosten, dein Depot zeigt also ein paar Cent daneben.</p>
    ${h.ratio_fehlt ? `<p style="margin:8px 0 0;font-size:12.5px"><strong>Bezugsverhältnis fehlt</strong> —
    ohne es ist der Scheinpreis unbekannt, und damit auch Wert und Gewinn dieser Position (Hebel und
    Puffer stimmen trotzdem). In Trade Republic steht es in den Produktdetails (z. B. „0,1"). Alternativ
    den aktuellen Wert der Position eintragen, dann wird es daraus abgeleitet.</p>`
    : h.ratioQuelle && h.ratioQuelle !== 'eingetragen' ? `<p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-3)">Bezugsverhältnis ${esc(h.ratioQuelle)}.</p>` : ''}
  </div>`;
}

function basisKasten(b){
  const ba = b.basis;
  if (!ba) return `<p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-3)">
    Nicht im letzten Scan — keine Bewertung. Entweder außerhalb des Universums
    oder die Datenquelle war stumm.</p>`;
  if (ba.art === 'breit'){
    const a = ba.breite.anteil;
    return `<div class="zt" style="margin-top:8px">
      <span>Marktbreite <b class="${a>=60?'up':(a>=35?'':'dn')}">${a.toFixed(0)} %</b></span>
      <span>über Quartalsstand <b>${ba.breite.oben}/${ba.breite.n}</b></span>
      <span>Makro <b>${esc((REGIME_TEXT||{})[ba.lage]||ba.lage)}</b></span>
    </div>`;
  }
  if (ba.art === 'index'){
    return `<div class="zt" style="margin-top:8px">
      <span>Basiswert <b>${esc(ba.row.name)}</b></span>
      <span>Tagesschluss <b>${num(ba.row.kurs, 2)}</b>${ba.row.kursStand ? ' · ' + esc(ba.row.kursStand) : ''}</span>
    </div>
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-3)">Für den Index gibt es keinen Livekurs und keine eigene Chart-Analyse —
      Puffer und Hebel gelten für den Stand vom Vortagesschluss.</p>`;
  }
  const r = ba.row;
  const d = digits(r.kurs||1);
  return `<div class="zt" style="margin-top:8px">
      <span>Basiswert <b>${esc(name(ba.sym))}</b></span>
      <span>Kurs <b>${num(r.kurs,d)} ${esc(r.waehrung||'')}</b></span>
      <span>Score <b>${r.score.toFixed(0)}</b></span>
      <span>Note <b>${esc(r.note)}</b></span>
      ${r.rs!=null?`<span>rel. Stärke <b>${r.rs.toFixed(0)}</b></span>`:''}
    </div>
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">${esc(r.headline||'')}
      <span style="color:var(--ink-3)"> — gilt für ${esc(name(ba.sym))}, nicht für den Schein.</span></p>`;
}

/* ============================================ WAS JETZT ZU TUN IST

   „Er soll mir bei den Sachen im Portfolio sagen: jetzt nochmal rein, oder jetzt ein
   wenig verkaufen. Er sieht ja auch, wie viel ich drin bin."

   Bisher stand auf der Karte ein Urteil („Beobachten") und ein Ausstiegsplan („bis TP1
   sind es 4 %"). Beides richtig, beides keine Handlung. Zwischen „die Struktur trägt
   nicht mehr" und „verkauf 0,6 Solana für 53 €" liegt genau der Schritt, den man morgens
   um sieben nicht selbst rechnen will.

   Hier wird er gerechnet. Die Regeln, in dieser Reihenfolge — die erste, die greift,
   gewinnt:

     1. Stop gerissen            → alles raus. Keine Diskussion, das ist der Zweck eines Stops.
     2. Ziel erreicht            → ein Drittel raus, Stop auf Einstand.
     3. Analyse zeigt nach unten → die Hälfte raus. Man hält gegen das, was man selbst misst.
     4. Schlusslicht der Klasse  → ein Drittel raus. Relative Schwäche bleibt eher, als dass
                                   sie dreht; genau hier liegt totes Kapital am längsten.
     5. Klumpen über 25 %        → auf 25 % zurückschneiden. Ein Depot, das an einem Wert
                                   hängt, ist kein Depot.
     6. Führender Wert MIT einem
        frischen Setup und Stop  → nachlegen, auf 0,5 % Risiko gerechnet.
     7. sonst                    → halten.

   Was hier ausdrücklich NICHT passiert: nachlegen, weil eine Position im Minus steht.
   Verbilligen fühlt sich nach Handeln an und ist das Gegenteil davon — es vergrössert
   genau die Position, die schon nicht funktioniert. Nachgelegt wird nur in Stärke, und
   nur, wenn es einen Stop gibt, gegen den sich die Grösse rechnen lässt. */
const ZIEL_GEWICHT = 12;    // Prozent des Depots, die ein Einzelwert anstrebt
const MAX_GEWICHT  = 25;    // darüber wird zurückgeschnitten
/* Und dasselbe eine Ebene höher: ein Bündel gemessen gleichlaufender Werte darf nicht
   über die Hälfte der Marktbewegung ausmachen, ohne dass die App aufhört, dort zum
   Nachlegen zu raten. 25 % für einen Einzelwert zu deckeln und gleichzeitig zehn Werte
   zu empfehlen, die sich alle zusammen bewegen, wäre eine Regel, die sich selbst
   aushebelt. */
const BUENDEL_MAX  = 50;
const NACHKAUF_RISIKO_PCT = 0.5;
/* Unter diesem Betrag lohnt keine Order. Bei Trade Republic kostet jede Ausführung 1 €:
   ein Teilverkauf über 11 € zahlt neun Prozent Gebühr, um elf Euro zu bewegen. Solche
   Vorschläge sind schlimmer als keine — sie sehen nach Handeln aus und verbrennen Geld.
   Fällt ein Teilverkauf darunter, wird stattdessen die ganze (kleine) Position geschlossen
   oder die Menge auf eine sinnvolle Ordergrösse angehoben. */
const MIN_ORDER_EUR = 25;

/* ================================== DEPOT AUF BEIDEN GERAETEN GLEICH

   „Das Portfolio, das ich hier auf dem Mac habe, habe ich nicht auf dem Handy. Auf dem
   Handy habe ich auch noch neue Sachen hinzugefügt. Die müssen verknüpft sein."

   Das Depot liegt bewusst nur im Browser — das Repo ist öffentlich, echte Depotdaten
   gehören da nicht hin. Der Preis dafür ist genau dieses Problem: zwei Geräte, zwei
   Speicher, zwei Wahrheiten. Ohne Server lässt sich das nicht automatisch auflösen.

   Was ohne Server geht: den ganzen Stand in einen Code packen, den man von einem Gerät
   zum anderen schickt — als Text oder als Link. Der Code enthält ALLES, was zu einer
   Position gehört: Menge, Einstieg, Konto, der gespeicherte Plan mit Stop und Zielen,
   abgehakte Ziele, von Hand eingetragene Werte. Der alte Text-Export konnte das nicht,
   er kannte nur vier Spalten.

   Und er überschreibt nicht blind. Beim Einsetzen wird zuerst verglichen und gezeigt,
   was neu ist und was sich ändert — sonst löscht ein Import vom Mac die Positionen, die
   nur auf dem Handy stehen. Genau das wäre hier passiert. */
const DEPOT_CODE_VERSION = 1;
/* ISIN: 2 Buchstaben, 9 alphanumerisch, 1 Pruefziffer. Gueltig nur, wenn die Pruefziffer stimmt —
   eine falsch abgetippte ISIN darf nie zwei Produkte gleichsetzen. */
function isinNorm(v){
  const s = String(v||'').toUpperCase().replace(/\s+/g, '');
  if (!/^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(s)) return '';
  let z = '';
  for (const c of s) z += /[A-Z]/.test(c) ? String(c.charCodeAt(0) - 55) : c;
  let sum = 0, zweite = false;
  for (let i = z.length - 1; i >= 0; i--){
    let d = +z[i];
    if (zweite){ d *= 2; if (d > 9) d -= 9; }
    sum += d; zweite = !zweite;
  }
  return sum % 10 === 0 ? s : '';
}
function depotCode(){
  const daten = {v: DEPOT_CODE_VERSION, t: Date.now(), p: ladePositionen()};
  const roh = JSON.stringify(daten);
  try { return btoa(unescape(encodeURIComponent(roh))); } catch(e){ return roh; }
}
function ausDepotCode(text){
  let s = String(text||'').trim();
  if (!s) return null;
  // Auch einen ganzen Link akzeptieren — wer ihn sich selbst schickt, kopiert oft alles.
  const m = s.match(/[#?&]depot=([^&\s]+)/);
  if (m) s = decodeURIComponent(m[1]);
  let roh = s;
  if (!s.startsWith('{')){
    try { roh = decodeURIComponent(escape(atob(s.replace(/\s+/g,'')))); } catch(e){ return null; }
  }
  let d;
  try { d = JSON.parse(roh); } catch(e){ return null; }
  const liste = Array.isArray(d) ? d : (Array.isArray(d.p) ? d.p : null);
  if (!liste) return null;
  const sauber = liste.filter(x => x && typeof x.sym === 'string' && x.sym);
  /* ``k``: die Konten, die dieser Code VOLLSTÄNDIG beschreibt (ein Abgleich, etwa aus
     Screenshots). Für diese Konten gilt: was im Code fehlt, ist verkauft. Ohne ``k`` ist
     der Code wie bisher nur eine Liste — dann wird nie etwas als verkauft markiert. */
  const konten = (!Array.isArray(d) && Array.isArray(d.k)) ? d.k.map(String) : [];
  return sauber.length ? {liste: sauber, zeit: d.t || null, konten,
                          quelle: (!Array.isArray(d) && d.q) ? String(d.q) : ''} : null;
}
/* Schlüssel einer Position: Kürzel UND Konto. Denselben Coin auf zwei Börsen zu halten
   ist normal, und beim Zusammenführen dürfen die sich nicht gegenseitig auffressen. */
const posSchluessel = p => String(p.sym||'').toUpperCase() + '|' + String(p.konto||'').toLowerCase();

/* ================================================ DEPOT-ABGLEICH (seit 27.09.)

   „Update mein Portfolio" — mit Screenshots aus Kraken, Bybit und Trade Republic.

   Bisher verglich der Import nur das exakte Kürzel. Stand Solana im Depot als SOLEUR und
   kam im Code als SOLUSDT, waren das zwei Positionen: die alte blieb stehen, die neue kam
   dazu, und das Depot zeigte Solana doppelt. Und ein Import ersetzte die ganze Position —
   dein Stop, die abgehakten Ziele, der Knock-out waren danach weg, wenn der Code sie nicht
   selbst mitbrachte.

   Jetzt:
   * Verglichen wird die MÜNZE (SOLEUR = SOLUSD = SOLUSDT) bzw. bei Scheinen der
     BASISWERT, jeweils je Konto (Kraken, Bybit und Trade Republic in jeder Schreibweise).
   * Zusammengeführt wird FELDWEISE: was der Code mitbringt, gilt; was er nicht kennt
     (Stop, Ziele, abgehakte Teilverkäufe, Notizen), bleibt. Wechselt die Währung der
     Position (SOLEUR → SOLUSDT), wird der gespeicherte Plan umgerechnet statt in der
     falschen Währung stehen zu bleiben.
   * Ein Abgleich-Code nennt die Konten, die er vollständig beschreibt. Was dort im Depot
     steht, aber im Code fehlt, ist verkauft — und wird angezeigt, nicht stillschweigend
     gelöscht. Entfernt wird es nur mit dem eigenen Knopf dafür. */
function kontoNorm(k){
  const s = String(k||'').toLowerCase().replace(/[^a-z]/g, '');
  if (!s) return '';
  if (s === 'tr' || s.startsWith('traderepublic') || s.startsWith('trade')) return 'traderepublic';
  for (const b of ['bybit','kraken','binance']) if (s.includes(b)) return b;
  return s;
}
function abgleichKern(p){
  const s = String((p && p.sym) || '').toUpperCase();
  // Die ISIN ist das einzige, was ein Produkt eindeutig macht: zwei Scheine auf denselben
  // Basiswert sind zwei Posten, und derselbe Schein unter zwei Namen ist einer.
  const isin = isinNorm(p && p.isin);
  if (isin) return 'I:' + isin;
  // Scheine (Turbo, Knock-out …) über ihren Basiswert — „TURBO-TSMC-LONG" und ein Turbo
  // mit basis TSM sind derselbe Posten. Nie über muenzeVon: die kürzt „TURBO-…" auf
  // „TURBO", und dann wären alle Scheine ein und derselbe.
  const scheinArtig = p && (p.ko != null || p.basis || /TURBO|KNOCK|MINI|LONG|SHORT|CALL|PUT/.test(s));
  if (scheinArtig){
    const b = basisVon(p);
    if (b && b.sym) return 'T:' + String(b.sym).toUpperCase() + (p.hebel_richtung === 'short' ? ':S' : '');
    return 'S:' + s;
  }
  if (s.includes('-') && !/-YFD$/.test(s)) return 'S:' + s;   // ETF, Freitext
  return muenzeVon(s);
}
/* Zu einer eingehenden Position die vorhandene finden: gleicher Kern und gleiches Konto;
   hat die vorhandene gar kein Konto eingetragen, reicht der Kern. */
function findeGegenstueck(p, vorhanden, schonVergeben){
  const kern = abgleichKern(p), konto = kontoNorm(p.konto);
  const frei = vorhanden.filter(q => !schonVergeben.has(q) && abgleichKern(q) === kern);
  return frei.find(q => kontoNorm(q.konto) === konto)
      || frei.find(q => !kontoNorm(q.konto))
      || null;
}
function depotVergleich(eingehend, konten, vorhanden){
  vorhanden = vorhanden || ladePositionen();
  const vergeben = new Set();
  const neu = [], geaendert = [], gleich = [], paare = [];
  for (const p of eingehend){
    const vorher = findeGegenstueck(p, vorhanden, vergeben);
    if (!vorher){ neu.push(p); paare.push([null, p]); continue; }
    vergeben.add(vorher);
    paare.push([vorher, p]);
    const zusammen = zusammenfuegen(vorher, p);
    if (JSON.stringify(zusammen) !== JSON.stringify(vorher)) geaendert.push(p);
    else gleich.push(p);
  }
  const nurHier = vorhanden.filter(q => !vergeben.has(q));
  const kset = new Set((konten || []).map(kontoNorm).filter(Boolean));
  const weg = kset.size ? nurHier.filter(q => kset.has(kontoNorm(q.konto))) : [];
  return {neu, geaendert, gleich, nurHier, weg, paare};
}
/* Feldweise: der Code gewinnt, das Depot behält, was der Code nicht kennt. */
function zusammenfuegen(alt, neu){
  const m = {...alt, ...neu};
  if (neu.plan == null && alt.plan) m.plan = alt.plan;
  if (neu.erledigt == null && alt.erledigt) m.erledigt = alt.erledigt;
  if (neu.seit == null && alt.seit) m.seit = alt.seit;
  const wa = posWaehrung(alt), wn = posWaehrung(m);
  if (m.plan && neu.plan == null && wa !== wn){
    const k = S && S.eurusd;
    if (k){
      const f = wn === 'EUR' ? 1 / k : k;        // EUR → USD: mal Kurs; USD → EUR: geteilt
      const pl = {...m.plan};
      for (const f2 of ['stop','tp1','tp2','tp3','einstieg']) if (pl[f2] != null) pl[f2] = pl[f2] * f;
      pl.waehrung = wn; pl.umgerechnet = wa + '→' + wn;
      m.plan = pl;
    } else {
      delete m.plan;       // lieber kein Stop als einer in der falschen Währung
    }
  }
  return m;
}
/* ``entfernen``: die Positionen, die als verkauft raus sollen — verglichen über ihren
   Inhalt, nicht über das Objekt. Zwischen Anzeige und Klick wird das Depot neu geladen,
   und ein neu geladenes Objekt ist nie dasselbe wie das angezeigte. */
function depotZusammenfuehren(eingehend, entfernen){
  const vorhanden = ladePositionen();
  const v = depotVergleich(eingehend, [], vorhanden);
  const raus = new Set((entfernen || []).map(q => JSON.stringify(q)));
  const gepaart = new Set(v.paare.map(([a]) => a).filter(Boolean));
  const bleibt = vorhanden.filter(q => !gepaart.has(q) && !raus.has(JSON.stringify(q)));
  const aus = v.paare.map(([a, p]) => a ? zusammenfuegen(a, p) : p);
  speicherePositionen([...bleibt, ...aus]);
}

    ${zeile('neu', v.neu, 'var(--up)')}
    ${zeile('geändert', v.geaendert, 'var(--warn)')}
    ${zeile('unverändert', v.gleich, 'var(--ink-3)')}
    ${v.weg && v.weg.length ? zeile(`nicht mehr im Depot — verkauft? (${d.konten.join(', ')})`, v.weg, 'var(--bad)') : ''}
    ${zeile('nur auf DIESEM Gerät', v.nurHier.filter(p => !(v.weg||[]).includes(p)), 'var(--accent)')}
    <p style="margin:9px 0 0;font-size:12.5px;color:var(--ink-2)">
      <strong>Zusammenführen</strong> übernimmt neue und geänderte Positionen und lässt
      stehen, was es nur hier gibt — das ist fast immer das Richtige.
      <strong>Ersetzen</strong> macht dieses Gerät exakt zum Abbild des Codes; alles, was
      hier zusätzlich steht, ist dann weg.</p>
    ${v.weg && v.weg.length ? `<p style="margin:9px 0 0;font-size:12.5px;color:var(--ink-2)">
      Der Code beschreibt ${esc(d.konten.join(', '))} vollständig${d.quelle ? ` (${esc(d.quelle)})` : ''}.
      Was dort im Depot steht, aber im Code fehlt, hast du offenbar verkauft.
      <strong>Abgleichen</strong> führt zusammen UND entfernt diese ${v.weg.length}.</p>
      <p style="margin:10px 0 0"><button class="btn" id="pf_code_abgleich">Abgleichen</button></p>` : ''}
    <p style="margin:10px 0 0"><button class="${v.weg && v.weg.length ? 'link' : 'btn'}" id="pf_code_merge">Nur zusammenführen</button>
      <button class="link" id="pf_code_replace" style="margin-left:14px">Ersetzen</button></p>
  </div>`;
  const fertig = (text) => { zeichnePortfolio();
    ziel.innerHTML = `<div class="note-box gut" style="margin:10px 0 0">
      <span class="nt">Übernommen</span><p>${esc(text)}</p>
      <p style="margin:8px 0 0"><button class="btn" id="sy_zum_depot">Depot ansehen</button></p></div>`;
    const b = $('sy_zum_depot');
    if (b) b.addEventListener('click', ()=>{ zeichnePortfolio(); zeigeTab(3); }); };
  const m = $('pf_code_merge');
  if (m) m.addEventListener('click',()=>{ depotZusammenfuehren(d.liste);
    fertig(`${v.neu.length} neu, ${v.geaendert.length} geändert, ${v.nurHier.length} unangetastet.`); });
  const ab = $('pf_code_abgleich');
  if (ab) ab.addEventListener('click',()=>{ depotZusammenfuehren(d.liste, v.weg);
    fertig(`${v.neu.length} neu, ${v.geaendert.length} aktualisiert, ${v.weg.length} als verkauft entfernt, `
      + `${v.nurHier.length - v.weg.length} unangetastet.`); });
  const r = $('pf_code_replace');
  if (r) r.addEventListener('click',()=>{ speicherePositionen(d.liste);
    fertig(`Dieses Gerät führt jetzt genau die ${d.liste.length} Positionen aus dem Code.`); });
}

/* Ein Link mit #depot=… bringt das Depot direkt mit. Nicht stillschweigend einsetzen —
   erst zeigen, was sich ändert, dann fragen. */
function depotAusLink(){
  const h = String(location.hash || '');
  if (!h.includes('depot=')) return;
  const d = ausDepotCode(h);
  history.replaceState(null, '', location.pathname + location.search);
  if (!d) return;
  // Der Vergleich lebt jetzt auf der Sync-Seite — dort ist auch das Feld dafuer.
  zeichneSync();
  zeigeTab(4);
  const ziel = $('pf_code_diff');
  if (ziel){ zeigeDepotVergleich(depotVergleich(d.liste, d.konten), d, ziel); ziel.scrollIntoView({block:'center'}); }
}

/* ======================================== DER DEPOT-WAECHTER AUF GITHUB

   „Die Stops auf meinem Portfolio 24/7 analysieren und immer neu setzen und mir Bescheid
   sagen." Rund um die Uhr heisst: auch wenn die App zu ist. Das kann nur der Lauf auf
   GitHub — und der kennt das Depot nur, wenn es als Geheimnis DEPOT_CODE hinterlegt ist.

   Hier steht deshalb sichtbar, ob er laeuft UND ob er denselben Stand kennt wie dieses
   Geraet. Verglichen wird ein Fingerabdruck (Symbol, Konto, Stueckzahl — gehasht); der
   Waechter veroeffentlicht nur diesen und ein paar Zaehler, nie Werte. */
async function depotKennung(positionen){
  const teile = (positionen || []).filter(p => p && p.sym).map(p =>
    `${String(p.sym).toUpperCase()}|${String(p.konto || '').toLowerCase()}|`
    + `${(Number(p.menge) || 0).toFixed(6)}`).sort();
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(teile.join(';')));
    return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 12);
  } catch(e){ return null; }
}
function geheimnisLink(){
  let owner = 'ozancanerd-ship-it', repo = 'cl';
  try {
    if (/\.github\.io$/.test(location.hostname)){
      owner = location.hostname.split('.')[0];
      repo = location.pathname.split('/').filter(Boolean)[0] || repo;
    }
  } catch(e){}
  return `https://github.com/${owner}/${repo}/settings/secrets/actions`;
}
const KANAL_TEXT = {push:'Push aufs Handy', telegram:'Telegram', email:'E-Mail mit allen Einzelheiten', mail:'Mail über GitHub (ohne Einzelheiten)'};
async function fuelleWaechter(el){
  if (!el) return;
  const pos = ladePositionen();
  if (!WA){ el.innerHTML = ''; return; }
  const link = geheimnisLink();
  const kan = (WA.kanaele || []).map(k => KANAL_TEXT[k] || k);
  const privat = (WA.kanaele || []).some(k => k === 'push' || k === 'telegram' || k === 'email');
  const kanSatz = kan.length
    ? `Meldung per: ${esc(kan.join(', '))}.` + (privat ? '' : ' Für die Einzelheiten direkt aufs '
      + 'Handy fehlt noch Push (Reiter Alarme → „Alarme aufs Handy").')
    : 'Es ist noch kein Meldeweg eingerichtet — dann steht es nur hier in der App.';
  if (!WA.aktiv){
    el.innerHTML = `<div class="note-box warn" style="margin:10px 0 0">
      <span class="nt">Wächter rund um die Uhr: nicht eingerichtet</span>
      <p style="font-size:13px">Deine Stops werden gerade nur gesetzt, nachgezogen und
      überwacht, solange diese App offen ist. Damit das auch nachts und bei geschlossener App
      passiert, braucht der Lauf auf GitHub dein Depot als Geheimnis:</p>
      <p style="font-size:13px">1. Reiter <strong>Sync</strong> → <em>Depot kopieren</em>.
      2. <a href="${link}" target="_blank" rel="noopener">GitHub → Secrets</a> →
      <em>New repository secret</em>, Name <span class="mono">DEPOT_CODE</span>, Text einfügen.
      Es landet nicht im öffentlichen Repository und nicht in den Protokollen.</p></div>`;
    return;
  }
  const kennung = pos.length ? await depotKennung(pos) : null;
  const alter = vorMin(WA.geprueft);
  const wann = alter == null ? '—' : (alter < 2 ? 'gerade eben' : alter < 90 ? `vor ${alter} Minuten`
             : `vor ${Math.round(alter/60)} Stunden`);
  const gleich = kennung && WA.stand && kennung === WA.stand;
  if (!gleich && pos.length){
    el.innerHTML = `<div class="note-box warn" style="margin:10px 0 0">
      <span class="nt">Wächter läuft — kennt aber einen anderen Stand</span>
      <p style="font-size:13px">Der Lauf auf GitHub prüft ${posAnz(WA.positionen)}, dieses
      Gerät führt ${pos.length}. Seit dem Hinterlegen hast du gekauft, verkauft oder die Menge
      geändert — für die neuen Werte meldet er sich nicht. <strong>Sync → Depot kopieren</strong>,
      dann bei <a href="${link}/DEPOT_CODE" target="_blank" rel="noopener">DEPOT_CODE</a>
      <em>Update secret</em> und den Text ersetzen.</p>
      <p style="font-size:12px;color:var(--ink-3)">Zuletzt geprüft ${esc(wann)}. ${kanSatz}</p></div>`;
    return;
  }
  el.innerHTML = `<div class="note-box gut" style="margin:10px 0 0">
    <span class="nt">Wächter rund um die Uhr: aktiv</span>
    <p style="font-size:13px">Der Lauf auf GitHub prüft dein Depot alle zehn Minuten — auch
    wenn diese App zu ist: Stop gerissen, Ziel erreicht, Knock-out nah sofort; Stop gesetzt
    oder nachgezogen gebündelt. ${WA.mit_stop} von ${WA.positionen} Positionen haben einen
    Stop${WA.ohne_kurs ? `, ${WA.ohne_kurs} ohne Kurs (nicht im Scan)` : ''}.</p>
    <p style="font-size:12px;color:var(--ink-3)">Zuletzt geprüft ${esc(wann)} · derselbe
    Stand wie auf diesem Gerät. ${kanSatz}</p></div>`;
}

/* ======================================================= SYNC-SEITE

   „Ich komme nicht rein auf dem Handy, nur auf dem Mac — mach das extra so ordnermaessig,
   dass ich einfach draufzugehen kann."

   Der Grund, warum der Link nicht gereicht hat, ist unangenehm und muss dastehen: eine
   Seite, die auf dem iPhone ueber „Zum Home-Bildschirm" installiert wurde, hat einen
   EIGENEN Speicher, getrennt von Safari. Tippt man den Link in einer Nachricht an, oeffnet
   iOS ihn in Safari — und das Depot landet dort, wo die App es nie sieht. Auf dem Mac
   faellt das nicht auf, weil es dort denselben Browser trifft.

   Also wird nicht mehr ueber einen Link uebertragen, sondern ueber die Zwischenablage,
   INNERHALB der App. Und weil Mac und iPhone am selben Apple-Konto haengen, reicht dafuer
   meistens die Universal-Zwischenablage: auf dem Mac kopieren, auf dem iPhone einsetzen —
   ohne den Umweg ueber eine Nachricht an sich selbst. */
function zeichneSync(){
  const pos = ladePositionen();
  const code = pos.length ? depotCode() : '';
  const h = `
  <div class="note-box" style="border-color:rgba(0,229,255,.28)">
    <span class="nt" style="color:var(--accent)">Wofür diese Seite da ist</span>
    <p style="font-size:13.5px">Dein Depot liegt im Speicher dieses Geräts — auf dem Mac ein
    anderer als auf dem iPhone. Hier schiebst du es von einem zum anderen. <strong>Analyse,
    Signale und Alarme sind auf beiden Geräten ohnehin gleich</strong>, die kommen aus
    derselben Datei; nur die Positionen müssen einmal mitwandern.</p>
    <p style="color:var(--ink-3)">Warum kein Link: die App vom iPhone-Home-Bildschirm hat
    einen eigenen Speicher. Ein angetippter Link öffnet Safari, und dort landet das Depot
    dann — die App sieht es nie. Über die Zwischenablage bleibt alles in der App.</p>
  </div>
  <div id="sy_waechter"></div>
  ${autoSyncKasten()}

  <h2>1 · Auf dem Gerät mit dem aktuellen Stand</h2>
  <div class="karte">
    <p style="margin:0 0 10px;font-size:13.5px">Hier stehen gerade
    <strong>${posAnz(pos.length)}</strong>. Kopier sie — auf dem Mac landet der Text in
    der Zwischenablage, und wenn iPhone und Mac am selben Apple-Konto hängen, kannst du ihn
    drüben direkt einsetzen.</p>
    <p style="margin:0"><button class="btn" id="sy_copy" style="font-size:16px;padding:14px 20px">
      Depot kopieren</button></p>
    <div id="sy_copy_hint"></div>
    <p style="margin:12px 0 0;font-size:12.5px;color:var(--ink-3)">Klappt die
    Universal-Zwischenablage nicht, schick dir den Text selbst — Notizen, Nachrichten,
    AirDrop. Hauptsache, du kannst ihn auf dem anderen Gerät einfügen.</p>
    <textarea id="sy_out" rows="3" spellcheck="false" readonly
      style="margin-top:10px">${esc(code)}</textarea>
  </div>

  <h2>2 · Auf dem anderen Gerät</h2>
  <div class="karte">
    <p style="margin:0 0 10px;font-size:13.5px">App öffnen, hierher gehen, einsetzen.
    <strong>Nichts wird sofort überschrieben</strong> — du siehst erst, was sich ändert.</p>
    <p style="margin:0 0 10px"><button class="btn" id="sy_paste" style="font-size:16px;padding:14px 20px">
      Aus Zwischenablage einsetzen</button></p>
    <p style="margin:0 0 6px;font-size:12.5px;color:var(--ink-2)">oder von Hand einfügen:</p>
    <textarea id="sy_in" rows="3" spellcheck="false" placeholder="Depot-Text hier einfügen"></textarea>
    <p style="margin:10px 0 0"><button class="btn" id="sy_check">Vergleichen</button></p>
    <div id="pf_code_diff"></div>
  </div>

  <div class="note-box"><span class="nt">Was übertragen wird</span>
    <p>Alles, was zu einer Position gehört: Menge, Einstieg, Konto, Hebel und Knock-out,
    dein Stop und die Ziele, abgehakte Teilverkäufe. Nicht übertragen werden die Kurse und
    die Analyse — die holt sich jedes Gerät selbst und hat damit dieselben.</p></div>`;
  $('sync').innerHTML = h;
  fuelleWaechter($('sy_waechter'));
  try { verdrahteAutoSync(); } catch(e){}

  const melde = (el, text, gut) => { el.innerHTML = `<p style="margin:8px 0 0;font-size:13px;
    color:${gut?'var(--up)':'var(--warn)'}">${esc(text)}</p>`; };

  const c = $('sy_copy');
  if (c) c.addEventListener('click', async ()=>{
    const t = $('sy_out');
    if (!t.value){ melde($('sy_copy_hint'), 'Hier steht noch kein Depot.', false); return; }
    t.removeAttribute('readonly'); t.select(); t.setSelectionRange(0, 999999);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(e){}
    try { if (navigator.clipboard){ await navigator.clipboard.writeText(t.value); ok = true; } } catch(e){}
    t.setAttribute('readonly','');
    melde($('sy_copy_hint'), ok
      ? `Kopiert — ${ladePositionen().length} Positionen. Jetzt auf dem anderen Gerät hier herkommen und einsetzen.`
      : 'Der Text ist markiert — mit ⌘C bzw. langem Tippen kopieren.', ok);
  });

  const v = $('sy_paste');
  if (v) v.addEventListener('click', async ()=>{
    let text = '';
    try { text = await navigator.clipboard.readText(); } catch(e){}
    if (!text){ $('sy_in').focus();
      melde($('pf_code_diff'), 'Die Zwischenablage ließ sich nicht lesen — füg den Text unten von Hand ein.', false);
      return; }
    $('sy_in').value = text;
    pruefeSync();
  });
  const k = $('sy_check');
  if (k) k.addEventListener('click', pruefeSync);
}

function pruefeSync(){
  const ziel = $('pf_code_diff');
  const d = ausDepotCode(($('sy_in')||{}).value || '');
  if (!d){ ziel.innerHTML = `<div class="note-box bad" style="margin:10px 0 0">
    <span class="nt">Das war kein Depot-Text</span><p>Auf dem anderen Gerät oben auf
    <em>Depot kopieren</em> tippen und den ganzen Text herbringen.</p></div>`; return; }
  zeigeDepotVergleich(depotVergleich(d.liste, d.konten), d, ziel);
}

/* Der ausgeschriebene Name einer Position. „OPEUR" steht so im Depot, weil Ozan es dort
   in Euro hält; der Scan kennt denselben Wert als OPUSD und hat den Klarnamen dazu. Ein
   Vorschlag, der „OPEUR ist schwächer als 89 % …" sagt, liest sich wie eine Fehlermeldung. */
function posName(b){
  return (b && b.row && b.row.name) ? b.row.name
       : (b && b.basis && b.basis.row && b.basis.row.name) ? b.basis.row.name
       : name(b && b.pos ? b.pos.sym : '');
}

function depotStand(){
  let positionen;
  try { positionen = ladePositionen(); } catch(e){ return null; }
  const bew = positionen.map(bewertePosition);
  const kursEU = (S && S.eurusd) || null;
  const inEuro = (b, wert) => {
    if (wert == null) return null;
    return (b.w === 'EUR' || !kursEU) ? wert : wert / kursEU;
  };
  const gesamt = bew.reduce((s,b)=>s + (inEuro(b, b.wert)||0), 0);
  return {bew, gesamt, kursEU, inEuro};
}

/* Ozan, 08.10. 18:50: „wie oft soll ich dir noch sagen, du sollst es an der App anpassen"
   — eine Mail oder ein Push, die (noch) nicht eingerichtet sind, melden sich für ihn
   effektiv nie. Der bisher höchste Gewinn jeder Position (über alle Besuche dieses
   Geräts, nicht nur die heutige Sitzung) liegt deshalb hier im Speicher — fällt der
   aktuelle Gewinn deutlich davon zurück, erscheint das direkt oben in „Was jetzt zu tun
   ist", für jede Positionsart gleich (Krypto, Aktien, Turbos — ``b.gvPct`` ist überall
   dieselbe Rechnung). Dieselbe Regel läuft serverseitig im Depot-Wächter
   (``depot_stops.py``, Art ``gewinn_rueckgang``); hier ist sie noch einmal direkt in der
   App, weil genau das gefehlt hat. */
const GEWINN_HOCH_KEY = 'desk.gewinnhoch.v1';
function gewinnHochLaden(){
  try { return JSON.parse(localStorage.getItem(GEWINN_HOCH_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function gewinnHochMerken(pos, gvPct){
  const schl = posSchluessel(pos);
  if (!schl || gvPct == null || !isFinite(gvPct)) return gvPct;
  const stand = gewinnHochLaden();
  const vorher = stand[schl];
  const hoch = (typeof vorher === 'number' && isFinite(vorher)) ? Math.max(vorher, gvPct) : gvPct;
  if (hoch !== vorher){
    stand[schl] = hoch;
    try { localStorage.setItem(GEWINN_HOCH_KEY, JSON.stringify(stand)); } catch(e){}
  }
  return hoch;
}

function positionsAktion(b, stand){
  const pos = b.pos, r = b.row;
  const wertEU = stand ? stand.inEuro(b, b.wert) : null;
  const anteil = (stand && stand.gesamt && wertEU != null) ? wertEU / stand.gesamt * 100 : null;
  const d = digits(b.kurs || 1);
  const z = waehrungsZeichen(b.w);
  const basis = {anteil, wertEU};

  // Ohne Kurs lässt sich keine Stückzahl rechnen — dann bleibt es beim Urteil.
  if (b.kurs == null || !pos.menge){
    return {...basis, art:'halten', dringend:false, titel:'Nichts zu tun',
      text:'Für diesen Posten gibt es keinen laufenden Kurs, also auch keine Stückzahl, '
         + 'die sich ausrechnen liesse.'};
  }

  const teil = (anteilMenge, grund, art, dringend, titel) => {
    let menge = pos.menge * anteilMenge;
    const jeStueckEU = (stand && stand.kursEU && b.w !== 'EUR') ? b.kurs / stand.kursEU : b.kurs;
    // Bei einem direkten Short ist der Wert Einsatz plus Ergebnis, nicht Stück mal Kurs.
    let euro = (istKurzDirekt(pos) && wertEU != null) ? anteilMenge * wertEU : menge * jeStueckEU;
    let zusatz = '';
    // Zu kleine Order: entweder ganz raus oder auf eine sinnvolle Grösse anheben. Wenn
    // daraus ein voller Ausstieg wird, muss auch die Überschrift das sagen — sonst steht
    // „ein Drittel verkaufen" über einer Stückzahl, die die ganze Position ist.
    if (art !== 'nachlegen' && anteilMenge < 1 && euro < MIN_ORDER_EUR && wertEU != null){
      if (wertEU <= MIN_ORDER_EUR * 2){
        menge = pos.menge; euro = wertEU; art = 'raus';
        titel = titel.replace(/—.*$/, '').trim() + ' — ganze Position schliessen';
        zusatz = ` Die ganze Position ist nur ${num(wertEU,0)} € wert — ein Teilverkauf davon `
               + 'würde in Gebühren untergehen. Dann lieber ganz raus oder ganz lassen.';
      } else {
        menge = MIN_ORDER_EUR / jeStueckEU; euro = MIN_ORDER_EUR;
        zusatz = ` Auf ${MIN_ORDER_EUR} € angehoben — darunter frisst die Gebühr den Sinn der Order.`;
      }
    }
    return {...basis, art, dringend, titel, menge, euro, text: grund + zusatz};
  };

  /* 0 — der Knock-out. Vor allem anderen.

     Ein Stop schützt vor Verlusten; gegen eine Knock-out-Schwelle schützt er nicht. Wird
     sie berührt — auch nachts, auch für eine Sekunde — ist der Schein weg, nicht im
     Minus. Deshalb steht diese Regel vor Stop und Ziel. */
  if (b.hebel && b.hebel.art === 'margin' && b.hebel.puffer_pct < KO_PUFFER_KRITISCH){
    return teil(1.0, `Bis zur rechnerischen Liquidation sind es nur noch `
      + `${b.hebel.puffer_pct.toFixed(1).replace('.',',')} %. Bei ${b.hebel.hebel.toFixed(0)}× `
      + 'ist das eine normale Tagesbewegung — und dann schliesst die Börse selbst, zum '
      + 'schlechtesten Kurs. Selbst schliessen ist fast immer billiger als liquidiert werden.',
      'raus', true, 'Liquidation zu nah — raus');
  }
  if (b.hebel && b.hebel.ausgeknockt && b.hebel.art !== 'margin'){
    return {...basis, art:'raus', dringend:true, menge:pos.menge, euro:0,
      titel:'Knock-out berührt — der Schein ist wertlos',
      text:`${b.hebel.basisName} steht bei ${num(b.hebel.basisKurs, digits(b.hebel.basisKurs))}, `
        + `die Schwelle lag bei ${num(b.hebel.ko, digits(b.hebel.ko))}. Damit ist das Papier `
        + 'verfallen. Prüf das im Depot deines Brokers und trag die Position hier aus.'};
  }
  if (b.hebel && b.hebel.puffer_pct < KO_PUFFER_KRITISCH){
    return teil(1.0, `Bis zur Knock-out-Schwelle sind es nur noch `
      + `${b.hebel.puffer_pct.toFixed(1).replace('.',',')} % im Basiswert `
      + `(${b.hebel.basisName} bei ${num(b.hebel.basisKurs, digits(b.hebel.basisKurs))}, `
      + `Schwelle ${num(b.hebel.ko, digits(b.hebel.ko))}). Bei ${b.hebel.hebel.toFixed(1).replace('.',',')}× Hebel `
      + 'ist das eine normale Tagesbewegung. Hier geht es nicht um Gewinn oder Verlust, '
      + 'sondern um Totalverlust — und dagegen hilft kein Stop, die Schwelle greift auch nachts.',
      'raus', true, 'Knock-out zu nah — raus');
  }
  /* Jede Teilverkaufs-Regel gilt EINMAL je Position. Vorher kam „Hälfte raus" nach dem
     Verkauf sofort wieder — der Puffer ist ja weiter eng —, dann wieder, bis von der
     Position nichts mehr übrig war. Wer den Rat befolgt hat, wird dafür nicht bestraft:
     der „Verkauft"-Knopf hakt die Regel ab (pos.erledigt), danach schützt der Stop,
     und bei kritischem Puffer greift die Regel darüber (ganz raus). */
  const schonErledigt = new Set(pos.erledigt || []);
  if (b.hebel && b.hebel.puffer_pct < KO_PUFFER_ENG && !schonErledigt.has('ko_eng')){
    return {...teil(0.5, `Der Puffer bis zur Schwelle ist auf `
      + `${b.hebel.puffer_pct.toFixed(1).replace('.',',')} % geschmolzen. Bei `
      + `${b.hebel.hebel.toFixed(1).replace('.',',')}× Hebel reicht ein schlechter Tag im Basiswert. Die Hälfte `
      + 'rausnehmen halbiert das, was ein Knock-out kosten kann, und lässt die These am Leben.',
      'teilverkauf', true, 'Puffer wird eng — Hälfte raus'), marke:'ko_eng'};
  }

  // 1 + 2 — was der Ausstiegsplan sagt, hat Vorrang. Feste Marken schlagen Einschätzungen.
  const schritt = naechsterSchritt(pos, planKurs(b), b.w);
  if (schritt && schritt.stufe === 'stop'){
    return teil(1.0, (pos.plan && pos.plan.ebene === 'basis') ? schritt.text
      : `Der Kurs steht bei ${num(b.kurs,d)}${z}, dein Stop lag bei `
      + `${num(pos.plan.stop,d)}${z}. Die Idee ist widerlegt — hier wird nicht nachverhandelt.`,
      'raus', true, istKurzDirekt(pos) ? 'Alles schliessen (zurückkaufen) — Stop gerissen'
                                       : 'Alles verkaufen — Stop gerissen');
  }
  if (schritt && schritt.stufe === 'ziel'){
    return {...teil(1/3, `${schritt.marke} ist erreicht. Ein Drittel raus, den Stop auf deinen `
      + 'Einstieg ziehen — ab da kann der Trade nichts mehr kosten.',
      'teilverkauf', true, `${schritt.marke} erreicht — ein Drittel ${istKurzDirekt(pos) ? 'schliessen' : 'verkaufen'}`), marke:schritt.marke};
  }

  /* 2b — Gewinn-Rückgang vom Hoch: unabhängig vom gesetzten Stop, der ja noch nicht
     gerissen sein muss. ``gvPct`` hängt nur am Kurs, nicht an der Stückzahl — nach einem
     Teilverkauf bliebe der Prozentwert gleich und dieselbe Regel würde sofort wieder
     feuern, obwohl schon gehandelt wurde. Deshalb wie bei „Ziel erreicht" eine ``marke``
     je Rückgangs-Bereich (10-Punkte-Schritte): einmal abgehakt (Knopf „Verkauft"), feuert
     genau dieser Bereich nicht noch einmal — fällt der Gewinn weiter zurück, ist das ein
     neuer Bereich und damit ein neuer, berechtigter Hinweis. */
  if (b.gvPct != null){
    const hoch = gewinnHochMerken(pos, b.gvPct);
    const rueckgang = hoch - b.gvPct;
    const bucket = Math.floor(rueckgang / 10) * 10;
    const marke = 'gewinn_rueckgang:' + bucket;
    if (hoch >= 10 && rueckgang >= Math.max(8, hoch * 0.35) && !schonErledigt.has(marke)){
      return {...teil(1/3, `${posName(b)} stand zwischenzeitlich bei ${pct(hoch,1)} im Plus, `
        + `jetzt nur noch ${pct(b.gvPct,1)} — ${rueckgang.toFixed(0)} Punkte vom Spitzenwert `
        + 'schon wieder weg, ohne dass etwas verkauft wurde. Ein Drittel jetzt sichert, was '
        + 'da ist; warten auf eine bestimmte Zahl hat zuletzt mehr gekostet als gebracht.',
        'teilverkauf', true,
        `Gewinn fällt vom Hoch zurück (${pct(hoch,1)} → ${pct(b.gvPct,1)}) — Teil verkaufen`),
        marke};
    }
  }

  const rs = b.halt && b.halt.rs;
  const klasseName = r && r.klasse === 'aktien' ? 'Aktien' : 'Coins';

  /* ================================================== SCHONFRIST

     „Manchmal gibt es Alarme, wo ich jetzt einsteigen drücke, und dann sagt er in der
     gleichen Sekunde, ich soll es wieder verkaufen. Sowas geht gar nicht."

     Er hat vollkommen recht, und der Fehler lag hier. Zwei Teile des Systems haben
     verschiedene Dinge gemessen: das Signal bewertet das Chartbild, das Depot die
     relative Stärke. Ein Nachzügler mit hübschem Chart bekam ein Kaufsignal — und war
     im Depot sofort ein Verkaufskandidat.

     An der Wurzel ist das im Scanner behoben: ein Long im schwächsten Viertel seiner
     Klasse ist gar kein handelbares Signal mehr. Hier kommt der zweite Riegel dazu.

     Eine frisch gekaufte Position mit gültigem Plan wird von der Rangliste in Ruhe
     gelassen. Was sie begrenzt, ist ihr Stop — dafür ist er da. Erst wenn der Plan
     durch ist oder die Schonfrist abläuft, redet die Depotbewertung wieder mit.

     Wie lang? Nicht geraten, sondern aus der eigenen Bilanz: das Doppelte der
     gemessenen Haltedauer dieser Anlageklasse, mindestens drei Tage. Damit bekommen
     Aktien von selbst mehr Zeit als Coins — was Ozan zu Recht angemahnt hat: „bei
     Aktien passiert das nicht in zwei, drei Tagen, das dauert länger." */
  const SCHONFRIST_MIN_H = 72;
  const schonfristEnde = (() => {
    if (!pos.seit) return null;                       // vor dieser Änderung eingetragen
    if (!pos.plan || pos.plan.stop == null) return null; // ohne Plan kein Schutz
    const dd = dauerFuer(r && r.note, r && r.klasse);
    const stunden = Math.max(SCHONFRIST_MIN_H, dd ? dd.median_h * 2 : SCHONFRIST_MIN_H);
    return pos.seit + stunden * 3600 * 1000;
  })();
  const inSchonfrist = schonfristEnde != null && Date.now() < schonfristEnde;

  /* 3 — die eigene Analyse zeigt in die Gegenrichtung: seit 30.09. ein Hinweis, kein
     Teilverkauf mehr.

     Bis dahin riet die App hier „Hälfte verkaufen" (Long gehalten, handelbares Short-Setup,
     relative Stärke unter der Mitte). Die Regel wurde vorab registriert geprüft
     (docs/GEGENTHESE-STUDIE-2026-09.md, 24 Coins, 19 Monate): in genau dieser Lage liefen
     die Coins in den 7 Tagen danach IS 1,4 Prozentpunkte BESSER als ihre Klasse, OOS nur
     0,3 Punkte schlechter — verlangt war mindestens 1,0 Punkte schlechter in beiden Hälften.
     Ein Teilverkauf ohne gemessenen Vorteil kostet nur Gebühr, Spread und Steuer. Verkauft
     wird über den Stop oder eine gedrehte Analyse der eigenen Position. */
  const kurzPos = istKurzDirekt(pos);
  const gegenHinweis = (r && r.richtung === (kurzPos ? 'long' : 'short') && r.handelbar && (rs == null || rs < RS_MITTE))
    ? ` Die Analyse zeigt gerade ein Setup nach ${kurzPos ? 'oben' : 'unten'} — gemessen ist das kein Grund, Teile zu `
      + `${kurzPos ? 'schliessen' : 'verkaufen'} (bei Coins liefen solche Lagen danach nicht schlechter als die Klasse). Der Stop entscheidet.`
    : '';

  /* 4 — Schlusslicht der eigenen Klasse: bis 27.09. „ein Drittel verkaufen". Nachgemessen
     hielt die Begründung nicht (Schlusslichter liefen danach nicht schlechter als ihre
     Klasse, siehe haltUrteil). Ein Teilverkauf ohne gemessenen Vorteil kostet nur Gebühr,
     Spread und bei Gewinnen Steuer. Deshalb hier nur noch der Hinweis, nicht nachzukaufen. */
  const schlusslicht = rs != null && rs < RS_SCHWACH
    ? (kurzPos
      ? ` ${posName(b)} ist stärker als ${(100-rs).toFixed(0)} % der ${klasseName} — gegen deinen Short; nicht `
        + 'aufstocken, geschlossen wird über den Stop oder eine gedrehte Analyse.'
      : ` ${posName(b)} ist schwächer als ${(100-rs).toFixed(0)} % der ${klasseName} — nicht `
        + 'nachkaufen; verkauft wird über den Stop oder eine gedrehte Analyse, nicht über den Tabellenplatz.')
    : '';

  /* 5 — Klumpenrisiko: seit 28.09. ein Hinweis, kein Verkaufsauftrag.

     Ozan: „Ich soll bei mehreren Sachen schon Teil verkaufen, obwohl du selber meintest,
     das wäre nicht so sinnvoll." Der Klumpen-Rat stand oben in „Was jetzt zu tun ist"
     mit einer Stückzahl — als wäre er so belegt wie ein gerissener Stop. Das ist er nicht:
     eine Obergrenze je Wert senkt Schwankung, bringt aber gemessen keine Rendite, und ob
     jemand bewusst groß in Bitcoin sitzt, ist seine Entscheidung. Die Zahl bleibt
     sichtbar (Karte, Gesundheit), die Aufforderung fällt weg. */
  let hinweis = '';
  if (anteil != null && anteil > MAX_GEWICHT){
    const runter = (anteil - MAX_GEWICHT) / anteil;
    const t = teil(runter, '', 'trimmen', false, '');
    hinweis = `Klumpen: diese Position ist ${anteil.toFixed(0)} % deines Depots — ein einzelner `
      + 'Wert entscheidet damit spürbar über dein Ergebnis. Wenn du das Risiko senken willst: '
      + `${num(t.menge, t.menge<1?6:4)} Stück (≈ ${num(t.euro,0)} €) ${kurzPos ? 'schliessen' : 'verkaufen'} bringt sie auf ${MAX_GEWICHT} %. `
      + 'Das senkt die Schwankung, nicht die Chance — deshalb nur ein Hinweis.';
  }

  // 6 — nachlegen. Nur in Stärke, nur mit Setup, nur mit Stop.
  const stop = (pos.plan && pos.plan.stop != null) ? pos.plan.stop
             : (r && r.invalidierung != null ? inPositionsWaehrung(r, r.invalidierung, pos) : null);
  // Seit 02.10. mit demselben Tor wie ein Alarm: Nachlegen ist ein Kauf — es braucht eine
  // Setup-Art, die sich in der eigenen Bilanz bewährt hat (siehe positionsRat).
  const setzt = r && r.handelbar && r.score >= 52 && r.richtung !== 'short'
    && !!(r.alarm && r.alarm.ja === true);
  if (!inSchonfrist && rs != null && rs >= RS_FUEHRER && setzt && stop != null && stop < b.kurs
      && anteil != null && anteil < ZIEL_GEWICHT && stand && stand.gesamt){
    const risikoJeStueck = b.kurs - stop;
    const ausRisiko = stand.gesamt * (NACHKAUF_RISIKO_PCT/100) / risikoJeStueck
                    * (b.w === 'EUR' ? 1 : (stand.kursEU || 1));
    const platzEU = (ZIEL_GEWICHT - anteil)/100 * stand.gesamt;
    const kursEUJeStueck = b.w === 'EUR' ? b.kurs : b.kurs / (stand.kursEU || 1);
    const ausPlatz = platzEU / kursEUJeStueck;
    const menge = Math.min(ausRisiko, ausPlatz);
    const euro = menge * kursEUJeStueck;
    if (euro >= MIN_ORDER_EUR){
      /* Bevor die App zum Nachlegen raet: ist das ueberhaupt eine Erhoehung der
         Chance — oder nur eine Erhoehung derselben Wette? Wenn dieser Wert in einem
         Buendel liegt, das schon ueber die Haelfte der Marktbewegung ausmacht, dann
         sieht ein Zukauf nach Staerke aus und ist in Wahrheit Konzentration. Der
         Einzelposten bleibt unter seinem Deckel, das Buendel nicht. */
      const gl = glAnteilFuer(b, stand);
      if (gl && gl.anzahl > 1 && gl.anteil > BUENDEL_MAX){
        return {...basis, art:'halten', dringend:false, eigen:true, hinweis,
          titel:'Nachlegen wäre hier keine neue Chance, sondern dieselbe Wette',
          text:`Das Setup traegt — ${posName(b)} gehoert zu den staerksten `
            + `${(100-rs).toFixed(0)} % der ${klasseName}. Aber dieser Wert liegt in einem `
            + `Buendel aus ${gl.anzahl} Positionen, die sich gemessen gemeinsam bewegen `
            + `(${gl.zusammenhalt != null ? gl.zusammenhalt.toFixed(2).replace('.',',') : '—'}) `
            + `und zusammen schon ${gl.anteil.toFixed(0)} % deiner Marktbewegung ausmachen. `
            + `Ein Zukauf hier vergroessert nicht die Streuung, sondern den Klumpen. `
            + `Wenn du dieses Setup handeln willst, dann als Tausch innerhalb des `
            + `Buendels — nicht obendrauf.`};
      }
      return {...basis, art:'nachlegen', dringend:false, menge, euro,
        titel:'Nachlegen — Stärke mit frischem Setup',
        text:`${posName(b)} gehört zu den stärksten ${(100-rs).toFixed(0)} % der `
          + `${klasseName} und hat gerade ein handelbares Setup (Score ${r.score.toFixed(0)}, `
          + `Note ${r.note}). Die Position ist erst ${anteil.toFixed(0)} % deines Depots. `
          + `Gerechnet auf ${NACHKAUF_RISIKO_PCT} % Risiko bei Stop ${num(stop,d)}${z}.`};
    }
  }

  // 7 — halten.
  const wohin = schritt && schritt.stufe === 'halten' ? ' ' + schritt.text : '';
  if (inSchonfrist){
    const restH = Math.max(1, Math.round((schonfristEnde - Date.now())/3600000));
    return {...basis, art:'halten', dringend:false, eigen:true, hinweis, titel:'Halten — der Plan läuft',
      text:`Frisch gekauft, der Stop steht. Solange der Plan gilt, redet die Rangliste hier `
        + `nicht rein — sonst würde dir dieselbe App im selben Atemzug Kaufen und Verkaufen `
        + `sagen. Begrenzt wird das Risiko durch deinen Stop, nicht durch eine Meinung. `
        + `Noch ${restH < 48 ? restH + ' Stunden' : Math.round(restH/24) + ' Tage'}, `
        + `dann wird wieder normal bewertet.` + wohin};
  }
  return {...basis, art:'halten', dringend:false, hinweis, titel:'Halten — nichts zu tun',
    text:(rs != null ? `Relative Stärke ${rs.toFixed(0)} von 100, kein Anlass zu handeln.`
        : 'Kein Anlass zu handeln.') + gegenHinweis + schlusslicht + wohin};
}

const AKTION_FARBE = {raus:'bad', teilverkauf:'warn', trimmen:'warn', nachlegen:'', halten:''};
const AKTION_WORT  = {raus:'VERKAUFEN', teilverkauf:'TEILVERKAUF', trimmen:'TRIMMEN',
                      nachlegen:'NACHLEGEN', halten:'HALTEN'};

const pctK = (v, n=1) => v.toFixed(n).replace('.', ',') + ' %';

/* Die Marken des Plans als eine Zeile — Stop (und Ziele, wo sie gelten). */
function planMarken(b){
  const pl = b.pos.plan || {};
  if (pl.stop == null) return '';
  const basis = pl.ebene === 'basis';
  const d = digits(planKurs(b) || b.kurs || 1);
  const w = pl.waehrung === 'EUR' ? ' €' : (pl.waehrung === 'USDT' ? ' USDT' : (basis ? ' $' : waehrungsZeichen(b.w)));
  return [[basis ? `Stop auf ${esc(pl.basis_name || 'Basiswert')}` : 'Stop', pl.stop],
          ...(zieleGelten(pl) ? [['TP1', pl.tp1], ['TP2', pl.tp2], ['TP3', pl.tp3]] : [])]
    .filter(([,v]) => v != null)
    .map(([k,v]) => `<span>${k} <b>${num(v,d)}${w}</b></span>`).join('');
}

function aktionsKasten(b, stand, a){
  a = a || positionsAktion(b, stand);
  if (!a) return '';
  const farbe = AKTION_FARBE[a.art] || '';
  const zahl = (a.menge != null && a.euro != null)
    ? `<div class="kpi" style="margin-top:8px">
         <span>${a.art==='nachlegen'?'kaufen':(istKurzDirekt(b.pos)?'schliessen':'verkaufen')} <b>${num(a.menge, a.menge<1?6:4)} Stück</b></span>
         <span>≈ <b>${num(a.euro,2)} €</b></span>
         ${a.anteil!=null?`<span>Anteil am Depot <b>${pctK(a.anteil)}</b></span>`:''}
       </div>` : '';
  const marken = planMarken(b);
  const knopf = (a.menge!=null && b.pos.menge) ? `<p style="margin:9px 0 0">
      <button class="btn" data-mengeschl="${esc(posSchluessel(b.pos))}"
              data-mengeart="${esc(a.art)}" data-mengewert="${a.menge}"
              data-mengemarke="${esc(a.marke||'')}"
              data-mengekurs="${b.kurs!=null?b.kurs:''}">${
        a.art==='nachlegen' ? 'Gekauft — ins Depot übernehmen'
                            : (istKurzDirekt(b.pos) ? (a.art==='raus' ? 'Geschlossen — Position austragen' : 'Teil geschlossen — Menge anpassen') : a.art==='raus' ? 'Verkauft — Position schliessen'
                                              : 'Verkauft — Menge anpassen')}</button></p>` : '';
  return `<div class="note-box ${farbe}" style="margin:10px 0 0">
    <span class="nt">Was jetzt zu tun ist · ${esc(AKTION_WORT[a.art])}</span>
    <p style="font-size:14.5px;margin:0 0 4px"><strong>${esc(a.titel)}</strong></p>
    <p style="margin:0">${esc(a.text)}</p>${zahl}
    ${marken?`<div class="kpi" style="margin-top:6px">${marken}</div>`:''}${knopf}
    <p style="margin:8px 0 0;font-size:11.5px;color:var(--ink-3)">
      Vorschlag mit Begründung, keine Anweisung — und nichts passiert automatisch.
      Die Stückzahl ist gerechnet, nicht geschätzt.</p>
  </div>`;
}

/* EIN Kasten je Position für die Frage „was tun?". Vorher standen drei untereinander —
   „Was jetzt zu tun ist" (Aktion), „Was das System dazu sagt", und nochmal „Was jetzt zu
   tun ist" (Ausstiegsplan) —, oft mit zwei verschiedenen Überschriften für dieselbe
   Lage („Halten — nichts zu tun" über „Halten — Stop steht"). */
function entscheidungsKasten(b, stand){
  const a = positionsAktion(b, stand);
  if (!a || a.art === 'halten') return ausstiegsKasten(b, a);
  const hatPlan = b.pos.plan && b.pos.plan.stop != null;
  return aktionsKasten(b, stand, a) + (hatPlan ? '' : ausstiegsKasten(b, null));
}

/* EIN Urteil je Position (Ozan, 01.10.: „Stop gerissen, ich soll alles verkaufen, aber
   oben rechts steht STARK HALTEN"). Das Schild oben, der Kasten „Warum" und die Liste
   „Was jetzt zu tun ist" sagen jetzt dasselbe. Verlangt der Plan eine Handlung (Stop,
   Ziel, Knock-out), gewinnt sie — eine feste Marke schlägt eine Einschätzung. Die
   Stärke-Bewertung steht dann als Begründung daneben, nicht als zweites Urteil. */
function kartenUrteil(b, a){
  if (a && a.art === 'raus') return {wort:'VERKAUFEN', kl:'bad', aktion:a};
  if (a && a.art === 'teilverkauf') return {wort:'TEIL VERKAUFEN', kl:'warn', aktion:a};
  if (a && a.art === 'nachlegen') return {wort:'NACHLEGEN', kl:'gut', aktion:a};
  return {wort:b.urteil, kl:b.kl, aktion:null};
}
/* 08.10., Ozan: „so ne Skala wie viel Prozent die Wahrscheinlichkeit ist, dass es steigt
   oder sinkt." Das kann ehrlich niemand aus dem Kursverlauf berechnen — keine der
   Einstiegs-Studien fand einen Filter, der die naechste Richtung vorhersagt (siehe
   EINSTIEG-FAKTOREN-STUDIE-2026-10). Was es WIRKLICH gibt: eine gemessene Trefferquote,
   wie oft eine VERGLEICHBARE Setup-Art in der Vergangenheit ihr erstes Ziel erreicht hat,
   statt im Stop zu enden (dieselbe Zahl, die bei neuen Chancen im Scan schon steht — hier
   zusaetzlich bei bereits gehaltenen Positionen). Bewusst „Trefferquote (Vergangenheit)",
   nicht „Wahrscheinlichkeit" — das eine ist eine Zaehlung, das andere eine Vorhersage. */
function trefferquoteSpan(r){
  const q = r && r.erwartung && r.erwartung.quote;
  if (!q || q.n < 5) return '';
  return `<span title="Von ${q.n} vergangenen Signalen dieser Setup-Art erreichten ${Math.round(q.tp1*100)} % Ziel 1, ${Math.round(q.stop*100)} % liefen in den Stop. Das ist eine Zaehlung aus der Vergangenheit, keine Vorhersage fuer diesen Trade.">Trefferquote <b class="${q.tp1>=0.5?'up':''}">${Math.round(q.tp1*100)} % Ziel1</b>
    <span style="color:var(--ink-3)">/ ${Math.round(q.stop*100)} % Stop · n=${q.n}${q.belastbar?'':' · wenig Faelle'}</span></span>`;
}

function ratKasten(b, ku){
  const rat = positionsRat(b);
  const a = ku && ku.aktion;
  if (a && (a.art === 'raus' || a.art === 'teilverkauf')){
    const stark = rat.stufe === 'gut';
    const vorweg = a.art === 'raus'
      ? (stark ? `Die Stärke allein spräche fürs ${rat.kopf === 'Halten' ? 'Halten' : 'Weiterlaufen'} — `
           + 'aber eine feste Marke ist erreicht, und die schlägt jede Einschätzung. '
         : 'Auch die Einschätzung spricht nicht mehr für die Position — und eine feste Marke ist erreicht. ')
        + 'Genau dafür ist der Stop da: er wird nicht nachverhandelt. Danach kommt der Wert auf '
        + 'die Wiedereinstiegs-Liste — der Stop ist ein Urteil über den Moment, nicht über den Wert.'
      : 'Ein Ziel ist erreicht: ein Teil wird verkauft, der Rest läuft mit nachgezogenem Stop '
        + 'weiter. Das ist der Plan, kein Ausstieg.';
    return `<div class="note-box ${a.art === 'raus' ? 'bad' : 'warn'}" style="margin:10px 0 0">
      <span class="nt">Warum · ${esc(AKTION_WORT[a.art])}</span>
      <p style="margin:0 0 4px">${esc(vorweg)}</p>
      ${rat.saetze.map(x=>`<p style="margin:0 0 4px;color:var(--ink-2)">${esc(x)}</p>`).join('')}</div>`;
  }
  const farbe = rat.stufe === 'bad' ? 'bad' : (rat.stufe === 'warn' ? 'warn' : '');
  return `<div class="note-box ${farbe}" style="margin:10px 0 0">
    <span class="nt">Warum · ${esc(rat.kopf)}</span>
    ${rat.saetze.map(x=>`<p style="margin:0 0 4px">${esc(x)}</p>`).join('')}</div>`;
}

/* Alles, was man nachlesen kann, aber nicht jeden Tag lesen muss. Bleibt beim
   Neuzeichnen (alle 5 s) offen, wenn es offen war. */
const MEHR_OFFEN = new Set();
function mehrKasten(b){
  const r = b.row;
  const rat = positionsRat(b);
  const teile = [];
  if (r){
    const d = digits(b.kurs||1);
    teile.push(`<div class="zt" style="margin-top:6px">
      <span>Score <b>${r.score.toFixed(0)}</b></span>
      <span>Note <b>${esc(r.note)}</b></span>
      ${r.ziel!=null?`<span>Setup-Ziel <b>${num(r.ziel,d)}</b></span>`:''}
      ${r.invalidierung!=null?`<span>Setup-Stop <b>${num(r.invalidierung,d)}</b></span>`:''}
      ${bewegungSpan(r)}
    </div>`);
    if (r.headline) teile.push(`<p style="margin:6px 0 0">Chart: ${esc(r.headline)}</p>`);
  }
  for (const x of (rat.mehr || [])) teile.push(`<p style="margin:6px 0 0">${esc(x)}</p>`);
  const pl = b.pos.plan || {};
  if (pl.art === 'halte'){
    teile.push(`<p style="margin:6px 0 0">Halte-Stop (5× Tagesschwankung ${(pl.richtung === 'short')
