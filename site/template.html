function dtCanvas(cv, alle, fertigN, linien, emaReihe, tf, baender){
  if (!cv) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  if (!r.width) return;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height, M = {l: 4, r: 86, t: 10, b: 20};
  ctx.clearRect(0, 0, W, H);
  const n = Math.min(alle.length, tf >= 10080 ? 60 : tf >= 240 ? 90 : (W < 500 ? 60 : 96));
  const a0 = alle.length - n, v = alle.slice(a0);
  let hi = -Infinity, lo = Infinity;
  for (const b of v){ hi = Math.max(hi, b[2]); lo = Math.min(lo, b[3]); }
  const kspanne = (hi - lo) || hi * 0.01;
  // Linien ziehen die Achse nur so weit auf, dass die Kerzen lesbar bleiben (wie im Haupt-Chart)
  const rand = [];
  const khi = hi, klo = lo;
  for (const l of linien){
    const pr = l[1];
    if (pr > khi + kspanne * 0.6 || pr < klo - kspanne * 0.6){ rand.push(l); continue; }
    hi = Math.max(hi, pr); lo = Math.min(lo, pr);
  }
  for (const b of (baender || [])) if (b.zeigen68){
    if (b.hi < khi + kspanne * 0.6) hi = Math.max(hi, b.hi);
    if (b.lo > klo - kspanne * 0.6) lo = Math.min(lo, b.lo);
  }
  const luft = (hi - lo) * 0.06; hi += luft; lo -= luft;
  const y = p => M.t + (hi - p) / (hi - lo) * (H - M.t - M.b);
  const sw = (W - M.l - M.r) / n, kb = Math.max(1, sw * 0.62);
  // Erwartete Spanne als Band (68 %) — erst das Band, dann Kerzen und Linien darueber
  for (const b of (baender || [])){
    const y1 = y(Math.min(hi, b.hi)), y2 = y(Math.max(lo, b.lo));
    if (!(y2 > y1)) continue;
    ctx.fillStyle = dtFarbe('--accent'); ctx.globalAlpha = .07;
    ctx.fillRect(M.l, y1, W - M.l - M.r, y2 - y1); ctx.globalAlpha = 1;
    ctx.fillStyle = dtFarbe('--accent'); ctx.globalAlpha = .75; ctx.font = '9.5px "JetBrains Mono",monospace';
    ctx.textBaseline = 'top'; ctx.fillText(b.lab, M.l + 4, y1 + 2); ctx.globalAlpha = 1;
  }
  const x = i => M.l + i * sw + sw / 2;
  const cGrid = dtFarbe('--grid'), cInk3 = dtFarbe('--ink-3'), cUp = dtFarbe('--long'), cDn = dtFarbe('--bad');
  ctx.font = '10px "JetBrains Mono",monospace'; ctx.textBaseline = 'middle';
  for (let g = 0; g <= 4; g++){
    const pr = lo + (hi - lo) * g / 4, yy = y(pr);
    ctx.strokeStyle = cGrid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(M.l, yy); ctx.lineTo(W - M.r, yy); ctx.stroke();
    ctx.fillStyle = cInk3; ctx.fillText(num(pr), W - M.r + 4, yy);
  }
  // Zeitachse: fuenf gleichmaessig verteilte Marken
  ctx.textBaseline = 'alphabetic';
  const marken_n = Math.max(2, Math.min(5, Math.floor((W - M.r) / 110)));
  for (let kk = 0; kk < marken_n; kk++){
    const i = Math.min(n - 1, Math.round((kk + 0.5) * n / marken_n));
    const lab = dtZeitLabel(v[i][0], tf);
    ctx.strokeStyle = cGrid; ctx.beginPath(); ctx.moveTo(x(i), M.t); ctx.lineTo(x(i), H - M.b); ctx.stroke();
    ctx.fillStyle = cInk3; ctx.fillText(lab, Math.max(M.l, x(i) - ctx.measureText(lab).width / 2), H - 5);
  }
  if (emaReihe){
    ctx.strokeStyle = dtFarbe('--ink-2'); ctx.globalAlpha = .55; ctx.lineWidth = 1.4; ctx.beginPath();
    let auf = false;
    for (let i = 0; i < n; i++){
      const e = emaReihe[a0 + i];
      if (e == null){ auf = false; continue; }
      if (!auf){ ctx.moveTo(x(i), y(e)); auf = true; } else ctx.lineTo(x(i), y(e));
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    const eEnde = emaReihe[a0 + n - 1];
    if (eEnde != null && eEnde <= hi && eEnde >= lo){
      ctx.fillStyle = dtFarbe('--ink-3'); ctx.font = '9.5px "JetBrains Mono",monospace'; ctx.textBaseline = 'bottom';
      ctx.fillText(`EMA 200 (${DT_TF_NAME[tf] || tf})`, Math.max(M.l + 2, x(n - 1) - 110), y(eEnde) - 3);
      ctx.textBaseline = 'alphabetic';
    }
  }
  for (let i = 0; i < n; i++){
    const [, o, h, l, c] = v[i];
    const col = c >= o ? cUp : cDn;
    ctx.globalAlpha = (a0 + i) >= fertigN ? .45 : 1;
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x(i), y(h)); ctx.lineTo(x(i), y(l)); ctx.stroke();
    ctx.fillStyle = col;
    const yo = y(Math.max(o, c)), yc = y(Math.min(o, c));
    ctx.fillRect(x(i) - kb / 2, yo, kb, Math.max(1, yc - yo));
  }
  ctx.globalAlpha = 1;
  const marken = linien.filter(l => !rand.includes(l)).map(([lab, pr, col, gestr]) => ({lab, pr, col: dtFarbe(col), gestr, yy: y(pr)}));
  marken.sort((a, b) => a.yy - b.yy);
  for (let i = 0; i < marken.length; i++)
    marken[i].ty = i ? Math.max(marken[i].yy, marken[i-1].ty + 12) : marken[i].yy;
  ctx.textBaseline = 'middle';
  for (const mk of marken){
    ctx.strokeStyle = mk.col; ctx.lineWidth = 1.2; ctx.setLineDash(mk.gestr ? [5, 4] : []);
    ctx.beginPath(); ctx.moveTo(M.l, mk.yy); ctx.lineTo(W - M.r, mk.yy); ctx.stroke();
    ctx.setLineDash([]);
    const ty = Math.min(H - M.b, mk.ty ?? mk.yy);
    ctx.fillStyle = dtFarbe('--bg'); ctx.globalAlpha = .85; ctx.fillRect(W - M.r + 1, ty - 7, M.r - 2, 14); ctx.globalAlpha = 1;
    ctx.fillStyle = mk.col; ctx.font = '9.5px "JetBrains Mono",monospace';
    ctx.fillText(mk.lab.slice(0, 13), W - M.r + 4, ty);
  }
  ctx.font = '10px "JetBrains Mono",monospace';
  let oben = M.t + 8, unten = H - M.b - 8;
  for (const [lab, pr, col] of rand){
    const aufw = pr > hi; ctx.fillStyle = dtFarbe(col);
    ctx.fillText(`${aufw ? '↑' : '↓'} ${lab} ${num(pr)}`, M.l + 4, aufw ? oben : unten);
    if (aufw) oben += 13; else unten -= 13;
  }
  const last = v[v.length - 1][4], yl = y(last);
  ctx.fillStyle = dtFarbe('--ink'); ctx.fillRect(W - M.r + 1, yl - 8, M.r - 2, 16);
  ctx.fillStyle = dtFarbe('--bg'); ctx.font = '600 10px "JetBrains Mono",monospace';
  ctx.fillText(num(last), W - M.r + 4, yl);
}

   "dass ich auch daraus lerne" (12.10.): Wissen aus Buechern ersetzt keine eigene Bilanz.
   Hier traegt man eigene Tageshandels-Ideen als Paper-Trade ein — mit Stop, Ziel und einem

const DTJ_KEY = 'desk.dt.journal.v1';
function dtjLaden(){ try { const a = JSON.parse(localStorage.getItem(DTJ_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
function dtjSpeichern(a){ try { localStorage.setItem(DTJ_KEY, JSON.stringify(a.slice(-300))); } catch(e){} }
/* Reines Rechnen: offenen Trade gegen Kerzen [t,o,h,l,c] pruefen (Kerzen NACH dem Einstieg). */
function dtjPruefe(t, kerzen){
  if (!t || t.status !== 'offen') return t;
  const lang = t.richtung === 'long';
  for (const k of (kerzen || [])){
    if (k[0] < t.t0) continue;
    const stopT = lang ? k[3] <= t.stop : k[2] >= t.stop;
    const zielT = t.ziel != null && (lang ? k[2] >= t.ziel : k[3] <= t.ziel);
    if (stopT) return {...t, status: 'stop', exit: t.stop, t1: k[0]};
    if (zielT) return {...t, status: 'ziel', exit: t.ziel, t1: k[0]};
  }
  return t;
}
function dtjR(t, gebuehr){
  const risiko = Math.abs(t.einstieg - t.stop);
  if (!(risiko > 0) || t.exit == null) return null;
  const brutto = (t.richtung === 'long' ? t.exit - t.einstieg : t.einstieg - t.exit) / risiko;
  return brutto - (2 * gebuehr * t.einstieg) / risiko;
}
function dtjAktualisieren(){
  const a = dtjLaden(); let geaendert = false;
  const neu = a.map(t => {
    if (t.status !== 'offen') return t;
    const k = dtAlle(t.sym, 1) || dtAlle(t.sym, 5) || dtAlle(t.sym, 15);
    const u = dtjPruefe(t, k);
    if (u !== t) geaendert = true;
    return u;
  });
  if (geaendert) dtjSpeichern(neu);
  return neu;
}

function lernGlossar(){

  for (const [t, x] of BEGRIFFE) m.set(t.toLowerCase(), [t, x]);

  // weil kein Browser verlaesslich nur eines davon feuert, wenn die Seite aus dem
  // Hintergrund zurueckkommt: "visibilitychange" ist der Standard (auch bei Tab-
  // Wechsel am Desktop), "pageshow" greift zusaetzlich beim Zurueck-Navigieren und auf
  // manchen mobilen Browsern beim Zurueckholen aus dem App-Umschalter, "focus" fuer den
  // Fall, dass die Seite selbst nie "hidden" war (z.B. ein anderes Fenster hatte den
  // Fokus) aber trotzdem seit Minuten keinen Tick mehr bekommen hat.
  document.addEventListener('visibilitychange', beiSichtbarkeitRueckkehr);
  window.addEventListener('pageshow', beiSichtbarkeitRueckkehr);
  window.addEventListener('focus', beiSichtbarkeitRueckkehr);
}
umlauteBeobachten();
start();
</script>
</body>
</html>
