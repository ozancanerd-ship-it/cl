/* ================================================================
   CHART — eigener Renderer auf Canvas.
   Warum keine Bibliothek: die Analyse besteht zum grössten Teil aus Zonen, Levels,
   Strukturbrüchen und Beschriftungen. Jede fertige Chart-Bibliothek müsste dafür
   erweitert werden, und die Erweiterung wäre grösser als der Renderer selbst.
   Ausserdem lädt die Seite so nichts nach.
   ================================================================ */
const chart = (()=>{
  let cv = null, ctx = null, B = [], Z = null, C = null, P = null;
  let i0 = 0, anz = 120, hoverX = null, hoverY = null;
  let ziehen = null, kneifen = null, letzterPreis = null, wasserzeichen = '';
  const EBENEN = {swings:true, brueche:true, liq:true, zonen:true, pd:false, ziele:true, rsi:true, vol:true};
  const M = {l: 6, r: 62, t: 10, b: 22};
  /* Höhe des RSI-Streifens unter den Kerzen. 0 = aus. Der RSI teilt sich die
     Zeitachse mit dem Chart — sonst vergleicht man zwei verschiedene Ausschnitte. */
  let RSI_H = 62;
  const MONO = '"JetBrains Mono",monospace';

  function farbe(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  /* P ist der Handelsplan, der eingezeichnet wird: Einstieg, Stop, Ziele.
     Im laufenden Trade ist das der VERTRAG aus dem Einstieg (fest, wie unter Alarme),
     vorher der Vorschlag des letzten Scans. Vorher zeigte der Chart im laufenden Trade
     die frischen Scan-Marken — ein anderer Stop als der, gegen den der Trade läuft. */
  function setze(kerzen, zeichnungTf, chance, plan, titel){
    B = (kerzen||[]).map(k=>({t:k[0], o:k[1], h:k[2], l:k[3], c:k[4], v:k[5]}));
    Z = zeichnungTf || null; C = chance || null; P = plan || null;
    wasserzeichen = titel || '';
    // 90 Kerzen als Startbild. Mehr sieht auf dem Handy nach Strichcode aus, und bei
    // H4 deckt das schon zwei Wochen ab — genug für einen Swing, ohne dass die
    // Preisachse so weit wird, dass man die Struktur nicht mehr liest.
    anz = Math.min(90, Math.max(40, B.length));
    i0 = Math.max(0, B.length - anz);
    letzterPreis = B.length ? B[B.length-1].c : null;
    zeichne();
  }
  function setzeLivePreis(p){
    if (!B.length || !isFinite(p)) return;
    const last = B[B.length-1];
    last.c = p; if (p > last.h) last.h = p; if (p < last.l) last.l = p;
    letzterPreis = p; zeichne();
  }
  function ebene(k, an){ EBENEN[k] = an; zeichne(); }
  function ebenen(){ return EBENEN; }

  function groesse(){
    cv = $('cv'); if (!cv) return;
    ctx = cv.getContext('2d');
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    zeichne();
  }

  function startIndex(){ return Math.max(0, Math.min(i0, Math.max(0, B.length-5))); }
  function sicht(){ const a = startIndex(); return B.slice(a, a + anz); }
  /* Rechts vom letzten Kerze bleibt Platz frei — dort steht der Plan als Kasten
     (Risiko rot, Chance grün), ohne eine einzige Kerze zu verdecken. Nur wenn das
     Ende der Reihe zu sehen ist; wer zurückblättert, braucht den Platz nicht. */
  function freieSlots(v){
    return startIndex() + v.length >= B.length ? Math.max(5, Math.round(v.length * 0.17)) : 0;
  }

  /* Die Linien des Plans in einer Liste: [Name, Preis, Farbe, Art]. */
  function planLinien(){
    if (!P) return [];
    const cLong = farbe('--long'), cBad = farbe('--bad'), cEin = farbe('--accent-2');
    const erreicht = new Set(P.erreicht || []);
    const l = [];
    if (P.einstieg != null) l.push(['Einstieg', P.einstieg, cEin, 'ein']);
    if (P.stop != null) l.push([P.schutz ? 'Schutz-Stop' : 'Stop', P.stop, cBad, 'stop']);
    for (const [lab, k] of [['TP1','tp1'],['TP2','tp2'],['TP3','tp3']])
      if (P[k] != null) l.push([lab, P[k], cLong, erreicht.has(lab) ? 'ok' : 'tp']);
    return l.filter(x => isFinite(x[1]));
  }
  function rVon(p){
    if (!P || P.einstieg == null || P.risiko == null || !(P.risiko > 0)) return null;
    const lang = P.richtung !== 'short';
    return ((lang ? p - P.einstieg : P.einstieg - p)) / P.risiko;
  }

  /* Preisspanne der Ansicht.
     Wichtig ist die Reihenfolge: Der erlaubte Rahmen wird EINMAL aus den Kerzen
     bestimmt und danach nicht mehr verändert. Vorher wurde er in der Schleife
     mitgezogen — dann hat jedes akzeptierte Level den Rahmen für das nächste
     geweitet, und ein paar entfernte Liquiditätsmarken haben die Kerzen zu einem
     Streifen in der Mitte zusammengedrückt. Was ausserhalb liegt, wird nicht
     weggelassen, sondern als Marke am Rand gezeigt. */
  let ausserhalb = [];
  function spanne(v){
    let khi = -Infinity, klo = Infinity;
    for (const b of v){ if (b.h > khi) khi = b.h; if (b.l < klo) klo = b.l; }
    if (!isFinite(khi) || !isFinite(klo) || khi === klo){
      khi = (khi||1) * 1.01; klo = (klo||1) * 0.99;
    }
    const kspanne = khi - klo;
    const maxHi = khi + kspanne * 0.55, minLo = klo - kspanne * 0.55;
    let hi = khi, lo = klo;
    ausserhalb = [];
    const kandidaten = [];
    if (EBENEN.ziele) for (const [lab, p, col] of planLinien()) kandidaten.push([lab, p, col]);
    // Nur offene Liquidität zieht die Achse auf. Abgeholte Marken sind kein Ziel mehr.
    if (EBENEN.liq && Z) for (const x of (Z.liquiditaet||[]))
      if (x.zustand === 'unswept') kandidaten.push([null, x.p]);
    for (const [lab, p, col] of kandidaten){
      if (!isFinite(p)) continue;
      if (p > maxHi || p < minLo){ if (lab) ausserhalb.push([lab, p, p > maxHi, col]); continue; }
      if (p > hi) hi = p;
      if (p < lo) lo = p;
    }
    const luft = (hi - lo) * 0.06;
    return {hi: hi + luft, lo: lo - luft};
  }

  /* Beschriftungen, die sich überlappen würden, auseinanderschieben — erst nach
     unten, und was dann unten herausfällt, wieder nach oben. Die Linie bleibt am
     echten Preis; nur das Schild weicht aus. */
  function entzerre(items, abst, oben, unten){
    items.sort((a,b)=>a.y-b.y);
    for (const it of items) it.y = Math.max(oben, Math.min(unten, it.y));
    for (let k=1;k<items.length;k++)
      if (items[k].y - items[k-1].y < abst) items[k].y = items[k-1].y + abst;
    const n = items.length;
    if (n && items[n-1].y > unten){
      items[n-1].y = unten;
      for (let k=n-2;k>=0;k--) if (items[k+1].y - items[k].y < abst) items[k].y = items[k+1].y - abst;
    }
    return items;
  }
  function pille(x, y, w, h, r){
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  function zeichne(){
    if (!cv || !ctx) { cv = $('cv'); if (!cv) return; ctx = cv.getContext('2d'); }
    const r = cv.getBoundingClientRect(), W = r.width, H = r.height;
    ctx.clearRect(0,0,W,H);
    const v = sicht(); if (!v.length) return;
    const {hi, lo} = spanne(v);
    const rsiAn = EBENEN.rsi && Z && (Z.rsi||[]).length;
    const rsiH = rsiAn ? RSI_H : 0;
    const px = W - M.l - M.r, py = H - M.t - M.b - rsiH;
    const frei = freieSlots(v), slots = v.length + frei, sw = px / slots;
    const X = i => M.l + (i + 0.5) * sw;
    const Y = p => M.t + (hi - p) / (hi - lo) * py;
    const bw = Math.max(1.2, Math.min(11, sw * 0.68));
    const xEnde = M.l + v.length * sw;          // rechter Rand der Kerzen
    const xRand = W - M.r;                      // rechter Rand der Zeichenfläche

    const cRule = farbe('--grid'), cInk = farbe('--ink'), cInk3 = farbe('--ink-3');
    const cLong = farbe('--long'), cBad = farbe('--bad'), cWick = farbe('--wick');
    const cAcc = farbe('--accent'), cWarn = farbe('--warn'), cBg = farbe('--bg');
    const d = digits((hi+lo)/2);

    // Schilder an der Preisachse: erst sammeln, dann entzerren, dann zeichnen.
    const achse = [];
    const linien = EBENEN.ziele ? planLinien() : [];
    for (const [lab, p, col, art] of linien){
      const y = Y(p); if (y < M.t-1 || y > M.t+py+1) continue;
      achse.push({y, y0: y, text: num(p, d), bg: col, fg: cBg, art});
    }
    if (letzterPreis != null){
      const y = Y(letzterPreis);
      if (y > M.t && y < M.t + py){
        const auf = v.length ? v[v.length-1].c >= v[v.length-1].o : true;
        achse.push({y, y0: y, text: num(letzterPreis, d), bg: cInk, fg: cBg, art: 'kurs', auf});
      }
    }
    entzerre(achse, 16, M.t + 8, M.t + py - 8);

    // Wasserzeichen: welcher Wert, welche Zeitebene — gross und kaum sichtbar.
    if (wasserzeichen){
      ctx.save();
      ctx.fillStyle = cInk + '0c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.max(22, Math.min(46, px / 9))}px "Space Grotesk",Inter,sans-serif`;
      ctx.fillText(wasserzeichen, M.l + px/2, M.t + py * 0.5);
      ctx.restore();
    }

    // Raster + Preisachse. Eine Rasterzahl, die unter einem Schild läge, entfällt.
    ctx.font = `10px ${MONO}`; ctx.textBaseline = 'middle';
    ctx.strokeStyle = cRule; ctx.lineWidth = 1;
    const stufen = 5;
    for (let k=0;k<=stufen;k++){
      const p = lo + (hi-lo)*k/stufen, y = Math.round(Y(p)) + 0.5;
      ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(xRand, y); ctx.stroke();
      if (achse.some(a => Math.abs(a.y - y) < 12)) continue;
      ctx.fillStyle = cInk3; ctx.textAlign = 'left';
      ctx.fillText(num(p, d), xRand+5, y);
    }

    // Volumen als blasse Säulen am Fuss der Kerzen
    if (EBENEN.vol){
      let vmax = 0; for (const b of v) if (b.v > vmax) vmax = b.v;
      if (vmax > 0){
        const vh = py * 0.13, basis = M.t + py;
        for (let i=0;i<v.length;i++){
          const b = v[i]; if (!(b.v > 0)) continue;
          const h = Math.max(1, b.v / vmax * vh);
          ctx.fillStyle = (b.c >= b.o ? cLong : cBad) + '1a';
          ctx.fillRect(X(i) - bw/2, basis - h, bw, h);
        }
      }
    }

    // Zonen (hinter den Kerzen)
    if (EBENEN.zonen && Z) for (const z of (Z.zonen||[])){
      const y1 = Y(z.bis), y2 = Y(z.von);
      if (Math.max(y1,y2) < M.t-40 || Math.min(y1,y2) > M.t+py+40) continue;
      const lang = z.richtung === 'bullish' || z.richtung === 'long';
      ctx.fillStyle = (lang ? cLong : cBad) + '1c';
      ctx.fillRect(M.l, Math.min(y1,y2), px, Math.max(1.5, Math.abs(y2-y1)));
      ctx.fillStyle = (lang ? cLong : cBad) + 'b0'; ctx.font = `9px ${MONO}`; ctx.textAlign = 'left';
      if (Math.abs(y2-y1) > 9) ctx.fillText(z.art + (lang ? ' ↑' : ' ↓'), M.l+3, Math.min(y1,y2)+6);
    }

    // Premium / Discount
    if (EBENEN.pd && Z && Z.pd){
      const yh = Y(Z.pd.hoch), ym = Y(Z.pd.mitte), yl = Y(Z.pd.tief);
      ctx.strokeStyle = cAcc + '77'; ctx.setLineDash([2,3]); ctx.lineWidth = 1;
      for (const y of [yh, ym, yl]){ ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(xRand,y); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.fillStyle = cAcc; ctx.font = `9px ${MONO}`; ctx.textAlign = 'left';
      ctx.fillText('EQ', M.l+2, ym-6);
    }

    // Liquidität — nur was noch offen liegt. Abgeholte oder gebrochene Marken sind
    // kein Magnet mehr und machten den Chart nur zum Strichcode.
    if (EBENEN.liq && Z){
      const KURZ = {pdh:'PDH', pdl:'PDL', equal_highs:'EQH', equal_lows:'EQL',
                    swing_high:'BSL', swing_low:'SSL'};
      const beschriftet = [];
      for (const x of (Z.liquiditaet||[])){
        if (x.zustand !== 'unswept') continue;
        const y = Y(x.p); if (y < M.t-2 || y > M.t+py+2) continue;
        ctx.strokeStyle = cWarn + 'b0'; ctx.setLineDash([5,4]);
        ctx.lineWidth = Math.min(2, 0.8 + (x.staerke||0)*1.6);
        ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(xEnde,y); ctx.stroke();
        ctx.setLineDash([]);
        if (frei && !linien.some(l => Math.abs(Y(l[1]) - y) < 11)
                 && !beschriftet.some(b => Math.abs(b - y) < 10)){
          beschriftet.push(y);
          ctx.fillStyle = cWarn; ctx.font = `8.5px ${MONO}`; ctx.textAlign = 'left';
          ctx.fillText(KURZ[x.typ] || '$', xEnde + 3, y - 5);
        }
      }
    }

    // Plan-Kasten im freien Bereich: Risiko (Einstieg→Stop) rot, Chance (Einstieg→
    // letztes Ziel) grün. So sieht man auf einen Blick, wie viel man riskiert und
    // wie viel drin ist — wie das Positions-Werkzeug in TradingView.
    if (EBENEN.ziele && P && P.einstieg != null && frei){
      const xa = xEnde + sw * 0.4, xb = xRand;
      const yE = Y(P.einstieg);
      const ziele = [P.tp1, P.tp2, P.tp3].filter(x => x != null && isFinite(x));
      const weitestes = ziele.length ? ziele[ziele.length-1] : null;
      if (P.stop != null){
        const yS = Y(P.stop);
        ctx.fillStyle = cBad + '24';
        ctx.fillRect(xa, Math.min(yE,yS), xb-xa, Math.abs(yS-yE));
      }
      if (weitestes != null){
        const yT = Y(weitestes);
        const g = ctx.createLinearGradient(0, yE, 0, yT);
        g.addColorStop(0, cLong + '14'); g.addColorStop(1, cLong + '38');
        ctx.fillStyle = g;
        ctx.fillRect(xa, Math.min(yE,yT), xb-xa, Math.abs(yT-yE));
      }
    }

    // Kerzen
    for (let i=0;i<v.length;i++){
      const b = v[i], x = X(i), auf = b.c >= b.o;
      ctx.strokeStyle = cWick; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, Y(b.h)); ctx.lineTo(Math.round(x)+0.5, Y(b.l)); ctx.stroke();
      ctx.fillStyle = auf ? cLong : cBad;
      const yo = Y(b.o), yc = Y(b.c);
      ctx.fillRect(x - bw/2, Math.min(yo,yc), bw, Math.max(1.2, Math.abs(yc-yo)));
    }

    // Swings — Punkte für alle, Beschriftung nur für die letzten acht. Mehr ist auf
    // dem Handy nicht lesbar, und die jüngste Struktur ist die, die zählt.
    if (EBENEN.swings && Z){
      const idx = new Map(v.map((b,i)=>[b.t, i]));
      const sichtbar = (Z.swings||[]).filter(s => idx.has(s.t));
      const ab = Math.max(0, sichtbar.length - 8);
      ctx.font = `9px ${MONO}`;
      sichtbar.forEach((s, k)=>{
        const x = X(idx.get(s.t)), y = Y(s.p);
        ctx.fillStyle = s.hoch ? cBad : cLong;
        ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 6.2832); ctx.fill();
        if (k >= ab && s.label && s.label !== 'NONE'){
          ctx.textAlign = 'center'; ctx.fillStyle = cInk3;
          ctx.fillText(s.label === 'EQUAL' ? 'EQ' : s.label, x, y + (s.hoch ? -9 : 12));
        }
      });
    }

    // Strukturbrüche
    if (EBENEN.brueche && Z){
      const idx = new Map(v.map((b,i)=>[b.t, i]));
      ctx.font = `9px ${MONO}`;
      for (const br of (Z.brueche||[])){
        const i = idx.get(br.t);
        const y = Y(br.p);
        if (y < M.t-20 || y > M.t+py+20) continue;
        const lang = br.richtung === 'bullish';
        ctx.strokeStyle = (lang ? cLong : cBad) + 'cc'; ctx.setLineDash([6,3]); ctx.lineWidth = 1.4;
        const x0 = i == null ? M.l : X(i);
        ctx.beginPath(); ctx.moveTo(Math.max(M.l, x0-40), y); ctx.lineTo(xEnde, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = lang ? cLong : cBad; ctx.textAlign = 'left';
        ctx.fillText(br.art === 'CHOCH' ? 'CHoCH' : br.art, Math.max(M.l+2, x0-38), y-4);
      }
    }

    // Kurslinie über die ganze Breite
    if (letzterPreis != null){
      const y = Y(letzterPreis);
      if (y > M.t && y < M.t + py){
        ctx.strokeStyle = cInk + '99'; ctx.setLineDash([1,3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(xRand, y); ctx.stroke(); ctx.setLineDash([]);
        if (frei && v.length){
          // Ein kleiner Puls am letzten Kurs: hier ist „jetzt".
          ctx.fillStyle = cAcc + '33'; ctx.beginPath(); ctx.arc(X(v.length-1), y, 6, 0, 6.2832); ctx.fill();
          ctx.fillStyle = cAcc; ctx.beginPath(); ctx.arc(X(v.length-1), y, 2.6, 0, 6.2832); ctx.fill();
        }
      }
    }

    // Einstieg / Stop / Ziele als Linien, Schilder rechts im Kasten mit R-Vielfachem
    if (linien.length){
      const schilder = [];
      for (const [lab, p, col, art] of linien){
        const y = Y(p); if (y < M.t-1 || y > M.t+py+1) continue;
        ctx.strokeStyle = art === 'ok' ? col + '66' : col;
        ctx.lineWidth = art === 'ein' ? 1.3 : 1.5;
        ctx.setLineDash(art === 'ok' ? [3,3] : art === 'ein' ? [7,3] : []);
        ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(xRand,y); ctx.stroke(); ctx.setLineDash([]);
        const rr = art === 'ein' ? null : rVon(p);
        const text = lab + (art === 'ok' ? ' ✓' : '') +
          (rr != null ? ` ${rr >= 0 ? '+' : '−'}${Math.abs(rr).toFixed(1).replace('.',',')}R` : '');
        schilder.push({y, text, col, art});
      }
      entzerre(schilder, 14, M.t + 7, M.t + py - 7);
      ctx.font = `600 9.5px ${MONO}`; ctx.textBaseline = 'middle';
      for (const s of schilder){
        const w = ctx.measureText(s.text).width + 10;
        const x = xRand - w - 3;
        ctx.fillStyle = cBg + 'e0'; pille(x, s.y - 7, w, 14, 4);
        ctx.fillStyle = s.col + (s.art === 'ok' ? '99' : '');
        ctx.textAlign = 'left'; ctx.fillText(s.text, x + 5, s.y + 0.5);
      }
    }

    // Was ausserhalb der Ansicht liegt, als Marke am Rand — statt es zu verschweigen
    // oder dafür die Kerzen platt zu drücken.
    if (ausserhalb.length){
      ctx.font = `9.5px ${MONO}`; ctx.textAlign = 'right';
      let obenN = 0, untenN = 0;
      for (const [lab, p, oben, col] of ausserhalb){
        const y = oben ? M.t + 10 + (obenN++)*13 : M.t + py - 8 - (untenN++)*13;
        ctx.fillStyle = col || cLong;
        ctx.fillText(`${lab} ${num(p, d)} ${oben?'↑':'↓'}`, xRand - 6, y);
      }
    }

    // Schilder an der Preisachse (Plan in Farbe, Kurs in Akzent) — Text in der
    // Hintergrundfarbe auf vollem Grund, damit er in beiden Themen lesbar ist.
    ctx.font = `600 10px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (const a of achse.sort((x,y)=> (x.art==='kurs') - (y.art==='kurs'))){
      ctx.fillStyle = a.art === 'ok' ? a.bg + '88' : a.bg;
      pille(xRand + 1, a.y - 8, M.r - 2, 16, 4);
      ctx.fillStyle = a.fg; ctx.fillText(a.text, xRand + 5, a.y + 0.5);
    }

    // RSI-Streifen unter den Kerzen
    if (rsiAn){
      const alle = Z.rsi || [];
      // Die RSI-Reihe ist so lang wie die gezeigten Kerzen; dasselbe Fenster ausschneiden.
      const off = Math.max(0, B.length - alle.length);
      const von = Math.max(0, startIndex() - off);
      const werte = alle.slice(von, von + v.length);
      const yTop = M.t + py + 10, yH = rsiH - 14;
      const RY = r => yTop + (100 - r) / 100 * yH;
      // Überkauft / überverkauft als blasse Bänder
      ctx.fillStyle = cBad + '10'; ctx.fillRect(M.l, RY(100), xEnde - M.l, RY(70) - RY(100));
      ctx.fillStyle = cLong + '10'; ctx.fillRect(M.l, RY(30), xEnde - M.l, RY(0) - RY(30));
      ctx.strokeStyle = cRule; ctx.lineWidth = 1;
      for (const lvl of [30, 50, 70]){
        const y = Math.round(RY(lvl)) + 0.5;
        ctx.setLineDash(lvl === 50 ? [1,3] : [3,3]);
        ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(xRand, y); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle = cInk3; ctx.font = `9px ${MONO}`; ctx.textAlign = 'left';
      ctx.fillText('70', xRand+5, RY(70)); ctx.fillText('30', xRand+5, RY(30));
      ctx.strokeStyle = cAcc; ctx.lineWidth = 1.4; ctx.beginPath();
      let begonnen = false;
      for (let i=0;i<werte.length;i++){
        const r = werte[i];
        if (r == null){ begonnen = false; continue; }
        const x = X(i), y = RY(r);
        if (!begonnen){ ctx.moveTo(x,y); begonnen = true; } else ctx.lineTo(x,y);
      }
      ctx.stroke();
      const letzterR = werte.filter(r=>r!=null).slice(-1)[0];
      if (letzterR != null){
        ctx.fillStyle = letzterR >= 70 ? cBad : letzterR <= 30 ? cLong : cInk3;
        ctx.textAlign = 'left'; ctx.font = `10px ${MONO}`;
        ctx.fillText(`RSI ${letzterR.toFixed(0)}${letzterR >= 70 ? ' · überkauft' : letzterR <= 30 ? ' · überverkauft' : ''}`, M.l+3, yTop - 1);
      }
    }

    // Zeitachse — keine Beschriftung, die am Rand abgeschnitten würde
    ctx.fillStyle = cInk3; ctx.font = `9.5px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const schritt = Math.max(1, Math.floor(v.length/5));
    for (let i=0;i<v.length;i+=schritt){
      const t = v[i].t ? new Date(v[i].t) : null; if (!t) continue;
      const text = t.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
      const hw = ctx.measureText(text).width / 2;
      if (X(i) - hw < 1 || X(i) + hw > xRand) continue;
      ctx.fillText(text, X(i), H-M.b+11);
    }

    // Fadenkreuz mit Preis- und Zeitschild
    if (hoverX != null && hoverX > M.l && hoverX < xRand){
      const i = Math.max(0, Math.min(v.length-1, Math.floor((hoverX-M.l)/sw)));
      ctx.strokeStyle = cInk3 + '88'; ctx.setLineDash([2,3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(i), M.t); ctx.lineTo(X(i), H-M.b); ctx.stroke();
      const imPreis = hoverY != null && hoverY >= M.t && hoverY <= M.t + py;
      if (imPreis){ ctx.beginPath(); ctx.moveTo(M.l,hoverY); ctx.lineTo(xRand,hoverY); ctx.stroke(); }
      ctx.setLineDash([]);
      const b = v[i], el = $('readout');
      const p = imPreis ? hi - (hoverY-M.t)/py*(hi-lo) : null;
      ctx.font = `600 10px ${MONO}`; ctx.textBaseline = 'middle';
      if (p != null){
        ctx.fillStyle = cInk3; pille(xRand + 1, hoverY - 8, M.r - 2, 16, 4);
        ctx.fillStyle = cBg; ctx.textAlign = 'left'; ctx.fillText(num(p, d), xRand + 5, hoverY + 0.5);
      }
      if (b.t){
        const text = new Date(b.t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        const w = ctx.measureText(text).width + 10;
        const x = Math.max(M.l, Math.min(xRand - w, X(i) - w/2));
        ctx.fillStyle = cInk3; pille(x, H - M.b + 3, w, 16, 4);
        ctx.fillStyle = cBg; ctx.textAlign = 'left'; ctx.fillText(text, x + 5, H - M.b + 11.5);
      }
      if (el){
        const rr = p != null ? rVon(p) : null;
        el.textContent =
          `${b.t ? new Date(b.t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}` +
          `   O ${num(b.o,d)}  H ${num(b.h,d)}  L ${num(b.l,d)}  C ${num(b.c,d)}` +
          (b.v ? `  V ${kompakt(b.v)}` : '') +
          (p != null ? `   ·   Cursor ${num(p,d)}` : '') +
          (rr != null ? ` (${rr >= 0 ? '+' : '−'}${Math.abs(rr).toFixed(2).replace('.',',')} R)` : '');
      }
    }
  }
  function kompakt(x){
    return x >= 1e9 ? (x/1e9).toFixed(1).replace('.',',') + ' Mrd'
         : x >= 1e6 ? (x/1e6).toFixed(1).replace('.',',') + ' Mio'
         : x >= 1e3 ? (x/1e3).toFixed(1).replace('.',',') + ' Tsd' : String(Math.round(x));
  }

  let globalGebunden = false;
  function binde(){
    cv = $('cv'); if (!cv) return;
    groesse();
    const zoom = (neu, ankerRechts)=>{
      const alt = anz;
      anz = Math.round(Math.max(25, Math.min(B.length || 400, neu)));
      i0 = ankerRechts
        ? Math.max(0, ankerRechts - anz)
        : Math.max(0, Math.min(B.length - anz, i0 + Math.round((alt - anz)/2)));
      zeichne();
    };
    cv.addEventListener('wheel', e=>{
      e.preventDefault();
      zoom(anz * (e.deltaY > 0 ? 1.15 : 0.87));
    }, {passive:false});
    const runter = e=>{
      if (e.touches && e.touches.length === 2){
        const [a, b] = e.touches;
        kneifen = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) || 1, anz,
                   rechts: Math.min(B.length, startIndex() + anz)};
        ziehen = null; return;
      }
      ziehen = {x: (e.touches?e.touches[0]:e).clientX, i0};
    };
    const bewegen = e=>{
      if (e.touches && e.touches.length === 2 && kneifen){
        const [a, b] = e.touches;
        const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) || 1;
        zoom(kneifen.anz * kneifen.d / dist, kneifen.rechts);
        return;
      }
      if (kneifen) return;
      const t = e.touches ? e.touches[0] : e;
      const r = cv.getBoundingClientRect();
      hoverX = t.clientX - r.left; hoverY = t.clientY - r.top;
      if (ziehen){
        const v = sicht();
        const px = r.width - M.l - M.r;
        const sw = px / Math.max(1, v.length + freieSlots(v));
        const dx = t.clientX - ziehen.x;
        i0 = Math.max(0, Math.min(Math.max(0,B.length - anz), ziehen.i0 - Math.round(dx / sw)));
      }
      zeichne();
    };
    const hoch = e=>{ ziehen = null; if (!e.touches || e.touches.length < 2) kneifen = null; };
    cv.addEventListener('pointerdown', runter);
    cv.addEventListener('pointermove', bewegen);
    // Nur einmal aufs Fenster hängen: die Chart-Ansicht wird bei jedem Wechsel des
    // Instruments oder der Zeitebene neu gebaut, und sonst sammeln sich die Handler.
    if (!globalGebunden){ window.addEventListener('pointerup', ()=>{ ziehen = null; }); globalGebunden = true; }
    cv.addEventListener('pointerleave', ()=>{ hoverX = hoverY = null; zeichne(); });
    cv.addEventListener('touchstart', runter, {passive:true});
    cv.addEventListener('touchmove', bewegen, {passive:true});
    cv.addEventListener('touchend', hoch);
    cv.addEventListener('touchcancel', hoch);
    // Doppeltipp / Doppelklick: zurück auf das Startbild
    cv.addEventListener('dblclick', ()=>{
      anz = Math.min(90, Math.max(40, B.length)); i0 = Math.max(0, B.length - anz); zeichne();
    });
  }
  window.addEventListener('resize', ()=>groesse());
  return {setze, setzeLivePreis, zeichne, groesse, binde, ebene, ebenen};
})();

  kopfzeile.textContent = `${g.length} Instrumente · Scan ${zeit(S.erzeugt)}` +
    (alter != null ? ` (vor ${altersText()})` : '');
  kopfzeile.style.color = scanTot() ? 'var(--bad)' : (scanVeraltet() ? 'var(--warn)' : '');
}

/* ================================================ DEPOT AUF DER STARTSEITE

/* Tageshandel & Gold auf der Startseite (12.10.): der Markt-Reiter ist das Cockpit — der

   Zeile: Welle, offene Paper-Trades, Gold-Kurs, S9-Zustand, naechster US-Termin. */
function tageshandelZeile(){

  const s9 = GD && GD.gold ? (DT_ZUSTAND_TEXT[GD.gold.zustand] || GD.gold.zustand) : null;
  const term = (typeof dtGoldTermine === 'function') ? dtGoldTermine(S && S.makro && S.makro.termine, Date.now()) : [];
  const t0 = term.find(t => Date.parse(t.zeitpunkt) > Date.now());

  return `<div class="karte ${wl ? 'gut' : ''}" style="margin:10px 0 0;cursor:pointer" id="tageshandelzeile">

      ? 'Die Ausbruchswelle läuft — Einstiegs-Alarme kommen nur für klare Ausbrüche.'
      : `Keine Welle (Alarm ab ${min} von 24 Coins). Kein Tageshandel nötig — warten ist hier die Strategie.`}
      ${t0 ? ` Nächster wichtiger US-Termin für Gold: <b>${esc(t0.titel)}</b>, ${zeit(t0.zeitpunkt)}.` : ''}</p>
  </div>`;
}
function depotZeile(){
  let pos;
  try { pos = ladePositionen(); } catch(e){ return ''; }
  if (!pos.length) return '';
  let bew;
  try { bew = pos.map(bewertePosition); } catch(e){ return ''; }
  const kursEU = (S && S.eurusd) || null;
  const euro = (b, v) => v == null ? null : (b.w === 'EUR' || !kursEU ? v : v / kursEU);
  const wert = bew.reduce((s,b)=>s + (euro(b,b.wert)||0), 0);
  const einstand = bew.reduce((s,b)=>s + (euro(b,b.einstand)||0), 0);
  const gv = bew.reduce((s,b)=>s + (euro(b,b.gv)||0), 0);
  const zaehl = (...u) => bew.filter(b=>u.includes(b.urteil)).length;
  const halten = zaehl('STARK HALTEN','HALTEN');
  const schauen = zaehl('BEOBACHTEN');
  const raus = zaehl('REDUZIEREN','GEGEN DIE THESE');
  const ohneStop = bew.filter(b=>b.kurs != null && !(b.pos.plan && b.pos.plan.stop != null)).length;
  return `<div class="karte ${raus?'bad':(schauen?'warn':'gut')}" style="margin:10px 0 0;cursor:pointer" id="depotzeile">

      <span>Beobachten <b class="${schauen?'nu':''}">${schauen}</b></span>

    ${ohneStop ? `<p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">

      die App nicht, wenn es eng wird. Im Depot-Reiter in einem Klick nachtragen.</p>` : ''}
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-3)">Bewertet nach relativer
      Stärke in der eigenen Klasse, nicht nach Einstiegs-Score — läuft bei jedem Kurs neu.</p>
  </div>`;
}

/* ============================================ DEINE COINS UND DIE GROSSEN

   Ozan, 01.10.: „Bitcoin, Ethereum, Solana — ich hab bis jetzt nicht einen einzigen
   Alarm von denen gesehen … und von den Coins, die ich selber benutze, auch nicht,
   sondern von irgendwelchen anderen."

   Genau das stand nirgends: WARUM zu genau diesen Werten nichts kommt. Die Rangliste
   zeigt nur, was ein Setup hat; was keins hat, verschwindet im Rest. Hier stehen die
   drei Grossen und jeder Coin aus dem Depot immer ganz oben, mit dem einen Satz, der
   den Stand erklaert — und mit dem Platz im „Big Plan" (der Momentum-Regel im Reiter
   Plan), wo der Wert dazugehoert. Erfunden wird nichts: steht hier „kein Einstieg",
   gibt es gerade keinen, der sich messbar gelohnt hat. */
const KERN_COINS = ['BTCUSD', 'ETHUSD', 'SOLUSD'];
function sicherText(fn){ try { return fn() || ''; } catch(e){ console.error(e); return ''; } }
function _basisCoin(k){ return String(k||'').toUpperCase().replace(/(USDT|USDC|USD|EUR|-YFD)$/,''); }
function keinTradeSatz(r){
  const ren = (r.zusatz && r.zusatz.renditen) || {};
  const m1 = ren.r21, m3 = ren.r63;
  const lauf = (m1 != null && m3 != null)
    ? `${pct(m1,1)} in einem Monat, ${pct(m3,0)} in drei` : '';
  const b = String(r.begruendung || '');
  if (/Invalidierung/.test(b)){
    if (m1 != null && m3 != null && m1 > 0 && m3 > 0)
      return `Steigt (${lauf}) ohne Rücksetzer — keine Stop-Marke, deshalb noch kein Einstieg.`;
    if (m1 != null && m3 != null && m1 < 0 && m3 < 0)
      return `Fällt (${lauf}) ohne klare Struktur — weder ein Einstieg noch ein Short mit sauberer Marke.`;
    return 'Seitwärts ohne klare Richtung auf den Zeitebenen — kein Einstieg mit sauberer Stop-Marke.'
      + (lauf ? ` (${lauf})` : '');
  }
  return b || 'kein Einstieg';
}
function meineCoinsDaten(){
  if (!S) return [];
  const liste = [];
  const dazu = (sym, depot) => {
    const r = scanRow(sym);
    const k = r ? r.instrument : String(sym).toUpperCase();
    const da = liste.find(x => _basisCoin(x.k) === _basisCoin(k));
    if (da){ da.depot = da.depot || depot; return; }
    liste.push({k, r, depot});
  };
  for (const k of KERN_COINS) dazu(k, false);
  let depot = [];
  try { depot = depotKryptoSymbole(); } catch(e){}
  for (const d of depot) dazu(d, true);
  const plan = new Map(((P && P.positions) || []).map(x => [_basisCoin(x.instrument), x]));
  const imPlanUniversum = new Set(['BTC','ETH','BNB']);
  return liste.slice(0, 14).map(({k, r, depot}) => {
    const live = L.get(k);
    const kurs = live ? live.p : (r ? r.kurs : null);
    const basis = _basisCoin(k);
    let status = '', kl = 'nu';
    if (!r){ status = 'Nicht im Scan — bei Kraken zu wenig Umsatz oder nicht gelistet.'; }
    else if (r.alarm && r.alarm.ja){
      status = `${r.richtung==='long'?'KAUFEN':'SHORT'} ab ${num(r.einstieg, digits(r.einstieg))} — geht aufs Handy.`;
      kl = 'up';
    } else if (r.handelbar){
      status = `Setup da (Note ${r.note}), aber kein Alarm: ${(r.alarm && r.alarm.grund) || ''}`;
      kl = 'warn';
    } else if (r.urteil === 'WATCH'){
      status = 'Beobachten — ' + (r.bremse || r.begruendung || 'noch nicht reif');
    } else {
      status = keinTradeSatz(r);
    }
    const pl = plan.get(basis);
    const planSatz = pl ? `Big Plan: drin (${num(pl.eur,0)} €)`
      : (imPlanUniversum.has(basis) ? 'Big Plan: gerade nicht drin' : '');
    const m1 = r && r.zusatz && r.zusatz.renditen ? r.zusatz.renditen.r21 : null;
    return {k, r, depot, kurs, live: !!live, status, kl, planSatz, m1, name: name(k)};
  });
}

/* Das beste Setup ganz oben, sobald man die App oeffnet. Ozans Endbild aus dem
   Masterplan: "TOP OPPORTUNITY — Entry, SL, TP1/2/3, R:R, Score, Confidence".
   Es kommt aus derselben Rangliste wie der Alarme-Tab, damit nirgends zwei
   verschiedene "beste Chancen" stehen. */
/* Das CRV kam an drei Stellen aus zwei verschiedenen Quellen — und stand deshalb auf
   Ozans Bildschirm zweimal verschieden am selben Wert: im Markt „CRV 1:2.0", unter
   Alarme „CRV 1:1.25", gleicher Coin, gleiche Minute.

   Richtig ist die Zahl aus dem HANDELSPLAN. Der Plan legt Stop und Ziele so, dass Ziel 1
   nie naeher liegt als der Stop entfernt ist; genau diese Marken stehen auf der Karte.
   ``o.rr`` ist das rohe Verhaeltnis aus der Liquiditaetsrechnung davor — eine andere
   Groesse, die zu den angezeigten Marken nicht passt. Ab hier fragt jede Stelle hier. */
function crvVon(o){
  if (o && o.plan && o.plan.crv != null && isFinite(o.plan.crv)) return o.plan.crv;
  if (o && o.rr != null && isFinite(o.rr)) return o.rr;
  return null;
}

function topSignal(){
  const kand = [...rangLagen().values()];
  if (!kand.length) return '';
  /* Was aufs Handy geht (oder schon ging), steht vorn. Bis 30.09. entschied hier nur die
     Note — und oben stand „Arista KAUFEN, A+", waehrend das Alarm-Tor genau diese Art
     (Aktien Long) wegen der eigenen Verluste gesperrt hatte. Die groesste Karte der App
     sagte also etwas anderes als das Telefon. Jetzt gilt dieselbe Rangfolge wie beim
     Alarm; ein gesperrtes Setup kommt nur nach oben, wenn es sonst nichts gibt — und dann
     mit dem Grund, warum es nicht klingelt. */
  const klingelt = a => !!((a.w && a.w.gemeldet) || (a.o && a.o.alarm && a.o.alarm.ja));
  const rang = a => [klingelt(a) ? 0 : 1, -(NOTE_RANG[a.w.note]||0), Math.abs(a.abstand ?? 999)];
  kand.sort((a,b)=>{ const ra=rang(a), rb=rang(b);
    for (let i=0;i<ra.length;i++) if (ra[i]!==rb[i]) return ra[i]-rb[i];
    return 0; });
  const x = kand[0], w = x.w, o = x.o || {}, d = digits(w.einstieg);
  const torGrund = !klingelt(x) && o.alarm && o.alarm.ja === false ? (o.alarm.grund || '') : '';
  // Verkaufen klingt nach: das, was du hast, abstossen. Ein neuer Short ist etwas anderes.
  const seite = x.lang ? 'KAUFEN' : 'SHORT';
  /* Hier stand ``x.stufe === 'jetzt' || x.stufe === 'im_trade'`` — und damit las eine
     laufende Position wie eine Kaufaufforderung. Auf Ozans Bildschirm stand oben
     „BNB KAUFEN — JETZT, Einstieg 720,15" und zwei Zeilen tiefer in derselben Liste
     „noch 0,5 %, Einstieg 707,86": oben der eingefrorene Vertrag des laufenden Trades,
     unten der frische Vorschlag aus dem Scan. Beides richtig gerechnet, zusammen eine
     Aufforderung, etwas zu kaufen, das laengst laeuft.
     Ein laufender Trade ist kein Einstieg. Er bekommt jetzt sein eigenes Wort. */
  const jetzt = x.stufe === 'jetzt';
  const laeuft = x.stufe === 'im_trade' || x.stufe === 'stop';
  const ziele = [w.tp1, w.tp2, w.tp3].filter(v=>v!=null);
  const st = o.setup || null, pl = o.plan || null;
  // Die grosse Karte ist das Erste, was beim Öffnen im Blick ist. Sie beantwortet
  // in dieser Reihenfolge: was, warum, zu welchem Preis, mit welchem Risiko.
  return `<div class="hero ${x.lang?'lang':'kurz'} ${jetzt?'jetzt':''}"
      data-sym="${esc(w.instrument)}" id="topsignal">
    <div class="hero-k">
      <span class="mono lbl">${laeuft ? 'Läuft gerade' : 'Beste Chance'}</span>
      <span class="note ${NOTE_KLASSE[w.note]||''}">${esc(w.note)}</span>
      ${st?`<span class="mono lbl2">${esc(st.name)}</span>`:''}
      ${o.score!=null?`<span class="mono sc ring" style="--p:${Math.max(0,Math.min(100,o.score)).toFixed(0)}" title="Score ${o.score.toFixed(0)} von 100"><i>${o.score.toFixed(0)}</i></span>`:''}
    </div>
    <div class="hero-t">${esc(name(w.instrument))}
      <span class="akt">${
        x.stufe==='stop' ? 'STOP BERÜHRT'
        : laeuft ? `${x.lang?'LONG':'SHORT'} — läuft seit Einstieg`
        : jetzt ? `${seite} — JETZT`
        : `${seite} ab ${num(w.einstieg,d)}`}</span></div>
    ${x.kurs!=null?`<p class="hero-p">Kurs <strong>${num(x.kurs,d)}</strong>${
      x.live?' <span class="up mono" style="font-size:10px">LIVE</span>'
            :' <span class="mono" style="font-size:10px;color:var(--ink-3)">Kurs aus dem letzten Scan</span>'}${
      laeuft&&x.r!=null?` · Stand <strong class="${x.r>=0?'up':'dn'}">${x.r>=0?'+':''}${x.r.toFixed(2)} R</strong>`:''}${
      !jetzt&&!laeuft&&x.abstand!=null?` · noch <strong>${Math.abs(x.abstand).toFixed(2).replace('.',',')} %</strong> bis zum Einstieg`:''}</p>`:''}
    ${laeuft?`<p style="margin:6px 0 0;font-size:12.5px;color:var(--ink-2)">Diese Position
      läuft bereits — die Marken darunter sind der Vertrag aus dem Einstieg und bleiben
      fest. <strong>Das ist keine Aufforderung nachzukaufen.</strong> Ein frischer
      Einstiegsvorschlag zu demselben Wert kann andere Zahlen haben; er steht im Markt
      in der Zeile zu diesem Wert.</p>`:''}
    ${torGrund?`<p class="hero-tor"><b>Kein Handy-Alarm</b> — ${esc(torGrund)}</p>`:''}
    ${!x.lang && !laeuft ? `<p class="hero-short">${o.klasse==='aktien'
      ? `<b>So geht der Short:</b> bei Trade Republic nur über einen Short-Schein (Knock-out). Knock-out-Schwelle <b>über</b> dem Stop (${num(w.stop,d)}) wählen — der Hebel steckt im Schein, Einsatz entsprechend kleiner.`
      : `<b>So geht der Short:</b> nicht im Spotmarkt, nur über einen Terminkontrakt (Bybit Perpetual, 1×).`}</p>` : ''}
    ${st?`<p class="hero-these">${esc(st.these)}</p>`:''}
    <div class="zt" style="border-top:0;padding-top:0">
      <span>Einstieg <b>${num(w.einstieg,d)}</b></span>
      <span>Stop <b>${num(w.stop,d)}</b></span>
      ${ziele.map((v,i)=>`<span>Ziel ${i+1} <b>${num(v,d)}</b></span>`).join('')}
      ${(()=>{ const c = crvVon(o); return c!=null?`<span>CRV <b>1:${c.toFixed(1)}</b></span>`:''; })()}
      ${bewegungSpan(o)}
      ${pl?`<span>Risiko <b>${pl.risiko_pct.toFixed(1)} %</b></span>`:''}
      ${o.rs!=null?`<span>Rel. Stärke <b>${Math.round(o.rs)}</b></span>`:''}
    </div>
    ${st&&st.trigger?`<p class="hero-trig"><b>Auslöser</b> ${esc(st.trigger)}</p>`:''}
    ${(o.warnungen||[]).length?`<p class="warnz">${o.warnungen.slice(0,2).map(esc).join('<br>')}</p>`:''}
    <p style="margin:10px 0 0"><button class="link">Vollständige Analyse →</button></p>
  </div>`;
}

/* Diese Tabelle fehlte — und der Fehler war teuer.

   `REGIME_TEXT` wurde an zwei Stellen benutzt und nirgends definiert. Die Folge war
   nicht etwa ein fehlendes Wort, sondern eine ReferenceError mitten in `zeichneStatus()`
   — und damit starben in `ladeScan()` alle Aufrufe danach: Rangliste, Bilanz, Alarme.
   Die App zeigte "Scan wird geladen …" und blieb dabei stehen. Ein einziger fehlender
   Bezeichner hat die komplette Oberflaeche unbrauchbar gemacht.

   Deshalb steht die Zuordnung jetzt hier, und der Aufruf ist zusaetzlich abgesichert. */
const REGIME_TEXT = {
  risk_on:  'Risikofreude',
  neutral:  'gemischte Lage',
  risk_off: 'Risiko raus',
};

/* ==================================================== NEWS UND TERMINE

   „Ich weiss nicht, ob du Live-News eingebaut hast — dass man sehen kann: heute
   passiert das und das."

   Hier steht es. Nicht Schlagzeilen — die sind fuer einen Swing-Trade meistens Laerm
   und kommen sowieso zu spaet —, sondern der Wirtschaftskalender: die Termine, von
   denen man VORHER weiss, dass sie den Markt bewegen. Zinsentscheidungen,
   Arbeitsmarktdaten, Inflationszahlen.

   Der Nutzen ist nicht die Zahl selbst, sondern das Timing: eine Stunde vor einer
   Fed-Entscheidung eine neue Position aufzumachen ist kein Trade, sondern eine Wette
   auf einen Wuerfel. Deshalb steht zu jedem Termin dabei, was er bedeutet. */
/* Die kurze Fassung fuer den Alarme-Reiter: nur, wenn es wirklich gleich soweit ist. */
function terminWarnung(){
  const alle = (S && S.makro && S.makro.termine) || [];
  const jetzt = Date.now();
  const bald = alle
    .map(t => ({...t, ts: Date.parse(t.zeitpunkt)}))
    .filter(t => t.wirkung === 'High' && isFinite(t.ts) && t.ts > jetzt && t.ts - jetzt < 3*3600*1000)
    .sort((a,b) => a.ts - b.ts)[0];
  if (!bald) return '';
  const min = Math.round((bald.ts - jetzt) / 60000);
  return `<div class="note-box warn"><span class="nt">Gleich ist ein wichtiger Termin</span>
    <p><strong>${esc(bald.titel)}</strong> (${esc(bald.land)}) in ${min < 60 ? min + ' Minuten' : Math.round(min/60) + ' Stunden'}.
    Bis das durch ist, lieber nichts Neues aufmachen — solche Termine bewegen den ganzen
    Markt in Minuten. Alle Termine stehen im Reiter <strong>News</strong>.</p></div>`;
}

function terminKasten(){
  const alle = (S && S.makro && S.makro.termine) || [];
  if (!alle.length) return '';
  const jetzt = Date.now();
  const kommend = alle
    .map(t => ({...t, ts: Date.parse(t.zeitpunkt)}))
    .filter(t => isFinite(t.ts) && t.ts > jetzt - 2*3600*1000 && t.ts < jetzt + 72*3600*1000)
    .sort((a,b) => a.ts - b.ts);
  if (!kommend.length){
    /* Wichtige Unterscheidung, sonst steht hier eine Unwahrheit.
       Die Quelle (faireconomy) veroeffentlicht immer nur die LAUFENDE Woche und rollt
       sonntags auf die naechste. Am Samstagnachmittag liegt die ganze Datei also in der
       Vergangenheit — und "es steht nichts an" waere dann schlicht falsch: es ist bloss
       noch nichts veroeffentlicht. */
    const spaetester = alle.map(t => Date.parse(t.zeitpunkt)).filter(isFinite).sort((a,b)=>b-a)[0];
    const nichtsMehr = spaetester && spaetester < jetzt;
    const letzte = alle.map(t=>({...t, ts:Date.parse(t.zeitpunkt)}))
      .filter(t=>t.wirkung==='High' && isFinite(t.ts)).sort((a,b)=>b.ts-a.ts).slice(0,6);
    return `<h2>Termine, die den Markt bewegen</h2>
    <div class="note-box ${nichtsMehr?'warn':''}"><span class="nt">${
      nichtsMehr?'Kalender noch nicht fortgeschrieben':'Ruhige Tage'}</span>
    <p>${nichtsMehr
      ? 'Die Quelle veröffentlicht immer nur die <strong>laufende Woche</strong> und rollt '
        + 'sonntags weiter. Gerade steht deshalb kein künftiger Termin in der Datei — das '
        + 'heißt <strong>nicht</strong>, dass nächste Woche nichts ansteht, sondern nur, dass '
        + 'es noch nicht veröffentlicht ist. Spätestens Sonntag steht hier wieder die volle Woche.'
      : 'In den nächsten drei Tagen steht nichts Großes an. Ruhige Tage sind die, an denen '
        + 'ein Setup auch das machen darf, was es soll.'}</p></div>
    ${letzte.length?`<h2>Was diese Woche lief</h2>
      <p class="lead">Zur Einordnung — diese Termine liegen hinter uns und erklären
      oft, warum ein Chart aussieht, wie er aussieht.</p>
      <div class="tw"><table class="mtf">
        <tr><th>Wann</th><th>Land</th><th>Termin</th><th></th></tr>
        ${letzte.map(t=>`<tr style="opacity:.7">
          <td class="mono" style="white-space:nowrap">${esc(new Date(t.ts).toLocaleString('de-DE',{weekday:'short',hour:'2-digit',minute:'2-digit'}))}</td>
          <td>${esc(t.land||'')}</td><td class="tf">${esc(t.titel||'')}</td>
          <td class="mono" style="color:var(--ink-3);font-size:11px">${
            t.vorher!=null?'vorher '+esc(String(t.vorher)):''}</td></tr>`).join('')}
      </table></div>`:''}`;
  }

  const hoch = kommend.filter(t => t.wirkung === 'High');
  const naechster = hoch[0];
  const stunden = naechster ? (naechster.ts - jetzt) / 3600000 : null;

  const zeile = t => {
    const wann = new Date(t.ts);
    const heute = new Date().toDateString() === wann.toDateString();
    const tag = heute ? 'heute' : wann.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'});
    const uhr = wann.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const kl = t.wirkung === 'High' ? 'dn' : (t.wirkung === 'Medium' ? 'nu' : '');
    const vergangen = t.ts < jetzt;
    return `<tr style="${vergangen?'opacity:.45':''}">
      <td class="mono" style="white-space:nowrap">${esc(tag)} ${esc(uhr)}</td>
      <td>${esc(t.land||'')}</td>
      <td class="tf">${esc(t.titel||'')}</td>
      <td class="${kl}">${t.wirkung==='High'?'hoch':(t.wirkung==='Medium'?'mittel':'klein')}</td>
      <td class="mono" style="color:var(--ink-3);font-size:11px">${
        t.prognose!=null?`Prognose ${esc(String(t.prognose))}`:''}${
        t.vorher!=null?` · vorher ${esc(String(t.vorher))}`:''}</td>
    </tr>`;
  };

  let kopf = '';
  if (naechster && stunden != null){
    const dringend = stunden <= 2;
    kopf = `<div class="note-box ${dringend?'warn':''}" style="margin-bottom:12px">
      <span class="nt">Als Nächstes</span>
      <p style="font-size:14px;margin:0 0 4px"><strong>${esc(naechster.titel)}</strong>
        (${esc(naechster.land)}) — ${stunden < 1 ? `in ${Math.max(0,Math.round(stunden*60))} Minuten`
          : `in ${stunden.toFixed(0)} Stunden`}</p>
      <p style="margin:0">${dringend
        ? 'Bis das durch ist, keine neue Position aufmachen. Solche Termine bewegen den '
          + 'ganzen Markt in Minuten, und ein Stop, der vorher sinnvoll war, ist danach Zufall.'
        : 'Weit genug weg, um normal zu handeln — aber wenn du eine Position über den '
          + 'Termin hinweg hältst, weißt du jetzt, warum es ruckeln kann.'}</p></div>`;
  }

  return `<h2>Termine, die den Markt bewegen</h2>
  <p class="lead">Keine Schlagzeilen — der Wirtschaftskalender. Das sind die Ereignisse,
  von denen man <strong>vorher</strong> weiß, dass sie Kurse bewegen. ${kommend.length}
  Termine in den nächsten drei Tagen, davon ${hoch.length} mit hoher Wirkung.</p>
  ${kopf}
  <div class="tw"><table class="mtf">
    <tr><th>Wann</th><th>Land</th><th>Termin</th><th>Wirkung</th><th></th></tr>
    ${kommend.slice(0,40).map(zeile).join('')}
  </table></div>
  <p class="leer">Nachrichten gehen <strong>nicht</strong> in den Score ein. Sie ändern
  das Risiko, nicht die Richtung — und wer eine Zinsentscheidung handelt, handelt nicht
  den Chart, sondern eine Münze.</p>`;
}

/* ============================================ STIMMUNG UND BREITE (seit 27.09.)

   Masterplan §5 und §9: Funding, Open Interest, Stimmung, Marktbreite. Bis dahin stand
   davon nichts in der App. Hier stehen sie als KONTEXT — nicht im Score. Ob einer davon
   die Signale besser macht, entscheidet eine vorab registrierte Studie, nicht der Klang.

   Die Krypto-Breite rechnet die App selbst aus der Rangliste (wie die Aktien-Breite
   beim Welt-ETF): wie viele Coins stehen ueber ihrem Stand von vor einem Monat bzw.
   einem Quartal — und laufen die Altcoins besser oder schlechter als Bitcoin. */
function kryptoBreite(){
  const c = (S?.gesamt||[]).filter(o => o.klasse === 'krypto' && o.zusatz && o.zusatz.renditen);
  const m = c.filter(o => o.zusatz.renditen.r21 != null);
  const q = c.filter(o => o.zusatz.renditen.r63 != null);
  if (m.length < 10) return null;
  const btc = c.find(o => muenzeVon(o.instrument) === 'BTC');
  const alts = m.filter(o => o !== btc).map(o => o.zusatz.renditen.r21).sort((a,b)=>a-b);
  const median = alts.length ? alts[Math.floor(alts.length/2)] : null;
  const btc21 = btc ? btc.zusatz.renditen.r21 : null;
  return {
    n: m.length,
    monat: m.filter(o => o.zusatz.renditen.r21 > 0).length / m.length * 100,
    quartal: q.length ? q.filter(o => o.zusatz.renditen.r63 > 0).length / q.length * 100 : null,
    altMedian: median, btc21,
    altVorsprung: (median != null && btc21 != null) ? median - btc21 : null,
  };
}
function stimmungKasten(){
  const st = S && S.stimmung;
  const br = kryptoBreite();
  if (!st && !br) return '';
  const teile = [];
  const ag = st && st.angst_gier;
  if (ag){
    const kl = ag.wert >= 75 ? 'dn' : ag.wert <= 25 ? 'up' : '';
    teile.push(`<span>Angst &amp; Gier <b class="${kl}">${ag.wert.toFixed(0)}</b> ${esc(ag.text||'')}${
      ag.vorwoche!=null?` <span style="color:var(--ink-3)">(Vorwoche ${ag.vorwoche.toFixed(0)})</span>`:''}</span>`);
  }
  const dv = st && st.derivate;
  if (dv){
    teile.push(`<span>Finanzierung Bitcoin <b>${dv.btc_funding_jahr_pct!=null?pct(dv.btc_funding_jahr_pct,1):'—'}</b>/Jahr</span>`);
    teile.push(`<span>Median Coins <b>${pct(dv.median_funding_jahr_pct,1)}</b>/Jahr${
      dv.heiss?` · ${dv.heiss} mit sehr hoher Finanzierung`:''}${
      dv.kalt?` · ${dv.kalt} mit zahlenden Shorts`:''}</span>`);
  }
  if (br){
    teile.push(`<span>Coins im Plus (Monat) <b>${br.monat.toFixed(0)} %</b>${
      br.quartal!=null?` · Quartal <b>${br.quartal.toFixed(0)} %</b>`:''}</span>`);
    if (br.altVorsprung != null)
      teile.push(`<span>Altcoins gegen Bitcoin <b class="${br.altVorsprung>=0?'up':'dn'}">${
        br.altVorsprung>=0?'+':''}${br.altVorsprung.toFixed(1).replace('.',',')} Pkt.</b> (Monat)</span>`);
  }
  const lesart = [];
  if (ag && ag.wert >= 75) lesart.push('Gier ist verbreitet — gute Nachrichten sind oft schon im Kurs');
  if (ag && ag.wert <= 25) lesart.push('Angst ist verbreitet — schlechte Nachrichten sind oft schon im Kurs');
  if (br && br.monat < 30) lesart.push('die Mehrheit der Coins fällt — Long-Setups haben Gegenwind vom ganzen Markt');
  if (br && br.monat > 70) lesart.push('die Mehrheit der Coins steigt — der Markt trägt');
  return `<div class="note-box">
    <span class="nt">Krypto · Stimmung und Breite</span>
    <div class="kpi">${teile.join('')}</div>
    ${lesart.length?`<p style="margin-top:8px">${esc(lesart.join('; '))}.</p>`:''}
    <p style="margin-top:6px;color:var(--ink-3);font-size:12px">Kontext, kein Signal — geht nicht in
      den Score ein. Hohe Finanzierung war in den eigenen Daten (Studie 27.09.) kein verlässliches
      Warnzeichen. Finanzierung: Kraken Futures${st && st.stand ? ', ' + esc(zeit(st.stand)) : ''};
      Angst &amp; Gier: alternative.me.</p></div>`;
}
function sektorKasten(){
  const sk = (S && S.sektoren) || [];
  if (sk.length < 3) return '';
  const zeile = (e) => `<span>${esc(e.sektor)} <b class="${e.rs>=55?'up':e.rs<45?'dn':''}">${e.rs.toFixed(0)}</b>
    <span style="color:var(--ink-3)">${e.n} · ${e.fuehrer.slice(0,2).map(x=>esc(name(x))).join(', ')}</span></span>`;
  return `<div class="note-box">
    <span class="nt">Aktien · Welche Sektoren tragen</span>
    <div class="kpi">${sk.map(zeile).join('')}</div>
    <p style="margin-top:6px;color:var(--ink-3);font-size:12px">Mittlere relative Stärke der
      gescannten Aktien je Sektor (100 = die stärksten, 0 = die schwächsten). Ein Long in einem
      führenden Sektor hat Rückenwind, einer im Schlusslicht-Sektor Gegenwind — als Kontext,
      nicht im Score. Sektor laut Nasdaq.</p></div>`;
}
/* Hintergrund zu einem einzelnen Wert: bei Aktien Sektor, Analysten, Kursziel, Termin;
   bei Coins der Terminmarkt; bei allen der Halte-Stop fuer eine gehaltene Position. */
function hintergrundKasten(row, kurs){
  if (!row) return '';
  const zeilen = [];
  const d = digits(kurs || row.kurs || 1);
  const I = row.info || {};
  if (I.sektor) zeilen.push(`<span>Sektor <b>${esc(I.sektor)}</b>${I.sektor_rang?` <span style="color:var(--ink-3)">Rang ${I.sektor_rang} von ${I.sektor_von}</span>`:''}${I.branche?` · ${esc(I.branche)}`:''}</span>`);
  if (I.analysten){
    const a = I.analysten, n = a.kaufen + a.halten + a.verkaufen;
    if (n) zeilen.push(`<span>Analysten <b>${a.kaufen} kaufen · ${a.halten} halten · ${a.verkaufen} verkaufen</b></span>`);
  }
  if (I.kursziel != null && kurs){
    const auf = (I.kursziel / kurs - 1) * 100;
    zeilen.push(`<span>Kursziel <b>${num(I.kursziel,d)} $</b> <span class="${auf>=0?'up':'dn'}">${pct(auf,0)}</span>${
      I.kursziel_3m_pct!=null?` <span style="color:var(--ink-3)">· in 3 Monaten ${pct(I.kursziel_3m_pct,0)} angepasst</span>`:''}</span>`);
  }
  if (I.hoch52 != null && I.tief52 != null && kurs && I.hoch52 > I.tief52){
    const lage = (kurs - I.tief52) / (I.hoch52 - I.tief52) * 100;
    zeilen.push(`<span>52 Wochen <b>${num(I.tief52,d)} – ${num(I.hoch52,d)} $</b> <span style="color:var(--ink-3)">Kurs bei ${Math.max(0,Math.min(100,lage)).toFixed(0)} % der Spanne</span></span>`);
  }
  if (I.zahlen){
    const z = I.zahlen, nah = z.tage != null && z.tage <= 14;
    zeilen.push(`<span>Quartalszahlen <b class="${nah?'dn':''}">${esc(new Date(z.datum+'T12:00:00Z').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}))}</b>${
      z.zeit?` ${esc(z.zeit)}`:''}${z.tage!=null?` <span style="color:var(--ink-3)">in ${z.tage} Tagen</span>`:''}</span>`);
  }
  const dv = row.zusatz && row.zusatz.derivate;
  if (dv){
    zeilen.push(`<span>Finanzierung <b class="${dv.funding_jahr_pct>=50?'dn':dv.funding_jahr_pct<=-30?'up':''}">${pct(dv.funding_jahr_pct,1)}</b>/Jahr <span style="color:var(--ink-3)">${dv.funding_jahr_pct>=0?'Longs zahlen':'Shorts zahlen'}</span></span>`);
    if (dv.oi_usd) zeilen.push(`<span>Offene Positionen <b>${num(dv.oi_usd/1e6, dv.oi_usd>=1e8?0:1)} Mio. $</b>${
      dv.oi_zu_umsatz!=null?` <span style="color:var(--ink-3)">${dv.oi_zu_umsatz.toFixed(2).replace('.',',')}× Tagesumsatz</span>`:''}</span>`);
  }
  const h = row.halte;
  if (h && h.stop_long != null && kurs){
    const ab = (kurs - h.stop_long) / kurs * 100;
    zeilen.push(`<span>Halte-Stop (long) <b>${num(h.stop_long,d)}</b> <span style="color:var(--ink-3)">${ab.toFixed(1).replace('.',',')} % unter dem Kurs · Tagesschwankung ${String(h.atr_pct).replace('.',',')} %</span></span>`);
  }
  if (!zeilen.length) return '';
  return `<h2>Hintergrund</h2><div class="karte"><div class="kpi" style="margin-top:0;flex-direction:column;align-items:flex-start;gap:6px">${zeilen.join('')}</div>
    <p style="margin:8px 0 0;font-size:12px;color:var(--ink-3)">Kontext zum Wert — nicht im Score.
    Termine von Zacks über Nasdaq, teils geschätzt, bis das Unternehmen sie bestätigt.
    Der Halte-Stop ist die Marke, die die App für eine GEHALTENE Position setzt.</p></div>`;
}

/* ============================ NOTENBANKEN

   Ozan: „Es soll mir auch sagen, was in den Meetings passiert ist und was es für
   Auswirkungen auf unseren Markt, Portfolio und Taktik hat." Die Beschlusstexte kommen von
   Fed, EZB und Bank of England (scripts/fetch_notenbanken.py). Die Einordnung ist die
   uebliche Lehrbuch-Richtung (straff = Gegenwind fuer Risikoanlagen) — ein Hinweis, kein
   Signal: gemessen ist diese Wirkung in unseren Daten noch nicht. */
const NB_KLASSE = {krypto:'Krypto', aktien:'Aktien', gold:'Gold'};
function notenbankKasten(){
  if (!NB || !NB.fed) return '';
  const fed = NB.fed, ent = fed.entscheide || [];
  const ton = fed.ton || 'neutral';
  const kl = ton === 'straff' ? 'warn' : ton === 'locker' ? 'gut' : '';
  const tonText = {straff:'straff', locker:'locker', neutral:'neutral'}[ton];
  const dat = z => new Date(z).toLocaleDateString('de-DE', {day:'numeric', month:'long', year:'numeric'});
  const dkurz = z => new Date(z).toLocaleDateString('de-DE', {day:'numeric', month:'short'});
  const alt = ent[0] ? Math.round((Date.now() - Date.parse(ent[0].zeit)) / 86400000) : null;
  const pfad = ent.slice().reverse().map(e => {
    const w = e.aktion === 'anheben' ? '▲' : e.aktion === 'senken' ? '▼' : '■';
    const sp = e.spanne ? String(e.spanne).replace(' to ', '–').replace(/-/g, ' ') : '';
    return `${w} ${dkurz(e.zeit)} ${esc(sp)}`;
  }).join(' → ');
  const bank = (n, arr) => (arr || []).slice(0, 2).map(m =>
    `<li><span class="mono">${esc(n)} ${dkurz(m.zeit)}</span> <a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.titel.slice(0, 110))}</a></li>`).join('');
  const kommend = ((S && S.makro && S.makro.termine) || [])
    .filter(t => /FOMC|ECB|BOE|BoE|Fed |Powell|Lagarde|Bailey|Rate Decision|Minutes|Press Conference/i.test(t.titel)
                 && Date.parse(t.zeitpunkt) > Date.now() - 3600000 && Date.parse(t.zeitpunkt) < Date.now() + 10*86400000)
    .slice(0, 5);
  // Depot: wie viel Gewicht liegt in den Klassen, die der Ton trifft?
  let depot = '';
  try {
    const st = depotStand();
    if (st && st.bew.length && st.gesamt > 0){
      const je = {}; let heb = 0, hebN = 0;
      for (const b of st.bew){
        const k = (b.row && b.row.klasse) || 'aktien';
        const eu = st.inEuro(b, b.wert) || 0;
        je[k] = (je[k] || 0) + eu;
        if (b.pos.ko != null || Number(b.pos.hebel) > 1){ heb += eu; hebN++; }
      }
      const w = (NB.einordnung && NB.einordnung.wirkung) || {};
      const zeilen = Object.entries(je).filter(([k, v]) => NB_KLASSE[k] && v / st.gesamt >= 0.05)
        .sort((a, b2) => b2[1] - a[1])
        .map(([k, v]) => `<li><b>${NB_KLASSE[k]} · ${(v / st.gesamt * 100).toFixed(0)} % deines Depots</b> — ${esc(w[k] || '')}</li>`).join('');
      depot = `<p style="margin-top:8px"><strong>Dein Depot</strong></p><ul class="nb-l">${zeilen}
        ${hebN ? `<li><b>${hebN} gehebelte Position${hebN > 1 ? 'en' : ''} · ${(heb / st.gesamt * 100).toFixed(0)} %</b> — ${ton === 'straff' ? 'Zinsüberraschungen bewegen schnell: Knock-out-Puffer prüfen.' : 'Puffer wie gewohnt im Blick behalten.'}</li>` : ''}</ul>`;
    }
  } catch(e){ console.error('NB depot', e && e.message); depot = ''; }
  const taktik = ((NB.einordnung && NB.einordnung.taktik) || []).map(t => `<li>${esc(t)}</li>`).join('');
  return `<div class="note-box ${kl}">
    <span class="nt">Notenbanken · Fed ${esc(tonText)}${alt != null ? ` · letzter Beschluss vor ${alt} Tagen` : ''}</span>
    ${ent[0] ? `<p><strong>${dat(ent[0].zeit)}:</strong> ${esc(ent[0].satz)}
      ${ent[0].inflation_hoch ? 'Inflation weiter erhöht.' : ''} ${ent[0].unsicherheit ? 'Unsicherheit bleibt hoch.' : ''}</p>` : ''}
    ${pfad ? `<p class="mono" style="font-size:12.5px">Zinspfad: ${pfad}</p>` : ''}
    <ul class="nb-l">${bank('EZB', (NB.ezb||{}).mitteilungen)}${bank('BoE', (NB.boe||{}).mitteilungen)}</ul>
    ${kommend.length ? `<p style="margin-top:8px"><strong>Als Nächstes:</strong> ${kommend.map(t =>
      `${esc(t.titel)} (${esc(t.land)}, ${zeit(t.zeitpunkt)})`).join(' · ')}</p>` : ''}
    <p style="margin-top:8px"><strong>Für die Märkte</strong></p>
    <ul class="nb-l">${Object.entries(NB_KLASSE).map(([k, n]) => `<li><b>${n}</b> — ${esc(((NB.einordnung||{}).wirkung||{})[k] || '')}</li>`).join('')}</ul>
    ${depot}
    ${taktik ? `<p style="margin-top:8px"><strong>Taktik</strong></p><ul class="nb-l">${taktik}</ul>` : ''}
    <p style="margin-top:8px">Gemessen (14 Fed-Sitzungen seit 2025): an Beschlusstagen war die 24-h-Spanne bei
      Bitcoin im Schnitt <strong>4,2 % statt 3,3 %</strong>, bei Ethereum 6,5 % statt 5,2 % — die Märkte
      <em>schwanken</em> an solchen Tagen stärker.</p>
    <p style="margin-top:8px;color:var(--ink-3)">Die <em>Richtung</em> (straff = Gegenwind) ist die übliche Lehrbuch-Einordnung —
      <strong>Hinweis, kein Signal</strong>; für 14 Ereignisse nicht belegbar.</p>
  </div>`;
}

   den buy und sell alarms ... deine und seine will ich sehen." Deshalb steht ChatGPTs
   Meinung jetzt nicht nur gesammelt in EINER Karte, sondern zusaetzlich direkt auf der
   einzelnen Kauf-/Verkaufs-Karte, neben dem eigenen Urteil der App — ``je_position`` und
   ``je_chance`` sind nach demselben Schluessel (sym/instrument) sortiert, den die Karten
   selbst benutzen. Ohne passenden Eintrag (Key fehlt, Antwort war kein gueltiges JSON,
   kein Secret eingerichtet) erscheint schlicht nichts — nie ein erfundener Satz. */
function chatgptMeinungFuer(schluessel){
  if (!ZM || !ZM.aktiv || !schluessel) return '';
  return (ZM.je_position && ZM.je_position[schluessel])
      || (ZM.je_chance && ZM.je_chance[schluessel]) || '';
}
/* Ozan, 11.10. 17:18: "du hast deine eigene These und er seine eigene These, ihr
   solltet aber zusammenarbeiten ... richtig reingehen in die Materie." Zwei Texte
   nebeneinander lesen sich wie zwei Monologe — man muss erst ChatGPTs ganzen Satz
   lesen, um zu merken, ob er ueberhaupt zustimmt. Das Abzeichen (aus urteil_position/
   urteil_chance, von chatgpt_zweitmeinung.py geschrieben) macht das auf einen Blick
   sichtbar, BEVOR der Text kommt — und nur dann, wenn ChatGPT tatsaechlich eines der
   drei erlaubten Woerter geliefert hat (kein erfundenes Abzeichen zu einem alten
   Freitext ohne Urteil). */
function chatgptUrteilFuer(schluessel){
  if (!ZM || !ZM.aktiv || !schluessel) return '';
  const u = (ZM.urteil_position && ZM.urteil_position[schluessel])
         || (ZM.urteil_chance && ZM.urteil_chance[schluessel]) || '';
  return ['stimmt_zu','teilweise','widerspricht'].includes(u) ? u : '';
}
const CHATGPT_URTEIL_ANZEIGE = {
  stimmt_zu:   {wort: 'stimmt zu',     kl: 'gut'},
  teilweise:   {wort: 'teilweise',     kl: 'warn'},
  widerspricht:{wort: 'widerspricht',  kl: 'bad'},
};
function chatgptZeile(schluessel){
  const text = chatgptMeinungFuer(schluessel);
  if (!text) return '';
  const urteil = chatgptUrteilFuer(schluessel);
  const abzeichen = urteil ? (() => {
    const a = CHATGPT_URTEIL_ANZEIGE[urteil];
    return ` <span class="note ${a.kl}" style="margin-left:4px">${esc(a.wort)}</span>`;
  })() : '';
  return `<p style="margin:6px 0 0;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:6px">
    <span style="color:var(--accent)">🤖 ChatGPT${abzeichen}:</span> ${esc(text)}</p>`;
}
function zweitmeinungKasten(){
  if (!ZM) return '';
  if (!ZM.aktiv){
    if (ZM.grund === 'kein OPENAI_API_KEY') return `<div class="note-box"><span class="nt">Zweitmeinung (ChatGPT)</span>
      <p style="margin-top:6px;font-size:13px">Noch nicht eingerichtet — braucht einen OpenAI-API-Key als Geheimnis
      <span class="mono">OPENAI_API_KEY</span> unter Settings → Secrets → Actions. Ohne Key bleibt dieses Feld leer,
      es wird nichts erfunden.</p></div>`;

      <span class="nt">Zweitmeinung (ChatGPT) · zuletzt fehlgeschlagen</span>
      <p style="margin-top:6px;font-size:13px">Grund: <span class="mono">${esc(ZM.grund)}</span>. Kein erfundener

    <p style="margin-top:6px;font-size:13.5px;white-space:pre-wrap">${esc(ZM.text || '')}</p>
    <p style="margin-top:8px;color:var(--ink-3);font-size:12px">Ein zweites Sprachmodell, keine zweite Datenbasis —
      liest denselben Stand wie diese App und kommentiert ihn. Kein Signal, keine Kaufempfehlung.</p>

}

      Risiko, kein Signal</strong>. Sie geht nicht in den Score ein — sie steht als

function zeichneFilter(){
  /* „Oder du machst eine extra Spalte, wo jetzt einsteigen kommt." — genau das ist
     dieser erste Schalter. Er zeigt exakt die Werte, die drüben unter Alarme in
     „Jetzt einsteigen" stehen, und nichts sonst. Mit Zahl dran, damit man von hier aus
     sieht, ob es überhaupt etwas zu tun gibt. */
  const nJetzt = amEinstiegListe().filter(alarmReif).length;
  const f = [
    ['jetzt', `Jetzt einsteigen${nJetzt ? ' · ' + nJetzt : ''}`],
    ['handelbar','Handelbar'], ['alle','Alles'], ['krypto','Krypto'],
    ['aktien','Aktien'], ['gold','Gold'], ['long','Long'], ['short','Short'],
  ];
  $('filter').innerHTML = f.map(([k,t])=>
    `<button class="fb" data-f="${k}" aria-pressed="${FILTER===k}">${t}</button>`).join('');
  $('filter').querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
    FILTER = b.dataset.f; zeichneFilter(); zeichneRadar();
  }));
}

function gefiltert(){
  const g = (S?.gesamt || []).slice();
  switch (FILTER){
    case 'jetzt': {
      // Dieselbe Liste wie unter Alarme — nicht „auch am Einstieg", sondern kaufbar.
      const drin = new Set(amEinstiegListe()
        .filter(alarmReif)
        .map(x => x.w.instrument));
      return g.filter(o => drin.has(o.instrument));
    }
    case 'handelbar': return g.filter(o=>o.handelbar);
    case 'krypto': case 'aktien': case 'gold': return g.filter(o=>o.klasse===FILTER);
    case 'long': return g.filter(o=>o.richtung==='long');
    case 'short': return g.filter(o=>o.richtung==='short');
    default: return g;
  }
}

/* ============================ QUALITAET IST NICHT ZEITPUNKT

   Ozan fragt das zum dritten Mal, und das ist kein Missverstaendnis auf seiner Seite,
   sondern ein Fehler in der Darstellung: „Soll ich beim Markt das Beste kaufen oder nur
   bei den Alarmen, wenn da jetzt einsteigen steht?"

   Die Liste beantwortet bisher nur die halbe Frage. Note und Score sagen, wie gut das
   Setup IST — nicht, ob der Kurs schon dort steht, wo man einsteigen wollte. Ein A− kann
   noch acht Prozent von seinem Einstieg entfernt sein. Wer es danach kauft, kauft etwas
   anderes als das, was bewertet wurde.

   Also steht der Zeitpunkt ab jetzt in derselben Zeile wie die Note. Drei Zustaende,
   mehr gibt es nicht:

     JETZT       — der Kurs ist in der Einstiegszone. Das ist der Moment.
     noch X %    — gutes Setup, aber der Kurs muss erst dorthin. Limit-Order legen.
     kein Einstieg — es gibt keine Marke, also gibt es nichts zu kaufen.


   ================= 16.09.: WARUM MARKT UND ALARME VERSCHIEDENES SAGTEN

   Ozan: „Beim Markt steht jetzt, was man einsteigen soll. Aber wenn ich dann auf Alarme
   klicke, ist dieses Jetzt nicht mehr da."

   Er hat recht, und es waren ZWEI Rechnungen fuer dieselbe Frage:

   * Der Markt-Reiter nahm den Livekurs und fiel, wenn es keinen gibt, auf den Kurs aus
     dem Scan zurueck.
   * Der Alarme-Reiter (``lage``) verlangte einen LIVEKURS. Ohne ihn blieb der Zustand
     auf „beobachten" stehen.

   Einen Livestream gibt es nur fuer Krypto und Gold — fuer Aktien gibt es keinen frei
   zugaenglichen Feed, den ein Browser abfragen darf. Damit konnte **keine einzige Aktie
   jemals unter „Jetzt einsteigen" stehen**, egal wie gut das Setup war. Auf dem Markt
   leuchtete sie gruen, unter Alarme war sie nicht da. Fuer jemanden, der gerade die
   Aktienseite ausgebaut haben wollte, ist das nicht nur inkonsistent, sondern der halbe
   Nutzen weg.

   Ab hier gibt es genau EINE Rechnung. ``einstiegErreicht`` entscheidet, ``kursStand``
   liefert den Kurs, und beide Reiter lesen dasselbe Ergebnis aus ``rangLagen()``. Zwei
   Antworten auf dieselbe Frage sind strukturell nicht mehr moeglich.

   Dafuer wird ueberall dazugesagt, WOHER der Kurs kommt: „live" oder „Kurs aus dem
   letzten Scan". Ein JETZT auf Scanbasis ist eine schwaechere Aussage als eines auf
   Livebasis — das darf man nicht verschweigen, aber es ist allemal besser, als die
   Aktie gar nicht erst anzuzeigen.  */

// Die Einstiegszone ist keine Linie, sondern ein schmales Band: auf den Cent genau
// trifft ein Kurs eine Marke nie. 0,4 % ist eng genug, dass man noch das kauft, was
// bewertet wurde. Diese Zahl steht EINMAL hier und wird nirgends wiederholt.
const EINSTIEG_TOLERANZ_PCT = 0.4;

/* Der beste verfuegbare Kurs — und die ehrliche Auskunft, woher er kommt.
   Krypto und Gold laufen live ueber Kraken; alles andere kommt aus dem letzten Scan. */
function kursStand(instrument, ausScan){
  const live = L.get(instrument);
  if (live && live.p != null && isFinite(live.p)) return {kurs: live.p, live: true};
  if (ausScan != null && isFinite(ausScan)) return {kurs: ausScan, live: false};
  return {kurs: null, live: false};
}

function einstiegErreicht(lang, einstieg, kurs){
  if (kurs == null || einstieg == null || !isFinite(kurs) || !isFinite(einstieg)) return false;
  const t = EINSTIEG_TOLERANZ_PCT / 100;
  return lang ? kurs <= einstieg * (1 + t) : kurs >= einstieg * (1 - t);
}

/* Ein Wert taucht unter Alarme nur auf, wenn er handelbar ist UND eine Einstiegsmarke
   und eine Invalidierung hat. Genau dieselbe Bedingung entscheidet im Markt darueber,
   ob das Zustandsfeld gezeigt wird — sonst stuende dort ein JETZT fuer einen Wert, den
   die Alarmseite gar nicht kennt. */
function handelsreif(o){
  return !!(o && o.handelbar && o.einstieg != null && o.invalidierung != null);
}

/* Die EINE Liste. Beide Reiter, die Startkarte und der Zaehler lesen hier.
   Zwischengespeichert, weil ``oppZeile`` sie fuer jede der 200+ Zeilen braucht. */
let _rangKarte = null, _rangZeit = 0, _rangStand = '';
function rangLagen(){
  /* Der Zwischenspeicher haengt NICHT nur an der Zeit, sondern am Datenstand.

     Beim ersten Test live stand unter Alarme „Der letzte Scan hat kein handelbares Setup
     gefunden" — bei 16 handelbaren Werten. Grund: beim Seitenaufbau zeichnet die App
     einmal, bevor der Scan geladen ist. Damals war das Ergebnis leer, das war richtig;
     nur wurde es in den Zwischenspeicher gelegt und beim Neuzeichnen direkt nach dem
     Laden wiederverwendet. Ein Zwischenspeicher, der eine Antwort von VOR den Daten
     ueberlebt, ist keine Beschleunigung, sondern ein Fehler mit Gedaechtnis. */
  const stand = (S ? String(S.erzeugt) : 'ohne') + '|' +
                ((WL && WL.wachen) ? WL.wachen.length : -1) + '|' + L.size;
  const t = Date.now();
  if (!_rangKarte || _rangStand !== stand || t - _rangZeit > 800){
    try { _rangKarte = new Map(ausRanking().map(x => [x.w.instrument, x])); }
    catch(e){ _rangKarte = new Map(); }
    _rangZeit = t; _rangStand = stand;
  }
  return _rangKarte;
}

/* Die eine Liste der einsteigbaren Werte — mit der Altersregel drin.

   Beim Test fiel auf, dass die Regel bisher nur an EINER Stelle hing: ``zeichneAlarme``
   leerte die Liste bei einer toten Analyse, der Markt-Reiter nicht. Ergebnis waere
   wieder genau Ozans Bild gewesen: im Markt leuchtet JETZT, unter Alarme steht „gerade
   kein Einstieg erreicht". Also gehoert die Regel dorthin, wo beide sie lesen. */
function amEinstiegListe(){
  if (scanTot()) return [];
  return [...rangLagen().values()].filter(x => x.stufe === 'jetzt');
}

function einstiegsLage(o, kurs){
  if (!o || o.einstieg == null) return {stufe:'keiner', text:'kein Einstieg'};
  // Aus einer toten Analyse kommt kein JETZT — auf keiner Seite. Die Marken sind Stunden
  // alt; ein gruenes Feld daneben waere eine Kaufaufforderung auf Basis von gestern.
  if (scanTot()) return {stufe:'veraltet', text:'Analyse zu alt'};
  // Zuerst der gemeinsame Stand — damit hier nie etwas anderes herauskommt als unter Alarme.
  const x = handelsreif(o) ? rangLagen().get(o.instrument) : null;
  if (x){
    if (x.stufe === 'im_trade') return {stufe:'im_trade', abstand:x.abstand, live:x.live, text:'im Trade'};
    if (x.stufe === 'stop')     return {stufe:'stop', abstand:x.abstand, live:x.live, text:'Stop'};
    if (x.stufe === 'jetzt')    return {stufe:'jetzt', abstand:x.abstand, live:x.live, text:'JETZT'};
    if (x.abstand != null)
      return {stufe:'warten', abstand:x.abstand, live:x.live,
              text:`noch ${Math.abs(x.abstand).toFixed(1).replace('.',',')} %`};
  }
  /* Handelsreif, aber nicht in der Rangliste: dann liegt zu diesem Wert ein BEENDETES
     Signal auf der Wachliste (Ziel erreicht, ausgestoppt, ungueltig geworden). Unter
     Alarme steht es dann im Verlauf. Wuerde hier weitergerechnet, stuende im Markt ein
     frisches JETZT an einem Wert, den die Handlungsseite als erledigt fuehrt — wieder
     zwei Antworten. Also sagt die Zeile, was gilt: das Signal ist durch. */
  if (handelsreif(o)) return {stufe:'beendet', text:'Signal beendet'};
  if (kurs == null || !isFinite(kurs)) return {stufe:'keiner', text:'kein Einstieg'};
  const lang = o.richtung !== 'short';
  const abstand = (kurs - o.einstieg) / o.einstieg * 100;
  if (einstiegErreicht(lang, o.einstieg, kurs)) return {stufe:'jetzt', abstand, text:'JETZT'};
  return {stufe:'warten', abstand,
          text:`noch ${Math.abs(abstand).toFixed(1).replace('.',',')} %`};
}

function oppZeile(o, rang){
  const nk = NOTE_KLASSE[o.note] || '';
  const live = L.get(o.instrument);
  const kurs = live ? live.p : o.kurs;
  const d = digits(kurs);
  const st = o.setup || null;
  const pl = o.plan || null;
  /* Laeuft zu diesem Wert schon ein Trade, gelten SEINE Marken — die aus dem Einstieg,
     nicht die aus dem letzten Scan. Vorher zeigte die Zeile den frischen Vorschlag,
     waehrend die Startkarte oben den laufenden Vertrag zeigte: zwei Einstiegspreise
     fuer denselben Wert auf einem Bildschirm. Ab hier zeigt die Zeile, was gilt. */
  const rl = handelsreif(o) ? rangLagen().get(o.instrument) : null;
  const imTrade = !!(rl && (rl.stufe === 'im_trade' || rl.stufe === 'stop'));
  const M = imTrade
    ? {einstieg: rl.w.einstieg, stop: rl.w.stop, tp1: rl.w.tp1, tp2: rl.w.tp2, tp3: rl.w.tp3}
    : {einstieg: o.einstieg, stop: pl?pl.stop:o.invalidierung,
       tp1: pl?pl.tp1:o.ziel, tp2: pl?pl.tp2:o.tp2, tp3: pl?pl.tp3:o.tp3};
  // Die Zeile fuehrt mit dem NAMEN des Setups, nicht mit dem Score. Wer die Liste
  // ueberfliegt, soll sehen, WAS da ist ("Ruecksetzer im Trend"), und erst danach,
  // wie gut es bewertet ist. Score allein sagt einem Trader nichts.
  const kopf = st ? esc(st.name) : (o.urteil === 'WATCH' ? 'Beobachten' : 'kein benanntes Setup');
  return `<div class="opp n-${o.urteil}" data-sym="${esc(o.instrument)}">
    <div class="opp-h">
      <span class="rk">#${rang}</span>
      <span class="nm">${esc(name(o.instrument))}</span>
      <span class="kl">${esc(o.klasse||'')}</span>
      ${o.richtung?`<span class="dir ${o.richtung}">${o.richtung==='long'?'LONG':'SHORT'}</span>`:''}
      <span class="note ${nk}">${esc(o.note)}</span>
      ${(()=>{ if (!handelsreif(o)) return '';
        const e = einstiegsLage(o, kurs);
        /* Ozan: „wenn ich beim Markt gehe, steht da manchmal JETZT EINSTEIGEN, dann steht
           es aber nicht bei den Alarmen. Soll das so sein?"

           Nein. Ein grünes JETZT hiess bisher nur „der Kurs ist an der Marke" — unter
           Alarme landet der Wert aber erst ab Note A− auf der Kaufliste. Beides richtig,
           zusammen ein Widerspruch auf zwei Bildschirmen.

           Ab hier bedeutet das grüne Feld GENAU EINE Sache: dieser Wert steht drüben
           unter „Jetzt einsteigen". Ist der Kurs zwar da, das Setup aber schwächer als
           A−, steht dort blass „am Einstieg · B" — sichtbar, aber nicht als Kaufsignal
           verkleidet. */
        const schwach = e.stufe === 'jetzt' && !alarmReif(o);
        const farbe = (e.stufe === 'jetzt' && !schwach) ? 'background:var(--long);color:#03130F'
                    : schwach ? 'background:var(--warn-bg);color:var(--ink-2);opacity:.85'
                    : e.stufe === 'im_trade' ? 'background:var(--accent);color:#03130F'
                    : e.stufe === 'stop' ? 'background:var(--bad);color:#fff'
                    : e.stufe === 'veraltet' ? 'background:var(--bad);color:#fff'
                    : e.stufe === 'warten' ? 'background:var(--warn-bg);color:var(--warn)'
                    : 'background:transparent;color:var(--ink-3)';
        if (schwach) return `<span class="note" style="${farbe}"
          title="Kurs ist an der Einstiegsmarke, aber kein Alarm: ${esc(alarmGrund(o))}"
          >am Einstieg · kein Alarm</span>`;
        // Woher der Kurs kommt, gehoert an dieselbe Stelle wie der Zustand. Ein JETZT
        // auf Basis eines Scankurses ist eine schwaechere Aussage als eines auf Basis
        // eines Livekurses — wer das nicht sieht, haelt beides fuer dasselbe.
        const quelle = (e.stufe === 'jetzt' && e.live === false)
          ? ` <span class="note" style="background:transparent;color:var(--ink-3)">Kurs vom Scan</span>` : '';
        /* Wartet das Setup noch auf seinen Kurs, sieht man vorher, ob es dann klingelt.
           Vorher stand Arista als „#1 · A+ · noch 3 %" ganz oben — und wäre nie aufs
           Handy gekommen (Aktien Long gesperrt). Wer auf einen Alarm wartet, der nie
           kommt, verpasst den Einstieg oder kauft ohne Signal. */
        const tor = e.stufe === 'warten'
          ? (alarmReif(o)
              ? ` <span class="note tor-ja" title="Kommt der Kurs, geht der Alarm aufs Handy">mit Alarm</span>`
              : ` <span class="note tor-nein" title="${esc(alarmGrund(o))}">ohne Alarm</span>`)
          : '';
        return `<span class="note" style="${farbe}">${esc(e.text)}</span>${quelle}${tor}`; })()}
      <span class="sc">${(o.score||0).toFixed(0)}</span>
    </div>
    <div class="opp-b">
      <div style="font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:13.5px;
                  color:var(--ink);margin-bottom:3px">${kopf}${
        st?` <span style="font-weight:400;font-size:11px;color:var(--ink-3)">${esc(st.qualitaet)}</span>`:''}</div>
      <div class="kpi">
        <span data-px="${esc(o.instrument)}">Kurs <b>${preis(o,'kurs',kurs,d)}</b>${
          live?` <span class="${live.pct>=0?'up':'dn'}">${pct(live.pct,2)}</span>`:''}</span>
        ${(()=>{ const c = crvVon(o); return c!=null?`<span>CRV <b>1:${c.toFixed(1)}</b></span>`:''; })()}
        ${bewegungSpan(o)}
        ${pl?`<span>Risiko <b>${pl.risiko_pct.toFixed(1)} %</b></span>`:''}
        ${o.rs!=null?`<span>Rel. Stärke <b class="${o.rs>=70?'up':o.rs<=30?'dn':''}">${Math.round(o.rs)}</b></span>`:''}
        ${o.confidence?`<span>Klarheit <b>${Math.round(o.confidence*100)} %</b></span>`:''}
      </div>
      ${imTrade?`<div class="muz" style="margin-top:6px;color:var(--accent)">Zu diesem Wert
        läuft bereits ein Trade — die Marken unten sind die aus dem Einstieg und bleiben
        fest, bis er beendet ist.</div>`:''}
      <div class="kpi">
        ${M.einstieg!=null?`<span>Einstieg <b>${preis(o,'einstieg',M.einstieg,d)}</b></span>`:''}
        ${M.stop!=null?`<span>Stop <b>${preis(o,'stop',M.stop,d)}</b></span>`:''}
        ${M.tp1!=null?`<span>Ziel 1 <b>${preis(o,'tp1',M.tp1,d)}</b></span>`:''}
        ${M.tp2!=null?`<span>Ziel 2 <b>${preis(o,'tp2',M.tp2,d)}</b></span>`:''}
        ${M.tp3!=null?`<span>Ziel 3 <b>${preis(o,'tp3',M.tp3,d)}</b></span>`:''}
      </div>
      ${(()=>{ const gg = glGegenDepot(o.instrument);
        return gg && gg.r >= 0.7 ? `<div class="muz" style="margin-top:7px;color:var(--warn)">Schon im
          Depot: im Kern dieselbe Wette wie <strong>${esc(gg.name)}</strong>.</div>` : ''; })()}
      <details class="opp-mehr"><summary>${(()=>{
        const n = (o.warnungen||[]).length;

      ${o.erwartung&&o.erwartung.quote?`<div class="muz" style="margin-top:5px">

        <span style="color:var(--ink-3)">(${o.erwartung.quote.n} Fälle, Vergangenheit)</span></div>`:''}
      ${(()=>{ /* Die Frage, die man sich vor dem Kauf stellen sollte und nie stellt:
           ist das überhaupt eine neue Wette? Wer zu SOL noch INJ kauft, hat nicht
           breiter gestreut, sondern dieselbe Position vergrössert — nur mit einem
           zweiten Namen und zweimal Gebühren. Gemessen, nicht vermutet. */
        const gg = glGegenDepot(o.instrument);
