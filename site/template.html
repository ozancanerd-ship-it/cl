/* ============================ QUALITAET IST NICHT ZEITPUNKT

   Ozan fragt das zum dritten Mal, und das ist kein Missverstaendnis auf seiner Seite,
   sondern ein Fehler in der Darstellung: „Soll ich beim Markt das Beste kaufen oder nur
   bei den Alarmen, wenn da jetzt einsteigen steht?"

   Die Liste beantwortet bisher nur die halbe Frage. Note und Score sagen, wie gut das
   Setup IST — nicht, ob der Kurs schon dort steht, wo man einsteigen wollte. Ein A− kann
   noch acht Prozent von seinem Einstieg entfernt sein. Wer es danach kauft, kauft etwas
   anderes als das, was bewertet wurde.

   Also steht der Zeitpunkt ab jetzt in derselben Zeile wie die Note. Drei Zustaende,
   mehr gibt es nicht:

     JETZT       — der Kurs ist in der Einstiegszone. Das ist der Moment.
     noch X %    — gutes Setup, aber der Kurs muss erst dorthin. Limit-Order legen.
     kein Einstieg — es gibt keine Marke, also gibt es nichts zu kaufen.


   ================= 16.09.: WARUM MARKT UND ALARME VERSCHIEDENES SAGTEN

   Ozan: „Beim Markt steht jetzt, was man einsteigen soll. Aber wenn ich dann auf Alarme
   klicke, ist dieses Jetzt nicht mehr da."

   Er hat recht, und es waren ZWEI Rechnungen fuer dieselbe Frage:

   * Der Markt-Reiter nahm den Livekurs und fiel, wenn es keinen gibt, auf den Kurs aus
     dem Scan zurueck.
   * Der Alarme-Reiter (``lage``) verlangte einen LIVEKURS. Ohne ihn blieb der Zustand
     auf „beobachten" stehen.

   Einen Livestream gibt es nur fuer Krypto und Gold — fuer Aktien gibt es keinen frei
   zugaenglichen Feed, den ein Browser abfragen darf. Damit konnte **keine einzige Aktie
   jemals unter „Jetzt einsteigen" stehen**, egal wie gut das Setup war. Auf dem Markt
   leuchtete sie gruen, unter Alarme war sie nicht da. Fuer jemanden, der gerade die
   Aktienseite ausgebaut haben wollte, ist das nicht nur inkonsistent, sondern der halbe
   Nutzen weg.

   Ab hier gibt es genau EINE Rechnung. ``einstiegErreicht`` entscheidet, ``kursStand``
   liefert den Kurs, und beide Reiter lesen dasselbe Ergebnis aus ``rangLagen()``. Zwei
   Antworten auf dieselbe Frage sind strukturell nicht mehr moeglich.

   Dafuer wird ueberall dazugesagt, WOHER der Kurs kommt: „live" oder „Kurs aus dem
   letzten Scan". Ein JETZT auf Scanbasis ist eine schwaechere Aussage als eines auf
   Livebasis — das darf man nicht verschweigen, aber es ist allemal besser, als die
   Aktie gar nicht erst anzuzeigen.  */

// Die Einstiegszone ist keine Linie, sondern ein schmales Band: auf den Cent genau
// trifft ein Kurs eine Marke nie. 0,4 % ist eng genug, dass man noch das kauft, was
// bewertet wurde. Diese Zahl steht EINMAL hier und wird nirgends wiederholt.
const EINSTIEG_TOLERANZ_PCT = 0.4;

/* Der beste verfuegbare Kurs — und die ehrliche Auskunft, woher er kommt.
   Krypto und Gold laufen live ueber Kraken; alles andere kommt aus dem letzten Scan. */
function kursStand(instrument, ausScan){
  const live = L.get(instrument);
  if (live && live.p != null && isFinite(live.p)) return {kurs: live.p, live: true};
  if (ausScan != null && isFinite(ausScan)) return {kurs: ausScan, live: false};
  return {kurs: null, live: false};
}

function einstiegErreicht(lang, einstieg, kurs){
  if (kurs == null || einstieg == null || !isFinite(kurs) || !isFinite(einstieg)) return false;
  const t = EINSTIEG_TOLERANZ_PCT / 100;
  return lang ? kurs <= einstieg * (1 + t) : kurs >= einstieg * (1 - t);
}

/* Ein Wert taucht unter Alarme nur auf, wenn er handelbar ist UND eine Einstiegsmarke
   und eine Invalidierung hat. Genau dieselbe Bedingung entscheidet im Markt darueber,
   ob das Zustandsfeld gezeigt wird — sonst stuende dort ein JETZT fuer einen Wert, den
   die Alarmseite gar nicht kennt. */
function handelsreif(o){
  return !!(o && o.handelbar && o.einstieg != null && o.invalidierung != null);
}

/* Die EINE Liste. Beide Reiter, die Startkarte und der Zaehler lesen hier.
   Zwischengespeichert, weil ``oppZeile`` sie fuer jede der 200+ Zeilen braucht. */
let _rangKarte = null, _rangZeit = 0, _rangStand = '';
function rangLagen(){
  /* Der Zwischenspeicher haengt NICHT nur an der Zeit, sondern am Datenstand.

     Beim ersten Test live stand unter Alarme „Der letzte Scan hat kein handelbares Setup
     gefunden" — bei 16 handelbaren Werten. Grund: beim Seitenaufbau zeichnet die App
     einmal, bevor der Scan geladen ist. Damals war das Ergebnis leer, das war richtig;
     nur wurde es in den Zwischenspeicher gelegt und beim Neuzeichnen direkt nach dem
     Laden wiederverwendet. Ein Zwischenspeicher, der eine Antwort von VOR den Daten
     ueberlebt, ist keine Beschleunigung, sondern ein Fehler mit Gedaechtnis. */
  const stand = (S ? String(S.erzeugt) : 'ohne') + '|' +
                ((WL && WL.wachen) ? WL.wachen.length : -1) + '|' + L.size;
  const t = Date.now();
  if (!_rangKarte || _rangStand !== stand || t - _rangZeit > 800){
    try { _rangKarte = new Map(ausRanking().map(x => [x.w.instrument, x])); }
    catch(e){ _rangKarte = new Map(); }
    _rangZeit = t; _rangStand = stand;
  }
  return _rangKarte;
}

/* Die eine Liste der einsteigbaren Werte — mit der Altersregel drin.

   Beim Test fiel auf, dass die Regel bisher nur an EINER Stelle hing: ``zeichneAlarme``
   leerte die Liste bei einer toten Analyse, der Markt-Reiter nicht. Ergebnis waere
   wieder genau Ozans Bild gewesen: im Markt leuchtet JETZT, unter Alarme steht „gerade
   kein Einstieg erreicht". Also gehoert die Regel dorthin, wo beide sie lesen. */
function amEinstiegListe(){
  if (scanTot()) return [];
  return [...rangLagen().values()].filter(x => x.stufe === 'jetzt');
}

function einstiegsLage(o, kurs){
  if (!o || o.einstieg == null) return {stufe:'keiner', text:'kein Einstieg'};
  // Aus einer toten Analyse kommt kein JETZT — auf keiner Seite. Die Marken sind Stunden
  // alt; ein gruenes Feld daneben waere eine Kaufaufforderung auf Basis von gestern.
  if (scanTot()) return {stufe:'veraltet', text:'Analyse zu alt'};
  // Zuerst der gemeinsame Stand — damit hier nie etwas anderes herauskommt als unter Alarme.
  const x = handelsreif(o) ? rangLagen().get(o.instrument) : null;
  if (x){
    if (x.stufe === 'im_trade') return {stufe:'im_trade', abstand:x.abstand, live:x.live, text:'im Trade'};
    if (x.stufe === 'stop')     return {stufe:'stop', abstand:x.abstand, live:x.live, text:'Stop'};
    if (x.stufe === 'jetzt')    return {stufe:'jetzt', abstand:x.abstand, live:x.live, text:'JETZT'};
    if (x.abstand != null)
      return {stufe:'warten', abstand:x.abstand, live:x.live,
              text:`noch ${Math.abs(x.abstand).toFixed(1).replace('.',',')} %`};
  }
  /* Handelsreif, aber nicht in der Rangliste: dann liegt zu diesem Wert ein BEENDETES
     Signal auf der Wachliste (Ziel erreicht, ausgestoppt, ungueltig geworden). Unter
     Alarme steht es dann im Verlauf. Wuerde hier weitergerechnet, stuende im Markt ein
     frisches JETZT an einem Wert, den die Handlungsseite als erledigt fuehrt — wieder
     zwei Antworten. Also sagt die Zeile, was gilt: das Signal ist durch. */
  if (handelsreif(o)) return {stufe:'beendet', text:'Signal beendet'};
  if (kurs == null || !isFinite(kurs)) return {stufe:'keiner', text:'kein Einstieg'};
  const lang = o.richtung !== 'short';
  const abstand = (kurs - o.einstieg) / o.einstieg * 100;
  if (einstiegErreicht(lang, o.einstieg, kurs)) return {stufe:'jetzt', abstand, text:'JETZT'};
  return {stufe:'warten', abstand,
          text:`noch ${Math.abs(abstand).toFixed(1).replace('.',',')} %`};
}

function oppZeile(o, rang){
  const nk = NOTE_KLASSE[o.note] || '';
  const live = L.get(o.instrument);
  const kurs = live ? live.p : o.kurs;
  const d = digits(kurs);
  const st = o.setup || null;
  const pl = o.plan || null;
  /* Laeuft zu diesem Wert schon ein Trade, gelten SEINE Marken — die aus dem Einstieg,
     nicht die aus dem letzten Scan. Vorher zeigte die Zeile den frischen Vorschlag,
     waehrend die Startkarte oben den laufenden Vertrag zeigte: zwei Einstiegspreise
     fuer denselben Wert auf einem Bildschirm. Ab hier zeigt die Zeile, was gilt. */
  const rl = handelsreif(o) ? rangLagen().get(o.instrument) : null;
  const imTrade = !!(rl && (rl.stufe === 'im_trade' || rl.stufe === 'stop'));
  const M = imTrade
    ? {einstieg: rl.w.einstieg, stop: rl.w.stop, tp1: rl.w.tp1, tp2: rl.w.tp2, tp3: rl.w.tp3}
    : {einstieg: o.einstieg, stop: pl?pl.stop:o.invalidierung,
       tp1: pl?pl.tp1:o.ziel, tp2: pl?pl.tp2:o.tp2, tp3: pl?pl.tp3:o.tp3};
  // Die Zeile fuehrt mit dem NAMEN des Setups, nicht mit dem Score. Wer die Liste
  // ueberfliegt, soll sehen, WAS da ist ("Ruecksetzer im Trend"), und erst danach,
  // wie gut es bewertet ist. Score allein sagt einem Trader nichts.
  const kopf = st ? esc(st.name) : (o.urteil === 'WATCH' ? 'Beobachten' : 'kein benanntes Setup');
  return `<div class="opp n-${o.urteil}" data-sym="${esc(o.instrument)}">
    <div class="opp-h">
      <span class="rk">#${rang}</span>
      <span class="nm">${esc(name(o.instrument))}</span>
      <span class="kl">${esc(o.klasse||'')}</span>
      ${o.richtung?`<span class="dir ${o.richtung}">${o.richtung==='long'?'LONG':'SHORT'}</span>`:''}
      <span class="note ${nk}">${esc(o.note)}</span>
      ${(()=>{ if (!handelsreif(o)) return '';
        const e = einstiegsLage(o, kurs);
        const farbe = e.stufe === 'jetzt' ? 'background:var(--long);color:#03130F'
                    : e.stufe === 'im_trade' ? 'background:var(--accent);color:#03130F'
                    : e.stufe === 'stop' ? 'background:var(--bad);color:#fff'
                    : e.stufe === 'veraltet' ? 'background:var(--bad);color:#fff'
                    : e.stufe === 'warten' ? 'background:var(--warn-bg);color:var(--warn)'
                    : 'background:transparent;color:var(--ink-3)';
        // Woher der Kurs kommt, gehoert an dieselbe Stelle wie der Zustand. Ein JETZT
        // auf Basis eines Scankurses ist eine schwaechere Aussage als eines auf Basis
        // eines Livekurses — wer das nicht sieht, haelt beides fuer dasselbe.
        const quelle = (e.stufe === 'jetzt' && e.live === false)
          ? ` <span class="note" style="background:transparent;color:var(--ink-3)">Kurs vom Scan</span>` : '';
        return `<span class="note" style="${farbe}">${esc(e.text)}</span>${quelle}`; })()}
      <span class="sc">${(o.score||0).toFixed(0)}</span>
    </div>
    <div class="opp-b">
      <div style="font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:13.5px;
                  color:var(--ink);margin-bottom:3px">${kopf}${
        st?` <span style="font-weight:400;font-size:11px;color:var(--ink-3)">${esc(st.qualitaet)}</span>`:''}</div>
      ${st?`<div style="font-size:12.5px;color:var(--ink-2);line-height:1.45">${esc(st.these)}</div>`:''}
      <div class="kpi">
        <span data-px="${esc(o.instrument)}">Kurs <b>${preis(o,'kurs',kurs,d)}</b>${
          live?` <span class="${live.pct>=0?'up':'dn'}">${pct(live.pct,2)}</span>`:''}</span>
        ${(()=>{ const c = crvVon(o); return c!=null?`<span>CRV <b>1:${c.toFixed(1)}</b></span>`:''; })()}
        ${pl?`<span>Risiko <b>${pl.risiko_pct.toFixed(1)} %</b></span>`:''}
        ${o.rs!=null?`<span>Rel. Stärke <b class="${o.rs>=70?'up':o.rs<=30?'dn':''}">${Math.round(o.rs)}</b></span>`:''}
        ${o.confidence?`<span>Klarheit <b>${Math.round(o.confidence*100)} %</b></span>`:''}
      </div>
      ${imTrade?`<div class="muz" style="margin-top:6px;color:var(--accent)">Zu diesem Wert
        läuft bereits ein Trade — die Marken unten sind die aus dem Einstieg und bleiben
        fest, bis er beendet ist.</div>`:''}
      <div class="kpi">
        ${M.einstieg!=null?`<span>Einstieg <b>${preis(o,'einstieg',M.einstieg,d)}</b></span>`:''}
        ${M.stop!=null?`<span>Stop <b>${preis(o,'stop',M.stop,d)}</b></span>`:''}
        ${M.tp1!=null?`<span>Ziel 1 <b>${preis(o,'tp1',M.tp1,d)}</b></span>`:''}
        ${M.tp2!=null?`<span>Ziel 2 <b>${preis(o,'tp2',M.tp2,d)}</b></span>`:''}
        ${M.tp3!=null?`<span>Ziel 3 <b>${preis(o,'tp3',M.tp3,d)}</b></span>`:''}
      </div>
      ${o.broker?`<div class="muz" style="margin-top:6px">Kaufen bei <strong>${esc(o.broker)}</strong>${
        istAktie(o) ? (eurWert(o,'kurs')?' · EUR':' · <span style="color:var(--warn)">USD — Eurokurs fehlt gerade</span>')
                    : (o.waehrung?` · ${esc(o.waehrung)}`:'')}${
        eurHinweis(o)?' · '+eurHinweis(o):''}</div>`:''}
      ${o.erwartung&&o.erwartung.quote?`<div class="muz" style="margin-top:5px">
        ${o.erwartung.bis_tp1_pct!=null?`bis Ziel 1 <strong>${pct(o.erwartung.bis_tp1_pct,1)}</strong> · `:''}
        vergleichbare Signale trafen bisher <strong>${Math.round(o.erwartung.quote.tp1*100)} %</strong>
        <span style="color:var(--ink-3)">(${o.erwartung.quote.n} Fälle, Vergangenheit)</span></div>`:''}
      ${(()=>{ /* Die Frage, die man sich vor dem Kauf stellen sollte und nie stellt:
           ist das überhaupt eine neue Wette? Wer zu SOL noch INJ kauft, hat nicht
           breiter gestreut, sondern dieselbe Position vergrössert — nur mit einem
           zweiten Namen und zweimal Gebühren. Gemessen, nicht vermutet. */
        const gg = glGegenDepot(o.instrument);
        if (!gg) return '';
        const stark = gg.r >= 0.7;
        return `<div class="muz" style="margin-top:7px;color:${stark?'var(--warn)':'var(--ink-2)'}">
          <span style="color:${stark?'var(--warn)':'var(--accent)'}">Schon im Depot:</span>
          ${stark?'das ist im Kern dieselbe Wette wie':'läuft weitgehend zusammen mit'}
          <strong>${esc(gg.name)}</strong> (${gg.r.toFixed(2).replace('.',',')} über
          ${S.gleichlauf ? S.gleichlauf.tage : 90} Tage)${stark
            ? ' — ein Kauf hier streut nicht, er verdoppelt.' : '.'}</div>`; })()}
      ${st&&st.trigger?`<div class="muz" style="margin-top:7px"><span style="color:var(--accent)">Auslöser:</span> ${esc(st.trigger)}</div>`:''}
      ${(o.muster||[]).length?`<div class="muz">Muster: ${o.muster.map(m=>esc(m.name)+' ('+m.zeitebene+')').join(' · ')}</div>`:''}
      ${(o.warnungen||[]).length?`<div class="warnz">${o.warnungen.slice(0,3).map(esc).join('<br>')}</div>`:''}
    </div>
  </div>`;
}

function zeichneRadar(){
  const g = gefiltert();
  // Ozan hat gefragt, ob er hier oder unter Alarme kauft. Die Frage gehoert einmal
  // beantwortet, und zwar da, wo sie entsteht — nicht in einem Hilfetext irgendwo.
  /* Derselbe Zaehler, dieselbe Quelle wie unter Alarme. Vorher rechnete diese Zeile
     selbst — und kam damit auf eine andere Zahl als die Seite, auf die sie verweist. */
  const amEinstieg = amEinstiegListe();
  const jetztListe = amEinstieg.filter(x => (NOTE_RANG[x.w.note]||0) >= MELDE_AB_RANG);
  const jetzt = jetztListe.length;
  const knappe = amEinstieg.length - jetzt;
  const jetztAktien = jetztListe.filter(x => (x.o && x.o.klasse) === 'aktien').length;
  const kopf = `<div class="note-box"><span class="nt">Zwei verschiedene Fragen</span>
    <p style="font-size:13.5px"><strong>Note und Score sagen, wie GUT ein Setup ist.
    Das grüne Feld sagt, ob der Kurs schon DA ist.</strong> Beides muss stimmen — ein A−,
    das noch 8 % von seinem Einstieg entfernt ist, kauft man nicht, sonst kauft man etwas
    anderes als das, was bewertet wurde.</p>
    <p>Diese Seite ist die vollständige Rangliste zum Nachsehen. Gekauft wird unter
    <strong>Alarme</strong> — dort steht genau das, was hier gerade <em>JETZT</em> zeigt,
    und sonst nichts. ${jetzt ? `Aktuell sind das <strong>${jetzt}</strong>${
      jetztAktien ? ` (davon ${jetztAktien} Aktien)` : ''}.`
      : 'Aktuell ist das <strong>keiner</strong> — dann ist nichts zu tun.'}${
      knappe ? ` Dazu ${knappe} Wert${knappe===1?'':'e'} am Einstieg, aber unter A− —
      ${knappe===1?'er steht':'sie stehen'} drüben in einem eigenen Abschnitt und
      ${knappe===1?'klingelt':'klingeln'} nicht.` : ''}
    Beide Seiten rechnen seit dem 16.09. mit <em>derselben</em> Funktion; dieselben Zahlen
    stehen drüben im Kopf.</p>
    <p style="color:var(--ink-3)">Bei <em>noch X %</em> gehört eine <strong>Limit-Order</strong>
    hin: du legst sie zum Einstiegskurs, und wenn der Kurs kommt, wird sie ausgeführt —
    ohne dass du dabei sein musst, und bei Kraken zum günstigeren Gebührensatz.</p></div>`;
  if (!g.length){ $('radar').innerHTML = kopf + `<p class="leer">Kein Wert in dieser Auswahl.</p>`; return; }
  /* Die Liste wird bei 60 Zeilen abgeschnitten, sonst scrollt man ewig. Ein Wert, der
     GERADE einsteigbar ist, darf aber nie unter diesen Schnitt fallen — sonst steht er
     unter Alarme und im Markt nicht, und wir haetten die Ungereimtheit nur umgedreht. */
  const aktiv = new Set([...rangLagen().values()]
    .filter(x => x.stufe === 'jetzt' || x.stufe === 'im_trade' || x.stufe === 'stop')
    .map(x => x.w.instrument));
  // Der Rang bleibt der echte Platz in der Rangliste, auch wenn eine Zeile nachgezogen
  // wurde — sonst stuende „#7" an einem Wert, der in Wahrheit auf Platz 83 liegt.
  const zeigen = g.map((o, i) => ({o, rang: i + 1}))
                  .filter(({o, rang}) => rang <= 60 || aktiv.has(o.instrument));
  const nachgezogen = zeigen.length - Math.min(60, g.length);
  const rest = g.length - zeigen.length;
  $('radar').innerHTML = kopf + zeigen.map(({o, rang})=>oppZeile(o, rang)).join('') +
    (rest?`<p class="leer">… und ${rest} weitere${nachgezogen > 0
      ? `. ${nachgezogen} Wert${nachgezogen===1?' steht':'e stehen'} weiter hinten in der
         Rangliste, ${nachgezogen===1?'ist':'sind'} aber gerade einsteigbar —
         ${nachgezogen===1?'er ist':'sie sind'} deshalb oben mit aufgeführt` : ''}.</p>`:'');
  $('radar').querySelectorAll('.opp').forEach(el=>
    el.addEventListener('click',()=>waehle(el.dataset.sym)));
}

/* ============================================================ CHART-ANSICHT */
function zeichneChartAnsicht(){
  if (!AKTIV){ $('chartansicht').innerHTML = `<p class="leer">Wähle oben im Markt einen Wert.</p>`; return; }
  const c = AKTIV.chance || {}, zg = AKTIV.zeichnung || {};
  const ebenen = Object.keys(zg);
  if (!ebenen.length){
    // Detaildateien gibt es nur für die vordersten Werte der Rangliste — alles darunter
    // würde nie angetippt und wäre totes Gewicht auf der Seite.
    $('chartansicht').innerHTML = `<div class="note-box"><span class="nt">Keine Detailansicht</span>
      <p>Für <strong>${esc(name(AKTIV.instrument))}</strong> liegt keine gezeichnete Analyse
      vor. Detailansichten werden nur für die vordersten Werte der Rangliste erzeugt;
      weiter unten wäre es Ballast, den niemand öffnet.</p>
      <p>Rückt der Wert nach oben, ist die Zeichnung beim nächsten Scan da.</p></div>`;
    return;
  }
  const live = L.get(AKTIV.instrument);
  const kurs = live ? live.p : c.kurs;
  const d = digits(kurs);
  const E = chart.ebenen();
  const lagen = [['swings','Swings'],['brueche','BOS/CHoCH'],['liq','Liquidität'],
                 ['zonen','FVG/OB'],['pd','Premium/Discount'],['ziele','Entry/SL/TP'],
                 ['rsi','RSI']];
  $('chartansicht').innerHTML = `
    <div class="chartbox">
      <div class="chart-h">
        <span class="nm">${esc(name(AKTIV.instrument))}</span>
        ${c.richtung?`<span class="dir ${c.richtung}">${c.richtung.toUpperCase()}</span>`:''}
        ${c.note?`<span class="note ${NOTE_KLASSE[c.note]||''}">${esc(c.note)}</span>`:''}
        <span class="px ${live && live.pct>=0?'up':live?'dn':''}" id="chartpx">${num(kurs,d)}</span>
      </div>
      <div class="tfbar" id="tfbar">${ebenen.map(t=>
        `<button class="tfb" data-tf="${t}" aria-pressed="${t===AKTIV_TF}">${t}</button>`).join('')}
        <span style="margin-left:auto;font-size:10.5px;color:var(--ink-3);align-self:center">
          ${AKTIV.live_quelle ? 'Kurs live · Analyse vom Scan' : 'Kurs und Analyse vom Scan'}
        </span>
      </div>
      <div class="layers" id="layers">${lagen.map(([k,t])=>
        `<button class="lb" data-l="${k}" aria-pressed="${!!E[k]}">${t}</button>`).join('')}</div>
      <canvas id="cv"></canvas>
      <div class="readout" id="readout">Ziehen zum Verschieben, Scrollen zum Zoomen.</div>
      <div class="legende">
        <span><i style="background:var(--long)"></i>Ziele / bullish</span>
        <span><i style="background:var(--bad)"></i>Stop / bearish</span>
        <span><i style="background:var(--warn)"></i>Liquidität</span>
        <span><i style="background:var(--accent)"></i>Premium/Discount</span>
      </div>
    </div>
    ${c.begruendung?`<div class="note-box"><span class="nt">Note ${esc(c.note||'')}</span>
      <p>${esc(c.begruendung)}</p></div>`:''}`;
  const tf = zg[AKTIV_TF] || {};
  chart.binde();
  chart.setze(tf.kerzen, tf, c);
  $('tfbar').querySelectorAll('.tfb').forEach(b=>b.addEventListener('click',()=>{
    AKTIV_TF = b.dataset.tf; zeichneChartAnsicht();
  }));
  $('layers').querySelectorAll('.lb').forEach(b=>b.addEventListener('click',()=>{
    const an = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', an ? 'true':'false');
    chart.ebene(b.dataset.l, an);
  }));
}

/* ============================================================ ANALYSE */
function zeichneAnalyse(){
  if (!AKTIV){ $('analyse').innerHTML = `<p class="leer">Wähle oben im Markt einen Wert.</p>`; return; }
  if (!(AKTIV.mtf||[]).length && !AKTIV.kommentar){
    $('analyse').innerHTML = `<div class="note-box"><span class="nt">Keine Detailansicht</span>
      <p>Für <strong>${esc(name(AKTIV.instrument))}</strong> liegt keine ausgearbeitete
      Analyse vor — Detailansichten werden nur für die vordersten Werte der Rangliste
      erzeugt. Die Kennzahlen aus der Rangliste stehen im Reiter <em>Markt</em>.</p></div>`;
    return;
  }
  const c = AKTIV.chance || {}, K = AKTIV.kommentar, M = AKTIV.muster || [];
  const live = L.get(AKTIV.instrument);
  const kurs = live ? live.p : c.kurs, d = digits(kurs);

  let h = `<div class="karte ${c.handelbar?'gut':(c.urteil==='WATCH'?'warn':'')}">
    <h3>${esc(name(AKTIV.instrument))} — ${esc(c.note||'—')}${c.richtung?' '+c.richtung.toUpperCase():''}</h3>
    <div class="kpi">
      <span>Score <b>${(c.score||0).toFixed(0)}/100</b></span>
      ${c.confidence?`<span>Confidence <b>${Math.round(c.confidence*100)} %</b></span>`:''}
      ${c.rr?`<span>CRV <b>1:${c.rr.toFixed(2)}</b></span>`:''}
      ${c.erwartete_bewegung_pct!=null?`<span>Erwartet <b class="${c.erwartete_bewegung_pct>=0?'up':'dn'}">${pct(c.erwartete_bewegung_pct,1)}</b></span>`:''}
      <span>Profil <b>${esc(c.profil||'')}</b></span>
    </div>
    <div class="zt">
      <span>Kurs <b>${num(kurs,d)}</b>${live?' <span style="color:var(--long)">live</span>':''}</span>
      ${c.ziel!=null?`<span>TP1 <b>${num(c.ziel,d)}</b></span>`:''}
      ${c.tp2!=null?`<span>TP2 <b>${num(c.tp2,d)}</b></span>`:''}
      ${c.tp3!=null?`<span>TP3 <b>${num(c.tp3,d)}</b></span>`:''}
      ${c.invalidierung!=null?`<span>Stop <b>${num(c.invalidierung,d)}</b></span>`:''}
    </div>
    ${c.begruendung?`<p style="margin:9px 0 0;font-size:12.5px;color:var(--ink-2)">${esc(c.begruendung)}</p>`:''}
  </div>`;

  // --- Das Setup. Die Karte steht ganz oben, weil sie die erste Frage beantwortet:
  // was ist das hier fuer ein Trade? Alles Weitere haengt daran.
  const ST = c.setup || (K && K.setup) || null;
  if (ST){
    h += `<h2>Das Setup</h2>
      <div class="setup">
        <div class="sh">${esc(ST.name)}<span class="sq ${esc(ST.qualitaet)}">${esc(ST.qualitaet)}</span></div>
        <div class="sb">
          <p style="margin:0">${esc(ST.these)}</p>
          <ul>
            ${(ST.erfuellt||[]).map(x=>`<li class="ja">${esc(x)}</li>`).join('')}
            ${(ST.fehlt||[]).map(x=>`<li class="nein">${esc(x)}</li>`).join('')}
          </ul>
          ${ST.trigger?`<div class="trig"><b>Auslöser</b>${esc(ST.trigger)}</div>`:''}
        </div>
      </div>`;
  } else {
    h += `<h2>Das Setup</h2>
      <div class="note-box warn"><span class="nt">Kein benanntes Setup</span>
      <p style="margin:0">Der Chart zeigt gerade nichts, was einen Namen hätte — keinen
      Rücksetzer im Trend, keinen Ausbruch aus einer Basis, keine Rückeroberung nach
      einem Liquiditätsgriff. Die Kennzahlen können trotzdem gut aussehen; das reicht
      aber nicht. Ohne Setup wird hier <strong>nicht gehandelt, sondern beobachtet</strong>.</p></div>`;
  }

  // --- Der Handelsplan. Nicht "kauf bei X", sondern der komplette Ablauf inklusive
  // der Frage, wann man aussteigt, obwohl das Ziel nicht erreicht ist. Genau daran
  // scheitern Trades in der Praxis, nicht am Einstieg.
  const PL = c.plan || null;
  if (PL){
    h += `<h2>So wird gehandelt</h2>
      <div class="karte">
        <div class="kpi" style="margin-top:0">
          <span>Einstieg <b>${num(PL.einstieg,d)}</b></span>
          <span>Stop <b>${num(PL.stop,d)}</b></span>
          <span>1 R <b>${num(PL.r,d)}</b></span>
          <span>Risiko <b>${PL.risiko_pct.toFixed(1)} %</b></span>
          <span>CRV <b>1:${PL.crv.toFixed(1)}</b></span>
        </div>
        <ol class="steps">${(PL.schritte||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
        <h3 style="margin-top:16px">Wann raus, bevor ein Ziel erreicht ist</h3>
        <ul class="exits">${(PL.ausstiege||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        ${PL.untauglich?`<div class="note-box bad" style="margin-bottom:0"><span class="nt">Nicht handelbar</span><p style="margin:0">${esc(PL.untauglich)}</p></div>`:''}
      </div>`;
  }

  if ((c.warnungen||[]).length)
    h += `<div class="note-box warn"><span class="nt">Was dagegen spricht</span>
      <ul class="satzliste">${c.warnungen.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;

  h += `<h2>Was die Zeitebenen sagen</h2><div class="tw"><table class="mtf">
    <thead><tr><th>TF</th><th>Regime</th><th>RSI</th><th>Letzter Bruch</th><th>Lage</th><th>Liquidität</th></tr></thead>
    <tbody>${(AKTIV.mtf||[]).map(z=>{
      const kl = z.regime_roh==='trend_up'?'up':z.regime_roh==='trend_down'?'dn':'nu';
      const br = z.letzter_bruch;
      const I = z.indikatoren || {};
      const rk = I.rsi == null ? 'nu' : I.rsi >= 70 ? 'dn' : I.rsi <= 30 ? 'up' : '';
      return `<tr>
        <td class="tf">${esc(z.tf)}</td>
        <td class="${kl}">${esc(z.regime)}${z.staerke?` <span class="nu">${z.staerke.toFixed(2)}</span>`:''}<br>
          <span class="nu" style="font-size:11px">${esc(z.volatilitaet)} · ${esc(z.phase)}</span></td>
        <td class="${rk}">${I.rsi!=null?`${I.rsi.toFixed(0)}`:'<span class="nu">—</span>'}
          ${I.rsi_divergenz?`<br><span class="nu" style="font-size:11px">Div. ${I.rsi_divergenz==='baerisch'?'↓':'↑'}</span>`:''}
          ${I.volumen_x!=null?`<br><span class="nu" style="font-size:11px">Vol ${I.volumen_x.toFixed(1)}×</span>`:''}</td>
        <td>${br?`${esc(br.art)} <span class="${br.richtung==='bullish'?'up':'dn'}">${br.richtung==='bullish'?'↑':'↓'}</span><br>
          <span class="nu" style="font-size:11px">${num(br.preis,d)}</span>`:'<span class="nu">—</span>'}</td>
        <td>${z.pd?`${esc({premium:'teuer',discount:'günstig',equilibrium:'Mitte'}[z.pd.zone]||z.pd.zone)}<br>
          <span class="nu" style="font-size:11px">${(z.pd.position*100).toFixed(0)} %</span>`:'<span class="nu">—</span>'}</td>
        <td><span class="nu" style="font-size:11px">
          ${z.liquiditaet_oben!=null?'↑ '+num(z.liquiditaet_oben,d):''}
          ${z.liquiditaet_unten!=null?'<br>↓ '+num(z.liquiditaet_unten,d):''}</span></td>
      </tr>`;
    }).join('')}</tbody></table></div>`;

  const mitInd = (AKTIV.mtf||[]).filter(z=>(z.indikatoren||{}).rsi != null);
  if (mitInd.length){
    h += `<h2>Indikatoren</h2>`;
    h += mitInd.map(z=>`<div class="rowx"><span class="lab mono">${esc(z.tf)}</span>
      <span class="val" style="font-family:inherit;font-weight:400;text-align:right">${esc((z.indikatoren||{}).satz||'')}</span></div>`).join('');
    h += `<div class="note-box"><span class="nt">Was der RSI hier ist — und was nicht</span>
      <p>Ein RSI von 78 heißt <strong>nicht</strong> „verkaufen". In einem starken Trend
      bleibt er wochenlang oben, und wer dort short geht, steht gegen die Bewegung. Er
      geht hier als Kontext ein und erzeugt höchstens eine Warnung — wie alles andere
      auch: <em>gesetzt, nicht an Ergebnissen optimiert.</em></p>
      <p>Die einzige RSI-Aussage, die mehr ist als „hoch" oder „tief", ist die
      <strong>Divergenz</strong>: der Kurs macht ein neues Extrem, die Kraft dahinter
      nicht mit. Die steht in der Tabelle oben als „Div. ↑/↓".</p></div>`;
  }

  if (M.length){
    h += `<h2>Erkannte Muster</h2>`;
    h += M.map(m=>`<div class="karte ${m.richtung==='long'?'gut':m.richtung==='short'?'bad':''}">
      <h3>${esc(m.name)} <span class="mono" style="color:var(--ink-3);font-weight:400">${esc(m.zeitebene)} · Güte ${(m.guete*100).toFixed(0)} %</span></h3>
      <p style="margin:0;font-size:13px;color:var(--ink-2)">${esc(m.beschreibung)}</p>
      ${(m.linien||[]).length?`<div class="zt">${m.linien.map(l=>`<span>${esc(l.name)} <b>${num(l.preis,d)}</b></span>`).join('')}</div>`:''}
    </div>`).join('');
    h += `<div class="note-box"><span class="nt">Wichtig</span>
      <p>Ein erkanntes Muster ist <strong>kein Handelssignal</strong>. Es beschreibt die Form
      des Charts und geht als Kontext in die Bewertung ein. Ob ein Muster historisch trägt,
      ist eine eigene Frage und hier nicht beantwortet.</p></div>`;
  }

  if (K){
    const block = (titel, zeilen, klasse) => zeilen && zeilen.length
      ? `<div class="karte ${klasse||''}"><h3>${titel}</h3>
         <ul class="satzliste">${zeilen.map(z=>`<li>${esc(z)}</li>`).join('')}</ul></div>` : '';
    h += `<h2>Was die AI sieht</h2>`;
    h += block('Beobachtung', K.was_ich_sehe);
    h += block('Warum jetzt', K.warum_jetzt, 'gut');
    h += block('Was erwartet wird', K.erwartung);
    h += block('Was die These widerlegen würde', K.was_waere_falsch, 'bad');
  }

  h += `<h2>Wie der Score zustande kommt</h2>`;
  h += (c.faktoren||[]).map(f=>`<div class="fak">
      <span class="fn">${esc(String(f.name).replace(/_/g,' '))}</span>
      <span class="fb2"><i style="width:${(f.punkte/f.max*100).toFixed(0)}%"></i></span>
      <span class="fd">${esc(f.detail)} <span class="mono" style="color:var(--ink-3)">${f.punkte.toFixed(1)}/${f.max}</span></span>
    </div>`).join('');
  h += `<div class="note-box warn"><span class="nt">Was der Score ist — und was nicht</span>
    <p>Er beschreibt, was am Chart gerade zusammenpasst. <strong>Er ist kein belegter
    Gewinnhinweis.</strong> Die Gewichte sind gesetzt, nicht an historische Ergebnisse
    angepasst — das wäre Overfitting. Ob ein hoher Score Geld bringt, ist offen.</p></div>`;

  $('analyse').innerHTML = h;
}

/* ============================================================ PORTFOLIO
   Die Positionen liegen ausschliesslich in diesem Browser (localStorage). Das Repo
   und damit diese Seite sind oeffentlich — echte Depotdaten gehoeren dort nicht hin.
   So bekommt Ozan trotzdem das Cockpit: gerechnet wird im Geraet, hochgeladen nichts.
   ============================================================ */
const SPEICHER = 'desk.positionen.v1';
function ladePositionen(){
  try { const r = localStorage.getItem(SPEICHER); const a = r ? JSON.parse(r) : [];
        return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function speicherePositionen(a){
  try { localStorage.setItem(SPEICHER, JSON.stringify(a)); } catch(e){}
}
/* Eine Position dem Scan zuordnen — ueber die MUENZE, nicht ueber das Paar.

   Das war ein echter Ausfall: als der Scan von Euro auf Dollar umgestellt wurde, hiess
   Solana im Scan ploetzlich SOLUSD, im Depot aber weiter SOLEUR. Ergebnis: saemtliche
   Kryptopositionen standen auf einen Schlag ohne Bewertung da — kein Kurs, kein Urteil,
   kein Ausstiegsplan. Und zwar lautlos.

   Wer 1,79 Solana haelt, haelt 1,79 Solana. In welcher Waehrung die Boerse das Paar
   notiert, ist eine Eigenschaft der Boerse, nicht der Position. Also wird ab jetzt die
   Muenze verglichen und die Waehrung hinterher verrechnet.                          */
function muenzeVon(sym){
  const s = String(sym||'').toUpperCase().split('-')[0];
  for (const q of ['USDT','USDC','USD','EUR']){
    if (s.endsWith(q) && s.length > q.length) return s.slice(0, -q.length);
  }
  return s;
}
function scanRow(sym){
  const g = (S?.gesamt||[]);
  const genau = g.find(o => o.instrument === sym);
  if (genau) return genau;
  const m = muenzeVon(sym);
  return g.find(o => muenzeVon(o.instrument) === m) || null;
}
/* In welcher Waehrung eine Position tatsaechlich gerechnet wird.

   Das steht nicht immer im Kuerzel. SOLEUR sagt es, NVDA nicht — und eine Aktie bei
   Trade Republic wird nun einmal in Euro gekauft, auch wenn der Scan sie in Dollar
   fuehrt. Ohne diese Unterscheidung wird ein Einstieg zu 154,72 € gegen einen Kurs von
   218,29 $ gerechnet: +41 % statt der echten +21 %. Ein Depot, das sich um zwanzig
   Prozentpunkte verschaetzt, ist schlimmer als gar keins. */
function posWaehrung(pos){
  if (pos && pos.waehrung) return String(pos.waehrung).toUpperCase();
  const s = String(pos?.sym||'').toUpperCase();
  const m = s.match(/(USDT|USDC|USD|EUR)$/);
  if (m) return m[1] === 'EUR' ? 'EUR' : 'USD';
  // Kein Kuerzel: das Konto entscheidet. Trade Republic rechnet in Euro.
  if (/trade\s*republic/i.test(String(pos?.konto||''))) return 'EUR';
  return 'USD';
}
function waehrungsZeichen(w){ return w === 'EUR' ? ' €' : ' $'; }

/* Wie viel eine Zahl aus der Zeile in der Waehrung der POSITION wert ist.
   Steht die Position in Euro und der Scan in Dollar, wird umgerechnet — sonst sieht ein
   Depot nach einem Waehrungswechsel plotzlich 16 % besser oder schlechter aus, ohne dass
   sich am Markt irgendetwas getan haette. */
function inPositionsWaehrung(row, wert, pos){
  if (wert == null || !row) return wert;
  const pw = typeof pos === 'string' ? posWaehrung({sym: pos}) : posWaehrung(pos);
  const rw = row.waehrung === 'EUR' ? 'EUR' : 'USD';
  if (pw === rw) return wert;
  const kurs = row.eurusd || (S && S.eurusd);
  if (!kurs) return wert;
  return pw === 'EUR' ? wert / kurs : wert * kurs;
}

/* ======================================================== BASISWERTE
   „Es fehlen noch Solana und die anderen Sachen, die du im Portfolio nicht bewerten
   kannst. Die musst du alle mit einbeziehen."

   Ein Turbo-Zertifikat auf TSMC ist kein eigener Markt. Es ist TSMC mit Hebel und einer
   Schwelle, an der der Schein wertlos verfaellt. Ein Welt-ETF ist kein Einzelwert,
   sondern der halbe Aktienmarkt. Bisher stand bei beiden nur „keine Bewertung" — ehrlich,
   aber nutzlos: ueber TSMC laesst sich sehr wohl etwas sagen, und genau daran haengt der
   Schein.

   Also wird der Basiswert mitgescannt und das Urteil von ihm hergeleitet — deutlich
   gekennzeichnet. Die Marken des Basiswerts sind NICHT die Marken des Scheins: der Hebel
   verschiebt jeden Abstand, und die Knock-out-Schwelle kennt nur der Emittent. */
const BASISWERT = {
  'TURBO-TSMC-LONG':    {sym:'TSM',  art:'turbo', richtung:'long'},
  'TURBO-NETFLIX-LONG': {sym:'NFLX', art:'turbo', richtung:'long'},
  'TURBO-META-LONG':    {sym:'META', art:'turbo', richtung:'long'},
  'FTSE-ALL-WORLD':     {art:'breit'},
};
const BASIS_STOPP = new Set(['LONG','SHORT','TURBO','CALL','PUT','MINI','FUTURE','OPEN',
                             'END','WORLD','ALL','ETF','FTSE','MSCI','INDEX','LANG']);
/* Aus einem Freitext-Kuerzel den Basiswert erraten: „TURBO-NETFLIX-LONG" enthaelt
   NETFLIX, und NETFLIX ist der Klarname von NFLX. Damit findet auch ein Schein seinen
   Basiswert, den niemand von Hand eingetragen hat. */
function errateBasis(sym){
  const s = String(sym||'').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (s.length < 4) return null;
  let best = null;
  for (const o of (S?.gesamt||[])){
    if (o.klasse !== 'aktien') continue;
    const stuecke = [String(o.instrument||''), ...String(o.name||'').split(/[^A-Za-z]+/)];
    for (const roh of stuecke){
      const t = roh.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (t.length < 4 || BASIS_STOPP.has(t)) continue;
      if (s.includes(t) && (!best || t.length > best.laenge)) best = {sym: o.instrument, laenge: t.length};
    }
  }
  return best ? best.sym : null;
}
function basisVon(pos){
  if (!pos) return null;
  if (pos.basis) return {sym: String(pos.basis).toUpperCase(), art:'turbo',
                         richtung: pos.basis_richtung || 'long'};
  const s = String(pos.sym||'').toUpperCase();
  if (BASISWERT[s]) return BASISWERT[s];
  const geraten = errateBasis(s);
  return geraten ? {sym: geraten, art:'turbo', richtung:'long', geraten:true} : null;
}
/* Marktbreite: wie viel Prozent der gescannten Aktien stehen ueber ihrem Stand von vor
   einem Quartal. Das ist die ehrlichste Zahl, die sich fuer einen Welt-ETF aus den
   vorhandenen Daten bilden laesst — ein Index steigt, wenn die Mehrheit steigt. */
function marktbreite(){
  const a = (S?.gesamt||[]).filter(o => o.klasse === 'aktien'
    && o.zusatz && o.zusatz.renditen && o.zusatz.renditen.r63 != null);
  if (a.length < 10) return null;
  const oben = a.filter(o => o.zusatz.renditen.r63 > 0).length;
  return {anteil: oben / a.length * 100, n: a.length, oben};
}

/* ============================================= URTEIL ZU EINER POSITION

   Hier steckte ein Denkfehler, und zwar ein teurer.

   Das Depot benutzte den SCORE aus der Rangliste. Der Score beantwortet aber eine ganz
   andere Frage: „Gibt es hier GERADE JETZT einen guten Einstieg?" Bei einem Wert, in dem
   man laengst drin ist, steht da fast immer eine kleine Zahl — nicht weil die Position
   schlecht waere, sondern weil der Einstieg vorbei ist. Solana stand auf 5 von 100, Fetch
   auf 3, Render auf 2. Das Depot sagte deshalb bei fast allem „REDUZIEREN". Ein Rat, der
   immer gleich lautet, ist kein Rat, sondern ein kaputtes Messgeraet.

   Gemessen wird jetzt, was fuer eine BESTEHENDE Position zaehlt: die relative Staerke
   innerhalb der eigenen Klasse — jeder Coin gegen alle anderen gescannten Coins, jede
   Aktie gegen alle anderen Aktien. Das ist die eine Momentum-Aussage mit ordentlichem
   empirischem Rueckhalt: relative Staerke bleibt ueber Wochen bis Monate eher bestehen,
   als dass sie dreht. Ein Nachzuegler bleibt meistens einer.

   Der Score bleibt auf der Karte sichtbar — er sagt weiterhin etwas darueber, ob man HEUTE
   nachkaufen wuerde. Er entscheidet nur nicht mehr ueber das Halten. */
const RS_FUEHRER = 70, RS_MITTE = 45, RS_SCHWACH = 25;
function haltUrteil(row){
  if (!row) return null;
  const rs = row.rs;
  const ren = (row.zusatz && row.zusatz.renditen) || {};
  const gegen = row.richtung === 'short';
  if (rs == null){
    const t = ren.r21;
    if (t == null) return {urteil:'HALTEN', kl:'', rs:null, ren, gegen,
                           grund:'zu wenig Historie für einen Klassenvergleich'};
    return t >= 0
      ? {urteil:'HALTEN', kl:'gut', rs:null, ren, gegen, grund:'eigene Rendite positiv'}
      : {urteil:'BEOBACHTEN', kl:'warn', rs:null, ren, gegen, grund:'eigene Rendite negativ'};
  }
  let urteil, kl;
  if (rs >= RS_FUEHRER)      { urteil = 'STARK HALTEN'; kl = 'gut'; }
  else if (rs >= RS_MITTE)   { urteil = 'HALTEN';       kl = 'gut'; }
  else if (rs >= RS_SCHWACH) { urteil = 'BEOBACHTEN';   kl = 'warn'; }
  else                       { urteil = 'REDUZIEREN';   kl = 'bad'; }
  // Ein aktuelles Short-Setup im eigenen Wert hebt kein Halten auf, deckelt es aber.
  if (gegen && kl === 'gut'){ urteil = 'BEOBACHTEN'; kl = 'warn'; }
  return {urteil, kl, rs, ren, gegen};
}

/* ======================================================= HEBEL / TURBO

   „Ich arbeite mit Hebel — gib mir an, was für einen Hebel ich drin habe, den Knock-out,
   und dann schätzt du das alles besser ein. Ich habe weniger Kapital als andere."

   Ein Turbo ist kein eigener Markt, sondern eine einfache Formel auf seinen Basiswert:

       Scheinpreis ≈ (Kurs des Basiswerts − Knock-out-Schwelle) / Bezugsverhältnis

   Daraus folgt alles Weitere von selbst — und zwar ohne Schätzung:

       Hebel       = Basiskurs / (Basiskurs − Schwelle)
       Puffer      = (Basiskurs − Schwelle) / Basiskurs

   Der Puffer ist die wichtigste Zahl, die es bei einem Schein gibt: er sagt, wie weit
   der Basiswert fallen darf, bevor das Papier **wertlos verfällt**. Nicht „im Minus" —
   weg. Ein Stop nützt dagegen nichts, wenn die Schwelle über Nacht gerissen wird.

   Deshalb bekommt der Puffer die höchste Priorität unter allen Depotregeln: vor Stop,
   vor Ziel, vor allem. Und deshalb werden die drei Turbos jetzt echt bewertet, statt mit
   einem von Hand eingetragenen Wert dazustehen.

   Die Umrechnung in Euro ist bewusst schlicht (Kurs des Basiswerts geteilt durch den
   Eurokurs). Ein Emittent rechnet mit Aufgeld, Finanzierungskosten und manchmal
   Währungssicherung; das steht so auch auf der Karte. Für die Frage „wie nah bin ich an
   der Schwelle" ist die Rechnung trotzdem richtig — und das ist die Frage, die zählt. */
const KO_PUFFER_ENG = 12;     // Prozent — darunter wird es ernst
const KO_PUFFER_KRITISCH = 6; // Prozent — darunter ist es eine Handlung, keine Warnung

/* Margin statt Schein: kein Knock-out, aber eine Liquidationsschwelle.

   Bei einer gehebelten Position auf Bybit gibt es kein Zertifikat mit Schwelle — die
   Boerse schliesst die Position, wenn die Sicherheit aufgebraucht ist. Bei 5× ist das
   ungefaehr 20 % unter dem Einstieg, bei 10× rund 10 %. Genau ist es das nicht: Gebuehren
   und Erhaltungsmarge verschieben die Marke etwas nach oben, und ein Nachschuss verschiebt
   sie nach unten. Als Warnschwelle taugt die Rechnung trotzdem — und sie ist ehrlicher
   als gar keine Zahl.

   Was hier NICHT passiert: den Gewinn mit dem Hebel multiplizieren. Ozans App zeigt den
   Gewinn in Euro und Dollar, und der haengt an der Stueckzahl, nicht am Hebel. Der Hebel
   entscheidet, wie viel EIGENES Geld dahintersteckt — und damit, wie schnell es weg ist. */
function margenLage(pos, kurs){
  const h = Number(pos && pos.hebel);
  if (!isFinite(h) || h <= 1 || kurs == null || !pos.einstieg) return null;
  const lang = (pos.hebel_richtung || 'long') === 'long';
  const liq = lang ? pos.einstieg * (1 - 1/h) : pos.einstieg * (1 + 1/h);
  const abstand = lang ? kurs - liq : liq - kurs;
  return {
    art: 'margin', hebel: h, liquidation: liq, lang,
    ausgeknockt: abstand <= 0,
    puffer_pct: abstand / kurs * 100,
    einsatz: (pos.menge * pos.einstieg) / h,
  };
}

function hebelLage(pos, basisRow, eurusd){
  if (!pos || pos.ko == null || !basisRow) return null;
  const basisKurs = basisRow.kurs;
  if (basisKurs == null || !isFinite(basisKurs)) return null;
  const ko = Number(pos.ko);
  if (!isFinite(ko) || ko <= 0) return null;
  const lang = (pos.hebel_richtung || 'long') === 'long';
  const abstand = lang ? basisKurs - ko : ko - basisKurs;
  if (abstand <= 0) return {ausgeknockt: true, basisKurs, ko, lang};
  const ratio = (pos.ratio != null && Number(pos.ratio) > 0) ? Number(pos.ratio) : 1;
  const scheinBasis = abstand / ratio;          // in der Währung des Basiswerts
  const rw = basisRow.waehrung === 'EUR' ? 'EUR' : 'USD';
  const pw = posWaehrung(pos);
  let schein = scheinBasis;
  if (pw !== rw && eurusd) schein = pw === 'EUR' ? scheinBasis / eurusd : scheinBasis * eurusd;
  return {
    ausgeknockt: false, basisKurs, ko, lang, ratio,
    schein,
    hebel: basisKurs / abstand,
    puffer_pct: abstand / basisKurs * 100,
  };
}

function bewertePosition(pos){
  const row = scanRow(pos.sym);
  const live = L.get(pos.sym) || (row ? L.get(row.instrument) : null);
  const roh = live ? live.p : (row ? row.kurs : null);
  let kurs = inPositionsWaehrung(row, roh, pos);
  const w = posWaehrung(pos);

  /* Ein Schein mit Knock-out wird aus seinem Basiswert gerechnet, nicht geschaetzt.
     Der Basiswert hat einen Livekurs — damit hat der Schein auch einen. */
  let hebel = null;
  // Gehebelt ohne Schein: die Boerse liquidiert, statt dass ein Zertifikat verfaellt.
  if (pos.ko == null && pos.hebel){
    hebel = margenLage(pos, kurs);
    if (hebel) hebel.basisName = posName({pos, row});
  }
  if (pos.ko != null){
    const bv = basisVon(pos);
    const brow = bv && bv.sym ? scanRow(bv.sym) : null;
    if (brow){
      const bl = L.get(brow.instrument);
      const browLive = bl ? {...brow, kurs: bl.p} : brow;
      hebel = hebelLage(pos, browLive, (brow.eurusd || (S && S.eurusd)));
      if (hebel && !hebel.ausgeknockt) kurs = hebel.schein;
      if (hebel) hebel.basisName = brow.name || bv.sym;
      if (hebel) hebel.basisSym = bv.sym;
    }
  }
  /* Nicht alles im Depot steht im Scan: ein ETF, ein Turbo-Zertifikat, ein
     ausgelisteter Coin. Fuer die gibt es keinen Kurs — und ohne Kurs stand die Position
     vorher mit leerem Wert da, als waere sie nichts wert. Deshalb duerfen Wert und
     Einstand auch von Hand kommen; auf der Karte steht dann, dass es so ist. */
  const wert = (kurs != null && pos.menge) ? kurs * pos.menge
             : (pos.wert_manuell != null ? pos.wert_manuell : null);
  const einstand = pos.einstieg && pos.menge ? pos.einstieg * pos.menge
                 : (pos.einstand_manuell != null ? pos.einstand_manuell : null);
  const gv = (wert != null && einstand != null) ? wert - einstand : null;
  const gvPct = (gv != null && einstand) ? gv / einstand * 100 : null;
  let r = null;
  if (row && row.invalidierung != null && pos.einstieg){
    const risiko = Math.abs(pos.einstieg - inPositionsWaehrung(row, row.invalidierung, pos));
    if (risiko > 0 && kurs != null) r = (kurs - pos.einstieg) / risiko;
  }
  const score = row ? row.score : null;
  const halt = haltUrteil(row);
  let urteil = halt ? halt.urteil : 'UNBEKANNT';
  let kl = halt ? halt.kl : '';

  /* Kein eigener Scan-Eintrag? Dann ueber den Basiswert. Der Schein selbst bleibt
     unbewertbar — was der Basiswert macht, ist trotzdem die halbe Antwort. */
  let basis = null;
  if (!row){
    const b = basisVon(pos);
    if (b && b.art === 'breit'){
      const br = marktbreite();
      const lage = (S && S.makro && S.makro.regime) || 'neutral';
      if (br){
        basis = {art:'breit', breite: br, lage};
        if (lage === 'risk_off' || br.anteil < 35){ urteil = 'BEOBACHTEN'; kl = 'warn'; }
        else if (br.anteil < 25){ urteil = 'REDUZIEREN'; kl = 'bad'; }
        else { urteil = 'HALTEN'; kl = 'gut'; }
      }
    } else if (b && b.sym){
      const brow = scanRow(b.sym);
      if (brow){
        basis = {art:'turbo', sym: b.sym, row: brow, richtung: b.richtung || 'long',
                 geraten: !!b.geraten};
        const s = brow.score;
        const gegenlaeufig = (brow.richtung === 'short') === (basis.richtung === 'long')
                          && brow.richtung != null;
        if (gegenlaeufig){ urteil = 'GEGEN DIE THESE'; kl = 'bad'; }
        else if (s >= 52){ urteil = 'HALTEN'; kl = 'gut'; }   // nie STRONG — mit Hebel nie
        else if (s >= 40){ urteil = 'BEOBACHTEN'; kl = 'warn'; }
        else { urteil = 'REDUZIEREN'; kl = 'bad'; }
      }
    }
  }
  return {pos, row, kurs, wert, einstand, gv, gvPct, r, score, urteil, kl,
          live: !!live, w, basis, halt, hebel};
}

/* ================================================== AUSSTIEGSPLAN
   „Wenn ich reingehe und kaufe, soll er mir auch sagen, wann ich wieder verkaufe."

   Ein Einstiegssignal ohne Ausstiegsplan ist ein halbes Signal — und die schlechtere
   Haelfte. Die eigene Bilanz zeigt es schwarz auf weiss: mit Teilverkauf am ersten
   Ziel und Stop auf Einstand waeren aus −24,5 R nur −16,5 R geworden. Acht R
   Unterschied, allein durch das Verhalten NACH dem Einstieg.

   Deshalb wird der Plan beim Kauf mitgespeichert und hier bei jedem Kurs neu
   ausgerechnet. Er sagt genau einen naechsten Schritt — nicht fuenf Moeglichkeiten. */

function naechsterSchritt(pos, kurs){
  const pl = pos && pos.plan;
  if (!pl || kurs == null || !isFinite(kurs)) return null;
  const lang = (pl.richtung || 'long') === 'long';
  const erledigt = new Set(pos.erledigt || []);
  const erreicht = (ziel) => ziel != null && (lang ? kurs >= ziel : kurs <= ziel);
  const d = digits(kurs);
  const w = pl.waehrung === 'EUR' ? ' €' : (pl.waehrung === 'USDT' ? ' USDT' : '');

  // 1 — Stop zuerst. Wenn der gerissen ist, ist alles andere egal.
  if (pl.stop != null && (lang ? kurs <= pl.stop : kurs >= pl.stop)){
    return {stufe:'stop', titel:'Stop erreicht — raus',
      text:`Der Kurs steht bei ${num(kurs,d)}${w}, der Stop lag bei ${num(pl.stop,d)}${w}. `
        + 'Die Idee ist widerlegt. Verkaufen, nicht nachverhandeln — genau hier entstehen '
        + 'aus kleinen Verlusten grosse.'};
  }
  // 2 — Ziele der Reihe nach.
  const ziele = [['TP1', pl.tp1, 'ein Drittel'], ['TP2', pl.tp2, 'das zweite Drittel'],
                 ['TP3', pl.tp3, 'den Rest']];
  for (const [marke, ziel, teil] of ziele){
    if (ziel == null || erledigt.has(marke)) continue;
    if (erreicht(ziel)){
      const danach = marke === 'TP1'
        ? ' Danach den Stop auf deinen Einstieg ziehen — ab da kann der Trade nichts mehr kosten.'
        : (marke === 'TP2' ? ' Stop auf das erste Ziel nachziehen.' : ' Damit ist der Trade zu.');
      return {stufe:'ziel', marke, titel:`${marke} erreicht — ${teil} verkaufen`,
        text:`Kurs ${num(kurs,d)}${w}, Ziel war ${num(ziel,d)}${w}. ${teil.charAt(0).toUpperCase()+teil.slice(1)} `
          + 'verkaufen.' + danach};
    }
  }
  // 3 — Noch unterwegs: sagen, wohin und wie weit.
  const naechstes = ziele.find(([m,z]) => z != null && !erledigt.has(m));
  if (!naechstes){
    // Ein Plan, der nur aus einem Stop besteht, ist kein halber Plan — fuer eine
    // laufende Position ist er oft der ganze. „Kein Ziel" heisst dann nicht „fertig",
    // sondern: laufen lassen, solange der Stop haelt.
    if (pl.stop != null && !erledigt.size){
      const weg = Math.abs(kurs - pl.stop) / kurs * 100;
      return {stufe:'halten', titel:'Halten — Stop steht',
        text:`Kein festes Ziel, aber ein Stop bei ${num(pl.stop,d)}${w} — `
          + `${weg.toFixed(1).replace('.',',')} % entfernt. So lange laufen lassen und den `
          + 'Stop nachziehen, wenn der Kurs davonläuft. Verkauft wird, wenn der Stop fällt, '
          + 'nicht wenn es sich unangenehm anfühlt.'};
    }
    return {stufe:'fertig', titel:'Alle Ziele erreicht',
      text:'Es gibt keinen Plan mehr. Entweder schliessen oder bewusst neu entscheiden.'};
  }
  const [m, z] = naechstes;
  const wegZiel = Math.abs(z - kurs) / kurs * 100;
  const wegStop = pl.stop != null ? Math.abs(kurs - pl.stop) / kurs * 100 : null;
  return {stufe:'halten', titel:'Halten',
    text:`Bis ${m} sind es ${wegZiel.toFixed(1).replace('.',',')} %`
      + (wegStop != null ? `, bis zum Stop ${wegStop.toFixed(1).replace('.',',')} %` : '')
      + `. Verkauft wird bei ${num(z,d)}${w}, ausgestoppt bei ${pl.stop!=null?num(pl.stop,d)+w:'—'}. `
      + 'Nichts tun ist hier die Arbeit.'};
}

/* Ein Stop, den die App aus der laufenden Analyse ableiten kann — oder ehrlich: keiner.

   Positionen, die von Hand eingetragen wurden (also das ganze bestehende Depot), hatten
   bisher gar keinen Ausstiegsplan. Damit lief auch kein einziger Verkaufsalarm: die App
   konnte melden, wenn ein Stop faellt, nur hatte keine dieser Positionen einen.

   Erfunden wird hier nichts. Gibt die Analyse eine Invalidierung her, steht sie als
   Vorschlag da — zum Uebernehmen mit einem Klick. Gibt sie keine her, sagt die App das
   und laesst Ozan selbst eine Zahl eintragen. Ein selbst gesetzter Stop, den die App
   ueberwacht, ist unendlich viel mehr wert als ein ausgedachter. */
function stopVorschlag(b){
  const r = b.row || (b.basis && b.basis.row) || null;
  if (!r) return null;
  const um = (v) => v == null ? null : inPositionsWaehrung(r, v, b.pos);
  const stop = um(r.invalidierung);
  if (stop == null) return null;
  // Ein Vorschlag ueber dem aktuellen Kurs waere bei einer Long-Position Unsinn.
  if (b.kurs != null && stop >= b.kurs) return null;
  return {stop, tp1: um(r.ziel), tp2: um(r.tp2), tp3: um(r.tp3),
          vomBasiswert: !b.row && !!(b.basis && b.basis.row)};
}

/* ══════════════════════════════════════════════════════════════════════════════
   STOPS, DIE DIE APP SELBST SETZT — UND SELBST NACHZIEHT

   Ozan: „die Stopps sollst du auch selber erst mal analysieren und danach selber sagen,
   und er soll auch nachgezogen werden — meine eigenen Portfolio-Stops habe ich nie
   gesetzt."

   Das war der wahre Zustand: zehn Positionen ohne Stop. Die App hatte einen Vorschlag,
   aber er stand hinter einem Knopf, den niemand drueckte. Ein Vorschlag, den keiner
   annimmt, schuetzt nichts.

   Ab jetzt setzt die App den Stop selbst, sobald die Analyse einen hergibt, und zieht
   ihn nach. Zwei Regeln, die nie gebrochen werden:

     * Ein Stop wandert NUR nach oben (bei Short nur nach unten). Ein nachgebender Stop
       ist kein Stop, sondern eine Ausrede.
     * Die App rueckt nie an einen selbst gesetzten Stop, ohne es zu sagen. Was sie
       aendert, steht oben im Depot als Liste — denn beim Broker liegt die Order, nicht
       hier, und die muss Ozan von Hand nachziehen.

   Die Ehrlichkeit dazu: diese App fuehrt keine Orders aus. Ein Stop hier ist eine
   Ueberwachung mit Alarm, keine Order an der Boerse. Deshalb sagt die Liste nicht
   „erledigt", sondern „beim Broker nachziehen". */

// Unter diesem Schritt lohnt das Nachziehen die Ordergebuehr nicht.
const TRAIL_MIN_SCHRITT_PCT = 0.4;

function stopRichtungLang(pos){
  if (pos && pos.plan && pos.plan.richtung === 'short') return false;
  if (pos && pos.hebel_richtung === 'short') return false;
  return true;
}

/* Was mit dem Stop dieser Position zu geschehen hat — ohne etwas zu schreiben. */
function stopPflege(b){
  const pos = b.pos, kurs = b.kurs;
  if (kurs == null || !isFinite(kurs)) return {art:'ohne_kurs'};
  if (istBar(pos)) return {art:'bar'};
  const lang = stopRichtungLang(pos);
  const v = stopVorschlag(b);
  const pl = pos.plan || null;
  const hat = pl && pl.stop != null && isFinite(pl.stop);

  if (!hat){
    if (!v) return {art:'keiner'};
    return {art:'neu', stop:v.stop, tp1:v.tp1, tp2:v.tp2, tp3:v.tp3,
            vomBasiswert:v.vomBasiswert,
            grund:'die Analyse gibt eine Invalidierung her — die App setzt sie als Stop'};
  }

  const besser = (a, c) => lang ? a > c : a < c;   // „weiter in Sicherheit"
  let ziel = null, grund = '';

  // Ziel 1 durch → auf den Einstieg. Ab da kann der Trade nichts mehr kosten.
  const erledigt = new Set(pos.erledigt || []);
  if (erledigt.has('TP1') && pos.einstieg != null && besser(pos.einstieg, pl.stop)){
    ziel = pos.einstieg;
    grund = 'Ziel 1 ist abgehakt — ab dem Einstieg kann die Position nichts mehr kosten';
  }
  // Die Analyse hat ihre Invalidierung nachgezogen.
  if (v && besser(v.stop, ziel != null ? ziel : pl.stop)){
    ziel = v.stop;
    grund = 'die laufende Analyse hat ihre Invalidierung nachgezogen';
  }
  if (ziel == null) return {art:'steht', stop:pl.stop};
  // Niemals auf oder ueber den aktuellen Kurs — das waere ein sofortiger Verkauf.
  if (lang ? ziel >= kurs : ziel <= kurs) return {art:'steht', stop:pl.stop};
  if (Math.abs(ziel - pl.stop) / kurs * 100 < TRAIL_MIN_SCHRITT_PCT)
    return {art:'steht', stop:pl.stop};
  return {art:'nachziehen', von:pl.stop, stop:ziel, grund,
          selbst: pl.quelle === 'selbst'};
}

/* Einmal je Zeichendurchgang: setzen und nachziehen, und zurueckgeben, was passiert ist.
   Geschrieben wird nur, wenn sich wirklich etwas aendert — sonst wuerde der Speicher
   alle fuenf Sekunden ohne Not neu beschrieben. */
function stopsPflegen(bew){
  let a;
  try { a = ladePositionen(); } catch(e){ return []; }
  const geschehen = [];
  let geaendert = false;
  for (const b of bew){
    const p = stopPflege(b);
    if (!p || (p.art !== 'neu' && p.art !== 'nachziehen')) continue;
    const pos = a.find(x => posSchluessel(x) === posSchluessel(b.pos));
    if (!pos) continue;
    const alt = pos.plan && pos.plan.stop != null ? pos.plan.stop : null;
    pos.plan = {
      ...(pos.plan || {}),
      richtung: (pos.plan && pos.plan.richtung) || (stopRichtungLang(pos) ? 'long' : 'short'),
      waehrung: (pos.plan && pos.plan.waehrung) || posWaehrung(pos),
      stop: p.stop,
      // Ziele nur beim ERSTEN Setzen dazu — spaeter wuerden sie einen abgehakten
      // Teilverkauf wieder auferstehen lassen.
      ...(p.art === 'neu' ? {tp1:p.tp1 ?? null, tp2:p.tp2 ?? null, tp3:p.tp3 ?? null} : {}),
      quelle: (pos.plan && pos.plan.quelle === 'selbst') ? 'selbst_nachgezogen' : 'app',
      gesetzt: Date.now(),
      /* Offen, bis Ozan sagt, dass die Order beim Broker liegt.

         Zuerst stand die Liste nur in dem einen Zeichendurchgang da, in dem die Aenderung
         passierte. Das Depot zeichnet sich aber alle fuenf Sekunden neu und auch im
         Hintergrund — der Stop konnte also laengst gesetzt sein, bevor Ozan den Reiter
         ueberhaupt aufmacht. Dann haette die App brav einen Stop ueberwacht, den es beim
         Broker nie gab. Der Merker bleibt deshalb stehen, bis er abgehakt wird. */
      broker_offen: {von: alt, stop: p.stop, grund: p.grund || '', zeit: Date.now()},
    };
    geaendert = true;
    geschehen.push({b, art:p.art, von:alt, stop:p.stop, grund:p.grund, selbst:!!p.selbst});
  }
  if (geaendert) speicherePositionen(a);
  return geschehen;
}

/* Die Liste oben im Depot. Sie ist die Handlungsanweisung an den Broker — ohne sie
   waere der schoenste nachgezogene Stop eine Zahl, die nur in dieser App existiert. */
function stopKasten(geschehen, bew){
  const offen = bew.filter(b => {
    const p = stopPflege(b);
    return p && p.art === 'keiner';
  });
  // Nicht aus ``geschehen`` — sondern aus dem, was noch nicht abgehakt ist.
  const broker = bew.filter(b => b.pos.plan && b.pos.plan.broker_offen);
  if (!broker.length && !offen.length) return '';
  let h = '';
  if (broker.length){
    h += `<div class="note-box warn" style="margin:10px 0 0">
      <span class="nt">Beim Broker eintragen</span>
      <p style="font-size:13.5px"><strong>Die App hat ${broker.length}
      ${broker.length===1?'Stop':'Stops'} gesetzt beziehungsweise nachgezogen.</strong>
      Sie überwacht sie ab sofort und meldet sich, wenn einer fällt — <strong>aber die
      Order liegt bei deinem Broker, nicht hier.</strong> Solange sie dort nicht liegt,
      schützt nur der Alarm, und der braucht dich. Diese Marken gehören eingetragen:</p>
      ${broker.map(b => {
        const o = b.pos.plan.broker_offen;
        const d = digits(b.kurs || o.stop || 1);
        const z = waehrungsZeichen(b.w);
        return `<p style="margin:8px 0 0;font-size:13px">
          <strong>${esc(posName(b))}</strong> — Stop ${o.von != null
            ? `von ${num(o.von,d)}${z} auf <strong>${num(o.stop,d)}${z}</strong> nachziehen`
            : `neu auf <strong>${num(o.stop,d)}${z}</strong>`}
          <span style="color:var(--ink-3)">· ${esc(o.grund||'')}</span>
          <button class="btn" data-brokerok="${esc(posSchluessel(b.pos))}"
                  style="margin-left:8px;padding:3px 9px;font-size:12px">eingetragen</button></p>`;
      }).join('')}
      <p style="margin:10px 0 0"><button class="btn" id="pf_broker_alle">Alle eingetragen</button></p>
    </div>`;
  }
  if (offen.length){
    h += `<div class="note-box" style="margin:10px 0 0">
      <span class="nt">Ohne Stop — und die App kann hier keinen ableiten</span>
      <p style="font-size:13px">${offen.map(b=>esc(posName(b))).join(', ')}.
      Für diese Werte gibt die Analyse gerade keine Invalidierung her, also erfindet die
      App auch keine. Trag unten auf der Karte selbst eine Marke ein — ein eigener Stop,
      den die App überwacht, ist unendlich viel mehr wert als ein ausgedachter.</p></div>`;
  }
  return h;
}

function ausstiegsKasten(b){
  const schritt = naechsterSchritt(b.pos, b.kurs);
  if (!schritt){
    // Ohne Kurs kein Stop: bei einem Turbo oder einem ETF, der hier nur mit dem von Hand
    // eingetragenen Wert steht, waere eine Stopmarke eine Zahl ohne Gegenstueck.
    if (b.kurs == null){
      return `<div class="note-box" style="margin:10px 0 0"><span class="nt">Kein Ausstiegsplan</span>
        <p>Für diesen Posten hat die App keinen laufenden Kurs — nur den Wert, den du
        eingetragen hast. Einen Stop kann sie deshalb nicht überwachen.
        ${b.basis && b.basis.sym ? `Was sie kann: dir sagen, wenn <strong>${esc(name(b.basis.sym))}</strong>
        als Basiswert kippt — das steht oben im Urteil.` : ''}</p></div>`;
    }
    const v = stopVorschlag(b);
    const d = digits(b.kurs || 1);
    const z = waehrungsZeichen(b.w);
    const sym = esc(b.pos.sym);
    const vorschlag = v ? `<p style="margin:6px 0 0">Aus der laufenden Analyse
        ${v.vomBasiswert ? '<em>des Basiswerts</em> ' : ''}ergibt sich:
        <strong>Stop ${num(v.stop,d)}${z}</strong>${v.tp1!=null?` · Ziel ${num(v.tp1,d)}${z}`:''}
        ${v.tp2!=null?` / ${num(v.tp2,d)}${z}`:''}${v.tp3!=null?` / ${num(v.tp3,d)}${z}`:''}
        ${v.vomBasiswert ? '<br><span style="color:var(--ink-3)">Achtung: das sind die Marken des '
          + 'Basiswerts. Für einen gehebelten Schein liegen sie anders — nur als Orientierung.</span>' : ''}</p>
      <p style="margin:8px 0 0"><button class="btn" data-plan="${sym}"
         data-stop="${v.stop}" data-tp1="${v.tp1==null?'':v.tp1}"
         data-tp2="${v.tp2==null?'':v.tp2}" data-tp3="${v.tp3==null?'':v.tp3}">Vorschlag übernehmen</button></p>`
      : `<p style="margin:6px 0 0">Die Analyse gibt hier gerade <strong>keine</strong>
         Invalidierung her — also erfindet die App auch keine. Setz den Stop dahin, wo der
         Grund, aus dem du gekauft hast, nicht mehr gilt.</p>`;
    return `<div class="note-box warn" style="margin:10px 0 0"><span class="nt">Kein Ausstiegsplan</span>
      <p>Diese Position hat keinen Stop — und damit meldet sich die App bei ihr auch nicht,
      wenn es eng wird. Das ist die wichtigste Lücke in deinem Depot.</p>
      ${vorschlag}
      <p style="margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <label style="font-size:12.5px;color:var(--ink-2)">eigener Stop</label>
        <input type="number" step="any" inputmode="decimal" data-stopfeld="${sym}"
               placeholder="${b.kurs!=null?num(b.kurs*0.9,d):'Preis'}"
               style="width:120px;padding:5px 7px;border:1px solid var(--linie);border-radius:6px;
                      background:var(--flaeche);color:var(--ink)">
        <label style="font-size:12.5px;color:var(--ink-2)">Ziel (optional)</label>
        <input type="number" step="any" inputmode="decimal" data-zielfeld="${sym}"
               style="width:120px;padding:5px 7px;border:1px solid var(--linie);border-radius:6px;
                      background:var(--flaeche);color:var(--ink)">
        <button class="btn" data-stopsetzen="${sym}">Stop speichern</button>
      </p></div>`;
  }
  const farbe = schritt.stufe === 'stop' ? 'bad' : (schritt.stufe === 'halten' ? '' : 'warn');
  const pl = b.pos.plan || {};
  const d = digits(b.kurs || 1);
  const w = pl.waehrung === 'EUR' ? ' €' : (pl.waehrung === 'USDT' ? ' USDT' : '');
  const marken = [['Stop', pl.stop], ['TP1', pl.tp1], ['TP2', pl.tp2], ['TP3', pl.tp3]]
    .filter(([,v]) => v != null)
    .map(([k,v]) => `<span>${k} <b>${num(v,d)}${w}</b></span>`).join('');
  const knopf = schritt.marke
    ? `<p style="margin:9px 0 0"><button class="btn" data-erledigt="${esc(b.pos.sym)}"
         data-marke="${esc(schritt.marke)}">${esc(schritt.marke)} verkauft — abhaken</button></p>`
    : '';
  return `<div class="note-box ${farbe}" style="margin:10px 0 0">
    <span class="nt">Was jetzt zu tun ist</span>
    <p style="font-size:14px;margin:0 0 4px"><strong>${esc(schritt.titel)}</strong></p>
    <p style="margin:0">${esc(schritt.text)}</p>
    <div class="kpi" style="margin-top:8px">${marken}</div>${knopf}</div>`;
}

/* ================================================ URTEIL JE POSITION
   „Analysier auch immer mein Portfolio — ob ich rausgehen soll oder reingehen."

   Der Scanner bewertet den Chart. Eine gehaltene Position braucht aber eine andere
   Frage als eine Chance: nicht „ist das ein guter Einstieg", sondern „wuerde ich das
   heute nochmal kaufen". Das ist dieselbe Information, anders herum gelesen — und sie
   faellt bei jedem Scan neu an, ohne dass jemand etwas anklicken muss.

   Was hier NICHT passiert: automatisch verkaufen, und so tun, als waere ein Score eine
   Anweisung. Jeder Satz sagt, worauf er beruht. */
function positionsRat(b){
  const r = b.row;
  const pos = b.pos;
  const gv = b.gvPct;
  const saetze = [];
  let stufe = 'neutral';

  if (!r){
    const ba = b.basis;
    if (ba && ba.art === 'turbo' && ba.row){
      const br = ba.row;
      const saetze = [
        `Der Schein selbst laesst sich nicht scannen — sein Basiswert schon. `
        + `${name(ba.sym)} steht bei Score ${br.score.toFixed(0)} (Note ${br.note}): `
        + `${br.headline || 'kein klares Bild'}.`];
      if (br.score >= 52) saetze.push('Solange der Basiswert traegt, traegt auch der Schein — '
        + 'nur schneller in beide Richtungen.');
      else if (br.score >= 40) saetze.push('Der Basiswert traegt nicht mehr richtig. Mit Hebel '
        + 'ist das frueher ein Problem als ohne: dieselbe Seitwaertsbewegung kostet hier Geld, '
        + 'weil der Schein Zeit und Abstand zur Schwelle verliert.');
      else saetze.push('Der Basiswert ist schwach. Ein gehebelter Schein auf einen schwachen '
        + 'Basiswert ist die Kombination, bei der aus einem Minus sehr schnell ein Totalverlust '
        + 'wird — die Knock-out-Schwelle wartet nicht auf eine Erholung.');
      saetze.push('Wichtig: Stop und Ziele des Basiswerts sind NICHT die des Scheins. Der Hebel '
        + 'verschiebt jeden Abstand, und die genaue Schwelle steht nur im Papier des Emittenten.');
      if (ba.geraten) saetze.push('(Basiswert automatisch aus dem Namen erkannt — wenn das nicht '
        + 'stimmt, trag die Position mit dem richtigen Kuerzel neu ein.)');
      const stufe = br.score >= 52 ? 'gut' : (br.score >= 40 ? 'warn' : 'bad');
      return {stufe, kopf: 'Ueber den Basiswert ' + name(ba.sym), saetze};
    }
    if (ba && ba.art === 'breit'){
      const a = ba.breite.anteil;
      const saetze = [
        `Ein Welt-ETF hat keinen einzelnen Basiswert — er ist der Markt. Gemessen wird er `
        + `deshalb an der Marktbreite: ${ba.breite.oben} von ${ba.breite.n} gescannten Aktien `
        + `stehen ueber ihrem Stand von vor einem Quartal (${a.toFixed(0)} %).`];
      saetze.push(a >= 60
        ? 'Das ist ein breiter Markt. Genau dafuer ist so ein ETF da: er braucht keine einzelne '
          + 'Aktie, die funktioniert, sondern nur die Mehrheit.'
        : a >= 35
        ? 'Das ist ein gespaltener Markt — es traegt, aber es traegt nicht breit. Halten ist hier '
          + 'meist richtiger als handeln; ein Welt-ETF ist kein Instrument fuer Timing.'
        : 'Die Mehrheit faellt. Das ist der eine Fall, in dem auch ein Welt-ETF nicht diversifiziert '
          + 'ist — in einem breiten Abschwung faellt er mit.');
      saetze.push('Und der Punkt, der dabei oft untergeht: ein Welt-ETF ist der Teil des Depots, '
        + 'der NICHT beobachtet werden muss. Er ist die Gegenposition zu allem anderen hier.');
      const stufe = a >= 60 ? 'gut' : (a >= 35 ? 'neutral' : 'warn');
      return {stufe, kopf:'Ueber die Marktbreite', saetze};
    }
    return {stufe:'unbekannt', kopf:'Keine Bewertung',
      saetze:[ (pos.wert_manuell != null)
        ? 'Dieser Posten steht nicht im gescannten Universum und hat auch keinen erkennbaren '
          + 'Basiswert. Wert und Einstand hast du eingetragen, mehr kann die App dazu '
          + 'ehrlicherweise nicht sagen.'
        : 'Der Wert war im letzten Scan nicht dabei. Entweder ausserhalb des Universums '
          + 'oder die Datenquelle war stumm.' ]};
  }

  const h = b.halt || haltUrteil(r);
  const gegen = r.richtung === 'short';
  const score = r.score;
  const klasse = r.klasse === 'aktien' ? 'Aktien' : (r.klasse === 'krypto' ? 'Coins' : 'Werte');

  if (h && h.rs != null){
    const rs = h.rs;
    const monat = h.ren.r21, quartal = h.ren.r63;
    const lauf = [];
    if (monat != null) lauf.push(`${monat>=0?'+':''}${monat.toFixed(0)} % im letzten Monat`);
    if (quartal != null) lauf.push(`${quartal>=0?'+':''}${quartal.toFixed(0)} % im Quartal`);
    if (rs >= RS_FUEHRER){
      stufe = 'gut';
      saetze.push(`Läuft besser als ${rs.toFixed(0)} % der gescannten ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Relative Stärke hält meist über Wochen '
        + 'an — das ist die Position, die man am wenigsten anfassen sollte.');
    } else if (rs >= RS_MITTE){
      stufe = 'gut';
      saetze.push(`Mittelfeld: besser als ${rs.toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Kein Grund auszusteigen, aber auch keiner '
        + 'nachzulegen.');
    } else if (rs >= RS_SCHWACH){
      stufe = 'warn';
      saetze.push(`Nachzügler: nur besser als ${rs.toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Wenn der Rest der Klasse läuft und dieser '
        + 'Wert nicht, gibt es dafür meistens einen Grund. Beobachten, nicht nachkaufen.');
    } else {
      stufe = 'bad';
      saetze.push(`Schlusslicht: schwächer als ${(100-rs).toFixed(0)} % der ${klasse}`
        + (lauf.length?` (${lauf.join(', ')})`:'') + '. Genau hier liegt totes Kapital am längsten. '
        + 'Die ehrliche Frage ist nicht „kommt es zurück", sondern: würdest du das heute nochmal '
        + 'kaufen — und wenn nein, warum hältst du es dann?');
    }
  } else if (h){
    stufe = h.kl === 'bad' ? 'bad' : (h.kl === 'warn' ? 'warn' : 'gut');
    saetze.push('Für einen Vergleich mit der eigenen Klasse fehlt die Historie — '
      + (h.grund || 'zu wenig Daten') + '.');
  }

  if (gegen){
    if (stufe === 'gut') stufe = 'warn';
    saetze.push('Dazu kommt: die Analyse sieht hier gerade ein Setup nach UNTEN. Du hältst '
      + 'also gegen die Richtung, die das System sieht. Kein Verkaufsbefehl — aber der Moment, '
      + 'in dem ein Stop im Depot stehen sollte.');
  }
  if (score != null){
    saetze.push(score >= 52
      ? `Einstiegsseite: Score ${score.toFixed(0)} (Note ${r.note}) — hier wäre heute sogar ein `
        + 'Zukauf vertretbar.'
      : `Einstiegsseite: Score ${score.toFixed(0)} — kein frisches Setup. Das ist eine Aussage `
        + 'über den Einstieg, nicht über das Halten; für einen Zukauf fehlt gerade der Anlass.');
  }

  if (gv != null && gv <= -20){
    saetze.push(`Du liegst ${gv.toFixed(0)} % im Minus. Die Frage ist nicht, wann es `
      + 'zurueckkommt, sondern ob dieselbe These heute noch gilt. Ein Verlust wird nicht '
      + 'dadurch kleiner, dass man ihn aussitzt.');
  } else if (gv != null && gv >= 20){
    saetze.push(`${gv.toFixed(0)} % im Plus. Wenn es kein Ziel gibt, gibt es auch keinen `
      + 'Grund auszusteigen — aber dann gehoert wenigstens ein nachgezogener Stop hin, '
      + 'damit aus dem Gewinn nicht wieder eine Null wird.');
  }
  if ((r.warnungen||[]).length) saetze.push('Dagegen: ' + r.warnungen.slice(0,2).join(' · '));

  const kopf = {gut:'Halten', warn:'Beobachten', bad:'Reduzieren erwaegen',
                neutral:'Halten', unbekannt:'Keine Bewertung'}[stufe];
  return {stufe, kopf, saetze};
}

/* Die Zahlen des Basiswerts — sichtbar getrennt von den Zahlen der Position, damit
   niemand den Stop von TSMC fuer den Stop seines Scheins haelt. */
/* Die Zahlen, die bei einem Schein wirklich zaehlen: Hebel und Puffer. Der Scheinpreis
   ist Rechnung, kein Kurs vom Emittenten — das steht auch so da. */
function hebelKasten(b){
  const h = b.hebel;
  if (!h) return '';
  if (h.art === 'margin'){
    const eng = h.puffer_pct < KO_PUFFER_ENG;
    const d = digits(h.liquidation || 1);
    const z = waehrungsZeichen(b.w);
    return `<div class="note-box ${h.ausgeknockt ? 'bad' : (h.puffer_pct < KO_PUFFER_KRITISCH ? 'bad' : (eng ? 'warn' : ''))}"
      style="margin:10px 0 0">
      <span class="nt">Gehebelt · ${h.hebel.toFixed(0)}×</span>
      <div class="kpi">
        <span>Hebel <b>${h.hebel.toFixed(0)}×</b></span>
        <span>Puffer bis Liquidation <b class="${eng?'dn':'up'}">${h.puffer_pct.toFixed(1).replace('.',',')} %</b></span>
        <span>rechnerisch bei <b>${num(h.liquidation,d)}${z}</b></span>
        ${h.einsatz?`<span>eigener Einsatz <b>${num(h.einsatz,2)}${z}</b></span>`:''}
      </div>
      <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">Bei ${h.hebel.toFixed(0)}×
      reicht eine Bewegung von rund ${(100/h.hebel).toFixed(0)} % gegen dich, um den Einsatz
      aufzubrauchen — die Börse schließt dann selbst. Die Marke ist gerechnet, nicht von Bybit
      abgelesen: Gebühren und Erhaltungsmarge schieben sie etwas nach oben, ein Nachschuss nach
      unten. <strong>Der Gewinn in Dollar hängt an der Stückzahl, das Risiko am Hebel.</strong></p>
    </div>`;
  }
  if (h.ausgeknockt) return `<div class="note-box bad" style="margin:10px 0 0">
    <span class="nt">Knock-out berührt</span>
    <p>${esc(h.basisName)} steht bei ${num(h.basisKurs, digits(h.basisKurs))}, die Schwelle
    lag bei ${num(h.ko, digits(h.ko))}. Der Schein ist damit verfallen.</p></div>`;
  const eng = h.puffer_pct < KO_PUFFER_ENG;
  const d = digits(h.basisKurs);
  return `<div class="note-box ${h.puffer_pct < KO_PUFFER_KRITISCH ? 'bad' : (eng ? 'warn' : '')}"
    style="margin:10px 0 0">
    <span class="nt">Hebel · ${esc(h.basisName)}</span>
    <div class="kpi">
      <span>Hebel <b>${h.hebel.toFixed(1)}×</b></span>
      <span>Puffer bis Knock-out <b class="${eng?'dn':'up'}">${h.puffer_pct.toFixed(1).replace('.',',')} %</b></span>
      <span>Basiswert <b>${num(h.basisKurs,d)}</b></span>
      <span>Schwelle <b>${num(h.ko,d)}</b></span>
    </div>
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">Der Puffer sagt, wie weit
    ${esc(h.basisName)} fallen darf, bevor der Schein <strong>wertlos verfällt</strong> — nicht
    ins Minus läuft, sondern weg ist. Ein Stop hilft dagegen nicht, die Schwelle greift auch
    nachts. Der Scheinpreis hier ist aus Basiswert und Schwelle gerechnet; der Emittent rechnet
    zusätzlich Aufgeld und Finanzierungskosten, dein Depot zeigt also ein paar Cent daneben.</p>
  </div>`;
}

function basisKasten(b){
