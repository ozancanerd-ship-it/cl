function depotGrafik(stand){
  const {bew, inEuro, gesamt} = stand;
  if (!bew.length || !(gesamt > 0)) return '';
  const je = new Map(); let bar = 0;
  for (const b of bew){
    const eu = inEuro(b, b.wert) || 0; if (eu <= 0) continue;
    const k = KONTO_NAME[kontoNorm(b.pos.konto)] || String(b.pos.konto || 'ohne Konto');
    const e = je.get(k) || {anlage: 0, bar: 0};
    if (istBar(b.pos)){ e.bar += eu; bar += eu; } else e.anlage += eu;
    je.set(k, e);
  }
  const farben = ['var(--accent-2)', 'var(--long)', 'var(--warn)', 'var(--accent)'];
  const konten = [...je.entries()].sort((a, b2) => (b2[1].anlage + b2[1].bar) - (a[1].anlage + a[1].bar));
  const pc = v => (v / gesamt * 100);
  const segs = konten.map(([k, e], i) => `<i class="dg-s" style="width:${pc(e.anlage + e.bar).toFixed(2)}%;background:${farben[i % farben.length]}"
      title="${esc(k)}: ${num(e.anlage + e.bar, 0)} €"></i>`).join('');
  const leg = konten.map(([k, e], i) => `<span><i style="background:${farben[i % farben.length]}"></i>${esc(k)}
      <b>${num(e.anlage + e.bar, 0)} €</b> · ${pc(e.anlage + e.bar).toFixed(0)} %${e.bar > 0.5 ? ` <span class="nu">(davon ${num(e.bar, 0)} € Bargeld)</span>` : ''}</span>`).join('');
  const zeilen = bew.filter(b => !istBar(b.pos) && b.gv != null)
    .map(b => ({n: posName(b), k: KONTO_NAME[kontoNorm(b.pos.konto)] || '', eu: inEuro(b, b.gv) || 0}))
    .sort((a, b2) => b2.eu - a.eu);
  // Derselbe Wert auf zwei Konten (Fetch.ai bei Trade Republic und Kraken): Konto dazuschreiben.
  const anz = new Map(); for (const z of zeilen) anz.set(z.n, (anz.get(z.n) || 0) + 1);
  for (const z of zeilen) if (anz.get(z.n) > 1 && z.k) z.n += ' · ' + z.k;
  const mx = Math.max(1, ...zeilen.map(z => Math.abs(z.eu)));
  const balken = zeilen.map(z => `<div class="dg-r"><span class="dg-n">${esc(z.n)}</span>
      <span class="dg-b"><i class="${z.eu >= 0 ? 'plus' : 'minus'}" style="${z.eu >= 0 ? 'left:50%' : `right:50%`};width:${(Math.abs(z.eu) / mx * 50).toFixed(1)}%"></i></span>
      <span class="dg-v ${z.eu >= 0 ? 'up' : 'dn'}">${z.eu >= 0 ? '+' : '−'}${num(Math.abs(z.eu), Math.abs(z.eu) < 100 ? 1 : 0)} €</span></div>`).join('');
  return `<h2>Grafik</h2>
    <div class="karte"><h3 style="margin-bottom:8px">Wo dein Geld liegt</h3>
      <div class="dg-bar">${segs}</div><div class="dg-leg">${leg}</div>
      ${bar > 0 ? `<p class="nu" style="font-size:12px;margin:6px 0 0">Bargeld insgesamt ${num(bar, 0)} € (${pc(bar).toFixed(0)} % des Depots) — Pulver für neue Chancen, aber ohne Rendite.</p>` : ''}
    </div>
    <div class="karte"><h3 style="margin-bottom:8px">Was jede Position seit Kauf gebracht hat</h3>
      <div class="dg">${balken}</div>
      <p class="nu" style="font-size:11.5px;margin:6px 0 0">Euro, nicht Prozent — so siehst du, was wirklich Geld bewegt hat. Turbos mit geschätzter Stückzahl und eingetragene Werte sind Näherungen.</p>
    </div>`;
}

/* ============================================================ STRESSTEST (seit 07.10.)
   Master-Prompt-Frage: „Was passiert mit meinem Depot, wenn BTC −10 % macht?" Gerechnet
   aus der vorhandenen 90-Tage-Messung (Tagesrenditen je Wert, ``S.gleichlauf``), nicht
   geschätzt: Beta = Korrelation × Schwankung(Wert) ÷ Schwankung(Faktor). Faktoren: Bitcoin
   und ein Aktienkorb (Apple, Microsoft, Alphabet, Amazon, Meta, NVIDIA, gleich gewichtet).
   Hebel: ein Schein verliert höchstens seinen Einsatz (Knock-out), Margin höchstens das
   eigene Geld (Liquidation). Beta ist eine Durchschnittszahl der letzten 90 Tage — in
   einem echten Absturz laufen Werte meist gleichlaufender als gemessen. Die Zahlen sind
   deshalb eher zu mild als zu hart. */
const ST_KORB = ['AAPL','MSFT','GOOGL','AMZN','META','NVDA'];
function stBeta(nm, faktor){
  const sd = glVola(nm); if (sd == null) return null;
  if (faktor === 'BTCUSD'){
    const sf = glVola('BTCUSD'), k = glKorr(nm, 'BTCUSD');
    return (sf && k != null) ? k * sd / sf : null;
  }
  const namen = ST_KORB.filter(x => glVola(x) != null && glVektoren() && glVektoren().has(x));
  if (namen.length < 3) return null;
  let cov = 0, varK = 0;
  for (const a of namen){
    const ka = glKorr(nm, a); if (ka == null) return null;
    cov += ka * sd * glVola(a);
    for (const b2 of namen){ const kb = glKorr(a, b2); if (kb == null) return null; varK += kb * glVola(a) * glVola(b2); }
  }
  cov /= namen.length; varK /= namen.length * namen.length;
  return varK > 0 ? cov / varK : null;
}
/* ============================================== PRODUKTDATEN-CHECK + GEMEINSAMES RISIKO (seit 17.10.)
   Ozan, 17.10.: Jeder Hebelschein braucht Basiswert, Kennung, Bezugsverhaeltnis, Stueckzahl,
   Einstiegskurs, aktuellen Scheinkurs und Knock-out — und was fehlt, muss SICHTBAR fehlen.
   Ein Basiswert wird nicht aus einem Logo oder einem Namen festgelegt: nur, was du eingetragen
   hast, gilt als gesetzt; Geratenes steht als „geraten, nicht bestaetigt" da. */
function produktCheck(b){
  const pos = b.pos, ph = !!pos.platzhalter;
  const bv = basisVon(pos);
  const felder = [];
  const add = (feld, ok, text) => felder.push({feld, ok, text});
  add('Basiswert', !!pos.basis, pos.basis ? esc(String(pos.basis).toUpperCase()) + ' (von dir eingetragen)'
      : (pos.basis_vorschlag ? 'UNGEKLÄRT — Vorschlag ' + esc(String(pos.basis_vorschlag)) + ' (nicht bestätigt, nicht in der Rechnung)'
      : (bv && bv.geraten ? 'geraten: ' + esc(bv.sym) + ' — nicht bestätigt' : 'UNGEKLÄRT')));
  add('ISIN', !!isinNorm(pos.isin), isinNorm(pos.isin) || 'fehlt');
  add('Bezugsverhältnis', scheinTeiler(pos) != null, scheinTeiler(pos) != null ? 'eingetragen'
      : (b.hebel && b.hebel.ratio != null ? 'nicht eingetragen — aus deinem Wert abgeleitet (≈ ' + num(b.hebel.ratio, 1) + '), bitte aus den Produktdetails prüfen' : 'fehlt'));
  add('Stückzahl', Number(pos.menge) > 0 && !ph, ph ? 'Platzhalter (1 = ganze Position)' : (Number(pos.menge) > 0 ? num(pos.menge, 4) : 'fehlt'));
  add('Einstiegskurs je Schein', pos.einstieg != null && !ph, ph ? 'Platzhalter (Einsatz der ganzen Position)' : (pos.einstieg != null ? num(pos.einstieg, 2) : 'fehlt'));
  const sk = b.hebel && b.hebel.schein != null && !b.hebel.ausgeknockt ? b.hebel.schein : null;
  add('Aktueller Scheinkurs', sk != null, sk != null ? num(sk, 3) + ' (gerechnet aus Basiswert)' : 'fehlt (braucht Basiswert + Bezugsverhältnis)');
  add('Knock-out', pos.ko != null && Number(pos.ko) > 0, pos.ko != null ? num(pos.ko, 2) + (pos.ko_bestaetigt ? '' : ' (als Schwelle gelesen, Bedeutung von „Long X“ unbestätigt)') : 'fehlt');
  return felder;
}
function produktdatenKasten(){
  const st = depotStand(); if (!st) return '';
  const scheine = st.bew.filter(b => istSchein(b.pos));
  if (!scheine.length) return '';
  const zeilen = scheine.map(b => ({b, f: produktCheck(b)}));
  const fehlt = zeilen.reduce((s, z) => s + z.f.filter(x => !x.ok).length, 0);
  return `<h2>Produktdaten der Hebelscheine</h2><div class="karte ${fehlt ? 'warn' : 'gut'}">
    <p style="margin:0 0 8px;font-size:13.5px"><strong>${fehlt ? fehlt + ' Angabe' + (fehlt === 1 ? '' : 'n') + ' fehlen oder sind unbestätigt' : 'Alles erfasst'}</strong>
      bei ${scheine.length} Schein${scheine.length === 1 ? '' : 'en'}. Was fehlt, wird nicht geschätzt — die Rechnungen
      (Scheinpreis, Gewinn, Gewinnschutz) laufen dann nur, soweit die Daten reichen.</p>
    <div class="tw"><table class="mtf" style="font-size:12.5px"><thead><tr><th>Schein</th><th>Fehlt / unbestätigt</th></tr></thead><tbody>
    ${zeilen.map(({b, f}) => { const off = f.filter(x => !x.ok);
      return `<tr><td>${esc(posName(b))}<br><span class="nu" style="font-size:11px">${esc(b.pos.sym)}</span></td>
        <td>${off.length ? off.map(x => `<span class="dn">${esc(x.feld)}</span>: ${x.text}`).join('<br>') : '<span class="up">vollständig</span>'}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
}

const GR_SCHOCKS = [-5, -10, -15, -20, -30];
function gemeinsamesRisikoKasten(stand){
  const {bew, inEuro, gesamt} = stand;
  if (!bew.length || !(gesamt > 0)) return '';
  const teile = []; let sonstige = 0;
  for (const b of bew){
    const eu = inEuro(b, b.wert) || 0;
    if (istBar(b.pos)){ continue; }
    if (istSchein(b.pos)){
      const h = b.hebel;
      const ok = h && !h.ausgeknockt && h.basisKurs > 0 && h.ko > 0;
      teile.push({b, eu, art:'schein', ok, lang: ok ? h.lang !== false : true,
                  K: ok ? h.basisKurs : null, KO: ok ? h.ko : null, puffer: ok ? h.puffer_pct : null,
                  tag: ok && h.basisSym ? h.basisSym : null});
    } else if (b.row && b.row.klasse === 'aktien'){
      teile.push({b, eu, art:'aktie', ok:true, lang: !istKurzDirekt(b.pos), puffer:null});
    } else sonstige += eu;
  }
  if (!teile.length) return '';
  const usEU = teile.filter(t => t.ok).reduce((s, t) => s + t.eu, 0);   // nur, was ein bekannter Basiswert belegt
  const scheinEU = teile.filter(t => t.art === 'schein').reduce((s, t) => s + t.eu, 0);
  const unbek = teile.filter(t => t.art === 'schein' && !t.ok);
  const unbekEU = unbek.reduce((s, t) => s + t.eu, 0);
  const zeilen = GR_SCHOCKS.map(sch => {
    let verlust = 0; const ko = [];
    for (const t of teile){
      if (!t.ok) continue;
      const s = sch / 100;
      let f;
      if (t.art === 'aktie') f = t.lang ? 1 + s : 1 - s;
      else if (t.lang) f = Math.max(0, (t.K * (1 + s) - t.KO) / (t.K - t.KO));
      else f = Math.max(0, (t.KO - t.K * (1 - s)) / (t.KO - t.K));
      if (t.art === 'schein' && f <= 0) ko.push(posName(t.b));
      verlust += t.eu * (f - 1);
    }
    return {sch, verlust, ko};
  });
  const kos = teile.filter(t => t.art === 'schein' && t.ok).sort((a, c) => a.puffer - c.puffer);
  const pr = v => (v / gesamt * 100).toFixed(1).replace('.', ',') + ' %';
  const bekannteBasen = new Set(teile.filter(t => t.tag).map(t => t.tag));
  return `<h2>Gemeinsames Risiko</h2><div class="karte">
    <p style="margin:0 0 6px;font-size:13.5px">
      <strong>${num(usEU, 0)} € (${pr(usEU)} vom Depot)</strong> hängen belegbar am US-Aktienmarkt — Aktien und Scheine mit bekanntem Basiswert.
      Davon sind <strong>${num(scheinEU - unbekEU, 0)} €</strong> Hebelscheine.${unbek.length ? ` Zusätzlich gibt es <strong>${unbek.length}</strong>
      Schein${unbek.length === 1 ? '' : 'e'} (${num(unbekEU, 0)} €, ${pr(unbekEU)}) mit unbekanntem Basiswert oder Knock-out: die sind weder hier noch in der Tabelle
      enthalten — im ungünstigen Fall ist der Einsatz weg.` : ''}
      Die Positionen laufen im Absturz gemeinsam; als Annahme gilt hier ein <em>gleichzeitiger</em> Rückgang
      aller Basiswerte um denselben Prozentsatz (Beta 1, Korrelation 1 — bewusst pessimistisch, nicht gemessen).</p>
    <div class="tw"><table class="mtf" style="font-size:13px"><thead><tr><th>Basiswerte fallen um</th>
      <th style="text-align:right">Verlust (berechenbar)</th><th style="text-align:right">in % Depot</th></tr></thead><tbody>
    ${zeilen.map(z => `<tr><td>${z.sch} %${z.ko.length ? `<br><span class="dn" style="font-size:11.5px"><b>Knock-out:</b> ${z.ko.map(esc).join(', ')}</span>` : ''}</td>
      <td style="text-align:right" class="dn"><b>−${num(Math.abs(z.verlust), 0)} €</b></td>
      <td style="text-align:right">${pr(z.verlust)}</td></tr>`).join('')}
    </tbody></table></div>
    ${kos.length ? `<h3 style="margin:10px 0 4px;font-size:13.5px">Abstand zum Knock-out</h3>
    <div class="tw"><table class="mtf" style="font-size:12.5px"><thead><tr><th>Schein</th><th style="text-align:right">Puffer</th><th style="text-align:right">Hebel</th></tr></thead><tbody>
    ${kos.map(t => `<tr><td>${esc(posName(t.b))}</td><td style="text-align:right" class="${t.puffer < 12 ? 'dn' : ''}">${num(t.puffer, 1)} %</td>
      <td style="text-align:right">${t.b.hebel.hebel ? num(t.b.hebel.hebel, 1) + '×' : '—'}</td></tr>`).join('')}
    </tbody></table></div>` : ''}
    <p class="nu" style="font-size:11.5px;margin:8px 0 0">Gerechnet ohne Finanzierungskosten, Spread und Kurslücken über Nacht: ein Schein kann
      <b>über</b> die Knock-out-Schwelle hinaus fallen, bevor der Emittent ihn schließt. Basiswerte im Szenario: ${bekannteBasen.size ? [...bekannteBasen].map(esc).join(', ') : 'nur direkt gehaltene Aktien'}.
      ${sonstige > 0 ? `Nicht im Szenario: ${num(sonstige, 0)} € in Krypto, Gold und sonstigem.` : ''}
      Ein Index-Schein auf den S&P 500 rechnet mit dem Vortagesschluss, nicht live.</p></div>`;
}

function stresstest(stand){
  const schocks = [['BTCUSD', -5], ['BTCUSD', -10], ['KORB', -3], ['KORB', -5]];
  const zeilen = [];
  const teile = [];
  let unbekannt = 0;
  for (const b of stand.bew){
    if (istBar(b.pos)) continue;
    const gw = glGewicht(b, stand); if (!gw) continue;
    const nm = glNameFuer(b);
    const bt = nm ? stBeta(nm, 'BTCUSD') : null, ba = nm ? stBeta(nm, 'KORB') : null;
    if (bt == null && ba == null){ unbekannt++; continue; }
    const kurz = (b.hebel && b.hebel.lang === false) || b.pos.hebel_richtung === 'short' || istKurzDirekt(b.pos);
    teile.push({b, gw, kurz, bt, ba});
  }
  if (!teile.length) return '';
  const gesamt = stand.gesamt;
  for (const [f, sch] of schocks){
    let sum = 0; const treffer = []; const beitrag = [];
    for (const t of teile){
      const beta = f === 'BTCUSD' ? t.bt : t.ba; if (beta == null) continue;
      let move = beta * sch / 100; if (t.kurz) move = -move;
      let eff = t.gw.markt * move;
      const puffer = t.b.hebel && t.b.hebel.puffer_pct != null ? t.b.hebel.puffer_pct / 100 : null;
      const lang = !t.kurz;
      if (t.gw.art !== 'direkt'){
        const schaden = lang ? -move : move;           // Anteil, um den der Basiswert gegen uns laeuft
        if (puffer != null && schaden >= puffer){ eff = -t.gw.kapital; treffer.push(posName(t.b)); }
        else eff = Math.max(eff, -t.gw.kapital);
      }
      sum += eff; beitrag.push({n: posName(t.b), eff});
    }
    zeilen.push({f, sch, sum, treffer, top: beitrag.sort((a, c) => a.eff - c.eff).slice(0, 3)});
  }
  const fn = f => f === 'BTCUSD' ? 'Bitcoin' : 'Aktienmarkt';
  return `<h2>Stresstest</h2><div class="karte">
    <div class="tw"><table class="mtf" style="font-size:13px"><thead><tr><th>Szenario</th>
      <th style="text-align:right">Depot</th><th style="text-align:right">in %</th></tr></thead><tbody>
    ${zeilen.map(z => `<tr><td>${fn(z.f)} ${z.sch} %<br><span class="nu" style="font-size:11px">am meisten: ${
        z.top.filter(x => x.eff < -0.5).map(x => esc(x.n) + ' ' + num(x.eff, 0) + ' €').join(', ') || '—'}</span>${
        z.treffer.length ? `<br><span class="dn" style="font-size:11.5px"><b>Knock-out / Liquidation:</b> ${z.treffer.map(esc).join(', ')}</span>` : ''}</td>
      <td style="text-align:right;white-space:nowrap" class="${z.sum < 0 ? 'dn' : 'up'}"><b>${z.sum < 0 ? '−' : '+'}${num(Math.abs(z.sum), 0)} €</b></td>
      <td style="text-align:right;white-space:nowrap">${gesamt ? (z.sum / gesamt * 100).toFixed(1).replace('.', ',') : '—'} %</td></tr>`).join('')}
    </tbody></table></div>
    <p class="nu" style="font-size:11.5px;margin:6px 0 0">Rechnung aus den Tagesrenditen der letzten 90 Tage (Beta = Korrelation × Schwankung). Im echten Absturz laufen Werte meist gleichlaufender als gemessen — die Zahlen sind eher zu mild.${
      unbekannt ? ` ${unbekannt} Position${unbekannt > 1 ? 'en' : ''} ohne Messreihe zählen nicht mit.` : ''}</p></div>`;
}

/* ============================================================ KAPITAL-RANKING (seit 07.10.)
   „Wo ist mein Kapital am besten eingesetzt?" — Positionen UND neue Chancen in EINER Liste.
   Bewusst KEINE erfundene Punktzahl: die Reihenfolge folgt der Dringlichkeit und dem, was
   sich messen liess — feste Marken (Stop, Knock-out, Ziel) vor Einschätzungen, belegte
   Neukäufe (Alarm-Tor bestanden) vor Halten. Eine Punktzahl über Hold/Add/Reduce wäre
   unbelegt (Studien 27./30.09.: Schlusslicht-, Gegenrichtungs- und Klumpen-Verkauf haben
   keinen Vorteil gebracht). Jede Zeile nennt, WOHER die Einstufung kommt. */
function kapitalRanking(stand){
  const {bew, inEuro, gesamt} = stand;
  if (!bew.length || !(gesamt > 0) || !S) return '';
  const zeilen = [];
  let bar = 0;
  const imDepot = new Set();
  for (const b of bew){
    const eu = inEuro(b, b.wert) || 0;
    if (istBar(b.pos)){ bar += eu; continue; }
    const nm = b.row ? muenzeVon(b.row.instrument) : null;
    if (nm) imDepot.add(nm);
    let a = null; try { a = positionsAktion(b, stand); } catch(e){}
    const n = posName(b);
    const anteil = gesamt ? eu / gesamt * 100 : 0;
    if (a && a.art === 'raus') zeilen.push({p: 0, tag: 'SCHLIESSEN', kl: 'bad', n, t: a.titel, q: 'feste Marke (Stop / Knock-out / Liquidation)', eu});
    else if (a && a.art === 'teilverkauf') zeilen.push({p: 1, tag: 'TEIL RAUS', kl: 'warn', n, t: a.titel + (a.euro ? ` · ≈ ${num(a.euro, 0)} €` : ''), q: 'Ziel erreicht bzw. Puffer eng', eu});
    else if (a && a.art === 'nachlegen') zeilen.push({p: 2, tag: 'NACHLEGEN', kl: 'gut', n, t: `≈ ${num(a.euro, 0)} € zusätzlich`, q: 'Stärke + Setup durch das Alarm-Tor + Stop vorhanden', eu});
    else {
      const rs = b.halt && b.halt.rs;
      const verl = b.gvPct != null && b.gvPct < -10;
      zeilen.push({p: 4 + (verl && rs != null && rs < RS_SCHWACH ? 0.5 : 0), tag: verl && rs != null && rs < RS_SCHWACH ? 'BEOBACHTEN' : 'HALTEN',
        kl: verl && rs != null && rs < RS_SCHWACH ? 'warn' : '', n,
        t: rs != null ? `Relative Stärke ${rs.toFixed(0)} von 100` + (b.gvPct != null ? ` · ${b.gvPct >= 0 ? '+' : '−'}${Math.abs(b.gvPct).toFixed(0)} %` : '') : 'ohne Messung',
        q: verl && rs != null && rs < RS_SCHWACH ? 'schwach und im Minus — nicht nachkaufen; verkauft wird über den Stop' : 'kein Anlass zu handeln', eu, rs: rs == null ? 50 : rs});
    }
  }
  // Neue Chancen: nur solche, die das Alarm-Tor bestehen (eigene Bilanz) und noch nicht im Depot sind.
  const neu = (S.gesamt || []).filter(o => o.alarm && o.alarm.ja === true && o.handelbar && !imDepot.has(muenzeVon(o.instrument)))
    .sort((x, y) => (y.score || 0) - (x.score || 0)).slice(0, 3);
  for (const o of neu){
    zeilen.push({p: 3, tag: 'NEU KAUFEN', kl: 'gut', n: o.name || name(o.instrument),
      t: `${o.richtung === 'short' ? 'Short' : 'Long'} · Note ${o.note} · Einstieg ${num(o.einstieg, digits(o.einstieg))}`,
      q: 'Alarm-Tor bestanden (benanntes Setup mit positiver eigener Bilanz)', eu: 0});
  }
  zeilen.sort((x, y) => x.p - y.p || ((y.rs ?? 50) - (x.rs ?? 50)) || y.eu - x.eu);
  const top = zeilen.filter(z => z.tag !== 'HALTEN').concat(zeilen.filter(z => z.tag === 'HALTEN'));
  const gehalten = zeilen.filter(z => z.tag === 'HALTEN').length;
  const sicht = zeilen.filter(z => z.tag !== 'HALTEN');
  return `<h2>Wo steht dein Kapital am besten?</h2><div class="karte">
    <ol class="steps" style="margin:0">${sicht.map(z => `<li><span class="note ${z.kl}" style="margin-right:6px">${esc(z.tag)}</span>
      <b>${esc(z.n)}</b> — ${esc(z.t)}<br><span class="nu" style="font-size:11.5px">Grund: ${esc(z.q)}</span></li>`).join('')
      || '<li>Nichts verlangt gerade eine Handlung.</li>'}
      <li><span class="note" style="margin-right:6px">HALTEN</span><b>${gehalten} Positionen</b> — kein Anlass zu handeln.</li>
      ${bar > 0.5 ? `<li><span class="note" style="margin-right:6px">BARGELD</span><b>${num(bar, 0)} €</b> — ${(bar / gesamt * 100).toFixed(0)} % des Depots, bereit für ${neu.length ? 'die Chancen oben' : 'die nächste belegte Chance'}.</li>` : ''}
    </ol>
    <p class="nu" style="font-size:11.5px;margin:8px 0 0">Reihenfolge nach Dringlichkeit, nicht nach einer Punktzahl: feste Marken vor Einschätzungen, belegte Neukäufe vor Halten. Nichts wird automatisch ausgeführt.</p>
  </div>`;
}

/* ============================================================ LERNEN AM DEPOT
   Ozan: "bau mir einen lern extra ding ... das ich nebenbei noch lernen kann" und
   07.10.: Analysen sollen erklaeren, "aus denen er lernen kann, Begriffe erklaert".
   Statt einer zweiten App (er will nur EINE) lernt er hier an seinen EIGENEN Positionen:
   jede Lektion nimmt ein echtes Beispiel aus dem Depot und rechnet es vor. Gezeigt wird
   nur, was gerade passt — kein Turbo, keine Knock-out-Lektion. Dazu ein Begriff des
   Tages, der jeden Tag wechselt. */
const BEGRIFFE = [
  ['CRV (Chance-Risiko-Verhältnis)', 'Wie viel du am Ziel gewinnst im Verhältnis zu dem, was du am Stop verlierst. CRV 1:3 heißt: 1 € Risiko für 3 € Chance. Damit reicht schon jeder dritte Treffer, um nicht zu verlieren (vor Gebühren).'],
  ['R (Risiko-Einheit)', 'Der Abstand vom Einstieg zum Stop ist 1 R. +2 R heißt: du hast doppelt so viel gewonnen, wie du riskiert hast. Mit R lassen sich Trades vergleichen, egal ob Bitcoin oder Apple.'],
  ['ATR (durchschnittliche Tagesschwankung)', 'Wie weit sich ein Kurs an einem normalen Tag bewegt. Ein Stop enger als etwa eine ATR wird oft schon vom normalen Rauschen ausgelöst — ohne dass die Idee falsch war.'],
  ['Drawdown', 'Der Rückgang vom höchsten Depotstand bis zum tiefsten danach. Er zeigt, was du aushalten musst. 30 % Drawdown fühlen sich viel schlimmer an, als sie auf dem Papier aussehen.'],
  ['Trefferquote vs. CRV', 'Eine Strategie mit 35 % Treffern kann gut sein (wenn die Gewinner dreimal so groß sind wie die Verlierer), eine mit 70 % Treffern schlecht (wenn ein Verlust fünf Gewinne auffrisst). Nur beides zusammen sagt etwas.'],
  ['Spread', 'Der Abstand zwischen Kauf- und Verkaufskurs. Du zahlst ihn bei jedem Trade. Bei kleinen Coins und Scheinen außerhalb der Börsenzeit kann er mehr kosten als die Gebühr.'],
  ['Slippage', 'Wenn deine Order zu einem schlechteren Kurs ausgeführt wird als gedacht — typisch bei schnellen Bewegungen und Stop-Orders. Ein Stop bei 100 kann bei 98 ausgeführt werden.'],
  ['Momentum (TSMOM)', 'Was in den letzten Monaten gestiegen ist, steigt im Schnitt eher weiter — eine der am besten belegten Regeln an den Märkten. Sie gilt für den Durchschnitt, nicht für jeden einzelnen Fall.'],
  ['Relative Stärke (RS)', 'Wie gut sich ein Wert im Vergleich zu seiner Klasse schlägt. RS 90 heißt: besser als 90 % der anderen Coins bzw. Aktien. Stärke hält oft an — Schwäche aber nicht zwingend.'],
  ['Beta', 'Wie stark ein Wert dem Gesamtmarkt folgt. Ein Coin mit Bitcoin-Beta 2 fällt ungefähr doppelt so stark wie Bitcoin. Viele Werte mit hohem Beta sind im Absturz wie eine einzige Position.'],
  ['Marktregime', 'Ob der Markt gerade im Trend, seitwärts oder unruhig ist. Dieselbe Strategie funktioniert in einem Regime und scheitert im anderen — deshalb prüft die App das Regime vor jedem Setup.'],
  ['Overfitting', 'Eine Strategie so lange an alte Daten anpassen, bis sie perfekt aussieht — und dann versagt sie live. Deshalb wird hier immer auf Daten geprüft, die beim Entwickeln nicht benutzt wurden (Out-of-Sample).'],
  ['Teilverkauf', 'Einen Teil der Position am ersten Ziel verkaufen und den Stop für den Rest auf Einstand ziehen. Dann kann der Trade kaum noch Verlust machen, und der Rest hat trotzdem Luft nach oben.'],
  ['Knock-out-Schwelle', 'Bei einem Turbo der Kurs des Basiswerts, an dem der Schein sofort (fast) wertlos wird. Anders als ein Stop wartet er nicht auf den Schlusskurs — ein kurzer Ausschlag reicht.'],
];

function lernKasten(stand){
  const {bew, gesamt, inEuro} = stand || {};
  if (!bew || !bew.length) return '';
  const karten = [];
  const nm = b => esc(posName(b));
  const karte = (titel, text, merke) => `<details class="note-box klapp erkl"><summary><span class="nt">${titel}</span>
      <span class="klapp-hint">antippen</span></summary>${text}
      ${merke ? `<p style="margin-top:6px"><strong>Merke:</strong> ${merke}</p>` : ''}</details>`;

  // 1. Knock-out am engsten Turbo
  const turbos = bew.filter(b => b.pos.ko != null && b.hebel && !b.hebel.ausgeknockt && isFinite(b.hebel.puffer_pct))
                    .sort((a, c) => a.hebel.puffer_pct - c.hebel.puffer_pct);
  if (turbos.length){
    const b = turbos[0], hl = b.hebel;
    const p = hl.puffer_pct, hb = hl.hebel;
    karten.push(karte(`Knock-out — an deinem Turbo auf ${esc(hl.basisName || posName(b))}`,
      `<p>${esc(hl.basisName || 'Der Basiswert')} steht bei <b>${num(hl.basisKurs)}</b>, die Schwelle liegt bei
      <b>${num(hl.ko)}</b>. Abstand: <b>${num(p,1)} %</b>. Daraus ergibt sich ein Hebel von etwa
      <b>${num(hb,1)}×</b> — bewegt sich der Basiswert um 1 %, bewegt sich dein Schein um rund ${num(hb,1)} %.</p>
      <p>${hl.lang ? 'Fällt' : 'Steigt'} ${esc(hl.basisName || 'der Basiswert')} um ${num(p,1)} %, ist der Schein
      <b>sofort wertlos</b> — auch wenn der Kurs danach sofort zurückkommt. Je näher die Schwelle, desto größer
      der Hebel, aber desto leichter reicht ein normaler Wackler.</p>`,
      'Ein Puffer unter etwa zwei normalen Tagesschwankungen ist sehr eng. Mehr Hebel heißt nicht mehr Gewinn, sondern weniger Spielraum.'));
  }

  // 2. Verlust-Mathematik an der schwächsten Position
  const minus = bew.filter(b => b.gvPct != null && b.gvPct <= -10).sort((a, c) => a.gvPct - c.gvPct);
  if (minus.length){
    const b = minus[0], v = b.gvPct;
    const noetig = (1 / (1 + v / 100) - 1) * 100;
    karten.push(karte(`Warum Verluste schwerer wiegen — an ${nm(b)}`,
      `<p>${nm(b)} liegt bei <b>${pct(v,1)}</b>. Um wieder bei null zu sein, muss der Kurs nicht um
      ${num(Math.abs(v),1)} % steigen, sondern um <b>${pct(noetig,1)}</b> — weil der Anstieg von einer
      kleineren Basis aus startet.</p>
      <p>Faustregel: −10 % brauchen +11 %, −25 % brauchen +33 %, −50 % brauchen +100 %.</p>`,
      'Verluste klein halten ist wichtiger als Gewinne groß machen. Genau dafür ist der Stop da — er entscheidet, BEVOR die Rechnung unangenehm wird.'));
  }

  // 3. R an einer Position mit Stop — oder: warum ein Stop
  const mitR = bew.filter(b => b.r != null && b.pos.einstieg && b.pos.plan && b.pos.plan.stop != null)
                  .sort((a, c) => Math.abs(c.r) - Math.abs(a.r));
  if (mitR.length){
    const b = mitR[0], z = waehrungsZeichen(b.w), d = digits(b.kurs || 1);
    karten.push(karte(`In R denken — an ${nm(b)}`,
      `<p>Einstieg <b>${num(b.pos.einstieg,d)}${z}</b>, dein Stop <b>${num(b.pos.plan.stop,d)}${z}</b>. Der Abstand
      dazwischen ist <b>1 R</b> — das, was du bei diesem Trade bereit warst zu verlieren.</p>
      <p>Jetzt steht der Kurs bei <b>${num(b.kurs,d)}${z}</b>, also bei <b>${b.r>=0?'+':'−'}${num(Math.abs(b.r),2)} R</b>.
      ${b.r >= 1 ? 'Du hast schon mehr gewonnen, als du riskiert hast — ein guter Moment, den Stop nachzuziehen.'
        : b.r < 0 ? 'Der Trade läuft gegen dich, aber höchstens bis −1 R — das war der Plan.'
        : 'Noch weniger als dein Risiko verdient — Geduld, solange der Stop steht.'}</p>`,
      'R macht Trades vergleichbar: +2 R bei einem Coin und +2 R bei einer Aktie sind gleich gut, egal wie groß die Beträge sind.'));
  } else {
    const ohne = bew.filter(b => !(b.pos.plan && b.pos.plan.stop != null) && b.wert != null)
                    .sort((a, c) => (inEuro(c, c.wert) || 0) - (inEuro(a, a.wert) || 0));
    if (ohne.length){
      const b = ohne[0], e = inEuro(b, b.wert) || 0;
      karten.push(karte(`Warum ein Stop — an ${nm(b)}`,
        `<p>${nm(b)} ist rund <b>${num(e,0)} €</b> wert und hat keinen Stop. Dein Risiko ist damit nicht
        „ein paar Prozent", sondern im schlimmsten Fall die ganze Position.</p>
        <p>Ein Stop legt vorher fest, ab wann die Idee falsch ist. Er nimmt dir die Entscheidung in dem Moment ab,
        in dem du am schlechtesten entscheidest: wenn es gerade wehtut.</p>`,
        'Kein Stop heißt nicht kein Risiko — es heißt unbegrenztes Risiko.'));
    }
  }

  // 4. Klumpenrisiko
  const groesste = bew.slice().sort((a, c) => (inEuro(c, c.wert) || 0) - (inEuro(a, a.wert) || 0))[0];
  const anteil = (groesste && gesamt) ? (inEuro(groesste, groesste.wert) || 0) / gesamt * 100 : 0;
  if (anteil >= 25){
    karten.push(karte(`Klumpenrisiko — an ${nm(groesste)}`,
      `<p>${nm(groesste)} macht <b>${num(anteil,0)} %</b> deines Depots aus. Fällt sie um 20 %, verliert
      dein <em>ganzes</em> Depot dadurch allein <b>${num(anteil * 0.2,1)} %</b> — egal, wie gut der Rest läuft.</p>`,
      'Keine einzelne Position sollte über das Depot entscheiden. Viele Profis begrenzen eine Position auf 10–20 %.'));
  }

  // 5. Teilverkauf an einem Gewinner
  const plus = bew.filter(b => b.gvPct != null && b.gvPct >= 15).sort((a, c) => c.gvPct - a.gvPct);
  if (plus.length){
    const b = plus[0];
    karten.push(karte(`Gewinne sichern — an ${nm(b)}`,
      `<p>${nm(b)} liegt <b>${pct(b.gvPct,1)}</b> im Plus. Verkaufst du jetzt die Hälfte, ist rund
      ${pct(b.gvPct/2,1)} vom Einsatz als Gewinn sicher. Ziehst du den Stop für den Rest auf deinen Einstieg,
      kann der Trade insgesamt kaum noch Verlust machen — und die andere Hälfte darf weiterlaufen.</p>`,
      'Ein Gewinn ist erst ein Gewinn, wenn er gesichert ist. Teilverkauf + Stop auf Einstand nimmt den Druck raus.'));
  }

  // 6. Begriff des Tages — wechselt täglich, für alle gleich
  const tag = Math.floor(Date.now() / 86400000);
  const [wort, erkl] = BEGRIFFE[tag % BEGRIFFE.length];
  karten.push(karte(`Begriff des Tages: ${esc(wort)}`, `<p>${esc(erkl)}</p>`, ''));

  return `<h2>📚 Lernen an deinem Depot</h2>
    <p class="leer" style="padding:4px 0 8px">Jede Lektion rechnet mit deinen echten Positionen. Antippen zum Aufklappen.</p>
    ${karten.join('')}`;
}

function zeichnePortfolio(){
  /* Ein Depot in zwei Waehrungen zusammenzuzaehlen, ohne umzurechnen, ergibt eine Zahl,
     die es nicht gibt. Gerechnet wird alles in Euro — das ist die Waehrung, in der Ozan
     sein Geld tatsaechlich hat. Der Stand kommt aus derselben Funktion, die auch die
     Alarme benutzen; zwei Rechenwege fuer dieselbe Zahl waeren zwei Wahrheiten. */
  let stand = depotStand();
  if (!stand){ $('portfolio').innerHTML = `<p class="leer">Depot nicht lesbar.</p>`; return; }
  /* Zuerst die Stops, dann zeichnen. Aus einer toten Analyse wird nichts gesetzt — ein
     Stop aus Marken von gestern Abend ist schlechter als keiner. Aendert sich etwas,
     wird das Depot neu bewertet, sonst zeichnete die Seite den Stand von davor. */
  const stopLauf = (S && !scanTot()) ? stopsPflegen(stand.bew) : [];
  if (stopLauf.length) stand = depotStand() || stand;
  const {bew, kursEU, inEuro, gesamt} = stand;
  const gv = bew.reduce((s,b)=>s + (inEuro(b, b.gv)||0), 0);
  const einstand = bew.reduce((s,b)=>s + (inEuro(b, b.einstand)||0), 0);
  const jeKlasse = {};
  for (const b of bew){
    const k = b.row?.klasse || (b.basis ? (b.basis.art === 'breit' ? 'aktien' : 'aktien') : 'unbekannt');
    jeKlasse[k] = (jeKlasse[k]||0) + (inEuro(b, b.wert)||0);
  }
  const groesste = bew.slice().sort((a,b)=>(inEuro(b,b.wert)||0)-(inEuro(a,a.wert)||0))[0];
  const konz = (groesste && gesamt) ? (inEuro(groesste, groesste.wert)||0)/gesamt*100 : 0;

  /* Wer das Depot aufmacht, will zuerst Wert und Handlungsbedarf sehen — der Hinweis, wo
     die Daten liegen, steht jetzt unten bei „Mac und iPhone gleich halten". */
  const woLiegt = `<div class="note-box"><span class="nt">Wo dein Depot liegt</span>
    <p style="margin:0">Deine Positionen liegen in diesem Browser. Sie gehen nicht ins öffentliche Repo und
    nicht auf die öffentliche Seite. ${WA && WA.aktiv
      ? 'Für den Wächter rund um die Uhr liegt eine Kopie als <strong>Geheimnis</strong> bei '
        + 'GitHub (DEPOT_CODE) — dort ist sie für niemanden lesbar, auch nicht in den Protokollen.'
      : 'Auf einem anderen Gerät bringst du sie über den Reiter Sync hin.'}</p></div>`;
  let h = `<div id="pf_waechter"></div>` + marktLageKasten();

  if (bew.length){
    h += `<div class="status">
      <div><div class="k">Depotwert</div><div class="v">${num(gesamt,0)} €*</div>
        <div class="n">${posAnz(bew.length)}</div></div>
      <div><div class="k">Gewinn / Verlust</div><div class="v ${gv>=0?'gut':'schlecht'}">${gv>=0?'+':'−'}${num(Math.abs(gv),0)} €</div>
        <div class="n">${einstand?pct(gv/einstand*100,1):'—'}</div></div>
      <div><div class="k">Konzentration</div><div class="v ${konz>35?'mittel':'gut'}">${konz.toFixed(0)} %</div>
        <div class="n">größte: ${esc(groesste?name(groesste.pos.sym):'—')}</div></div>
      <div><div class="k">Aufteilung</div><div class="v" style="font-size:14px;font-family:'JetBrains Mono',monospace">
        ${Object.entries(jeKlasse).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc({krypto:'Krypto',aktien:'Aktien',gold:'Gold',fx:'Devisen',unbekannt:'Sonstiges'}[k]||k)} ${gesamt?Math.round(v/gesamt*100):0} %`).join('<br>')||'—'}</div></div>
    </div>
    <p class="leer" style="padding:6px 0">* alles in Euro umgerechnet${kursEU?` (${num(kursEU,4)} $/€)`:''} —
      Kurse kommen für Krypto live von der Börse, für Aktien aus dem letzten Scan.
      Positionen ohne Kurs gehen mit dem Wert ein, den du eingetragen hast.
      Neu bewertet: ${new Date().toLocaleTimeString('de-DE')} — das läuft weiter, auch
      wenn dieser Reiter zu ist.</p>`;

    h += gesundheitKasten(stand);
    h += stopKasten(stopLauf, bew);
    h += sicherText(gewinnschutzKasten);
    h += sicherText(produktdatenKasten);

    /* Die Handlungsliste ganz oben. Wer das Depot aufmacht, will nicht vierzehn Karten
       lesen, sondern wissen, ob heute etwas zu tun ist — und wenn ja, was und wie viel. */
    const aktionen = bew.map(b => ({b, a: positionsAktion(b, stand)}))
                        .filter(x => x.a && x.a.art !== 'halten')
                        .sort((x,y) => (y.a.dringend?1:0) - (x.a.dringend?1:0));
    h += `<h2>Was jetzt zu tun ist</h2>`;
    h += !S ? `<div class="karte warn"><h3>Analyse noch nicht geladen</h3>

         aber wer das liest, soll wissen, wo es als Nächstes knallen kann. */
      const nah = bew.map(b => {
        const pl = b.pos.plan, pk = planKurs(b);
        if (!pl || pl.stop == null || !pk || istBar(b.pos)) return null;
        return {b, weg: Math.abs(pk - pl.stop) / pk * 100};
      }).filter(x => x && x.weg < STOP_NAH_PCT).sort((x, y) => x.weg - y.weg);

           Marke eintragen: dahin, wo der Grund, aus dem du gekauft hast, nicht mehr gilt.${nahSatz}</p></div>`
        : nah.length
        ? `<div class="karte warn"><h3>Nichts zu tun — aber ${nah.length === 1 ? 'ein Stop ist' : nah.length + ' Stops sind'} nah</h3>
       <p style="margin:4px 0 0;font-size:13px">Kein Stop gerissen, kein Ziel erreicht, kein Knock-out.${nahSatz}</p></div>`
        : `<div class="karte gut"><h3>Nichts zu tun</h3>
       <p style="margin:4px 0 0;font-size:13px">Keine Position verlangt gerade eine Handlung.
       Kein Stop gerissen, kein Ziel erreicht, kein Knock-out, der jetzt Handeln verlangt — und nichts,
       wo sich Nachlegen rechnen würde. Die Stops stehen und werden nachgezogen; Nichtstun
       ist hier das Ergebnis, nicht die Lücke.</p></div>`; })();

    try { h += nachtPlan(stand); } catch(e){ console.error(e); }
    try { h += kapitalRanking(stand); } catch(e){}
    try { h += zweitmeinungKasten(); } catch(e){ console.error(e); }
    h += glKasten(stand);

    /* Auf einen Blick: wie viel Geld wo steckt. Ozan, 28.09.: „es steht ja immer noch

    const zeilenUe = bew.map(b => {

      return {b, eu, st};

    h += depotGrafik(stand);
    try { h += gemeinsamesRisikoKasten(stand); } catch(e){ console.error(e); }
    try { h += stresstest(stand); } catch(e){}
    h += `<h2>Auf einen Blick</h2>

      <tr><td><b>Summe</b></td><td style="text-align:right"><b>${num(gesamt,0)} €</b></td><td></td>

    h += `<h2>Positionen</h2>`;

      const posWertEUR = inEuro(b, b.wert);

      try { ku = kartenUrteil(b, positionsAktion(b, stand)); } catch(e){ ku = kartenUrteil(b, null); }

            (gesamt && posWertEUR!=null)?` <span style="color:var(--ink-3)">· ${(posWertEUR/gesamt*100).toFixed(1).replace('.',',')} % vom Depot</span>`:''}</span>`:''}
          ${b.nominal!=null?`<span title="Marktwert der Position; dein eigenes Geld ist ein ${esc(String(b.pos.hebel))}tel davon plus Gewinn/Verlust">Hebel <b>${esc(String(b.pos.hebel))}×</b> · Nominal <b>${num(inEuro(b,b.nominal),0)} €</b></span>`:''}
          ${b.pos.einstieg?`<span>Einstieg <b>${num(b.pos.einstieg,d)}${z}</b></span>`:''}
          ${b.kurs!=null?`<span>Kurs <b>${num(b.kurs,d)}${z}</b>${b.live?' <span class="up">live</span>':''}</span>`
            :`<span>Wert <b>${num(b.wert,2)} €</b> <span style="color:var(--ink-3)">von dir eingetragen</span></span>`}
          ${b.gvPct!=null?`<span>G/V <b class="${b.gvPct>=0?'up':'dn'}">${pct(b.gvPct,1)}</b></span>`:''}
          ${(()=>{ try { if (istBar(b.pos)) return ''; const nm = glNameFuer(b); const be = nm ? stBeta(nm, 'BTCUSD') : null;
              return be == null ? '' : `<span title="Wie stark der Wert Bitcoin folgt (90 Tage): 1,0 = gleich viel, 2,0 = doppelt so stark, unter 0,5 = kaum">BTC-Beta <b>${be.toFixed(2).replace('.', ',')}</b></span>`; } catch(e){ return ''; } })()}
          ${b.r!=null?`<span title="gemessen am Abstand Einstieg → dein Stop">Stand <b class="${b.r>=0?'up':'dn'}">${b.r>=0?'+':'−'}${Math.abs(b.r).toFixed(2).replace('.',',')} R</b></span>`:''}
          ${trefferquoteSpan(r)}
        </div>
        ${zahlenHinweis(b)}
        ${r ? '' : basisKasten(b)}
        ${hebelKasten(b)}
        ${miniChart(b)}
        ${entscheidungsKasten(b, stand)}
        ${ratKasten(b, ku)}
        ${chatgptZeile(b.pos.sym)}

        ${sicherText(() => tiefeAnalyse(b, stand))}
        <p style="margin:9px 0 0"><button class="link" data-weg="${esc(b.pos.sym)}">entfernen</button>
          ${r?` · <button class="link" data-zeig="${esc(r.instrument)}">Chart ansehen</button>`:''}
          ${(!r && b.basis && b.basis.sym)?` · <button class="link" data-zeig="${esc(b.basis.sym)}">Basiswert im Chart</button>`:''}</p>

    /* Rotation — aber nur mit echtem Anlass.

       Vorher wurde der Score der Position gegen den Score der besten Chance gestellt. Das
       musste immer anschlagen: eine Position, in der man drin ist, hat fast nie ein frisches
       Einstiegssetup. Der Kasten stand deshalb praktisch dauerhaft da und hat sich damit
       selbst entwertet.

       Jetzt braucht es zwei Dinge gleichzeitig: die Position muss in ihrer Klasse
       tatsaechlich hinterherlaufen (Schlusslicht), UND es muss ein handelbares Setup mit
       ordentlicher Note geben. Sonst ist Umschichten nur Gebuehren zahlen. */
    /* Seit 02.10. nur ein Setup, das auch klingeln würde (``alarm.ja``). Vorher stand hier
       Arista (Aktie, Note A+) als Alternative — eine Setup-Art, die in der eigenen Bilanz

    const beste = (S?.gesamt||[]).filter(o=>o.handelbar && o.score >= 52 && o.alarm && o.alarm.ja === true)[0];
    const nachzuegler = bew.filter(b=>b.halt && b.halt.rs != null && b.halt.rs < RS_SCHWACH)
                           .sort((a,b)=>a.halt.rs - b.halt.rs)[0];
    if (beste && nachzuegler && beste.instrument !== nachzuegler.row?.instrument){

        <p><strong>${esc(posName(nachzuegler))}</strong> ist das Schlusslicht deiner
        ${nachzuegler.row?.klasse === 'aktien' ? 'Aktien' : 'Coins'} — schwächer als

        (Note ${esc(beste.note)}${beste.erwartete_bewegung_pct!=null?', erwartet '+bewegungText(beste):''}).</p>
        <p>Das ist ein Hinweis, keine Anweisung — und nichts wird automatisch umgeschichtet.

        nicht schlechter als ihre Klasse). Wenn du aber Kapital für das Setup brauchst, ist das
        die Position, deren Verkauf dich am wenigsten Stärke kostet. Ein Wechsel kostet Gebühren
        und Spread und wirft die laufende These weg.</p></div>`;
    }
    try { h += lernKasten(stand); } catch(e){ console.error('[Lernen]', e); }
  } else {
    h += `<p class="leer">Noch keine Positionen eingetragen.</p>`;

  h += `<h2>Position eintragen</h2>

      <textarea id="pf_bulk" rows="6" spellcheck="false"
        placeholder="NVDA 12 118,40 Trade Republic&#10;BTCUSDT 0,25 61000 Bybit&#10;ETHUSDT 1,5 2380 Kraken"></textarea>
      <p style="margin:10px 0 0"><button class="btn" id="pf_import">Übernehmen</button>
        <button class="link" id="pf_export" style="margin-left:14px">Alles als Text ausgeben</button></p>
      <div id="pf_meldung"></div>
    </div>`;

  $('portfolio').innerHTML = h;
  fuelleWaechter($('pf_waechter'));
  $('portfolio').querySelectorAll('details[data-mehr]').forEach(d=>d.addEventListener('toggle',()=>{
    if (d.open) MEHR_OFFEN.add(d.dataset.mehr); else MEHR_OFFEN.delete(d.dataset.mehr);
  }));
  $('portfolio').querySelectorAll('details[data-ta]').forEach(d=>d.addEventListener('toggle',()=>{
    if (d.open) TA_OFFEN.add(d.dataset.ta); else TA_OFFEN.delete(d.dataset.ta);
  }));
  $('portfolio').querySelectorAll('[data-weg]').forEach(b=>b.addEventListener('click',()=>{
    speicherePositionen(ladePositionen().filter(p=>p.sym!==b.dataset.weg)); zeichnePortfolio();
  }));
  $('portfolio').querySelectorAll('[data-zeig]').forEach(b=>b.addEventListener('click',()=>
    waehle(b.dataset.zeig)));
  /* Stop nachtraeglich setzen — per Vorschlag oder von Hand. Ab dem Moment ueberwacht
     die App die Position und meldet sich, wenn der Stop faellt. */
  const planSetzen = (sym, plan) => {
    const a = ladePositionen();
    const p = a.find(x => x.sym === sym);
    if (!p) return;
    p.plan = {...(p.plan||{}), richtung:'long', waehrung: posWaehrung(p), ...plan};
    speicherePositionen(a);
    zeichnePortfolio();
  };
  $('portfolio').querySelectorAll('[data-plan]').forEach(b=>b.addEventListener('click',()=>{
    const z = (s) => s === '' || s == null ? null : Number(s);
    planSetzen(b.dataset.plan, {stop: Number(b.dataset.stop), tp1: z(b.dataset.tp1),
                                tp2: z(b.dataset.tp2), tp3: z(b.dataset.tp3), quelle:'analyse'});
  }));
  $('portfolio').querySelectorAll('[data-stopsetzen]').forEach(b=>b.addEventListener('click',()=>{
    const sym = b.dataset.stopsetzen;
    const feld = $('portfolio').querySelector(`[data-stopfeld="${CSS.escape(sym)}"]`);
    const zf = $('portfolio').querySelector(`[data-zielfeld="${CSS.escape(sym)}"]`);
    const stop = feld && feld.value !== '' ? Number(feld.value) : null;
    if (stop == null || !isFinite(stop)){ if (feld) feld.focus(); return; }
    const ziel = zf && zf.value !== '' ? Number(zf.value) : null;
    planSetzen(sym, {stop, tp1: isFinite(ziel) ? ziel : null, quelle:'selbst'});
  }));
  // Einen nachgezogenen Stop abhaken: die Order liegt beim Broker, der Merker darf weg.
  const brokerAbhaken = (filter) => {
    const a = ladePositionen();
    let was = false;
    for (const p of a){
      if (p.plan && p.plan.broker_offen && filter(p)){ delete p.plan.broker_offen; was = true; }
    }
    if (was){ speicherePositionen(a); zeichnePortfolio(); }
  };
  $('portfolio').querySelectorAll('[data-brokerok]').forEach(btn=>btn.addEventListener('click',()=>
    brokerAbhaken(p => posSchluessel(p) === btn.dataset.brokerok)));
  const alleOk = $('pf_broker_alle');
  if (alleOk) alleOk.addEventListener('click', ()=> brokerAbhaken(()=>true));

  /* Die Handlung wirklich vollziehen — nicht nur lesen.

     Ozan: „wenn ich da jetzt was reduziere, soll da auch so ein Knopf sein, wo ich dann
     reduzieren kann und er dann wieder neu analysiert."

     Genau das passiert hier: die Menge wird angepasst, gespeichert, und die Seite rechnet
     danach alles neu — Anteil, Klumpen, Gleichlauf, Tagesrisiko, die naechste Handlung.
     Der Knopf fuehrt KEINE Order aus; er haelt fest, was Ozan beim Broker getan hat.
     Deshalb heisst er „Verkauft", nicht „Verkaufen". */
  $('portfolio').querySelectorAll('[data-mengeschl]').forEach(btn=>btn.addEventListener('click',()=>{
    const a = ladePositionen();
    const i = a.findIndex(p => posSchluessel(p) === btn.dataset.mengeschl);
    if (i < 0) return;
    const pos = a[i];
    const art = btn.dataset.mengeart;
    const wert = Number(btn.dataset.mengewert);
    const kurs = btn.dataset.mengekurs === '' ? null : Number(btn.dataset.mengekurs);
    if (!isFinite(wert) || wert <= 0) return;

    if (art === 'nachlegen'){
      // Einstand mischen, sonst stimmt jede Gewinnanzeige danach nicht mehr.
      const alt = Number(pos.menge) || 0;
      const neu = alt + wert;
      if (pos.einstieg != null && kurs != null && neu > 0)
        pos.einstieg = (alt * pos.einstieg + wert * kurs) / neu;
      pos.menge = neu;
    } else {
      const rest = (Number(pos.menge) || 0) - wert;
      // Ein Rest unter einem Promille ist Rundung, keine Position.
      if (art === 'raus' || rest <= (Number(pos.menge) || 0) * 0.001){
        a.splice(i, 1);
      } else {
        pos.menge = rest;
        // Nach einem Teilverkauf ist der alte Plan nicht falsch, aber der Stop gehoert
        // neu geprueft — das macht stopsPflegen beim naechsten Zeichnen von selbst.
        // Die Regel, die den Teilverkauf verlangt hat, ist damit erledigt — sonst kaeme
        // derselbe Rat auf die Restmenge sofort wieder (bei TP1 rueckt so auch der Stop
        // auf den Einstieg).
        const marke = btn.dataset.mengemarke;
        if (marke) pos.erledigt = Array.from(new Set([...(pos.erledigt||[]), marke]));
      }
    }
    speicherePositionen(a);
    zeichnePortfolio();
  }));

  // Ein erreichtes Ziel abhaken: danach zeigt der Plan den naechsten Schritt statt
  // denselben nochmal. Ohne das stuende bei jedem Aufruf wieder "TP1 verkaufen".
  $('portfolio').querySelectorAll('[data-erledigt]').forEach(b=>b.addEventListener('click',()=>{
    const a = ladePositionen();
    const pos = a.find(p=>p.sym === b.dataset.erledigt);
    if (!pos) return;
    pos.erledigt = Array.from(new Set([...(pos.erledigt||[]), b.dataset.marke]));
    speicherePositionen(a);
    zeichnePortfolio();
  }));
  const add = $('pf_add');
  if (add) add.addEventListener('click',()=>{
    const sym = ($('pf_sym').value||'').trim().toUpperCase();
    const menge = parseFloat(($('pf_menge').value||'').replace(',','.'));
    const einstieg = parseFloat(($('pf_einstieg').value||'').replace(',','.'));
    if (!sym || !isFinite(menge) || menge <= 0) return;
    const a = ladePositionen().filter(p=>p.sym!==sym);
    const zahl = (id) => { const v = parseFloat((($(id)||{}).value||'').replace(',','.'));
                           return isFinite(v) ? v : null; };
    const basisFeld = (($('pf_basis')||{}).value||'').trim().toUpperCase();
    a.push({sym, menge, einstieg: isFinite(einstieg)?einstieg:null,
            konto: ($('pf_konto').value||'').trim(), seit: Date.now(),
            ...(basisFeld ? {basis: basisFeld} : {}),
            ...(zahl('pf_ko') != null ? {ko: zahl('pf_ko')} : {}),
            ...(zahl('pf_ratio') != null ? {ratio: zahl('pf_ratio')} : {}),
            ...(isinNorm(($('pf_isin')||{}).value) ? {isin: isinNorm($('pf_isin').value)} : {})});
    speicherePositionen(a); zeichnePortfolio();
  });
  const clear = $('pf_clear');
  if (clear) clear.addEventListener('click',()=>{ speicherePositionen([]); zeichnePortfolio(); });

  const zs = $('pf_zum_sync');
  if (zs) zs.addEventListener('click', ()=>{ zeichneSync(); zeigeTab(4); });

  const imp = $('pf_import');
  if (imp) imp.addEventListener('click',()=>{
    const {neu, fehler} = leseDepot($('pf_bulk').value || '');
    if (neu.length){
      // Bestehende Positionen mit demselben Symbol werden ersetzt, nicht verdoppelt.
      const behalten = ladePositionen().filter(p=>!neu.some(n=>n.sym===p.sym));
      speicherePositionen(behalten.concat(neu));
    }
    zeichnePortfolio();
    const m = $('pf_meldung');
    if (m) m.innerHTML =
      `<p style="margin-top:10px;font-size:12.5px;color:${neu.length?'var(--long)':'var(--warn)'}">
        ${posAnz(neu.length)} übernommen.${fehler.length
          ? ` <span style="color:var(--warn)">Nicht gelesen: ${fehler.map(esc).join(' · ')}</span>` : ''}</p>`;
  });
  const exp = $('pf_export');
  if (exp) exp.addEventListener('click',()=>{
    const text = ladePositionen().map(p=>
      [p.sym, p.menge, p.einstieg ?? '', p.konto || ''].join(' ').trim()).join('\n');
    const el = $('pf_bulk'); if (el) el.value = text;
    const m = $('pf_meldung');
    if (m) m.innerHTML = `<p style="margin-top:10px;font-size:12.5px;color:var(--ink-2)">
      Oben steht jetzt dein ganzes Depot als Text — kopieren und auf dem anderen Gerät
      hier einfügen. Das ist der Umzug: die Daten liegen nur in diesem Browser.</p>`;
  });
}

/* Depot aus Text lesen.
   Absichtlich nachsichtig: Ozan tippt das ab oder kopiert es aus der Broker-App, und
   dann steht dort mal ein Tabulator, mal ein Semikolon, mal "118,40" und mal "118.40".
   Ein Import, der daran scheitert, wird kein zweites Mal benutzt. Was nicht gelesen
   werden kann, wird ZURUECKGEMELDET statt still verschluckt — eine Position, die
   lautlos fehlt, ist schlimmer als eine Fehlermeldung. */
function leseDepot(text){
  const neu = [], fehler = [];
  for (const roh of String(text).split(/\r?\n/)){
    const zeile = roh.trim();
    if (!zeile) continue;
    /* Das Dezimalkomma ZUERST in einen Punkt umschreiben. Sonst zerlegt der Trenner
       "118,40" in zwei Felder — die Menge stimmt, der Einstiegskurs wird zu 118 und
       die 40 landet im Kontonamen. Genau so ist es beim ersten Versuch passiert. */
    const norm = zeile.replace(/(\d)[,](\d)/g, '$1.$2').replace(/[€$£]/g, ' ');
    const teile = norm.split(/[\s,;]+/).filter(Boolean);
    if (teile.length < 2){ fehler.push(zeile.slice(0,24)); continue; }
    const sym = depotSymAufloesen(teile[0].toUpperCase().replace(/[^A-Z0-9.\-]/g, ''));
    let i = 1;
    const zahlen = [];
    while (i < teile.length && /^\d+(\.\d+)?$/.test(teile[i])){ zahlen.push(parseFloat(teile[i])); i++; }
    const menge = zahlen[0];
    if (!sym || !isFinite(menge) || menge <= 0){ fehler.push(zeile.slice(0,24)); continue; }
    neu.push({
      sym,
      menge,
      einstieg: isFinite(zahlen[1]) ? zahlen[1] : null,
      konto: teile.slice(i).join(' ').trim(),
    });
  }
  return {neu, fehler};
}

/* Ozan, 12.10.: „TAO 2,3 130 Kraken" lieferte keinen Kurs und keinen Verlauf, weil nur
   das Kürzel TAO ankam — Kraken braucht TAO/USD. Ein reines Coin-Kürzel wird hier auf das
   Krypto-Paar aus dem Scan aufgelöst (TAO → TAOUSD). Aktien-Kürzel (AAPL, NVDA) bleiben,
   wie sie sind: die stehen nicht als Krypto im Scan. */
function depotSymAufloesen(sym){
  const s = String(sym || '').toUpperCase();
  if (!s || /(USDT|USDC|USD|EUR)$/.test(s) || /[-.]/.test(s)) return s;
  const g = (S && S.gesamt) || [];
  for (const q of ['USD', 'USDT']){
    const hit = g.find(o => o.instrument === s + q && o.klasse === 'krypto');
    if (hit) return hit.instrument;
  }
  return s;
}

/* ============================================================ ALARME */
/* ============================================================ ALARME
   Zwei Wege zur selben Aussage, absichtlich getrennt:
     · der CI-Waechter prueft alle 15 Minuten und verschickt (Telegram)
     · diese Seite rechnet den Zustand LIVE aus dem Boersenkurs
   Der zweite Weg braucht keine Schlüssel und aktualisiert sich im Sekundentakt.
   Laufen sie auseinander, ist das ein Befund und kein Schönheitsfehler.
   ============================================================ */
const ZUSTAND_TEXT = {
  'wartet_auf_einstieg':'wartet auf Einstieg', 'aktiv':'im Trade',
  'ziel_erreicht':'Ziel erreicht', 'stop':'ausgestoppt', 'invalidiert':'ungültig',
  'abgelaufen':'abgelaufen'
};
const OFFEN = ['wartet_auf_einstieg','aktiv'];
const NOTE_RANG = {'A+':6,'A':5,'A−':4,'B+':3,'B':2,'WATCH':1,'—':0};

/* Der Live-Zustand eines Setups: was gilt JETZT, bei diesem Kurs? */
function lage(w, ausScan){
  /* ``ausScan`` ist der Kurs aus dem letzten Scan. Er ist der Grund, warum Aktien hier
     ueberhaupt einen Zustand bekommen: fuer sie gibt es keinen Livestream, und vorher
     blieb deshalb jede Aktie auf „beobachten" stehen — auch die, die im Markt-Reiter
     gruen als JETZT leuchtete. */
  const st = kursStand(w.instrument, ausScan);
  const kurs = st.kurs;
  const lang = w.richtung === 'long';
  const risiko = Math.abs(w.einstieg - w.stop);
  const eingestiegen = w.zustand === 'aktiv';
  let stufe = 'beobachten', abstand = null, r = null;

  if (kurs != null){
    abstand = (lang ? (kurs / w.einstieg - 1) : (w.einstieg / kurs - 1)) * 100;
    const basis = w.einstiegskurs ?? w.einstieg;
    if (risiko > 0) r = (lang ? kurs - basis : basis - kurs) / risiko;
    const erreicht = einstiegErreicht(lang, w.einstieg, kurs);
    const raus = lang ? kurs <= w.stop : kurs >= w.stop;
    if (eingestiegen && raus) stufe = 'stop';
    else if (eingestiegen) stufe = 'im_trade';
    else if (erreicht) stufe = 'jetzt';
    else if (Math.abs(abstand) <= 1.5) stufe = 'bald';
  } else if (eingestiegen) stufe = 'im_trade';

  return {w, kurs, lang, risiko, abstand, r, stufe, live: st.live};
}

/* Lokale Benachrichtigung, wenn ein Setup live auf "jetzt" springt.

   WARUM DAS GEDAECHTNIS AUF DER PLATTE LIEGT UND NICHT IM ARBEITSSPEICHER

   Vorher merkte sich die App im laufenden Betrieb, was sie schon gemeldet hat. Beim
   naechsten OEFFNEN war das Gedaechtnis leer — und dann meldete sie alles noch einmal.
   Auf dem iPhone, wo eine Seite vom Home-Bildschirm bei jedem Start neu laedt, heisst
   das: bei jedem Blick in die App ein Schwung Meldungen fuer dieselben Signale, die
   man schon kennt. Genau das hat Ozan als Spam erlebt.

   Jetzt steht der Schluessel im localStorage und ueberlebt jeden Neustart. Dazu eine
   Sperre von zwoelf Stunden: derselbe Wert meldet sich hoechstens einmal am halben Tag,
   selbst wenn die Wachliste ihn neu aufnimmt. */
const GEMELDET_KEY = 'desk.gemeldet.v1';
const GEMELDET_SPERRE_MS = 12 * 3600 * 1000;
function gemeldetLaden(){
  try {
    const roh = JSON.parse(localStorage.getItem(GEMELDET_KEY) || '{}');
    const jetzt = Date.now(), sauber = {};
    for (const [k, t] of Object.entries(roh)) if (jetzt - t < GEMELDET_SPERRE_MS) sauber[k] = t;
    return sauber;
  } catch(e){ return {}; }
}
function gemeldetMerken(key){
  try {
    const a = gemeldetLaden();
    a[key] = Date.now();
    localStorage.setItem(GEMELDET_KEY, JSON.stringify(a));
  } catch(e){}
}
/* Ab welcher Note ein neues Setup aufs Handy darf.

   Unter den Alarmen stand schon immer der Satz „Neue Setups nur ab A−. B und B+ stehen
   hier, klingeln aber nicht." — und er stimmte nicht: es gab nirgends eine Notenpruefung,
   gemeldet wurde jedes erreichte Setup. Ozans Vorgabe ist eindeutig ("nur den einen
   perfekten Alarm bei gutem Einstieg, nicht viele"), also gilt jetzt, was dasteht.
   Laufende Trades sind davon nicht betroffen: Stop, Ziel und Ungueltigkeit melden sich
   unabhaengig von der Note, weil dort Geld im Feuer steht. */
const MELDE_AB_RANG = 4;   // A−

/* ============================================ DAS ALARM-TOR (seit 26.09.)

   „Die Alarme sind irgendwie schlecht geworden … bessere Alarme, da wo es sich wirklich
   lohnt."

   Ob ein Einstieg ein Alarm ist, entscheidet nicht mehr die App allein nach der Note,
   sondern das Alarm-Tor im Scan (scanner/alarm_tor.py) — DIESELBE Pruefung, die der
   Waechter vor dem Senden aufs Handy macht. Sie steht in jeder Zeile unter ``alarm``:
   ``ja`` und der Grund, wenn nicht. Fehlt sie (alter Scan), gilt die alte Notenregel.

   Geprueft wird: benanntes Setup, Note ab A− (B+ nur bei bewaehrter Setup-Art), die
   eigene Bilanz der Setup-Art, Chance-Risiko ab 1:2, Ziel 1 weit genug weg fuer die
   Gebuehren. Aufs Handy kommen davon hoechstens drei am Tag, derselbe Coin einmal in
   48 Stunden — das steht nur im Waechter, weil es vom Verlauf abhaengt. */
function alarmTor(x){ const o = x && (x.o || x); return (o && o.alarm && typeof o.alarm.ja === 'boolean') ? o.alarm : null; }
function alarmReif(x){
  const t = alarmTor(x);
  if (t) return t.ja;
  const w = x && (x.w || x);
  return (NOTE_RANG[w && w.note] || 0) >= MELDE_AB_RANG;
}
function alarmGrund(x){
  const t = alarmTor(x);
  if (t) return t.grund || '';
  const w = x && (x.w || x);
  return `Note ${w ? w.note : '—'} — Alarm erst ab A−`;
}

function benachrichtige(x){
  // Aus einem toten Scan kommt keine Meldung. Eine Kaufaufforderung mit Marken von
  // gestern Abend ist genau die Art Alarm, die Geld kostet.
  if (scanTot()) return;
  if (!alarmReif(x)) return;
  const key = x.w.instrument + ':' + x.w.aufgenommen;
  if (gemeldetLaden()[key]) return;
  gemeldetMerken(key);
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const d = digits(x.w.einstieg);
    meldung(`${x.lang?'KAUFEN':'VERKAUFEN'} ${name(x.w.instrument)} · ${x.w.note}`, {
      body: `Einstieg ${num(x.w.einstieg,d)} erreicht\nStop ${num(x.w.stop,d)}`
            + (x.w.tp1!=null?` · Ziel ${num(x.w.tp1,d)}`:'')
            // Ohne diesen Zusatz sieht ein Alarm auf Scanbasis aus wie einer auf
            // Livebasis. Bei Aktien ist er bis zu einer halben Stunde alt.
            + (x.live ? '' : '\nKurs aus dem letzten Scan — vor dem Kauf im Broker prüfen'),
      tag: key,
    });
  } catch(e){}
}

/* Die Buy-Signale kommen aus der RANGLISTE, nicht aus einer festen Liste. Bei jedem
   Scan (alle 30 Min) steht hier, was gerade oben steht; bei jedem Kurs-Tick aendert
   sich der Zustand. Ozans Vorgabe: "aus einem Ranking gemacht, und fuer die besten
   Rankings die besten Alarme ... nicht immer die gleiche Dings". */
function ausRanking(){
  const wachen = new Map(((WL && WL.wachen) || []).map(w=>[w.instrument, w]));
  const rows = (S?.gesamt||[]).filter(handelsreif);
  return rows.map(o=>{
    const w = wachen.get(o.instrument);
    /* Vor dem Einstieg ist der Plan ein VORSCHLAG und muss aktuell sein: es gelten die
       Zahlen des letzten Scans. Ab dem Einstieg ist er ein VERTRAG und bleibt fest —
       sonst wandert der Stop mit jedem Scan, und hinterher weiss niemand, gegen welchen
       Plan das Ergebnis gemessen wurde.
       Genau das war Ozans Einwand: ein Einstieg, der vor Stunden gesetzt wurde und an
       dem der Markt laengst vorbeigelaufen ist, ergibt keinen Sinn mehr. */
    const imTrade = w && w.zustand === 'aktiv';
    const basis = {
      instrument: o.instrument, klasse: o.klasse, richtung: o.richtung, note: o.note,
      einstieg: imTrade ? w.einstieg : o.einstieg,
      einstieg_art: imTrade ? w.einstieg_art : (o.einstieg_art || 'sofort'),
      stop: imTrade ? w.stop : (o.plan ? o.plan.stop : o.invalidierung),
      /* Die Ziele kommen aus dem Handelsplan, nicht roh aus der Liquiditaetsliste:
         dort steht sicher, dass Ziel 1 nie naeher liegt als der Stop entfernt ist. */
      tp1: imTrade ? w.tp1 : (o.plan ? o.plan.tp1 : o.ziel),
      tp2: imTrade ? w.tp2 : (o.plan ? o.plan.tp2 : o.tp2),
      tp3: imTrade ? w.tp3 : (o.plan ? o.plan.tp3 : o.tp3),
      zustand: w ? w.zustand : 'wartet_auf_einstieg',
      erreicht: w ? (w.erreicht||[]) : [],
      einstiegskurs: w ? w.einstiegskurs : null,
      gemeldet: w ? (w.gemeldet || '') : '',
      schutz: w ? w.schutz : null,
      raus: w ? !!w.raus : false,
      aufgenommen: w ? w.aufgenommen : (S?.erzeugt || ''),
      frisch: !imTrade,
    };
    return {...lage(basis, o.kurs), o};
  }).filter(x=>OFFEN.includes(x.w.zustand));
}

/* Was ein Signal bringen kann — und wie oft so etwas bisher aufging.

   Die beiden Zahlen sehen nebeneinander gleich aus und sind es nicht: die erste ist
   gerechnet (vom Einstieg zum Ziel sind es soundso viel Prozent), die zweite ist
   gezaehlt (von so vielen frueheren Signalen dieser Art haben soundso viele das Ziel
   erreicht). Deshalb steht bei der zweiten immer die Zahl der Faelle daneben und
   darunter der Satz, dass es Vergangenheit ist. Ohne den liest man eine Quote als
   Versprechen. */
/* =================================================== WIE LANGE LÄUFT DAS?

   „Mir fehlen noch ein, zwei kurze Trades. Die nicht über Wochen hinweg gehen."

   Die Frage war bisher unbeantwortbar, weil nirgends stand, wie lange ein Signal
   tatsächlich gelaufen ist. Jetzt wird es gemessen: von der Aufnahme auf die Wachliste
   bis zum Ausgang, über alle 60 abgeschlossenen Signale.

   Das Ergebnis ist selbst eine Antwort: der Median liegt bei rund anderthalb Tagen,
   knapp sechs von zehn Signalen sind binnen zwei Tagen entschieden. Was sich nach
   „wochenlang" anfühlt, sind meist die Kandidaten unter „Kaufen ab …", die auf ihren
   Einstieg warten — nicht die Trades selbst. Deshalb steht die Zahl ab jetzt auf der
   Karte, statt dass man sie sich zusammenreimen muss.

   Geschätzt wird hier nichts. Fehlen die Fälle, steht nichts da. */
function dauerText(h){
  if (h == null) return '—';
  if (h < 24) return `${Math.round(h)} Std.`;
  const t = h / 24;
  if (t < 10) return `${t.toFixed(1).replace('.',',')} Tage`;
  return `${Math.round(t)} Tage`;
}
/* Die Anlageklasse trennt schärfer als die Note — und genau das ist die Antwort auf
   „ich will auch kurze Trades": Krypto ist im Median nach EINEM Tag entschieden, eine
   Aktie braucht VIER. Die kurzen Trades gibt es also längst, sie stehen nur nicht dran.
   Deshalb zählt hier zuerst die Klasse, dann die Note, dann der Gesamtschnitt. */
function dauerFuer(note, klasse){
  const D = PF && PF.dauer;
  if (!D || !D.median_h) return null;
  const jk = klasse ? (D.je_klasse || {})[klasse] : null;
  if (jk && jk.faelle >= 5)
    return {median_h: jk.median_h, faelle: jk.faelle, quelle: klasse === 'aktien' ? 'Aktien' : 'Coins'};
  const jn = (D.je_note || {})[note];
  if (jn && jn.faelle >= 5) return {median_h: jn.median_h, faelle: jn.faelle, quelle: 'Note ' + note};
  return {median_h: D.median_h, faelle: D.faelle, quelle: 'alle'};
}
function istKurz(note, klasse){
  const d = dauerFuer(note, klasse);
  const grenze = (PF && PF.dauer && PF.dauer.kurz_bis_h) || 48;
  return d ? d.median_h <= grenze : null;
}

function erwartungsKasten(o){
  const e = o && o.erwartung; if (!e) return '';
  const q = e.quote;
  const teile = [];
  if (e.bis_tp1_pct != null) teile.push(`<span>1. Ziel <b class="up">${pct(e.bis_tp1_pct,1)}</b></span>`);
  if (e.bis_tp3_pct != null) teile.push(`<span>alle Ziele <b class="up">${pct(e.bis_tp3_pct,1)}</b></span>`);
  if (e.risiko_pct != null) teile.push(`<span>bis Stop <b class="dn">−${num(e.risiko_pct,1)} %</b></span>`);
  if (q) teile.push(`<span>traf bisher <b>${Math.round(q.tp1*100)} %</b>
    <span style="color:var(--ink-3)">von ${q.n} Fällen</span></span>`);
  const dd = dauerFuer(o.note, o.klasse);
  if (dd) teile.push(`<span>lief im Median <b>${dauerText(dd.median_h)}</b>
    <span style="color:var(--ink-3)">${esc(dd.quelle)}, ${dd.faelle} Fälle</span></span>`);
  return `<div class="erw">
    <span class="nt">Was es bringen kann — und wie oft es bisher aufging</span>
    <div class="kpi">${teile.join('')}</div>
    ${q?`<div class="qbar"><i style="width:${Math.max(2,Math.round(q.tp1*100))}%"></i></div>`:''}
    <p>${(e.saetze||[]).map(esc).join(' ')}${dd?` Bis zur Entscheidung vergingen bei
      vergleichbaren Signalen im Median ${dauerText(dd.median_h)} — das ist keine Prognose,
      sondern gemessen an ${dd.faelle} abgeschlossenen Fällen.`:''}</p>
  </div>`;
}

function signalKarte(x){
  const w = x.w, o = x.o || {}, d = digits(w.einstieg);
  const lang = x.lang;
  const seite = lang ? 'KAUFEN' : 'VERKAUFEN';
  const farbe = lang ? 'var(--long)' : 'var(--bad)';
  /* Woher der Kurs kommt, steht auf der Karte — nicht im Kleingedruckten. Bei Krypto
     laeuft ein Livestream, bei Aktien nicht; ein JETZT auf Scanbasis kann bis zu einer
     halben Stunde alt sein. Das ist immer noch die beste verfuegbare Auskunft, aber es
     ist eine andere Auskunft. */
  const quelle = x.kurs == null ? ''
    : x.live ? ` <span class="up mono" style="font-size:10px">LIVE</span>`
    : ` <span class="mono" style="font-size:10px;color:var(--ink-3)">Kurs aus dem letzten Scan${
        S && S.erzeugt ? ', ' + zeit(S.erzeugt) : ''}</span>`;
  let urteil, klasse = '';
  if (x.stufe === 'jetzt'){ urteil = `<strong style="color:${farbe}">${seite} — JETZT</strong>${quelle}`; klasse = 'hot'; }
  else if (x.stufe === 'im_trade'){ urteil = `<strong>im Trade</strong>`; klasse = 'hot'; }
  else if (x.stufe === 'stop'){ urteil = `<strong style="color:var(--bad)">Stop erreicht</strong>`; }
  else urteil = `${seite} ab <strong>${num(w.einstieg,d)}</strong>${
    x.abstand!=null?` <span style="color:var(--ink-3)">(noch ${Math.abs(x.abstand).toFixed(2).replace('.',',')} %)</span>`:''}`;

  /* Positionsgröße: 0,5 % Risiko — aber gedeckelt durch das Kapital.
     Ohne Deckel kam bei einem Wert mit 0,06 % Stopabstand "9999 Stück ≈ 9.992 €"
     heraus, bei 1.200 € Kapital. Rechnerisch richtig, praktisch Unsinn: was man
     nicht kaufen kann, ist keine Positionsgröße. */
  const equity = P ? P.equity : 1200;
  const MAX_ANTEIL = 0.25;
  const ausRisiko = x.risiko > 0 ? equity * 0.005 / x.risiko : 0;
  const ausKapital = w.einstieg > 0 ? equity * MAX_ANTEIL / w.einstieg : 0;
  const gedeckelt = ausRisiko > ausKapital;
  const stueck = Math.floor(Math.min(ausRisiko, ausKapital));
  const euro = Math.round(stueck * w.einstieg);
  const ziele = [w.tp1, w.tp2, w.tp3].filter(v=>v!=null);

  const st = o.setup || null;
  return `<div class="alarm ${klasse}" data-sym="${esc(w.instrument)}">
    <div class="ah">
      <span>${esc(name(w.instrument))}</span>
      <span class="note ${NOTE_KLASSE[w.note]||''}">${esc(w.note)}</span>
      ${(()=>{ const k = istKurz(w.note, o.klasse); const dd = dauerFuer(w.note, o.klasse);
        if (k == null) return '';
        return `<span class="note ${k?'gut':''}" title="gemessen an ${dd.faelle} abgeschlossenen Signalen (${dd.quelle})"
          >${k?'kurz':'länger'} · ${dauerText(dd.median_h)}</span>`; })()}
      <span class="d">${o.score!=null?`${o.score.toFixed(0)}/100`:''}${
        o.rs!=null?` · RS ${Math.round(o.rs)}`:''}</span>
    </div>
    ${st?`<div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--accent);margin-top:5px">${esc(st.name)}</div>`:''}
    <p style="font-size:14.5px;margin-top:6px">${urteil}</p>
    ${st?`<p style="font-size:12.5px;color:var(--ink-2);margin-top:4px">${esc(st.these)}</p>`:''}
    ${(()=>{ /* Warum das (k)ein Alarm ist — in einem Satz, auf der Karte selbst. */
      if (x.stufe === 'im_trade' || x.stufe === 'stop'){
        return w.gemeldet ? `<p style="font-size:12px;margin-top:5px;color:var(--accent)">Der
          Einstieg kam als Alarm aufs Handy (${zeit(w.gemeldet)}) — Ziel, Stop und Ausstieg
          klingeln ebenfalls.</p>` : '';
      }
      const t = alarmTor(x);
      if (!t) return '';
      return t.ja
        ? `<p style="font-size:12px;margin-top:5px;color:var(--long)">Kommt durchs Alarm-Tor${
            t.bilanz ? ` · ${esc(t.bilanz)}` : ''}</p>`
        : `<p style="font-size:12px;margin-top:5px;color:var(--warn)">Kein Alarm: ${esc(t.grund)}</p>`;
    })()}
    <div class="kpi">
      <span>Einstieg <b>${preis(o,'einstieg',w.einstieg,d)}</b> <span style="color:var(--ink-3)">${esc(w.einstieg_art)}${w.frisch?' · aus dem letzten Scan':' · fest seit Einstieg'}</span></span>
      <span>Stop <b>${preis(o,'stop',w.stop,d)}</b></span>
      ${ziele.length?`<span>Ziele <b>${ziele.map((v,i)=>preis(o,'tp'+(i+1),v,d)).join(' / ')}</b></span>`:''}
    </div>
    <div class="kpi">
      ${x.kurs!=null?`<span>Kurs <b>${num(x.kurs,d)}</b>${x.live?' <span class="up">live</span>':''}</span>`:''}
      ${(()=>{ const c = crvVon(o); return c!=null?`<span>CRV <b>1:${c.toFixed(1)}</b></span>`:''; })()}
      ${bewegungSpan(o)}
      ${x.r!=null&&(x.stufe==='im_trade'||x.stufe==='stop')?`<span>Stand <b class="${x.r>=0?'up':'dn'}">${x.r>=0?'+':''}${x.r.toFixed(2)}R</b></span>`:''}
      ${(w.erreicht||[]).length?`<span>erreicht <b>${w.erreicht.join(', ')}</b></span>`:''}
    </div>
    ${stueck>0?`<p style="color:var(--ink-2);font-size:12.5px">Bei 0,5 % Risiko auf
      ${num(equity,0)} €: rund <strong>${stueck}</strong> Stück ≈ ${num(euro,0)} € Einsatz,
      Verlust bei Stop rund ${num(Math.round(stueck*x.risiko),0)} €.${
      gedeckelt?` <span style="color:var(--warn)">Auf ${Math.round(MAX_ANTEIL*100)} % vom
      Kapital begrenzt — der Stop liegt so eng, dass 0,5 % Risiko mehr Geld bräuchte,
      als du hast.</span>`:''}</p>`:''}
    ${st&&st.trigger?`<p style="color:var(--ink-2);font-size:12px;margin-top:7px">
      <span style="color:var(--accent)">Auslöser:</span> ${esc(st.trigger)}</p>`:''}
    <div class="kpi" style="margin-top:8px">
      <span>${o.richtung==='short'?'Short über':'Kaufen bei'} <b>${esc(o.broker||'—')}</b></span>
      ${eurHinweis(o)?`<span>${eurHinweis(o)}</span>`:''}
    </div>
    ${euro>0?`<p style="font-size:11.5px;color:var(--ink-3);margin-top:6px">${gebuehrSatz(o, euro)}</p>`:''}
    ${erwartungsKasten(o)}
    ${chatgptZeile(w.instrument)}
    <p style="margin:10px 0 0"><button class="btn" data-kauf="${esc(w.instrument)}"
      data-menge="${stueck}" data-kurs="${w.einstieg}">Gekauft — ins Depot</button></p>
    ${(o.warnungen||[]).length?`<p class="warnz">${o.warnungen.map(esc).join('<br>')}</p>`:''}
  </div>`;
}

/* ============================================ DEINE ALARM-TRADES

   Bisher standen laufende Trades nur hier, solange ihr Setup im AKTUELLEN Scan noch
   handelbar war. Drehte der Scan auf „beobachten", verschwand der Trade von der Seite —
   obwohl Geld darin steckte. Diese Liste kommt deshalb aus der Wachliste selbst: jeder
   Trade, dessen Einstieg als Alarm aufs Handy ging, bis er laut Plan draussen ist. */
const PLAN_ZIEL_R = {TP1: 1, TP2: 2, TP3: 3.5};
function planR(w){
  // War der Plan schon draussen (Schutz-Stop), zählen nur die Ziele bis dahin — die Wache
  // läuft für die Statistik weiter, ein späteres Ziel 3 hat der Plan aber nicht mehr.
  if (w.raus && Array.isArray(w.raus_erreicht)){
    const v = w.raus_erreicht.filter(t => PLAN_ZIEL_R[t] != null);
    if (!v.length) return 0;
    const rest = v.includes('TP2') ? PLAN_ZIEL_R.TP1 : 0;
    return (v.reduce((a, t) => a + PLAN_ZIEL_R[t], 0) + (3 - v.length) * rest) / 3;
  }
  const e = (w.erreicht || []).filter(t => PLAN_ZIEL_R[t] != null);
  if (e.length) return e.reduce((a, t) => a + PLAN_ZIEL_R[t], 0) / 3;
  return w.zustand === 'stop' ? -1 : null;
}
function wacheName(w){
  return (w.name && w.name !== w.instrument) ? w.name : name(w.instrument);
}
function alarmTradesBlock(){
  const alle = ((WL && WL.wachen) || []).filter(w => w.gemeldet);
  const scanKurs = new Map((S?.gesamt || []).map(o => [o.instrument, o.kurs]));
  if (!alle.length) return '';
  return `<div id="alarmtrades">${alarmTradesInhalt(alle, scanKurs)}</div>`;
}
function alarmTradesInhalt(alle, scanKurs){
  const offen = alle.filter(w => w.zustand === 'aktiv' && !w.raus)
                    .sort((a,b) => String(b.gemeldet).localeCompare(String(a.gemeldet)));
  const fertig = alle.filter(w => !(w.zustand === 'aktiv' && !w.raus))
                     .sort((a,b) => String(b.zuletzt).localeCompare(String(a.zuletzt))).slice(0, 8);
  let h = '';
  if (offen.length){
    h += `<h2>Deine Alarm-Trades <span class="mono" style="font-size:12px;color:var(--ink-3)">${offen.length} offen — dazu klingeln Ziel, Stop und Ausstieg</span></h2>`;
    h += offen.map(w => {
      const d = digits(w.einstieg);
      const lang = w.richtung === 'long';
      // Live, wo es einen Stream gibt (Krypto); sonst der Kurs aus dem letzten Scan.
      const st = kursStand(w.instrument, scanKurs.get(w.instrument));
      const kurs = st.kurs;
      const basis = w.einstiegskurs ?? w.einstieg;
      const risiko = Math.abs(w.einstieg - w.stop);
      const r = (kurs != null && risiko > 0) ? (lang ? kurs - basis : basis - kurs) / risiko : null;
      const stopJetzt = w.schutz != null ? w.schutz : w.stop;
      const naechstes = [['TP1', w.tp1], ['TP2', w.tp2], ['TP3', w.tp3]]
        .find(([t, v]) => v != null && !(w.erreicht || []).includes(t));
      return `<div class="alarm hot" data-sym="${esc(w.instrument)}">
        <div class="ah"><span>${esc(wacheName(w))}</span>
          <span class="note">${lang ? 'LONG' : 'SHORT'} · ${esc(w.note)}</span>
          <span class="d">Alarm ${zeit(w.gemeldet)}</span></div>
        ${w.setup ? `<div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:5px">${esc(w.setup)}</div>` : ''}
        <div class="kpi">
          <span>Einstieg <b>${num(basis, d)}</b></span>
          <span>Stop jetzt <b>${num(stopJetzt, d)}</b>${w.schutz != null ? ' <span class="up">nachgezogen</span>' : ''}</span>
          ${naechstes ? `<span>Nächstes Ziel <b>${num(naechstes[1], d)}</b> <span style="color:var(--ink-3)">${naechstes[0].replace('TP','Ziel ')}</span></span>` : ''}
        </div>
        <div class="kpi">
          ${kurs != null ? `<span>Kurs <b>${num(kurs, d)}</b> ${st.live
            ? '<span class="up">live</span>' : '<span style="color:var(--ink-3)">aus dem Scan</span>'}</span>` : ''}
          ${r != null ? `<span>Stand <b class="${r >= 0 ? 'up' : 'dn'}">${r >= 0 ? '+' : ''}${r.toFixed(2)}R</b></span>` : ''}
          ${(w.erreicht || []).length ? `<span>erreicht <b>${w.erreicht.join(', ').replace(/TP/g,'Ziel ')}</b></span>` : ''}
          ${w.broker ? `<span>bei <b>${esc(w.broker)}</b></span>` : ''}
        </div>
      </div>`;
    }).join('');
  }
  if (fertig.length){
    h += `<h2>So gingen deine letzten Alarme aus</h2>`;
    h += `<div class="note-box"><p style="font-size:12.5px;color:var(--ink-2)">Gerechnet nach
      dem Plan aus dem Alarm: ein Drittel bei jedem Ziel, nach Ziel 1 Stop auf Einstand.
      „ohne Ergebnis" heisst: der Trade endete, bevor er Ziel oder Stop sah (Analyse
      gedreht, abgelaufen) — dann zählt der Kurs beim Ausstieg, und der steht hier nicht
      als Zahl, weil er nicht gemessen wurde.</p>`;
    h += `</div><div class="tw"><table class="mtf"><tr><th>Wert</th><th>Ausgang</th><th>R nach Plan</th></tr>`
      + fertig.map(w => {
        const r = planR(w);
        const was = w.raus && w.zustand === 'aktiv' ? 'nachgezogener Stop'
                  : (ZUSTAND_TEXT[w.zustand] || w.zustand);
        return `<tr><td>${esc(wacheName(w))}</td>
          <td>${esc(was)}${(() => { const e = (w.raus && Array.isArray(w.raus_erreicht)) ? w.raus_erreicht : (w.erreicht || []);
            return e.length ? '<br><span class="nu">' + e.join(', ').replace(/TP/g,'Ziel ') + '</span>' : ''; })()}</td>
          ${r == null ? '<td class="nu">ohne Ergebnis</td>'
            : `<td class="${r >= 0 ? 'up' : 'dn'}">${r >= 0 ? '+' : ''}${r.toFixed(2).replace('.',',')}</td>`}</tr>`;
      }).join('') + `</table></div>`;
  }
  return h;
}
