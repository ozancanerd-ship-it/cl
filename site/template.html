<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Desk</title>
<meta name="description" content="Live AI Trading Desk — Gesamtmarkt-Scan, eingezeichnete Chartanalyse, Portfolio. Paper, kein Echtgeld.">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F3F5F4; --surface:#FFFFFF; --surface-2:#EAEFEE; --sunk:#E2E8E7;
  --ink:#101718; --ink-2:#46585B; --ink-3:#7A8B8D;
  --rule:#DCE3E2; --rule-strong:#C3CFCD;
  --accent:#1D5C57; --accent-soft:#E2EDEB;
  --long:#2C6E49; --long-bg:#E4EFE8;
  --flat:#7A8B8D; --flat-bg:#E8ECEB;
  --warn:#A8720E; --warn-bg:#F7EDDA;
  --bad:#9E2B2B; --bad-bg:#F6E4E4;
  --grid:#E7ECEB; --wick:#8C9B9D;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1214; --surface:#131B1D; --surface-2:#1A2426; --sunk:#0F1719;
  --ink:#E3EBEA; --ink-2:#9DB0B2; --ink-3:#6D8082;
  --rule:#222F31; --rule-strong:#33474A;
  --accent:#4FA69E; --accent-soft:#16302E;
  --long:#5FAE81; --long-bg:#152A20;
  --flat:#6D8082; --flat-bg:#1A2426;
  --warn:#D9A441; --warn-bg:#2C2415;
  --bad:#D97878; --bad-bg:#2C1A1A;
  --grid:#1C2628; --wick:#5C6E70;
}}
:root[data-theme="dark"]{
  --paper:#0C1214; --surface:#131B1D; --surface-2:#1A2426; --sunk:#0F1719;
  --ink:#E3EBEA; --ink-2:#9DB0B2; --ink-3:#6D8082;
  --rule:#222F31; --rule-strong:#33474A;
  --accent:#4FA69E; --accent-soft:#16302E;
  --long:#5FAE81; --long-bg:#152A20;
  --flat:#6D8082; --flat-bg:#1A2426;
  --warn:#D9A441; --warn-bg:#2C2415;
  --bad:#D97878; --bad-bg:#2C1A1A;
  --grid:#1C2628; --wick:#5C6E70;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top)}
img{max-width:100%}
.wrap{max-width:760px; margin:0 auto; padding:0 16px 90px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
header{background:var(--surface); border-bottom:1px solid var(--rule); position:sticky; top:0; z-index:40}
.hd{max-width:760px; margin:0 auto; padding:18px 16px 0}
.crumb{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); display:flex; gap:10px; align-items:center; flex-wrap:wrap}
h1{font-family:Newsreader,Georgia,serif; font-weight:500; font-size:26px;
  line-height:1.1; letter-spacing:-.015em; margin:7px 0 0}
h2{font-family:Newsreader,Georgia,serif; font-weight:500; font-size:21px; letter-spacing:-.01em;
  margin:30px 0 10px}
h3{font-size:14px; font-weight:600; margin:20px 0 8px; letter-spacing:.01em}
.stamp{font-size:12.5px; color:var(--ink-3); margin-top:4px}
.chip{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px;
  font-weight:500; letter-spacing:.07em; text-transform:uppercase; padding:3px 8px; border-radius:100px}
.chip.paper{background:var(--warn-bg); color:var(--warn)}
.chip.live{background:var(--long-bg); color:var(--long)}
.chip.tot{background:var(--flat-bg); color:var(--flat)}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--long);
  margin-right:5px; vertical-align:middle}
.dot.aus{background:var(--flat)}
.puls{animation:puls 2s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.28}}
.tabs{display:flex; gap:2px; margin-top:16px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  font:inherit; font-size:13.5px; font-weight:500; color:var(--ink-3);
  padding:9px 12px; cursor:pointer; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.panel{padding-top:18px}
.lead{font-size:14px; color:var(--ink-2); margin:0 0 16px}

/* ---------- Statuszeile ---------- */
.status{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:14px;
  background:var(--rule); border:1px solid var(--rule); border-radius:4px; overflow:hidden}
.status div{background:var(--surface); padding:10px 11px}
.status .k{font-family:"IBM Plex Mono",monospace; font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
.status .v{font-family:Newsreader,Georgia,serif; font-size:21px; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.status .v.gut{color:var(--long)} .status .v.mittel{color:var(--warn)} .status .v.aus{color:var(--ink-3)}
@media (max-width:520px){.status{grid-template-columns:repeat(2,1fr)}}

/* ---------- Radar-Zeilen ---------- */
.filter{display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 4px}
.fb{appearance:none; border:1px solid var(--rule-strong); background:var(--surface);
  color:var(--ink-2); font:inherit; font-size:11.5px; font-weight:500; padding:5px 11px;
  border-radius:100px; cursor:pointer}
.fb[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.opp{background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--rule-strong);
  border-radius:4px; margin-bottom:8px; cursor:pointer; transition:border-color .12s}
.opp:hover{border-color:var(--rule-strong)}
.opp.n-A_PLUS{border-left-color:var(--long)} .opp.n-A{border-left-color:var(--long)}
.opp.n-A_MINUS{border-left-color:var(--accent)} .opp.n-B_PLUS{border-left-color:var(--accent)}
.opp.n-B{border-left-color:var(--warn)} .opp.n-WATCH{border-left-color:var(--rule-strong)}
.opp-h{display:flex; align-items:baseline; gap:8px; padding:11px 13px 6px; flex-wrap:wrap}
.opp-h .rk{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); min-width:22px}
.opp-h .nm{font-weight:600; font-size:15px}
.opp-h .kl{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3)}
.opp-h .dir{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em;
  padding:2px 6px; border-radius:3px}
.opp-h .dir.long{background:var(--long-bg); color:var(--long)}
.opp-h .dir.short{background:var(--bad-bg); color:var(--bad)}
.opp-h .note{font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:3px; background:var(--surface-2); color:var(--ink-2)}
.opp-h .note.gut{background:var(--long-bg); color:var(--long)}
.opp-h .note.mittel{background:var(--accent-soft); color:var(--accent)}
.opp-h .sc{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:18px;
  font-weight:600; font-variant-numeric:tabular-nums}
.opp-b{padding:0 13px 11px; font-size:12.5px; color:var(--ink-2)}
.kpi{display:flex; gap:14px; flex-wrap:wrap; font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; color:var(--ink-2); margin-top:5px}
.kpi b{color:var(--ink); font-weight:600}
.kpi .up{color:var(--long)} .kpi .dn{color:var(--bad)}
.warnz{margin-top:6px; font-size:11.5px; color:var(--warn)}
.muz{margin-top:5px; font-size:11.5px; color:var(--ink-3)}
.fak{display:grid; grid-template-columns:8.5em 3.2em 1fr; gap:3px 8px; align-items:center;
  font-size:11.5px; color:var(--ink-3); margin-top:3px}
.fak .fn{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.04em; text-transform:uppercase}
.fak .fb2{height:5px; background:var(--sunk); border-radius:3px; overflow:hidden}
.fak .fb2 i{display:block; height:100%; background:var(--accent)}
.fak .fd{color:var(--ink-2)}

/* ---------- Chart ---------- */
.chartbox{background:var(--surface); border:1px solid var(--rule); border-radius:4px; overflow:hidden}
.chart-h{display:flex; align-items:center; gap:9px; padding:10px 12px; border-bottom:1px solid var(--rule);
  flex-wrap:wrap}
.chart-h .nm{font-weight:600; font-size:16px}
.chart-h .px{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:17px; font-weight:600}
.chart-h .px.up{color:var(--long)} .chart-h .px.dn{color:var(--bad)}
.tfbar{display:flex; gap:2px; padding:7px 10px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.tfb{appearance:none; border:0; background:none; font:inherit; font-family:"IBM Plex Mono",monospace;
  font-size:11.5px; color:var(--ink-3); padding:4px 10px; border-radius:3px; cursor:pointer}
.tfb[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.layers{display:flex; gap:5px; padding:6px 10px 8px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.lb{appearance:none; border:1px solid var(--rule); background:var(--surface); font:inherit;
  font-size:10.5px; color:var(--ink-3); padding:3px 8px; border-radius:100px; cursor:pointer}
.lb[aria-pressed="true"]{background:var(--surface-2); color:var(--ink); border-color:var(--rule-strong)}
#cv{display:block; width:100%; height:420px; touch-action:none; cursor:crosshair}
@media (max-width:520px){#cv{height:330px}}
.legende{display:flex; gap:12px; flex-wrap:wrap; padding:8px 12px; border-top:1px solid var(--rule);
  font-size:10.5px; color:var(--ink-3); font-family:"IBM Plex Mono",monospace}
.legende span{display:flex; align-items:center; gap:4px}
.legende i{width:11px; height:3px; border-radius:2px; display:inline-block}
.readout{padding:7px 12px; border-top:1px solid var(--rule); font-family:"IBM Plex Mono",monospace;
  font-size:11px; color:var(--ink-2); min-height:30px}

/* ---------- Analyse ---------- */
.mtf{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px}
.mtf th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--rule)}
.mtf td{padding:7px 8px; border-bottom:1px solid var(--rule); vertical-align:top}
.mtf td.tf{font-family:"IBM Plex Mono",monospace; font-weight:600}
.mtf .up{color:var(--long)} .mtf .dn{color:var(--bad)} .mtf .nu{color:var(--ink-3)}
.satzliste{margin:6px 0 0; padding-left:18px; font-size:13px; color:var(--ink-2)}
.satzliste li{margin-bottom:5px}
.karte{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:13px 14px; margin-bottom:10px}
.karte h3{margin-top:0}
.karte.gut{border-left:3px solid var(--long)} .karte.warn{border-left:3px solid var(--warn)}
.karte.bad{border-left:3px solid var(--bad)}
.zt{display:flex; gap:12px; flex-wrap:wrap; font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  color:var(--ink-2); margin-top:8px; padding-top:8px; border-top:1px dashed var(--rule)}
.zt b{color:var(--ink)}
.note-box{background:var(--surface-2); border:1px solid var(--rule); border-radius:4px;
  padding:11px 13px; font-size:12.5px; color:var(--ink-2); margin:12px 0}
.note-box.warn{background:var(--warn-bg); border-color:transparent; color:var(--warn)}
.note-box.bad{background:var(--bad-bg); border-color:transparent; color:var(--bad)}
.note-box .nt{display:block; font-family:"IBM Plex Mono",monospace; font-size:9.5px;
  letter-spacing:.1em; text-transform:uppercase; margin-bottom:5px; font-weight:600}
.alarm{background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--rule-strong);
  border-radius:4px; padding:11px 13px; margin-bottom:8px}
.alarm.hot{border-left-color:var(--long); background:var(--long-bg)}
.alarm .ah{font-weight:600; font-size:14.5px; display:flex; gap:10px; align-items:baseline}
.alarm .ah .d{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3)}
.alarm p{margin:5px 0 0; font-size:12.5px}
.rowx{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid var(--rule);
  font-size:13px}
.rowx:last-child{border-bottom:0}
.rowx .lab{color:var(--ink-2)} .rowx .val{font-family:"IBM Plex Mono",monospace; font-weight:500}
.tw{overflow-x:auto}
.leer{color:var(--ink-3); font-size:13px; padding:16px 0}
.foot{max-width:760px; margin:0 auto; padding:26px 16px 40px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--ink-3)}
.foot p{margin:0 0 7px}
button.link{appearance:none; background:none; border:0; font:inherit; font-size:12.5px;
  color:var(--accent); cursor:pointer; padding:0; text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="crumb">
      <span>AI Trading Desk</span>
      <span class="chip paper">Paper</span>
      <span id="livechip" class="chip tot"><span class="dot aus"></span>offline</span>
    </div>
    <h1 id="kopf">Markt</h1>
    <div class="stamp" id="stempel">—</div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  aria-controls="p0" id="t0">Markt</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p1" id="t1">Chart</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p2" id="t2">Analyse</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p3" id="t3">Portfolio</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p4" id="t4">Plan</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p5" id="t5">Alarme</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="p6" id="t6">System</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="p0" role="tabpanel" aria-labelledby="t0">
    <div id="marktstatus"></div>
    <div class="filter" id="filter"></div>
    <div id="radar"><p class="leer">Scan wird geladen …</p></div>
  </section>

  <section class="panel" id="p1" role="tabpanel" aria-labelledby="t1" hidden>
    <div id="chartansicht"></div>
  </section>

  <section class="panel" id="p2" role="tabpanel" aria-labelledby="t2" hidden>
    <div id="analyse"></div>
  </section>

  <section class="panel" id="p3" role="tabpanel" aria-labelledby="t3" hidden>
    <div id="portfolio"></div>
  </section>

  <section class="panel" id="p4" role="tabpanel" aria-labelledby="t4" hidden>
    <div id="plan"></div>
  </section>

  <section class="panel" id="p5" role="tabpanel" aria-labelledby="t5" hidden>
    <div id="alarme"></div>
  </section>

  <section class="panel" id="p6" role="tabpanel" aria-labelledby="t6" hidden>
    <div id="system"></div>
  </section>
</main>

<div class="foot">
  <p id="built">—</p>
  <p>Nichts wird automatisch ausgeführt. Kein Echtgeld. Die Kurse laufen live von der
     Börse, die eingezeichnete Analyse stammt aus dem letzten Scan — beides steht mit
     eigenem Zeitstempel da, damit man es nicht verwechselt.</p>
</div>

<script id="payload" type="application/json">__DATA__</script>
<script>
'use strict';
/* =====================================================================
   AI TRADING DESK — Client
   Zwei Datenquellen, bewusst getrennt gehalten:
     D    der eingebettete Plan (TSMOM-Regel, Portfolio, Alarme) — Stand des Baus
     S    scan.json, zur Laufzeit geholt — der Gesamtmarkt-Scan
     L    Live-Kurse per Websocket von der Börse — jetzt
   Was live ist, ist mit einem Punkt markiert. Was aus dem Scan stammt, trägt dessen
   Zeitstempel. Eine Seite, die alles gleich aussehen lässt, verleitet dazu, einen
   Stand von vor einer Stunde für den aktuellen Kurs zu halten.
   ===================================================================== */
const D = JSON.parse(document.getElementById('payload').textContent);
const P = D.plan;
let S = null;                 // scan.json
let AKTIV = null;             // gewähltes Instrument (Detailobjekt)
let AKTIV_TF = 'H4';
const DETAIL = new Map();     // Instrument -> Detaildaten
const L = new Map();          // Instrument -> {p, pct, t}
let WS = null, WS_OK = false, WS_TRY = 0;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function digits(v){ v = Math.abs(v||0);
  return v >= 1000 ? 2 : v >= 10 ? 2 : v >= 1 ? 4 : v >= 0.01 ? 5 : 8; }
function num(v, d){ if (v == null || !isFinite(v)) return '—';
  return Number(v).toLocaleString('de-DE',
    {minimumFractionDigits: d ?? digits(v), maximumFractionDigits: d ?? digits(v)}); }
function pct(v, k){ if (v == null || !isFinite(v)) return '—';
  return (v>0?'+':'') + Number(v).toFixed(k ?? 2).replace('.',',') + ' %'; }
function zeit(iso){ if (!iso) return '—';
  try { return new Date(iso).toLocaleString('de-DE',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return '—'; } }
function vorMin(iso){ if (!iso) return null;
  const t = Date.parse(iso); return isFinite(t) ? Math.round((Date.now()-t)/60000) : null; }
function name(sym){ return (D.names && D.names[sym]) || sym; }

const NOTE_KLASSE = {'A+':'gut','A':'gut','A−':'mittel','B+':'mittel','B':'','WATCH':'','—':''};

/* ---------------------------------------------------------------- Tabs */
const TABS = [...document.querySelectorAll('.tab')];
const TITEL = ['Markt','Chart','Analyse','Portfolio','Plan','Alarme','System'];
function zeigeTab(i){
  TABS.forEach((t,k)=>{
    t.setAttribute('aria-selected', k===i ? 'true':'false');
    $('p'+k).hidden = k!==i;
  });
  $('kopf').textContent = (i===1||i===2) && AKTIV ? AKTIV.instrument : TITEL[i];
  if (i===1) requestAnimationFrame(()=>chart.groesse());
  try { history.replaceState(null,'','#'+i); } catch(e){}
}
TABS.forEach((t,i)=>t.addEventListener('click',()=>zeigeTab(i)));

/* ------------------------------------------------------- Scan laden */
async function ladeScan(){
  try {
    const r = await fetch('scan.json?v=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S = await r.json();
  } catch(e){
    S = null;
    $('radar').innerHTML = `<div class="note-box bad"><span class="nt">Scan nicht ladbar</span>
      <p>${esc(e.message)}. Es wird bewusst keine alte Rangliste gezeigt — ein veralteter
      Scan wäre schlimmer als keiner.</p></div>`;
    return;
  }
  zeichneStatus(); zeichneFilter(); zeichneRadar(); zeichneSystem();
  const start = (S.gesamt||[]).find(o=>o.handelbar) || (S.gesamt||[])[0];
  if (start && !AKTIV) waehle(start.instrument, false);
  starteLive();
}

async function ladeDetail(sym){
  if (DETAIL.has(sym)) return DETAIL.get(sym);
  try {
    const r = await fetch('asset/' + encodeURIComponent(sym) + '.json?v=' + (S?.erzeugt||''),
      {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    DETAIL.set(sym, d);
    return d;
  } catch(e){ DETAIL.set(sym, null); return null; }
}

async function waehle(sym, wechseln = true){
  const d = await ladeDetail(sym);
  AKTIV = d || {instrument: sym, zeichnung:{}, mtf:[], muster:[], kommentar:null,
                chance: (S?.gesamt||[]).find(o=>o.instrument===sym) || null};
  const ebenen = Object.keys(AKTIV.zeichnung||{});
  if (!ebenen.includes(AKTIV_TF)) AKTIV_TF = ebenen.includes('H4') ? 'H4' : (ebenen[0]||'H4');
  zeichneChartAnsicht(); zeichneAnalyse(); abonniere(sym);
  if (wechseln) zeigeTab(1);
  $('kopf').textContent = sym;
}

/* ------------------------------------------------------------ Live */
/* Die Börse liefert die Kurse direkt an den Browser. Kein eigener Server, keine
   Zwischenspeicherung, kein Schlüssel — es ist der öffentliche Marktdaten-Stream.
   Aktien haben kein frei zugängliches Live-Feed mit CORS; sie bleiben auf dem Stand
   des Scans und werden auch so beschriftet. */
function kryptoSymbole(){
  if (!S) return [];
  const aus = [];

/* ================================================================
   CHART — eigener Renderer auf Canvas.
   Warum keine Bibliothek: die Analyse besteht zum grössten Teil aus Zonen, Levels,
   Strukturbrüchen und Beschriftungen. Jede fertige Chart-Bibliothek müsste dafür
   erweitert werden, und die Erweiterung wäre grösser als der Renderer selbst.
   Ausserdem lädt die Seite so nichts nach.
   ================================================================ */
const chart = (()=>{
  let cv = null, ctx = null, B = [], Z = null, C = null;
  let i0 = 0, anz = 120, hoverX = null, hoverY = null;
  let ziehen = null, letzterPreis = null;
  const EBENEN = {swings:true, brueche:true, liq:true, zonen:true, pd:false, ziele:true};
  const M = {l: 6, r: 62, t: 10, b: 22};

  function farbe(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function setze(kerzen, zeichnungTf, chance){
    B = (kerzen||[]).map(k=>({t:k[0], o:k[1], h:k[2], l:k[3], c:k[4], v:k[5]}));
    Z = zeichnungTf || null; C = chance || null;
    anz = Math.min(140, Math.max(40, B.length));
    i0 = Math.max(0, B.length - anz);
    letzterPreis = B.length ? B[B.length-1].c : null;
    zeichne();
  }
  function setzeLivePreis(p){
    if (!B.length || !isFinite(p)) return;
    const last = B[B.length-1];
    last.c = p; if (p > last.h) last.h = p; if (p < last.l) last.l = p;
    letzterPreis = p; zeichne();
  }
  function ebene(k, an){ EBENEN[k] = an; zeichne(); }
  function ebenen(){ return EBENEN; }

  function groesse(){
    cv = $('cv'); if (!cv) return;
    ctx = cv.getContext('2d');
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    zeichne();
  }

  function sicht(){
    const a = Math.max(0, Math.min(i0, Math.max(0, B.length-5)));
    return B.slice(a, a + anz);
  }
  /* Preisspanne der Ansicht.
     Wichtig ist die Reihenfolge: Der erlaubte Rahmen wird EINMAL aus den Kerzen
     bestimmt und danach nicht mehr verändert. Vorher wurde er in der Schleife
     mitgezogen — dann hat jedes akzeptierte Level den Rahmen für das nächste
     geweitet, und ein paar entfernte Liquiditätsmarken haben die Kerzen zu einem
     Streifen in der Mitte zusammengedrückt. Was ausserhalb liegt, wird nicht
     weggelassen, sondern als Marke am Rand gezeigt. */
  let ausserhalb = [];
  function spanne(v){
    let khi = -Infinity, klo = Infinity;
    for (const b of v){ if (b.h > khi) khi = b.h; if (b.l < klo) klo = b.l; }
    if (!isFinite(khi) || !isFinite(klo) || khi === klo){
      khi = (khi||1) * 1.01; klo = (klo||1) * 0.99;
    }
    const kspanne = khi - klo;
    const maxHi = khi + kspanne * 0.55, minLo = klo - kspanne * 0.55;
    let hi = khi, lo = klo;
    ausserhalb = [];
    const kandidaten = [];
    if (EBENEN.ziele && C){
      for (const [lab, k] of [['Kurs','kurs'],['TP1','ziel'],['TP2','tp2'],['TP3','tp3'],['Stop','invalidierung']])
        if (C[k] != null) kandidaten.push([lab, C[k]]);
    }
    if (EBENEN.liq && Z) for (const x of (Z.liquiditaet||[])) kandidaten.push([null, x.p]);
    for (const [lab, p] of kandidaten){
      if (!isFinite(p)) continue;
      if (p > maxHi || p < minLo){ if (lab) ausserhalb.push([lab, p, p > maxHi]); continue; }
      if (p > hi) hi = p;
      if (p < lo) lo = p;
    }
    const luft = (hi - lo) * 0.06;
    return {hi: hi + luft, lo: lo - luft};
  }

  function zeichne(){
    if (!cv || !ctx) { cv = $('cv'); if (!cv) return; ctx = cv.getContext('2d'); }
    const r = cv.getBoundingClientRect(), W = r.width, H = r.height;
    ctx.clearRect(0,0,W,H);
    const v = sicht(); if (!v.length) return;
    const {hi, lo} = spanne(v);
    const px = W - M.l - M.r, py = H - M.t - M.b;
    const X = i => M.l + (i + 0.5) * (px / v.length);
    const Y = p => M.t + (hi - p) / (hi - lo) * py;
    const bw = Math.max(1.2, Math.min(11, px / v.length * 0.68));

    const cRule = farbe('--grid'), cInk = farbe('--ink'), cInk3 = farbe('--ink-3');
    const cLong = farbe('--long'), cBad = farbe('--bad'), cWick = farbe('--wick');
    const cAcc = farbe('--accent'), cWarn = farbe('--warn'), cSurf = farbe('--surface');

    // Raster + Preisachse
    ctx.font = '10px "IBM Plex Mono",monospace'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = cRule; ctx.lineWidth = 1;
    const stufen = 5, d = digits((hi+lo)/2);
    for (let k=0;k<=stufen;k++){
      const p = lo + (hi-lo)*k/stufen, y = Math.round(Y(p)) + 0.5;
      ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(W-M.r, y); ctx.stroke();
      ctx.fillStyle = cInk3; ctx.textAlign = 'left';
      ctx.fillText(num(p, d), W-M.r+5, y);
    }

    // Zonen (hinter den Kerzen)
    if (EBENEN.zonen && Z) for (const z of (Z.zonen||[])){
      const y1 = Y(z.bis), y2 = Y(z.von);
      if (y2 < M.t-40 || y1 > H-M.b+40) continue;
      const lang = z.richtung === 'bullish' || z.richtung === 'long';
      ctx.fillStyle = (lang ? cLong : cBad) + '1f';
      ctx.fillRect(M.l, Math.min(y1,y2), px, Math.max(1.5, Math.abs(y2-y1)));
      ctx.fillStyle = cInk3; ctx.font = '9px "IBM Plex Mono",monospace'; ctx.textAlign = 'left';
      if (Math.abs(y2-y1) > 9) ctx.fillText(z.art, M.l+3, Math.min(y1,y2)+6);
    }

    // Premium / Discount
    if (EBENEN.pd && Z && Z.pd){
      const yh = Y(Z.pd.hoch), ym = Y(Z.pd.mitte), yl = Y(Z.pd.tief);
      ctx.strokeStyle = cAcc + '77'; ctx.setLineDash([2,3]); ctx.lineWidth = 1;
      for (const y of [yh, ym, yl]){ ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.fillStyle = cAcc; ctx.font = '9px "IBM Plex Mono",monospace'; ctx.textAlign = 'left';
      ctx.fillText('EQ', M.l+2, ym-6);
    }

    // Liquidität
    if (EBENEN.liq && Z) for (const x of (Z.liquiditaet||[])){
      const y = Y(x.p); if (y < M.t-20 || y > H-M.b+20) continue;
      const weg = x.zustand === 'swept';
      ctx.strokeStyle = weg ? cInk3 + '55' : cWarn + 'aa';
      ctx.setLineDash(weg ? [1,4] : [5,4]);
      ctx.lineWidth = Math.min(2, 0.7 + (x.staerke||0)*1.6);
      ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Kerzen
    for (let i=0;i<v.length;i++){
      const b = v[i], x = X(i), auf = b.c >= b.o;
      ctx.strokeStyle = cWick; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, Y(b.h)); ctx.lineTo(Math.round(x)+0.5, Y(b.l)); ctx.stroke();
      ctx.fillStyle = auf ? cLong : cBad;
      const yo = Y(b.o), yc = Y(b.c);
      ctx.fillRect(x - bw/2, Math.min(yo,yc), bw, Math.max(1.2, Math.abs(yc-yo)));
    }

    // Swings
    if (EBENEN.swings && Z){
      const idx = new Map(v.map((b,i)=>[b.t, i]));
      ctx.font = '9px "IBM Plex Mono",monospace';
      for (const s of (Z.swings||[])){
        const i = idx.get(s.t); if (i == null) continue;
        const x = X(i), y = Y(s.p);
        ctx.fillStyle = s.hoch ? cBad : cLong;
        ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 6.2832); ctx.fill();
        if (s.label && s.label !== 'NONE'){
          ctx.textAlign = 'center'; ctx.fillStyle = cInk3;
          ctx.fillText(s.label, x, y + (s.hoch ? -9 : 12));
        }
      }
    }

    // Strukturbrüche
    if (EBENEN.brueche && Z){
      const idx = new Map(v.map((b,i)=>[b.t, i]));
      ctx.font = '9px "IBM Plex Mono",monospace';
      for (const br of (Z.brueche||[])){
        const i = idx.get(br.t);
        const y = Y(br.p);
        if (y < M.t-20 || y > H-M.b+20) continue;
        const lang = br.richtung === 'bullish';
        ctx.strokeStyle = (lang ? cLong : cBad) + 'cc'; ctx.setLineDash([6,3]); ctx.lineWidth = 1.4;
        const x0 = i == null ? M.l : X(i);
        ctx.beginPath(); ctx.moveTo(Math.max(M.l, x0-40), y); ctx.lineTo(W-M.r, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = lang ? cLong : cBad; ctx.textAlign = 'left';
        ctx.fillText(br.art, Math.max(M.l+2, x0-38), y-4);
      }
    }

    // Entry / Stop / Ziele
    if (EBENEN.ziele && C){
      const linien = [
        ['Kurs', C.kurs, cInk],
        ['TP1', C.ziel, cLong], ['TP2', C.tp2, cLong], ['TP3', C.tp3, cLong],
        ['Stop', C.invalidierung, cBad],
      ];
      ctx.font = '9.5px "IBM Plex Mono",monospace';
      for (const [lab, p, col] of linien){
        if (p == null || !isFinite(p)) continue;
        const y = Y(p); if (y < M.t-14 || y > H-M.b+14) continue;
        ctx.strokeStyle = col; ctx.lineWidth = lab==='Kurs' ? 1 : 1.6;
        ctx.setLineDash(lab==='Kurs' ? [1,3] : []);
        ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = col; ctx.textAlign = 'left';
        ctx.fillText(lab, M.l+3, y-4);
      }
    }

    // Was ausserhalb der Ansicht liegt, als Marke am Rand — statt es zu verschweigen
    // oder dafür die Kerzen platt zu drücken.
    if (ausserhalb.length){
      ctx.font = '9.5px "IBM Plex Mono",monospace'; ctx.textAlign = 'right';
      let obenN = 0, untenN = 0;
      for (const [lab, p, oben] of ausserhalb){
        const y = oben ? M.t + 10 + (obenN++)*13 : H - M.b - 8 - (untenN++)*13;
        ctx.fillStyle = lab === 'Stop' ? cBad : cLong;
        ctx.fillText(`${lab} ${num(p, d)} ${oben?'↑':'↓'}`, W - M.r - 6, y);
      }
    }

    // Letzter Kurs als Marke an der Achse
    if (letzterPreis != null){
      const y = Y(letzterPreis);
      if (y > M.t && y < H-M.b){
        ctx.fillStyle = cAcc; ctx.fillRect(W-M.r, y-8, M.r, 16);
        ctx.fillStyle = cSurf; ctx.font = '10px "IBM Plex Mono",monospace';
        ctx.textAlign = 'left'; ctx.fillText(num(letzterPreis, d), W-M.r+4, y);
      }
    }

    // Zeitachse
    ctx.fillStyle = cInk3; ctx.font = '9.5px "IBM Plex Mono",monospace'; ctx.textAlign = 'center';
    const schritt = Math.max(1, Math.floor(v.length/5));
    for (let i=0;i<v.length;i+=schritt){
      const t = v[i].t ? new Date(v[i].t) : null; if (!t) continue;
      ctx.fillText(t.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}), X(i), H-M.b+11);
    }

    // Fadenkreuz
    if (hoverX != null && hoverX > M.l && hoverX < W-M.r){
      const i = Math.max(0, Math.min(v.length-1, Math.floor((hoverX-M.l)/(px/v.length))));
      ctx.strokeStyle = cInk3 + '66'; ctx.setLineDash([2,3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(i), M.t); ctx.lineTo(X(i), H-M.b); ctx.stroke();
      if (hoverY != null){ ctx.beginPath(); ctx.moveTo(M.l,hoverY); ctx.lineTo(W-M.r,hoverY); ctx.stroke(); }
      ctx.setLineDash([]);
      const b = v[i], el = $('readout');
      if (el){
        const p = hoverY != null ? hi - (hoverY-M.t)/py*(hi-lo) : null;
        el.textContent =
          `${b.t ? new Date(b.t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}` +
          `   O ${num(b.o,d)}  H ${num(b.h,d)}  L ${num(b.l,d)}  C ${num(b.c,d)}` +
          (p != null ? `   ·   Cursor ${num(p,d)}` : '');
      }
    }
  }

  let globalGebunden = false;
  function binde(){
    cv = $('cv'); if (!cv) return;
    groesse();
    cv.addEventListener('wheel', e=>{
      e.preventDefault();
      const alt = anz;
      anz = Math.round(Math.max(25, Math.min(B.length || 400, anz * (e.deltaY > 0 ? 1.15 : 0.87))));
      i0 = Math.max(0, Math.min(B.length - anz, i0 + Math.round((alt - anz)/2)));
      zeichne();
    }, {passive:false});
    const runter = e=>{ ziehen = {x: (e.touches?e.touches[0]:e).clientX, i0}; };
    const bewegen = e=>{
      const t = e.touches ? e.touches[0] : e;
      const r = cv.getBoundingClientRect();
      hoverX = t.clientX - r.left; hoverY = t.clientY - r.top;
      if (ziehen){
        const px = r.width - M.l - M.r;
        const dx = t.clientX - ziehen.x;
        i0 = Math.max(0, Math.min(Math.max(0,B.length - anz),
             ziehen.i0 - Math.round(dx / (px / anz))));
      }
      zeichne();
    };
    const hoch = ()=>{ ziehen = null; };
    cv.addEventListener('pointerdown', runter);
    cv.addEventListener('pointermove', bewegen);
    // Nur einmal aufs Fenster hängen: die Chart-Ansicht wird bei jedem Wechsel des
    // Instruments oder der Zeitebene neu gebaut, und sonst sammeln sich die Handler.
    if (!globalGebunden){ window.addEventListener('pointerup', ()=>{ ziehen = null; }); globalGebunden = true; }
    cv.addEventListener('pointerleave', ()=>{ hoverX = hoverY = null; zeichne(); });
    cv.addEventListener('touchstart', runter, {passive:true});
    cv.addEventListener('touchmove', bewegen, {passive:true});
    cv.addEventListener('touchend', hoch);
  }
  window.addEventListener('resize', ()=>groesse());
  return {setze, setzeLivePreis, zeichne, groesse, binde, ebene, ebenen};
})();

function zeichneFilter(){
  const f = [
    ['handelbar','Handelbar'], ['alle','Alles'], ['krypto','Krypto'],
    ['aktien','Aktien'], ['gold','Gold'], ['long','Long'], ['short','Short'],
  ];
  $('filter').innerHTML = f.map(([k,t])=>
    `<button class="fb" data-f="${k}" aria-pressed="${FILTER===k}">${t}</button>`).join('');
  $('filter').querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
    FILTER = b.dataset.f; zeichneFilter(); zeichneRadar();
  }));
}

function gefiltert(){
  const g = (S?.gesamt || []).slice();
  switch (FILTER){
    case 'handelbar': return g.filter(o=>o.handelbar);
    case 'krypto': case 'aktien': case 'gold': return g.filter(o=>o.klasse===FILTER);
    case 'long': return g.filter(o=>o.richtung==='long');
    case 'short': return g.filter(o=>o.richtung==='short');
    default: return g;
  }
}

function zeichneRadar(){
  const g = gefiltert();
  if (!g.length){ $('radar').innerHTML = `<p class="leer">Kein Wert in dieser Auswahl.</p>`; return; }
  $('radar').innerHTML = g.slice(0,60).map((o,i)=>oppZeile(o,i+1)).join('') +

  $('radar').querySelectorAll('.opp').forEach(el=>
    el.addEventListener('click',()=>waehle(el.dataset.sym)));
}

/* ============================================================ PORTFOLIO
   Die Positionen liegen ausschliesslich in diesem Browser (localStorage). Das Repo
   und damit diese Seite sind oeffentlich — echte Depotdaten gehoeren dort nicht hin.
   So bekommt Ozan trotzdem das Cockpit: gerechnet wird im Geraet, hochgeladen nichts.
   ============================================================ */
const SPEICHER = 'desk.positionen.v1';
function ladePositionen(){
  try { const r = localStorage.getItem(SPEICHER); const a = r ? JSON.parse(r) : [];
        return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function speicherePositionen(a){
  try { localStorage.setItem(SPEICHER, JSON.stringify(a)); } catch(e){}
}
function scanRow(sym){ return (S?.gesamt||[]).find(o=>o.instrument===sym) || null; }

function bewertePosition(pos){
  const row = scanRow(pos.sym);
  const live = L.get(pos.sym);
  const kurs = live ? live.p : (row ? row.kurs : null);
  const wert = kurs != null ? kurs * pos.menge : null;
  const einstand = pos.einstieg ? pos.einstieg * pos.menge : null;
  const gv = (wert != null && einstand != null) ? wert - einstand : null;
  const gvPct = (gv != null && einstand) ? gv / einstand * 100 : null;
  let r = null;
  if (row && row.invalidierung != null && pos.einstieg){
    const risiko = Math.abs(pos.einstieg - row.invalidierung);
    if (risiko > 0 && kurs != null) r = (kurs - pos.einstieg) / risiko;
  }
  const score = row ? row.score : null;
  let urteil = 'UNBEKANNT', kl = '';
  if (score != null){
    const gegen = row.richtung === 'short';
    if (gegen) { urteil = 'GEGEN DIE THESE'; kl = 'bad'; }
    else if (score >= 66) { urteil = 'STRONG HOLD'; kl = 'gut'; }
    else if (score >= 52) { urteil = 'HOLD'; kl = 'gut'; }
    else if (score >= 40) { urteil = 'WATCH'; kl = 'warn'; }
    else { urteil = 'REDUZIEREN'; kl = 'bad'; }
  }
  return {pos, row, kurs, wert, einstand, gv, gvPct, r, score, urteil, kl, live: !!live};
}

function zeichnePortfolio(){
  const positionen = ladePositionen();
  const bew = positionen.map(bewertePosition);
  const gesamt = bew.reduce((s,b)=>s + (b.wert||0), 0);
  const gv = bew.reduce((s,b)=>s + (b.gv||0), 0);
  const einstand = bew.reduce((s,b)=>s + (b.einstand||0), 0);
  const jeKlasse = {};
  for (const b of bew){
    const k = b.row?.klasse || 'unbekannt';
    jeKlasse[k] = (jeKlasse[k]||0) + (b.wert||0);
  }
  const groesste = bew.slice().sort((a,b)=>(b.wert||0)-(a.wert||0))[0];
  const konz = (groesste && gesamt) ? (groesste.wert||0)/gesamt*100 : 0;

  let h = `<div class="note-box"><span class="nt">Nur auf diesem Gerät</span>
    <p>Deine Positionen werden ausschließlich lokal in diesem Browser gespeichert. Sie
    gehen nicht ins Repo, nicht auf die öffentliche Seite und nicht an mich. Auf einem
    anderen Gerät musst du sie erneut eintragen.</p></div>`;

  if (bew.length){
    h += `<div class="status">
      <div><div class="k">Depotwert</div><div class="v">${num(gesamt,0)} €*</div>
        <div class="n">${bew.length} Position(en)</div></div>
      <div><div class="k">Gewinn / Verlust</div><div class="v ${gv>=0?'gut':'aus'}">${num(gv,0)}</div>
        <div class="n">${einstand?pct(gv/einstand*100,1):'—'}</div></div>
      <div><div class="k">Konzentration</div><div class="v ${konz>35?'mittel':'gut'}">${konz.toFixed(0)} %</div>
        <div class="n">größte: ${esc(groesste?name(groesste.pos.sym):'—')}</div></div>
      <div><div class="k">Aufteilung</div><div class="v" style="font-size:14px;font-family:'IBM Plex Mono',monospace">
        ${Object.entries(jeKlasse).map(([k,v])=>`${k.slice(0,3)} ${gesamt?Math.round(v/gesamt*100):0}%`).join('<br>')||'—'}</div></div>
    </div>
    <p class="leer" style="padding:6px 0">* in der Währung deiner Eingabe gerechnet — Kurse
      kommen für Krypto live von der Börse, für Aktien aus dem letzten Scan.</p>`;

    h += `<h2>Positionen</h2>`;
    h += bew.map(b=>{
      const d = digits(b.kurs||1);
      const r = b.row;
      return `<div class="karte ${b.kl}">
        <h3>${esc(name(b.pos.sym))} <span class="mono" style="font-weight:400;color:var(--ink-3)">${esc(b.pos.konto||'')}</span>
          <span style="float:right" class="note ${b.kl==='gut'?'gut':''}">${esc(b.urteil)}</span></h3>
        <div class="kpi">
          <span>Menge <b>${num(b.pos.menge, 6)}</b></span>
          <span>Einstieg <b>${num(b.pos.einstieg,d)}</b></span>
          <span>Kurs <b>${num(b.kurs,d)}</b>${b.live?' <span class="up">live</span>':''}</span>
          ${b.gvPct!=null?`<span>G/V <b class="${b.gvPct>=0?'up':'dn'}">${pct(b.gvPct,1)}</b></span>`:''}
          ${b.r!=null?`<span>R <b class="${b.r>=0?'up':'dn'}">${b.r.toFixed(2)}R</b></span>`:''}
        </div>
        ${r?`<div class="zt">
          <span>Score <b>${r.score.toFixed(0)}</b></span>
          <span>Note <b>${esc(r.note)}</b></span>
          ${r.ziel!=null?`<span>TP1 <b>${num(r.ziel,d)}</b></span>`:''}
          ${r.tp2!=null?`<span>TP2 <b>${num(r.tp2,d)}</b></span>`:''}
          ${r.invalidierung!=null?`<span>Stop <b>${num(r.invalidierung,d)}</b></span>`:''}
        </div>
        <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">${esc(r.headline||'')}</p>`
        : `<p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-3)">
             Nicht im letzten Scan — keine Bewertung. Entweder außerhalb des Universums
             oder die Datenquelle war stumm.</p>`}
        <p style="margin:9px 0 0"><button class="link" data-weg="${esc(b.pos.sym)}">entfernen</button>
          ${r?` · <button class="link" data-zeig="${esc(b.pos.sym)}">Chart ansehen</button>`:''}</p>
      </div>`;
    }).join('');

    // Rotation
    const beste = (S?.gesamt||[]).filter(o=>o.handelbar)[0];
    const schwaechste = bew.filter(b=>b.score!=null).sort((a,b)=>a.score-b.score)[0];
    if (beste && schwaechste && beste.score - schwaechste.score >= 15 &&
        beste.instrument !== schwaechste.pos.sym){
      h += `<div class="note-box warn"><span class="nt">Kapital könnte besser stehen</span>
        <p><strong>${esc(name(schwaechste.pos.sym))}</strong> steht bei Score
        ${schwaechste.score.toFixed(0)}, während <strong>${esc(name(beste.instrument))}</strong>
        gerade ${beste.score.toFixed(0)} hat (${esc(beste.note)}${beste.erwartete_bewegung_pct!=null?', erwartet '+pct(beste.erwartete_bewegung_pct,1):''}).</p>
        <p>Das ist ein Hinweis, keine Anweisung — und nichts wird automatisch umgeschichtet.
        Ein Wechsel kostet Gebühren und Spread und wirft die laufende These weg.</p></div>`;
    }
  } else {
    h += `<p class="leer">Noch keine Positionen eingetragen.</p>`;
  }

  h += `<h2>Position eintragen</h2>
    <div class="karte">
      <div class="rowx"><span class="lab">Symbol</span>
        <input id="pf_sym" class="val" placeholder="BTCUSDT oder NVDA" style="width:52%"></div>
      <div class="rowx"><span class="lab">Menge</span>
        <input id="pf_menge" class="val" inputmode="decimal" placeholder="0,25" style="width:52%"></div>
      <div class="rowx"><span class="lab">Einstiegskurs</span>
        <input id="pf_einstieg" class="val" inputmode="decimal" placeholder="61000" style="width:52%"></div>
      <div class="rowx"><span class="lab">Konto</span>
        <input id="pf_konto" class="val" placeholder="Bybit / Trade Republic" style="width:52%"></div>
      <p style="margin:11px 0 0"><button class="link" id="pf_add">Hinzufügen</button>
        ${bew.length?` · <button class="link" id="pf_clear">alle löschen</button>`:''}</p>
    </div>`;

  $('portfolio').innerHTML = h;
  $('portfolio').querySelectorAll('[data-weg]').forEach(b=>b.addEventListener('click',()=>{
    speicherePositionen(ladePositionen().filter(p=>p.sym!==b.dataset.weg)); zeichnePortfolio();
  }));
  $('portfolio').querySelectorAll('[data-zeig]').forEach(b=>b.addEventListener('click',()=>
    waehle(b.dataset.zeig)));
  const add = $('pf_add');
  if (add) add.addEventListener('click',()=>{
    const sym = ($('pf_sym').value||'').trim().toUpperCase();
    const menge = parseFloat(($('pf_menge').value||'').replace(',','.'));
    const einstieg = parseFloat(($('pf_einstieg').value||'').replace(',','.'));
    if (!sym || !isFinite(menge) || menge <= 0) return;
    const a = ladePositionen().filter(p=>p.sym!==sym);
    a.push({sym, menge, einstieg: isFinite(einstieg)?einstieg:null,
            konto: ($('pf_konto').value||'').trim()});
    speicherePositionen(a); zeichnePortfolio();
  });
  const clear = $('pf_clear');
  if (clear) clear.addEventListener('click',()=>{ speicherePositionen([]); zeichnePortfolio(); });
}
let _pfZuletzt = 0;
function aktualisierePortfolioKurse(){
  if ($('p3').hidden) return;
  // Nicht neu zeichnen, waehrend jemand tippt — sonst springt der Fokus aus dem Feld.
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT') return;
  if (Date.now() - _pfZuletzt < 5000) return;
  _pfZuletzt = Date.now();

  }
  h += `<h2>Grenzen</h2><div class="karte">
    ${Object.entries(D.rules||{}).map(([k,v])=>`<div class="rowx">
      <span class="lab">${esc(k.replace(/_/g,' '))}</span><span class="val">${num(v,1)}</span></div>`).join('')}
  </div>`;
  $('plan').innerHTML = h;
}

/* ============================================================ ALARME */
function zeichneAlarme(){
  let h = '';
  const kand = (S?.gesamt||[]).filter(o=>o.handelbar);
  h += `<h2>Aktive Setups</h2>`;
  if (kand.length){
    h += kand.slice(0,12).map(o=>{
      const d = digits(o.kurs);
      return `<div class="alarm ${o.urteil==='A_PLUS'||o.urteil==='A'?'hot':''}" data-sym="${esc(o.instrument)}">
        <div class="ah"><span>${esc(name(o.instrument))} ${o.richtung?o.richtung.toUpperCase():''}</span>
          <span class="d">${esc(o.note)} · ${(o.score||0).toFixed(0)}/100</span></div>
        <p>Kurs <strong>${num(o.kurs,d)}</strong> · Ziel <strong>${num(o.ziel,d)}</strong>${
          o.tp2!=null?' / '+num(o.tp2,d):''}${o.tp3!=null?' / '+num(o.tp3,d):''} ·
          falsch ab <strong>${num(o.invalidierung,d)}</strong>${o.rr?' · CRV 1:'+o.rr.toFixed(2):''}${
          o.erwartete_bewegung_pct!=null?' · erwartet '+pct(o.erwartete_bewegung_pct,1):''}</p>
        <p style="color:var(--ink-3)">${esc(o.headline||'')}</p>
      </div>`;
    }).join('');
  } else {
    h += `<div class="alarm"><div class="ah"><span>Kein handelbares Setup</span></div>
      <p>Im letzten Scan hat kein Wert Score, Chance-Risiko-Verhältnis und erwartete
      Bewegung gleichzeitig erreicht. Das ist ein Ergebnis, kein Ausfall.</p></div>`;
  }

  const A = D.alarme || [];
  h += `<h2>Zuletzt verschickt</h2>`;
  h += A.length ? A.map(a=>`<div class="alarm ${a.severity==='CRITICAL'?'hot':''}">
      <div class="ah"><span>${esc(a.title||'')}</span><span class="d">${zeit(a.ts)}</span></div>
      ${a.body?`<p style="white-space:pre-wrap">${esc(a.body)}</p>`:''}
    </div>`).join('')
    : `<div class="alarm"><div class="ah"><span>Noch nichts verschickt</span></div>
       <p>Entweder hat sich nichts geändert, das eine Meldung wert war — oder Telegram ist
       noch nicht eingerichtet. Bleibt der Verlauf tagelang leer, während oben Setups
       stehen, fehlen die beiden Telegram-Schlüssel.</p></div>`;

  h += `<div class="note-box warn" style="margin-top:22px"><span class="nt">Warum so wenige Alarme</span>
    <p>Der Marktscan läuft <strong>stündlich</strong>. Aufs Handy geht nur die
    <strong>Änderung</strong>: ein Setup entsteht, ein Setup bricht weg, die Nummer 1
    wechselt. Dieselbe Meldung frühestens nach zwölf Stunden wieder.</p>
    <p>Fällt eine Anlageklasse aus, gelten ihre Werte als <em>unbekannt</em>, nicht als
    verschwunden — sonst meldet das System „Setup entfallen", obwohl nur die Kursquelle
    geschwiegen hat.</p></div>`;
  $('alarme').innerHTML = h;
  $('alarme').querySelectorAll('[data-sym]').forEach(el=>
    el.addEventListener('click',()=>waehle(el.dataset.sym)));
}

/* ============================================================ SYSTEM */
function zeichneSystem(){
  const u = S?.universum || {};
  const k = u.krypto || {};
  let h = `<h2>Letzter Scan</h2><div class="karte">
    <div class="rowx"><span class="lab">Zeitpunkt</span><span class="val">${zeit(S?.erzeugt)}</span></div>
    <div class="rowx"><span class="lab">Dauer</span><span class="val">${S?.dauer_s??'—'} s</span></div>
    <div class="rowx"><span class="lab">Profil</span><span class="val">${esc(S?.profil||'—')}</span></div>
    <div class="rowx"><span class="lab">Instrumente</span><span class="val">${(S?.gesamt||[]).length}</span></div>
    <div class="rowx"><span class="lab">Detailansichten</span><span class="val">${(S?.detail_vorhanden||[]).length}</span></div>
  </div>`;
  if (k.gesamt){
    h += `<h2>Krypto-Universum</h2><div class="karte">
      <div class="rowx"><span class="lab">Paare an der Börse</span><span class="val">${k.gesamt}</span></div>
      <div class="rowx"><span class="lab">nach Ausschluss</span><span class="val">${k.nach_ausschluss}</span></div>
      <div class="rowx"><span class="lab">liquide genug</span><span class="val">${k.nach_liquiditaet}</span></div>
      <div class="rowx"><span class="lab">gescannt</span><span class="val">${k.genommen}</span></div>
      ${k.verworfen?Object.entries(k.verworfen).filter(([,v])=>v).map(([kk,v])=>
        `<div class="rowx"><span class="lab">verworfen: ${esc(kk)}</span><span class="val">${v}</span></div>`).join(''):''}
    </div>
    <div class="note-box"><span class="nt">Warum gefiltert wird</span>
      <p>Ein Altcoin darf nicht deshalb attraktiv aussehen, weil er extrem schwankt — er
      muss auch handelbar sein. Ohne Umsatz bekommt man den Einstieg nicht zum
      angezeigten Kurs und den Ausstieg gar nicht. Stablecoins, Hebel-Token und
      verpackte Doppel (WBTC …) fliegen raus, weil sie keine eigene Wette sind.</p></div>`;
  }
  h += `<h2>Live-Kurse</h2><div class="karte">
    <div class="rowx"><span class="lab">Verbindung</span><span class="val">${WS_OK?'offen':'getrennt'}</span></div>
    <div class="rowx"><span class="lab">Quelle</span><span class="val">Börsen-Websocket</span></div>
    <div class="rowx"><span class="lab">Werte mit Livekurs</span><span class="val">${L.size}</span></div>
  </div>
  <div class="note-box"><span class="nt">Was hier live ist und was nicht</span>
    <p><strong>Live:</strong> die Kurse für Krypto und Gold — direkt von der Börse an
    deinen Browser, ohne Umweg.</p>
    <p><strong>Nicht live:</strong> die eingezeichnete Analyse. Sie stammt aus dem
    stündlichen Scan und trägt dessen Zeitstempel. Für Aktien gibt es kein frei
    zugängliches Live-Feed; dort ist auch der Kurs der Stand des Scans.</p>
    <p>Diese Trennung ist Absicht. Eine Seite, die alles gleich aussehen lässt, verleitet
    dazu, einen Stand von vor einer Stunde für den aktuellen Kurs zu halten.</p></div>`;
  h += `<h2>Was noch fehlt</h2><div class="karte">
    <div class="rowx"><span class="lab">Nachführung laufender Trades in Echtzeit</span><span class="val">offen</span></div>
    <div class="rowx"><span class="lab">News und Makro im Score</span><span class="val">offen</span></div>
    <div class="rowx"><span class="lab">Fundamentaldaten bei Aktien</span><span class="val">offen</span></div>
    <div class="rowx"><span class="lab">Dauerlauf-Daemon auf einem Server</span><span class="val">offen</span></div>
  </div>`;
  $('system').innerHTML = h;
}

/* ============================================================ START */
function start(){
  $('built').textContent = 'Gebaut: ' + (D.built_at || '—') +
    ' · Setup ' + (D.setup||'') + ' · ' + (D.params_version||'');
  zeichnePlan(); zeichneAlarme(); zeichnePortfolio(); zeichneSystem();
  $('chartansicht').innerHTML = `<p class="leer">Scan wird geladen …</p>`;
  $('analyse').innerHTML = `<p class="leer">Scan wird geladen …</p>`;
  const t = parseInt((location.hash||'').replace('#',''), 10);
  zeigeTab(isFinite(t) && t>=0 && t<TABS.length ? t : 0);
  ladeScan();
  // Der Scan wird stuendlich neu gebaut. Alle fuenf Minuten nachsehen kostet nichts und
  // erspart das manuelle Neuladen.
  setInterval(()=>{ ladeScan(); }, 5*60*1000);
}
start();
</script>
</body>
</html>
