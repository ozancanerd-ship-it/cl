/* ============================================================ ALARME
   Zwei Wege zur selben Aussage, absichtlich getrennt:
     · der CI-Waechter prueft alle 15 Minuten und verschickt (Telegram)
     · diese Seite rechnet den Zustand LIVE aus dem Boersenkurs
   Der zweite Weg braucht keine Schlüssel und aktualisiert sich im Sekundentakt.
   Laufen sie auseinander, ist das ein Befund und kein Schönheitsfehler.
   ============================================================ */
const ZUSTAND_TEXT = {
  'wartet_auf_einstieg':'wartet auf Einstieg', 'aktiv':'im Trade',
  'ziel_erreicht':'Ziel erreicht', 'stop':'ausgestoppt', 'invalidiert':'ungültig',
  'abgelaufen':'abgelaufen'
};
const OFFEN = ['wartet_auf_einstieg','aktiv'];
const NOTE_RANG = {'A+':6,'A':5,'A−':4,'B+':3,'B':2,'WATCH':1,'—':0};

/* Der Live-Zustand eines Setups: was gilt JETZT, bei diesem Kurs? */
function lage(w){
  const live = L.get(w.instrument);
  const kurs = live ? live.p : null;
  const lang = w.richtung === 'long';
  const risiko = Math.abs(w.einstieg - w.stop);
  const eingestiegen = w.zustand === 'aktiv';
  let stufe = 'beobachten', abstand = null, r = null;

  if (kurs != null){
    abstand = (lang ? (kurs / w.einstieg - 1) : (w.einstieg / kurs - 1)) * 100;
    const basis = w.einstiegskurs ?? w.einstieg;
    if (risiko > 0) r = (lang ? kurs - basis : basis - kurs) / risiko;
    const erreicht = lang ? kurs <= w.einstieg : kurs >= w.einstieg;
    const raus = lang ? kurs <= w.stop : kurs >= w.stop;
    if (eingestiegen && raus) stufe = 'stop';
    else if (eingestiegen) stufe = 'im_trade';
    else if (erreicht) stufe = 'jetzt';
    else if (Math.abs(abstand) <= 1.5) stufe = 'bald';
  } else if (eingestiegen) stufe = 'im_trade';

  return {w, kurs, lang, risiko, abstand, r, stufe, live: !!live};
}

/* Lokale Benachrichtigung, wenn ein Setup live auf "jetzt" springt. Funktioniert,
   solange die App offen ist — ohne Server, ohne Schlüssel. Kein Ersatz für Telegram,
   aber sofort und ohne Abhängigkeit. */
const GEMELDET = new Set();
function benachrichtige(x){
  const key = x.w.instrument + ':' + x.w.aufgenommen;
  if (GEMELDET.has(key)) return;
  GEMELDET.add(key);
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const d = digits(x.w.einstieg);
    new Notification(`${x.lang?'KAUFEN':'VERKAUFEN'} ${name(x.w.instrument)} · ${x.w.note}`, {
      body: `Einstieg ${num(x.w.einstieg,d)} erreicht\nStop ${num(x.w.stop,d)}` +
            (x.w.tp1!=null?` · Ziel ${num(x.w.tp1,d)}`:''),
      tag: key,
    });
  } catch(e){}
}

/* Die Buy-Signale kommen aus der RANGLISTE, nicht aus einer festen Liste. Bei jedem
   Scan (alle 30 Min) steht hier, was gerade oben steht; bei jedem Kurs-Tick aendert
   sich der Zustand. Ozans Vorgabe: "aus einem Ranking gemacht, und fuer die besten
   Rankings die besten Alarme ... nicht immer die gleiche Dings". */
function ausRanking(){
  const wachen = new Map(((WL && WL.wachen) || []).map(w=>[w.instrument, w]));
  const rows = (S?.gesamt||[]).filter(o=>o.handelbar && o.einstieg!=null && o.invalidierung!=null);
  return rows.map(o=>{
    const w = wachen.get(o.instrument);
    /* Vor dem Einstieg ist der Plan ein VORSCHLAG und muss aktuell sein: es gelten die
       Zahlen des letzten Scans. Ab dem Einstieg ist er ein VERTRAG und bleibt fest —
       sonst wandert der Stop mit jedem Scan, und hinterher weiss niemand, gegen welchen
       Plan das Ergebnis gemessen wurde.
       Genau das war Ozans Einwand: ein Einstieg, der vor Stunden gesetzt wurde und an
       dem der Markt laengst vorbeigelaufen ist, ergibt keinen Sinn mehr. */
    const imTrade = w && w.zustand === 'aktiv';
    const basis = {
      instrument: o.instrument, klasse: o.klasse, richtung: o.richtung, note: o.note,
      einstieg: imTrade ? w.einstieg : o.einstieg,
      einstieg_art: imTrade ? w.einstieg_art : (o.einstieg_art || 'sofort'),
      stop: imTrade ? w.stop : (o.plan ? o.plan.stop : o.invalidierung),
      /* Die Ziele kommen aus dem Handelsplan, nicht roh aus der Liquiditaetsliste:
         dort steht sicher, dass Ziel 1 nie naeher liegt als der Stop entfernt ist. */
      tp1: imTrade ? w.tp1 : (o.plan ? o.plan.tp1 : o.ziel),
      tp2: imTrade ? w.tp2 : (o.plan ? o.plan.tp2 : o.tp2),
      tp3: imTrade ? w.tp3 : (o.plan ? o.plan.tp3 : o.tp3),
      zustand: w ? w.zustand : 'wartet_auf_einstieg',
      erreicht: w ? (w.erreicht||[]) : [],
      einstiegskurs: w ? w.einstiegskurs : null,
      aufgenommen: w ? w.aufgenommen : (S?.erzeugt || ''),
      frisch: !imTrade,
    };
    return {...lage(basis), o};
  }).filter(x=>OFFEN.includes(x.w.zustand));
}

/* Was ein Signal bringen kann — und wie oft so etwas bisher aufging.

   Die beiden Zahlen sehen nebeneinander gleich aus und sind es nicht: die erste ist
   gerechnet (vom Einstieg zum Ziel sind es soundso viel Prozent), die zweite ist
   gezaehlt (von so vielen frueheren Signalen dieser Art haben soundso viele das Ziel
   erreicht). Deshalb steht bei der zweiten immer die Zahl der Faelle daneben und
   darunter der Satz, dass es Vergangenheit ist. Ohne den liest man eine Quote als
   Versprechen. */
function erwartungsKasten(o){
  const e = o && o.erwartung; if (!e) return '';
  const q = e.quote;
  const teile = [];
  if (e.bis_tp1_pct != null) teile.push(`<span>1. Ziel <b class="up">${pct(e.bis_tp1_pct,1)}</b></span>`);
  if (e.bis_tp3_pct != null) teile.push(`<span>alle Ziele <b class="up">${pct(e.bis_tp3_pct,1)}</b></span>`);
  if (e.risiko_pct != null) teile.push(`<span>bis Stop <b class="dn">−${num(e.risiko_pct,1)} %</b></span>`);
  if (q) teile.push(`<span>traf bisher <b>${Math.round(q.tp1*100)} %</b>
    <span style="color:var(--ink-3)">von ${q.n} Fällen</span></span>`);
  return `<div class="erw">
    <span class="nt">Was es bringen kann — und wie oft es bisher aufging</span>
    <div class="kpi">${teile.join('')}</div>
    ${q?`<div class="qbar"><i style="width:${Math.max(2,Math.round(q.tp1*100))}%"></i></div>`:''}
    <p>${(e.saetze||[]).map(esc).join(' ')}</p>
  </div>`;
}

function signalKarte(x){
  const w = x.w, o = x.o || {}, d = digits(w.einstieg);
  const lang = x.lang;
  const seite = lang ? 'KAUFEN' : 'VERKAUFEN';
  const farbe = lang ? 'var(--long)' : 'var(--bad)';
  let urteil, klasse = '';
  if (x.stufe === 'jetzt'){ urteil = `<strong style="color:${farbe}">${seite} — JETZT</strong>`; klasse = 'hot'; }
  else if (x.stufe === 'im_trade'){ urteil = `<strong>im Trade</strong>`; klasse = 'hot'; }
  else if (x.stufe === 'stop'){ urteil = `<strong style="color:var(--bad)">Stop erreicht</strong>`; }
  else urteil = `${seite} ab <strong>${num(w.einstieg,d)}</strong>${
    x.abstand!=null?` <span style="color:var(--ink-3)">(noch ${Math.abs(x.abstand).toFixed(2).replace('.',',')} %)</span>`:''}`;

  /* Positionsgröße: 0,5 % Risiko — aber gedeckelt durch das Kapital.
     Ohne Deckel kam bei einem Wert mit 0,06 % Stopabstand "9999 Stück ≈ 9.992 €"
     heraus, bei 1.200 € Kapital. Rechnerisch richtig, praktisch Unsinn: was man
     nicht kaufen kann, ist keine Positionsgröße. */
  const equity = P ? P.equity : 1200;
  const MAX_ANTEIL = 0.25;
  const ausRisiko = x.risiko > 0 ? equity * 0.005 / x.risiko : 0;
  const ausKapital = w.einstieg > 0 ? equity * MAX_ANTEIL / w.einstieg : 0;
  const gedeckelt = ausRisiko > ausKapital;
  const stueck = Math.floor(Math.min(ausRisiko, ausKapital));
  const euro = Math.round(stueck * w.einstieg);
  const ziele = [w.tp1, w.tp2, w.tp3].filter(v=>v!=null);

  const st = o.setup || null;
  return `<div class="alarm ${klasse}" data-sym="${esc(w.instrument)}">
    <div class="ah">
      <span>${esc(name(w.instrument))}</span>
      <span class="note ${NOTE_KLASSE[w.note]||''}">${esc(w.note)}</span>
      <span class="d">${o.score!=null?`${o.score.toFixed(0)}/100`:''}${
        o.rs!=null?` · RS ${Math.round(o.rs)}`:''}</span>
    </div>
    ${st?`<div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--accent);margin-top:5px">${esc(st.name)}</div>`:''}
    <p style="font-size:14.5px;margin-top:6px">${urteil}</p>
    ${st?`<p style="font-size:12.5px;color:var(--ink-2);margin-top:4px">${esc(st.these)}</p>`:''}
    <div class="kpi">
      <span>Einstieg <b>${preis(o,'einstieg',w.einstieg,d)}</b> <span style="color:var(--ink-3)">${esc(w.einstieg_art)}${w.frisch?' · aus dem letzten Scan':' · fest seit Einstieg'}</span></span>
      <span>Stop <b>${preis(o,'stop',w.stop,d)}</b></span>
      ${ziele.length?`<span>Ziele <b>${ziele.map((v,i)=>preis(o,'tp'+(i+1),v,d)).join(' / ')}</b></span>`:''}
    </div>
    <div class="kpi">
      ${x.kurs!=null?`<span>Kurs <b>${num(x.kurs,d)}</b>${x.live?' <span class="up">live</span>':''}</span>`:''}
      ${o.rr?`<span>CRV <b>1:${o.rr.toFixed(2)}</b></span>`:''}
      ${o.erwartete_bewegung_pct!=null?`<span>Erwartet <b class="${o.erwartete_bewegung_pct>=0?'up':'dn'}">${pct(o.erwartete_bewegung_pct,1)}</b></span>`:''}
      ${x.r!=null&&(x.stufe==='im_trade'||x.stufe==='stop')?`<span>Stand <b class="${x.r>=0?'up':'dn'}">${x.r>=0?'+':''}${x.r.toFixed(2)}R</b></span>`:''}
      ${(w.erreicht||[]).length?`<span>erreicht <b>${w.erreicht.join(', ')}</b></span>`:''}
    </div>
    ${stueck>0?`<p style="color:var(--ink-2);font-size:12.5px">Bei 0,5 % Risiko auf
      ${num(equity,0)} €: rund <strong>${stueck}</strong> Stück ≈ ${num(euro,0)} € Einsatz,
      Verlust bei Stop rund ${num(Math.round(stueck*x.risiko),0)} €.${
      gedeckelt?` <span style="color:var(--warn)">Auf ${Math.round(MAX_ANTEIL*100)} % vom
      Kapital begrenzt — der Stop liegt so eng, dass 0,5 % Risiko mehr Geld bräuchte,
      als du hast.</span>`:''}</p>`:''}
    ${st&&st.trigger?`<p style="color:var(--ink-2);font-size:12px;margin-top:7px">
      <span style="color:var(--accent)">Auslöser:</span> ${esc(st.trigger)}</p>`:''}
    <div class="kpi" style="margin-top:8px">
      <span>Kaufen bei <b>${esc(o.broker||'—')}</b></span>
      ${o.eurusd?`<span>Kurs gerechnet zu <b>${num(o.eurusd,4)}</b> USD/€</span>`:''}
    </div>
    ${euro>0?`<p style="font-size:11.5px;color:var(--ink-3);margin-top:6px">${gebuehrSatz(o, euro)}</p>`:''}
    ${erwartungsKasten(o)}
    <p style="margin:10px 0 0"><button class="btn" data-kauf="${esc(w.instrument)}"
      data-menge="${stueck}" data-kurs="${w.einstieg}">Gekauft — ins Depot</button></p>
    ${(o.warnungen||[]).length?`<p class="warnz">${o.warnungen.map(esc).join('<br>')}</p>`:''}
  </div>`;
}

function zeichneAlarme(){
  const signale = ausRanking();
  const rang = a => [-(NOTE_RANG[a.w.note]||0), Math.abs(a.abstand ?? 999)];
  signale.sort((a,b)=>{ const [ra,da]=rang(a), [rb,db]=rang(b); return ra!==rb ? ra-rb : da-db; });

  const jetzt = signale.filter(x=>x.stufe==='jetzt');
  const imTrade = signale.filter(x=>x.stufe==='im_trade'||x.stufe==='stop');
  const warten = signale.filter(x=>x.stufe==='bald'||x.stufe==='beobachten');
  jetzt.forEach(benachrichtige);

  let h = stoerungsBanner() + pushBlock();
  h += `<div class="note-box">
    <span class="nt">Woher diese Liste kommt</span>
    <p>Das sind die <strong>bestbewerteten Setups aus dem letzten Scan</strong> —
      ${S?`${(S.gesamt||[]).length} Werte, Analyse von ${zeit(S.erzeugt)}`:'—'}. Die Liste
      wird bei jedem Scan neu gebildet, die Reihenfolge und der Zustand ändern sich mit
      jedem Kurs. Es steht also nicht immer dasselbe da.</p>
  </div>`;

  h += `<h2>Jetzt einsteigen</h2>`;
  h += jetzt.length ? jetzt.map(signalKarte).join('')
    : `<div class="alarm"><div class="ah"><span>Gerade kein Einstieg erreicht</span></div>
       <p>Kein Kurs steht in seiner Einstiegszone. Die Kandidaten stehen unten mit dem
       Preis, ab dem eingestiegen wird — dort kannst du eine Limit-Order legen, dann
       brauchst du gar keinen Alarm.</p></div>`;

  if (imTrade.length) h += `<h2>Laufende Trades</h2>` + imTrade.map(signalKarte).join('');

  if (warten.length){
    h += `<h2>Kaufen ab … <span class="mono" style="font-size:12px;color:var(--ink-3)">${warten.length} Kandidaten, nach Note sortiert</span></h2>`;
    h += warten.slice(0,20).map(signalKarte).join('');
  }
  if (!signale.length){
    h += `<p class="leer">Der letzte Scan hat kein handelbares Setup gefunden. Das ist
      ein Ergebnis, kein Ausfall — beim nächsten Durchgang in spätestens 30 Minuten
      sieht es wieder anders aus.</p>`;
  }

  const fertig = ((WL && WL.wachen) || []).filter(w=>!OFFEN.includes(w.zustand));
  const A = D.alarme || [];
  if (fertig.length || A.length){
    h += `<h2>Verlauf</h2>`;
    h += fertig.slice(0,6).map(w=>{
      const d = digits(w.einstieg);
      return `<div class="alarm"><div class="ah"><span>${esc(name(w.instrument))}</span>
        <span class="d">${esc(ZUSTAND_TEXT[w.zustand]||w.zustand)}</span></div>
        <p>Einstieg ${num(w.einstieg,d)} · Stop ${num(w.stop,d)}
        ${(w.erreicht||[]).length?`· erreicht: ${w.erreicht.join(', ')}`:''}
        ${w.bestes_r?`· bestes ${w.bestes_r>0?'+':''}${w.bestes_r}R`:''}</p></div>`;
    }).join('');
    h += A.slice(0,5).map(a=>`<div class="alarm ${a.severity==='CRITICAL'?'hot':''}">
      <div class="ah"><span>${esc(a.title||'')}</span><span class="d">${zeit(a.ts)}</span></div>
      ${a.body?`<p style="white-space:pre-wrap">${esc(a.body)}</p>`:''}</div>`).join('');
  }

  h += `<div class="note-box warn" style="margin-top:22px"><span class="nt">Was aufs Handy geht — und was nicht</span>
    <p><strong>Immer:</strong> Einstieg erreicht, Ziel erreicht, Stop berührt, Setup
    ungültig — unabhängig von der Note, sobald es um einen laufenden Trade geht.</p>
    <p><strong>Neue Setups nur ab A−.</strong> B und B+ stehen hier, klingeln aber nicht.</p>
    <p>Scan alle 30 Minuten, Wächter alle 5 Minuten, diese Seite rechnet dazwischen live weiter.</p></div>`;

  $('alarme').innerHTML = h;
  $('alarme').querySelectorAll('[data-sym]').forEach(el=>
    el.addEventListener('click',()=>waehle(el.dataset.sym)));
  $('alarme').querySelectorAll('[data-kauf]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); kaufDialog(b.dataset.kauf, b.dataset.menge, b.dataset.kurs);
  }));
  bindePush();
}


/* Warum das ganz oben steht, in Rot, mit Schritten:
   Am 11. September hat Ozan gemeldet, dass kein einziges Signal ankam. Das System
   hatte an dem Tag durchgehend gearbeitet und Ereignisse erzeugt — sie hatten nur
   keinen Weg auf sein Telefon, weil weder Web Push noch Telegram eingerichtet waren.
   Diese Warnung stand bis dahin nur im CI-Protokoll, wo sie niemand liest.

   Ein Ausfall, den man nicht sieht, ist schlimmer als einer, der kracht. */
function stoerungsBanner(){
  const push = (()=>{ try { return !!localStorage.getItem('push_abo'); } catch(e){ return false; } })();
  if (push) return '';
  return `<div class="stoerung">
    <h3>Es kommt nichts an — und das ist der Grund</h3>
    <p>Der Scanner läuft rund um die Uhr und erzeugt Ereignisse. Aber es gibt derzeit
    <strong>keinen eingerichteten Weg auf dein Telefon</strong>. Solange das so ist, landen
    alle Alarme nur hier in der App — auch die guten.</p>
    <p>Das lässt sich in zwei Minuten beheben, einmalig:</p>
    <ol>
      <li><strong>Auf dem iPhone zuerst:</strong> Teilen → Zum Home-Bildschirm. Dann die App
        von dort öffnen. iOS lässt Push für normale Safari-Tabs nicht zu.</li>
      <li>Unten auf <strong>Alarme aufs Gerät</strong> tippen und den angezeigten Text kopieren.</li>
      <li>Auf GitHub unter <span class="mono">Settings → Secrets → Actions</span> zwei Secrets
        anlegen: <span class="mono">PUSH_ABOS</span> (der kopierte Text) und
        <span class="mono">VAPID_PRIVATE_KEY</span> (den Wert hast du von mir).</li>
    </ol>
    <p style="margin-top:10px">Bis dahin gibt es einen Notweg, der schon läuft und nichts
    braucht: <strong>dringende Signale werden als GitHub-Issue eröffnet</strong> und du
    darin erwähnt. Das kommt per E-Mail an und, wenn du die GitHub-App auf dem Handy
    hast, auch als Push. Langsamer als der richtige Weg und in einer Liste, die
    eigentlich für Fehlerberichte da ist — aber es kommt an.</p>
  </div>`;
}

/* ===================================================== ALARME BEI ZUER APP
   Web Push. Der Unterschied zur Browser-Benachrichtigung ist der entscheidende:
   eine Benachrichtigung kann die Seite nur ausloesen, solange sie offen ist. Web
   Push kommt vom Push-Dienst des Browserherstellers an den Service Worker — der
   laeuft auch dann, wenn die App laengst geschlossen ist.

   Der Preis dafuer ist ein einmaliger Handgriff: das Abo dieses Geraets muss der
   CI bekannt sein. Es gibt dafuer keinen Server, also wandert es einmal per
   Kopieren-Einfuegen in ein GitHub-Secret. Danach nie wieder.

   Auf dem iPhone gilt zusaetzlich: Push funktioniert nur, wenn die Seite ueber
   „Zum Home-Bildschirm" installiert wurde. Steht so unten auch drin — daran
   scheitert es sonst, ohne dass irgendeine Fehlermeldung erscheint.
   ===================================================================== */
const VAPID = '__VAPID__';

function b64url(buf){
  const b = String.fromCharCode.apply(null, new Uint8Array(buf));
  return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function vapidBytes(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const roh = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(roh, c=>c.charCodeAt(0));
}
function pushMoeglich(){
  return 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
}
function istInstalliert(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function pushBlock(){
  const abo = localStorage.getItem('push_abo') || '';
  const erlaubt = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  if (!pushMoeglich()){
    return `<div class="note-box warn"><span class="nt">Alarme bei geschlossener App</span>
      <p>Dieser Browser kann kein Web Push. Auf dem iPhone geht es ab iOS 16.4 —
      aber nur, wenn die Seite über <em>Teilen → Zum Home-Bildschirm</em> installiert wurde.</p></div>`;
  }
  if (iOS && !istInstalliert()){
    return `<div class="note-box warn"><span class="nt">Ein Schritt fehlt noch</span>
      <p>Damit Alarme auch bei geschlossener App ankommen, muss diese Seite auf dem
      iPhone installiert sein: <strong>Teilen → Zum Home-Bildschirm</strong>. Danach die
      App von dort öffnen und hier weitermachen — vorher lässt iOS Push nicht zu.</p></div>`;
  }
  if (abo){
    return `<div class="note-box"><span class="nt">Alarme bei geschlossener App</span>
      <p>Dieses Gerät ist angemeldet. Wenn trotzdem nichts ankommt, ist das Abo noch
      nicht im Secret <code>PUSH_ABOS</code> hinterlegt —
      <button class="link" id="pushzeig">Abo nochmal anzeigen</button>.</p>
      <div id="pushdaten"></div></div>`;
  }
  return `<div class="note-box warn"><span class="nt">Alarme bei geschlossener App</span>
    <p>Noch nicht eingerichtet. Ein Klick, dann einmal einfügen — danach meldet sich das
    Gerät auch, wenn die App zu ist.</p>
    <p style="margin-top:10px"><button class="btn prim" id="pushan">Alarme aufs Gerät</button>
    ${erlaubt?'':'<span style="margin-left:10px;font-size:12px;color:var(--ink-3)">fragt zuerst nach Erlaubnis</span>'}</p>
    <div id="pushdaten"></div></div>`;
}

async function pushAnmelden(){
  const ziel = $('pushdaten');
  try{
    const rechte = await Notification.requestPermission();
    if (rechte !== 'granted'){
      ziel.innerHTML = `<p style="color:var(--warn);margin-top:10px">Ohne Erlaubnis geht es
        nicht. Die Einstellung lässt sich im Browser wieder ändern.</p>`;
      return;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidBytes(VAPID),
      });
    }
    const j = sub.toJSON();
    const kompakt = JSON.stringify({endpoint: j.endpoint, keys: j.keys});
    localStorage.setItem('push_abo', kompakt);
    pushZeigen(kompakt);
  } catch(e){
    ziel.innerHTML = `<p style="color:var(--bad);margin-top:10px">Hat nicht geklappt: ${esc(String(e))}</p>`;
  }
}

function pushZeigen(kompakt){
  const ziel = $('pushdaten');
  if (!ziel) return;
  ziel.innerHTML = `
    <p style="margin-top:12px">Fertig auf diesem Gerät. Damit die CI weiß, wohin sie senden
    soll, muss dieser eine Text noch ins Repository — einmalig:</p>
    <pre id="pushtext">${esc(kompakt)}</pre>
    <p><button class="btn" id="pushkopie">Kopieren</button>
       <a class="btn" style="text-decoration:none;display:inline-block;margin-left:8px"
          href="https://github.com/ozancanerd-ship-it/cl/settings/secrets/actions/new"
          target="_blank" rel="noopener">Secret anlegen</a></p>
    <ol class="steps" style="margin-top:12px">
      <li>Oben auf <strong>Kopieren</strong> tippen.</li>
      <li><strong>Secret anlegen</strong> öffnen (führt direkt zur richtigen Seite).</li>
      <li>Name: <code>PUSH_ABOS</code> — Wert: einfügen. Speichern.</li>
      <li>Zweites Gerät später: hier nochmal anmelden, beide Texte als JSON-Liste
          <code>[{…},{…}]</code> ins selbe Secret.</li>
    </ol>
    <p style="font-size:11.5px;color:var(--ink-3)">Der Text enthält keine Zugangsdaten —
    nur die Adresse, an die dein Browser Push zustellt. Der geheime Teil (der private
    VAPID-Schlüssel) liegt ausschließlich im Secret <code>VAPID_PRIVATE_KEY</code>.</p>`;
  const kb = $('pushkopie');
  if (kb) kb.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(kompakt); kb.textContent = 'Kopiert'; }
    catch(e){
      const r = document.createRange(); r.selectNode($('pushtext'));
      window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
      kb.textContent = 'Markiert — jetzt kopieren';
    }
  });
}

function bindePush(){
  const an = $('pushan');
  if (an) an.addEventListener('click', pushAnmelden);
  const zeig = $('pushzeig');
  if (zeig) zeig.addEventListener('click', ()=>pushZeigen(localStorage.getItem('push_abo')||''));
}

   Ozans Anforderung war ausdruecklich: er soll auch dann noch funktionieren, wenn das
   Nutzungslimit im Claude-Chat erreicht ist. Genau das geht nur ueber einen eigenen
   API-Schluessel — dann laeuft die Abrechnung ueber sein Konto und nicht ueber die
   Sitzung, die gerade zu ist.

   WO DER SCHLUESSEL LIEGT — UND WO NICHT

   Ausschliesslich im localStorage dieses Browsers. Er geht nie ins Repository, nie in
   die gebaute Seite, nie in einen Scan. Das ist keine Formalie: dieses Repository ist
   oeffentlich, ein Schluessel darin waere binnen Stunden fremd benutzt.

   Der Aufruf geht direkt vom Browser an die API. Das erlaubt Anthropic ausdruecklich
   ueber den Kopf ``anthropic-dangerous-direct-browser-access``; der Schluessel verlaesst
   dabei das Geraet nur in Richtung Anthropic.

   WAS DER CHAT WEISS

   Er bekommt bei jeder Frage den aktuellen Stand mitgeschickt: die besten Chancen aus
   dem letzten Scan mit Setup, Einstieg, Stop und Zielen, den Zustand der Wachliste,
   Ozans eingetragene Positionen und die Makrolage. Damit kann er "soll ich hier rein?"
   auf den konkreten Wert beantworten statt allgemein.

   WAS ER NICHT TUT

   Er handelt nicht, er legt keine Order, und er bekommt keine Schluessel einer Boerse
   zu sehen. Er redet — mehr ist in dieser Stufe nicht vorgesehen und mehr waere auch
   nicht sicher. */

const CHAT_MODELL_STD = 'claude-sonnet-4-5-20250929';
let CHAT_VERLAUF = [];

function chatSchluessel(){ try { return localStorage.getItem('api_key') || ''; } catch(e){ return ''; } }
function chatModell(){ try { return localStorage.getItem('api_modell') || CHAT_MODELL_STD; } catch(e){ return CHAT_MODELL_STD; } }

/* Der Lagebericht, den das Modell bei jeder Frage mitbekommt. Bewusst kompakt: die
   vollstaendige Rangliste waere ein Vielfaches an Text und wuerde bei jeder Frage neu
   bezahlt. Zehn Chancen, die laufenden Trades und das Depot reichen, um konkret zu
   antworten. */
function chatLage(){
  const teile = [];
  if (S){
    const st = S.statistik || {};
    teile.push(`Letzter Scan: ${zeit(S.erzeugt)}, ${(S.gesamt||[]).length} Instrumente. ` +
      `A+ ${st.A_PLUS||0}, A ${st.A||0}, A- ${st.A_MINUS||0}, B+ ${st.B_PLUS||0}, B ${st.B||0}, ` +
      `beobachten ${st.WATCH||0}, kein Trade ${st.NO_TRADE||0}.`);
    const top = (S.gesamt||[]).filter(o=>o.handelbar).slice(0,10);
    if (top.length){
      teile.push('BESTE CHANCEN:');
      for (const o of top){
        const pl = o.plan || {};
        const st2 = o.setup || {};
        teile.push(
          `- ${o.instrument} (${o.klasse}) ${o.richtung} ${o.note}` +
          (st2.name?` | Setup: ${st2.name} (${st2.qualitaet})`:'') +
          ` | Kurs ${o.kurs} Einstieg ${o.einstieg} Stop ${pl.stop ?? o.invalidierung}` +
          ` Ziele ${[pl.tp1??o.ziel, pl.tp2??o.tp2, pl.tp3??o.tp3].filter(v=>v!=null).join('/')}` +
          (pl.crv?` | CRV 1:${pl.crv.toFixed(1)} Risiko ${pl.risiko_pct.toFixed(1)}%`:'') +
          (o.rs!=null?` | rel.Staerke ${Math.round(o.rs)}`:'') +
          (st2.these?` | These: ${st2.these}`:'') +
          ((o.warnungen||[]).length?` | Dagegen: ${o.warnungen.slice(0,2).join('; ')}`:''));
      }
    }
    if (S.makro) teile.push(`Makro: ${S.makro.lage||'?'} — ${(S.makro.saetze||[]).join(' ')}`);
  }
  const wachen = ((WL && WL.wachen) || []).filter(w=>w.zustand==='aktiv');
  if (wachen.length){
    teile.push('LAUFENDE TRADES:');
    for (const w of wachen.slice(0,12))
      teile.push(`- ${w.instrument} ${w.richtung} ab ${w.einstieg}, Stop ${w.stop}, ` +
        `erreicht ${(w.erreicht||[]).join(',')||'noch nichts'}, bestes ${w.bestes_r}R`);
  }
  const pos = ladePositionen();
  if (pos.length){
    teile.push('OZANS DEPOT:');
    for (const x of pos) teile.push(`- ${x.sym}: ${x.menge} Stueck zu ${x.einstieg ?? '?'}${x.konto?' ('+x.konto+')':''}`);
  }
  return teile.join('\n');
}

        `<p style="color:var(--warn);font-size:12.5px;margin-top:10px">Das sieht nicht nach einem Schluessel aus.</p>`; return; }
      try { localStorage.setItem('api_key', v); } catch(e){}
      CHAT_VERLAUF = [];
      zeichneChat();
    });
    return;
  }

  h = `<div class="chatbox">
    <div class="chatlauf" id="chatlauf"></div>

function chatMalen(){
  const el = $('chatlauf'); if (!el) return;
  if (!CHAT_VERLAUF.length){
    el.innerHTML = `<div class="chatleer">
      <p>Ich sehe denselben Stand wie die App: den letzten Scan, die laufenden Trades und
      dein eingetragenes Depot.</p>
      <p style="margin-top:8px">Zum Beispiel:</p>
      <ul class="satzliste" style="margin-top:6px">
        <li>„Soll ich bei der Nummer eins rein oder warten?"</li>
        <li>„Was spricht gegen das Setup?"</li>
        <li>„Ist mein Depot zu einseitig?"</li>
        <li>„Warum kam heute kein Alarm?"</li>
      </ul></div>`;
    return;
  }
  el.innerHTML = CHAT_VERLAUF.map(m=>
    `<div class="msg ${m.role}"><div class="bl">${
      m.role==='user' ? esc(m.content) : chatFormat(m.content)}</div></div>`).join('');
  el.scrollTop = el.scrollHeight;
}

/* Sehr sparsames Markdown: fett, Aufzaehlungen, Absaetze. Eine Bibliothek dafuer zu
   laden waere mehr Gewicht als Nutzen. */
function chatFormat(t){
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^[-*] (.+)$/gm,'• $1')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/\n/g,'<br>')
    .replace(/^/,'<p>').replace(/$/,'</p>');
}

async function chatSenden(){
  const feld = $('chat_in');
  const frage = (feld.value||'').trim();
  if (!frage) return;
  feld.value = '';
  CHAT_VERLAUF.push({role:'user', content:frage});
  CHAT_VERLAUF.push({role:'assistant', content:'…'});
  chatMalen();

  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key': chatSchluessel(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({
        model: chatModell(),
        max_tokens: 900,
        system: CHAT_SYSTEM + '\n\nLAGEBERICHT (Stand jetzt):\n' + chatLage(),
        messages: CHAT_VERLAUF.slice(0,-1).map(m=>({role:m.role, content:m.content})),
      }),
    });
    if (!r.ok){
      const t = await r.text();
      CHAT_VERLAUF[CHAT_VERLAUF.length-1] = {role:'assistant',
        content: `Die Anfrage ist fehlgeschlagen (HTTP ${r.status}). ${t.slice(0,300)}`};
    } else {
      const d = await r.json();
      const text = (d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
      CHAT_VERLAUF[CHAT_VERLAUF.length-1] = {role:'assistant', content: text || '(leere Antwort)'};
    }
  } catch(e){
    CHAT_VERLAUF[CHAT_VERLAUF.length-1] = {role:'assistant',
      content: `Kein Zugriff auf die API: ${String(e)}. Pruefe den Schluessel und die Verbindung.`};
  }
  chatMalen();
}

/* ---- "Gekauft" ------------------------------------------------------------
   Ozans Wunsch, woertlich: "mach so einen Button, dass ich dann eingeben kann, wie
   viel ich gekauft hab und dass er dann das automatisch mein Portfolio hier mit
   ausschreibt. Das ist nicht alles immer extern machen muss."

   Die Vorschlagswerte kommen aus dem Signal — Stueckzahl aus der Risikorechnung,
   Kurs aus dem Plan. Er kann beides ueberschreiben, denn ausgefuehrt wird selten
   exakt zum geplanten Kurs, und was im Depot steht, muss der WIRKLICHE Einstieg
   sein. Ein Depot mit Wunschkursen rechnet sich selbst schoen. */
function kaufDialog(sym, mengeVorschlag, kursVorschlag){
  const alt = document.getElementById('kaufbox');
  if (alt) alt.remove();
  const box = document.createElement('div');
  box.id = 'kaufbox';
  box.className = 'modal';
  box.innerHTML = `<div class="modalk">
    <h3 style="margin-top:0">${esc(name(sym))} ins Depot</h3>
    <p style="font-size:12.5px;color:var(--ink-2);margin:0 0 12px">Trag ein, was du
    <strong>tatsächlich</strong> bekommen hast — nicht den geplanten Kurs. Sonst rechnet
    sich das Depot selbst schön.</p>
    <div class="rowx"><span class="lab">Stück</span>
      <input id="k_menge" inputmode="decimal" value="${esc(mengeVorschlag||'')}" style="width:55%"></div>
    <div class="rowx"><span class="lab">Kurs</span>
      <input id="k_kurs" inputmode="decimal" value="${esc(kursVorschlag||'')}" style="width:55%"></div>
    <div class="rowx"><span class="lab">Konto</span>
      <input id="k_konto" placeholder="Trade Republic / Bybit" style="width:55%"></div>
    <p style="margin:14px 0 0"><button class="btn prim" id="k_ok">Übernehmen</button>
      <button class="link" id="k_ab" style="margin-left:14px">Abbrechen</button></p>
  </div>`;
  document.body.appendChild(box);
  const zu = ()=>box.remove();
  box.addEventListener('click', e=>{ if (e.target === box) zu(); });
  document.getElementById('k_ab').addEventListener('click', zu);
  document.getElementById('k_ok').addEventListener('click', ()=>{
    const menge = parseFloat((document.getElementById('k_menge').value||'').replace(',','.'));
    const kurs  = parseFloat((document.getElementById('k_kurs').value||'').replace(',','.'));
    if (!isFinite(menge) || menge <= 0) return;
    const a = ladePositionen().filter(p=>p.sym !== sym);
    a.push({sym, menge, einstieg: isFinite(kurs)?kurs:null,
            konto: (document.getElementById('k_konto').value||'').trim()});
    speicherePositionen(a);
    zu();
    zeichnePortfolio();
    zeigeTab(3);
  });
}

/* ---- Signal-Historie ------------------------------------------------------
   "Ich möchte auf der Seite noch mal eine Extraseite haben, wo ich dann sehe, wie die
   zum Beispiel ausgegangen sind, wie viel Plus oder Minus die Trades gemacht hätten."

   Genau das. Jedes abgeschlossene Signal einzeln, jüngstes zuerst, mit dem Ergebnis
   nach beiden Ausstiegsregeln — damit sichtbar bleibt, was der Teilverkauf ausmacht.
   Keine Auswahl, keine Bestenliste: es stehen ALLE da, auch die schlechten. Eine
   Historie, aus der man die Verlierer herausnimmt, ist Werbung. */
function historieKasten(){
  const t = (PF && PF.trades) || [];
  if (!t.length) return '';
  const zeilen = t.slice(0, 60).map(x=>{
    const gut = x.r_ganz > 0, schlecht = x.r_ganz < 0;
    const farbe = gut ? 'var(--long)' : schlecht ? 'var(--bad)' : 'var(--ink-3)';
    const ausgang = {stop:'Stop', ziel_erreicht:'Ziel', invalidiert:'ungültig', abgelaufen:'abgelaufen'}[x.zustand] || x.zustand;
    return `<tr>
      <td class="tf">${esc(name(x.instrument))}</td>
      <td>${esc(x.note)}</td>
      <td>${esc(ausgang)}${(x.erreicht||[]).length?` <span style="color:var(--ink-3)">${x.erreicht.join(',')}</span>`:''}</td>
      <td style="color:${farbe};font-weight:600">${x.r_ganz>0?'+':''}${x.r_ganz.toFixed(2)} R</td>
      <td style="color:${x.r_drittel>0?'var(--long)':x.r_drittel<0?'var(--bad)':'var(--ink-3)'}">${x.r_drittel>0?'+':''}${x.r_drittel.toFixed(2)} R</td>
      <td class="mono" style="color:var(--ink-3);font-size:11px">${esc((x.beendet||'').slice(5,16).replace('T',' '))}</td>
    </tr>`;
  }).join('');
  return `<h2>Wie die Signale ausgegangen sind</h2>
  <p class="lead">Jedes abgeschlossene Signal einzeln, das jüngste zuerst — auch die
  schlechten. <strong>Ganz</strong> ist alles-oder-nichts, <strong>Drittel</strong> mit
  Teilverkauf am ersten Ziel und Stop auf Einstand.</p>
  <div class="tw"><table class="mtf">
    <tr><th>Wert</th><th>Note</th><th>Ausgang</th><th>Ganz</th><th>Drittel</th><th>Beendet</th></tr>
    ${zeilen}
  </table></div>
  ${t.length>60?`<p class="leer">… und ${t.length-60} ältere.</p>`:''}`;
}

/* ============================================================ BILANZ

   Eine eigene Seite, weil Ozan ausdruecklich danach gefragt hat: er will sehen, wie die
   Signale ausgegangen sind, die ihm angezeigt wurden — wie viel Plus oder Minus sie
   gebracht haetten. Vorher stand das unten im System-Reiter zwischen Laufzeitzahlen,
   wo es niemand sucht. Genau das ist die Zahl, die man sehen muss, bevor man dem
   naechsten Signal glaubt.                                                           */
function quotenKasten(){
  const q = (PF && PF.quoten) || null;
  if (!q) return '';
  const zeilen = Object.keys(q)
    .filter(k => k !== 'alle' && q[k].n >= 5)
    .sort((a,b) => q[b].n - q[a].n)
    .map(k => {
      const v = q[k];
      const wie = k.startsWith('note:') ? 'Note ' + k.slice(5)
                : k.startsWith('setup:') ? k.slice(6).replace('|note:', ' · Note ').replace(/_/g,' ')
                : k;
      const farbe = v.schnitt_r > 0 ? 'var(--long)' : v.schnitt_r < 0 ? 'var(--bad)' : 'var(--ink-3)';
      return `<tr>
        <td class="tf">${esc(wie)}</td>
        <td>${v.n}</td>
        <td>${Math.round(v.tp1*100)} %</td>
        <td>${Math.round(v.stop*100)} %</td>
        <td style="color:${farbe};font-weight:600">${v.schnitt_r>0?'+':''}${v.schnitt_r.toFixed(2)} R</td>
        <td style="color:var(--ink-3);font-size:11px">${v.belastbar?'belastbar':'zu wenige'}</td>
      </tr>`;
    }).join('');
  const a = q.alle;
  return `<h2>Trefferquoten</h2>
  <p class="lead">Das ist die Tabelle, aus der die Zeile <em>„traf bisher … %"</em> auf
  jeder Signalkarte kommt. Sie zählt, wie oft frühere Signale derselben Art das erste
  Ziel erreicht haben — <strong>gezählte Vergangenheit, keine Vorhersage</strong>. Alle
  Signale zusammen: ${a?`${Math.round(a.tp1*100)} % erreichten das erste Ziel,
  ${Math.round(a.stop*100)} % liefen in den Stop, aus ${a.n} Fällen`:'—'}.</p>
  <div class="tw"><table class="mtf">
    <tr><th>Gruppe</th><th>Fälle</th><th>1. Ziel</th><th>Stop</th><th>Ø Ergebnis</th><th></th></tr>
    ${zeilen || '<tr><td colspan="6" style="color:var(--ink-3)">Noch keine Gruppe mit genug Fällen.</td></tr>'}
  </table></div>`;
}

function zeichneBilanz(){
  let h = bilanzKasten();
  h += quotenKasten();
  h += historieKasten();
  if (!PF) h += `<div class="note-box"><span class="nt">Noch keine Auswertung</span>
    <p>Die Bilanz entsteht im Tageslauf aus der Wachliste. Solange kein Signal
    abgeschlossen ist, gibt es hier nichts zu zeigen — und dann steht hier nichts,
    statt einer geschoenten Null.</p></div>`;
  $('bilanz').innerHTML = h;
}

      <div class="rowx"><span class="lab">nach Ausschluss</span><span class="val">${k.nach_ausschluss}</span></div>
      <div class="rowx"><span class="lab">liquide genug</span><span class="val">${k.nach_liquiditaet}</span></div>
      <div class="rowx"><span class="lab">gescannt</span><span class="val">${k.genommen}</span></div>
      ${k.verworfen?Object.entries(k.verworfen).filter(([,v])=>v).map(([kk,v])=>
        `<div class="rowx"><span class="lab">verworfen: ${esc(kk)}</span><span class="val">${v}</span></div>`).join(''):''}
    </div>
    <div class="note-box"><span class="nt">Warum gefiltert wird</span>
      <p>Ein Altcoin darf nicht deshalb attraktiv aussehen, weil er extrem schwankt — er
      muss auch handelbar sein. Ohne Umsatz bekommt man den Einstieg nicht zum
      angezeigten Kurs und den Ausstieg gar nicht. Stablecoins, Hebel-Token und
      verpackte Doppel (WBTC …) fliegen raus, weil sie keine eigene Wette sind.</p></div>`;
  }
  const M = S?.makro;
  if (M){
    h += `<h2>Makro</h2><div class="karte">
      <div class="rowx"><span class="lab">Lage</span><span class="val">${esc(REGIME_TEXT[M.regime]||M.regime)} (${M.punkte>=0?'+':''}${M.punkte.toFixed(2)})</span></div>
      ${(M.werte||[]).map(w=>`<div class="rowx"><span class="lab">${esc(w.name)}</span>
        <span class="val">${num(w.wert, w.wert>1000?0:2)}${w.aenderung_20t_pct!=null?` · 20T ${pct(w.aenderung_20t_pct,1)}`:''}</span></div>`).join('')}
      <div class="rowx"><span class="lab">Termine im Kalender</span><span class="val">${(M.termine||[]).length}</span></div>
    </div>
    <div class="note-box"><span class="nt">Warum diese vier Größen</span>
      <p><strong>VIX</strong> — der Preis der Absicherung. Steigt er schnell, wird alles
      Riskante gleichzeitig verkauft, und Einzelanalysen zählen weniger als die Richtung
      des Gesamtmarkts.<br>
      <strong>Dollar-Index</strong> — ein starker Dollar zieht Gold und Krypto Liquidität ab.<br>
      <strong>10-Jahres-Rendite</strong> — steigende Renditen sind Gegenwind für
      Wachstumswerte und für Gold, das keine Zinsen zahlt.<br>
      <strong>S&P 500</strong> — die Referenz für relative Stärke.</p>
      <p>Das sind <em>Zusammenhänge, keine Gesetze</em>. Sie halten oft und brechen
      manchmal. Die Bewertung ist gesetzt, nicht an historischen Ergebnissen optimiert.</p></div>`;
  }
  h += `<h2>Live-Kurse</h2><div class="karte">
    <div class="rowx"><span class="lab">Verbindung</span><span class="val">${WS_OK?'offen':'getrennt'}</span></div>
    <div class="rowx"><span class="lab">Quelle</span><span class="val">Börsen-Websocket</span></div>
    <div class="rowx"><span class="lab">Werte mit Livekurs</span><span class="val">${L.size}</span></div>
  </div>
  <div class="note-box"><span class="nt">Was hier live ist und was nicht</span>
    <p><strong>Live:</strong> die Kurse für Krypto und Gold — direkt von der Börse an
    deinen Browser, ohne Umweg.</p>
    <p><strong>Nicht live:</strong> die eingezeichnete Analyse. Sie stammt aus dem
    stündlichen Scan und trägt dessen Zeitstempel. Für Aktien gibt es kein frei
    zugängliches Live-Feed; dort ist auch der Kurs der Stand des Scans.</p>
    <p>Diese Trennung ist Absicht. Eine Seite, die alles gleich aussehen lässt, verleitet
    dazu, einen Stand von vor einer Stunde für den aktuellen Kurs zu halten.</p></div>`;
  h += `<h2>Was noch fehlt</h2><div class="karte">
    <div class="rowx"><span class="lab">Nachführung laufender Trades in Echtzeit</span><span class="val">offen</span></div>
    <div class="rowx"><span class="lab">Fundamentaldaten bei Aktien</span><span class="val">offen</span></div>
    <div class="rowx"><span class="lab">Dauerlauf-Daemon auf einem Server</span><span class="val">offen</span></div>
  </div>`;
  $('system').innerHTML = h;
}

/* ============================================================ START */
function start(){
  $('built').textContent = 'Gebaut: ' + (D.built_at || '—') +
    ' · Setup ' + (D.setup||'') + ' · ' + (D.params_version||'');
  zeichnePlan(); zeichneAlarme(); zeichnePortfolio(); zeichneSystem(); zeichneBilanz();
  $('chartansicht').innerHTML = `<p class="leer">Scan wird geladen …</p>`;
  $('analyse').innerHTML = `<p class="leer">Scan wird geladen …</p>`;
  const t = parseInt((location.hash||'').replace('#',''), 10);
  zeigeTab(isFinite(t) && t>=0 && t<TABS.length ? t : 0);
  ladeScan();
  // Der Scan wird alle zehn Minuten neu gebaut. Alle fuenf Minuten nachsehen kostet
  // nichts und erspart das manuelle Neuladen.
  setInterval(()=>{ ladeScan(); }, 5*60*1000);

  // Den Service Worker bei jedem Start registrieren, nicht erst beim Anmelden. Ein
  // Geraet, das sich frueher einmal angemeldet hat, braucht ihn beim naechsten
  // Oeffnen sofort wieder — sonst kommt der Push an, und niemand nimmt ihn entgegen.
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
start();
</script>
