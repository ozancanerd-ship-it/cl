/* ============================================================ ALARME */
/* ============================================================ ALARME
   Zwei Wege zur selben Aussage, absichtlich getrennt:
     · der CI-Waechter prueft alle 15 Minuten und verschickt (Telegram)
     · diese Seite rechnet den Zustand LIVE aus dem Boersenkurs
   Der zweite Weg braucht keine Schlüssel und aktualisiert sich im Sekundentakt.
   Laufen sie auseinander, ist das ein Befund und kein Schönheitsfehler.
   ============================================================ */
const ZUSTAND_TEXT = {
  'wartet_auf_einstieg':'wartet auf Einstieg', 'aktiv':'im Trade',
  'ziel_erreicht':'Ziel erreicht', 'stop':'ausgestoppt', 'invalidiert':'ungültig',
  'abgelaufen':'abgelaufen'
};
const OFFEN = ['wartet_auf_einstieg','aktiv'];
const NOTE_RANG = {'A+':6,'A':5,'A−':4,'B+':3,'B':2,'WATCH':1,'—':0};

/* Der Live-Zustand eines Setups: was gilt JETZT, bei diesem Kurs? */
function lage(w, ausScan){
  /* ``ausScan`` ist der Kurs aus dem letzten Scan. Er ist der Grund, warum Aktien hier
     ueberhaupt einen Zustand bekommen: fuer sie gibt es keinen Livestream, und vorher
     blieb deshalb jede Aktie auf „beobachten" stehen — auch die, die im Markt-Reiter
     gruen als JETZT leuchtete. */
  const st = kursStand(w.instrument, ausScan);
  const kurs = st.kurs;
  const lang = w.richtung === 'long';
  const risiko = Math.abs(w.einstieg - w.stop);
  const eingestiegen = w.zustand === 'aktiv';
  let stufe = 'beobachten', abstand = null, r = null;

  if (kurs != null){
    abstand = (lang ? (kurs / w.einstieg - 1) : (w.einstieg / kurs - 1)) * 100;
    const basis = w.einstiegskurs ?? w.einstieg;
    if (risiko > 0) r = (lang ? kurs - basis : basis - kurs) / risiko;
    const erreicht = einstiegErreicht(lang, w.einstieg, kurs);
    const raus = lang ? kurs <= w.stop : kurs >= w.stop;
    if (eingestiegen && raus) stufe = 'stop';
    else if (eingestiegen) stufe = 'im_trade';
    else if (erreicht) stufe = 'jetzt';
    else if (Math.abs(abstand) <= 1.5) stufe = 'bald';
  } else if (eingestiegen) stufe = 'im_trade';

  return {w, kurs, lang, risiko, abstand, r, stufe, live: st.live};
}

/* Lokale Benachrichtigung, wenn ein Setup live auf "jetzt" springt.

   WARUM DAS GEDAECHTNIS AUF DER PLATTE LIEGT UND NICHT IM ARBEITSSPEICHER

   Vorher merkte sich die App im laufenden Betrieb, was sie schon gemeldet hat. Beim
   naechsten OEFFNEN war das Gedaechtnis leer — und dann meldete sie alles noch einmal.
   Auf dem iPhone, wo eine Seite vom Home-Bildschirm bei jedem Start neu laedt, heisst
   das: bei jedem Blick in die App ein Schwung Meldungen fuer dieselben Signale, die
   man schon kennt. Genau das hat Ozan als Spam erlebt.

   Jetzt steht der Schluessel im localStorage und ueberlebt jeden Neustart. Dazu eine
   Sperre von zwoelf Stunden: derselbe Wert meldet sich hoechstens einmal am halben Tag,
   selbst wenn die Wachliste ihn neu aufnimmt. */
const GEMELDET_KEY = 'desk.gemeldet.v1';
const GEMELDET_SPERRE_MS = 12 * 3600 * 1000;
function gemeldetLaden(){
  try {
    const roh = JSON.parse(localStorage.getItem(GEMELDET_KEY) || '{}');
    const jetzt = Date.now(), sauber = {};
    for (const [k, t] of Object.entries(roh)) if (jetzt - t < GEMELDET_SPERRE_MS) sauber[k] = t;
    return sauber;
  } catch(e){ return {}; }
}
function gemeldetMerken(key){
  try {
    const a = gemeldetLaden();
    a[key] = Date.now();
    localStorage.setItem(GEMELDET_KEY, JSON.stringify(a));
  } catch(e){}
}
/* Ab welcher Note ein neues Setup aufs Handy darf.

   Unter den Alarmen stand schon immer der Satz „Neue Setups nur ab A−. B und B+ stehen
   hier, klingeln aber nicht." — und er stimmte nicht: es gab nirgends eine Notenpruefung,
   gemeldet wurde jedes erreichte Setup. Ozans Vorgabe ist eindeutig ("nur den einen
   perfekten Alarm bei gutem Einstieg, nicht viele"), also gilt jetzt, was dasteht.
   Laufende Trades sind davon nicht betroffen: Stop, Ziel und Ungueltigkeit melden sich
   unabhaengig von der Note, weil dort Geld im Feuer steht. */
const MELDE_AB_RANG = 4;   // A−

/* ============================================ DAS ALARM-TOR (seit 26.09.)

   „Die Alarme sind irgendwie schlecht geworden … bessere Alarme, da wo es sich wirklich
   lohnt."

   Ob ein Einstieg ein Alarm ist, entscheidet nicht mehr die App allein nach der Note,
   sondern das Alarm-Tor im Scan (scanner/alarm_tor.py) — DIESELBE Pruefung, die der
   Waechter vor dem Senden aufs Handy macht. Sie steht in jeder Zeile unter ``alarm``:
   ``ja`` und der Grund, wenn nicht. Fehlt sie (alter Scan), gilt die alte Notenregel.

   Geprueft wird: benanntes Setup, Note ab A− (B+ nur bei bewaehrter Setup-Art), die
   eigene Bilanz der Setup-Art, Chance-Risiko ab 1:2, Ziel 1 weit genug weg fuer die
   Gebuehren. Aufs Handy kommen davon hoechstens drei am Tag, derselbe Coin einmal in
   48 Stunden — das steht nur im Waechter, weil es vom Verlauf abhaengt. */
function alarmTor(x){ const o = x && (x.o || x); return (o && o.alarm && typeof o.alarm.ja === 'boolean') ? o.alarm : null; }
function alarmReif(x){
  const t = alarmTor(x);
  if (t) return t.ja;
  const w = x && (x.w || x);
  return (NOTE_RANG[w && w.note] || 0) >= MELDE_AB_RANG;
}
function alarmGrund(x){
  const t = alarmTor(x);
  if (t) return t.grund || '';
  const w = x && (x.w || x);
  return `Note ${w ? w.note : '—'} — Alarm erst ab A−`;
}

function benachrichtige(x){
  // Aus einem toten Scan kommt keine Meldung. Eine Kaufaufforderung mit Marken von
  // gestern Abend ist genau die Art Alarm, die Geld kostet.
  if (scanTot()) return;
  if (!alarmReif(x)) return;
  const key = x.w.instrument + ':' + x.w.aufgenommen;
  if (gemeldetLaden()[key]) return;
  gemeldetMerken(key);
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const d = digits(x.w.einstieg);
    meldung(`${x.lang?'KAUFEN':'VERKAUFEN'} ${name(x.w.instrument)} · ${x.w.note}`, {
      body: `Einstieg ${num(x.w.einstieg,d)} erreicht\nStop ${num(x.w.stop,d)}`
            + (x.w.tp1!=null?` · Ziel ${num(x.w.tp1,d)}`:'')
            // Ohne diesen Zusatz sieht ein Alarm auf Scanbasis aus wie einer auf
            // Livebasis. Bei Aktien ist er bis zu einer halben Stunde alt.
            + (x.live ? '' : '\nKurs aus dem letzten Scan — vor dem Kauf im Broker prüfen'),
      tag: key,
    });
  } catch(e){}
}

/* Die Buy-Signale kommen aus der RANGLISTE, nicht aus einer festen Liste. Bei jedem
   Scan (alle 30 Min) steht hier, was gerade oben steht; bei jedem Kurs-Tick aendert
   sich der Zustand. Ozans Vorgabe: "aus einem Ranking gemacht, und fuer die besten
   Rankings die besten Alarme ... nicht immer die gleiche Dings". */
function ausRanking(){
  const wachen = new Map(((WL && WL.wachen) || []).map(w=>[w.instrument, w]));
  const rows = (S?.gesamt||[]).filter(handelsreif);
  return rows.map(o=>{
    const w = wachen.get(o.instrument);
    /* Vor dem Einstieg ist der Plan ein VORSCHLAG und muss aktuell sein: es gelten die
       Zahlen des letzten Scans. Ab dem Einstieg ist er ein VERTRAG und bleibt fest —
       sonst wandert der Stop mit jedem Scan, und hinterher weiss niemand, gegen welchen
       Plan das Ergebnis gemessen wurde.
       Genau das war Ozans Einwand: ein Einstieg, der vor Stunden gesetzt wurde und an
       dem der Markt laengst vorbeigelaufen ist, ergibt keinen Sinn mehr. */
    const imTrade = w && w.zustand === 'aktiv';
    const basis = {
      instrument: o.instrument, klasse: o.klasse, richtung: o.richtung, note: o.note,
      einstieg: imTrade ? w.einstieg : o.einstieg,
      einstieg_art: imTrade ? w.einstieg_art : (o.einstieg_art || 'sofort'),
      stop: imTrade ? w.stop : (o.plan ? o.plan.stop : o.invalidierung),
      /* Die Ziele kommen aus dem Handelsplan, nicht roh aus der Liquiditaetsliste:
         dort steht sicher, dass Ziel 1 nie naeher liegt als der Stop entfernt ist. */
      tp1: imTrade ? w.tp1 : (o.plan ? o.plan.tp1 : o.ziel),
      tp2: imTrade ? w.tp2 : (o.plan ? o.plan.tp2 : o.tp2),
      tp3: imTrade ? w.tp3 : (o.plan ? o.plan.tp3 : o.tp3),
      zustand: w ? w.zustand : 'wartet_auf_einstieg',
      erreicht: w ? (w.erreicht||[]) : [],
      einstiegskurs: w ? w.einstiegskurs : null,
      gemeldet: w ? (w.gemeldet || '') : '',
      schutz: w ? w.schutz : null,
      raus: w ? !!w.raus : false,
      aufgenommen: w ? w.aufgenommen : (S?.erzeugt || ''),
      frisch: !imTrade,
    };
    return {...lage(basis, o.kurs), o};
  }).filter(x=>OFFEN.includes(x.w.zustand));
}

/* Was ein Signal bringen kann — und wie oft so etwas bisher aufging.

   Die beiden Zahlen sehen nebeneinander gleich aus und sind es nicht: die erste ist
   gerechnet (vom Einstieg zum Ziel sind es soundso viel Prozent), die zweite ist
   gezaehlt (von so vielen frueheren Signalen dieser Art haben soundso viele das Ziel
   erreicht). Deshalb steht bei der zweiten immer die Zahl der Faelle daneben und
   darunter der Satz, dass es Vergangenheit ist. Ohne den liest man eine Quote als
   Versprechen. */
/* =================================================== WIE LANGE LÄUFT DAS?

   „Mir fehlen noch ein, zwei kurze Trades. Die nicht über Wochen hinweg gehen."

   Die Frage war bisher unbeantwortbar, weil nirgends stand, wie lange ein Signal
   tatsächlich gelaufen ist. Jetzt wird es gemessen: von der Aufnahme auf die Wachliste
   bis zum Ausgang, über alle 60 abgeschlossenen Signale.

   Das Ergebnis ist selbst eine Antwort: der Median liegt bei rund anderthalb Tagen,
   knapp sechs von zehn Signalen sind binnen zwei Tagen entschieden. Was sich nach
   „wochenlang" anfühlt, sind meist die Kandidaten unter „Kaufen ab …", die auf ihren
   Einstieg warten — nicht die Trades selbst. Deshalb steht die Zahl ab jetzt auf der
   Karte, statt dass man sie sich zusammenreimen muss.

   Geschätzt wird hier nichts. Fehlen die Fälle, steht nichts da. */
function dauerText(h){
  if (h == null) return '—';
  if (h < 24) return `${Math.round(h)} Std.`;
  const t = h / 24;
  if (t < 10) return `${t.toFixed(1).replace('.',',')} Tage`;
  return `${Math.round(t)} Tage`;
}
/* Die Anlageklasse trennt schärfer als die Note — und genau das ist die Antwort auf
   „ich will auch kurze Trades": Krypto ist im Median nach EINEM Tag entschieden, eine
   Aktie braucht VIER. Die kurzen Trades gibt es also längst, sie stehen nur nicht dran.
   Deshalb zählt hier zuerst die Klasse, dann die Note, dann der Gesamtschnitt. */
function dauerFuer(note, klasse){
  const D = PF && PF.dauer;
  if (!D || !D.median_h) return null;
  const jk = klasse ? (D.je_klasse || {})[klasse] : null;
  if (jk && jk.faelle >= 5)
    return {median_h: jk.median_h, faelle: jk.faelle, quelle: klasse === 'aktien' ? 'Aktien' : 'Coins'};
  const jn = (D.je_note || {})[note];
  if (jn && jn.faelle >= 5) return {median_h: jn.median_h, faelle: jn.faelle, quelle: 'Note ' + note};
  return {median_h: D.median_h, faelle: D.faelle, quelle: 'alle'};
}
function istKurz(note, klasse){
  const d = dauerFuer(note, klasse);
  const grenze = (PF && PF.dauer && PF.dauer.kurz_bis_h) || 48;
  return d ? d.median_h <= grenze : null;
}

function erwartungsKasten(o){
  const e = o && o.erwartung; if (!e) return '';
  const q = e.quote;
  const teile = [];
  if (e.bis_tp1_pct != null) teile.push(`<span>1. Ziel <b class="up">${pct(e.bis_tp1_pct,1)}</b></span>`);
  if (e.bis_tp3_pct != null) teile.push(`<span>alle Ziele <b class="up">${pct(e.bis_tp3_pct,1)}</b></span>`);
  if (e.risiko_pct != null) teile.push(`<span>bis Stop <b class="dn">−${num(e.risiko_pct,1)} %</b></span>`);
  if (q) teile.push(`<span>traf bisher <b>${Math.round(q.tp1*100)} %</b>
    <span style="color:var(--ink-3)">von ${q.n} Fällen</span></span>`);
  const dd = dauerFuer(o.note, o.klasse);
  if (dd) teile.push(`<span>lief im Median <b>${dauerText(dd.median_h)}</b>
    <span style="color:var(--ink-3)">${esc(dd.quelle)}, ${dd.faelle} Fälle</span></span>`);
  return `<div class="erw">
    <span class="nt">Was es bringen kann — und wie oft es bisher aufging</span>
    <div class="kpi">${teile.join('')}</div>
    ${q?`<div class="qbar"><i style="width:${Math.max(2,Math.round(q.tp1*100))}%"></i></div>`:''}
    <p>${(e.saetze||[]).map(esc).join(' ')}${dd?` Bis zur Entscheidung vergingen bei
      vergleichbaren Signalen im Median ${dauerText(dd.median_h)} — das ist keine Prognose,
      sondern gemessen an ${dd.faelle} abgeschlossenen Fällen.`:''}</p>
  </div>`;
}

function signalKarte(x){
  const w = x.w, o = x.o || {}, d = digits(w.einstieg);
  const lang = x.lang;
  const seite = lang ? 'KAUFEN' : 'VERKAUFEN';
  const farbe = lang ? 'var(--long)' : 'var(--bad)';
  /* Woher der Kurs kommt, steht auf der Karte — nicht im Kleingedruckten. Bei Krypto
     laeuft ein Livestream, bei Aktien nicht; ein JETZT auf Scanbasis kann bis zu einer
     halben Stunde alt sein. Das ist immer noch die beste verfuegbare Auskunft, aber es
     ist eine andere Auskunft. */
  const quelle = x.kurs == null ? ''
    : x.live ? ` <span class="up mono" style="font-size:10px">LIVE</span>`
    : ` <span class="mono" style="font-size:10px;color:var(--ink-3)">Kurs aus dem letzten Scan${
        S && S.erzeugt ? ', ' + zeit(S.erzeugt) : ''}</span>`;
  let urteil, klasse = '';
  if (x.stufe === 'jetzt'){ urteil = `<strong style="color:${farbe}">${seite} — JETZT</strong>${quelle}`; klasse = 'hot'; }
  else if (x.stufe === 'im_trade'){ urteil = `<strong>im Trade</strong>`; klasse = 'hot'; }
  else if (x.stufe === 'stop'){ urteil = `<strong style="color:var(--bad)">Stop erreicht</strong>`; }
  else urteil = `${seite} ab <strong>${num(w.einstieg,d)}</strong>${
    x.abstand!=null?` <span style="color:var(--ink-3)">(noch ${Math.abs(x.abstand).toFixed(2).replace('.',',')} %)</span>`:''}`;

  /* Positionsgröße: 0,5 % Risiko — aber gedeckelt durch das Kapital.
     Ohne Deckel kam bei einem Wert mit 0,06 % Stopabstand "9999 Stück ≈ 9.992 €"
     heraus, bei 1.200 € Kapital. Rechnerisch richtig, praktisch Unsinn: was man
     nicht kaufen kann, ist keine Positionsgröße. */
  const equity = P ? P.equity : 1200;
  const MAX_ANTEIL = 0.25;
  const ausRisiko = x.risiko > 0 ? equity * 0.005 / x.risiko : 0;
  const ausKapital = w.einstieg > 0 ? equity * MAX_ANTEIL / w.einstieg : 0;
  const gedeckelt = ausRisiko > ausKapital;
  const stueck = Math.floor(Math.min(ausRisiko, ausKapital));
  const euro = Math.round(stueck * w.einstieg);
  const ziele = [w.tp1, w.tp2, w.tp3].filter(v=>v!=null);

  const st = o.setup || null;
  return `<div class="alarm ${klasse}" data-sym="${esc(w.instrument)}">
    <div class="ah">
      <span>${esc(name(w.instrument))}</span>
      <span class="note ${NOTE_KLASSE[w.note]||''}">${esc(w.note)}</span>
      ${(()=>{ const k = istKurz(w.note, o.klasse); const dd = dauerFuer(w.note, o.klasse);
        if (k == null) return '';
        return `<span class="note ${k?'gut':''}" title="gemessen an ${dd.faelle} abgeschlossenen Signalen (${dd.quelle})"
          >${k?'kurz':'länger'} · ${dauerText(dd.median_h)}</span>`; })()}
      <span class="d">${o.score!=null?`${o.score.toFixed(0)}/100`:''}${
        o.rs!=null?` · RS ${Math.round(o.rs)}`:''}</span>
    </div>
    ${st?`<div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--accent);margin-top:5px">${esc(st.name)}</div>`:''}
    <p style="font-size:14.5px;margin-top:6px">${urteil}</p>
    ${st?`<p style="font-size:12.5px;color:var(--ink-2);margin-top:4px">${esc(st.these)}</p>`:''}
    ${(()=>{ /* Warum das (k)ein Alarm ist — in einem Satz, auf der Karte selbst. */
      if (x.stufe === 'im_trade' || x.stufe === 'stop'){
        return w.gemeldet ? `<p style="font-size:12px;margin-top:5px;color:var(--accent)">Der
          Einstieg kam als Alarm aufs Handy (${zeit(w.gemeldet)}) — Ziel, Stop und Ausstieg
          klingeln ebenfalls.</p>` : '';
      }
      const t = alarmTor(x);
      if (!t) return '';
      return t.ja
        ? `<p style="font-size:12px;margin-top:5px;color:var(--long)">Kommt durchs Alarm-Tor${
            t.bilanz ? ` · ${esc(t.bilanz)}` : ''}</p>`
        : `<p style="font-size:12px;margin-top:5px;color:var(--warn)">Kein Alarm: ${esc(t.grund)}</p>`;
    })()}
    <div class="kpi">
      <span>Einstieg <b>${preis(o,'einstieg',w.einstieg,d)}</b> <span style="color:var(--ink-3)">${esc(w.einstieg_art)}${w.frisch?' · aus dem letzten Scan':' · fest seit Einstieg'}</span></span>
      <span>Stop <b>${preis(o,'stop',w.stop,d)}</b></span>
      ${ziele.length?`<span>Ziele <b>${ziele.map((v,i)=>preis(o,'tp'+(i+1),v,d)).join(' / ')}</b></span>`:''}
    </div>
    <div class="kpi">
      ${x.kurs!=null?`<span>Kurs <b>${num(x.kurs,d)}</b>${x.live?' <span class="up">live</span>':''}</span>`:''}
      ${(()=>{ const c = crvVon(o); return c!=null?`<span>CRV <b>1:${c.toFixed(1)}</b></span>`:''; })()}
      ${bewegungSpan(o)}
      ${x.r!=null&&(x.stufe==='im_trade'||x.stufe==='stop')?`<span>Stand <b class="${x.r>=0?'up':'dn'}">${x.r>=0?'+':''}${x.r.toFixed(2)}R</b></span>`:''}
      ${(w.erreicht||[]).length?`<span>erreicht <b>${w.erreicht.join(', ')}</b></span>`:''}
    </div>
    ${stueck>0?`<p style="color:var(--ink-2);font-size:12.5px">Bei 0,5 % Risiko auf
      ${num(equity,0)} €: rund <strong>${stueck}</strong> Stück ≈ ${num(euro,0)} € Einsatz,
      Verlust bei Stop rund ${num(Math.round(stueck*x.risiko),0)} €.${
      gedeckelt?` <span style="color:var(--warn)">Auf ${Math.round(MAX_ANTEIL*100)} % vom
      Kapital begrenzt — der Stop liegt so eng, dass 0,5 % Risiko mehr Geld bräuchte,
      als du hast.</span>`:''}</p>`:''}
    ${st&&st.trigger?`<p style="color:var(--ink-2);font-size:12px;margin-top:7px">
      <span style="color:var(--accent)">Auslöser:</span> ${esc(st.trigger)}</p>`:''}
    <div class="kpi" style="margin-top:8px">
      <span>Kaufen bei <b>${esc(o.broker||'—')}</b></span>
      ${eurHinweis(o)?`<span>${eurHinweis(o)}</span>`:''}
    </div>
    ${euro>0?`<p style="font-size:11.5px;color:var(--ink-3);margin-top:6px">${gebuehrSatz(o, euro)}</p>`:''}
    ${erwartungsKasten(o)}
    <p style="margin:10px 0 0"><button class="btn" data-kauf="${esc(w.instrument)}"
      data-menge="${stueck}" data-kurs="${w.einstieg}">Gekauft — ins Depot</button></p>
    ${(o.warnungen||[]).length?`<p class="warnz">${o.warnungen.map(esc).join('<br>')}</p>`:''}
  </div>`;
}

/* ============================================ DEINE ALARM-TRADES

   Bisher standen laufende Trades nur hier, solange ihr Setup im AKTUELLEN Scan noch
   handelbar war. Drehte der Scan auf „beobachten", verschwand der Trade von der Seite —
   obwohl Geld darin steckte. Diese Liste kommt deshalb aus der Wachliste selbst: jeder
   Trade, dessen Einstieg als Alarm aufs Handy ging, bis er laut Plan draussen ist. */
const PLAN_ZIEL_R = {TP1: 1, TP2: 2, TP3: 3.5};
function planR(w){
  // War der Plan schon draussen (Schutz-Stop), zählen nur die Ziele bis dahin — die Wache
  // läuft für die Statistik weiter, ein späteres Ziel 3 hat der Plan aber nicht mehr.
  if (w.raus && Array.isArray(w.raus_erreicht)){
    const v = w.raus_erreicht.filter(t => PLAN_ZIEL_R[t] != null);
    if (!v.length) return 0;
    const rest = v.includes('TP2') ? PLAN_ZIEL_R.TP1 : 0;
    return (v.reduce((a, t) => a + PLAN_ZIEL_R[t], 0) + (3 - v.length) * rest) / 3;
  }
  const e = (w.erreicht || []).filter(t => PLAN_ZIEL_R[t] != null);
  if (e.length) return e.reduce((a, t) => a + PLAN_ZIEL_R[t], 0) / 3;
  return w.zustand === 'stop' ? -1 : null;
}
function wacheName(w){
  return (w.name && w.name !== w.instrument) ? w.name : name(w.instrument);
}
function alarmTradesBlock(){
  const alle = ((WL && WL.wachen) || []).filter(w => w.gemeldet);
  const scanKurs = new Map((S?.gesamt || []).map(o => [o.instrument, o.kurs]));
  if (!alle.length) return '';
  return `<div id="alarmtrades">${alarmTradesInhalt(alle, scanKurs)}</div>`;
}
function alarmTradesInhalt(alle, scanKurs){
  const offen = alle.filter(w => w.zustand === 'aktiv' && !w.raus)
                    .sort((a,b) => String(b.gemeldet).localeCompare(String(a.gemeldet)));
  const fertig = alle.filter(w => !(w.zustand === 'aktiv' && !w.raus))
                     .sort((a,b) => String(b.zuletzt).localeCompare(String(a.zuletzt))).slice(0, 8);
  let h = '';
  if (offen.length){
    h += `<h2>Deine Alarm-Trades <span class="mono" style="font-size:12px;color:var(--ink-3)">${offen.length} offen — dazu klingeln Ziel, Stop und Ausstieg</span></h2>`;
    h += offen.map(w => {
      const d = digits(w.einstieg);
      const lang = w.richtung === 'long';
      // Live, wo es einen Stream gibt (Krypto); sonst der Kurs aus dem letzten Scan.
      const st = kursStand(w.instrument, scanKurs.get(w.instrument));
      const kurs = st.kurs;
      const basis = w.einstiegskurs ?? w.einstieg;
      const risiko = Math.abs(w.einstieg - w.stop);
      const r = (kurs != null && risiko > 0) ? (lang ? kurs - basis : basis - kurs) / risiko : null;
      const stopJetzt = w.schutz != null ? w.schutz : w.stop;
      const naechstes = [['TP1', w.tp1], ['TP2', w.tp2], ['TP3', w.tp3]]
        .find(([t, v]) => v != null && !(w.erreicht || []).includes(t));
      return `<div class="alarm hot" data-sym="${esc(w.instrument)}">
        <div class="ah"><span>${esc(wacheName(w))}</span>
          <span class="note">${lang ? 'LONG' : 'SHORT'} · ${esc(w.note)}</span>
          <span class="d">Alarm ${zeit(w.gemeldet)}</span></div>
        ${w.setup ? `<div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:5px">${esc(w.setup)}</div>` : ''}
        <div class="kpi">
          <span>Einstieg <b>${num(basis, d)}</b></span>
          <span>Stop jetzt <b>${num(stopJetzt, d)}</b>${w.schutz != null ? ' <span class="up">nachgezogen</span>' : ''}</span>
          ${naechstes ? `<span>Nächstes Ziel <b>${num(naechstes[1], d)}</b> <span style="color:var(--ink-3)">${naechstes[0].replace('TP','Ziel ')}</span></span>` : ''}
        </div>
        <div class="kpi">
          ${kurs != null ? `<span>Kurs <b>${num(kurs, d)}</b> ${st.live
            ? '<span class="up">live</span>' : '<span style="color:var(--ink-3)">aus dem Scan</span>'}</span>` : ''}
          ${r != null ? `<span>Stand <b class="${r >= 0 ? 'up' : 'dn'}">${r >= 0 ? '+' : ''}${r.toFixed(2)}R</b></span>` : ''}
          ${(w.erreicht || []).length ? `<span>erreicht <b>${w.erreicht.join(', ').replace(/TP/g,'Ziel ')}</b></span>` : ''}
          ${w.broker ? `<span>bei <b>${esc(w.broker)}</b></span>` : ''}
        </div>
      </div>`;
    }).join('');
  }
  if (fertig.length){
    h += `<h2>So gingen deine letzten Alarme aus</h2>`;
    h += `<div class="note-box"><p style="font-size:12.5px;color:var(--ink-2)">Gerechnet nach
      dem Plan aus dem Alarm: ein Drittel bei jedem Ziel, nach Ziel 1 Stop auf Einstand.
      „ohne Ergebnis" heisst: der Trade endete, bevor er Ziel oder Stop sah (Analyse
      gedreht, abgelaufen) — dann zählt der Kurs beim Ausstieg, und der steht hier nicht
      als Zahl, weil er nicht gemessen wurde.</p>`;
    h += `</div><div class="tw"><table class="mtf"><tr><th>Wert</th><th>Ausgang</th><th>R nach Plan</th></tr>`
      + fertig.map(w => {
        const r = planR(w);
        const was = w.raus && w.zustand === 'aktiv' ? 'nachgezogener Stop'
                  : (ZUSTAND_TEXT[w.zustand] || w.zustand);
        return `<tr><td>${esc(wacheName(w))}</td>
          <td>${esc(was)}${(() => { const e = (w.raus && Array.isArray(w.raus_erreicht)) ? w.raus_erreicht : (w.erreicht || []);
            return e.length ? '<br><span class="nu">' + e.join(', ').replace(/TP/g,'Ziel ') + '</span>' : ''; })()}</td>
          ${r == null ? '<td class="nu">ohne Ergebnis</td>'
            : `<td class="${r >= 0 ? 'up' : 'dn'}">${r >= 0 ? '+' : ''}${r.toFixed(2).replace('.',',')}</td>`}</tr>`;
      }).join('') + `</table></div>`;
  }
  return h;
}

/* Was aufs Handy geht — und was nicht. Mit der Bilanz je Setup-Art, damit eine
   Sperre nachvollziehbar ist und man sieht, wann sie sich lösen würde. */
function alarmRegelnBlock(){
  const R = S && S.alarm_regeln;
  const arten = R ? Object.entries(R.setup_arten || {}) : [];
  const zeile = ([n, v]) => {
    const kl = v.urteil === 'gesperrt' ? 'dn' : v.urteil === 'bewaehrt' ? 'up' : 'nu';
    const wort = v.urteil === 'gesperrt' ? 'gesperrt' : v.urteil === 'bewaehrt' ? 'bewährt' : 'offen';
    return `<tr><td>${esc(n)}</td><td>${v.anzahl}</td><td>${v.ziel1}</td>
      <td class="${v.summe_r >= 0 ? 'up' : 'dn'}">${v.summe_r >= 0 ? '+' : ''}${v.summe_r.toFixed(1).replace('.',',')}</td>
      <td class="${kl}">${wort}</td></tr>`;
  };
  return `<div class="note-box warn" style="margin-top:22px"><span class="nt">Was aufs Handy geht — und was nicht</span>
    ${R && R.nur_bewaehrt ? `<p><strong>Gewinner-Tor: ein Einstieg klingelt nur, wenn sich seine
    Setup-Art in deiner eigenen Bilanz bewährt hat</strong> — mindestens ${R.min_faelle} entschiedene
    Trades, unterm Strich im Plus, Profitfaktor ab ${String(R.bewaehrt_pf).replace('.',',')}. Dazu Note
    ab A− (B+ klingelt nicht), Chance-Risiko ab 1:${R.min_crv}, Ziel 1 weit genug weg, dass nach
    Gebühren etwas bleibt. ${(R.frei||[]).length
      ? `Frei sind gerade: <strong>${R.frei.map(esc).join(', ')}</strong>.`
      : 'Gerade ist <strong>keine</strong> Setup-Art frei — dann klingelt nichts, und das ist Absicht.'}
    Alles andere wird weiter beobachtet und gezählt; eine Art, die sich bewährt, wird von selbst frei.</p>
    <p style="font-size:12.5px;color:var(--ink-2)">Ehrlich dazu: das ist eine strengere Auswahl,
    kein Beweis. Die eigene Bilanz ist noch klein, und im Nachspiel über 19 Monate hat kein Filter
    einen belastbaren Vorteil gezeigt. Sicher ist: weniger Alarme, und keiner mehr für eine Art
    ohne Erfolgsnachweis.</p>`
    : `<p><strong>Ein Einstieg klingelt nur, wenn er durchs Alarm-Tor kommt:</strong> benanntes
    Setup · Note ab A− (B+ nur, wenn sich die Setup-Art in der eigenen Bilanz bewährt hat) ·
    die Setup-Art hat bisher nicht unterm Strich verloren · Chance-Risiko ab
    1:${R ? R.min_crv : 2} · Ziel 1 weit genug weg, dass nach Gebühren etwas bleibt.</p>`}
    <p><strong>Und höchstens ${R ? R.max_je_tag : 3} am Tag</strong>, derselbe Coin höchstens
    einmal in ${R ? R.sperre_je_wert_h : 48} Stunden. Kommen mehr zusammen, gehen die besten raus.</p>
    <p><strong>Ziel, Stop, nachgezogener Stop und Ausstieg</strong> klingeln nur für Trades,
    deren Einstieg als Alarm kam — für alles andere hast du nichts im Markt.</p>
    ${arten.length ? `<p style="margin-top:10px"><strong>Bilanz je Setup-Art</strong>
      <span style="color:var(--ink-3)">— nur entschiedene Trades (Ziel oder Stop erreicht),
      gerechnet nach Plan. Ab ${R.min_faelle} Fällen gibt es ein Urteil; eine Sperre löst sich
      von selbst, sobald die Bilanz dreht.</span></p>
      <div class="tw"><table class="mtf"><tr><th>Setup-Art</th><th>Trades</th><th>Ziel 1</th><th>R</th><th></th></tr>
      ${arten.map(zeile).join('')}</table></div>` : ''}
    ${R && (R.gesperrt || []).length ? `<p style="margin-top:8px;color:var(--ink-3)">Gerade
      gesperrt: ${R.gesperrt.map(esc).join(' · ')}</p>` : ''}
    <p style="color:var(--ink-3)">Das ist gezählte Vergangenheit aus wenigen Wochen, kein Beweis
    für einen Vorteil. Es reicht aber, um nicht weiter jede Stunde eine Setup-Art aufs Handy
    zu schicken, die bisher nur Geld gekostet hat.</p>
    <p>Krypto-Scan alle 10 Minuten, alle Aktien alle 30, Wächter alle 5 Minuten, diese Seite
    rechnet dazwischen live weiter.</p></div>`;
}

function zeichneAlarme(){
  // Dieselbe Quelle wie der Markt-Reiter — nicht dieselbe Rechnung noch einmal.
  const signale = [...rangLagen().values()];
  const rang = a => [-(NOTE_RANG[a.w.note]||0), Math.abs(a.abstand ?? 999)];
  signale.sort((a,b)=>{ const [ra,da]=rang(a), [rb,db]=rang(b); return ra!==rb ? ra-rb : da-db; });

  const tot = scanTot();
  /* „Jetzt einsteigen" ist die Seite, auf der steht: das kaufst du. Dann darf dort auch
     nur stehen, was die Qualitaetsschwelle besteht. Auf Ozans Screenshot war die oberste
     Karte ein B mit Score 45, relativer Staerke 27, Klarheit 11 % und drei Warnungen,
     die das Setup selbst bestreiten ("keine Kontraktion — das ist keine Basis").
     Formal am Einstieg, ja. Aber nicht das, was ganz oben auf einer Handlungsliste
     gehoert — und genau dafuer stand unten schon die Zusage "nur ab A−".
     Weggeworfen wird nichts: die schwaecheren stehen darunter, mit dem Grund. */
  const amEinstieg = amEinstiegListe();
  const jetzt   = amEinstieg.filter(alarmReif);
  const knapp   = amEinstieg.filter(x=>!alarmReif(x));
  const imTrade = signale.filter(x=>x.stufe==='im_trade'||x.stufe==='stop');
  const warten = tot ? [] : signale.filter(x=>x.stufe==='bald'||x.stufe==='beobachten');
  jetzt.forEach(benachrichtige);

  let h = altersBanner() + stoerungsBanner() + pushBlock();
  h += `<div class="note-box" style="border-color:rgba(0,229,255,.28)">
    <span class="nt" style="color:var(--accent)">Hier wird gekauft</span>
    <p style="font-size:13.5px"><strong>Diese Seite ist die Handlungsliste.</strong> Was unter
    <em>„Jetzt einsteigen"</em> steht, ist da — Kurs an der Marke und bestätigt. Das kaufst du.
    <em>„Kaufen ab …"</em> sind Kandidaten mit dem Preis, ab dem es losgeht: dort gehört eine
    <strong>Limit-Order</strong> hin, dann brauchst du gar keinen Alarm (und zahlst bei Kraken
    0,40 % statt 0,80 %).</p>
    <p>Der Reiter <strong>Markt</strong> ist etwas anderes: die vollständige Rangliste zum
    Nachsehen. „Handelbar" heißt dort nur, dass das Setup gut genug ist — <strong>nicht</strong>,
    dass der Kurs schon am Einstieg steht. Kurz: <strong>Markt = lesen, Alarme = handeln.</strong></p>
    <p><strong>Es steht hier genau das, was im Markt <em>JETZT</em> zeigt — ${jetzt.length}
    ${jetzt.length===1?'Wert':'Werte'}, die durchs Alarm-Tor kommen${knapp.length?`, dazu
    ${knapp.length} ohne Alarm weiter unten`:''}.</strong> Beide Seiten benutzen seit dem 16.09. dieselbe Funktion;
    vorher waren es zwei Rechnungen, und Aktien konnten hier gar nicht auftauchen, weil
    sie keinen Livekurs haben. Sie tun es jetzt — mit dem Vermerk <em>Kurs aus dem letzten
    Scan</em>, damit du den Unterschied siehst.</p>
    <p>Ist „Jetzt einsteigen" leer, ist gerade nichts zu tun. Das ist ein Ergebnis, kein Fehler.</p>
  </div>
  <div class="note-box">
    <span class="nt">Woher diese Liste kommt</span>
    <p>Das sind die <strong>bestbewerteten Setups aus dem letzten Scan</strong> —
      ${S?`${(S.gesamt||[]).length} Werte, Analyse von ${zeit(S.erzeugt)}`:'—'}. Die Liste
      wird bei jedem Scan neu gebildet, die Reihenfolge und der Zustand ändern sich mit
      jedem Kurs. Es steht also nicht immer dasselbe da.</p>
  </div>`;

  h += terminWarnung();
  h += `<h2>Jetzt einsteigen ${jetzt.length?`<span class="mono" style="font-size:12px;color:var(--ink-3)">${
    jetzt.length} — dieselbe Zahl wie im Markt${
    (()=>{ const a = jetzt.filter(x=>(x.o&&x.o.klasse)==='aktien').length;
           return a ? `, davon ${a} Aktien` : ''; })()}</span>`:''}</h2>`;
  h += jetzt.length ? jetzt.map(signalKarte).join('')
    : `<div class="alarm"><div class="ah"><span>Gerade kein Einstieg erreicht</span></div>
       <p>Kein Kurs steht in seiner Einstiegszone. Die Kandidaten stehen unten mit dem
       Preis, ab dem eingestiegen wird — dort kannst du eine Limit-Order legen, dann
       brauchst du gar keinen Alarm.</p></div>`;

  if (knapp.length){
    h += `<h2>Auch am Einstieg — aber kein Alarm <span class="mono" style="font-size:12px;color:var(--ink-3)">${knapp.length}</span></h2>
      <div class="note-box warn"><p style="font-size:13px">Der Kurs steht hier ebenfalls
      an der Marke, aber das Setup kommt nicht durchs Alarm-Tor. Auf jeder Karte steht in
      einem Satz, woran es hängt — meist die Note, eine Setup-Art, die in der eigenen
      Bilanz bisher Geld gekostet hat, oder ein Ziel, das nach Gebühren nichts übrig lässt.
      Sie stehen hier vollständig, damit nichts verschwindet — sie klingeln nicht aufs
      Handy, und sie gehören nicht in dieselbe Zeile wie ein echter Alarm.</p></div>`;
    h += knapp.map(signalKarte).join('');
  }

  h += alarmTradesBlock();
  /* Die gemeldeten Trades stehen schon oben in „Deine Alarm-Trades" — hier nicht noch
     einmal. Was hier bleibt, sind laufende Trades der Beobachtungsliste, zu denen es
     keinen Alarm gab: zum Nachsehen, nicht zum Handeln. */
  const imTradeRest = imTrade.filter(x => !x.w.gemeldet);
  if (imTradeRest.length) h += `<h2>Laufende Trades ohne Alarm <span class="mono" style="font-size:12px;color:var(--ink-3)">beobachtet, nicht gemeldet</span></h2>` + imTradeRest.map(signalKarte).join('');

  if (warten.length){
    h += `<h2>Kaufen ab … <span class="mono" style="font-size:12px;color:var(--ink-3)">${warten.length} Kandidaten, nach Note sortiert</span></h2>`;
    h += warten.slice(0,20).map(signalKarte).join('');
  }
  if (!signale.length){
    h += `<p class="leer">Der letzte Scan hat kein handelbares Setup gefunden. Das ist
      ein Ergebnis, kein Ausfall — beim nächsten Durchgang in spätestens 30 Minuten
      sieht es wieder anders aus.</p>`;
  }

  const fertig = ((WL && WL.wachen) || []).filter(w=>!OFFEN.includes(w.zustand));
  const A = D.alarme || [];
  if (fertig.length || A.length){
    h += `<h2>Verlauf</h2>`;
    h += fertig.slice(0,6).map(w=>{
      const d = digits(w.einstieg);
      return `<div class="alarm"><div class="ah"><span>${esc(name(w.instrument))}</span>
        <span class="d">${esc(ZUSTAND_TEXT[w.zustand]||w.zustand)}</span></div>
        <p>Einstieg ${num(w.einstieg,d)} · Stop ${num(w.stop,d)}
        ${(w.erreicht||[]).length?`· erreicht: ${w.erreicht.join(', ')}`:''}
        ${w.bestes_r?`· bestes ${w.bestes_r>0?'+':''}${w.bestes_r}R`:''}</p></div>`;
    }).join('');
    h += A.slice(0,5).map(a=>`<div class="alarm ${a.severity==='CRITICAL'?'hot':''}">
      <div class="ah"><span>${esc(a.title||'')}</span><span class="d">${zeit(a.ts)}</span></div>
      ${a.body?`<p style="white-space:pre-wrap">${esc(a.body)}</p>`:''}</div>`).join('');
  }

  h += alarmRegelnBlock();

  $('alarme').innerHTML = h;
  $('alarme').querySelectorAll('[data-sym]').forEach(el=>
    el.addEventListener('click',()=>waehle(el.dataset.sym)));
  $('alarme').querySelectorAll('[data-kauf]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation(); kaufDialog(b.dataset.kauf, b.dataset.menge, b.dataset.kurs);
  }));
  bindePush();
}


/* ============================================ VERALTETE ANALYSE — SPERRE

   Am 12. September blieb der Lauf um 21:00 Uhr stehen (eine haengende Veroeffentlichung
   hat die ganze Warteschlange blockiert). Die App hat das siebzehn Stunden lang nur in
   grauer Kleinschrift vermerkt: „Scan 12.09., 22:59 (vor 1034 Min.)". Darunter standen
   Einstiege, Stops und Ziele wie immer — scharf, anklickbar, als waeren sie von eben.

   Das ist der gefaehrlichste Zustand, den diese App haben kann. Ein Kurs von gestern
   Abend als Einstiegsmarke ist schlimmer als gar keine Marke: die Zahl sieht aus wie
   Information und ist keine mehr. Ein Stop, der seit siebzehn Stunden nicht nachgezogen
   wurde, liegt irgendwo, nur nicht dort, wo er hingehoert.

   Also: ab zwei Stunden wird gewarnt, ab vier Stunden verschwindet die Handlungsliste.
   Nicht ausgegraut, nicht kleingedruckt — weg. Was weiter funktioniert, steht daneben:
   die Kurse kommen live von der Boerse, das Depot wird damit weiter bewertet, und ein
   Stop, den du selbst gesetzt hast, wird weiter ueberwacht. Nur neue Einstiege gibt es
   nicht, denn die kaemen aus alten Zahlen. */
const SCAN_ALT_MIN = 120;
const SCAN_TOT_MIN = 240;
function scanAlterMin(){ return vorMin(S && S.erzeugt); }
function scanVeraltet(){ const a = scanAlterMin(); return a != null && a >= SCAN_ALT_MIN; }
function scanTot(){ const a = scanAlterMin(); return a != null && a >= SCAN_TOT_MIN; }
function altersText(){
  const a = scanAlterMin();
  if (a == null) return '';
  if (a < 90) return `${a} Min.`;
  const std = Math.floor(a / 60);
  return std >= 24 ? `${Math.floor(std/24)} Tag${Math.floor(std/24)===1?'':'e'} ${std%24} Std.`
                   : `${std} Std. ${a % 60} Min.`;
}
function altersBanner(){
  if (!S || !scanVeraltet()) return '';
  const tot = scanTot();
  return `<div class="${tot ? 'stoerung' : 'note-box warn'}" ${tot?'':'style="margin-bottom:10px"'}>
    ${tot ? `<h3>Die Analyse ist ${altersText()} alt — hier steht nichts zum Handeln</h3>`
          : `<span class="nt">Analyse ${altersText()} alt</span>`}
    <p>Der Scan läuft normalerweise alle zehn Minuten. Er steht seit
    <strong>${zeit(S.erzeugt)}</strong>. Einstiege, Stops und Ziele aus diesem Scan beziehen
    sich auf einen Markt, den es so nicht mehr gibt${tot ? ' — deshalb sind sie ausgeblendet' : ''}.</p>
    ${tot ? `<p><strong>Was trotzdem stimmt:</strong> die Kurse oben und im Depot kommen live
      von der Börse, nicht aus dem Scan. Dein Depot wird damit weiter bewertet, und ein Stop,
      den du selbst gesetzt hast, wird weiter überwacht. Was fehlt, sind neue Einstiege.</p>
      <p><strong>Woran es liegt:</strong> der Lauf bei GitHub hängt. Unter
      <span class="mono">Actions</span> im Repo steht der wartende Lauf; ein Klick auf
      <em>Cancel workflow</em> und danach <em>Run workflow</em> startet ihn neu.</p>`
    : `<p>Wenn das nicht in der nächsten halben Stunde wieder frisch wird, hängt der Lauf.</p>`}
  </div>`;
}

/* ===================================================== ALARME BEI ZUER APP
   Web Push. Der Unterschied zur Browser-Benachrichtigung ist der entscheidende:
   eine Benachrichtigung kann die Seite nur ausloesen, solange sie offen ist. Web
   Push kommt vom Push-Dienst des Browserherstellers an den Service Worker — der
   laeuft auch dann, wenn die App laengst geschlossen ist.

   Der Preis dafuer ist ein einmaliger Handgriff: das Abo dieses Geraets muss der
   CI bekannt sein. Es gibt dafuer keinen Server, also wandert es einmal per
   Kopieren-Einfuegen in ein GitHub-Secret. Danach nie wieder.

   Auf dem iPhone gilt zusaetzlich: Push funktioniert nur, wenn die Seite ueber
   „Zum Home-Bildschirm" installiert wurde. Steht so unten auch drin — daran
   scheitert es sonst, ohne dass irgendeine Fehlermeldung erscheint.
   ===================================================================== */
const VAPID = '__VAPID__';

/* ================================= BEIDE GERAETE, DIESELBE APP

   „Auf meinem Laptop zeigt er mir andere Sachen an als auf meinem Handy. Auch andere
   Alarme. Habe ich da jetzt einen Fehler gemacht, dass ich Bitcoin verkauft habe, weil
   es auf dem Handy stand, aber auf dem Laptop gar nicht?"

   Nein, den Fehler hatte die App. Ein Browser haelt eine einmal geladene Seite fest —
   vom Home-Bildschirm aus oft tagelang. Auf dem einen Geraet lief damit eine Fassung
   mit anderen Regeln als auf dem anderen, und beide zeigten ihre eigenen Alarme. Dass
   daraus ein echter Verkauf wurde, ist der teuerste Ausfall dieses Projekts bisher.

   Die gebaute Seite legt jetzt ihre Kennung daneben (``version.json``). Bei jedem Scan
   vergleicht die App ihre eigene damit. Weichen sie ab, laedt sie sich einmal neu —
   einmal, nicht in einer Schleife. Danach laufen beide Geraete auf demselben Code. */
const BAUKENNUNG = '__BAUKENNUNG__';
let _neuladeVersuch = false;
async function pruefeFassung(){
  try {
    const r = await fetch('version.json?v=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const v = await r.json();
    if (!v || !v.bau || v.bau === BAUKENNUNG) return;
    if (_neuladeVersuch) return;
    _neuladeVersuch = true;
    // Der Service Worker haelt die alte Seite sonst weiter fest.
    try {
      if ('caches' in window) (await caches.keys()).forEach(k => caches.delete(k));
    } catch(e){}
    try { sessionStorage.setItem('desk.neugeladen', v.bau); } catch(e){}
    location.reload();
  } catch(e){}
}

function b64url(buf){
  const b = String.fromCharCode.apply(null, new Uint8Array(buf));
  return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function vapidBytes(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const roh = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(roh, c=>c.charCodeAt(0));
}
function pushMoeglich(){
  return 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
}
function istInstalliert(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function pushBlock(){
  const abo = localStorage.getItem('push_abo') || '';
  const erlaubt = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  if (!pushMoeglich()){
    return `<div class="note-box warn"><span class="nt">Alarme bei geschlossener App</span>
      <p>Dieser Browser kann kein Web Push. Auf dem iPhone geht es ab iOS 16.4 —
      aber nur, wenn die Seite über <em>Teilen → Zum Home-Bildschirm</em> installiert wurde.</p></div>`;
  }
  if (iOS && !istInstalliert()){
    return `<div class="note-box warn"><span class="nt">Ein Schritt fehlt noch</span>
      <p>Damit Alarme auch bei geschlossener App ankommen, muss diese Seite auf dem
      iPhone installiert sein: <strong>Teilen → Zum Home-Bildschirm</strong>. Danach die
      App von dort öffnen und hier weitermachen — vorher lässt iOS Push nicht zu.</p></div>`;
  }
  if (abo){
    return `<div class="note-box"><span class="nt">Alarme bei geschlossener App</span>
      <p>Dieses Gerät ist angemeldet. Wenn trotzdem nichts ankommt, ist das Abo noch
      nicht im Secret <code>PUSH_ABOS</code> hinterlegt —
      <button class="link" id="pushzeig">Abo nochmal anzeigen</button>.</p>
      <div id="pushdaten"></div></div>`;
  }
  return `<div class="note-box warn"><span class="nt">Alarme bei geschlossener App</span>
    <p>Noch nicht eingerichtet. Ein Klick, dann einmal einfügen — danach meldet sich das
    Gerät auch, wenn die App zu ist.</p>
    <p style="margin-top:10px"><button class="btn prim" id="pushan">Alarme aufs Gerät</button>
    ${erlaubt?'':'<span style="margin-left:10px;font-size:12px;color:var(--ink-3)">fragt zuerst nach Erlaubnis</span>'}</p>
    <div id="pushdaten"></div></div>`;
}

async function pushAnmelden(){
  const ziel = $('pushdaten');
  try{
    const rechte = await Notification.requestPermission();
    if (rechte !== 'granted'){
      ziel.innerHTML = `<p style="color:var(--warn);margin-top:10px">Ohne Erlaubnis geht es
        nicht. Die Einstellung lässt sich im Browser wieder ändern.</p>`;
      return;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidBytes(VAPID),
      });
    }
    const j = sub.toJSON();
    const kompakt = JSON.stringify({endpoint: j.endpoint, keys: j.keys});
    localStorage.setItem('push_abo', kompakt);
    pushZeigen(kompakt);
  } catch(e){
    ziel.innerHTML = `<p style="color:var(--bad);margin-top:10px">Hat nicht geklappt: ${esc(String(e))}</p>`;
  }
}

function pushZeigen(kompakt){
  const ziel = $('pushdaten');
  if (!ziel) return;
  ziel.innerHTML = `
    <p style="margin-top:12px">Fertig auf diesem Gerät. Damit die CI weiß, wohin sie senden
    soll, muss dieser eine Text noch ins Repository — einmalig:</p>
    <pre id="pushtext">${esc(kompakt)}</pre>
    <p><button class="btn" id="pushkopie">Kopieren</button>
       <a class="btn" style="text-decoration:none;display:inline-block;margin-left:8px"
          href="https://github.com/ozancanerd-ship-it/cl/settings/secrets/actions/new"
          target="_blank" rel="noopener">Secret anlegen</a></p>
    <ol class="steps" style="margin-top:12px">
      <li>Oben auf <strong>Kopieren</strong> tippen.</li>
      <li><strong>Secret anlegen</strong> öffnen (führt direkt zur richtigen Seite).</li>
      <li>Name: <code>PUSH_ABOS</code> — Wert: einfügen. Speichern.</li>
      <li>Zweites Gerät später: hier nochmal anmelden, beide Texte als JSON-Liste
          <code>[{…},{…}]</code> ins selbe Secret.</li>
    </ol>
    <p style="font-size:11.5px;color:var(--ink-3)">Der Text enthält keine Zugangsdaten —
    nur die Adresse, an die dein Browser Push zustellt. Der geheime Teil (der private
    VAPID-Schlüssel) liegt ausschließlich im Secret <code>VAPID_PRIVATE_KEY</code>.</p>`;
  const kb = $('pushkopie');
  if (kb) kb.addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(kompakt); kb.textContent = 'Kopiert'; }
    catch(e){
      const r = document.createRange(); r.selectNode($('pushtext'));
      window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
      kb.textContent = 'Markiert — jetzt kopieren';
    }
  });
}

function bindePush(){
  const an = $('pushan');
  if (an) an.addEventListener('click', pushAnmelden);
  const zeig = $('pushzeig');
  if (zeig) zeig.addEventListener('click', ()=>pushZeigen(localStorage.getItem('push_abo')||''));
}

const CHAT_MODELL_STD = 'claude-sonnet-4-5-20250929';
let CHAT_VERLAUF = [];

/* Der Lagebericht, den das Modell bei jeder Frage mitbekommt. Bewusst kompakt: die
   vollstaendige Rangliste waere ein Vielfaches an Text und wuerde bei jeder Frage neu
   bezahlt. Zehn Chancen, die laufenden Trades und das Depot reichen, um konkret zu
   antworten. */
function chatLage(){
  const teile = [];
  if (S){
    const st = S.statistik || {};
    teile.push(`Letzter Scan: ${zeit(S.erzeugt)}, ${(S.gesamt||[]).length} Instrumente. ` +
      `A+ ${st.A_PLUS||0}, A ${st.A||0}, A- ${st.A_MINUS||0}, B+ ${st.B_PLUS||0}, B ${st.B||0}, ` +
      `beobachten ${st.WATCH||0}, kein Trade ${st.NO_TRADE||0}.`);
    const top = (S.gesamt||[]).filter(o=>o.handelbar).slice(0,10);
    if (top.length){
      teile.push('BESTE CHANCEN:');
      for (const o of top){
        const pl = o.plan || {};
        const st2 = o.setup || {};
        teile.push(
          `- ${o.instrument} (${o.klasse}) ${o.richtung} ${o.note}` +
          (st2.name?` | Setup: ${st2.name} (${st2.qualitaet})`:'') +
          ` | Kurs ${o.kurs} Einstieg ${o.einstieg} Stop ${pl.stop ?? o.invalidierung}` +
          ` Ziele ${[pl.tp1??o.ziel, pl.tp2??o.tp2, pl.tp3??o.tp3].filter(v=>v!=null).join('/')}` +
          (pl.crv?` | CRV 1:${pl.crv.toFixed(1)} Risiko ${pl.risiko_pct.toFixed(1)}%`:'') +
          (o.rs!=null?` | rel.Staerke ${Math.round(o.rs)}`:'') +
          (st2.these?` | These: ${st2.these}`:'') +
          ((o.warnungen||[]).length?` | Dagegen: ${o.warnungen.slice(0,2).join('; ')}`:''));
      }
    }
    if (S.makro) teile.push(`Makro: ${S.makro.lage||'?'} — ${(S.makro.saetze||[]).join(' ')}`);
  }
  const wachen = ((WL && WL.wachen) || []).filter(w=>w.zustand==='aktiv');
  if (wachen.length){
    teile.push('LAUFENDE TRADES:');
    for (const w of wachen.slice(0,12))
      teile.push(`- ${w.instrument} ${w.richtung} ab ${w.einstieg}, Stop ${w.stop}, ` +
        `erreicht ${(w.erreicht||[]).join(',')||'noch nichts'}, bestes ${w.bestes_r}R`);
  }
  const pos = ladePositionen();
  if (pos.length){
    teile.push('OZANS DEPOT:');
    for (const x of pos) teile.push(`- ${x.sym}: ${x.menge} Stueck zu ${x.einstieg ?? '?'}${x.konto?' ('+x.konto+')':''}`);
  }
  /* Die eigene Bilanz gehoert in jeden Lagebericht, nicht als feste Zahl in den
     Systemtext: eine einbetonierte Zahl veraltet und wird dann zur Luege. */
  if (PF && PF.abgeschlossen){
    const g = (PF.je_regel||{}).ganz || {}, d = (PF.je_regel||{}).drittel || {};
    teile.push(`EIGENE BILANZ (das ist die Wahrheit ueber dieses System, nicht Theorie): ` +
      `${PF.abgeschlossen} abgeschlossene Signale, ${g.summe_r} R alles-oder-nichts, ` +
      `${d.summe_r} R mit Teilverkauf, Trefferquote ${Math.round((g.trefferquote||0)*100)} %, ` +
      `tiefster Rueckgang ${g.max_rueckgang_r} R, ` +
      `${Math.round((PF.nie_im_plus||0)*100)} % der Trades kamen nie ins Plus.`);
    const q = PF.quoten || {};
    const zeilen = Object.keys(q).filter(k=>q[k].n>=10)
      .map(k=>`${k}: ${q[k].n} Faelle, ${Math.round(q[k].tp1*100)} % erreichten TP1, ` +
              `${Math.round(q[k].stop*100)} % Stop, Schnitt ${q[k].schnitt_r} R`);
    if (zeilen.length) teile.push('TREFFERQUOTEN NACH GRUPPE:\n' + zeilen.join('\n'));
  }
  const term = ((S && S.makro && S.makro.termine) || [])
    .map(x=>({...x, ts:Date.parse(x.zeitpunkt)}))
    .filter(x=>x.wirkung==='High' && isFinite(x.ts) && x.ts>Date.now() && x.ts<Date.now()+72*3600*1000)
    .sort((a,b)=>a.ts-b.ts).slice(0,6);
  if (term.length) teile.push('WICHTIGE TERMINE (naechste 3 Tage):\n' + term.map(x =>
    `- ${new Date(x.ts).toISOString().slice(0,16)} ${x.land} ${x.titel}`).join('\n'));
  teile.push(`AUSFUEHRUNG: Krypto ueber Bybit oder Kraken in USDT, Gebuehr rund 0,1 % je Seite. ` +
    `Einzelaktien nur ueber Trade Republic in EURO, 1 Euro pro Ausfuehrung — bei kleinen ` +
    `Positionen frisst das den Gewinn, das gehoert in jede Aktienantwort.` +
    (S && S.eurusd ? ` Aktueller Eurokurs ${S.eurusd} USD je Euro.` : ''));
  return teile.join('\n');
}

Folge (BOS) in Trendrichtung bestaetigt ihn; ein Bruch gegen die Folge (CHoCH) ist der

einer Abwaertsbewegung. Widersprechen sich die Ebenen, gewinnt die groessere.

LIQUIDITAET. Kurse laufen zu den Stellen, an denen Stops liegen — ueber alte Hochs,
unter alte Tiefs, an runde Zahlen. Ein Docht durch ein altes Tief mit sofortiger
Rueckkehr darueber (Sweep) ist das Gegenteil von einem Bruch: dort wurde eingesammelt.
Eine Fair Value Gap ist eine Lueckenzone, die haeufig noch einmal angelaufen wird —
sie ist ein moeglicher Einstiegsbereich, kein Signal fuer sich.

EINSTIEG. Nie bei Beruehrung einer Marke, immer erst mit bestaetigter Kerze: Schluss auf
der richtigen Seite, im starken Teil ihrer Spanne. Der Grund steht in der eigenen
Bilanz: die Haelfte der Verlusttrades kam nie ins Plus — das ist ein Einstiegsproblem,
kein Zielproblem. Wer bei Beruehrung kauft, kauft in jedem Wasserfall mit.
Eine rote Kerze kann eine gueltige Umkehr sein, wenn sie oben schliesst.

EINSTIEG AM AKTUELLEN KURS ist kein Setup. Wenn der Einstieg gleich dem Kurs ist, ist
das nur der Zufall der Uhrzeit. Dann: warten auf eine Marke.

RISIKO. Positionsgroesse = Risikobetrag / Stopabstand, nie nach Bauchgefuehl. 0,5 %
Risiko je Trade bei A+, weniger bei schwaecheren Noten. Bei kleinem Konto begrenzt oft
das Kapital, nicht das Risiko — ein enger Stop erlaubt rechnerisch eine Position, die
man sich gar nicht leisten kann. Mehrere Trades in dieselbe Richtung derselben Klasse
sind ein Trade mit mehrfacher Groesse, nicht Streuung.

ZIELE. In R rechnen, nicht in Euro. Ein Ziel gehoert an eine Stelle, an der real
Liquiditaet liegt, nicht auf ein rundes Vielfaches. CRV unter 1:1,5 ist kein Trade.
Teilverkauf am ersten Ziel und Stop auf Einstand verwandelt genau die Trades, die
kurz im Plus waren und zurueckliefen, von vollen Verlusten in kleine Gewinne.

VOLATILITAET UND KOSTEN. Alles in ATR messen, nicht in Prozent: 2 % sind bei Bitcoin
Rauschen und bei einer Aktie eine Bewegung. Bei Trade Republic kostet jede Ausfuehrung
1 Euro, hin und zurueck also 2 Euro — bei 200 Euro Positionsgroesse und 2 % erwartetem
Gewinn ist der halbe Gewinn weg, bevor irgendetwas passiert ist. Das sagst du dazu.

WAHRSCHEINLICHKEIT. Du kennst die Wahrscheinlichkeit dieses Trades nicht und behauptest
sie nie. Was du hast, sind Haeufigkeiten aus der eigenen Vergangenheit (unten im
Lagebericht). Die nennst du mit der Zahl der Faelle und sagst dazu, dass es
Vergangenheit ist.

NEWS UND MAKRO aendern das Risiko, nicht die Richtung. Vor einer Zinsentscheidung oder
einem Quartalsbericht ist die richtige Antwort meistens kleiner oder gar nicht.

NO TRADE ist ein Ergebnis, kein Versagen. Unklare Struktur, schlechtes CRV, zu weit
gelaufen, Klumpen im Depot, wichtige Nachricht kurz bevor: dann sagst du das.`;

/* ============================================ ANTWORT OHNE SCHLUESSEL

   „Mir ist wirklich am wichtigsten, diesen Chatbot zu haben, wo ich sagen kann:
   soll ich jetzt wirklich rein oder nicht."

   Das ist die Frage, um die es geht — und sie braucht kein Sprachmodell. Alles, was
   fuer die Antwort noetig ist, steht schon auf dieser Seite: die Note, das Setup, die
   Warnungen, der Abstand zum Einstieg, die Trefferquote vergleichbarer Signale, die
   Gebuehren, die Belegung des Depots. Ein Modell wuerde dieselben Zahlen lesen und
   danach schoener formulieren.

   Deshalb antwortet die App auch OHNE API-Schluessel — sofort, kostenlos, immer
   verfuegbar. Der Schluessel macht das Gespraech besser, nicht die Antwort moeglich.
   Was hier steht, ist kein Ersatz fuer Nachdenken und keine Anlageberatung: es ist die
   Zusammenfassung dessen, was das System gerade sieht, in einem Satz statt in zehn
   Kaesten. */

function findeWert(frage){
  const t = (frage||'').toUpperCase();
  const zeilen = (S && S.gesamt) || [];
  // Erst der volle Name (er ist eindeutiger), dann das Kuerzel.
  for (const o of zeilen){
    const n = String(o.name || '').toUpperCase();
    if (n.length >= 3 && t.includes(n)) return o;
  }
  for (const o of zeilen){
    const sym = String(o.instrument || '').toUpperCase();
    const basis = sym.replace(/(EUR|USDT|USDC|USD)$/, '').replace(/-YFD$/, '');
    if (basis.length >= 2 && new RegExp(`\\b${basis}\\b`).test(t)) return o;
  }
  return null;
}

function urteilFuer(o){
  const live = L.get(o.instrument);
  const kurs = live ? live.p : o.kurs;
  const d = digits(kurs || 1);
  const w = o.waehrung === 'EUR' ? ' €' : (o.waehrung === 'USDT' ? ' USDT' : '');
  const e = o.erwartung || {};
  const q = e.quote;
  const zeilen = [];

  const handelbar = !!o.handelbar;
  const einstieg = o.einstieg;
  const abstand = (einstieg && kurs) ? (kurs - einstieg) / einstieg * 100 : null;
  const lang = o.richtung === 'long';
  const erreicht = einstieg && kurs && (lang ? kurs <= einstieg * 1.002 : kurs >= einstieg * 0.998);

  let kopf;
  if (!handelbar){
    kopf = `**Nein — ${esc(name(o.instrument))} ist gerade kein Trade.**`;
    zeilen.push(o.deckel ? `Grund: ${o.deckel}.` : 'Das Setup reicht nicht.');
    if (o.bremse) zeilen.push(o.bremse);
  } else if (erreicht){
    kopf = `**Ja — der Einstieg ist erreicht.** ${esc(name(o.instrument))}, ${lang?'Long':'Short'}, Note ${esc(o.note)}.`;
    zeilen.push(`Einstieg ${num(einstieg,d)}${w}, Stop ${num((o.plan&&o.plan.stop) ?? o.invalidierung, d)}${w}`
      + `, erstes Ziel ${num((o.plan&&o.plan.tp1) ?? o.ziel, d)}${w}.`);
  } else {
    kopf = `**Noch nicht.** ${esc(name(o.instrument))} sieht gut aus, steht aber noch nicht am Einstieg.`;
    zeilen.push(`Gekauft wird ab ${num(einstieg,d)}${w} — das sind noch `
      + `${Math.abs(abstand||0).toFixed(2).replace('.',',')} %. Leg eine Limit-Order dorthin, `
      + 'dann brauchst du keinen Alarm.');
  }

  if (o.setup && o.setup.name) zeilen.push(`Setup: ${o.setup.name} (${o.setup.qualitaet}). ${o.setup.these||''}`);
  if (e.bis_tp1_pct != null) zeilen.push(`Wenn es aufgeht: ${pct(e.bis_tp1_pct,1)} bis zum ersten Ziel`
    + (e.risiko_pct != null ? `, wenn nicht −${e.risiko_pct.toFixed(1).replace('.',',')} % bis zum Stop.` : '.'));
  if (q) zeilen.push(`Vergleichbare Signale trafen bisher ${Math.round(q.tp1*100)} % — aus ${q.n} Fällen, `
    + `im Schnitt ${q.schnitt_r >= 0 ? '+' : ''}${String(q.schnitt_r).replace('.',',')} R. Das ist Vergangenheit, keine Vorhersage.`);
  if ((o.warnungen||[]).length) zeilen.push('Dagegen spricht: ' + o.warnungen.slice(0,3).join(' · '));
  if (o.broker) zeilen.push(`Kaufen bei ${o.broker}.`);

  const offen = ladePositionen().length;
  if (offen >= 4) zeilen.push(`Achtung: du hast schon ${offen} Positionen offen. Jede weitere `
    + 'erhöht das, was gleichzeitig im Feuer steht — im letzten Vorlauf sind an einem Tag elf gleichzeitig ausgestoppt worden.');

  return [kopf, ...zeilen].join('\n\n');
}

function lokaleAntwort(frage){
  const t = (frage||'').toLowerCase();
  if (/warum.*(kein|nicht|nie).*(alarm|signal)|kein(e|en)?\s+(alarm|signal)|nie.*(alarm|signal)/.test(t))
    return warumKeinAlarmText();
  if (/meine\s+(coins|werte|krypto|kryptos)|die gro(ss|ß)en/.test(t)) return meineCoinsText();
  if (/big\s*plan|\bplan\b|momentum/.test(t)) return bigPlanText();
  const o = findeWert(frage);
  if (o) return urteilFuer(o);

  if (/bilanz|ergebnis|wie lief|performance|trefferquote/.test(t)){
    if (!PF || !PF.abgeschlossen) return 'Es ist noch kein Signal abgeschlossen — es gibt noch nichts zu bilanzieren.';
    const g = (PF.je_regel||{}).ganz || {};
    return `Über ${PF.abgeschlossen} abgeschlossene Signale steht das System bei **${g.summe_r} R** `
      + `(${Math.round((g.trefferquote||0)*100)} % Treffer). ${Math.round((PF.nie_im_plus||0)*100)} % der Trades `
      + 'kamen nie ins Plus — das ist ein Einstiegsproblem, kein Zielproblem. Alle Zahlen stehen im Reiter Bilanz.';
  }
  if (/was.*(jetzt|gerade|kaufen|rein)|beste|chance|empfehl/.test(t)){
    const gut = (S?.gesamt||[]).filter(x=>x.handelbar).slice(0,3);
    if (!gut.length) return 'Gerade ist nichts handelbar. Das ist ein Ergebnis, kein Ausfall — '
      + 'die Filter lassen nur durch, was Stop und Ziel im brauchbaren Bereich hat.';
    return 'Das steht gerade oben:\n\n' + gut.map(x =>
      `**${name(x.instrument)}** (${x.klasse}, ${x.richtung==='long'?'Long':'Short'}, Note ${x.note}) — `
      + `Einstieg ${num(x.einstieg, digits(x.einstieg))}, bei ${x.broker||'—'}`).join('\n\n')
      + '\n\nFrag nach einem davon mit Namen, dann bekommst du das ganze Urteil.';
  }
  if (/portfolio|depot|positionen/.test(t)){
    const pos = ladePositionen();
    if (!pos.length) return 'Im Depot steht noch nichts. Trag deine Positionen im Reiter Portfolio ein '
      + 'oder benutz den Knopf „Gekauft — ins Depot" auf einer Signalkarte.';
    return pos.map(p=>{
      const b = bewertePosition(p);
      const schritt = naechsterSchritt(p, planKurs(b), b.w);
      return `**${name(p.sym)}** — ${schritt ? schritt.titel + ': ' + schritt.text : 'kein Ausstiegsplan hinterlegt'}`;
    }).join('\n\n');
  }
  // Begriffe erklaeren. Das ist der haeufigste Teil einer echten Unterhaltung: nicht
  // „kauf oder nicht", sondern „was heisst das eigentlich". Dafuer braucht es kein Modell.
  const LEXIKON = [
    [/\bstop|stoploss|stop-loss/, 'Der **Stop** ist der Kurs, an dem die Idee widerlegt ist — nicht der Kurs, an dem es weh tut. Er gehört hinter den letzten Strukturpunkt, nicht knapp unter den Einstieg. Ohne Stop ist ein Trade keine Position, sondern eine Hoffnung. In deinem eigenen Buch brachten Stops ab 4 % Abstand −0,38 R, die engeren −0,11 R.'],
    [/\bcrv\b|chance.?risiko|risk.?reward|\brr\b/, 'Das **CRV** ist Gewinn geteilt durch Risiko: 1:2 heißt, du riskierst 1 € um 2 € zu verdienen. Unter 1:1,5 lohnt es sich nicht. Aber Vorsicht — ein sehr hohes CRV kommt meistens daher, dass das Ziel weit weg ist, und genau die Trades liefen bei dir am schlechtesten (CRV 3–5: −0,57 R).'],
    [/\br.?multiple|\bwas ist r\b|\bin r\b/, '**R** ist dein Risiko als Maßeinheit. Riskierst du 6 € und gewinnst 12 €, sind das +2 R. Der Vorteil: Bitcoin und eine Aktie werden vergleichbar, egal wie teuer sie sind. Deshalb steht in der Bilanz alles in R und nicht in Euro.'],
    [/\batr\b/, '**ATR** ist die durchschnittliche Tagesspanne — wie weit sich ein Wert normalerweise bewegt. 2 % sind bei Bitcoin Rauschen und bei einer Aktie eine Bewegung. Deshalb wird alles in ATR gemessen und nicht in Prozent.'],
    [/\bbos\b|choch|struktur/, 'Ein Trend ist eine Folge höherer Hochs und Tiefs. **BOS** heißt, diese Folge wird in Trendrichtung bestätigt. **CHoCH** heißt, sie bricht gegen den Trend — der erste Hinweis auf eine Wende, noch nicht die Wende selbst.'],
    [/\bfvg\b|fair value|order block|\bob\b/, 'Eine **Fair Value Gap** ist eine Lücke, die der Kurs oft noch einmal anläuft — ein möglicher Einstiegsbereich, kein Signal für sich. Ein **Order Block** ist die letzte Kerze vor einer starken Bewegung; dort saßen die großen Orders.'],
    [/liquidit|sweep|docht/, '**Liquidität** liegt da, wo die Stops liegen: über alten Hochs, unter alten Tiefs. Ein Docht durch ein altes Tief mit sofortiger Rückkehr darüber ist ein **Sweep** — dort wurde eingesammelt, und das ist das Gegenteil von einem Bruch.'],
    [/wie viel.*(kauf|position|gross)|positionsgr/, 'Die **Positionsgröße** ist Risikobetrag geteilt durch Stopabstand, nie Bauchgefühl. Bei 0,5 % Risiko auf 1.200 € sind das 6 € Risiko; liegt der Stop 2 % entfernt, sind das 300 € Position. Auf jeder Signalkarte steht die Rechnung schon fertig.'],
    [/gebühr|gebuehr|kosten|spread/, 'Bybit nimmt 0,10 % je Seite, Kraken Pro 0,40 % (Limit) bis 0,80 % (Market), die einfache Kraken-App 1–1,5 %. Trade Republic 1 € je Ausführung. Bei 4 % erwartetem Gewinn ist der Unterschied zwischen 0,2 % und 1,6 % Rundlauf der Unterschied zwischen lohnt sich und lohnt sich nicht.'],
    [/no.?trade|nicht handeln|abwarten/, '**Kein Trade ist ein Ergebnis**, kein Versagen. Unklare Struktur, zu weit gelaufen, schlechtes CRV, Klumpen im Depot, wichtiger Termin gleich — dann ist Nichtstun die richtige Arbeit.'],
    [/termin|news|nachricht|fed|zins|cpi/, () => {
      const t = (S && S.makro && S.makro.termine) || [];
      const jetzt = Date.now();
      const naechste = t.map(x=>({...x, ts:Date.parse(x.zeitpunkt)}))
        .filter(x=>x.wirkung==='High' && isFinite(x.ts) && x.ts>jetzt)
        .sort((a,b)=>a.ts-b.ts).slice(0,3);
      if (!naechste.length) return 'In den nächsten Tagen steht nichts Großes an.';
      return 'Die nächsten wichtigen Termine:\n\n' + naechste.map(x =>
        `**${x.titel}** (${x.land}) — ${new Date(x.ts).toLocaleString('de-DE',{weekday:'short',hour:'2-digit',minute:'2-digit'})}`
      ).join('\n') + '\n\nNews gehen nicht in den Score ein. Sie ändern das Risiko, nicht die Richtung — '
        + 'kurz vor so einem Termin macht man nichts Neues auf. Alles steht im Reiter News.';
    }],
    [/verkauf|exit|aussteig|wann raus/, () => {
      const pos = ladePositionen();
      if (!pos.length) return 'Du hast nichts im Depot eingetragen. Sobald eine Position drin ist, '
        + 'sagt die App bei jedem Kurs, was als Nächstes zu tun ist — halten, Teilverkauf oder raus.';
      return pos.map(p => {
        const b = bewertePosition(p);
        const sch = naechsterSchritt(p, planKurs(b), b.w);
        return `**${name(p.sym)}** — ${sch ? sch.titel + ': ' + sch.text : 'kein Ausstiegsplan hinterlegt'}`;
      }).join('\n\n');
    }],
  ];
  for (const [muster, antwort] of LEXIKON){
    if (muster.test(t)) return typeof antwort === 'function' ? antwort() : antwort;
  }

  if (S) return warumKeinAlarmText() + '\n\n---\nFrag gern auch nach einem Wert beim Namen, '
    + 'nach „Big Plan", „Bilanz" oder „mein Depot".';
  return 'Nenn mir einen Wert beim Namen — zum Beispiel „soll ich bei Bitcoin rein?" oder '
    + '„was ist mit NVIDIA?". Dann sage ich dir, was das System gerade dazu sieht: Note, Setup, '
    + 'Einstieg, Stop, Ziele, was dagegen spricht und wie oft so etwas bisher aufging.\n\n'
    + 'Du kannst auch fragen: „was ist gerade gut?", „wie ist die Bilanz?", „wie steht mein Depot?".';
}

/* Was genau ist kaputt? — die Frage, die „funktioniert nicht" beantwortet.

   Ozan hat den Schluessel eingegeben und es passierte nichts Brauchbares. Die App hat
   zwar den rohen Fehlertext gezeigt, aber „HTTP 400 {"type":"error",...}" sagt einem
   Menschen nichts. Und die haeufigste Ursache ist gar kein Fehler im Schluessel: die
   API wird getrennt abgerechnet, ein Pro-Abo enthaelt KEIN Guthaben. Wer das nicht
   weiss, sucht stundenlang am falschen Ende.

   Deshalb: ein Testaufruf mit 1 Token, und jede Antwort in einen Satz uebersetzt, der
   sagt, was zu tun ist. */
function chatFehlerText(status, roh){
  const t = String(roh||'');
  if (/credit balance/i.test(t)) return 'Der Schluessel stimmt, aber das API-Guthaben ist leer. '
    + 'Die API wird getrennt vom Abo abgerechnet — unter console.anthropic.com → Billing aufladen. '
    + 'Schon 5 $ reichen fuer sehr viele Fragen.';
  if (status === 401) return 'Der Schluessel wird nicht akzeptiert. Entweder ist er falsch kopiert, '
    + 'widerrufen, oder es ist gar kein API-Schluessel (er muss mit sk-ant-api03- beginnen und '
    + 'kommt von console.anthropic.com → API keys).';
  if (status === 403) return 'Der Schluessel darf das nicht. Meist eine Einschraenkung im '
    + 'Anthropic-Konto (Workspace oder erlaubte Modelle).';
  if (status === 404) return 'Dieses Modell gibt es fuer deinen Schluessel nicht. '
    + 'Ich versuche es automatisch mit einem anderen.';
  if (status === 429) return 'Zu viele Anfragen in kurzer Zeit. Kurz warten und nochmal.';
  if (status >= 500) return 'Die API hat gerade ein Problem (Serverfehler). Das liegt nicht an dir.';
  if (status === 400) return 'Die Anfrage wurde abgelehnt: ' + t.slice(0,200);
  return `Unerwarteter Fehler (HTTP ${status}): ` + t.slice(0,200);
}

/* Die Modelle, die versucht werden — in dieser Reihenfolge.
   Ein fest verdrahtetes Modell ist eine Zeitbombe: Namen aendern sich, und dann steht
   die App mit einem 404 da, ohne dass jemand weiss, warum. */
const CHAT_MODELLE = ['claude-sonnet-4-5-20250929', 'claude-3-5-haiku-20241022'];

async function chatRuf(key, koerper){
  let letzte = {status: 0, text: ''};
  for (const modell of [chatModell(), ...CHAT_MODELLE.filter(m=>m!==chatModell())]){
    let r;
    try {
      r = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'content-type':'application/json','x-api-key':key,
          'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body: JSON.stringify({...koerper, model: modell}),
      });
    } catch(e){
      return {ok:false, status:0, text:'Keine Verbindung zur API: ' + String(e)
        + ' — Internet, Werbeblocker oder Firewall pruefen.'};
    }
    if (r.ok){
      if (modell !== chatModell()) { try { localStorage.setItem('api_modell', modell); } catch(e){} }
      return {ok:true, status:200, daten: await r.json()};
    }
    const t = await r.text();
    letzte = {status: r.status, text: t};
    if (r.status !== 404) break;   // nur bei „Modell gibt es nicht" weiterprobieren
  }
  return {ok:false, status: letzte.status, text: chatFehlerText(letzte.status, letzte.text)};
}

async function chatPruefen(key){
  const a = await chatRuf(key, {max_tokens: 8, messages:[{role:'user', content:'ok'}]});
  return a.ok ? {ok:true} : {ok:false, text:a.text};
}

    <button class="link" id="chat_key_weg">Schluessel entfernen</button></p>`;
  $('chat').innerHTML = h;
  chatVerdrahten(true);
}

/* Der Chatkasten wird an das angehaengt, was schon im Reiter steht — damit die
   Einrichtung sichtbar bleibt und man trotzdem sofort fragen kann. */
function chatAnhaengen(mitSchluessel){
  const kasten = document.createElement('div');
  kasten.innerHTML = `<div class="chatbox" style="margin-top:16px">
    <div class="chatlauf" id="chatlauf"></div>
    <div class="chateingabe">
      <textarea id="chat_in" rows="2" placeholder="Soll ich bei Bitcoin rein? Was spricht dagegen?"></textarea>
      <button class="btn prim" id="chat_send">Fragen</button>
    </div>
  </div>
  <p style="margin:10px 0 0;font-size:11.5px;color:var(--ink-3)">
    Antwort aus den Daten dieser Seite · <button class="link" id="chat_reset">Verlauf leeren</button></p>`;
  const opt = $('chat').querySelector('details');
  if (opt) $('chat').insertBefore(kasten, opt); else $('chat').appendChild(kasten);
  chatVerdrahten(mitSchluessel);
}

function chatVerdrahten(mitSchluessel){
  chatMalen();
  $('chat_send').addEventListener('click', chatSenden);
  $('chat_in').addEventListener('keydown', e=>{
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) chatSenden();
  });
  const reset = $('chat_reset');
  if (reset) reset.addEventListener('click',()=>{ CHAT_VERLAUF = []; chatMalen(); });
  const weg = $('chat_key_weg');
  if (weg) weg.addEventListener('click',()=>{
    try { localStorage.removeItem('api_key'); } catch(e){}
    zeichneChat();
  });
}

function chatMalen(){
  const el = $('chatlauf'); if (!el) return;
  if (!CHAT_VERLAUF.length){
    el.innerHTML = `<div class="chatleer">
      <p>Ich sehe denselben Stand wie die App: den letzten Scan, die laufenden Trades und
      dein eingetragenes Depot.</p>
      <p style="margin-top:8px">Zum Beispiel:</p>
      <ul class="satzliste" style="margin-top:6px">
        <li>„Soll ich bei der Nummer eins rein oder warten?"</li>
        <li>„Was spricht gegen das Setup?"</li>
        <li>„Ist mein Depot zu einseitig?"</li>
        <li>„Warum kam heute kein Alarm?"</li>
      </ul></div>`;
    return;
  }
  el.innerHTML = CHAT_VERLAUF.map(m=>
    `<div class="msg ${m.role}"><div class="bl">${
      m.role==='user' ? esc(m.content) : chatFormat(m.content)}</div></div>`).join('');
  el.scrollTop = el.scrollHeight;
}

/* Sehr sparsames Markdown: fett, Aufzaehlungen, Absaetze. Eine Bibliothek dafuer zu
   laden waere mehr Gewicht als Nutzen. */
function chatFormat(t){
  return esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^[-*] (.+)$/gm,'• $1')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/\n/g,'<br>')
    .replace(/^/,'<p>').replace(/$/,'</p>');
}

async function chatSenden(){
  const feld = $('chat_in');
  const frage = (feld.value||'').trim();
  if (!frage) return;
  feld.value = '';
  CHAT_VERLAUF.push({role:'user', content:frage});
  CHAT_VERLAUF.push({role:'assistant', content:'…'});
  chatMalen();

  const key = chatSchluessel();

  // Ohne Schluessel — oder wenn die API nicht will — antwortet die App selbst.
  // Das ist der Unterschied zwischen einem Chat, der manchmal geht, und einem, der
  // immer eine Antwort auf „soll ich rein oder nicht" hat.
  if (!key){
    /* Ozan: „ich hätte gern, dass er nicht so fertige Antworten hat, sondern dass man
       wirklich frei mit ihm sprechen kann."

       Frei sprechen KANN er — dafür braucht es den eigenen Schlüssel ein Feld weiter
       unten. Ohne ihn antwortet die App aus ihren eigenen Daten, und zwar nach Mustern:
       sie kann „wie steht Solana" und „was ist gerade gut", aber keine Rückfrage und
       keinen Vergleich. Das gehört an JEDE dieser Antworten drangeschrieben, nicht nur
       in einen Kasten weiter oben, den man einmal liest und dann nie wieder. */
    // Seit 01.10. ohne Werbe-Fusszeile fuer den Schluessel: Ozan hat kein API-Guthaben
    // und will keins — der Chat soll ohne funktionieren, nicht um eins betteln.
    CHAT_VERLAUF[CHAT_VERLAUF.length-1] = {role:'assistant', content: lokaleAntwort(frage)};
    chatMalen();
    return;
  }

  const a = await chatRuf(key, {
    max_tokens: 900,
    system: CHAT_SYSTEM + '\n\nLAGEBERICHT (Stand jetzt):\n' + chatLage(),
    messages: CHAT_VERLAUF.slice(0,-1).map(m=>({role:m.role, content:m.content})),
  });

  if (a.ok){
    const text = (a.daten.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
    CHAT_VERLAUF[CHAT_VERLAUF.length-1] = {role:'assistant', content: text || '(leere Antwort)'};
  } else {
    // Nicht nur den Fehler zeigen — die Frage trotzdem beantworten.
    CHAT_VERLAUF[CHAT_VERLAUF.length-1] = {role:'assistant',
      content: lokaleAntwort(frage) + '\n\n---\n*Das kam ohne die API — sie hat gerade nicht '
        + 'geantwortet: ' + a.text + '*'};
  }
  chatMalen();
}


/* Die eigene Bilanz, ungeschoenter Teil der App.

   Sie steht bewusst vor allem anderen im System-Reiter. Ein Scanner, der jeden Tag
   neue Chancen ausruft und nie zeigt, wie die alten ausgegangen sind, erzeugt
