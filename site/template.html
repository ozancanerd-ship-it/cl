<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Desk</title>
<meta name="description" content="Live AI Trading Desk — Gesamtmarkt-Scan, eingezeichnete Chartanalyse, Portfolio. Paper, kein Echtgeld.">
<meta name="theme-color" content="#05070D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* ===================================================================
   AI TRADING DESK — Oberflaeche
   -------------------------------------------------------------------
   Dunkel als Grundzustand, nicht als Variante. Ein Handelsplatz wird in
   der Regel stundenlang angeschaut; helle Flaechen ermueden dabei, und
   auf Schwarz traegt Farbe Bedeutung: gruen laeuft, rot ist raus, cyan
   ist das System selbst. Alles Uebrige bleibt grau, damit die drei
   Farben etwas heissen.

   Aufbau: Tiefe entsteht durch Ebenen (Grundflaeche, Glasplatte,
   Leuchtkante), nicht durch Schatten. Zahlen stehen immer in Mono mit
   Tabellenziffern, damit Kurse untereinander stehen und nicht springen.
   =================================================================== */
:root{
  color-scheme:dark;
  /* Grundflaechen */
  --bg:#05070D;
  --bg-2:#080C15;
  --glass:rgba(255,255,255,.035);
  --glass-2:rgba(255,255,255,.06);
  --sunk:rgba(0,0,0,.32);
  /* Linien */
  --rule:rgba(125,180,255,.11);
  --rule-strong:rgba(125,180,255,.22);
  /* Schrift */
  --ink:#E8F0FF;
  --ink-2:#9FB2CE;
  --ink-3:#63748F;
  /* Bedeutungstraeger */
  --accent:#3DF0D0;
  --accent-2:#4C8DFF;
  --accent-soft:rgba(61,240,208,.10);
  --long:#2BE8A5;  --long-bg:rgba(43,232,165,.11);
  --bad:#FF5C7A;   --bad-bg:rgba(255,92,122,.11);
  --warn:#FFB648;  --warn-bg:rgba(255,182,72,.11);
  --flat:#63748F;  --flat-bg:rgba(99,116,143,.13);
  /* Chart */
  --grid:rgba(125,180,255,.07);
  --wick:#5A6C88;
  --surface:var(--glass);
  --surface-2:var(--glass-2);
  --paper:var(--bg);
  --radius:14px;
  /* Tiefe. Drei gestaffelte Schatten statt eines harten: der erste setzt die Kante ab,
     der zweite gibt Hoehe, der dritte legt das Element in den Raum. Ein einzelner
     Schatten sieht immer aufgeklebt aus. */
  --tiefe:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 26px rgba(0,0,0,.44), 0 2px 6px rgba(0,0,0,.30);
  --tiefe-hoch:0 1px 0 rgba(255,255,255,.07) inset, 0 18px 48px rgba(0,0,0,.52), 0 4px 12px rgba(0,0,0,.34);
}
/* Helle Variante — bewusst schlicht gehalten. Wer sie waehlt, will lesen,
   nicht bewundern. */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F5FA; --bg-2:#E9EEF7;
  --glass:#FFFFFF; --glass-2:#F4F7FC; --sunk:#E4EAF3;
  --rule:#DBE3EF; --rule-strong:#BFCBDD;
  --ink:#0D1526; --ink-2:#42536E; --ink-3:#76859C;
  --accent:#0E9E86; --accent-2:#2563EB; --accent-soft:rgba(14,158,134,.10);
  --long:#0E9E62; --long-bg:rgba(14,158,98,.10);
  --bad:#D0344F; --bad-bg:rgba(208,52,79,.10);
  --warn:#B57A0B; --warn-bg:rgba(181,122,11,.12);
  --flat:#76859C; --flat-bg:rgba(118,133,156,.12);
  --grid:rgba(20,40,80,.07); --wick:#8A99AE;
  --tiefe:0 1px 0 rgba(255,255,255,.8) inset, 0 6px 18px rgba(20,40,80,.10), 0 1px 3px rgba(20,40,80,.08);
  --tiefe-hoch:0 1px 0 rgba(255,255,255,.9) inset, 0 14px 34px rgba(20,40,80,.14), 0 3px 8px rgba(20,40,80,.10);
  --surface:var(--glass); --surface-2:var(--glass-2); --paper:var(--bg);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background:var(--bg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
  /* Zwei weiche Lichtquellen oben und ein feines Raster darunter. Das Raster
     ist so schwach, dass man es nicht sieht — man merkt nur, dass die
     Flaeche nicht tot ist. */
  background-image:
    radial-gradient(1100px 460px at 12% -10%, rgba(76,141,255,.16), transparent 62%),
    radial-gradient(900px 420px at 92% -6%, rgba(61,240,208,.11), transparent 60%),
    linear-gradient(rgba(125,180,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,180,255,.028) 1px, transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;
  background-attachment:fixed;
}
:root[data-theme="light"] body{background-image:
  radial-gradient(1000px 420px at 12% -10%, rgba(37,99,235,.10), transparent 62%),
  radial-gradient(800px 380px at 92% -6%, rgba(14,158,134,.08), transparent 60%)}
img{max-width:100%}
.wrap{max-width:900px; margin:0 auto; padding:0 18px 110px}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"ss01" 1}

/* ---------- Kopf ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, rgba(5,7,13,.94), rgba(5,7,13,.80));
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid var(--rule);
}
:root[data-theme="light"] header{background:linear-gradient(180deg,rgba(242,245,250,.96),rgba(242,245,250,.86))}
/* Die Leuchtkante unter dem Kopf. Ein Pixel, aber sie macht den Unterschied
   zwischen „Seite" und „Geraet". */
header::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);
  opacity:.55}
.hd{max-width:900px; margin:0 auto; padding:16px 18px 0}
.crumb{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-3); display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.crumb>span:first-child{color:var(--ink-2); font-weight:600;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
h1{font-family:"Space Grotesk",Inter,sans-serif; font-weight:600; font-size:29px;
  line-height:1.05; letter-spacing:-.03em; margin:8px 0 0}
h2{font-family:"Space Grotesk",Inter,sans-serif; font-weight:600; font-size:15px;
  letter-spacing:.02em; margin:30px 0 11px; color:var(--ink);
  display:flex; align-items:center; gap:10px}
/* Die Linie hinter jeder Ueberschrift laeuft bis zum Rand — Konsolen-Anmutung
   ohne dass es laut wird. */
h2::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--rule),transparent)}
h3{font-size:13px; font-weight:600; margin:18px 0 8px; letter-spacing:.01em; color:var(--ink)}
.stamp{font-size:12px; color:var(--ink-3); margin-top:5px; font-family:"JetBrains Mono",monospace}
.chip{display:inline-flex; align-items:center; gap:5px; font-family:"JetBrains Mono",monospace;
  font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  padding:4px 9px; border-radius:100px; border:1px solid transparent}
.chip.paper{background:var(--warn-bg); color:var(--warn); border-color:rgba(255,182,72,.28)}
.chip.live{background:var(--long-bg); color:var(--long); border-color:rgba(43,232,165,.30)}
.chip.tot{background:var(--flat-bg); color:var(--flat); border-color:var(--rule)}
.dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--long);
  box-shadow:0 0 0 3px rgba(43,232,165,.18); vertical-align:middle}
.dot.aus{background:var(--flat); box-shadow:none}
.puls{animation:puls 2.4s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.puls,.scan,.glowline{animation:none!important}}

/* ---------- Reiter ---------- */
.tabs{display:flex; gap:4px; margin-top:16px; overflow-x:auto; scrollbar-width:none;
  padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:0; position:relative;
  font:inherit; font-size:13px; font-weight:500; color:var(--ink-3);
  padding:10px 13px 12px; cursor:pointer; white-space:nowrap; letter-spacing:.01em;
  transition:color .16s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink); font-weight:600}
.tab[aria-selected="true"]::after{content:""; position:absolute; left:11px; right:11px; bottom:0;
  height:2px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:0 0 12px rgba(61,240,208,.55)}
.panel{padding-top:20px; animation:auf .28s cubic-bezier(.2,.7,.3,1)}
@keyframes auf{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.lead{font-size:13.5px; color:var(--ink-2); margin:0 0 16px}

/* ---------- Statuskacheln ---------- */
.status{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px}
.status div{
  position:relative; overflow:hidden; padding:13px 14px 14px;
  background:linear-gradient(165deg, var(--glass-2), var(--glass));
  border:1px solid var(--rule); border-radius:var(--radius);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--tiefe);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
}
.status div:hover{transform:translateY(-2px); box-shadow:var(--tiefe-hoch)}
.status div::before{content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,var(--rule-strong),transparent)}
.status .k{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:6px}
.status .v{font-family:"Space Grotesk",Inter,sans-serif; font-size:25px; line-height:1;
  font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.status .v.gut{color:var(--long); text-shadow:0 0 22px rgba(43,232,165,.35)}
.status .v.mittel{color:var(--warn)} .status .v.aus{color:var(--ink-3)}
@media (max-width:640px){.status{grid-template-columns:repeat(2,1fr); gap:8px}}

/* ---------- Filterknoepfe ---------- */
.filter{display:flex; gap:7px; flex-wrap:wrap; margin:18px 0 6px}
.fb{appearance:none; border:1px solid var(--rule); background:var(--glass);
  color:var(--ink-2); font:inherit; font-size:11.5px; font-weight:500; padding:6px 13px;
  border-radius:100px; cursor:pointer; transition:all .16s; letter-spacing:.01em}
.fb:hover{border-color:var(--rule-strong); color:var(--ink)}
.fb[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent; color:#03121A; font-weight:600;
  box-shadow:0 3px 18px rgba(61,240,208,.28)}

/* ---------- Chancen-Zeilen ---------- */
.opp{
  position:relative; background:var(--glass); border:1px solid var(--rule);
  border-radius:var(--radius); margin-bottom:9px; cursor:pointer; overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.7,.3,1), border-color .16s, background .16s;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.opp{box-shadow:var(--tiefe)}
.opp:hover{transform:translateY(-2px); border-color:var(--rule-strong);
  background:var(--glass-2); box-shadow:var(--tiefe-hoch)}
.opp:active{transform:translateY(0)}
/* Der Farbstreifen links ist die Note. Er ist das Erste, was auffaellt, und
   das Einzige, was aus der Entfernung lesbar sein muss. */
.opp::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--rule-strong)}
.opp.n-A_PLUS::before{background:linear-gradient(180deg,var(--accent),var(--long));
  box-shadow:0 0 20px rgba(43,232,165,.55)}
.opp.n-A::before{background:var(--long); box-shadow:0 0 14px rgba(43,232,165,.35)}
.opp.n-A_MINUS::before{background:var(--accent)}
.opp.n-B_PLUS::before{background:var(--accent-2)}
.opp.n-B::before{background:var(--warn)}
.opp.n-WATCH::before{background:var(--flat)}
.opp.n-A_PLUS{border-color:rgba(43,232,165,.30)}
.opp-h{display:flex; align-items:baseline; gap:9px; padding:13px 15px 7px 17px; flex-wrap:wrap}
.opp-h .rk{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-3); min-width:22px}
.opp-h .nm{font-weight:650; font-size:15.5px; letter-spacing:-.01em;
  font-family:"Space Grotesk",Inter,sans-serif}
.opp-h .kl{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}
.opp-h .dir{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.12em;
  font-weight:600; padding:3px 7px; border-radius:5px}
.opp-h .dir.long{background:var(--long-bg); color:var(--long)}
.opp-h .dir.short{background:var(--bad-bg); color:var(--bad)}
.opp-h .note{font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700;
  padding:3px 8px; border-radius:5px; background:var(--flat-bg); color:var(--ink-2);
  border:1px solid var(--rule)}
.opp-h .note.gut{background:var(--long-bg); color:var(--long); border-color:rgba(43,232,165,.32)}
.opp-h .note.mittel{background:var(--accent-soft); color:var(--accent); border-color:rgba(61,240,208,.28)}
.opp-h .sc{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:17px;
  font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.opp-b{padding:0 15px 13px 17px; font-size:12.5px; color:var(--ink-2)}
.kpi{display:flex; gap:7px; flex-wrap:wrap; font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-2); margin-top:8px}
/* Jede Kennzahl in einer eigenen Kapsel — nebeneinander gesetzte Zahlen ohne
   Rahmen verschwimmen auf dem Handy zu einer Zeile Zahlensalat. */
.kpi>span{background:var(--sunk); border:1px solid var(--rule); border-radius:7px;
  padding:3px 8px; white-space:nowrap}
.kpi b{color:var(--ink); font-weight:600}
.kpi .up{color:var(--long)} .kpi .dn{color:var(--bad)}
.warnz{margin-top:8px; font-size:11.5px; color:var(--warn); line-height:1.45;
  border-left:2px solid rgba(255,182,72,.35); padding-left:9px}
.muz{margin-top:7px; font-size:11.5px; color:var(--ink-3)}
.fak{display:grid; grid-template-columns:8.5em 3.6em 1fr; gap:5px 9px; align-items:center;
  font-size:11.5px; color:var(--ink-3); margin-top:5px}
.fak .fn{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase}
.fak .fb2{height:4px; background:var(--sunk); border-radius:3px; overflow:hidden}
.fak .fb2 i{display:block; height:100%; border-radius:3px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.fak .fd{color:var(--ink-2)}

/* ---------- Setup-Karte: der Teil, der die Handelsidee benennt ---------- */
.setup{margin-top:10px; border:1px solid var(--rule); border-radius:10px; overflow:hidden;
  background:var(--sunk)}
.setup .sh{display:flex; align-items:center; gap:8px; padding:9px 12px;
  border-bottom:1px solid var(--rule); font-family:"Space Grotesk",Inter,sans-serif;
  font-weight:600; font-size:13px}
.setup .sq{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:9px;
  letter-spacing:.14em; text-transform:uppercase; padding:3px 7px; border-radius:5px}
.setup .sq.sauber{background:var(--long-bg); color:var(--long)}
.setup .sq.brauchbar{background:var(--accent-soft); color:var(--accent)}
.setup .sq.unsauber{background:var(--warn-bg); color:var(--warn)}
.setup .sb{padding:10px 12px 12px; font-size:12.5px; color:var(--ink-2)}
.setup ul{margin:8px 0 0; padding:0; list-style:none}
.setup li{position:relative; padding-left:19px; margin-bottom:5px; line-height:1.45}
.setup li::before{position:absolute; left:0; top:0; font-family:"JetBrains Mono",monospace;
  font-size:11px}
.setup li.ja::before{content:"✓"; color:var(--long)}
.setup li.nein::before{content:"○"; color:var(--warn)}
.setup .trig{margin-top:10px; padding:8px 10px; border-radius:8px;
  background:var(--accent-soft); border:1px solid rgba(61,240,208,.22);
  color:var(--ink); font-size:12px}
.setup .trig b{color:var(--accent); font-family:"JetBrains Mono",monospace;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase; display:block; margin-bottom:3px}

/* ---------- Handelsplan als Ablauf ---------- */
.steps{list-style:none; margin:8px 0 0; padding:0; counter-reset:s}
.steps li{position:relative; counter-increment:s; padding:0 0 15px 32px; font-size:13px;
  color:var(--ink-2); line-height:1.5}
.steps li::before{content:counter(s); position:absolute; left:0; top:0;
  width:21px; height:21px; border-radius:50%; display:grid; place-items:center;
  font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600;
  background:var(--accent-soft); color:var(--accent); border:1px solid rgba(61,240,208,.3)}
/* Die Verbindungslinie macht aus fuenf Saetzen einen Ablauf. */
.steps li::after{content:""; position:absolute; left:10px; top:24px; bottom:2px; width:1px;
  background:linear-gradient(180deg,var(--rule-strong),transparent)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.exits{list-style:none; margin:8px 0 0; padding:0}
.exits li{position:relative; padding-left:19px; margin-bottom:7px; font-size:12.5px;
  color:var(--ink-2); line-height:1.45}
.exits li::before{content:"→"; position:absolute; left:0; color:var(--bad);
  font-family:"JetBrains Mono",monospace}

/* ---------- Chart ---------- */
.chartbox{background:var(--glass); border:1px solid var(--rule); border-radius:var(--radius);
  overflow:hidden; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--tiefe)}
.chart-h{display:flex; align-items:center; gap:10px; padding:12px 14px;
  border-bottom:1px solid var(--rule); flex-wrap:wrap}
.chart-h .nm{font-weight:650; font-size:16.5px; font-family:"Space Grotesk",Inter,sans-serif;
  letter-spacing:-.01em}
.chart-h .px{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:18px; font-weight:600}
.chart-h .px.up{color:var(--long)} .chart-h .px.dn{color:var(--bad)}
.tfbar{display:flex; gap:3px; padding:8px 11px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.tfb{appearance:none; border:0; background:none; font:inherit; font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-3); padding:5px 11px; border-radius:7px; cursor:pointer;
  transition:all .14s; letter-spacing:.06em}
.tfb:hover{color:var(--ink-2); background:var(--sunk)}
.tfb[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(61,240,208,.25)}
.layers{display:flex; gap:5px; padding:7px 11px 9px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.lb{appearance:none; border:1px solid var(--rule); background:transparent; font:inherit;
  font-size:10.5px; color:var(--ink-3); padding:4px 9px; border-radius:100px; cursor:pointer;
  transition:all .14s}
.lb:hover{color:var(--ink-2); border-color:var(--rule-strong)}
.lb[aria-pressed="true"]{background:var(--glass-2); color:var(--ink); border-color:var(--rule-strong)}
#cv{display:block; width:100%; height:500px; touch-action:none; cursor:crosshair}
@media (max-width:640px){#cv{height:400px}}
.legende{display:flex; gap:13px; flex-wrap:wrap; padding:9px 14px; border-top:1px solid var(--rule);
  font-size:10px; color:var(--ink-3); font-family:"JetBrains Mono",monospace; letter-spacing:.06em}
.legende span{display:flex; align-items:center; gap:5px}
.legende i{width:12px; height:3px; border-radius:2px; display:inline-block}
.readout{padding:9px 14px; border-top:1px solid var(--rule); font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-2); min-height:32px; background:var(--sunk)}

/* ---------- Tabellen und Karten ---------- */
.mtf{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px}
.mtf th{text-align:left; font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:8px 10px;
  border-bottom:1px solid var(--rule-strong)}
.mtf td{padding:9px 10px; border-bottom:1px solid var(--rule); vertical-align:top; color:var(--ink-2)}

  <p>Nichts wird automatisch ausgeführt. Kein Echtgeld. Die Kurse laufen live von der

     eigenem Zeitstempel da, damit man es nicht verwechselt.</p>

<script id="payload" type="application/json">__DATA__</script>
<script>
'use strict';
/* =====================================================================
   AI TRADING DESK — Client
   Zwei Datenquellen, bewusst getrennt gehalten:
     D    der eingebettete Plan (TSMOM-Regel, Portfolio, Alarme) — Stand des Baus
     S    scan.json, zur Laufzeit geholt — der Gesamtmarkt-Scan
     L    Live-Kurse per Websocket von der Börse — jetzt
   Was live ist, ist mit einem Punkt markiert. Was aus dem Scan stammt, trägt dessen
   Zeitstempel. Eine Seite, die alles gleich aussehen lässt, verleitet dazu, einen
   Stand von vor einer Stunde für den aktuellen Kurs zu halten.
   ===================================================================== */
const D = JSON.parse(document.getElementById('payload').textContent);
const P = D.plan;
let S = null;                 // scan.json
let WL = null;                // watchlist.json — die beobachteten Setups
let AKTIV = null;             // gewähltes Instrument (Detailobjekt)
let AKTIV_TF = 'H4';
const DETAIL = new Map();     // Instrument -> Detaildaten
const L = new Map();          // Instrument -> {p, pct, t}
let WS = null, WS_OK = false, WS_TRY = 0;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function digits(v){ v = Math.abs(v||0);
  return v >= 1000 ? 2 : v >= 10 ? 2 : v >= 1 ? 4 : v >= 0.01 ? 5 : 8; }
function num(v, d){ if (v == null || !isFinite(v)) return '—';
  return Number(v).toLocaleString('de-DE',
    {minimumFractionDigits: d ?? digits(v), maximumFractionDigits: d ?? digits(v)}); }
function pct(v, k){ if (v == null || !isFinite(v)) return '—';
  return (v>0?'+':'') + Number(v).toFixed(k ?? 2).replace('.',',') + ' %'; }
function zeit(iso){ if (!iso) return '—';
  try { return new Date(iso).toLocaleString('de-DE',
    {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return '—'; } }
function vorMin(iso){ if (!iso) return null;
  const t = Date.parse(iso); return isFinite(t) ? Math.round((Date.now()-t)/60000) : null; }
/* Voller Name statt Kuerzel.
   Ozan hat es so gesagt: "schreib auch die Aktien Kryptos vollstaendig auf, nicht die
   Abkuerzungen. Ich muss jedes Mal suchen." Der Scanner liefert den Namen jetzt in der
   Zeile mit; NAMEN faengt die Werte ab, die vor dieser Aenderung gebaut wurden. */
const NAMEN = {};
function merkeNamen(rows){ for (const o of (rows||[])) if (o && o.instrument && o.name) NAMEN[o.instrument] = o.name; }
function name(sym){ return NAMEN[sym] || (D.names && D.names[sym]) || sym; }
function kuerzel(sym){ return String(sym||'').replace(/-YFD$/,'').replace(/USDT$/,''); }

let PF = null;
const NOTE_KLASSE = {'A+':'gut','A':'gut','A−':'mittel','B+':'mittel','B':'','WATCH':'','—':''};

/* ---- Euro, Broker, Gebuehr -------------------------------------------------
   Ozan handelt Einzelaktien ueber Trade Republic — dort stehen sie in Euro, und
   jede Ausfuehrung kostet 1 €. Ein Signal mit Dollarkursen ist fuer ihn nicht
   ausfuehrbar, und bei einer Position von 300 € frisst die Gebuehr hin und zurueck
   ein Drittel eines Zwei-Prozent-Gewinns. Beides gehoert neben das Signal. */
function istAktie(o){ return (o && o.klasse) === 'aktien'; }
function eurWert(o, feld){ return (o && o.eur && o.eur[feld] != null) ? o.eur[feld] : null; }
/* Waehrungszeichen aus der Zeile, nicht geraten.
   Seit Krypto ueber Kraken in EURO gescannt wird, sind die Rohzahlen bei Krypto und
   Gold schon Euro — bei Aktien bleiben sie Dollar, und nur dort wird umgerechnet.
   Eine Zahl ohne Waehrung ist bei einem Kaufsignal keine Kleinigkeit. */
/* Das Zeichen gehoert zur ZAHL, nicht zum Wunsch.
   Eine Aktie notiert in Dollar und wird in Euro gekauft — steht der Eurokurs nicht zur
   Verfuegung, ist die Zahl daneben eine Dollarzahl und bekommt ein Dollarzeichen. */
function zeichen(o){
  const w = (o && o.waehrung) || '';
  if (w === 'EUR') return ' €';
  if (w === 'USDT') return ' USDT';
  return ' $';
}
/* Welche Zahl gross dasteht, entscheidet die AUSFUEHRUNG, nicht der Geschmack.
   Aktien laufen ueber Trade Republic und dort gibt es nur Euro — also Euro.
   Krypto kauft Ozan im Dollarmarkt, weil der tiefer ist — also Dollar, mit dem
   Euro-Gegenwert einmal pro Karte daneben. Eine Zahl in der falschen Waehrung ist bei
   einer Order kein Schoenheitsfehler. */
function preis(o, feld, fallback, d){
  if (istAktie(o)){
    const e = eurWert(o, feld);
    if (e != null) return `${num(e,d)} €`;
  }
  return num(fallback, d) + zeichen(o);
}
/* Der Euro-Gegenwert als eine Zeile, nicht an jeder Zahl. */
function eurHinweis(o){
  if (!o || istAktie(o)) return '';
  const e = eurWert(o, 'kurs');
  if (e == null || !o.eurusd) return '';
  const d = digits(e);
  return `<span style="color:var(--ink-3)">≈ ${num(e,d)} € bei ${num(o.eurusd,4)} $/€</span>`;
}
function gebuehrSatz(o, positionswert){
  if (!positionswert || positionswert <= 0) return '';
  const gewinnPct = o && o.erwartete_bewegung_pct;
  if (!gewinnPct || gewinnPct <= 0) return '';
  const kosten = istAktie(o) ? 2 : positionswert * 0.002;
  const gewinn = positionswert * gewinnPct / 100;
  const anteil = kosten / gewinn;
  const txt = `Gebühr hin und zurück ${kosten.toFixed(2).replace('.',',')} ${istAktie(o)?'€':'USDT'}`;
  return anteil >= 0.2
    ? `<span style="color:var(--warn)">${txt} — ${Math.round(anteil*100)} % des erwarteten Gewinns. Entweder größer einsteigen oder lassen.</span>`
    : `${txt} (${Math.round(anteil*100)} % des erwarteten Gewinns).`;
}

/* ---------------------------------------------------------------- Tabs */
const TABS = [...document.querySelectorAll('.tab')];
const TITEL = ['Markt','Chart','Analyse','Portfolio','Sync','Plan','Alarme','News','Bilanz','Chat','System'];
function zeigeTab(i){
  TABS.forEach((t,k)=>{
    t.setAttribute('aria-selected', k===i ? 'true':'false');
    $('p'+k).hidden = k!==i;
  });
  $('kopf').textContent = (i===1||i===2) && AKTIV ? AKTIV.instrument : TITEL[i];
  if (i===1) requestAnimationFrame(()=>chart.groesse());
  if (i===4) zeichneSync();
  if (i===9) zeichneChat();

}

/* Ein Teil darf ausfallen, nicht die Seite.

   Was hier abgefangen wird, ist immer ein Programmierfehler — kein erwarteter Zustand.
   Deshalb wird er nicht verschluckt: er landet in der Konsole UND sichtbar in dem
   Bereich, der nicht gezeichnet werden konnte. Eine App, die stumm haengenbleibt, ist
   schlimmer als eine, die zugibt, dass etwas kaputt ist. */
const AUSFALL = [];
function sicher(name, fn){
  try { fn(); return true; }
  catch(e){
    AUSFALL.push(name + ': ' + (e && e.message ? e.message : e));
    console.error('[Aufbau] ' + name, e);
    const ziel = {Rangliste:'radar', Bilanz:'bilanz', Alarme:'alarme', System:'system'}[name];
    const el = ziel && document.getElementById(ziel);
    if (el) el.innerHTML = `<div class="note-box bad"><span class="nt">${esc(name)} nicht aufgebaut</span>
      <p>${esc(String(e && e.message || e))}</p><p>Das ist ein Fehler in der App, nicht im Markt.
      Die anderen Bereiche laufen weiter.</p></div>`;
    return false;
  }
}

/* ------------------------------------------------------- Scan laden */
async function ladeScan(){
  try {
    const r = await fetch('scan.json?v=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S = await r.json();
  } catch(e){
    S = null;
    $('radar').innerHTML = `<div class="note-box bad"><span class="nt">Scan nicht ladbar</span>
      <p>${esc(e.message)}. Es wird bewusst keine alte Rangliste gezeigt — ein veralteter
      Scan wäre schlimmer als keiner.</p></div>`;
    return;
  }
  try {
    const rw = await fetch('watchlist.json?v=' + Date.now(), {cache:'no-store'});
    WL = rw.ok ? await rw.json() : null;
  } catch(e){ WL = null; }
  try {
    const rp = await fetch('performance.json?v=' + Date.now(), {cache:'no-store'});
    PF = rp.ok ? await rp.json() : null;
  } catch(e){ PF = null; }
  sicher('Namen', ()=>merkeNamen(S && S.gesamt));
  /* Jeder Teil fuer sich. Vorher standen die Aufrufe in einer Zeile hintereinander —
     ein Fehler im ersten hat alle folgenden mitgenommen, und die App blieb bei
     "Scan wird geladen …" stehen, ohne dass irgendwo etwas davon stand. Genau das ist
     passiert. Jetzt faellt hoechstens ein Kasten aus, und er sagt es. */
  sicher('Status', zeichneStatus);
  sicher('Filter', zeichneFilter);
  sicher('Rangliste', zeichneRadar);
  sicher('System', zeichneSystem);
  sicher('News', zeichneNews);
  sicher('Bilanz', zeichneBilanz);
  sicher('Alarme', zeichneAlarme);
  /* Das Depot MUSS hier nochmal gezeichnet werden. Beim Start laeuft zeichnePortfolio()
     bevor der Scan da ist — dann steht bei jeder Position „keine Bewertung" und, viel
     schlimmer, ueber der Handlungsliste „Nichts zu tun". Eine Entwarnung, die nur
     bedeutet, dass die Daten noch unterwegs sind, ist die gefaehrlichste Falschaussage,
     die diese App machen kann. */
  sicher('Depot', zeichnePortfolio);
  pruefeFassung();
  const start = (S.gesamt||[]).find(o=>o.handelbar) || (S.gesamt||[])[0];
  if (start && !AKTIV) waehle(start.instrument, false);
  starteLive();
}

async function ladeDetail(sym){
  if (DETAIL.has(sym)) return DETAIL.get(sym);
  try {
    const r = await fetch('asset/' + encodeURIComponent(sym) + '.json?v=' + (S?.erzeugt||''),
      {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    DETAIL.set(sym, d);
    return d;
  } catch(e){ DETAIL.set(sym, null); return null; }
}

async function waehle(sym, wechseln = true){
  const d = await ladeDetail(sym);
  AKTIV = d || {instrument: sym, zeichnung:{}, mtf:[], muster:[], kommentar:null,
                chance: (S?.gesamt||[]).find(o=>o.instrument===sym) || null};
  const ebenen = Object.keys(AKTIV.zeichnung||{});
  if (!ebenen.includes(AKTIV_TF)) AKTIV_TF = ebenen.includes('H4') ? 'H4' : (ebenen[0]||'H4');
  zeichneChartAnsicht(); zeichneAnalyse(); abonniere(sym);
  if (wechseln) zeigeTab(1);
  $('kopf').textContent = sym;
}

/* Die Börse liefert die Kurse direkt an den Browser. Kein eigener Server, keine
   Zwischenspeicherung, kein Schlüssel — es ist der öffentliche Marktdaten-Stream.
   Aktien haben kein frei zugängliches Live-Feed mit CORS; sie bleiben auf dem Stand
   des Scans und werden auch so beschriftet. */
function kryptoSymbole(){
  if (!S) return [];
  const aus = [];
  // GROSS, nicht klein: Kraken meldet die Symbole gross zurueck, und der Livespeicher
  // wird an anderer Stelle mit dem Instrumentnamen aus dem Scan abgefragt.
  for (const o of (S.gesamt||[])) if (o.klasse === 'krypto' || o.klasse === 'gold')
    aus.push(String(o.instrument).toUpperCase());
  return aus.slice(0, 180);
}
function setzeLiveChip(an, text){
  const el = $('livechip');
  el.className = 'chip ' + (an ? 'live' : 'tot');
  el.innerHTML = `<span class="dot ${an?'puls':'aus'}"></span>${esc(text)}`;
}
function starteLive(){
  const syms = kryptoSymbole();
  KRYPTO_NAMEN_LIVE = new Set(syms);
  if (!syms.length) { setzeLiveChip(false,'keine Krypto-Werte'); return; }
  if (WS) { try{ WS.close(); }catch(e){} }
  setzeLiveChip(false,'verbinde …');
  /* Kraken statt Binance.
     Der Livestream muss dieselbe Boerse sein wie die Analyse, sonst zeigt die Karte
     einen Kurs, zu dem hier niemand kaufen kann — und bei EUR-Paaren waere der
     Unterschied nicht nur Rauschen, sondern der ganze Wechselkurs.
     Kraken verlangt anders als Binance ein Abonnement je Symbol, in der Schreibweise
     "BTC/EUR". */
  let url;
  try { url = 'wss://ws.kraken.com/v2'; WS = new WebSocket(url); }
  catch(e){ setzeLiveChip(false,'kein Livestream'); return; }
  WS.onopen = ()=>{
    WS_OK = true; WS_TRY = 0; setzeLiveChip(true,'live');
    const paare = syms.slice(0,90).map(krakenPaar).filter(Boolean);
    if (paare.length) try {
      WS.send(JSON.stringify({method:'subscribe', params:{channel:'ticker', symbol:paare}}));
    } catch(e){}
  };
  WS.onerror = ()=>{ if(!WS_OK) setzeLiveChip(false,'Stream blockiert'); };
  WS.onclose = ()=>{
    WS_OK = false; setzeLiveChip(false,'getrennt');
    if (WS_TRY++ < 6) setTimeout(starteLive, Math.min(30000, 2000 * Math.pow(2, WS_TRY)));
  };
  WS.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (!m || m.channel !== 'ticker' || !Array.isArray(m.data)) return;
    let neu = false;
    for (const t of m.data){
      const sym = ausKrakenPaar(t.symbol);
      const p = parseFloat(t.last);
      if (!sym || !isFinite(p)) continue;
      const pct = (t.change_pct != null && isFinite(parseFloat(t.change_pct)))
        ? parseFloat(t.change_pct) : null;
      L.set(sym, {p, pct, t: Date.now()});
      neu = true;
    }
    if (neu) planeAuffrischen();
  };
}

/* "BTCUSD" <-> "BTC/USD". Kraken v2 spricht bereits BTC und nicht mehr XBT.
   Seit der Scan den Dollarmarkt bevorzugt, muessen beide Endungen erkannt werden —
   sonst liefe der Livestream leer, waehrend die Karten Dollarpreise zeigen. */
function krakenPaar(sym){
  const s = String(sym||'').toUpperCase();
  for (const q of ['USDT','USDC','USD','EUR']){
    if (s.endsWith(q) && s.length > q.length){
      // Kraken kennt kein USDT-Paar fuer die meisten Coins — dort dann USD.
      const ziel = (q === 'USDT' || q === 'USDC') ? 'USD' : q;
      return `${s.slice(0, -q.length)}/${ziel}`;
    }
  }
  return null;
}
function ausKrakenPaar(paar){
  const s = String(paar||'').toUpperCase();
  if (!s.includes('/')) return null;
  const flach = s.replace('/','');
  // Zurueck auf den Namen, den der Scan benutzt: ein USDT-Paar aus dem Scan wird als
  // USD-Paar abonniert und muss hier wieder seinen Scan-Namen bekommen.
  if (KRYPTO_NAMEN_LIVE.has(flach)) return flach;
  const basis = flach.slice(0, -3);
  for (const q of ['USDT','USDC','EUR']){
    if (KRYPTO_NAMEN_LIVE.has(basis + q)) return basis + q;
  }
  return flach;
}
/* Welche Instrumentnamen der Scan kennt — fuer die Rueckuebersetzung oben. */
let KRYPTO_NAMEN_LIVE = new Set();
let _alarmZuletzt = 0;
let _auf = 0;
function planeAuffrischen(){
  if (_auf) return;
  _auf = setTimeout(()=>{ _auf = 0; frischeAuf(); }, 900);
}
let _marktZuletzt = 0;

  aktualisiereRadarKurse();

    _alarmZuletzt = Date.now();

  }
  // Laeuft IMMER, nicht nur wenn der Depot-Reiter offen ist. Ein Verkaufssignal, das
  // man nur sieht, wenn man ohnehin gerade hinschaut, ist kein Signal.
  pruefeDepotAlarme();
  pruefeAktionsAlarme();
  pruefeUrteilWechsel();
  pruefeTerminAlarme();
  pruefeStillstand();
}

/* ============================== ALARM FUER DIE HANDLUNG IM DEPOT

   „Ich will auch Alarme bekommen, wenn er sagt verkauf das aus meinem Depot oder geh
   mehr rein."

   Das ist etwas anderes als die Alarme darunter. Die melden feste Marken: Stop gerissen,
   Ziel erreicht. Hier meldet sich die EINSCHAETZUNG, sobald sie eine Handlung verlangt —
   ein Wert, der zum Schlusslicht seiner Klasse geworden ist, ein Klumpen, der zu gross
   geworden ist, ein Wert, der stark ist und gerade ein Setup hat.

   Drei Regeln gegen Laerm, weil Ozan zu Recht empfindlich darauf ist:
     * „Halten" meldet sich nie. Nichtstun ist keine Nachricht.
     * Jede Handlung meldet sich einmal je Wert, und der Schluessel enthaelt die Art —
       aus Beobachten wird Verkaufen, das ist eine neue Nachricht; zweimal dasselbe
       nicht. Die Sperre liegt auf der Platte und ueberlebt jeden Neustart.
     * Aus einem toten Scan kommt gar nichts. Eine Handlungsaufforderung auf Basis von
       Zahlen von gestern Abend ist schlimmer als keine. */
function pruefeAktionsAlarme(){
  if (!S || scanTot()) return;
  const stand = depotStand();
  if (!stand || !stand.bew.length) return;
  for (const b of stand.bew){
    let a;
    try { a = positionsAktion(b, stand); } catch(e){ continue; }
    if (!a || a.art === 'halten') continue;
    // Stop und Ziel meldet bereits pruefeDepotAlarme — nicht zweimal fuer dieselbe Sache.
    if (a.art === 'raus' || (a.art === 'teilverkauf' && /erreicht/.test(a.titel))) continue;
    const key = 'aktion:' + b.pos.sym + ':' + a.art;
    if (gemeldetLaden()[key]) continue;
    gemeldetMerken(key);
    try {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') continue;
      const wieviel = (a.menge != null)
        ? `${a.art==='nachlegen'?'Kaufen':'Verkaufen'}: ${num(a.menge, a.menge<1?4:2)} ≈ ${num(a.euro,0)} €. `
        : '';
      new Notification(`${AKTION_WORT[a.art]} · ${posName(b)}`,
        {body: wieviel + a.titel, tag: key});
    } catch(e){}
  }
}

/* ================================================ STILLSTAND — ALARM

   Der Lauf stand am 12. September siebzehn Stunden still, und gemerkt hat es Ozan
   selbst — beim Draufschauen. Das ist der falsche Weg herum: ein System, das sich nur
   meldet, wenn es etwas gefunden hat, ist von einem System, das kaputt ist, nicht zu
   unterscheiden. Beide sind still.

   Also meldet sich jetzt auch das Schweigen. Einmal je Stillstand, nicht laufend — und
   erst ab vier Stunden, damit ein verspaeteter Lauf nicht gleich Alarm ausloest. */
let _stillstandGemeldet = false;
function pruefeStillstand(){
  if (!S) return;
  if (!scanTot()){ _stillstandGemeldet = false; return; }
  if (_stillstandGemeldet) return;
  const key = 'stillstand:' + String(S.erzeugt || '');
  if (gemeldetLaden()[key]) { _stillstandGemeldet = true; return; }
  gemeldetMerken(key);
  _stillstandGemeldet = true;
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    new Notification('Die Analyse steht — seit ' + altersText(), {
      body: 'Der Scan läuft normalerweise alle zehn Minuten. Solange er steht, zeigt die '
          + 'App keine Einstiege mehr an. Dein Depot wird mit Live-Kursen weiter bewertet.',
      tag: key});
  } catch(e){}
}

/* =========================================== VERKAUFEN — ALARM FUERS DEPOT

   „Wenn ich bei meinem Portfolio was verkaufen soll, will ich auch direkt einen Alarm."

   Genau das. Der Scanner meldet Einstiege; was danach passiert, stand bisher nur im
   Depot-Reiter und nur, wenn man ihn aufmacht. Hier wird bei jedem Kurs geprueft, ob
   eine EIGENE Position ihren Stop oder ein Ziel erreicht hat — und dann meldet es sich.

   Die Sperre liegt auf der Platte, nicht im Arbeitsspeicher: sonst meldet die App
   dieselbe Sache bei jedem Neustart wieder. Und es meldet sich NUR, was zu tun ist —
   „halten" ist kein Alarm. */
function pruefeDepotAlarme(){
  let pos;
  try { pos = ladePositionen(); } catch(e){ return; }
  if (!pos.length) return;
  for (const p of pos){
    let b;
    try { b = bewertePosition(p); } catch(e){ continue; }
    const schritt = naechsterSchritt(p, b.kurs);
    if (!schritt || (schritt.stufe !== 'stop' && schritt.stufe !== 'ziel')) continue;
    const key = 'verkauf:' + p.sym + ':' + (schritt.marke || 'stop');
    if (gemeldetLaden()[key]) continue;
    gemeldetMerken(key);
    try {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') continue;
      new Notification(`VERKAUFEN · ${name(p.sym)}`, {body: schritt.titel + ' — ' + schritt.text, tag: key});
    } catch(e){}
  }
}

/* ==================================== URTEILSWECHSEL IM DEPOT — ALARM

   „Das Portfolio soll auch immer neu bewertet werden."

   Der Ausstiegsplan oben meldet sich, wenn eine feste Marke erreicht ist — Stop, Ziel.
   Aber die haeufigere Art, wie eine Position schlecht wird, ist leiser: die Struktur
   traegt nicht mehr, der Score faellt, und das steht nur im Depot-Reiter, wenn man ihn
   aufmacht. Genau solche Positionen liegen dann wochenlang herum.

   Hier wird deshalb das URTEIL selbst beobachtet. Gemeldet wird nur die Verschlechterung
   in eine Stufe, die eine Entscheidung verlangt — und jede Stufe nur einmal, bis sie
   sich wieder aendert. Eine Aufwertung meldet sich nicht: „es laeuft weiter gut" ist
   keine Nachricht, sondern Laerm. */
const URTEIL_KEY = 'desk.urteil.v1';
const URTEIL_MELDEN = new Set(['REDUZIEREN', 'GEGEN DIE THESE', 'BEOBACHTEN']);
const URTEIL_DRINGEND = new Set(['REDUZIEREN', 'GEGEN DIE THESE']);
function urteilStandLaden(){
  try { return JSON.parse(localStorage.getItem(URTEIL_KEY) || '{}') || {}; } catch(e){ return {}; }
}
function pruefeUrteilWechsel(){
  let pos;
  try { pos = ladePositionen(); } catch(e){ return; }
  if (!pos.length || !S) return;
  const stand = urteilStandLaden();
  let geaendert = false;
  for (const p of pos){
    let b;
    try { b = bewertePosition(p); } catch(e){ continue; }
    if (!b.urteil || b.urteil === 'UNBEKANNT') continue;
    const vorher = stand[p.sym];
    if (vorher === b.urteil) continue;
    stand[p.sym] = b.urteil;
    geaendert = true;
    // Beim allerersten Lauf ist nichts gespeichert — dann nur merken, nicht melden.
    // Sonst bekommt Ozan beim ersten Oeffnen eine Meldung fuer jede Position.
    if (vorher === undefined) continue;
    if (!URTEIL_MELDEN.has(b.urteil)) continue;
    const key = 'urteil:' + p.sym + ':' + b.urteil;
    if (gemeldetLaden()[key]) continue;
    gemeldetMerken(key);
    try {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') continue;
      const rat = positionsRat(b);
      new Notification(
        (URTEIL_DRINGEND.has(b.urteil) ? 'PRÜFEN · ' : 'Beobachten · ') + name(p.sym)
          + ' → ' + b.urteil,
        {body: (rat.saetze||[])[0] || ('Neue Einschätzung: ' + b.urteil), tag: key});
    } catch(e){}
  }
  if (geaendert){ try { localStorage.setItem(URTEIL_KEY, JSON.stringify(stand)); } catch(e){} }
}

/* ============================================ WICHTIGE TERMINE — ALARM

   Eine Zinsentscheidung oder ein Arbeitsmarktbericht bewegt den ganzen Markt, und zwar
   in Minuten. Das ist der zweite Fall, in dem eine Meldung wirklich etwas aendert:
   nicht „kauf jetzt", sondern „in einer Stunde ist Fed — heute nichts Neues aufmachen".

   Gemeldet wird nur, was wirklich schwer wiegt (Wirkung High) und nur einmal je Termin. */
function pruefeTerminAlarme(){
  const termine = (S && S.makro && S.makro.termine) || [];
  if (!termine.length) return;
  const jetzt = Date.now();
  for (const t of termine){
    if (t.wirkung !== 'High') continue;
    const ts = Date.parse(t.zeitpunkt);
    if (!isFinite(ts)) continue;
    const min = (ts - jetzt) / 60000;
    if (min < 0 || min > 60) continue;
    const key = 'termin:' + t.titel + ':' + t.zeitpunkt;
    if (gemeldetLaden()[key]) continue;
    gemeldetMerken(key);
    try {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') continue;
      new Notification(`In ${Math.round(min)} Min: ${t.titel} (${t.land})`, {
        body: 'Wichtiger Termin. Bis er durch ist, nichts Neues aufmachen — und bei '
            + 'laufenden Positionen den Stop im Blick behalten.', tag: key});
    } catch(e){}
  }
}
function abonniere(sym){ /* miniTicker liefert alle Symbole; nichts zu tun. */ }
function livePreis(sym){ const e = L.get(sym); return e ? e.p : null; }

/* ================================================================
   CHART — eigener Renderer auf Canvas.
   Warum keine Bibliothek: die Analyse besteht zum grössten Teil aus Zonen, Levels,
   Strukturbrüchen und Beschriftungen. Jede fertige Chart-Bibliothek müsste dafür
   erweitert werden, und die Erweiterung wäre grösser als der Renderer selbst.
   Ausserdem lädt die Seite so nichts nach.
   ================================================================ */
const chart = (()=>{
  let cv = null, ctx = null, B = [], Z = null, C = null;
  let i0 = 0, anz = 120, hoverX = null, hoverY = null;
  let ziehen = null, letzterPreis = null;
  const EBENEN = {swings:true, brueche:true, liq:true, zonen:true, pd:false, ziele:true, rsi:true};
  const M = {l: 6, r: 62, t: 10, b: 22};
  /* Höhe des RSI-Streifens unter den Kerzen. 0 = aus. Der RSI teilt sich die
     Zeitachse mit dem Chart — sonst vergleicht man zwei verschiedene Ausschnitte. */
  let RSI_H = 62;

  function farbe(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

  function setze(kerzen, zeichnungTf, chance){
    B = (kerzen||[]).map(k=>({t:k[0], o:k[1], h:k[2], l:k[3], c:k[4], v:k[5]}));
    Z = zeichnungTf || null; C = chance || null;
    // 90 Kerzen als Startbild. Mehr sieht auf dem Handy nach Strichcode aus, und bei
    // H4 deckt das schon zwei Wochen ab — genug für einen Swing, ohne dass die
    // Preisachse so weit wird, dass man die Struktur nicht mehr liest.
    anz = Math.min(90, Math.max(40, B.length));
    i0 = Math.max(0, B.length - anz);
    letzterPreis = B.length ? B[B.length-1].c : null;
    zeichne();
  }
  function setzeLivePreis(p){
    if (!B.length || !isFinite(p)) return;
    const last = B[B.length-1];
    last.c = p; if (p > last.h) last.h = p; if (p < last.l) last.l = p;
    letzterPreis = p; zeichne();
  }
  function ebene(k, an){ EBENEN[k] = an; zeichne(); }
  function ebenen(){ return EBENEN; }

  function groesse(){
    cv = $('cv'); if (!cv) return;
    ctx = cv.getContext('2d');
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    zeichne();
  }

  function sicht(){
    const a = Math.max(0, Math.min(i0, Math.max(0, B.length-5)));
    return B.slice(a, a + anz);
  }
  /* Preisspanne der Ansicht.
     Wichtig ist die Reihenfolge: Der erlaubte Rahmen wird EINMAL aus den Kerzen
     bestimmt und danach nicht mehr verändert. Vorher wurde er in der Schleife
     mitgezogen — dann hat jedes akzeptierte Level den Rahmen für das nächste
     geweitet, und ein paar entfernte Liquiditätsmarken haben die Kerzen zu einem
     Streifen in der Mitte zusammengedrückt. Was ausserhalb liegt, wird nicht
     weggelassen, sondern als Marke am Rand gezeigt. */
  let ausserhalb = [];
  function spanne(v){
    let khi = -Infinity, klo = Infinity;
    for (const b of v){ if (b.h > khi) khi = b.h; if (b.l < klo) klo = b.l; }
    if (!isFinite(khi) || !isFinite(klo) || khi === klo){
      khi = (khi||1) * 1.01; klo = (klo||1) * 0.99;
    }
    const kspanne = khi - klo;
    const maxHi = khi + kspanne * 0.55, minLo = klo - kspanne * 0.55;
    let hi = khi, lo = klo;
    ausserhalb = [];
    const kandidaten = [];
    if (EBENEN.ziele && C){
      for (const [lab, k] of [['Kurs','kurs'],['TP1','ziel'],['TP2','tp2'],['TP3','tp3'],['Stop','invalidierung']])
        if (C[k] != null) kandidaten.push([lab, C[k]]);
    }
    if (EBENEN.liq && Z) for (const x of (Z.liquiditaet||[])) kandidaten.push([null, x.p]);
    for (const [lab, p] of kandidaten){
      if (!isFinite(p)) continue;
      if (p > maxHi || p < minLo){ if (lab) ausserhalb.push([lab, p, p > maxHi]); continue; }
      if (p > hi) hi = p;
      if (p < lo) lo = p;
    }
    const luft = (hi - lo) * 0.06;
    return {hi: hi + luft, lo: lo - luft};
  }

  function zeichne(){
    if (!cv || !ctx) { cv = $('cv'); if (!cv) return; ctx = cv.getContext('2d'); }
    const r = cv.getBoundingClientRect(), W = r.width, H = r.height;
    ctx.clearRect(0,0,W,H);
    const v = sicht(); if (!v.length) return;
    const {hi, lo} = spanne(v);
    const rsiAn = EBENEN.rsi && Z && (Z.rsi||[]).length;
    const rsiH = rsiAn ? RSI_H : 0;
    const px = W - M.l - M.r, py = H - M.t - M.b - rsiH;
    const X = i => M.l + (i + 0.5) * (px / v.length);
    const Y = p => M.t + (hi - p) / (hi - lo) * py;
    const bw = Math.max(1.2, Math.min(11, px / v.length * 0.68));

    const cRule = farbe('--grid'), cInk = farbe('--ink'), cInk3 = farbe('--ink-3');
    const cLong = farbe('--long'), cBad = farbe('--bad'), cWick = farbe('--wick');
    const cAcc = farbe('--accent'), cWarn = farbe('--warn'), cSurf = farbe('--surface');

    // Raster + Preisachse
    ctx.font = '10px "JetBrains Mono",monospace'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = cRule; ctx.lineWidth = 1;
    const stufen = 5, d = digits((hi+lo)/2);
    for (let k=0;k<=stufen;k++){
      const p = lo + (hi-lo)*k/stufen, y = Math.round(Y(p)) + 0.5;
      ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(W-M.r, y); ctx.stroke();
      ctx.fillStyle = cInk3; ctx.textAlign = 'left';
      ctx.fillText(num(p, d), W-M.r+5, y);
    }

    // Zonen (hinter den Kerzen)
    if (EBENEN.zonen && Z) for (const z of (Z.zonen||[])){
      const y1 = Y(z.bis), y2 = Y(z.von);
      if (y2 < M.t-40 || y1 > H-M.b+40) continue;
      const lang = z.richtung === 'bullish' || z.richtung === 'long';
      ctx.fillStyle = (lang ? cLong : cBad) + '1f';
      ctx.fillRect(M.l, Math.min(y1,y2), px, Math.max(1.5, Math.abs(y2-y1)));
      ctx.fillStyle = cInk3; ctx.font = '9px "JetBrains Mono",monospace'; ctx.textAlign = 'left';
      if (Math.abs(y2-y1) > 9) ctx.fillText(z.art, M.l+3, Math.min(y1,y2)+6);
    }

    // Premium / Discount
    if (EBENEN.pd && Z && Z.pd){
      const yh = Y(Z.pd.hoch), ym = Y(Z.pd.mitte), yl = Y(Z.pd.tief);
      ctx.strokeStyle = cAcc + '77'; ctx.setLineDash([2,3]); ctx.lineWidth = 1;
      for (const y of [yh, ym, yl]){ ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.fillStyle = cAcc; ctx.font = '9px "JetBrains Mono",monospace'; ctx.textAlign = 'left';
      ctx.fillText('EQ', M.l+2, ym-6);
    }

    // Liquidität
    if (EBENEN.liq && Z) for (const x of (Z.liquiditaet||[])){
      const y = Y(x.p); if (y < M.t-20 || y > H-M.b+20) continue;
      const weg = x.zustand === 'swept';
      ctx.strokeStyle = weg ? cInk3 + '55' : cWarn + 'aa';
      ctx.setLineDash(weg ? [1,4] : [5,4]);
      ctx.lineWidth = Math.min(2, 0.7 + (x.staerke||0)*1.6);
      ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Kerzen
    for (let i=0;i<v.length;i++){
      const b = v[i], x = X(i), auf = b.c >= b.o;
      ctx.strokeStyle = cWick; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5, Y(b.h)); ctx.lineTo(Math.round(x)+0.5, Y(b.l)); ctx.stroke();
      ctx.fillStyle = auf ? cLong : cBad;
      const yo = Y(b.o), yc = Y(b.c);
      ctx.fillRect(x - bw/2, Math.min(yo,yc), bw, Math.max(1.2, Math.abs(yc-yo)));
    }

    // Swings
    if (EBENEN.swings && Z){
      const idx = new Map(v.map((b,i)=>[b.t, i]));
      ctx.font = '9px "JetBrains Mono",monospace';
      for (const s of (Z.swings||[])){
        const i = idx.get(s.t); if (i == null) continue;
        const x = X(i), y = Y(s.p);
        ctx.fillStyle = s.hoch ? cBad : cLong;
        ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 6.2832); ctx.fill();
        if (s.label && s.label !== 'NONE'){
          ctx.textAlign = 'center'; ctx.fillStyle = cInk3;
          ctx.fillText(s.label, x, y + (s.hoch ? -9 : 12));
        }
      }
    }

    // Strukturbrüche
    if (EBENEN.brueche && Z){
      const idx = new Map(v.map((b,i)=>[b.t, i]));
      ctx.font = '9px "JetBrains Mono",monospace';
      for (const br of (Z.brueche||[])){
        const i = idx.get(br.t);
        const y = Y(br.p);
        if (y < M.t-20 || y > H-M.b+20) continue;
        const lang = br.richtung === 'bullish';
        ctx.strokeStyle = (lang ? cLong : cBad) + 'cc'; ctx.setLineDash([6,3]); ctx.lineWidth = 1.4;
        const x0 = i == null ? M.l : X(i);
        ctx.beginPath(); ctx.moveTo(Math.max(M.l, x0-40), y); ctx.lineTo(W-M.r, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = lang ? cLong : cBad; ctx.textAlign = 'left';
        ctx.fillText(br.art, Math.max(M.l+2, x0-38), y-4);
      }
    }

    // Entry / Stop / Ziele
    if (EBENEN.ziele && C){
      const linien = [
        ['Kurs', C.kurs, cInk],
        ['TP1', C.ziel, cLong], ['TP2', C.tp2, cLong], ['TP3', C.tp3, cLong],
        ['Stop', C.invalidierung, cBad],
      ];
      ctx.font = '9.5px "JetBrains Mono",monospace';
      for (const [lab, p, col] of linien){
        if (p == null || !isFinite(p)) continue;
        const y = Y(p); if (y < M.t-14 || y > H-M.b+14) continue;
        ctx.strokeStyle = col; ctx.lineWidth = lab==='Kurs' ? 1 : 1.6;
        ctx.setLineDash(lab==='Kurs' ? [1,3] : []);
        ctx.beginPath(); ctx.moveTo(M.l,y); ctx.lineTo(W-M.r,y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = col; ctx.textAlign = 'left';
        ctx.fillText(lab, M.l+3, y-4);
      }
    }

    // Was ausserhalb der Ansicht liegt, als Marke am Rand — statt es zu verschweigen
    // oder dafür die Kerzen platt zu drücken.
    if (ausserhalb.length){
      ctx.font = '9.5px "JetBrains Mono",monospace'; ctx.textAlign = 'right';
      let obenN = 0, untenN = 0;
      for (const [lab, p, oben] of ausserhalb){
        const y = oben ? M.t + 10 + (obenN++)*13 : H - M.b - 8 - (untenN++)*13;
        ctx.fillStyle = lab === 'Stop' ? cBad : cLong;
        ctx.fillText(`${lab} ${num(p, d)} ${oben?'↑':'↓'}`, W - M.r - 6, y);
      }
    }

    // Letzter Kurs als Marke an der Achse
    if (letzterPreis != null){
      const y = Y(letzterPreis);
      if (y > M.t && y < H-M.b){
        ctx.fillStyle = cAcc; ctx.fillRect(W-M.r, y-8, M.r, 16);
        ctx.fillStyle = cSurf; ctx.font = '10px "JetBrains Mono",monospace';
        ctx.textAlign = 'left'; ctx.fillText(num(letzterPreis, d), W-M.r+4, y);
      }
    }

    // RSI-Streifen unter den Kerzen
    if (rsiAn){
      const alle = Z.rsi || [];
      // Die RSI-Reihe ist so lang wie die gezeigten Kerzen; dasselbe Fenster ausschneiden.
      const off = Math.max(0, B.length - alle.length);
      const von = Math.max(0, i0 - off);
      const werte = alle.slice(von, von + v.length);
      const yTop = M.t + py + 10, yH = rsiH - 14;
      const RY = r => yTop + (100 - r) / 100 * yH;
      ctx.strokeStyle = cRule; ctx.lineWidth = 1;
      for (const lvl of [30, 50, 70]){
        const y = Math.round(RY(lvl)) + 0.5;
        ctx.setLineDash(lvl === 50 ? [1,3] : [3,3]);
        ctx.beginPath(); ctx.moveTo(M.l, y); ctx.lineTo(W-M.r, y); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle = cInk3; ctx.font = '9px "JetBrains Mono",monospace'; ctx.textAlign = 'left';
      ctx.fillText('70', W-M.r+5, RY(70)); ctx.fillText('30', W-M.r+5, RY(30));
      ctx.strokeStyle = cAcc; ctx.lineWidth = 1.4; ctx.beginPath();
      let begonnen = false;
      for (let i=0;i<werte.length;i++){
        const r = werte[i];
        if (r == null){ begonnen = false; continue; }
        const x = X(i), y = RY(r);
        if (!begonnen){ ctx.moveTo(x,y); begonnen = true; } else ctx.lineTo(x,y);
      }
      ctx.stroke();
      const letzterR = werte.filter(r=>r!=null).slice(-1)[0];
      if (letzterR != null){
        ctx.fillStyle = letzterR >= 70 ? cBad : letzterR <= 30 ? cLong : cInk3;
        ctx.textAlign = 'left'; ctx.font = '10px "JetBrains Mono",monospace';
        ctx.fillText(`RSI ${letzterR.toFixed(0)}`, M.l+3, yTop - 1);
      }
    }

    // Zeitachse
    ctx.fillStyle = cInk3; ctx.font = '9.5px "JetBrains Mono",monospace'; ctx.textAlign = 'center';
    const schritt = Math.max(1, Math.floor(v.length/5));
    for (let i=0;i<v.length;i+=schritt){
      const t = v[i].t ? new Date(v[i].t) : null; if (!t) continue;
      ctx.fillText(t.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}), X(i), H-M.b+11);
    }

    // Fadenkreuz
    if (hoverX != null && hoverX > M.l && hoverX < W-M.r){
      const i = Math.max(0, Math.min(v.length-1, Math.floor((hoverX-M.l)/(px/v.length))));
      ctx.strokeStyle = cInk3 + '66'; ctx.setLineDash([2,3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(i), M.t); ctx.lineTo(X(i), H-M.b); ctx.stroke();
      if (hoverY != null){ ctx.beginPath(); ctx.moveTo(M.l,hoverY); ctx.lineTo(W-M.r,hoverY); ctx.stroke(); }
      ctx.setLineDash([]);
      const b = v[i], el = $('readout');
      if (el){
        const p = hoverY != null ? hi - (hoverY-M.t)/py*(hi-lo) : null;
        el.textContent =
          `${b.t ? new Date(b.t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}` +
          `   O ${num(b.o,d)}  H ${num(b.h,d)}  L ${num(b.l,d)}  C ${num(b.c,d)}` +
          (p != null ? `   ·   Cursor ${num(p,d)}` : '');
      }
    }
  }

  let globalGebunden = false;
  function binde(){
    cv = $('cv'); if (!cv) return;
    groesse();
    cv.addEventListener('wheel', e=>{
      e.preventDefault();
      const alt = anz;
      anz = Math.round(Math.max(25, Math.min(B.length || 400, anz * (e.deltaY > 0 ? 1.15 : 0.87))));
      i0 = Math.max(0, Math.min(B.length - anz, i0 + Math.round((alt - anz)/2)));
      zeichne();
    }, {passive:false});
    const runter = e=>{ ziehen = {x: (e.touches?e.touches[0]:e).clientX, i0}; };
    const bewegen = e=>{
      const t = e.touches ? e.touches[0] : e;
      const r = cv.getBoundingClientRect();
      hoverX = t.clientX - r.left; hoverY = t.clientY - r.top;
      if (ziehen){
        const px = r.width - M.l - M.r;
        const dx = t.clientX - ziehen.x;
        i0 = Math.max(0, Math.min(Math.max(0,B.length - anz),
             ziehen.i0 - Math.round(dx / (px / anz))));
      }
      zeichne();
    };
    const hoch = ()=>{ ziehen = null; };
    cv.addEventListener('pointerdown', runter);
    cv.addEventListener('pointermove', bewegen);
    // Nur einmal aufs Fenster hängen: die Chart-Ansicht wird bei jedem Wechsel des
    // Instruments oder der Zeitebene neu gebaut, und sonst sammeln sich die Handler.
    if (!globalGebunden){ window.addEventListener('pointerup', ()=>{ ziehen = null; }); globalGebunden = true; }
    cv.addEventListener('pointerleave', ()=>{ hoverX = hoverY = null; zeichne(); });
    cv.addEventListener('touchstart', runter, {passive:true});
    cv.addEventListener('touchmove', bewegen, {passive:true});
    cv.addEventListener('touchend', hoch);
  }
  window.addEventListener('resize', ()=>groesse());
  return {setze, setzeLivePreis, zeichne, groesse, binde, ebene, ebenen};
})();

/* ============================================================ MARKT / RADAR */

/* ================================================ DEPOT AUF DER STARTSEITE

   „Das Portfolio soll auch immer neu bewertet werden."

   Die Bewertung lief schon immer bei jedem Kurs — sie stand nur im Depot-Reiter, und
   den macht man auf, wenn man ohnehin schon nachdenkt. Die erste Frage beim Oeffnen ist
   aber nicht „was koennte ich kaufen", sondern „was ist mit dem Geld, das schon drin
   liegt". Also steht das Depot jetzt ueber der besten Chance, nicht hinter ihr.

   Eine Zeile, vier Zahlen, ein Klick ins Detail. Kein zweites Depot — dieselbe
   Bewertung, nur frueher sichtbar. */
function depotZeile(){
  let pos;
  try { pos = ladePositionen(); } catch(e){ return ''; }
  if (!pos.length) return '';
  let bew;
  try { bew = pos.map(bewertePosition); } catch(e){ return ''; }
  const kursEU = (S && S.eurusd) || null;
  const euro = (b, v) => v == null ? null : (b.w === 'EUR' || !kursEU ? v : v / kursEU);
  const wert = bew.reduce((s,b)=>s + (euro(b,b.wert)||0), 0);
  const einstand = bew.reduce((s,b)=>s + (euro(b,b.einstand)||0), 0);
  const gv = bew.reduce((s,b)=>s + (euro(b,b.gv)||0), 0);
  const zaehl = (...u) => bew.filter(b=>u.includes(b.urteil)).length;
  const halten = zaehl('STARK HALTEN','HALTEN');
  const schauen = zaehl('BEOBACHTEN');
  const raus = zaehl('REDUZIEREN','GEGEN DIE THESE');
  const ohneStop = bew.filter(b=>b.kurs != null && !(b.pos.plan && b.pos.plan.stop != null)).length;
  return `<div class="karte ${raus?'bad':(schauen?'warn':'gut')}" style="margin:10px 0 0;cursor:pointer" id="depotzeile">
    <h3>Dein Depot <span style="float:right;font-weight:400;color:var(--ink-3);font-size:12.5px">
      ${bew.length} Positionen · zum Reiter →</span></h3>
    <div class="kpi">
      <span>Wert <b>${num(wert,0)} €</b></span>
      <span>G/V <b class="${gv>=0?'up':'dn'}">${num(gv,0)} €${einstand?` (${pct(gv/einstand*100,1)})`:''}</b></span>
      <span>Halten <b class="up">${halten}</b></span>
      <span>Beobachten <b class="${schauen?'nu':''}">${schauen}</b></span>
      <span>Reduzieren <b class="${raus?'dn':''}">${raus}</b></span>
    </div>
    ${ohneStop ? `<p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-2)">
      <strong>${ohneStop}</strong> Position${ohneStop===1?'':'en'} ohne Stop — dort meldet sich
      die App nicht, wenn es eng wird. Im Depot-Reiter in einem Klick nachtragen.</p>` : ''}
    <p style="margin:8px 0 0;font-size:12.5px;color:var(--ink-3)">Bewertet nach relativer
      Stärke in der eigenen Klasse, nicht nach Einstiegs-Score — läuft bei jedem Kurs neu.</p>
  </div>`;
}

/* Das beste Setup ganz oben, sobald man die App oeffnet. Ozans Endbild aus dem
   Masterplan: "TOP OPPORTUNITY — Entry, SL, TP1/2/3, R:R, Score, Confidence".
   Es kommt aus derselben Rangliste wie der Alarme-Tab, damit nirgends zwei
   verschiedene "beste Chancen" stehen. */
/* Das CRV kam an drei Stellen aus zwei verschiedenen Quellen — und stand deshalb auf
   Ozans Bildschirm zweimal verschieden am selben Wert: im Markt „CRV 1:2.0", unter
   Alarme „CRV 1:1.25", gleicher Coin, gleiche Minute.

   Richtig ist die Zahl aus dem HANDELSPLAN. Der Plan legt Stop und Ziele so, dass Ziel 1
   nie naeher liegt als der Stop entfernt ist; genau diese Marken stehen auf der Karte.
   ``o.rr`` ist das rohe Verhaeltnis aus der Liquiditaetsrechnung davor — eine andere
   Groesse, die zu den angezeigten Marken nicht passt. Ab hier fragt jede Stelle hier. */
function crvVon(o){
  if (o && o.plan && o.plan.crv != null && isFinite(o.plan.crv)) return o.plan.crv;
  if (o && o.rr != null && isFinite(o.rr)) return o.rr;
  return null;
}

function topSignal(){
  const kand = [...rangLagen().values()];
  if (!kand.length) return '';
  const rang = a => [-(NOTE_RANG[a.w.note]||0), Math.abs(a.abstand ?? 999)];
  kand.sort((a,b)=>{ const [ra,da]=rang(a), [rb,db]=rang(b); return ra!==rb ? ra-rb : da-db; });
  const x = kand[0], w = x.w, o = x.o || {}, d = digits(w.einstieg);
  const seite = x.lang ? 'KAUFEN' : 'VERKAUFEN';
  /* Hier stand ``x.stufe === 'jetzt' || x.stufe === 'im_trade'`` — und damit las eine
     laufende Position wie eine Kaufaufforderung. Auf Ozans Bildschirm stand oben
     „BNB KAUFEN — JETZT, Einstieg 720,15" und zwei Zeilen tiefer in derselben Liste
     „noch 0,5 %, Einstieg 707,86": oben der eingefrorene Vertrag des laufenden Trades,
     unten der frische Vorschlag aus dem Scan. Beides richtig gerechnet, zusammen eine
     Aufforderung, etwas zu kaufen, das laengst laeuft.
     Ein laufender Trade ist kein Einstieg. Er bekommt jetzt sein eigenes Wort. */
  const jetzt = x.stufe === 'jetzt';
  const laeuft = x.stufe === 'im_trade' || x.stufe === 'stop';
  const ziele = [w.tp1, w.tp2, w.tp3].filter(v=>v!=null);
  const st = o.setup || null, pl = o.plan || null;
  // Die grosse Karte ist das Erste, was beim Öffnen im Blick ist. Sie beantwortet
  // in dieser Reihenfolge: was, warum, zu welchem Preis, mit welchem Risiko.
  return `<div class="hero ${x.lang?'lang':'kurz'} ${jetzt?'jetzt':''}"
      data-sym="${esc(w.instrument)}" id="topsignal">
    <div class="hero-k">
      <span class="mono lbl">${laeuft ? 'Läuft gerade' : 'Beste Chance'}</span>
      <span class="note ${NOTE_KLASSE[w.note]||''}">${esc(w.note)}</span>
      ${st?`<span class="mono lbl2">${esc(st.name)}</span>`:''}
      <span class="mono sc">${o.score!=null?`${o.score.toFixed(0)}`:''}</span>
    </div>
    <div class="hero-t">${esc(name(w.instrument))}
      <span class="akt">${
        x.stufe==='stop' ? 'STOP BERÜHRT'
        : laeuft ? `${x.lang?'LONG':'SHORT'} — läuft seit Einstieg`
        : jetzt ? `${seite} — JETZT`
        : `${seite} ab ${num(w.einstieg,d)}`}</span></div>
    ${x.kurs!=null?`<p class="hero-p">Kurs <strong>${num(x.kurs,d)}</strong>${

/* Diese Tabelle fehlte — und der Fehler war teuer.

   `REGIME_TEXT` wurde an zwei Stellen benutzt und nirgends definiert. Die Folge war

const REGIME_TEXT = {

/* ==================================================== NEWS UND TERMINE

   „Ich weiss nicht, ob du Live-News eingebaut hast — dass man sehen kann: heute
   passiert das und das."

   Hier steht es. Nicht Schlagzeilen — die sind fuer einen Swing-Trade meistens Laerm
   und kommen sowieso zu spaet —, sondern der Wirtschaftskalender: die Termine, von
   denen man VORHER weiss, dass sie den Markt bewegen. Zinsentscheidungen,
   Arbeitsmarktdaten, Inflationszahlen.

   Der Nutzen ist nicht die Zahl selbst, sondern das Timing: eine Stunde vor einer
   Fed-Entscheidung eine neue Position aufzumachen ist kein Trade, sondern eine Wette
   auf einen Wuerfel. Deshalb steht zu jedem Termin dabei, was er bedeutet. */
/* Die kurze Fassung fuer den Alarme-Reiter: nur, wenn es wirklich gleich soweit ist. */
function terminWarnung(){
  const alle = (S && S.makro && S.makro.termine) || [];
  const jetzt = Date.now();
  const bald = alle
    .map(t => ({...t, ts: Date.parse(t.zeitpunkt)}))
    .filter(t => t.wirkung === 'High' && isFinite(t.ts) && t.ts > jetzt && t.ts - jetzt < 3*3600*1000)
    .sort((a,b) => a.ts - b.ts)[0];
  if (!bald) return '';
  const min = Math.round((bald.ts - jetzt) / 60000);
  return `<div class="note-box warn"><span class="nt">Gleich ist ein wichtiger Termin</span>
    <p><strong>${esc(bald.titel)}</strong> (${esc(bald.land)}) in ${min < 60 ? min + ' Minuten' : Math.round(min/60) + ' Stunden'}.
    Bis das durch ist, lieber nichts Neues aufmachen — solche Termine bewegen den ganzen
    Markt in Minuten. Alle Termine stehen im Reiter <strong>News</strong>.</p></div>`;
}

function terminKasten(){
  const alle = (S && S.makro && S.makro.termine) || [];
  if (!alle.length) return '';
  const jetzt = Date.now();
  const kommend = alle
    .map(t => ({...t, ts: Date.parse(t.zeitpunkt)}))
    .filter(t => isFinite(t.ts) && t.ts > jetzt - 2*3600*1000 && t.ts < jetzt + 72*3600*1000)
    .sort((a,b) => a.ts - b.ts);
  if (!kommend.length){
    /* Wichtige Unterscheidung, sonst steht hier eine Unwahrheit.
       Die Quelle (faireconomy) veroeffentlicht immer nur die LAUFENDE Woche und rollt
       sonntags auf die naechste. Am Samstagnachmittag liegt die ganze Datei also in der
       Vergangenheit — und "es steht nichts an" waere dann schlicht falsch: es ist bloss
       noch nichts veroeffentlicht. */
    const spaetester = alle.map(t => Date.parse(t.zeitpunkt)).filter(isFinite).sort((a,b)=>b-a)[0];
    const nichtsMehr = spaetester && spaetester < jetzt;
    const letzte = alle.map(t=>({...t, ts:Date.parse(t.zeitpunkt)}))
      .filter(t=>t.wirkung==='High' && isFinite(t.ts)).sort((a,b)=>b.ts-a.ts).slice(0,6);
    return `<h2>Termine, die den Markt bewegen</h2>
    <div class="note-box ${nichtsMehr?'warn':''}"><span class="nt">${
      nichtsMehr?'Kalender noch nicht fortgeschrieben':'Ruhige Tage'}</span>
    <p>${nichtsMehr
      ? 'Die Quelle veröffentlicht immer nur die <strong>laufende Woche</strong> und rollt '
        + 'sonntags weiter. Gerade steht deshalb kein künftiger Termin in der Datei — das '
        + 'heißt <strong>nicht</strong>, dass nächste Woche nichts ansteht, sondern nur, dass '
        + 'es noch nicht veröffentlicht ist. Spätestens Sonntag steht hier wieder die volle Woche.'
      : 'In den nächsten drei Tagen steht nichts Großes an. Ruhige Tage sind die, an denen '
        + 'ein Setup auch das machen darf, was es soll.'}</p></div>
    ${letzte.length?`<h2>Was diese Woche lief</h2>
      <p class="lead">Zur Einordnung — diese Termine liegen hinter uns und erklären
      oft, warum ein Chart aussieht, wie er aussieht.</p>
      <div class="tw"><table class="mtf">
        <tr><th>Wann</th><th>Land</th><th>Termin</th><th></th></tr>
        ${letzte.map(t=>`<tr style="opacity:.7">
          <td class="mono" style="white-space:nowrap">${esc(new Date(t.ts).toLocaleString('de-DE',{weekday:'short',hour:'2-digit',minute:'2-digit'}))}</td>
          <td>${esc(t.land||'')}</td><td class="tf">${esc(t.titel||'')}</td>
          <td class="mono" style="color:var(--ink-3);font-size:11px">${
            t.vorher!=null?'vorher '+esc(String(t.vorher)):''}</td></tr>`).join('')}
      </table></div>`:''}`;
  }

  const hoch = kommend.filter(t => t.wirkung === 'High');
  const naechster = hoch[0];
  const stunden = naechster ? (naechster.ts - jetzt) / 3600000 : null;

  const zeile = t => {
    const wann = new Date(t.ts);
    const heute = new Date().toDateString() === wann.toDateString();
    const tag = heute ? 'heute' : wann.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit'});
    const uhr = wann.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    const kl = t.wirkung === 'High' ? 'dn' : (t.wirkung === 'Medium' ? 'nu' : '');
    const vergangen = t.ts < jetzt;
    return `<tr style="${vergangen?'opacity:.45':''}">
      <td class="mono" style="white-space:nowrap">${esc(tag)} ${esc(uhr)}</td>
      <td>${esc(t.land||'')}</td>
      <td class="tf">${esc(t.titel||'')}</td>
      <td class="${kl}">${t.wirkung==='High'?'hoch':(t.wirkung==='Medium'?'mittel':'klein')}</td>
      <td class="mono" style="color:var(--ink-3);font-size:11px">${
        t.prognose!=null?`Prognose ${esc(String(t.prognose))}`:''}${
        t.vorher!=null?` · vorher ${esc(String(t.vorher))}`:''}</td>
    </tr>`;
  };

  let kopf = '';
  if (naechster && stunden != null){
    const dringend = stunden <= 2;
    kopf = `<div class="note-box ${dringend?'warn':''}" style="margin-bottom:12px">
      <span class="nt">Als Nächstes</span>
      <p style="font-size:14px;margin:0 0 4px"><strong>${esc(naechster.titel)}</strong>
        (${esc(naechster.land)}) — ${stunden < 1 ? `in ${Math.max(0,Math.round(stunden*60))} Minuten`
          : `in ${stunden.toFixed(0)} Stunden`}</p>
      <p style="margin:0">${dringend
        ? 'Bis das durch ist, keine neue Position aufmachen. Solche Termine bewegen den '
          + 'ganzen Markt in Minuten, und ein Stop, der vorher sinnvoll war, ist danach Zufall.'
        : 'Weit genug weg, um normal zu handeln — aber wenn du eine Position über den '
          + 'Termin hinweg hältst, weißt du jetzt, warum es ruckeln kann.'}</p></div>`;
  }

  return `<h2>Termine, die den Markt bewegen</h2>
  <p class="lead">Keine Schlagzeilen — der Wirtschaftskalender. Das sind die Ereignisse,
  von denen man <strong>vorher</strong> weiß, dass sie Kurse bewegen. ${kommend.length}
  Termine in den nächsten drei Tagen, davon ${hoch.length} mit hoher Wirkung.</p>
  ${kopf}
  <div class="tw"><table class="mtf">
    <tr><th>Wann</th><th>Land</th><th>Termin</th><th>Wirkung</th><th></th></tr>
    ${kommend.slice(0,40).map(zeile).join('')}
  </table></div>
  <p class="leer">Nachrichten gehen <strong>nicht</strong> in den Score ein. Sie ändern
  das Risiko, nicht die Richtung — und wer eine Zinsentscheidung handelt, handelt nicht
  den Chart, sondern eine Münze.</p>`;
}
