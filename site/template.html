<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading Desk</title>
<meta name="description" content="Live AI Trading Desk — Gesamtmarkt-Scan, eingezeichnete Chartanalyse, Portfolio. Paper, kein Echtgeld.">
<meta name="theme-color" content="#05070D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* ===================================================================
   AI TRADING DESK — Oberflaeche
   -------------------------------------------------------------------
   Dunkel als Grundzustand, nicht als Variante. Ein Handelsplatz wird in
   der Regel stundenlang angeschaut; helle Flaechen ermueden dabei, und
   auf Schwarz traegt Farbe Bedeutung: gruen laeuft, rot ist raus, cyan
   ist das System selbst. Alles Uebrige bleibt grau, damit die drei
   Farben etwas heissen.

   Aufbau: Tiefe entsteht durch Ebenen (Grundflaeche, Glasplatte,
   Leuchtkante), nicht durch Schatten. Zahlen stehen immer in Mono mit
   Tabellenziffern, damit Kurse untereinander stehen und nicht springen.
   =================================================================== */
:root{
  color-scheme:dark;
  /* Grundflaechen */
  --bg:#05070D;
  --bg-2:#080C15;
  --glass:rgba(255,255,255,.035);
  --glass-2:rgba(255,255,255,.06);
  --sunk:rgba(0,0,0,.32);
  /* Linien */
  --rule:rgba(125,180,255,.11);
  --rule-strong:rgba(125,180,255,.22);
  /* Schrift */
  --ink:#E8F0FF;
  --ink-2:#9FB2CE;
  --ink-3:#63748F;
  /* Bedeutungstraeger */
  --accent:#3DF0D0;
  --accent-2:#4C8DFF;
  --accent-soft:rgba(61,240,208,.10);
  --long:#2BE8A5;  --long-bg:rgba(43,232,165,.11);
  --bad:#FF5C7A;   --bad-bg:rgba(255,92,122,.11);
  --warn:#FFB648;  --warn-bg:rgba(255,182,72,.11);
  --flat:#63748F;  --flat-bg:rgba(99,116,143,.13);
  /* Chart */
  --grid:rgba(125,180,255,.07);
  --wick:#5A6C88;
  --surface:var(--glass);
  --surface-2:var(--glass-2);
  --paper:var(--bg);
  --radius:14px;
  /* Tiefe. Drei gestaffelte Schatten statt eines harten: der erste setzt die Kante ab,
     der zweite gibt Hoehe, der dritte legt das Element in den Raum. Ein einzelner
     Schatten sieht immer aufgeklebt aus. */
  --tiefe:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 26px rgba(0,0,0,.44), 0 2px 6px rgba(0,0,0,.30);
  --tiefe-hoch:0 1px 0 rgba(255,255,255,.07) inset, 0 18px 48px rgba(0,0,0,.52), 0 4px 12px rgba(0,0,0,.34);
}
/* Helle Variante — bewusst schlicht gehalten. Wer sie waehlt, will lesen,
   nicht bewundern. */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F5FA; --bg-2:#E9EEF7;
  --glass:#FFFFFF; --glass-2:#F4F7FC; --sunk:#E4EAF3;
  --rule:#DBE3EF; --rule-strong:#BFCBDD;
  --ink:#0D1526; --ink-2:#42536E; --ink-3:#76859C;
  --accent:#0E9E86; --accent-2:#2563EB; --accent-soft:rgba(14,158,134,.10);
  --long:#0E9E62; --long-bg:rgba(14,158,98,.10);
  --bad:#D0344F; --bad-bg:rgba(208,52,79,.10);
  --warn:#B57A0B; --warn-bg:rgba(181,122,11,.12);
  --flat:#76859C; --flat-bg:rgba(118,133,156,.12);
  --grid:rgba(20,40,80,.07); --wick:#8A99AE;
  --tiefe:0 1px 0 rgba(255,255,255,.8) inset, 0 6px 18px rgba(20,40,80,.10), 0 1px 3px rgba(20,40,80,.08);
  --tiefe-hoch:0 1px 0 rgba(255,255,255,.9) inset, 0 14px 34px rgba(20,40,80,.14), 0 3px 8px rgba(20,40,80,.10);
  --surface:var(--glass); --surface-2:var(--glass-2); --paper:var(--bg);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background:var(--bg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
  /* Zwei weiche Lichtquellen oben und ein feines Raster darunter. Das Raster
     ist so schwach, dass man es nicht sieht — man merkt nur, dass die
     Flaeche nicht tot ist. */
  background-image:
    radial-gradient(1100px 460px at 12% -10%, rgba(76,141,255,.16), transparent 62%),
    radial-gradient(900px 420px at 92% -6%, rgba(61,240,208,.11), transparent 60%),
    linear-gradient(rgba(125,180,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,180,255,.028) 1px, transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;
  background-attachment:fixed;
}
:root[data-theme="light"] body{background-image:
  radial-gradient(1000px 420px at 12% -10%, rgba(37,99,235,.10), transparent 62%),
  radial-gradient(800px 380px at 92% -6%, rgba(14,158,134,.08), transparent 60%)}
img{max-width:100%}
.wrap{max-width:900px; margin:0 auto; padding:0 18px 110px}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"ss01" 1}

/* ---------- Kopf ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, rgba(5,7,13,.94), rgba(5,7,13,.80));
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid var(--rule);
}
:root[data-theme="light"] header{background:linear-gradient(180deg,rgba(242,245,250,.96),rgba(242,245,250,.86))}
/* Die Leuchtkante unter dem Kopf. Ein Pixel, aber sie macht den Unterschied
   zwischen „Seite" und „Geraet". */
header::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);
  opacity:.55}
.hd{max-width:900px; margin:0 auto; padding:16px 18px 0}
.crumb{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-3); display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.crumb>span:first-child{color:var(--ink-2); font-weight:600;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
h1{font-family:"Space Grotesk",Inter,sans-serif; font-weight:600; font-size:29px;
  line-height:1.05; letter-spacing:-.03em; margin:8px 0 0}
h2{font-family:"Space Grotesk",Inter,sans-serif; font-weight:600; font-size:15px;
  letter-spacing:.02em; margin:30px 0 11px; color:var(--ink);
  display:flex; align-items:center; gap:10px}
/* Die Linie hinter jeder Ueberschrift laeuft bis zum Rand — Konsolen-Anmutung
   ohne dass es laut wird. */
h2::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--rule),transparent)}
h3{font-size:13px; font-weight:600; margin:18px 0 8px; letter-spacing:.01em; color:var(--ink)}
.stamp{font-size:12px; color:var(--ink-3); margin-top:5px; font-family:"JetBrains Mono",monospace}
.chip{display:inline-flex; align-items:center; gap:5px; font-family:"JetBrains Mono",monospace;
  font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  padding:4px 9px; border-radius:100px; border:1px solid transparent}
.chip.paper{background:var(--warn-bg); color:var(--warn); border-color:rgba(255,182,72,.28)}
.chip.live{background:var(--long-bg); color:var(--long); border-color:rgba(43,232,165,.30)}
.chip.tot{background:var(--flat-bg); color:var(--flat); border-color:var(--rule)}
.dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--long);
  box-shadow:0 0 0 3px rgba(43,232,165,.18); vertical-align:middle}
.dot.aus{background:var(--flat); box-shadow:none}
.puls{animation:puls 2.4s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.puls,.scan,.glowline{animation:none!important}}

/* ---------- Reiter ---------- */
.tabs{display:flex; gap:4px; margin-top:16px; overflow-x:auto; scrollbar-width:none;
  padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
#t0{order:-2}#t12{order:-1}
.tab{appearance:none; background:none; border:0; position:relative;
  font:inherit; font-size:13px; font-weight:500; color:var(--ink-3);
  padding:10px 13px 12px; cursor:pointer; white-space:nowrap; letter-spacing:.01em;
  transition:color .16s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink); font-weight:600}
.tab[aria-selected="true"]::after{content:""; position:absolute; left:11px; right:11px; bottom:0;
  height:2px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:0 0 12px rgba(61,240,208,.55)}
.panel{padding-top:20px; animation:auf .28s cubic-bezier(.2,.7,.3,1)}
@keyframes auf{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.lead{font-size:13.5px; color:var(--ink-2); margin:0 0 16px}

/* ---------- Statuskacheln ---------- */
.status{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px}
/* NUR die Kachel selbst, nicht ihre Zeilen: bis 30.09. stand hier „.status div“ — damit
   bekam jede Zeile in der Kachel (Titel, Zahl, Unterzeile) noch einmal Rand, Schatten und
   Polster, und jede Kachel sah aus wie drei gestapelte Knoepfe. */
.status > div{
  position:relative; overflow:hidden; padding:13px 14px 14px;
  background:linear-gradient(165deg, var(--glass-2), var(--glass));
  border:1px solid var(--rule); border-radius:var(--radius);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--tiefe);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
}
.status > div:hover{transform:translateY(-2px); box-shadow:var(--tiefe-hoch)}
.status > div::before{content:""; position:absolute; inset:0 0 auto 0; height:1px;
  background:linear-gradient(90deg,transparent,var(--rule-strong),transparent)}
.status .k{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:6px}
.status .v{font-family:"Space Grotesk",Inter,sans-serif; font-size:25px; line-height:1;
  font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.status .v.gut{color:var(--long); text-shadow:0 0 22px rgba(43,232,165,.35)}
.status .v.mittel{color:var(--warn)} .status .v.aus{color:var(--ink-3)}
.status .v.schlecht{color:var(--bad)}
@media (max-width:640px){.status{grid-template-columns:repeat(2,1fr); gap:8px}}

/* ---------- Filterknoepfe ---------- */
.filter{display:flex; gap:7px; flex-wrap:wrap; margin:18px 0 6px}
.fb{appearance:none; border:1px solid var(--rule); background:var(--glass);
  color:var(--ink-2); font:inherit; font-size:11.5px; font-weight:500; padding:6px 13px;
  border-radius:100px; cursor:pointer; transition:all .16s; letter-spacing:.01em}
.fb:hover{border-color:var(--rule-strong); color:var(--ink)}
.fb[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent; color:#03121A; font-weight:600;
  box-shadow:0 3px 18px rgba(61,240,208,.28)}

/* ---------- Chancen-Zeilen ---------- */
.opp{
  position:relative; background:var(--glass); border:1px solid var(--rule);
  border-radius:var(--radius); margin-bottom:9px; cursor:pointer; overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.7,.3,1), border-color .16s, background .16s;
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.opp{box-shadow:var(--tiefe)}
.opp:hover{transform:translateY(-2px); border-color:var(--rule-strong);
  background:var(--glass-2); box-shadow:var(--tiefe-hoch)}
.opp:active{transform:translateY(0)}
/* Der Farbstreifen links ist die Note. Er ist das Erste, was auffaellt, und
   das Einzige, was aus der Entfernung lesbar sein muss. */
.opp::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--rule-strong)}
.opp.n-A_PLUS::before{background:linear-gradient(180deg,var(--accent),var(--long));
  box-shadow:0 0 20px rgba(43,232,165,.55)}
.opp.n-A::before{background:var(--long); box-shadow:0 0 14px rgba(43,232,165,.35)}
.opp.n-A_MINUS::before{background:var(--accent)}
.opp.n-B_PLUS::before{background:var(--accent-2)}
.opp.n-B::before{background:var(--warn)}
.opp.n-WATCH::before{background:var(--flat)}
.opp.n-A_PLUS{border-color:rgba(43,232,165,.30)}
.opp-h{display:flex; align-items:baseline; gap:9px; padding:13px 15px 7px 17px; flex-wrap:wrap}
.opp-h .rk{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-3); min-width:22px}
.opp-h .nm{font-weight:650; font-size:15.5px; letter-spacing:-.01em;
  font-family:"Space Grotesk",Inter,sans-serif}
.opp-h .kl{font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}
.opp-h .dir{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.12em;
  font-weight:600; padding:3px 7px; border-radius:5px}
.opp-h .dir.long{background:var(--long-bg); color:var(--long)}
.opp-h .dir.short{background:var(--bad-bg); color:var(--bad)}
.opp-h .note{font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:700;
  padding:3px 8px; border-radius:5px; background:var(--flat-bg); color:var(--ink-2);
  border:1px solid var(--rule)}
.opp-h .note.gut{background:var(--long-bg); color:var(--long); border-color:rgba(43,232,165,.32)}
.opp-h .note.tor-ja{background:transparent; color:var(--long); border-color:rgba(43,232,165,.4)}
.opp-h .note.tor-nein{background:transparent; color:var(--ink-3); border-style:dashed}
.opp-h .note.mittel{background:var(--accent-soft); color:var(--accent); border-color:rgba(61,240,208,.28)}
.opp-h .sc{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:17px;
  font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.opp-b{padding:0 15px 13px 17px; font-size:12.5px; color:var(--ink-2)}
.kpi{display:flex; gap:7px; flex-wrap:wrap; font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-2); margin-top:8px}
/* Jede Kennzahl in einer eigenen Kapsel — nebeneinander gesetzte Zahlen ohne
   Rahmen verschwimmen auf dem Handy zu einer Zeile Zahlensalat. */
.kpi>span{background:var(--sunk); border:1px solid var(--rule); border-radius:7px;
  padding:3px 8px; white-space:nowrap; max-width:100%}
/* Lange Kapseln (Sektor, Kursziel, 52 Wochen) liefen am Handy rechts aus dem Bild.
   Kurze bleiben einzeilig, lange duerfen umbrechen. */
@media (max-width:640px){.kpi>span{white-space:normal}}
.kpi b{color:var(--ink); font-weight:600}
.kpi .up{color:var(--long)} .kpi .dn{color:var(--bad)}
.warnz{margin-top:8px; font-size:11.5px; color:var(--warn); line-height:1.45;
  border-left:2px solid rgba(255,182,72,.35); padding-left:9px}
.muz{margin-top:7px; font-size:11.5px; color:var(--ink-3)}
.fak{display:grid; grid-template-columns:8.5em 3.6em 1fr; gap:5px 9px; align-items:center;
  font-size:11.5px; color:var(--ink-3); margin-top:5px}
.fak .fn{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase}
.fak .fb2{height:4px; background:var(--sunk); border-radius:3px; overflow:hidden}
.fak .fb2 i{display:block; height:100%; border-radius:3px;
  background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.fak .fd{color:var(--ink-2)}

/* ---------- Setup-Karte: der Teil, der die Handelsidee benennt ---------- */
.setup{margin-top:10px; border:1px solid var(--rule); border-radius:10px; overflow:hidden;
  background:var(--sunk)}
.setup .sh{display:flex; align-items:center; gap:8px; padding:9px 12px;
  border-bottom:1px solid var(--rule); font-family:"Space Grotesk",Inter,sans-serif;
  font-weight:600; font-size:13px}
.setup .sq{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:9px;
  letter-spacing:.14em; text-transform:uppercase; padding:3px 7px; border-radius:5px}
.setup .sq.sauber{background:var(--long-bg); color:var(--long)}
.setup .sq.brauchbar{background:var(--accent-soft); color:var(--accent)}
.setup .sq.unsauber{background:var(--warn-bg); color:var(--warn)}
.setup .sb{padding:10px 12px 12px; font-size:12.5px; color:var(--ink-2)}
.setup ul{margin:8px 0 0; padding:0; list-style:none}
.setup li{position:relative; padding-left:19px; margin-bottom:5px; line-height:1.45}
.setup li::before{position:absolute; left:0; top:0; font-family:"JetBrains Mono",monospace;
  font-size:11px}
.setup li.ja::before{content:"✓"; color:var(--long)}
.setup li.nein::before{content:"○"; color:var(--warn)}
.setup .trig{margin-top:10px; padding:8px 10px; border-radius:8px;
  background:var(--accent-soft); border:1px solid rgba(61,240,208,.22);
  color:var(--ink); font-size:12px}
.setup .trig b{color:var(--accent); font-family:"JetBrains Mono",monospace;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase; display:block; margin-bottom:3px}

/* ---------- Handelsplan als Ablauf ---------- */
.steps{list-style:none; margin:8px 0 0; padding:0; counter-reset:s}
.steps li{position:relative; counter-increment:s; padding:0 0 15px 32px; font-size:13px;
  color:var(--ink-2); line-height:1.5}
.steps li::before{content:counter(s); position:absolute; left:0; top:0;
  width:21px; height:21px; border-radius:50%; display:grid; place-items:center;
  font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:600;
  background:var(--accent-soft); color:var(--accent); border:1px solid rgba(61,240,208,.3)}
/* Die Verbindungslinie macht aus fuenf Saetzen einen Ablauf. */
.steps li::after{content:""; position:absolute; left:10px; top:24px; bottom:2px; width:1px;
  background:linear-gradient(180deg,var(--rule-strong),transparent)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.exits{list-style:none; margin:8px 0 0; padding:0}
/* Laufender Trade im Analyse-Reiter: Vertrag, Fortschritt, naechster Schritt */
.vertrag-karte{border-color:rgba(76,141,255,.38);
  background:linear-gradient(150deg, rgba(76,141,255,.10), var(--glass) 60%)}
.vk-kopf{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.vk-tag{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent-2); font-weight:600}
.vk-seit{font-size:12.5px; color:var(--ink-2)}
.vk-r{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:20px; font-weight:650}
.vk-r.up{color:var(--long)} .vk-r.dn{color:var(--bad)}
.vk-hinweis{margin:12px 0 0; font-size:12px; color:var(--ink-3); line-height:1.5}
.steps.vertrag li.ok{color:var(--ink-3)}
.steps.vertrag li.ok::before{content:"✓"; color:var(--long); border-color:var(--long)}
.steps.vertrag li.jetzt::before{content:"→"; color:var(--accent-2); border-color:var(--accent-2);
  box-shadow:0 0 0 4px rgba(76,141,255,.14)}
.ok-tag{font-family:"JetBrains Mono",monospace; font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--long); margin-left:4px}
.mc{margin:10px 0 2px}
.mc svg{width:100%;height:auto;display:block;overflow:visible}
.mc-p{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-linejoin:round}
.mc-f{stroke:none}.mc-f.plus{fill:var(--long-bg)}.mc-f.minus{fill:var(--bad-bg)}
.mc-l{stroke-width:1;stroke-dasharray:3 3}
.mc-l.ein{stroke:var(--accent-2)}.mc-l.stop{stroke:var(--bad)}.mc-l.tp{stroke:var(--long)}
.mc-t{font:9px "JetBrains Mono",monospace;fill:var(--ink-3)}
.mc-t.ein{fill:var(--accent-2)}.mc-t.stop{fill:var(--bad)}.mc-t.tp{fill:var(--long)}.mc-t.kurs{fill:var(--ink)}
.mc-k{fill:var(--ink);stroke:var(--bg,#000);stroke-width:1.5}
.dg-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.dg-s{display:block;height:100%}
.dg-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.dg-leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.dg-r{display:grid;grid-template-columns:34% 1fr 24%;gap:6px;align-items:center;padding:3px 0;font-size:12.5px}
.dg-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg-b{position:relative;height:10px;background:linear-gradient(var(--line,rgba(128,128,128,.25)),var(--line,rgba(128,128,128,.25))) center/1px 100% no-repeat}
.dg-b i{position:absolute;top:1px;bottom:1px;border-radius:3px}
.dg-b i.plus{background:var(--long)}.dg-b i.minus{background:var(--bad)}
.dg-v{text-align:right;font-family:"JetBrains Mono",monospace}
.fl{margin:16px 2px 4px; position:relative}
.fl-bahn{position:relative; height:8px; border-radius:6px; background:var(--sunk);
  box-shadow:inset 0 0 0 1px var(--rule)}
.fl-fill{position:absolute; top:0; bottom:0; border-radius:6px}
.fl-fill.plus{background:linear-gradient(90deg, rgba(43,232,165,.25), var(--long))}
.fl-fill.minus{background:linear-gradient(270deg, rgba(255,92,122,.25), var(--bad))}
.fl-m{position:absolute; top:-3px; width:2px; height:14px; margin-left:-1px; border-radius:1px;
  background:var(--ink-3)}
.fl-m.stop{background:var(--bad)} .fl-m.ein{background:var(--accent-2)} .fl-m.tp{background:var(--long)}
.fl-m.ok{opacity:.45}
.fl-jetzt{position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
  background:var(--ink); box-shadow:0 0 0 3px var(--bg), 0 0 14px rgba(255,255,255,.35)}
.fl-jetzt span{position:absolute; bottom:17px; left:50%; transform:translateX(-50%); white-space:nowrap;
  font-family:"JetBrains Mono",monospace; font-size:10.5px; font-weight:650}
.fl-jetzt.plus span{color:var(--long)} .fl-jetzt.minus span{color:var(--bad)}
.fl-lab{position:relative; height:16px; margin-top:7px}
.fl-lab span{position:absolute; transform:translateX(-50%); font-family:"JetBrains Mono",monospace;
  font-size:9.5px; color:var(--ink-3); white-space:nowrap}
.fl-lab span.stop{color:var(--bad)} .fl-lab span.ein{color:var(--accent-2)} .fl-lab span.tp{color:var(--long)}
.fl-lab span:first-child{transform:none} .fl-lab span:last-child{transform:translateX(-100%)}
.note-box.klapp.erkl>summary{display:block}
.note-box.klapp.erkl .klapp-hint{display:inline; margin-left:6px}
.note-box.klapp.erkl[open] .klapp-hint{display:none}
.exits li{position:relative; padding-left:19px; margin-bottom:7px; font-size:12.5px;
  color:var(--ink-2); line-height:1.45}
.exits li::before{content:"→"; position:absolute; left:0; color:var(--bad);
  font-family:"JetBrains Mono",monospace}

/* ---------- Chart ---------- */
.chartbox{background:var(--glass); border:1px solid var(--rule); border-radius:var(--radius);
  overflow:hidden; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--tiefe)}
.chart-h{display:flex; align-items:center; gap:10px; padding:12px 14px;
  border-bottom:1px solid var(--rule); flex-wrap:wrap}
.chart-h .nm{font-weight:650; font-size:16.5px; font-family:"Space Grotesk",Inter,sans-serif;
  letter-spacing:-.01em}
.chart-h .px{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:18px; font-weight:600}
.chart-h .px.up{color:var(--long)} .chart-h .px.dn{color:var(--bad)}
.tfbar{display:flex; gap:3px; padding:8px 11px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.tfb{appearance:none; border:0; background:none; font:inherit; font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-3); padding:5px 11px; border-radius:7px; cursor:pointer;
  transition:all .14s; letter-spacing:.06em}
.tfb:hover{color:var(--ink-2); background:var(--sunk)}
.tfb[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(61,240,208,.25)}
.layers{display:flex; gap:5px; padding:7px 11px 9px; border-bottom:1px solid var(--rule); flex-wrap:wrap}
.lb{appearance:none; border:1px solid var(--rule); background:transparent; font:inherit;
  font-size:10.5px; color:var(--ink-3); padding:4px 9px; border-radius:100px; cursor:pointer;
  transition:all .14s}
.lb:hover{color:var(--ink-2); border-color:var(--rule-strong)}
.lb[aria-pressed="true"]{background:var(--glass-2); color:var(--ink); border-color:var(--rule-strong)}
/* pan-y: senkrecht wischen scrollt die Seite, waagerecht verschiebt den Chart, zwei Finger
   zoomen. Vorher (none) blieb man auf dem Handy im Chart haengen — 400 px, auf denen die
   Seite nicht mehr scrollte. */
#cv{display:block; width:100%; height:500px; touch-action:pan-y; cursor:crosshair}
/* Day-Trading-Chart (12.10.): eigener, schlanker Kerzenchart, Kurse direkt von Kraken */
#dtcv{display:block; width:100%; height:330px; touch-action:pan-y}
@media (max-width:640px){#dtcv{height:290px}}
.dtwahl{display:flex; gap:6px; overflow-x:auto; padding:10px 11px; border-bottom:1px solid var(--rule);
  scrollbar-width:none}
.dtwahl::-webkit-scrollbar{display:none}
.dtw{appearance:none; flex:none; border:1px solid var(--rule); background:transparent; font:inherit;
  font-size:12px; color:var(--ink-2); padding:6px 11px; border-radius:100px; cursor:pointer;
  white-space:nowrap}
.dtw[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); border-color:rgba(61,240,208,.35);
  font-weight:600}
.dtw .pu{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px;
  background:var(--ink-3); vertical-align:1px}
.dtw .pu.aus{background:var(--long)} .dtw .pu.nah{background:var(--warn)} .dtw .pu.zu{background:var(--bad)}
.dtcheck{list-style:none; margin:0; padding:0}
.dtcheck li{display:flex; gap:9px; align-items:baseline; padding:5px 0; font-size:13px;
  border-bottom:1px solid var(--rule)}
.dtcheck li:last-child{border-bottom:0}
.dtcheck .ok{color:var(--long); font-weight:700} .dtcheck .no{color:var(--bad); font-weight:700}
.dtcheck .v{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--ink-2);
  text-align:right}
.dturteil{margin:10px 0 0; padding:10px 12px; border-radius:10px; font-size:13.5px; line-height:1.45}
.dturteil.gut{background:var(--long-bg); color:var(--long)}
.dturteil.warte{background:var(--sunk); color:var(--ink-2)}
.dturteil.warn{background:var(--warn-bg); color:var(--warn)}
.dtq{appearance:none; border:1px solid var(--rule-strong); background:transparent; color:var(--ink-3);
  width:18px; height:18px; border-radius:50%; font:600 11px/1 Inter,sans-serif; cursor:pointer; padding:0;
  vertical-align:2px; margin-left:4px}
.dtq:hover{color:var(--accent); border-color:var(--accent)}
.dtbg{padding:8px 0; border-bottom:1px solid var(--rule)}
.dtbg p{margin:3px 0 0; font-size:13px; color:var(--ink-2)}
.dtbg.hell{background:var(--accent-soft); border-radius:8px; padding:8px}
.dtspread{display:flex; flex-wrap:wrap; gap:6px 14px; padding:7px 14px; border-bottom:1px solid var(--rule);
  font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink-2)}
.dtspread b{color:var(--ink); font-weight:600}
.dtspread .live{margin-left:auto; color:var(--long)}
.tfbar .tfb{padding:5px 8px}
@media (max-width:640px){#cv{height:420px}}
.chart-q{margin-left:auto; font-size:10.5px; color:var(--ink-3); align-self:center; text-align:right}
.chart-q b{font-weight:600; color:var(--accent-2)}
.chart-q b.scan{color:var(--ink-2)} .chart-q b.skizze{color:var(--warn)}
/* Die Plan-Leiste unter dem Chart: die fuenf Zahlen, die man fuer die Order braucht,
   mit Abstand zum Kurs und R-Vielfachem. Auf dem Handy 2 + 3, sonst eine Zeile. */
.planleiste{display:grid; grid-template-columns:repeat(6,1fr); margin-left:-1px;
  border-top:1px solid var(--rule)}
.pl{grid-column:span 2; padding:8px 10px 9px; min-width:0; box-shadow:inset 1px 0 0 var(--rule), inset 0 -1px 0 var(--rule)}
.pl.ein,.pl.stop{grid-column:span 3}
@media (min-width:560px){.planleiste{grid-template-columns:repeat(5,1fr)} .pl,.pl.ein,.pl.stop{grid-column:auto; box-shadow:inset 1px 0 0 var(--rule)}}
.pl span{display:block; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:600}
.pl.ein span{color:var(--accent-2)} .pl.stop span{color:var(--bad)} .pl.tp span{color:var(--long)}
.pl b{display:block; font-family:"JetBrains Mono",monospace; font-size:13px; font-weight:600;
  margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pl i{display:block; font-style:normal; font-family:"JetBrains Mono",monospace; font-size:10px;
  color:var(--ink-3); margin-top:1px; white-space:nowrap}
.pl i.r{color:var(--ink-2)}
.pl.ok{opacity:.55} .pl.ok b{text-decoration:line-through; text-decoration-thickness:1px}
.legende{display:flex; gap:13px; flex-wrap:wrap; padding:9px 14px; border-top:1px solid var(--rule);
  font-size:10px; color:var(--ink-3); font-family:"JetBrains Mono",monospace; letter-spacing:.06em}
.legende span{display:flex; align-items:center; gap:5px}
.legende i{width:12px; height:3px; border-radius:2px; display:inline-block}
.readout{padding:9px 14px; border-top:1px solid var(--rule); font-family:"JetBrains Mono",monospace;
  font-size:11px; color:var(--ink-2); min-height:32px; background:var(--sunk)}

/* ---------- Tabellen und Karten ---------- */
.mtf{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px}
.mtf th{text-align:left; font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--ink-3); font-weight:600; padding:8px 10px;
  border-bottom:1px solid var(--rule-strong)}
.mtf td{padding:9px 10px; border-bottom:1px solid var(--rule); vertical-align:top; color:var(--ink-2)}
.mtf tr:last-child td{border-bottom:0}
.mtf td.tf{font-family:"JetBrains Mono",monospace; font-weight:600; color:var(--ink)}
.mtf .up{color:var(--long)} .mtf .dn{color:var(--bad)} .mtf .nu{color:var(--ink-3)}
.satzliste{margin:8px 0 0; padding-left:0; list-style:none; font-size:13px; color:var(--ink-2)}
.satzliste li{position:relative; padding-left:17px; margin-bottom:7px; line-height:1.5}
.satzliste li::before{content:""; position:absolute; left:2px; top:.62em; width:5px; height:5px;
  border-radius:50%; background:var(--rule-strong)}
.karte{background:linear-gradient(165deg, var(--glass-2), var(--glass));
  border:1px solid var(--rule); border-radius:var(--radius);
  padding:15px 16px; margin-bottom:11px; backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px); position:relative; overflow:hidden;
  box-shadow:var(--tiefe)}
.karte h3{margin-top:0}
.karte.gut{border-color:rgba(43,232,165,.28); background:linear-gradient(135deg,var(--long-bg),var(--glass))}
.karte.warn{border-color:rgba(255,182,72,.28)}
.karte.bad{border-color:rgba(255,92,122,.28)}
/* Das Urteil oben rechts auf einer Depot-Karte — in der Farbe der Handlung */
.karte > h3 .note.bad{color:var(--bad)} .karte > h3 .note.warn{color:var(--warn)}
.karte > h3 .note.gut{color:var(--long)}
.zt{display:flex; gap:8px; flex-wrap:wrap; font-family:"JetBrains Mono",monospace; font-size:11px;
  color:var(--ink-2); margin-top:11px; padding-top:11px; border-top:1px solid var(--rule)}
/* Nur die direkten Kinder sind Kaertchen — ein Zusatz IN einem Kaertchen („5× · 60 %“)
   ist Text, kein zweites Kaertchen im ersten. */
.zt > span{background:var(--sunk); border:1px solid var(--rule); border-radius:7px; padding:3px 8px}
.zt b{color:var(--ink)}
.zt .up{color:var(--long)} .zt .dn{color:var(--bad)}
details.mehr{margin:10px 0 0; border-top:1px dashed var(--rule); padding-top:7px; font-size:12.5px; color:var(--ink-2)}
details.mehr > summary{cursor:pointer; list-style:none; color:var(--ink-3); font-size:12.5px}
details.mehr > summary::-webkit-details-marker{display:none}
details.mehr > summary::before{content:'▸ '}
details.mehr[open] > summary::before{content:'▾ '}
.note-box{background:var(--sunk); border:1px solid var(--rule); border-radius:11px;
  padding:12px 14px; font-size:12.5px; color:var(--ink-2); margin:14px 0}
.note-box.warn{background:var(--warn-bg); border-color:rgba(255,182,72,.26); color:var(--warn)}
.note-box.bad{background:var(--bad-bg); border-color:rgba(255,92,122,.26); color:var(--bad)}
.note-box .nt{display:block; font-family:"JetBrains Mono",monospace; font-size:9px;
  letter-spacing:.16em; text-transform:uppercase; margin-bottom:6px; font-weight:600; opacity:.85}
.erw{margin:10px 0 0; padding:10px 12px; border-radius:10px; background:var(--sunk);
  border:1px solid var(--rule)}
.erw .nt{display:block; font-family:"JetBrains Mono",monospace; font-size:9px;
  letter-spacing:.16em; text-transform:uppercase; margin-bottom:7px; color:var(--accent); font-weight:600}
.erw p{font-size:11.5px; color:var(--ink-3); margin:7px 0 0; line-height:1.55}
.qbar{height:5px; border-radius:3px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:9px}
.qbar i{display:block; height:100%; border-radius:3px;
  background:linear-gradient(90deg, var(--accent), var(--long)); box-shadow:0 0 10px rgba(0,229,255,.35)}
.ka{background:linear-gradient(165deg, var(--glass-2), var(--glass)); border:1px solid rgba(43,232,165,.30);
  border-radius:var(--radius); padding:13px 15px; margin:12px 0 14px; box-shadow:var(--tiefe)}
.ka .nt{display:block; font-family:"JetBrains Mono",monospace; font-size:9px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--long); font-weight:600; margin-bottom:4px}
.ka-h{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin-bottom:6px}
.ka-h .nt{flex-basis:100%}
.ka-zahl{font-family:"Space Grotesk",Inter,sans-serif; font-size:15px; font-weight:600; color:var(--ink)}
.ka-w{font-size:11.5px; color:var(--ink-3)}
.ka-z{border-top:1px solid var(--rule); padding:9px 0 7px; cursor:pointer}
.ka-k{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:14px}
.ka-k .mono{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--accent); letter-spacing:.06em}
.ka-t{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-3)}
.ka-s{display:flex; gap:4px 12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-2); margin-top:4px}
.ka-s .up{color:var(--long)} .ka-s .dn{color:var(--bad)} .ka-s .nu{color:var(--ink-2)}
.ka-deckel{margin:8px 0 0; font-size:12.5px; color:var(--warn)}
.ka-deckel .ka-link{text-decoration:underline; cursor:pointer}
.ka-frei,.ka-leer{margin:8px 0 0; font-size:12px; color:var(--ink-3)}
.alarm{background:linear-gradient(165deg, var(--glass-2), var(--glass));
  border:1px solid var(--rule); border-radius:var(--radius);
  padding:13px 15px 13px 17px; margin-bottom:9px; position:relative; overflow:hidden;
  box-shadow:var(--tiefe)}
.alarm::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--rule-strong)}
.alarm.hot::before{background:linear-gradient(180deg,var(--accent),var(--long));
  box-shadow:0 0 20px rgba(43,232,165,.5)}
.alarm.hot{border-color:rgba(43,232,165,.26)}
.alarm .ah{font-weight:650; font-size:14px; display:flex; gap:10px; align-items:baseline;
  font-family:"Space Grotesk",Inter,sans-serif}
.alarm .ah .d{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-3)}
.alarm p{margin:6px 0 0; font-size:12.5px; color:var(--ink-2)}
.rowx{display:flex; justify-content:space-between; gap:12px; padding:8px 0;
  border-bottom:1px solid var(--rule); font-size:13px}
.rowx:last-child{border-bottom:0}
.rowx .lab{color:var(--ink-2)} .rowx .val{font-family:"JetBrains Mono",monospace; font-weight:600; color:var(--ink)}
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
.leer{color:var(--ink-3); font-size:13px; padding:24px 0; text-align:center}
.foot{max-width:900px; margin:0 auto; padding:28px 18px 46px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--ink-3)}
.foot p{margin:0 0 8px}

/* ---------- Bedienelemente ---------- */
button.link{appearance:none; background:none; border:0; font:inherit; font-size:12.5px;
  color:var(--accent); cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px}
.btn{appearance:none; border:1px solid var(--rule-strong); background:var(--glass-2);
  color:var(--ink); font:inherit; font-size:13px; font-weight:600; padding:10px 18px;
  border-radius:10px; cursor:pointer; transition:all .16s}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn{box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 3px 10px rgba(0,0,0,.28)}
.btn:active{transform:translateY(1px)}
.btn.prim{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border-color:transparent;
  color:#03121A; box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 6px 24px rgba(61,240,208,.34), 0 2px 6px rgba(0,0,0,.3)}
.btn.prim:hover{color:#03121A; filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:default}
input,textarea,select{font:inherit; font-size:14px; color:var(--ink);
  background:var(--sunk); border:1px solid var(--rule); border-radius:9px; padding:9px 11px;
  width:100%; transition:border-color .16s}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
code,pre{font-family:"JetBrains Mono",monospace}
pre{background:var(--sunk); border:1px solid var(--rule); border-radius:9px; padding:11px 12px;
  font-size:10.5px; overflow-x:auto; color:var(--ink-2); margin:9px 0; white-space:pre-wrap;
  word-break:break-all; max-height:180px}
a{color:var(--accent); text-underline-offset:3px}

/* ---------- Die grosse Karte oben ----------
   Sie ist der Grund, warum man die App oeffnet: eine Antwort, gross genug, dass man
   sie im Vorbeigehen liest. Der Leuchtrand oben laeuft nur, wenn ein Einstieg
   tatsaechlich erreicht ist — sonst waere das Signal wertlos. */
.hero{position:relative; overflow:hidden; margin-top:18px; padding:18px 19px 17px;
  border-radius:18px; border:1px solid var(--rule-strong); cursor:pointer;
  background:
    radial-gradient(120% 140% at 0% 0%, rgba(43,232,165,.12), transparent 55%),
    linear-gradient(150deg, var(--glass-2), var(--glass));
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), border-color .18s}
.hero.kurz{background:
  radial-gradient(120% 140% at 0% 0%, rgba(255,92,122,.12), transparent 55%),
  linear-gradient(150deg, var(--glass-2), var(--glass))}
.hero{box-shadow:var(--tiefe-hoch)}
.hero:hover{transform:translateY(-3px); border-color:var(--accent);
  box-shadow:0 1px 0 rgba(255,255,255,.09) inset, 0 26px 60px rgba(0,0,0,.55), 0 0 60px rgba(61,240,208,.10)}
.hero::before{content:""; position:absolute; left:0; right:0; top:0; height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);
  opacity:.5}
.hero.jetzt::before{opacity:1; animation:glowline 2.6s ease-in-out infinite}
@keyframes glowline{0%,100%{opacity:.45}50%{opacity:1}}
.hero.jetzt{border-color:rgba(43,232,165,.42); box-shadow:0 0 44px rgba(43,232,165,.13)}
.hero-k{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.hero-k .lbl{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-3)}
.hero-k .lbl2{font-size:9.5px; letter-spacing:.1em; color:var(--accent)}
.hero-k .sc{margin-left:auto; font-size:13px; color:var(--ink-3); font-weight:600}
.hero-t{font-family:"Space Grotesk",Inter,sans-serif; font-weight:700; font-size:23px;
  letter-spacing:-.028em; margin:9px 0 3px; line-height:1.15}
.hero-t .akt{color:var(--long); font-size:16px; font-weight:600; letter-spacing:-.01em;
  display:inline-block; margin-left:6px}
.hero.kurz .hero-t .akt{color:var(--bad)}
.hero-p{margin:2px 0 8px; font-size:13px; color:var(--ink-2)}
.hero-these{margin:0 0 10px; font-size:13px; color:var(--ink-2); line-height:1.5;
  max-width:62ch}
.hero-trig{margin:11px 0 0; font-size:12px; color:var(--ink-2);
  background:var(--accent-soft); border:1px solid rgba(61,240,208,.20);
  border-radius:9px; padding:8px 10px}
.hero-trig b{color:var(--accent); font-family:"JetBrains Mono",monospace; font-size:9px;
  letter-spacing:.16em; text-transform:uppercase; margin-right:6px}
/* Die Unterzeile in den Statuskacheln. */

<script>
'use strict';
/* =====================================================================
   AI TRADING DESK — Client
   Zwei Datenquellen, bewusst getrennt gehalten:
     D    der eingebettete Plan (TSMOM-Regel, Portfolio, Alarme) — Stand des Baus
     S    scan.json, zur Laufzeit geholt — der Gesamtmarkt-Scan
     L    Live-Kurse per Websocket von der Börse — jetzt
   Was live ist, ist mit einem Punkt markiert. Was aus dem Scan stammt, trägt dessen
   Zeitstempel. Eine Seite, die alles gleich aussehen lässt, verleitet dazu, einen
   Stand von vor einer Stunde für den aktuellen Kurs zu halten.
   ===================================================================== */
const D = JSON.parse(document.getElementById('payload').textContent);
const P = D.plan;
let S = null;                 // scan.json
let WL = null;                // watchlist.json — die beobachteten Setups
let AKTIV = null;             // gewähltes Instrument (Detailobjekt)
let AKTIV_TF = 'H4';
const DETAIL = new Map();     // Instrument -> Detaildaten
const L = new Map();          // Instrument -> {p, pct, t}
let WS = null, WS_OK = false, WS_TRY = 0;
let ABONNIERT = new Set();   // Kraken-Paare, die der Livestream schon liefert

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

/* ============================================================ UMLAUTE
   Ein großer Teil der Analysetexte kommt aus dem Scanner (Python) und aus älterem Code,
   der Umlaute als ae/oe/ue schreibt: „laeuft ueber", „Rueckeroberung", „Boersenzeit".
   Ozan, 28.09.: „die Analysen gefallen mir nicht." Beim Durchlesen aller Reiter standen
   über 400 solcher Wörter auf der Seite — das liest sich wie ein Protokoll, nicht wie
   eine Analyse.

   Gelöst wird es an EINER Stelle, beim Anzeigen: jeder sichtbare Textknoten läuft durch
   diese Liste. Bewusst eine Liste von Wortstämmen und keine allgemeine Regel — „aktuell",
   „neue", „Quelle", „Steuer", „Euro", „zuerst", „Issue" bleiben, wie sie sind. Attribute,
   Eingabefelder, Code und der Sync-Text werden nicht angefasst: Schlüssel und Symbole
   müssen Zeichen für Zeichen gleich bleiben. */
const UMLAUT_PAARE = [
  ['ueber','über'],['uebrig','übrig'],['ueblich','üblich'],['rueck','rück'],['laeuf','läuf'],
  ['laess','läss'],['faell','fäll'],['haelt','hält'],['haelft','hälft'],['traeg','träg'],
  ['taeg','täg'],['naechst','nächst'],['schluessel','schlüssel'],['staerk','stärk'],
  ['schwaech','schwäch'],['schoepf','schöpf'],['guenstig','günstig'],['waerts','wärts'],
  ['duenn','dünn'],['hoech','höch'],['hoeh','höh'],['loes','lös'],['baeren','bären'],
  ['baeris','bäris'],['kaeuf','käuf'],['maerkt','märkt'],['haeuf','häuf'],['saetz','sätz'],
  ['schaetz','schätz'],['taet','tät'],['jaehr','jähr'],['kaempf','kämpf'],['brueche','brüche'],
  ['laed','läd'],['oeffn','öffn'],['oeffentl','öffentl'],['pruef','prüf'],['gaeng','gäng'],
  ['boers','börs'],['aender','änder'],['moegl','mögl'],['koenn','könn'],['muess','müss'],
  ['wuerd','würd'],['fuehr','führ'],['frueh','früh'],['glueck','glück'],['stueck','stück'],
  ['lueck','lück'],['buendel','bündel'],['gebuehr','gebühr'],['schuetz','schütz'],
  ['stuetz','stütz'],['nuetz','nütz'],['zueg','züg'],['fuell','füll'],['muenz','münz'],
  ['duerf','dürf'],['haette','hätte'],['aelter','älter'],['spruen','sprün'],['schaeft','schäft'],
  ['kraeft','kräft'],['huerde','hürde'],['faehig','fähig'],['gefaehr','gefähr'],
  ['naemlich','nämlich'],['aehnlich','ähnlich'],['waechter','wächter'],['zaehl','zähl'],
  ['laeng','läng'],['haeng','häng'],['klaer','klär'],['waehl','wähl'],['waehr','währ'],
  ['waehn','wähn'],['haend','händ'],['spaet','spät'],['moecht','möcht'],['gruen','grün'],
  ['naeh','näh'],['hoert','hört'],['hoeren','hören'],['gehoer','gehör'],['gaenz','gänz'],
  ['staend','ständ'],['laend','länd'],['waere','wäre'],
  ['aeuss','äuß'],['ausser','außer'],['groess','größ'],['schliess','schließ'],['heiss','heiß'],
  ['gemaess','gemäß'],['maessig','mäßig'],['fliess','fließ'],
];
const UMLAUT_MAP = new Map();
for (const [a, b] of UMLAUT_PAARE){
  UMLAUT_MAP.set(a, b);
  UMLAUT_MAP.set(a[0].toUpperCase() + a.slice(1), b[0].toUpperCase() + b.slice(1));
}
const UMLAUT_RE = new RegExp([...UMLAUT_MAP.keys()].sort((x, y) => y.length - x.length).join('|'), 'g');
function mitUmlauten(t){
  if (!t || !/ae|oe|ue|ss/.test(t)) return t;
  return t.replace(/\b(da|wo|hier)?([Ff])uer\b/g, (m, vor, f) => (vor || '') + (vor ? 'für' : (f === 'F' ? 'Für' : 'für')))
          .replace(UMLAUT_RE, m => UMLAUT_MAP.get(m) || m);
}
/* Dasselbe für Dezimalpunkte. Der Scanner schreibt „Einstieg bei 529.4", „CRV 1:3.98",
   „1 R = 10.61" — mitten in einer deutschen Seite, deren eigene Zahlen „529,40" heißen.
   Umgeschrieben wird nur, was eindeutig ein Dezimalpunkt ist: ein bis zwei oder vier und
   mehr Nachkommastellen. Genau drei („10.020") kann ein deutscher Tausenderpunkt sein und
   bleibt stehen; Daten („28.09.") und Versionen („v1.2") ebenso.
   Monat.Jahr („01.2023", „07.2025") ist ebenfalls kein Dezimalpunkt — vorher wurde daraus
   „01,2023" (sichtbar auf der Gold-Day-Seite, 11.10.). Erkannt an: zweistelliger Monat
   01–12 und genau vierstelliges Jahr 19xx/20xx. */
const DEZIMAL_RE = /(^|[^\d.,\w])(\d+)\.(\d{1,2}|\d{4,})(?![\d.A-Za-z])/g;
const MONAT_JAHR_RE = /^(0[1-9]|1[0-2])$/;
function deZahlen(t){
  if (!t || t.indexOf('.') < 0) return t;
  return t.replace(DEZIMAL_RE, (m, vor, ganz, bruch) =>
    (MONAT_JAHR_RE.test(ganz) && /^(19|20)\d\d$/.test(bruch)) ? m : vor + ganz + ',' + bruch);
}
function anzeigeText(t){ return deZahlen(mitUmlauten(t)); }
const UMLAUT_NICHT = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'CODE', 'PRE', 'SELECT']);
function umlautKnoten(n){
  for (let e = n.parentElement; e; e = e.parentElement){
    if (UMLAUT_NICHT.has(e.tagName) || e.isContentEditable || (e.dataset && e.dataset.roh != null)) return;
  }
  const neu = anzeigeText(n.data);
  if (neu !== n.data) n.data = neu;
}
function umlauteIn(wurzel){
  if (!wurzel) return;
  if (wurzel.nodeType === 3){ umlautKnoten(wurzel); return; }
  if (wurzel.nodeType !== 1 || UMLAUT_NICHT.has(wurzel.tagName)) return;
  const w = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT);
  const knoten = [];
  while (w.nextNode()) knoten.push(w.currentNode);
  knoten.forEach(umlautKnoten);
}
function umlauteBeobachten(){
  umlauteIn(document.body);

    new MutationObserver(liste => {
      for (const m of liste) for (const n of m.addedNodes) umlauteIn(n);
    }).observe(document.body, {childList: true, subtree: true});
  } catch(e){}
}

function digits(v){ v = Math.abs(v||0);

function num(v, d){ if (v == null || !isFinite(v)) return '—';

function pct(v, k){ if (v == null || !isFinite(v)) return '—';

/* ---- Euro, Broker, Gebuehr -------------------------------------------------
   Ozan handelt Einzelaktien ueber Trade Republic — dort stehen sie in Euro, und
   jede Ausfuehrung kostet 1 €. Ein Signal mit Dollarkursen ist fuer ihn nicht
   ausfuehrbar, und bei einer Position von 300 € frisst die Gebuehr hin und zurueck
   ein Drittel eines Zwei-Prozent-Gewinns. Beides gehoert neben das Signal. */
function istAktie(o){ return (o && o.klasse) === 'aktien'; }
function eurWert(o, feld){ return (o && o.eur && o.eur[feld] != null) ? o.eur[feld] : null; }
/* Waehrungszeichen aus der Zeile, nicht geraten.
   Seit Krypto ueber Kraken in EURO gescannt wird, sind die Rohzahlen bei Krypto und
   Gold schon Euro — bei Aktien bleiben sie Dollar, und nur dort wird umgerechnet.
   Eine Zahl ohne Waehrung ist bei einem Kaufsignal keine Kleinigkeit. */
/* Das Zeichen gehoert zur ZAHL, nicht zum Wunsch.
   Eine Aktie notiert in Dollar und wird in Euro gekauft — steht der Eurokurs nicht zur
   Verfuegung, ist die Zahl daneben eine Dollarzahl und bekommt ein Dollarzeichen. */
function zeichen(o){
  const w = (o && o.waehrung) || '';
  if (w === 'EUR') return ' €';
  if (w === 'USDT') return ' USDT';
  return ' $';
}
/* Welche Zahl gross dasteht, entscheidet die AUSFUEHRUNG, nicht der Geschmack.
   Aktien laufen ueber Trade Republic und dort gibt es nur Euro — also Euro.
   Krypto kauft Ozan im Dollarmarkt, weil der tiefer ist — also Dollar, mit dem
   Euro-Gegenwert einmal pro Karte daneben. Eine Zahl in der falschen Waehrung ist bei
   einer Order kein Schoenheitsfehler. */
function preis(o, feld, fallback, d){
  if (istAktie(o)){
    const e = eurWert(o, feld);
    if (e != null) return `${num(e,d)} €`;
  }
  return num(fallback, d) + zeichen(o);
}
/* Der Euro-Gegenwert als eine Zeile, nicht an jeder Zahl. */
function eurHinweis(o){
  if (!o || istAktie(o)) return '';
  const e = eurWert(o, 'kurs');
  if (e == null || !o.eurusd) return '';
  const d = digits(e);
  return `<span style="color:var(--ink-3)">≈ ${num(e,d)} € bei ${num(o.eurusd,4)} $/€</span>`;
}
function gebuehrSatz(o, positionswert){
  if (!positionswert || positionswert <= 0) return '';
  const gewinnPct = o && o.erwartete_bewegung_pct;
  if (!gewinnPct || gewinnPct <= 0) return '';
  const kosten = istAktie(o) ? 2 : positionswert * 0.002;
  const gewinn = positionswert * gewinnPct / 100;
  const anteil = kosten / gewinn;
  const txt = `Gebühr hin und zurück ${kosten.toFixed(2).replace('.',',')} ${istAktie(o)?'€':'USDT'}`;
  return anteil >= 0.2
    ? `<span style="color:var(--warn)">${txt} — ${Math.round(anteil*100)} % des erwarteten Gewinns. Entweder größer einsteigen oder lassen.</span>`
    : `${txt} (${Math.round(anteil*100)} % des erwarteten Gewinns).`;
}

/* Die Börse liefert die Kurse direkt an den Browser. Kein eigener Server, keine
   Zwischenspeicherung, kein Schlüssel — es ist der öffentliche Marktdaten-Stream.
   Aktien haben GRUNDSÄTZLICH kein frei zugängliches Live-Feed mit CORS und bleiben auf
   dem Stand des Scans — AUSSER Kraken fuehrt fuer genau diese Aktie einen tokenisierten
   Markt mit Status "online" (siehe ``kraken_live`` weiter unten, 11.10.): dann kommt der
   Kurs genauso live wie bei Krypto, nur eben ueber den tokenisierten statt den echten
   Aktienmarkt. */
/* Ozan, 11.10. 17:18: "Kraken hat jetzt auch die Option ... mit Aktien zu handeln ...
   du muesstest die eigentlich auch dort alle sehen." Der Scan markiert eine Aktienzeile
   mit ``kraken_live`` (dem Kraken-WebSocket-Paarnamen, z.B. "AAPLx/USD"), aber NUR wenn
   Kraken dafuer wirklich einen laufenden, beidseitig liquiden Markt fuehrt ("online" —
   siehe ``_kraken_xstocks_anhaengen`` im Scan-Lauf; die meisten Aktien sind bei Kraken
   nur "post_only" oder fehlen ganz und bleiben bewusst beim Yahoo-Scanstand). Diese
   zwei Tabellen uebersetzen zwischen dem Instrumentnamen, den die App ueberall benutzt
   ("AAPL"), und dem Kraken-Paarnamen ("AAPLx/USD") — in beide Richtungen, weil
   ``krakenPaar`` beim Abonnieren die eine Richtung braucht und ``ausKrakenPaar`` beim
   Einsortieren eines eingehenden Live-Ticks die andere. */
let XSTOCK_PAAR = new Map();       // "AAPL" -> "AAPLx/USD"
let XSTOCK_PAAR_RUECK = new Map(); // "AAPLXUSD" (Paar, Grossbuchstaben, ohne "/") -> "AAPL"

function kryptoSymbole(){
  if (!S) return [];
  const aus = [];
  const gesehen = new Set();
  const dazu = x => { const k = String(x||'').toUpperCase(); if (k && !gesehen.has(k)){ gesehen.add(k); aus.push(k); } };
  XSTOCK_PAAR = new Map();
  XSTOCK_PAAR_RUECK = new Map();
  const merkeXstock = o => {
    if (!o || !o.kraken_live) return;
    const sym = String(o.instrument||'').toUpperCase();
    if (!sym) return;
    XSTOCK_PAAR.set(sym, o.kraken_live);
    XSTOCK_PAAR_RUECK.set(String(o.kraken_live).toUpperCase().replace('/',''), sym);
  };
  /* Das eigene Depot ZUERST. Bis 30.09. wurden nur die ersten 90 Werte des Scans
     abonniert — in der Reihenfolge des Scans. Eine Position, die dort weiter hinten
     stand (oder gar nicht, weil der Coin gerade durch den Liquiditaetsfilter fiel), bekam
     nie einen Livekurs und stand auf dem Stand des letzten Scans, bis zu 20 Minuten alt.
     Genau die Kurse, auf die es am meisten ankommt. */
  for (const d of depotKryptoSymbole()) dazu(d);
  // GROSS, nicht klein: Kraken meldet die Symbole gross zurueck, und der Livespeicher
  // wird an anderer Stelle mit dem Instrumentnamen aus dem Scan abgefragt.
  for (const o of (S.gesamt||[])){
    if (o.klasse === 'krypto' || o.klasse === 'gold') dazu(o.instrument);
    else if (o.klasse === 'aktien' && o.kraken_live){ merkeXstock(o); dazu(o.instrument); }
  }
  return aus.slice(0, 180);
}
function depotKryptoSymbole(){
  const aus = [];
  let pos = [];
  try { pos = ladePositionen(); } catch(e){ return aus; }
  for (const p of pos){
    if (!p || !p.sym) continue;
    try { if (istSchein(p)) continue; } catch(e){}
    const row = scanRow(p.sym);
    if (row){
      if (row.klasse === 'krypto' || row.klasse === 'gold') aus.push(row.instrument);
      // Aktien im Depot mit Kraken-Live-Kurs werden ueber die obere Schleife in
      // kryptoSymbole() erfasst (S.gesamt) — hier reicht normales Krypto/Gold, denn
      // XSTOCK_PAAR wird erst dort befuellt, bevor kryptoSymbole() zurueckgibt.
    } else if (/(USDT|USDC|USD|EUR)$/i.test(String(p.sym))){
      // Nicht im Scan (zu duenn, ausgelistet) — Kraken versuchen wir trotzdem.
      aus.push(p.sym);
    }
  }
  return aus;
}
function setzeLiveChip(an, text){
  const el = $('livechip');
  el.className = 'chip ' + (an ? 'live' : 'tot');

function starteLive(){
  const syms = kryptoSymbole();
  KRYPTO_NAMEN_LIVE = new Set(syms);
  if (!syms.length) { setzeLiveChip(false,'keine Krypto-Werte'); return; }
  if (WS) { try{ WS.close(); }catch(e){} }
  setzeLiveChip(false,'verbinde …');
  /* Kraken statt Binance.
     Der Livestream muss dieselbe Boerse sein wie die Analyse, sonst zeigt die Karte
     einen Kurs, zu dem hier niemand kaufen kann — und bei EUR-Paaren waere der
     Unterschied nicht nur Rauschen, sondern der ganze Wechselkurs.
     Kraken verlangt anders als Binance ein Abonnement je Symbol, in der Schreibweise
     "BTC/EUR". */
  let url;
  try { url = 'wss://ws.kraken.com/v2'; WS = new WebSocket(url); }
  catch(e){ setzeLiveChip(false,'kein Livestream'); return; }
  WS.onopen = ()=>{
    WS_OK = true; WS_TRY = 0; setzeLiveChip(true,'live');
    const paare = [...new Set(syms.slice(0,120).map(krakenPaar).filter(Boolean))];
    ABONNIERT = new Set(paare);
    if (paare.length) try {
      WS.send(JSON.stringify({method:'subscribe', params:{channel:'ticker', symbol:paare}}));
    } catch(e){}
  };
  WS.onerror = ()=>{ if(!WS_OK) setzeLiveChip(false,'Stream blockiert'); };
  WS.onclose = ()=>{
    WS_OK = false; setzeLiveChip(false,'getrennt');
    if (WS_TRY++ < 6) setTimeout(starteLive, Math.min(30000, 2000 * Math.pow(2, WS_TRY)));
  };
  WS.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (!m || m.channel !== 'ticker' || !Array.isArray(m.data)) return;
    let neu = false;
    for (const t of m.data){
      const sym = ausKrakenPaar(t.symbol);
      const p = parseFloat(t.last);
      if (!sym || !isFinite(p)) continue;
      const pct = (t.change_pct != null && isFinite(parseFloat(t.change_pct)))
        ? parseFloat(t.change_pct) : null;
      L.set(sym, {p, pct, t: Date.now()});
      neu = true;
    }
    if (neu) planeAuffrischen();
  };
}

   Daten gebaut hat (Backend-Luecken > 15 Minuten wurden fuer den fraglichen Tag per
   CI-Protokoll ausgeschlossen; der Service Worker cached bewusst nichts). Der
   eigentliche Fehler: nichts in dieser Seite hat je nachgesehen, ob sie noch sichtbar
   ist. ``setInterval`` und die Kraken-WebSocket-Verbindung werden von mobilen Browsern
   (vor allem iOS-Safari-PWAs) gedrosselt oder ganz angehalten, solange die Seite im
   Hintergrund liegt — kommt das Handy zurueck, zeigt die App weiter den letzten Stand
   von vor der Pause, bis zufaellig der naechste Fuenf-Minuten-Tick faellig ist (der
   aber selbst gedrosselt gewesen sein kann) oder man von Hand neu laedt. Deshalb jetzt:
   sobald die Seite wieder sichtbar wird (Tab-Wechsel, App aus dem Hintergrund,
   Bildschirm an), sofort ``ladeScan()`` — das holt alle Dateien frisch
   (``cache:'no-store'``) und baut am Ende ohnehin die WebSocket-Verbindung neu auf
   (``starteLive()``), falls die alte inzwischen stillschweigend gestorben ist. Eine
   kurze Sperre verhindert nur, dass ein und dasselbe "wieder sichtbar"-Ereignis (mehrere
   Browser feuern dafuer mehr als ein Event gleichzeitig: ``visibilitychange``,
   ``pageshow`` UND ``focus``) zwei- oder dreimal hintereinander denselben Ladevorgang
   ausloest. */
let _letzteSichtbarkeitsLadung = 0;
function beiSichtbarkeitRueckkehr(){
  if (document.visibilityState !== 'visible') return;
  const jetzt = Date.now();
  if (jetzt - _letzteSichtbarkeitsLadung < 5000) return;
  _letzteSichtbarkeitsLadung = jetzt;
  ladeScan();
}

/* "BTCUSD" <-> "BTC/USD". Kraken v2 spricht bereits BTC und nicht mehr XBT.
   Seit der Scan den Dollarmarkt bevorzugt, muessen beide Endungen erkannt werden —
   sonst liefe der Livestream leer, waehrend die Karten Dollarpreise zeigen. */
function krakenPaar(sym){
  const s = String(sym||'').toUpperCase();
  // Kraken-xStocks ZUERST: "AAPL" hat keine der Krypto-Endungen unten, die generische
  // Erkennung wuerde also ohnehin null liefern — aber auch wenn ein kuenftiges
  // Aktienkuerzel zufaellig auf "USD" o.ae. endet, soll ein bekannter xStock-Eintrag
  // immer gewinnen statt falsch als Krypto-Paar geraten zu werden.
  if (XSTOCK_PAAR.has(s)) return XSTOCK_PAAR.get(s);
  for (const q of ['USDT','USDC','USD','EUR']){
    if (s.endsWith(q) && s.length > q.length){
      // Kraken kennt kein USDT-Paar fuer die meisten Coins — dort dann USD.

}
function ausKrakenPaar(paar){

/* Eine Meldung auf den Bildschirm — auch auf dem iPhone.

   Bis 01.10. stand hier überall ``new Notification(...)``. Safari auf dem iPhone kennt
   diesen Konstruktor in einer Home-Bildschirm-App nicht: er wirft, und weil jeder Aufruf
   in try/catch steckt, verschwand die Meldung still — die App „war aktiviert" und
   meldete trotzdem nichts. Der Weg, den iOS kennt, ist die Meldung über den Service
   Worker (``registration.showNotification``). Erst dorthin, nur als Rückfall der alte Weg. */
function meldung(titel, opts){
  const o = Object.assign({icon:'icon.png', badge:'icon.png', data:{url:location.href}}, opts || {});
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  } catch(e){ return; }
  const alt = () => { try { new Notification(titel, o); } catch(e){} };
  try {
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(reg => {
        if (reg && reg.showNotification) reg.showNotification(titel, o).catch(alt);
        else alt();
      }).catch(alt);
      return;
    }
  } catch(e){}
  alt();
}

/* ============================== ALARM FUER DIE HANDLUNG IM DEPOT

   „Ich will auch Alarme bekommen, wenn er sagt verkauf das aus meinem Depot oder geh
   mehr rein."

   Das ist etwas anderes als die Alarme darunter. Die melden feste Marken: Stop gerissen,
   Ziel erreicht. Hier meldet sich die EINSCHAETZUNG, sobald sie eine Handlung verlangt —
   ein Wert, der zum Schlusslicht seiner Klasse geworden ist, ein Klumpen, der zu gross
   geworden ist, ein Wert, der stark ist und gerade ein Setup hat.

   Drei Regeln gegen Laerm, weil Ozan zu Recht empfindlich darauf ist:
     * „Halten" meldet sich nie. Nichtstun ist keine Nachricht.
     * Jede Handlung meldet sich einmal je Wert, und der Schluessel enthaelt die Art —
       aus Beobachten wird Verkaufen, das ist eine neue Nachricht; zweimal dasselbe
       nicht. Die Sperre liegt auf der Platte und ueberlebt jeden Neustart.
     * Aus einem toten Scan kommt gar nichts. Eine Handlungsaufforderung auf Basis von
       Zahlen von gestern Abend ist schlimmer als keine. */

  if (!S || scanTot()) return;
  const stand = depotStand();
  if (!stand || !stand.bew.length) return;
  for (const b of stand.bew){

    try { a = positionsAktion(b, stand); } catch(e){ continue; }
    if (!a || a.art === 'halten') continue;
    // Stop und Ziel meldet bereits pruefeDepotAlarme — nicht zweimal fuer dieselbe Sache.
    if (a.art === 'raus' || (a.art === 'teilverkauf' && /erreicht/.test(a.titel))) continue;
    const key = 'aktion:' + b.pos.sym + ':' + a.art;

        ? `${a.art==='nachlegen'?'Kaufen':'Verkaufen'}: ${num(a.menge, a.menge<1?4:2)} ≈ ${num(a.euro,0)} €. `
        : '';

/* ================================================ STILLSTAND — ALARM

/* =========================================== VERKAUFEN — ALARM FUERS DEPOT

   „Wenn ich bei meinem Portfolio was verkaufen soll, will ich auch direkt einen Alarm."

   Genau das. Der Scanner meldet Einstiege; was danach passiert, stand bisher nur im
   Depot-Reiter und nur, wenn man ihn aufmacht. Hier wird bei jedem Kurs geprueft, ob
   eine EIGENE Position ihren Stop oder ein Ziel erreicht hat — und dann meldet es sich.

   Die Sperre liegt auf der Platte, nicht im Arbeitsspeicher: sonst meldet die App
   dieselbe Sache bei jedem Neustart wieder. Und es meldet sich NUR, was zu tun ist —
   „halten" ist kein Alarm. */
function pruefeDepotAlarme(){
  let pos;
  try { pos = ladePositionen(); } catch(e){ return; }
  if (!pos.length) return;
  for (const p of pos){

    try { b = bewertePosition(p); } catch(e){ continue; }
    const schritt = naechsterSchritt(p, planKurs(b), b.w);
    if (!schritt || (schritt.stufe !== 'stop' && schritt.stufe !== 'ziel')) continue;
    // Ein alter, zu enger Setup-Stop wird erst korrigiert (stopsPflegen), nicht gemeldet.
    const pl0 = p.plan || {};
    if (schritt.stufe === 'stop' && pl0.art !== 'halte' && pl0.art !== 'einstand' && pl0.quelle === 'app' && !pl0.gekauft && !pl0.korrigiert) continue;
    const key = 'verkauf:' + p.sym + ':' + (schritt.marke || 'stop');
    if (gemeldetLaden()[key]) continue;
    gemeldetMerken(key);
    try {
      if (typeof Notification === 'undefined' || Notification.permission !== 'granted') continue;
      meldung(`VERKAUFEN · ${name(p.sym)}`, {body: schritt.titel + ' — ' + schritt.text, tag: key});
    } catch(e){}
  }
}

/* ==================================== URTEILSWECHSEL IM DEPOT — ALARM

   „Das Portfolio soll auch immer neu bewertet werden."

   Der Ausstiegsplan oben meldet sich, wenn eine feste Marke erreicht ist — Stop, Ziel.
   Aber die haeufigere Art, wie eine Position schlecht wird, ist leiser: die Struktur
   traegt nicht mehr, der Score faellt, und das steht nur im Depot-Reiter, wenn man ihn
   aufmacht. Genau solche Positionen liegen dann wochenlang herum.

   Hier wird deshalb das URTEIL selbst beobachtet. Gemeldet wird nur die Verschlechterung
   in eine Stufe, die eine Entscheidung verlangt — und jede Stufe nur einmal, bis sie

   keine Nachricht, sondern Laerm. */

/* ============================================ WICHTIGE TERMINE — ALARM

   Eine Zinsentscheidung oder ein Arbeitsmarktbericht bewegt den ganzen Markt, und zwar
   in Minuten. Das ist der zweite Fall, in dem eine Meldung wirklich etwas aendert:
   nicht „kauf jetzt", sondern „in einer Stunde ist Fed — heute nichts Neues aufmachen".

   Gemeldet wird nur, was wirklich schwer wiegt (Wirkung High) und nur einmal je Termin. */
function pruefeTerminAlarme(){
  const termine = (S && S.makro && S.makro.termine) || [];

      meldung(`In ${Math.round(min)} Min: ${t.titel} (${t.land})`, {
        body: 'Wichtiger Termin. Bis er durch ist, nichts Neues aufmachen — und bei '
            + 'laufenden Positionen den Stop im Blick behalten.', tag: key});
    } catch(e){}
  }
}
