        <div class="n">${PF.abgeschlossen} abgeschlossen · ${PF.offen} offen</div></div>
      <div><div class="k">je Trade</div>
        <div class="v ${minus?'':'gut'}" style="${minus?'color:var(--bad)':''}">${(g.erwartungswert||0).toFixed(2)}</div>
        <div class="n">Erwartungswert in R</div></div>
      <div><div class="k">Treffer</div>
        <div class="v ${(g.trefferquote||0)>=0.4?'gut':'mittel'}">${Math.round((g.trefferquote||0)*100)} %</div>
        <div class="n">mit Teilverkauf ${Math.round((d.trefferquote||0)*100)} %</div></div>
      <div><div class="k">Rückgang</div>
        <div class="v mittel">${(g.max_rueckgang_r||0).toFixed(1)} R</div>
        <div class="n">längste Serie ${g.verlustserie||0}</div></div>
    </div>
    ${handyZeile()}
    <ul class="satzliste" style="margin-top:14px">${(PF.saetze||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  </div>`;
}

/* Was Ozan wirklich gesehen hat: die Einstiege, die aufs Telefon gingen — getrennt von
   allem, was nur in der App stand. Dazu, was NICHT gezaehlt wird (nie ausgeloest,
   Kursausfall mitten im Trade), damit keine Zahl ohne ihren Nenner dasteht. */
function handyZeile(){
  const m = (PF && PF.je_meldung) || {};
  const h = m.aufs_handy, a = m.nur_app;
  const teile = [];
  const eine = (k, v) => {
    if (!v || !v.anzahl) return;
    const s = v.summe_r || 0;
    teile.push(`<span>${k} <b class="${s>0?'up':s<0?'dn':''}">${s>0?'+':''}${s.toFixed(1)} R</b>
      <span style="color:var(--ink-3)">${v.anzahl}× · ${Math.round((v.trefferquote||0)*100)} % im Plus</span></span>`);
  };
  eine('Aufs Handy', h);
  eine('Nur in der App', a);
  if (PF.nicht_ausgeloest) teile.push(`<span style="color:var(--ink-3)">${PF.nicht_ausgeloest} nie ausgelöst</span>`);
  if (PF.ohne_ergebnis) teile.push(`<span style="color:var(--warn)">${PF.ohne_ergebnis} ohne Ergebnis</span>`);
  return teile.length ? `<div class="zt" style="margin-top:12px">${teile.join('')}</div>` : '';
}


/* ---- "Gekauft" ------------------------------------------------------------
   Ozans Wunsch, woertlich: "mach so einen Button, dass ich dann eingeben kann, wie
   viel ich gekauft hab und dass er dann das automatisch mein Portfolio hier mit
   ausschreibt. Das ist nicht alles immer extern machen muss."

   Die Vorschlagswerte kommen aus dem Signal — Stueckzahl aus der Risikorechnung,
   Kurs aus dem Plan. Er kann beides ueberschreiben, denn ausgefuehrt wird selten
   exakt zum geplanten Kurs, und was im Depot steht, muss der WIRKLICHE Einstieg
   sein. Ein Depot mit Wunschkursen rechnet sich selbst schoen. */
function kaufDialog(sym, mengeVorschlag, kursVorschlag){
  const alt = document.getElementById('kaufbox');
  if (alt) alt.remove();
  const box = document.createElement('div');
  box.id = 'kaufbox';
  box.className = 'modal';
  const q = scanRow(sym) || {};
  const pl = q.plan || {};
  const plan = {
    richtung: q.richtung || 'long',
    stop: pl.stop ?? q.invalidierung ?? null,
    tp1: pl.tp1 ?? q.ziel ?? null,
    tp2: pl.tp2 ?? q.tp2 ?? null,
    tp3: pl.tp3 ?? q.tp3 ?? null,
    waehrung: q.waehrung || '',
    klasse: q.klasse || '',
    note: q.note || '',
    setup: (q.setup && q.setup.name) || '',
    gekauft: new Date().toISOString(),
  };
  const zt = [plan.tp1, plan.tp2, plan.tp3].filter(v=>v!=null);
  box.innerHTML = `<div class="modalk">
    <h3 style="margin-top:0">${esc(name(sym))} ins Depot</h3>
    ${plan.stop!=null?`<div class="note-box" style="margin:0 0 12px"><span class="nt">Dein Ausstiegsplan wird mitgespeichert</span>
      <p style="margin:0">Stop <strong>${num(plan.stop, digits(plan.stop))}</strong>${
        zt.length?` · Ziele <strong>${zt.map(v=>num(v,digits(v))).join(' / ')}</strong>`:''}.
      Ab jetzt steht im Depot bei jedem Kurs, was als Nächstes zu tun ist.</p></div>`:''}
    <p style="font-size:12.5px;color:var(--ink-2);margin:0 0 12px">Trag ein, was du
    <strong>tatsächlich</strong> bekommen hast — nicht den geplanten Kurs. Sonst rechnet
    sich das Depot selbst schön.</p>
    <div class="rowx"><span class="lab">Stück</span>
      <input id="k_menge" inputmode="decimal" value="${esc(mengeVorschlag||'')}" style="width:55%"></div>
    <div class="rowx"><span class="lab">Kurs</span>
      <input id="k_kurs" inputmode="decimal" value="${esc(kursVorschlag||'')}" style="width:55%"></div>
    <div class="rowx"><span class="lab">Konto</span>
      <input id="k_konto" placeholder="Trade Republic / Bybit" style="width:55%"></div>
    <p style="margin:14px 0 0"><button class="btn prim" id="k_ok">Übernehmen</button>
      <button class="link" id="k_ab" style="margin-left:14px">Abbrechen</button></p>
  </div>`;
  document.body.appendChild(box);
  const zu = ()=>box.remove();
  box.addEventListener('click', e=>{ if (e.target === box) zu(); });
  document.getElementById('k_ab').addEventListener('click', zu);
  document.getElementById('k_ok').addEventListener('click', ()=>{
    const menge = parseFloat((document.getElementById('k_menge').value||'').replace(',','.'));
    const kurs  = parseFloat((document.getElementById('k_kurs').value||'').replace(',','.'));
    if (!isFinite(menge) || menge <= 0) return;
    const a = ladePositionen().filter(p=>p.sym !== sym);
    a.push({sym, menge, einstieg: isFinite(kurs)?kurs:null,
            konto: (document.getElementById('k_konto').value||'').trim(),
            plan, erledigt: [], seit: Date.now()});
    speicherePositionen(a);
    zu();
    zeichnePortfolio();
    zeigeTab(3);
  });
}

/* ---- Signal-Historie ------------------------------------------------------
   "Ich möchte auf der Seite noch mal eine Extraseite haben, wo ich dann sehe, wie die
   zum Beispiel ausgegangen sind, wie viel Plus oder Minus die Trades gemacht hätten."

   Genau das. Jedes abgeschlossene Signal einzeln, jüngstes zuerst, mit dem Ergebnis
   nach beiden Ausstiegsregeln — damit sichtbar bleibt, was der Teilverkauf ausmacht.
   Keine Auswahl, keine Bestenliste: es stehen ALLE da, auch die schlechten. Eine
   Historie, aus der man die Verlierer herausnimmt, ist Werbung. */
function historieKasten(){
  const t = (PF && PF.trades) || [];
  if (!t.length) return '';
  const zeilen = t.slice(0, 60).map(x=>{
    const gut = x.r_ganz > 0, schlecht = x.r_ganz < 0;
    const farbe = gut ? 'var(--long)' : schlecht ? 'var(--bad)' : 'var(--ink-3)';
    let ausgang = {stop:'Stop', ziel_erreicht:'Ziel', invalidiert:'ungültig', abgelaufen:'abgelaufen'}[x.zustand] || x.zustand;
    // Nicht gezaehlte Zeilen bleiben sichtbar, aber als das, was sie sind.
    if (x.eingestiegen === false) ausgang = 'nie ausgelöst';
    else if (x.gezaehlt === false) ausgang = 'Kursausfall';
    const blass = x.gezaehlt === false ? ' style="opacity:.5"' : '';
    const handy = x.gemeldet ? ' <span class="mini-tag" title="ging aufs Handy">ALARM</span>' : '';
    return `<tr${blass}>
      <td class="tf">${esc(name(x.instrument))}${handy}</td>
      <td>${esc(x.note)}</td>
      <td>${esc(ausgang)}${(x.erreicht||[]).length?` <span style="color:var(--ink-3)">${x.erreicht.join(',')}</span>`:''}</td>
      <td style="color:${farbe};font-weight:600">${x.r_ganz>0?'+':''}${x.r_ganz.toFixed(2)} R</td>
      <td style="color:${x.r_drittel>0?'var(--long)':x.r_drittel<0?'var(--bad)':'var(--ink-3)'}">${x.r_drittel>0?'+':''}${x.r_drittel.toFixed(2)} R</td>
      <td class="mono" style="color:var(--ink-3);font-size:11px">${esc((x.beendet||'').slice(5,16).replace('T',' '))}</td>
    </tr>`;
  }).join('');
  return `<h2>Wie die Signale ausgegangen sind</h2>
  <p class="lead">Jedes abgeschlossene Signal einzeln, das jüngste zuerst — auch die
  schlechten. <strong>Ganz</strong> ist alles-oder-nichts, <strong>Drittel</strong> mit
  Teilverkauf am ersten Ziel und Stop auf Einstand. <span class="mini-tag">ALARM</span> = ging aufs Handy. Blasse Zeilen
  zählen nicht: <em>nie ausgelöst</em> heißt, der Einstieg kam nie; <em>Kursausfall</em>
  heißt, der Wächter hat den laufenden Trade mangels Kurs geschlossen — Ausgang unbekannt.</p>
  <div class="tw"><table class="mtf">
    <tr><th>Wert</th><th>Note</th><th>Ausgang</th><th>Ganz</th><th>Drittel</th><th>Beendet</th></tr>
    ${zeilen}
  </table></div>
  ${t.length>60?`<p class="leer">… und ${t.length-60} ältere.</p>`:''}`;
}

/* ============================================================ BILANZ

   Eine eigene Seite, weil Ozan ausdruecklich danach gefragt hat: er will sehen, wie die
   Signale ausgegangen sind, die ihm angezeigt wurden — wie viel Plus oder Minus sie
   gebracht haetten. Vorher stand das unten im System-Reiter zwischen Laufzeitzahlen,
   wo es niemand sucht. Genau das ist die Zahl, die man sehen muss, bevor man dem
   naechsten Signal glaubt.                                                           */
function quotenKasten(){
  const q = (PF && PF.quoten) || null;
  if (!q) return '';
  const zeilen = Object.keys(q)
    .filter(k => k !== 'alle' && q[k].n >= 5)
    .sort((a,b) => q[b].n - q[a].n)
    .map(k => {
      const v = q[k];
      const wie = k.startsWith('note:') ? 'Note ' + k.slice(5)
                : k.startsWith('setup:') ? k.slice(6).replace('|note:', ' · Note ').replace(/_/g,' ')
                : k;
      const farbe = v.schnitt_r > 0 ? 'var(--long)' : v.schnitt_r < 0 ? 'var(--bad)' : 'var(--ink-3)';
      return `<tr>
        <td class="tf">${esc(wie)}</td>
        <td>${v.n}</td>
        <td>${Math.round(v.tp1*100)} %</td>
        <td>${Math.round(v.stop*100)} %</td>
        <td style="color:${farbe};font-weight:600">${v.schnitt_r>0?'+':''}${v.schnitt_r.toFixed(2)} R</td>
        <td style="color:var(--ink-3);font-size:11px">${v.belastbar?'belastbar':'zu wenige'}</td>
      </tr>`;
    }).join('');
  const a = q.alle;
  return `<h2>Trefferquoten</h2>
  <p class="lead">Das ist die Tabelle, aus der die Zeile <em>„traf bisher … %"</em> auf
  jeder Signalkarte kommt. Sie zählt, wie oft frühere Signale derselben Art das erste
  Ziel erreicht haben — <strong>gezählte Vergangenheit, keine Vorhersage</strong>. Alle
  Signale zusammen: ${a?`${Math.round(a.tp1*100)} % erreichten das erste Ziel,
  ${Math.round(a.stop*100)} % liefen in den Stop, aus ${a.n} Fällen`:'—'}.</p>
  <div class="tw"><table class="mtf">
    <tr><th>Gruppe</th><th>Fälle</th><th>1. Ziel</th><th>Stop</th><th>Ø Ergebnis</th><th></th></tr>
    ${zeilen || '<tr><td colspan="6" style="color:var(--ink-3)">Noch keine Gruppe mit genug Fällen.</td></tr>'}
  </table></div>`;
}

function zeichneNews(){

/* Wie lange die Signale wirklich laufen — die Antwort auf „ich will auch kurze Trades".
   Die Zahl überrascht: die meisten SIND kurz. Was sich lang anfühlt, ist die Wartezeit
   auf den Einstieg und das, was im Depot liegt. */
function dauerKasten(){
  const D = PF && PF.dauer;
  if (!D || !D.median_h) return '';
  const kurz = Math.round((D.kurz_anteil || 0) * 100);
  const noten = Object.entries(D.je_note || {})
    .sort((a,b)=>a[1].median_h - b[1].median_h);
  const kl = D.je_klasse || {};
  const NAME_KLASSE = {krypto:'Coins', aktien:'Aktien', gold:'Gold'};
  const klassen = Object.entries(kl).sort((a,b)=>a[1].median_h - b[1].median_h);
  const kurzeste = klassen[0], laengste = klassen[klassen.length-1];
  return `<h2>Wie lange ein Signal läuft</h2>
  <div class="karte">
    <div class="kpi">
      <span>Median <b>${dauerText(D.median_h)}</b></span>
      <span>binnen ${dauerText(D.kurz_bis_h)} entschieden <b class="${kurz>=50?'up':''}">${kurz} %</b></span>
      ${D.median_verlust_h!=null?`<span>Verluste nach <b class="dn">${dauerText(D.median_verlust_h)}</b></span>`:''}
      ${D.median_gewinn_h!=null?`<span>Gewinne nach <b class="up">${dauerText(D.median_gewinn_h)}</b></span>`:''}
      <span>gemessen an <b>${D.faelle}</b> Signalen</span>
    </div>
    ${klassen.length?`<div class="zt" style="margin-top:8px">${klassen.map(([n,v])=>
      `<span>${esc(NAME_KLASSE[n]||n)} <b>${dauerText(v.median_h)}</b> <span style="color:var(--ink-3)">${v.faelle}×</span></span>`
      ).join('')}</div>`:''}
    ${noten.length?`<div class="zt" style="margin-top:6px">${noten.map(([n,v])=>
      `<span>${esc(n)} <b>${dauerText(v.median_h)}</b> <span style="color:var(--ink-3)">${v.faelle}×</span></span>`
      ).join('')}</div>`:''}
    ${(kurzeste && laengste && kurzeste[0] !== laengste[0])?`
    <p style="margin:9px 0 0;font-size:13px"><strong>Die kurzen Trades gibt es schon —
      es sind die Coins.</strong> ${esc(NAME_KLASSE[kurzeste[0]]||kurzeste[0])} brauchen im Median
      ${dauerText(kurzeste[1].median_h)} bis zur Entscheidung, ${esc(NAME_KLASSE[laengste[0]]||laengste[0])}
      ${dauerText(laengste[1].median_h)}. Wer kurz will, filtert also nicht nach einem neuen
      Signaltyp, sondern nimmt die Krypto-Seite.</p>`:''}
    <p style="margin:9px 0 0;font-size:12.5px;color:var(--ink-2)">
      Gemessen von dem Moment, in dem ein Signal auf die Wachliste kommt, bis es
      entschieden ist — Wartezeit auf den Einstieg eingerechnet, weil sie dazugehört.
      ${kurz} % sind binnen ${dauerText(D.kurz_bis_h)} durch. Was sich nach
      „läuft wochenlang" anfühlt, sind meist die Kandidaten unter „Kaufen ab …", die auf
      ihren Einstieg warten, und die Positionen im Depot — nicht die Signale selbst.</p>
    ${D.median_gewinn_h==null?`<p style="margin:7px 0 0;font-size:12.5px;color:var(--warn)">
      Für Gewinne steht hier nichts, weil es noch keinen abgeschlossenen Gewinner gibt.
      Das ist die ehrliche Version — eine Zahl stünde hier sonst nur der Vollständigkeit
      halber.</p>`:''}
  </div>`;
}

function zeichneBilanz(){
  let h = bilanzKasten();
  h += dauerKasten();
  h += quotenKasten();
  h += historieKasten();
  if (!PF) h += `<div class="note-box"><span class="nt">Noch keine Auswertung</span>
    <p>Die Bilanz entsteht im Tageslauf aus der Wachliste. Solange kein Signal
    abgeschlossen ist, gibt es hier nichts zu zeigen — und dann steht hier nichts,
    statt einer geschoenten Null.</p></div>`;
  $('bilanz').innerHTML = h;
}

/* ============================================================ SYSTEM */
function zeichneSystem(){
  const u = S?.universum || {};
  const k = u.krypto || {};
  let h = `<h2>Letzter Scan</h2><div class="karte">
    <div class="rowx"><span class="lab">Zeitpunkt</span><span class="val">${zeit(S?.erzeugt)}</span></div>
    <div class="rowx"><span class="lab">Dauer</span><span class="val">${S?.dauer_s??'—'} s</span></div>
    <div class="rowx"><span class="lab">Profil</span><span class="val">${esc(S?.profil||'—')}</span></div>
    <div class="rowx"><span class="lab">Instrumente</span><span class="val">${(S?.gesamt||[]).length}</span></div>
    <div class="rowx"><span class="lab">Detailansichten</span><span class="val">${(S?.detail_vorhanden||[]).length}</span></div>
  </div>`;
  if (k.gesamt){
    h += `<h2>Krypto-Universum</h2><div class="karte">
      <div class="rowx"><span class="lab">Paare an der Börse</span><span class="val">${k.gesamt}</span></div>
      <div class="rowx"><span class="lab">nach Ausschluss</span><span class="val">${k.nach_ausschluss}</span></div>
      <div class="rowx"><span class="lab">liquide genug</span><span class="val">${k.nach_liquiditaet}</span></div>
      <div class="rowx"><span class="lab">gescannt</span><span class="val">${k.genommen}</span></div>
      ${k.verworfen?Object.entries(k.verworfen).filter(([,v])=>v).map(([kk,v])=>
        `<div class="rowx"><span class="lab">verworfen: ${esc(kk)}</span><span class="val">${v}</span></div>`).join(''):''}
    </div>
    <div class="note-box"><span class="nt">Warum gefiltert wird</span>
      <p>Ein Altcoin darf nicht deshalb attraktiv aussehen, weil er extrem schwankt — er
      muss auch handelbar sein. Ohne Umsatz bekommt man den Einstieg nicht zum
      angezeigten Kurs und den Ausstieg gar nicht. Stablecoins, Hebel-Token und
      verpackte Doppel (WBTC …) fliegen raus, weil sie keine eigene Wette sind.</p></div>`;
  }
  const M = S?.makro;
  if (M){
    h += `<h2>Makro</h2><div class="karte">
      <div class="rowx"><span class="lab">Lage</span><span class="val">${esc((REGIME_TEXT||{})[M.regime]||M.regime)} (${M.punkte>=0?'+':''}${M.punkte.toFixed(2)})</span></div>
      ${(M.werte||[]).map(w=>`<div class="rowx"><span class="lab">${esc(w.name)}</span>
        <span class="val">${num(w.wert, w.wert>1000?0:2)}${w.aenderung_20t_pct!=null?` · 20T ${pct(w.aenderung_20t_pct,1)}`:''}</span></div>`).join('')}
      <div class="rowx"><span class="lab">Termine im Kalender</span><span class="val">${(M.termine||[]).length}</span></div>
    </div>
    <div class="note-box"><span class="nt">Warum diese vier Größen</span>
      <p><strong>VIX</strong> — der Preis der Absicherung. Steigt er schnell, wird alles
      Riskante gleichzeitig verkauft, und Einzelanalysen zählen weniger als die Richtung
      des Gesamtmarkts.<br>
      <strong>Dollar-Index</strong> — ein starker Dollar zieht Gold und Krypto Liquidität ab.<br>
      <strong>10-Jahres-Rendite</strong> — steigende Renditen sind Gegenwind für
      Wachstumswerte und für Gold, das keine Zinsen zahlt.<br>
      <strong>S&P 500</strong> — die Referenz für relative Stärke.</p>
      <p>Das sind <em>Zusammenhänge, keine Gesetze</em>. Sie halten oft und brechen
      manchmal. Die Bewertung ist gesetzt, nicht an historischen Ergebnissen optimiert.</p></div>`;
  }
  h += `<h2>Live-Kurse</h2><div class="karte">
    <div class="rowx"><span class="lab">Verbindung</span><span class="val">${WS_OK?'offen':'getrennt'}</span></div>
    <div class="rowx"><span class="lab">Quelle</span><span class="val">Börsen-Websocket</span></div>
    <div class="rowx"><span class="lab">Werte mit Livekurs</span><span class="val">${L.size}</span></div>
  </div>
  <div class="note-box"><span class="nt">Was hier live ist und was nicht</span>
    <p><strong>Live:</strong> die Kurse für Krypto und Gold — direkt von der Börse an
    deinen Browser, ohne Umweg.</p>
    <p><strong>Nicht live:</strong> die eingezeichnete Analyse. Sie stammt aus dem
    stündlichen Scan und trägt dessen Zeitstempel. Für Aktien gibt es kein frei
    zugängliches Live-Feed; dort ist auch der Kurs der Stand des Scans.</p>
    <p>Diese Trennung ist Absicht. Eine Seite, die alles gleich aussehen lässt, verleitet
    dazu, einen Stand von vor einer Stunde für den aktuellen Kurs zu halten.</p></div>`;
  h += `<h2>Was noch fehlt</h2><div class="karte">
    <div class="rowx"><span class="lab">Nachführung laufender Trades in Echtzeit</span><span class="val">offen</span></div>
    <div class="rowx"><span class="lab">Fundamentaldaten bei Aktien</span><span class="val">offen</span></div>
    <div class="rowx"><span class="lab">Dauerlauf-Daemon auf einem Server</span><span class="val">offen</span></div>
  </div>`;
  $('system').innerHTML = h;
}

/* ============================================================ START */
function start(){
  $('built').textContent = 'Gebaut: ' + (D.built_at || '—') +
    ' · Setup ' + (D.setup||'') + ' · ' + (D.params_version||'');
  zeichnePlan(); zeichneAlarme(); zeichnePortfolio(); zeichneSystem(); zeichneBilanz();
  zeichneNews();
  $('chartansicht').innerHTML = `<p class="leer">Scan wird geladen …</p>`;
  $('analyse').innerHTML = `<p class="leer">Scan wird geladen …</p>`;
  depotAusLink();
  const t = parseInt((location.hash||'').replace('#',''), 10);
  zeigeTab(isFinite(t) && t>=0 && t<TABS.length ? t : 0);
  ladeScan();
  // Der Scan wird alle zehn Minuten neu gebaut. Alle fuenf Minuten nachsehen kostet
  // nichts und erspart das manuelle Neuladen.
  setInterval(()=>{ ladeScan(); }, 5*60*1000);

  // Den Service Worker bei jedem Start registrieren, nicht erst beim Anmelden. Ein
  // Geraet, das sich frueher einmal angemeldet hat, braucht ihn beim naechsten
  // Oeffnen sofort wieder — sonst kommt der Push an, und niemand nimmt ihn entgegen.
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
umlauteBeobachten();
start();
</script>
