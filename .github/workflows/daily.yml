# Die Marktueberwachung — kostenlos, ohne Server, ohne dass der Mac an sein muss.
#
# WAS "24/7" HIER HEISST, WOERTLICH: kein dauerlaufender Prozess, sondern ein Zeitplan.
# Stuendlich (:25) ein voller Marktscan ueber Krypto, Aktien und Gold mit Alarm bei
# Aenderung; einmal taeglich (23:10) zusaetzlich die Forward-Journalzeile und der
# Tagesplan. Der echte Dauerlauf-Daemon (scripts/run_live_daemon.py) existiert und ist
# fertig verdrahtet, er braucht aber eine Maschine, die durchlaeuft. Solange es die nicht
# gibt, ist der Stundentakt die ehrliche Antwort — und nicht die Behauptung, es liefe
# etwas rund um die Uhr.
#
# Warum GitHub Actions und nicht Oracle Cloud: Oracle verlangt eine Kreditkarten-
# Verifizierung und lehnt viele Anmeldungen ohne Begruendung ab. Actions braucht nur ein
# GitHub-Konto. Fuer oeffentliche Repos ist es unbegrenzt gratis; dieser Job braucht
# etwa zwei Minuten am Tag.
#
# Was hier laeuft, ist genau dasselbe wie lokal:
#   1. tsmom_forward.py --source api   holt die Historie direkt bei Binance/Yahoo
#      (das Repo mit den 271 MB Marktdaten liegt NICHT auf GitHub und wird nicht gebraucht)
#   2. daily_report.py --send          baut den Euro-Plan und schickt ihn per Telegram
#   3. build_site.py                   erzeugt die Web-App aus derselben Rechnung
#   4. der Commit sichert die Journalzeile — das ist die Forward-Datenspur, das
#      wertvollste Ergebnis des ganzen Projekts. Sie darf nicht nur auf einem Mac liegen.
#   5. deploy-pages veroeffentlicht die Seite unter der festen Pages-Adresse
#
# Einrichten: Settings -> Secrets and variables -> Actions -> zwei Secrets anlegen:
# TELEGRAM_BOT_TOKEN und TELEGRAM_CHAT_ID. Und Settings -> Pages -> Source: GitHub Actions.
# Ohne die Secrets laeuft der Job trotzdem: er schreibt die Zeile, baut die Seite und
# meldet nur, dass er nicht senden konnte.

name: Marktueberwachung

on:
  schedule:
    # 23:10 UTC — der Tageslauf: Forward-Zeile + Tagesplan. Nach US-Boersenschluss
    # (22:00 UTC), vor dem Tageswechsel. GitHub-Cron laeuft in UTC und kann sich bei Last
    # um einige Minuten verspaeten; egal, die Regel arbeitet auf Tagesschlusskursen.
    - cron: "10 23 * * *"
    # :25 und :55 — der VOLLE Scan inklusive Aktien, zweimal je Stunde.
    - cron: "55 */3 * * *"
    # Alle zehn Minuten der KRYPTO-Scan (rund 15 Sekunden) mit anschliessender
    # Veroeffentlichung. Aktien bleiben beim Halbstundentakt: sie bewegen sich nur zu
    # Boersenzeiten, und der Yahoo-Abruf ist der langsame Teil.
    #
    # Warum nicht alle fuenf Minuten, wie Ozan gefragt hat: GitHub Pages laesst rund
    # zehn Veroeffentlichungen je Stunde zu. Sechs Krypto-Scans plus zwei volle Laeufe
    # bleiben sicher darunter; alle fuenf Minuten zu veroeffentlichen ginge sich nicht aus.
    # 04.10.: GitHub hat diese Zeitplaene ab 03.10. mittags fast komplett verschluckt
    # (statt ~12 Laeufen je Stunde nur noch alle paar Stunden einer; Scan 3,5 Std. alt).
    # Den Takt gibt seitdem .github/workflows/taktgeber.yml per workflow_dispatch vor —
    # Dispatch-Ereignisse fallen nicht weg. Die Zehn- und Fuenf-Minuten-Plaene sind
    # deshalb hier raus; sie wuerden jetzt nur doppelt laufen und wartende volle Scans
    # aus der Warteschlange verdraengen. Der volle Scan oben bleibt alle drei Stunden
    # als Notnagel, falls der Taktgeber selbst steht.
    # Dazwischen, alle fuenf Minuten, der leichte Waechter: KEIN Scan, keine
    # Veroeffentlichung, nur die Kurse der beobachteten Marken. Das ist der Teil, der
    # meldet, wenn ein Einstieg, ein Ziel oder ein Stop tatsaechlich getroffen wurde.
  workflow_dispatch:
    inputs:
      modus:
        description: "voll = mit Aktien, krypto = nur Krypto/Gold, waechter = nur Marken pruefen"
        type: choice
        options: [voll, krypto, waechter]
        default: voll
      telegram_ping:
        description: "Testnachricht an Telegram schicken"
        type: boolean
        default: false
  push:
    branches: [main]      # nach einer Aenderung sofort neu bauen, statt bis 23:10 zu warten
    paths-ignore:
      # Der Job committet die Journalzeile selbst. Commits mit dem GITHUB_TOKEN loesen zwar
      # ohnehin keinen neuen Lauf aus (GitHub verhindert genau diese Schleife), aber hier
      # steht es nochmal ausdruecklich — eine Endlosschleife waere teuer und peinlich.
      - "data/repository_real/live/**"

# KEINE Sperre auf Workflow-Ebene mehr — die hat am 12.09. den ganzen Scan lahmgelegt.
#
# Vorher lagen Scan und Veroeffentlichung in EINER Gruppe (`taeglicher-tagesplan`) mit
# `cancel-in-progress: false`. Die Veroeffentlichung haengt an der Umgebung `github-pages`,
# und eine Umgebung kann beliebig lange auf ihre Freigabe warten — diese Wartezeit zaehlt
# nicht gegen `timeout-minutes`. Ein einziger haengender Deploy hat damit jeden folgenden
# Lauf in die Warteschlange gestellt: 17 Stunden lang kein Scan, keine Alarme, und in der
# App stand weiter eine Analyse von gestern Abend, als waere sie aktuell.
#
# Jetzt hat jeder Job seine eigene Sperre:
#   * Scan: weiter ohne Abbruch — ein laufender Schreibvorgang darf nicht zerrissen werden.
#     Der Job hat ein hartes Zeitlimit, kann also nicht ewig stehen.
#   * Veroeffentlichung: mit Abbruch. Eine Seite neu zu bauen ist wiederholbar; die
#     neuere Fassung ist immer die richtige. Dazu ein eigenes Zeitlimit.

# Welche Art Lauf das ist. Frueher hing alles an github.event.schedule; seit dem
# Taktgeber (04.10.) kommt die Art meist als Eingabe ``modus``.
env:
  LAUF: ${{ github.event.schedule == '*/5 * * * *' && 'waechter' || github.event.schedule == '2,12,22,32,42,52 * * * *' && 'krypto' || inputs.modus || 'voll' }}

permissions:
  contents: write   # Journalzeile zurueckschreiben
  pages: write      # Seite veroeffentlichen
  id-token: write   # von deploy-pages verlangt
  issues: write     # Alarm als Issue — der Weg, der ohne eingerichtete Secrets ankommt

jobs:
  tagesplan:
    runs-on: ubuntu-24.04  # fest: ubuntu-latest wechselt ab 19.10.2026 auf Ubuntu 26
    timeout-minutes: 36
    concurrency:
      group: scan
      cancel-in-progress: false   # ein laufender Schreibvorgang wird nicht abgebrochen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          # Web Push braucht eine eigene Bibliothek. Sie ist bewusst KEINE
          # Projekt-Abhaengigkeit: sie wird nur hier gebraucht, nicht im Paket.
          pip install pywebpush

      # continue-on-error, weil ein Datenausfall die FOLGENDEN Schritte nicht verhindern
      # darf: die Warnung soll trotzdem aufs Handy und auf die Seite. Der Lauf wird am
      # Ende gezielt rot gemacht, damit der Ausfall sichtbar bleibt.
      - name: Forward-Zeile aufzeichnen
        id: forward
        if: env.LAUF == 'voll'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/tsmom_forward.py --source api

      # Trend-Swing (docs/TREND-SWING-STUDIE-2026-09.md) ist verworfen — wird aber vorwaerts
      # mitgeschrieben, damit spaeter mit sauberen Daten neu geprueft werden kann. Erzeugt
      # KEINE Alarme. Ein Ausfall hier darf nichts anderes aufhalten.
      - name: Trend-Swing vorwaerts aufzeichnen
        if: env.LAUF == 'voll'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/trend_swing_forward.py

      - name: Tagesplan schicken
        id: report
        if: env.LAUF == 'voll'
        continue-on-error: true
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
          # Kauf/Verkauf im Plan geht auch als Issue raus (Mail + GitHub-App) — bis 01.10.
          # ging der Plan nur an Telegram, das nicht eingerichtet ist.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Sonntags zusaetzlich ein Wochenstand, auch wenn sich nichts geaendert hat.
        # Sonst kann es Wochen still bleiben, und dann weiss man nicht, ob nichts passiert
        # ist oder ob etwas kaputt ist.
        # 04.10.: seit dem Taktgeber laufen volle Scans wirklich zweimal je Stunde — und
        # der Wochenstand ging jede halbe Stunde raus. Jetzt nur, wenn in den letzten
        # sechs Tagen noch keiner verschickt wurde (Protokoll: alerts.jsonl).
        run: |
          schon=$(python - <<'PY'
          import json, datetime as dt, pathlib
          f = pathlib.Path("data/repository_real/live/alerts.jsonl")
          grenze = dt.datetime.now(dt.UTC) - dt.timedelta(days=6)
          n = 0
          for z in (f.read_text(encoding="utf-8").splitlines() if f.exists() else []):
              try:
                  e = json.loads(z)
                  if str(e.get("title", "")).startswith("Wochenstand") and dt.datetime.fromisoformat(e["ts"]) > grenze:
                      n += 1
              except Exception:
                  pass
          print(n)
          PY
          )
          if [ "$(date -u +%u)" = "7" ] && [ "$schon" = "0" ]; then
            python scripts/daily_report.py --send --weekly
          else
            python scripts/daily_report.py --send
          fi

      # Der Gesamtmarkt-Scan. continue-on-error, weil eine stumme Kursquelle die Seite
      # nicht verhindern darf — build_site zeigt dann keine Rangliste statt einer alten.
      # Sagt bei JEDEM vollen Lauf, ob der Telegram-Kanal steht. "Der Bot funktioniert
      # nicht" hat drei moegliche Ursachen (Schluessel fehlen, Token falsch, Chat-ID
      # falsch oder Bot nie angeschrieben) — ohne diese Zeile raet man.
      - name: Telegram pruefen
        id: tg
        if: env.LAUF == 'voll'
        continue-on-error: true
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
        run: |
          if [ "${{ inputs.telegram_ping }}" = "true" ]; then
            python scripts/telegram_check.py --ping
          else
            python scripts/telegram_check.py
          fi

      # Makrolage und Wirtschaftskalender. Bewusst VOR dem Scan: die Hinweise gehen als
      # Warnung in jedes Setup ein. Faellt der Schritt aus, laeuft der Scan trotzdem —
      # nur ohne die Makro-Hinweise.
      - name: Makrolage holen
        id: makro
        if: env.LAUF == 'voll'
        continue-on-error: true
        timeout-minutes: 4
        env:
          PYTHONPATH: src
        run: python scripts/fetch_macro.py --out web/macro.json

      # Aktien-Hintergrund: Quartalszahlen-Termine, Sektor, Analystenkonsens (Nasdaq).
      # Holt nur, wenn die veroeffentlichte Datei aelter als 20 Stunden ist — sonst wird
      # sie uebernommen. Faellt Nasdaq aus, laeuft der Scan ohne Termine weiter.
      - name: Aktien-Info holen
        id: aktien_info
        if: env.LAUF == 'voll'
        continue-on-error: true
        timeout-minutes: 6
        env:
          PYTHONPATH: src
        run: |
          python scripts/fetch_aktien_info.py --out web/aktien_info.json \
            --vorlauf-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      # Der Gesamtmarkt-Scan: dynamisches Krypto-Universum von der Boerse, Aktien,
      # Gold. Schreibt die Rangliste UND je Wert eine Detaildatei mit Zeichnung,
      # MTF-Tabelle, Mustern und Kommentar.
      - name: Markt scannen
        id: scan
        if: env.LAUF != 'waechter'
        continue-on-error: true
        # 18 -> 22: seit dem 16.09. holt der Aktienscan zusaetzlich die Wochenkerzen,
        # also eine Anfrage je Aktie mehr. Bei 101 Aktien und dem Ratenlimit des
        # Anbieters sind das rund eine Minute; der Rest ist Luft, damit ein langsamer
        # Tag beim Anbieter nicht den ganzen Scan abschneidet.
        timeout-minutes: 22
        env:
          PYTHONPATH: src
        # 26.09.: ALLE liquiden Coins statt der 110 umsatzstaerksten (--krypto 200 ist ein
        # Deckel, keine Zielgroesse — bei Kraken sind es derzeit rund 160).
        #
        # Und --vorlauf-url: der Zehn-Minuten-Lauf sollte die Aktien schon immer aus dem
        # letzten Scan uebernehmen. Der lag aber nur in web/, und web/scan.json ist nicht
        # im Repo — also scannte jeder dieser Laeufe stillschweigend ALLES neu, Aktien mit
        # dem Standarddeckel 40 statt 101. Jetzt holt er den letzten veroeffentlichten
        # Scan von der Seite. Ist die nicht erreichbar oder aelter als drei Stunden, wird
        # wie bisher alles gescannt.
        run: |
          if [ "$LAUF" = "krypto" ]; then
            # --aktien 120 auch hier: greift nur, wenn die Uebernahme scheitert und doch
            # alles gescannt wird — dann wenigstens mit der ganzen Aktienliste.
            python scripts/build_scan_data.py --out web --krypto 200 --aktien 120 --detail 60 \
              --nur krypto,gold --vorlauf-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          else
            # --aktien muss mindestens so gross sein wie die Liste in build_scan_data.py,
            # sonst faellt hinten etwas ab, ohne dass es jemand merkt. Der Lauf meldet
            # das inzwischen als ::warning::.
            python scripts/build_scan_data.py --out web --krypto 200 --aktien 120 --detail 60
          fi

      # Marktweite Aenderungen: weggebrochenes Setup, neue Nummer 1, ein Chart der
      # anzieht. Neue Setups meldet dieser Schritt bewusst NICHT — das macht der
      # Waechter darunter mit dem vollen Plan. Eine stumme Anlageklasse erzeugt
      # bewusst KEINEN Wegbruch-Alarm.
      - name: Alarm bei Aenderung
        id: alarm
        if: env.LAUF != 'waechter'
        continue-on-error: true
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
        # --min critical: die Scan-Meldungen ("Note geaendert", "neu im Ranking") sind
        # Lagebericht, keine Handlungsaufforderung. Sie stehen in der App und im
        # Protokoll; aufs Telefon geht von hier aus nichts mehr. Ozans Einwand war
        # eindeutig: nur Alarme, bei denen er einsteigen kann.
        run: python scripts/scan_alert.py --scan web/scan.json --send --ohne-setups --min critical

      # Nach dem Scan: neue Setups auf die Wachliste, ueberholte verwerfen, und pruefen,
      # ob eine Marke getroffen wurde.
      - name: Wachliste fuehren
        id: wache_voll
        if: env.LAUF != 'waechter'
        continue-on-error: true
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
          # Der Auffangkanal. GITHUB_TOKEN wird je Lauf erzeugt und muss nirgends
          # hinterlegt werden — damit kommt auch ohne eingerichtete Secrets etwas an.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/watch_levels.py --send --vollstaendig

      # Ozans EIGENE Positionen. Bisher lief diese Pruefung ausschliesslich im Browser —
      # war die App zu, meldete sich niemand, auch wenn ein Stop fiel. Das Depot kommt
      # als Geheimnis DEPOT_CODE herein (derselbe Text wie im Sync-Reiter der App);
      # ohne das Geheimnis bleibt der Schritt einfach still.
      #
      # Seit 27.09. setzt und zieht der Waechter die Stops selbst (Invalidierung der
      # Analyse und Halte-Stop), statt nur die Stops zu kennen, die im Depot-Text stehen.
      # Gemeldet wird: Stop gerissen, Ziel, Knock-out nah — sofort; Stop gesetzt oder
      # nachgezogen — gebuendelt und erst ab 2 % Schritt. Keine Kursbewegung, kein
      # Notenwechsel, kein "Scan erfolgreich". Der Stand liegt VERSIEGELT im Repo
      # (depot_stand.siegel); oeffentlich (web/waechter.json) stehen nur Zaehler.
      - name: Depot bewachen
        id: depot
        if: env.LAUF != 'waechter'
        continue-on-error: true
        env:
          PYTHONPATH: src
          DEPOT_CODE: ${{ secrets.DEPOT_CODE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/depot_wache.py --scan web/scan.json --live --send

      # Die eigene Bilanz. Laeuft nach der Wachliste und schreibt sie in die App —
      # ein Scanner, der nie nachrechnet, ob die alten Chancen aufgegangen sind,
      # erzeugt Zuversicht statt Wissen.
      - name: Bilanz rechnen
        if: env.LAUF != 'waechter'
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python scripts/build_performance.py --out web/performance.json

      # Der leichte Lauf: nur Kurse der beobachteten Werte, kein Scan, keine
      # Veroeffentlichung. Dauert Sekunden und darf deshalb alle fuenf Minuten laufen.
      - name: Marken pruefen
        id: wache_licht
        if: env.LAUF == 'waechter'
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
          # Der Auffangkanal. GITHUB_TOKEN wird je Lauf erzeugt und muss nirgends
          # hinterlegt werden — damit kommt auch ohne eingerichtete Secrets etwas an.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/watch_levels.py --send

      # Ozans eigene Positionen auch im leichten Lauf — alle fuenf Minuten mit AKTUELLEN
      # Kursen (Kraken-Ticker, Aktien waehrend der Boersenzeit ueber Yahoo), nicht nur
      # beim Scan. Stop, Ziel, Knock-out melden sich damit spaetestens nach Minuten.
      - name: Depot bewachen (leicht)
        id: depot_licht
        if: env.LAUF == 'waechter'
        continue-on-error: true
        env:
          PYTHONPATH: src
          DEPOT_CODE: ${{ secrets.DEPOT_CODE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_ABOS: ${{ secrets.PUSH_ABOS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/depot_wache.py --live --send --oeffentlich /tmp/waechter.json \
            --seite "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Web-App bauen
        if: env.LAUF != 'waechter'
        env:
          PYTHONPATH: src
        run: python scripts/build_site.py --out _site

      - name: Journal sichern
        if: env.LAUF != 'waechter' || steps.wache_licht.outputs.geaendert == '1' || steps.depot_licht.outputs.geaendert == '1'
        run: |
          git config user.name  "trading-agent[bot]"
          git config user.email "trading-agent@users.noreply.github.com"
          # Der Alarm-Stand MUSS mit. Ohne ihn faengt jeder Lauf bei null an und meldet
          # alles neu — genau der Spam, den wir nicht wollen.
          # EINZELN hinzufuegen, nicht in einem Aufruf.
          #
          # Am 16.09. kam depot_alarme.json in diese Liste. Die Datei entsteht aber erst,
          # wenn der Depot-Waechter das erste Mal etwas zu melden hat. Bis dahin brach
          # `git add` mit "pathspec ... did not match any files" ab — und zwar KOMPLETT:
          # keine der anderen Dateien wurde vorgemerkt. Danach meldete der Schritt brav
          # "kein neuer Stand" und der Lauf blieb gruen.
          #
          # Die Folge war der schlimmste denkbare stille Ausfall: die Wachliste wurde
          # sechzehn Stunden lang nicht mehr fortgeschrieben. Jeder Lauf startete wieder
          # vom Stand des Vorabends, nahm nichts Neues auf und meldete nichts. Von aussen
          # sah alles gruen aus.
          for f in data/repository_real/live/tsmom_forward.jsonl \
                   data/repository_real/live/tsmom_forward_corrections.jsonl \
                   data/repository_real/live/scan_alert_state.json \
                   data/repository_real/live/watchlist.json \
                   data/repository_real/live/wachen_archiv.jsonl \
                   data/repository_real/live/depot_alarme.json \
                   data/repository_real/live/depot_stand.siegel \
                   data/repository_real/live/alerts.jsonl \
                   data/repository_real/live/trend_swing_forward.json; do
            if [ -f "$f" ]; then git add -f "$f"; else echo "  (noch nicht vorhanden: $f)"; fi
          done
          if git diff --cached --quiet; then
            echo "kein neuer Stand — nichts zu sichern"
            exit 0
          fi
          git commit -m "lauf: Stand $(date -u +%Y-%m-%dT%H:%MZ)"
          # Zwei Laeufe koennen sich ueberschneiden (Zeitplan trifft auf einen Push).
          # Dann ist der lokale Stand hinterher und ein blosses push scheitert. Rebase
          # holt den fremden Commit davor; scheitert auch das, ist die Seite trotzdem
          # gebaut und der Plan verschickt — die Zeile kommt beim naechsten Lauf mit.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push abgelehnt (Versuch $i) — hole den aktuellen Stand"
            git pull --rebase --autostash || break
          done
          echo "::warning::Journalzeile konnte nicht gesichert werden — kommt beim naechsten Lauf mit"

      - uses: actions/upload-pages-artifact@v3
        if: env.LAUF != 'waechter'
        with:
          path: _site

      # Jetzt erst scheitern. Bis hierher sind Warnung und Seite draussen.
      - name: Ausfall melden
        if: >-
          steps.forward.outcome == 'failure' || steps.report.outcome == 'failure'
          || steps.scan.outcome == 'failure' || steps.alarm.outcome == 'failure'
          || steps.wache_voll.outcome == 'failure'
        run: |
          echo "::error::Der Lauf war unvollstaendig — siehe die Schritte oben."
          exit 1

  veroeffentlichen:
    needs: tagesplan
    if: github.event.schedule != '*/5 * * * *' && inputs.modus != 'waechter'
    runs-on: ubuntu-24.04  # fest: ubuntu-latest wechselt ab 19.10.2026 auf Ubuntu 26
    timeout-minutes: 10
    concurrency:
      group: pages
      # NICHT abbrechen — das war der zweite Fehler an diesem Tag.
      #
      # Erst dachte ich: die neuere Seite ist immer die richtige, also darf ein neuer
      # Lauf den alten Deploy abschiessen. In der Praxis startet hier alle paar Minuten
      # ein Lauf. Jeder hat den Deploy des vorigen abgebrochen und wurde selbst vom
      # naechsten abgebrochen — veroeffentlicht wurde gar nichts mehr. Der Scan lief,
      # die Daten waren frisch, und die Seite blieb trotzdem stehen.
      #
      # Warteschlange ist hier richtig. Gegen das Haengen hilft nicht der Abbruch,
      # sondern die Zeitgrenze oben und die getrennte Sperre: der Scan liegt in einer
      # eigenen Gruppe und kann von einem klemmenden Deploy nicht mehr aufgehalten
      # werden.
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        # Pages antwortet ab und zu mit 502 („Failed to create deployment", zuletzt
        # 30.09. 20:21 UTC). Dann einmal nach einer Pause nochmal statt rot und eine
        # Seite, die bis zum naechsten Lauf stehen bleibt.
        continue-on-error: true
        with:
          # Nicht ewig auf die Pages-Umgebung warten. Ohne Grenze steht der Job in
          # „Waiting", das Zeitlimit oben greift dort nicht, und der naechste Lauf
          # stellt sich dahinter an. Lieber ein fehlgeschlagener Deploy als eine
          # Warteschlange, die den Scan mitnimmt.
          timeout: 300000
          error_count: 5
      - name: Kurz warten vor dem zweiten Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: nochmal
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
          error_count: 5
