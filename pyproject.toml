[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Autonomes Multi-Asset-AI-Trading-System (Development / Research / Paper / Demo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ozan" }]

# Laufzeit-Abhängigkeiten – bewusst minimal. Alle liefern vorgefertigte Wheels
# (kein Compiler / keine Xcode-Tools nötig).
dependencies = [
  "pydantic>=2.7",
  "pyarrow>=16",
  "pyyaml>=6",
  "tzdata>=2024.1",
  "httpx>=0.27",        # REST clients (Kraken Pro, Bybit v5 public, FRED, ...)
  "websockets>=13",     # live WS market data (Kraken, Bybit)
]
# NOTE: MetaTrader5 (Pepperstone gold) is Windows-only and needs the MT5 terminal + account.
# It is NOT a hard dependency; the adapter imports it lazily. Install separately on Windows:
#   pip install MetaTrader5

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",        # mock httpx transport in tests (no network)
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: end-to-end tests across multiple components",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLE", "RUF"]
# RUF001/002/003: "ambiguous unicode" – wir schreiben bewusst Deutsch (Umlaute, Gedankenstrich).
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "B017", "SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "respx.*", "MetaTrader5.*"]
ignore_missing_imports = true
